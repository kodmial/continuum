# A consumer that has adopted the PR-Agent review provider.
#
# This is the shape a repository needs in order to stop implementing review and
# start configuring it. It holds two things and nothing else:
#
#   - `.continuum.yml`, which names the provider and the repository variables
#     and secrets that carry the endpoint, the model, and the credential;
#   - one workflow file, because a reusable workflow cannot subscribe to this
#     repository's events and GitHub's version selector cannot be an
#     expression. That file is a dispatch entry, not an implementation: it
#     declares the queue's wake-up, hands over the repository's own variable
#     and secret names, and calls Continuum.
#
# What is deliberately absent is the point: no provider image, no model
# routing, no diff fetching, no finding parsing, no verdict, no status. The
# provider version, the engine, and the review contract all come from the one
# Continuum release pinned below, so publishing a new one never changes this
# repository and upgrading is one deliberate edit to one line.
#
# All values are *names* of repository variables and secrets, never the
# endpoint, model, or credential itself.

version: 1

review:
  provider: pr-agent

  block_merge: true

  status_context: continuum/review

  pr_agent:
    api_base_var: PR_AGENT_API_BASE
    api_key_secret: PR_AGENT_API_KEY
    model_var: PR_AGENT_MODEL
    max_tokens_var: PR_AGENT_MAX_TOKENS
    bot_login: github-actions[bot]

  queue:
    ready_label: review-ready

    # The provider is driven by a workflow dispatch rather than a comment on
    # the pull request, so the review request stays in Actions where the gate
    # normalizes the result.
    dispatch_workflow: pr-agent.yml
    cooldown_minutes: 60
    max_candidates: 20
