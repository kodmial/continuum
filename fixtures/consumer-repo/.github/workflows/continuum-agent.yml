name: Continuum agent

# The consumer's own agent workflow. Continuum dispatches into this file -- the
# scheduler for a new task, the repair controller for a conflict or a failed
# gate, and the review controller for the repair leg of the review loop -- so it
# exists as a separate file from `continuum.yml`: it is a dispatch target rather
# than an event surface, and dispatch needs a `workflow_call` trigger of its own.
#
# It carries the same single Continuum pin as every other file in this
# repository. That is the point of the pin: the surface this dispatches into and
# the surfaces that dispatch it are one release, and an upgrade changes both in
# the same deliberate edit.
#
# `runner` and `swift_version` are the whole of what a consumer states about
# where its agent runs. They are inputs of this file, not of Continuum: a
# repository that compiles and tests a particular platform sets them once, here,
# and no platform, language, or vendor name appears anywhere in the shared
# controller. Leaving them unset gives the shared default, which is a Linux
# runner with no language toolchain.
#
# `review-fix` is one of the four dispatch modes below, alongside `issue`,
# `resolve-conflict`, and `ci-fix`. It is generic: which reviewer produced the
# findings never reaches this file.

on:
  # The controllers dispatch into this workflow, so it has to be dispatchable
  # with exactly the inputs they send and nothing else.
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue_number:
        type: string
        required: false
        default: ""
      pr_number:
        type: string
        required: false
        default: ""
      head_ref:
        type: string
        required: false
        default: ""
      run_id:
        type: string
        required: false
        default: ""
      rungs_ruled_out:
        type: string
        required: false
        default: ""
      runner:
        type: string
        required: false
        default: ubuntu-latest
      swift_version:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: opencode/big-pickle

  workflow_dispatch:
    inputs:
      mode:
        description: "issue, resolve-conflict, ci-fix, or review-fix"
        required: true
        type: string
      issue_number:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      head_ref:
        required: false
        type: string
      run_id:
        required: false
        type: string
      rungs_ruled_out:
        required: false
        type: string
      runner:
        required: false
        type: string
      swift_version:
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agent:
    uses: kodmial/continuum/.github/workflows/consumer.yml@v0.1.0
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    with:
      surface: agent
      mode: ${{ inputs.mode }}
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ inputs.head_ref }}
      run_id: ${{ inputs.run_id }}
      rungs_ruled_out: ${{ inputs.rungs_ruled_out }}
      runner: ${{ inputs.runner }}
      swift_version: ${{ inputs.swift_version }}
      model: ${{ inputs.model }}
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}