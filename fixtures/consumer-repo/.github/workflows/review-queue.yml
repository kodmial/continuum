# Thin fixture entry point: declare the queue's event surface in a consumer
# repository and delegate every decision to the shared Continuum reconciler.
#
# There is no queue logic here. A reusable workflow cannot subscribe to the
# consumer's own pull request, review, comment, CI, or workflow events, so the
# consumer declares them and the shared reconciler recomputes the whole queue
# from GitHub state. `actions: write` is required because dispatching a
# provider gate run needs it; the reconciler requests it too.
#
# The event set below is deliberately identical to the one the shared
# reconciler dogfoods, and `tests/test_queue_workflows.py` fails if the two ever
# drift apart or stop covering the eligibility transitions in
# `continuum.review.queue.PULL_REQUEST_ACTIONS`.

name: Review queue

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
      - labeled
      - unlabeled
      - edited
      - auto_merge_enabled
      - auto_merge_disabled
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled, unlabeled, reopened, closed, edited]
  status: {}
  check_run:
    types: [completed, rerequested, created]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: continuum-review-queue
  cancel-in-progress: false

jobs:
  reconcile:
    uses: kodmial/continuum/.github/workflows/review-queue.yml@39ca6dc798f2201390c8fdef0395157f588657ec
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: read
    with:
      config_path: .continuum.yml
      wait_minutes: 45
    secrets:
      continuum_token: ${{ secrets.GITHUB_TOKEN }}
