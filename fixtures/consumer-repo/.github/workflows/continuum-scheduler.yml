name: Continuum scheduler

# Thin fixture entry point: declare the scheduler's wake-up surface in a
# consumer repository and delegate the dependency-aware dispatch to it.
#
# The WIP limit, lease duration and retry budget are repository scheduling
# policy, not v0.1 configuration: they are declared here, on inputs of the
# shared controller, because that is where a consumer states them once and
# Continuum reads them rather than owning a second copy.
#
# Continuum never creates the consumer's CI. Each dispatched run lands in the
# consumer's own repository, and its tests are the consumer's own workflows.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  schedule:
    uses: kodmial/continuum/.github/workflows/consumer-scheduler.yml@39ca6dc798f2201390c8fdef0395157f588657ec
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    with:
      opencode_workflow: continuum-opencode.yml
      wip_limit: 2
      lease_minutes: 45
      max_attempts: 3
