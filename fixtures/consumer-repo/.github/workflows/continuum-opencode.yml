name: Continuum agent

# Thin fixture entry point: the consumer-owned agent workflow.
#
# This is the workflow Continuum dispatches into -- the scheduler for a new task,
# the repair controller for a conflict or a failed gate, and the review
# controller for the repair leg of the review loop. It exists here so a consumer
# owns the choice of where its agent runs.
#
# `runner` and `swift_version` are the whole of that choice. They are inputs of
# this file, not of Continuum: a repository that compiles and tests a particular
# platform sets them once, in its own copy, and no platform, language, or vendor
# name appears anywhere in the shared controller. Leaving them unset gives the
# shared default, which is a Linux runner with no language toolchain.
#
# `review-fix` is one of the four dispatch modes below, alongside `issue`,
# `resolve-conflict`, and `ci-fix`. It is generic: which reviewer produced the
# findings never reaches this file.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue_number:
        type: string
        required: false
        default: ""
      pr_number:
        type: string
        required: false
        default: ""
      head_ref:
        type: string
        required: false
        default: ""
      run_id:
        type: string
        required: false
        default: ""
      rungs_ruled_out:
        type: string
        required: false
        default: ""
      runner:
        type: string
        required: false
        default: ubuntu-latest
      swift_version:
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: opencode/big-pickle

  # The controllers dispatch into this workflow, so it has to be dispatchable
  # with exactly the inputs they send and nothing else.
  workflow_dispatch:
    inputs:
      mode:
        description: "issue, resolve-conflict, ci-fix, or review-fix"
        required: true
        type: string
      issue_number:
        required: false
        type: string
      pr_number:
        required: false
        type: string
      head_ref:
        required: false
        type: string
      run_id:
        required: false
        type: string
      rungs_ruled_out:
        required: false
        type: string
      runner:
        required: false
        type: string
      swift_version:
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  agent:
    uses: kodmial/continuum/.github/workflows/consumer-opencode.yml@39ca6dc798f2201390c8fdef0395157f588657ec
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    with:
      mode: ${{ inputs.mode }}
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ inputs.head_ref }}
      run_id: ${{ inputs.run_id }}
      rungs_ruled_out: ${{ inputs.rungs_ruled_out }}
      runner: ${{ inputs.runner }}
      swift_version: ${{ inputs.swift_version }}
      model: ${{ inputs.model }}
