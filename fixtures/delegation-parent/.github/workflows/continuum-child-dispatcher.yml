name: Child dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows:
      - Child task
      - Child review
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - .continuum.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: continuum-child-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    uses: kodmial/continuum/.github/workflows/consumer-child-dispatcher.yml@main
    with:
      parent_role: ${{ vars.CONTINUUM_ROLE }}
      parent_children: ${{ vars.CONTINUUM_CHILDREN }}
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.CONTINUUM_CHILD_TOKEN }}
