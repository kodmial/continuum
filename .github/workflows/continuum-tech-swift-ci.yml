# Optional technology profile. Product policy belongs in the consumer.
name: Swift validation

on:
  workflow_call:
    inputs:
      runner:
        description: macOS runner label; empty uses CONTINUUM_SWIFT_RUNNER then macos-latest
        required: false
        type: string
        default: ''
      prepare_command:
        description: Optional consumer preparation hook
        required: false
        type: string
        default: ''
      build_command:
        description: Swift build hook; empty uses CONTINUUM_SWIFT_BUILD_COMMAND then swift build
        required: false
        type: string
        default: ''
      test_command:
        description: Swift test hook; empty uses CONTINUUM_SWIFT_TEST_COMMAND then swift test
        required: false
        type: string
        default: ''
      validation_command:
        description: Optional additional consumer validation hook
        required: false
        type: string
        default: ''
      package_command:
        description: Optional consumer packaging hook
        required: false
        type: string
        default: ''
      release_command:
        description: Optional consumer release hook
        required: false
        type: string
        default: ''
      artifact_paths:
        description: Newline-separated artifact paths
        required: false
        type: string
        default: ''
      artifact_name:
        description: Artifact bundle name
        required: false
        type: string
        default: ''
      pr_number:
        description: Optional pull request number for manual validation
        required: false
        type: string
        default: ''
      continuum_ref:
        description: Continuum revision supplying the validation contract
        required: false
        type: string
        default: main

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  validate:
    uses: ./.github/workflows/continuum-validation.yml
    secrets: inherit
    with:
      continuum_ref: ${{ inputs.continuum_ref }}
      runner: "${{ inputs.runner || vars.CONTINUUM_SWIFT_RUNNER || 'macos-latest' }}"
      auto_detect: 'false'
      prepare_command: "${{ inputs.prepare_command }}"
      build_command: "${{ inputs.build_command || vars.CONTINUUM_SWIFT_BUILD_COMMAND || 'swift build' }}"
      test_command: "${{ inputs.test_command || vars.CONTINUUM_SWIFT_TEST_COMMAND || 'swift test' }}"
      validation_command: "${{ inputs.validation_command }}"
      package_command: "${{ inputs.package_command }}"
      release_command: "${{ inputs.release_command }}"
      artifact_paths: "${{ inputs.artifact_paths }}"
      artifact_name: "${{ inputs.artifact_name }}"
      pr_number: "${{ inputs.pr_number }}"
