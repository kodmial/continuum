name: Retry unresolved CodeRabbit findings

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false

permissions: {}

jobs:
  retry-unresolved:
    if: >-
      (inputs.review_provider || vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'coderabbit' &&
      github.event.action == 'created' &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.comment.in_reply_to_id != null &&
      contains(github.event.comment.body, 'UNRESOLVED')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    # All UNRESOLVED events for one PR are serialized. The first run collects
    # every currently unresolved finding, so queued duplicate events become
    # no-ops once that batch has been repaired and sent back for verification.
    concurrency:
      group: coderabbit-unresolved-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Coalesce CodeRabbit replies
        run: sleep 5

      - name: Collect all unresolved findings
        id: context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # kodmial/continuum#259: read-only collection uses GITHUB_TOKEN so
          # the run is attributed to github-actions[bot] and never spends
          # TAP_PAT budget. Checkout/push below intentionally stay PAT-backed.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request.number;
            const opencodeVerificationPattern =
              /<!-- opencode-coderabbit-verification review=(\d+) finding=(\d+) head=([0-9a-f]{40}) -->/;
            const autoMergeVerificationPattern =
              /<!-- auto-merge-coderabbit-verification finding=(\d+) head=([0-9a-f]{40}) -->/;

            // Bounded newest-first scan (#254): batching only needs the
            // latest verification per finding and replies newer than it,
            // so ten newest-first pages bound the cost. The review-comment
            // endpoint lists oldest-first and ignores sort/direction, so
            // pages 1..N would scan only the oldest window and miss the
            // current-HEAD verification marker. Anchor at the newest end
            // via the pull-request review-comment total and walk the newest
            // ten pages instead, enforcing newest-first client-side.
            // Thread-parent misses outside the window fall back to the
            // immediate parent id via getRootId, and any stranded finding
            // is re-batched by its own UNRESOLVED event.
            const { data: prMeta } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            const totalReviewComments = Number(prMeta?.review_comments || 0);
            const lastReviewPage = Math.max(
              1,
              Math.ceil((Number.isFinite(totalReviewComments) ? totalReviewComments : 0) / 100) || 1
            );
            const firstReviewPage = Math.max(1, lastReviewPage - 9);
            const comments = [];
            for (let page = lastReviewPage; page >= firstReviewPage; page -= 1) {
              const { data } = await github.rest.pulls.listReviewComments({
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
                page,
              });
              if (!Array.isArray(data) || data.length === 0) continue;
              comments.push(...data);
            }

            const byId = new Map(comments.map((comment) => [comment.id, comment]));

            const getRootId = (comment) => {
              let current = comment;
              const seen = new Set();
              while (current?.in_reply_to_id != null) {
                if (seen.has(current.id)) {
                  return current.in_reply_to_id;
                }
                seen.add(current.id);
                const parent = byId.get(current.in_reply_to_id);
                if (!parent) {
                  return current.in_reply_to_id;
                }
                current = parent;
              }
              return current?.id ?? null;
            };

            // Both repair-owned and auto-merge-owned exact-HEAD verification
            // requests feed this same batcher. Auto-merge markers intentionally
            // carry no review id, so recover the ORIGINAL CodeRabbit review id
            // from the root finding (never from the verification reply's own
            // synthetic review id). If the bounded newest window omitted that
            // root, fetch exactly the one known finding id instead of widening
            // pagination.
            async function originalReviewIdForFinding(findingId) {
              let root = byId.get(findingId);
              if (!root) {
                const { data } = await github.rest.pulls.getReviewComment({
                  owner,
                  repo,
                  comment_id: findingId,
                });
                root = data;
                if (root?.id) byId.set(root.id, root);
              }
              const reviewId = Number(root?.pull_request_review_id);
              return Number.isInteger(reviewId) && reviewId > 0
                ? reviewId
                : null;
            }

            // Keep only the newest verification request for each original
            // finding. An older UNRESOLVED must never override a newer
            // verification request that is still awaiting CodeRabbit.
            const latestVerification = new Map();
            for (const comment of comments) {
              const body = comment.body ?? '';
              const opencodeMatch = body.match(opencodeVerificationPattern);
              const autoMergeMatch = body.match(autoMergeVerificationPattern);
              if (!opencodeMatch && !autoMergeMatch) continue;

              const findingId = Number(
                opencodeMatch ? opencodeMatch[2] : autoMergeMatch[1]
              );
              const verifiedHead =
                opencodeMatch ? opencodeMatch[3] : autoMergeMatch[2];
              if (getRootId(comment) !== findingId) continue;

              const reviewId = opencodeMatch
                ? Number(opencodeMatch[1])
                : await originalReviewIdForFinding(findingId);
              if (!Number.isInteger(reviewId) || reviewId <= 0) {
                core.warning(
                  `PR #${pullNumber}: could not recover original CodeRabbit review id for finding #${findingId}; skipping this finding for the current pass.`
                );
                continue;
              }

              const previous = latestVerification.get(findingId);
              if (!previous || comment.id > previous.comment.id) {
                latestVerification.set(findingId, {
                  comment,
                  reviewId,
                  findingId,
                  verifiedHead,
                });
              }
            }

            const active = [];
            for (const verification of latestVerification.values()) {
              const replies = comments
                .filter(
                  (comment) =>
                    comment.user?.login === 'coderabbitai[bot]' &&
                    getRootId(comment) === verification.findingId &&
                    comment.id > verification.comment.id &&
                    /\b(?:RESOLVED|UNRESOLVED)\b/i.test(comment.body ?? '')
                )
                .sort((a, b) => b.id - a.id);

              const latestReply = replies[0];
              if (!latestReply || !/\bUNRESOLVED\b/i.test(latestReply.body ?? '')) {
                continue;
              }

              active.push({
                review_id: verification.reviewId,
                finding_id: verification.findingId,
                unresolved_id: latestReply.id,
                verified_head: verification.verifiedHead,
              });
            }

            active.sort((a, b) => a.finding_id - b.finding_id);

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (active.length === 0) {
              core.notice('No currently unresolved CodeRabbit findings remain to batch.');
              core.setOutput('should_run', 'false');
              core.setOutput('items_json', '[]');
              return;
            }

            core.notice(
              `Batching ${active.length} unresolved CodeRabbit finding(s) in one OpenCode run.`
            );
            let headSha = pr.data.head.sha;
            if (pr.data.head.repo?.full_name === `${owner}/${repo}`) {
              const { data: headRef } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${pr.data.head.ref}`,
              });
              if (headRef?.object?.sha) headSha = headRef.object.sha;
            }

            core.setOutput('should_run', 'true');
            core.setOutput('pr_number', String(pullNumber));
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', headSha);
            core.setOutput('items_json', JSON.stringify(active));

      - name: Checkout current PR branch
        if: steps.context.outputs.should_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          ref: ${{ steps.context.outputs.head_ref }}

      - name: Configure Git identity
        if: steps.context.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode CLI
        if: steps.context.outputs.should_run == 'true'
        env:
          CONTINUUM_IMAGE_DIGEST: ${{ vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # OpenCode 1.18.34. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `command -v opencode` and the
          # exact version takes the hit path with zero downloads. A cache
          # failure (empty or malformed digest) falls back to deterministic
          # reconstruction below, never failing closed. The digest is bound
          # to the runtime by the image-digest stamp
          # ($HOME/.opencode/image-digest) recorded by the validated image
          # build: a stale or unrelated
          # opencode 1.18.34 binary whose stamp does not match the digest
          # cannot take the hit path. Deterministic reconstruction below
          # never records the stamp, so a later job cannot take the warm
          # path from a reconstruction self-stamp.
          export PATH="$HOME/.opencode/bin:$PATH"
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v opencode >/dev/null 2>&1 && opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"; then
            echo "prepared-runtime hit: opencode 1.18.34 already present (image digest ${CONTINUUM_IMAGE_DIGEST} validated against ${STAMP_FILE})."
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              export PATH="$HOME/.opencode/bin:$PATH"
              opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)" || exit 1
              # Deterministic reconstruction never records the stamp: only
              # the validated image build (or a provider cache restore of
              # it) proves golden-image provenance.
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Fix all unresolved findings in one OpenCode run
        id: fix
        if: steps.context.outputs.should_run == 'true'
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          COLLECTED_HEAD: ${{ steps.context.outputs.head_sha }}
          UNRESOLVED_ITEMS_JSON: ${{ steps.context.outputs.items_json }}
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"bash":{"*":"allow","git *":"deny","git status":"allow","git status *":"allow","git diff":"allow","git diff *":"allow","git log":"allow","git log *":"allow","git show":"allow","git show *":"allow","git rev-parse *":"allow","git ls-files":"allow","git ls-files *":"allow","git grep *":"allow","git blame *":"allow","git branch --show-current":"allow","git remote -v":"allow","git tag":"allow","git tag --list *":"allow","git tag -l *":"allow","git describe *":"allow"}}}
        run: |
          set -euo pipefail

          CURRENT_HEAD="$(git rev-parse HEAD)"
          echo "started_head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"

          PROMPT=$(cat <<EOF
          Fix ALL CodeRabbit findings that are currently UNRESOLVED on pull request #${PR_NUMBER} in one repair pass.

          Current checked-out PR branch: ${HEAD_REF}
          Current checked-out PR HEAD: ${CURRENT_HEAD}
          PR HEAD when the batch was collected: ${COLLECTED_HEAD}

          Complete unresolved batch (JSON):
          ${UNRESOLVED_ITEMS_JSON}

          Each object contains:
          - review_id: the original CodeRabbit review id;
          - finding_id: the original top-level CodeRabbit review-comment id;
          - unresolved_id: the latest CodeRabbit UNRESOLVED reply id for that finding;
          - verified_head: the PR HEAD CodeRabbit evaluated when producing that reply.

          Before editing, inspect every listed original finding, its complete review thread,
          its latest UNRESOLVED reply, the current code, and the current PR diff using GitHub
          CLI/API. The current code is authoritative: another repair may already have changed
          code since a listed verified_head.

          Requirements:
          - Process EVERY object in the batch; do not stop after fixing the first finding.
          - Fix all actionable unresolved findings together in this one working tree.
          - If the current code already fixes a listed finding, do not reintroduce or duplicate a fix.
          - Keep changes scoped to the listed CodeRabbit feedback; do not make unrelated refactors.
          - Run the relevant tests, linters, or validation for the files you change.
          - Do not create or switch branches and do not create a new pull request.
          - Do not resolve or dismiss CodeRabbit review threads yourself.
          - Do not commit or push; the workflow will create one commit and one push for the batch.
          - If CodeRabbit is incorrect about a finding, leave that part of the code unchanged.
          - Keep all comments and commit messages in English.
          EOF
          )

          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            VERIFY_ITEMS="$(
              jq -c --arg head "$CURRENT_HEAD" \
                '[.[] | select(.verified_head != $head)]' \
                <<<"$UNRESOLVED_ITEMS_JSON"
            )"
            echo "verify_items_json=$VERIFY_ITEMS" >> "$GITHUB_OUTPUT"

            if [[ "$VERIFY_ITEMS" == "[]" ]]; then
              echo "verify=false" >> "$GITHUB_OUTPUT"
              echo "OpenCode made no changes and all findings were already UNRESOLVED on this same HEAD; avoiding a same-state loop."
            else
              echo "verify=true" >> "$GITHUB_OUTPUT"
              echo "OpenCode made no changes, but some findings were evaluated on an older HEAD; they will be re-verified against current code."
            fi
            exit 0
          fi

          git add -A
          # kodmial/continuum#260: workflow-owned repair commit uses the bot
          # identity (see Configure Git identity) plus the component trailer.
          git commit -m "fix: address unresolved CodeRabbit findings" -m "Continuum-Component: coderabbit-unresolved"
          git push origin "HEAD:${HEAD_REF}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "verify=true" >> "$GITHUB_OUTPUT"
          echo "verify_items_json=$UNRESOLVED_ITEMS_JSON" >> "$GITHUB_OUTPUT"

      - name: Ask CodeRabbit to verify every finding in the batch
        if: >-
          steps.context.outputs.should_run == 'true' &&
          steps.fix.outputs.verify == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          VERIFY_ITEMS_JSON: ${{ steps.fix.outputs.verify_items_json }}
        with:
          # kodmial/continuum#259: verification replies address CodeRabbit
          # (external app) and never need to trigger a GitHub workflow, so
          # they use GITHUB_TOKEN (github-actions[bot] actor). The fix push
          # above intentionally stays PAT-backed so CI still fans out.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const items = JSON.parse(process.env.VERIFY_ITEMS_JSON || '[]');

            if (items.length === 0) {
              core.notice('No findings need CodeRabbit verification.');
              return;
            }

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (pr.data.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed(
                `PR #${pullNumber}: batched CodeRabbit verification requires a same-repository head branch.`
              );
              return;
            }
            const { data: publishedRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${pr.data.head.ref}`,
            });
            const headSha = publishedRef.data.object.sha;
            if (pr.data.head.sha !== headSha) {
              core.notice(
                `PR #${pullNumber}: pull metadata still reports stale HEAD ${pr.data.head.sha}; verifying published batch-repair HEAD ${headSha}.`
              );
            }

            // Bounded newest-first duplicate check (#254): the marker being
            // checked carries the just-pushed HEAD, so the three newest
            // pages bound the cost; a missed marker only duplicates a
            // visible reply. The review-comment endpoint lists oldest-first
            // and ignores sort/direction, so anchor at the newest end via
            // the review-comment total instead of scanning pages 1..3.
            const totalForVerify = Number(pr?.data?.review_comments || 0);
            const lastVerifyPage = Math.max(
              1,
              Math.ceil((Number.isFinite(totalForVerify) ? totalForVerify : 0) / 100) || 1
            );
            const firstVerifyPage = Math.max(1, lastVerifyPage - 2);
            const comments = [];
            for (let page = lastVerifyPage; page >= firstVerifyPage; page -= 1) {
              const { data } = await github.rest.pulls.listReviewComments({
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
                page,
              });
              if (!Array.isArray(data) || data.length === 0) continue;
              comments.push(...data);
            }

            let requested = 0;
            for (const item of items) {
              const reviewId = Number(item.review_id);
              const findingId = Number(item.finding_id);
              const unresolvedId = Number(item.unresolved_id);
              const previousHead = String(item.verified_head);
              const marker =
                `<!-- opencode-coderabbit-verification review=${reviewId} finding=${findingId} head=${headSha} -->`;

              const duplicate = comments.some(
                (comment) =>
                  comment.in_reply_to_id === findingId &&
                  comment.body?.includes(marker)
              );

              if (duplicate) {
                core.info(
                  `Verification already requested for finding ${findingId} at ${headSha}.`
                );
                continue;
              }

              const body = [
                marker,
                '⚡ **Continuum · coderabbit-unresolved**',
                '<!-- continuum-origin role=continuum component=coderabbit-unresolved -->',
                '@coderabbitai Re-check this exact original finding after the batched OpenCode retry.',
                '',
                `Latest UNRESOLVED reply processed: ${unresolvedId}`,
                `Current PR HEAD: \`${headSha}\``,
                `Previous HEAD associated with that UNRESOLVED reply: \`${previousHead}\``,
                '',
                'Compare the original finding and the latest UNRESOLVED explanation with the current code itself.',
                '',
                'Reply with **RESOLVED** only if the underlying issue is fully fixed.',
                'Otherwise reply with **UNRESOLVED** and state exactly what remains.',
              ].join('\n');

              await github.request(
                'POST /repos/{owner}/{repo}/pulls/{pull_number}/comments/{comment_id}/replies',
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  comment_id: findingId,
                  body,
                }
              );
              requested += 1;
            }

            core.notice(
              `Requested CodeRabbit verification for ${requested}/${items.length} batched finding(s) at HEAD ${headSha}.`
            );
