                  .split(',').map(Number);
                if (!findings.includes(findingId)) continue;
                if (!newest || Number(comment.id) > Number(newest.comment.id)) {
                  newest = { comment, attrs };
                }
              }
              if (!newest) return { state: 'none' };
              const attrs = newest.attrs;
              if (attrs.changed !== 'false') return { state: 'none' };
              const expectedRepo = `${owner}/${repo}`.toLowerCase();
              if (String(attrs.repo || '').toLowerCase() !== expectedRepo ||
                  Number(attrs.pr) !== pullNumber ||
                  attrs.head !== currentHead ||
                  !/^[0-9a-f]{64}$/.test(String(attrs.digest || ''))) {
                return { state: 'defer', reason: 'outcome-identity-mismatch' };
              }
              return corroborateOutcomeRun(
                comments, newest.comment, attrs, runCache
              );
            };
            const filterNoChange = async (
              candidateItems, comments, currentHead
            ) => {
              const kept = [];
              const suppressed = [];
              const deferred = [];
              // Each check re-reads run evidence so a run that completes
              // between the preliminary and the final check cannot be missed.
              const runCache = new Map();
              for (const item of candidateItems) {
                let decision;
                try {
                  decision = await evaluateNoChange(
                    item.finding_id, comments, currentHead, runCache
                  );
                } catch (err) {
                  decision = {
                    state: 'defer',
                    reason: `outcome-check-failed:${err.message || err}`,
                  };
                }
                if (decision.state === 'suppress') {
                  suppressed.push({
                    finding_id: item.finding_id,
                    run_id: decision.run_id,
                    reason: decision.reason,
                  });
                } else if (decision.state === 'defer') {
                  deferred.push({
                    finding_id: item.finding_id,
                    reason: decision.reason,
                  });
                } else {
                  kept.push(item);
                }
              }
              return { items: kept, suppressed, deferred };
            };
            const reportNoChange = async (comments, guarded) => {
              const marker =
                `<!-- continuum-coderabbit-no-change-guard head=${head} ` +
                `findings=${guarded.map(entry => entry.finding_id).join(',')} ` +
                `runs=${guarded.map(entry => entry.run_id).join(',')} ` +
                'reason=no-change-awaiting-review-or-evidence -->';
              const alreadyReported = comments.some(comment =>
                isTrustedHandoff(comment) &&
                String(comment.body || '').includes(marker)
              );
              if (alreadyReported) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pullNumber,
                body: [
                  marker,
                  '⚡ **Continuum · coderabbit-unresolved**',
                  '<!-- continuum-origin role=continuum component=coderabbit-unresolved -->',
                  `No re-dispatch for ${guarded.length} CodeRabbit finding(s) on HEAD \`${head}\`: the matching canonical OpenCode repair run completed successfully with **no code change**. The original review stays open and blocking; this is not approval or successful qualification. Reason: \`no-change-awaiting-review-or-evidence\`.`,
                ].join('\n'),
              });
            };
            let priorComments = [];
            try {
              priorComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullNumber, per_page: 100 }
              );
            } catch (err) {
              core.notice(
                `PR #${pullNumber}: could not read CodeRabbit no-change outcomes before dispatch; deferring until the next reconciliation: ${err.message || err}`
              );
              return;
            }
            const preliminary = await filterNoChange(
              items, priorComments, head
            );
            if (preliminary.deferred.length) {
              core.notice(
                `PR #${pullNumber}: no-change outcome provenance is unreadable or inconsistent; deferring the dispatch for safe reconciliation.`
              );
              return;
            }
            if (preliminary.suppressed.length) {
              await reportNoChange(priorComments, preliminary.suppressed);
              core.notice(
                `PR #${pullNumber}: suppressing re-dispatch for ${preliminary.suppressed.length} finding(s) after a verified no-change repair at HEAD ${head}; the review remains unresolved.`
              );
            }
            items = preliminary.items;
            if (!items.length) {
              core.notice(
                'No CodeRabbit finding remains dispatchable after verified no-change suppression.'
              );
              return;
            }
            let batch = JSON.stringify(items);
            if (Buffer.byteLength(batch, 'utf8') > 30000) {
              throw new Error('CodeRabbit batch exceeds workflow-dispatch safe payload.');
            }
            // Verification replies may change unresolved_id without changing
            // the finding. A lease belongs to the underlying finding set
            // and exact head, never to a transient CodeRabbit reply.
            const batchIdentity = items.map(item => [item.review_id, item.finding_id]);
            const batchKey = crypto.createHash('sha256')
              .update(head + '\n' + JSON.stringify(batchIdentity)).digest('hex');
            const marker =
              `<!-- continuum-coderabbit-batch head=${head} digest=${batchKey} -->`;
            // Dispatch is NOT completion. The executor can finish a green
            // workflow without invoking the model when it rejects the batch,
            // or a provider can fail before publishing anything. Never make
            // the enqueue marker a permanent terminal state.
            const attempts = priorComments
              .filter(comment => (comment.body || '').includes(marker))
              .sort((a, b) => Number(b.id) - Number(a.id));
            // Review replies can change the batch digest while the first
            // repair is still running. Deduplicate ALL active repairs for
            // this PR, including queued runs and different finding batches.
            const { data: runsData } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: opencodeWorkflow,
              event: 'workflow_dispatch', per_page: 100,
            });
            const recentRuns = runsData.workflow_runs || [];
            const isRepair = run =>
              new RegExp(`^OpenCode repair PR #${pullNumber}(?:\\s+\\[ci-attempt:[A-Za-z0-9][A-Za-z0-9._:\\-]{7,127}\\])?$`)
                .test(String(run.display_title || ''));
            let activeRepairs = recentRuns.filter(run =>
              isRepair(run) && run.status !== 'completed');
            // High run volume can push a long-running repair out of the
            // latest 100. Search active states explicitly before dispatch.
            if (!activeRepairs.length && recentRuns.length >= 100) {
              for (const status of ['in_progress', 'queued', 'pending', 'waiting']) {
                const { data: activeData } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: opencodeWorkflow,
                  event: 'workflow_dispatch', status, per_page: 100,
                });
                activeRepairs = (activeData.workflow_runs || []).filter(isRepair);
                if (activeRepairs.length) break;
              }
            }
            if (activeRepairs.length) {
              core.notice('Canonical OpenCode repair for this PR is already active; duplicate verification suppressed.');
              return;
            }
            if (attempts.length) {
              const latest = attempts[0];
              const latestAt = Date.parse(latest.created_at || '');
              if (!Number.isFinite(latestAt)) {
                throw new Error('Cannot establish the prior batch dispatch time.');
              }
              // Bounded infrastructure backoff, shared by event and scheduled
              // reconciliation. The source finding and exact HEAD are
              // revalidated on every pass above.
              const retryDelayMinutes = Math.min(80, 10 * 2 ** Math.min(3, attempts.length - 1));
              if (Date.now() - latestAt < retryDelayMinutes * 60_000) {
                core.notice(
                  `CodeRabbit batch already queued: retry backoff ${retryDelayMinutes}m for this exact head/findings.`
                );
                return;
              }
              const matching = recentRuns.filter(run =>
                isRepair(run) && Date.parse(run.created_at || '') >= latestAt - 15_000
              );
              // After the bounded retry delay, absence from recent history
              // is NOT a four-hour lock. The active-status inventory above
              // already excludes live repairs (including aged active runs).
              // Resume safely if the old dispatch is completed or invisible.
              if (!matching.length) {
                core.warning('Previous dispatch is no longer in recent Actions history; no active repair found. Retrying after bounded backoff.');
              }
              core.warning(
                `CodeRabbit batch remains unresolved on identical HEAD after ${attempts.length} dispatch(es). Re-dispatching through canonical OpenCode with bounded backoff.`
              );
            }

            // The collector read handoffs before the active-run check above.
            // A repair can publish its completion handoff during that window
            // and finish before the check sees it. Re-read every handoff
            // immediately before dispatch and defer if a handoff newer than
            // the collector's cutoff now covers any finding in this batch.
            let liveIssueComments = [];
            try {
              liveIssueComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullNumber, per_page: 100 }
              );
            } catch (err) {
              core.notice(
                `PR #${pullNumber}: could not re-read CodeRabbit repair handoffs before dispatch; deferring until the next reconciliation: ${err.message || err}`
              );
              return;
            }
            const repairHandoffPattern =
              /<!-- opencode-coderabbit-verification-pending head=([0-9a-f]{40}) findings=([0-9,]+)(?: answers=[0-9,]+)? -->/;
            const batchFindingIds = new Set(
              items.map(item => item.finding_id)
            );
            const handoffPublishedDuringDispatch = liveIssueComments.some(
              comment => {
                if (Number(comment.id) <= handoffCutoff) return false;
                const login = String(
                  comment.user?.login || comment.author?.login || ''
                ).trim().toLowerCase();
                if (!trustedHandoffAuthors.has(login)) return false;
                const match = String(comment.body || '').match(
                  repairHandoffPattern
                );
                return Boolean(
                  match && match[1] === head &&
                  match[2].split(',').map(Number).some(
                    findingId => batchFindingIds.has(findingId)
                  )
                );
              }
            );
            if (handoffPublishedDuringDispatch) {
              core.notice(
                `PR #${pullNumber}: a CodeRabbit repair handoff was published after collection; deferring this batch until fresh verification.`
              );
              return;
            }

            // The optional batch input is an additive consumer API. An
            // already-installed caller may predate it: route each distinct
            // source review to the SAME canonical OpenCode executor until
            // the next installer upgrade. Never invoke an independent model.
            const caller = (await github.rest.repos.getContent({
              owner, repo, path: `.github/workflows/${opencodeWorkflow}`,
              ref: context.payload.repository.default_branch,
            })).data;
            if (!caller || typeof caller.content !== 'string') {
              throw new Error('Cannot inspect consumer OpenCode caller for batch compatibility.');
            }
            const callerSource = Buffer.from(caller.content.replace(/\n/g, ''), 'base64').toString('utf8');
            const supportsBatch = /^\s+unresolved_items_json:\s*$/m.test(callerSource);
            // Re-read the authoritative completion evidence and the current
            // PR HEAD immediately before createWorkflowDispatch. A repair can
            // publish its outcome after collection and finish during the
            // checks above; dispatching then would duplicate completed work.
            let finalComments = [];
            try {
              finalComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullNumber, per_page: 100 }
              );
            } catch (err) {
              core.notice(
                `PR #${pullNumber}: could not re-read CodeRabbit no-change outcomes immediately before dispatch; deferring until the next reconciliation: ${err.message || err}`
              );
              return;
            }
            let finalPr;
            try {
              finalPr = (await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber,
              })).data;
            } catch (err) {
              core.notice(
                `PR #${pullNumber}: could not re-read the current PR HEAD immediately before dispatch; deferring until the next reconciliation: ${err.message || err}`
              );
              return;
            }
            if (finalPr.state !== 'open' ||
                finalPr.head?.repo?.full_name !== `${owner}/${repo}` ||
                finalPr.head.sha !== head ||
                finalPr.head.ref !== headRef) {
              core.notice(
                'PR HEAD or state advanced immediately before dispatch; deferring to the next reconciliation.'
              );
              return;
            }
            const finalNoChange = await filterNoChange(
              items, finalComments, head
            );
            if (finalNoChange.deferred.length) {
              core.notice(
                `PR #${pullNumber}: no-change outcome provenance is unreadable or inconsistent immediately before dispatch; deferring for safe reconciliation.`
              );
              return;
            }
            if (finalNoChange.suppressed.length) {
              await reportNoChange(finalComments, finalNoChange.suppressed);
              core.notice(
                `PR #${pullNumber}: a verified no-change repair completed between collection and dispatch; suppressing this duplicate dispatch.`
              );
              return;
            }
            const finalBatchFindingIds = new Set(
              items.map(item => item.finding_id)
            );
            const finalPendingHandoff = finalComments.some(comment => {
              if (!isTrustedHandoff(comment)) return false;
              if (Number(comment.id) <= handoffCutoff) return false;
              const match = String(comment.body || '').match(
                repairHandoffPattern
              );
              return Boolean(
                match && match[1] === head &&
                match[2].split(',').map(Number).some(
                  findingId => finalBatchFindingIds.has(findingId)
                )
              );
            });
            if (finalPendingHandoff) {
              core.notice(
                `PR #${pullNumber}: a CodeRabbit repair handoff was published immediately before dispatch; deferring this batch until fresh verification.`
              );
              return;
            }
            const distinctReviews = [...new Set(items.map(item => item.review_id))];
            for (const reviewId of (supportsBatch ? [items[0].review_id] : distinctReviews)) {
              const inputs = {
                mode: 'coderabbit-fix',
                pr_number: String(pullNumber),
                head_ref: headRef,
                review_id: String(reviewId),
              };
              if (supportsBatch) inputs.unresolved_items_json = batch;
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: opencodeWorkflow,
                ref: context.payload.repository.default_branch,
                inputs,
              });
            }
            if (!supportsBatch) {
              core.warning(
                'Consumer OpenCode caller lacks batch input: used one canonical repair per distinct review. Run the Continuum installer to enable efficient batching.'
              );
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: pullNumber,
              body: [
                marker,
                '⚡ **Continuum · coderabbit-unresolved**',
                '<!-- continuum-origin role=continuum component=coderabbit-unresolved -->',
                `Queued one canonical OpenCode repair for ${items.length} current unresolved CodeRabbit finding(s) (attempt ${attempts.length + 1}) on HEAD \`${head}\`.`,
              ].join('\n'),
            });
            core.notice(`Dispatched canonical OpenCode for ${items.length} unresolved finding(s) of PR #${pullNumber}.`);
