name: Bootstrap consumer secret public key

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      # ----------------------------------------------------------------
      # Which repository receives the secret. This is a knob, not a
      # literal: the caller stub is installed verbatim into every consumer,
      # so a target written into the request body made this workflow write
      # one consumer's secret from all of them, silently, in whichever
      # repository happened to be named here.
      #
      # Empty falls back to CONTINUUM_TARGET_REPOSITORY and, still empty,
      # to the calling repository: a consumer that installs this caller
      # bootstraps its own secret, which is the whole point of the caller.
      # `github.repository` in a `workflow_call` is the caller's
      # repository, so that default is correct for every consumer at once.
      # ----------------------------------------------------------------
      repository:
        description: >-
          Repository whose Actions secrets public key is fetched. Empty
          falls back to CONTINUUM_TARGET_REPOSITORY and, still empty, to
          the repository that called this workflow.
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  fetch-public-key:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: ${{ inputs.repository || vars.CONTINUUM_TARGET_REPOSITORY || github.repository }}
    steps:
      - name: Fetch runtime-lab Actions secrets public key
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          # An unresolvable or misshapen target fails here rather than
          # reaching `gh api`, which would otherwise resolve an empty
          # `repos//…` against whatever the API defaults to.
          [[ "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::No usable target repository: pass the repository input, set vars.CONTINUUM_TARGET_REPOSITORY, or call this workflow from the repository to bootstrap."
            exit 2
          }
          gh api "repos/$TARGET_REPOSITORY/actions/secrets/public-key"
