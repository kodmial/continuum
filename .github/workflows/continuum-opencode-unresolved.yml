name: Retry OpenCode on CodeRabbit unresolved

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions: {}

jobs:
  dispatch-unresolved-fix:
    if: >-
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      github.event.comment.in_reply_to_id != null &&
      contains(github.event.comment.body, '**UNRESOLVED**') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Match unresolved reply to the current verification request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDING_ID: ${{ github.event.comment.in_reply_to_id }}
          UNRESOLVED_COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # CodeRabbit replies to the original top-level finding, not to our
          # verification comment. Locate the verification marker for the same
          # finding and the *current* PR HEAD. This makes stale UNRESOLVED replies
          # harmless if the branch has already advanced.
          #
          # Bounded newest-first page walk (#254): review comments list
          # oldest-first and may ignore sort/direction, so pages 1..N would
          # scan only the oldest window and miss the current-HEAD
          # verification marker. Anchor at the newest end via the paginated
          # Link header's rel="last" page and walk the newest
          # CONTINUUM_MAX_COMMENT_PAGES pages instead, enforcing
          # newest-first client-side. A truncated or unanchorable window
          # fails closed (dispatch=false) and never fires a stale retry.
          MAX_PAGES_RAW="${CONTINUUM_MAX_COMMENT_PAGES:-5}"
          if [[ "$MAX_PAGES_RAW" =~ ^[0-9]+$ ]] && [[ "$MAX_PAGES_RAW" -ge 1 ]]; then
            MAX_PAGES="$MAX_PAGES_RAW"
          else
            MAX_PAGES=5
          fi
          [[ "$MAX_PAGES" -gt 5 ]] && MAX_PAGES=5
          INCLUDE="$(gh api --include "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100&page=1" 2>/dev/null || true)"
          if [[ -z "$INCLUDE" ]]; then
            echo "Could not determine the newest review-comment page; ignoring UNRESOLVED reply."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEADERS="$(tr -d '\r' <<<"$INCLUDE" | sed -n '1,/^$/p')"
          LINK_LAST="$(grep -i '^link:' <<<"$HEADERS" | tr '[:upper:]' '[:lower:]' | sed -nE 's/.*<[^>]*[?&]page=([0-9]+)[^>]*>[[:space:]]*;[[:space:]]*rel="last".*/\1/p' | tail -n 1)"
          if [[ -n "$LINK_LAST" ]]; then
            if [[ "$LINK_LAST" =~ ^[0-9]+$ ]] && [[ "$LINK_LAST" -ge 1 ]]; then
              LAST_PAGE="$LINK_LAST"
            else
              echo "Could not parse the newest review-comment page; ignoring UNRESOLVED reply."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif grep -qi '^link:' <<<"$HEADERS"; then
            echo "Could not parse the newest review-comment page; ignoring UNRESOLVED reply."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            # No Link header means the thread fits in a single page.
            LAST_PAGE=1
          fi
          FIRST_PAGE=$(( LAST_PAGE - MAX_PAGES + 1 ))
          [[ "$FIRST_PAGE" -ge 1 ]] || FIRST_PAGE=1
          COMMENT_PAGES=""
          page="$FIRST_PAGE"
          while [[ "$page" -le "$LAST_PAGE" ]]; do
            page_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100&page=${page}" 2>/dev/null || true)"
            if ! jq -e 'type == "array"' <<<"$page_json" >/dev/null 2>&1; then page=$((page + 1)); continue; fi
            count="$(jq 'length' <<<"$page_json" 2>/dev/null || echo 0)"
            [[ "$count" =~ ^[0-9]+$ ]] && [[ "$count" -gt 0 ]] || { page=$((page + 1)); continue; }
            COMMENT_PAGES+="$page_json"$'\n'
            page=$((page + 1))
          done
          if [[ -z "$COMMENT_PAGES" ]]; then
            COMMENTS="[]"
          elif ! COMMENTS="$(jq -s 'add // []' <<<"$(grep -v '^$' <<<"$COMMENT_PAGES" || true)")"; then
            echo "Could not aggregate review-comment pages; ignoring UNRESOLVED reply."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERIFICATION=$(jq -c \
            --argjson finding "$FINDING_ID" \
            --argjson unresolved "$UNRESOLVED_COMMENT_ID" \
            --arg owner "$REPO_OWNER" \
            --arg head "$HEAD_SHA" '
              [ .[]
                | select(.in_reply_to_id == $finding)
                | select(.id < $unresolved)
                | select(.user.login == $owner)
                | select(.body | contains("<!-- opencode-coderabbit-verification "))
                | select(.body | contains("finding=" + ($finding | tostring)))
                | select(.body | contains("head=" + $head))
              ]
              | sort_by(.id)
              | last // empty
            ' <<<"$COMMENTS")

          if [[ -z "$VERIFICATION" ]]; then
            echo "No matching verification request for finding $FINDING_ID at HEAD $HEAD_SHA; ignoring stale or unrelated UNRESOLVED reply."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(jq -r '.body' <<<"$VERIFICATION")
          REVIEW_ID=$(sed -nE \
            's/.*opencode-coderabbit-verification review=([0-9]+) finding=.*/\1/p' \
            <<<"$BODY" | head -n 1)

          if [[ ! "$REVIEW_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not extract source review id from the verification marker."
            exit 1
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "Matched UNRESOLVED comment $UNRESOLVED_COMMENT_ID to finding $FINDING_ID, review $REVIEW_ID, HEAD $HEAD_SHA."
          echo "continuum-api-budget: comment_pages=$(( LAST_PAGE - FIRST_PAGE + 1 )) max_pages=${MAX_PAGES} raw_CONTINUUM_MAX_COMMENT_PAGES=${CONTINUUM_MAX_COMMENT_PAGES:-5}"

      - name: Dispatch OpenCode retry
        if: steps.context.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ steps.context.outputs.review_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/continuum-opencode.yml/dispatches" \
            -f ref=main \
            -f "inputs[mode]=coderabbit-fix" \
            -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[head_ref]=${HEAD_REF}" \
            -f "inputs[review_id]=${REVIEW_ID}"
