name: Retry OpenCode on CodeRabbit unresolved

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions: {}

jobs:
  dispatch-unresolved-fix:
    # Generic unresolved-feedback entry: CodeRabbit UNRESOLVED replies arrive
    # as coderabbitai[bot] comments, PR-Agent UNRESOLVED replies arrive as
    # review-thread comments containing the generic verification marker.
    # Stale heads are rejected in the match step below.
    if: >-
      github.event.comment.in_reply_to_id != null &&
      contains(github.event.comment.body, '**UNRESOLVED**') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Match unresolved reply to the current verification request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FINDING_ID: ${{ github.event.comment.in_reply_to_id }}
          UNRESOLVED_COMMENT_ID: ${{ github.event.comment.id }}
          UNRESOLVED_AUTHOR: ${{ github.event.comment.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Providers reply to the original top-level finding, not to our
          # verification comment. Locate the verification marker for the same
          # finding and the *current* PR HEAD. This makes stale UNRESOLVED replies
          # harmless if the branch has already advanced. Both the legacy
          # CodeRabbit marker and the generic review-verification marker are
          # accepted; the provider is derived from whichever marker matched.
          # Privilege gate: an arbitrary user replying UNRESOLVED must never
          # trigger privileged repair. The verification request must be
          # provider-owned, the UNRESOLVED reply must be provider-owned for
          # the matched provider, and the finding identity plus head must
          # correlate to provider-owned review state.
          COMMENTS=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100")

          VERIFICATION=$(jq -c \
            --argjson finding "$FINDING_ID" \
            --argjson unresolved "$UNRESOLVED_COMMENT_ID" \
            --arg owner "$REPO_OWNER" \
            --arg head "$HEAD_SHA" '
              [ .[][]
                | select(.in_reply_to_id == $finding)
                | select(.id < $unresolved)
                | select(.user.login == $owner)
                | select((.body | contains("<!-- opencode-coderabbit-verification ")) or (.body | contains("<!-- opencode-review-verification ")))
                | select(.body | contains("finding=" + ($finding | tostring)))
                | select(.body | contains("head=" + $head))
              ]
              | sort_by(.id)
              | last // empty
            ' <<<"$COMMENTS")

          if [[ -z "$VERIFICATION" ]]; then
            echo "No matching verification request for finding $FINDING_ID at HEAD $HEAD_SHA; ignoring stale or unrelated UNRESOLVED reply."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(jq -r '.body' <<<"$VERIFICATION")
          REVIEW_ID=$(sed -nE \
            's/.*opencode-(coderabbit-verification|review-verification)[^>]*review=([^ >]+) finding=.*/\2/p' \
            <<<"$BODY" | head -n 1)
          if grep -q 'opencode-review-verification' <<<"$BODY"; then
            PROVIDER="pr-agent"
            if grep -q 'provider=coderabbit' <<<"$BODY"; then
              PROVIDER="coderabbit"
            fi
          else
            PROVIDER="coderabbit"
          fi

          if [[ -z "$REVIEW_ID" ]]; then
            echo "::error::Could not extract source review id from the verification marker."
            exit 1
          fi

          # Author allowlist per provider: CodeRabbit UNRESOLVED replies are
          # authored by coderabbitai[bot]; PR-Agent UNRESOLVED verdicts are
          # authored by the repository owner identity or github-actions[bot].
          # Anything else is an unprivileged human/other-bot reply and never
          # dispatches repair.
          if [[ "$PROVIDER" == "coderabbit" ]]; then
            if [[ "$UNRESOLVED_AUTHOR" != "coderabbitai[bot]" ]]; then
              echo "UNRESOLVED reply $UNRESOLVED_COMMENT_ID authored by '$UNRESOLVED_AUTHOR' is not coderabbitai[bot]; ignoring."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [[ "$UNRESOLVED_AUTHOR" != "$REPO_OWNER" && "$UNRESOLVED_AUTHOR" != "github-actions[bot]" && "$UNRESOLVED_AUTHOR" != "github-actions" ]]; then
              echo "UNRESOLVED reply $UNRESOLVED_COMMENT_ID authored by '$UNRESOLVED_AUTHOR' is not provider-owned; ignoring."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Finding-identity correlation: the finding must exist in the
            # provider-owned pr-agent-review-state:v1 ACTIVE set for the
            # exact current HEAD. Stale or unknown ids are rejected.
            ISSUE_COMMENTS=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")
            STATE_JSON=$(jq -r \
              --arg head "$HEAD_SHA" \
              --arg review "$REVIEW_ID" '
                [.[] | select(.user.login == env.REPO_OWNER or .user.login == "github-actions[bot]")
                 | .body | scan("<!--\\s*pr-agent-review-state:v1\\s*\\n([\\s\\S]*?)-->") | .[0]]
                | last // empty
              ' <<<"$ISSUE_COMMENTS")
            if [[ -z "$STATE_JSON" ]]; then
              echo "No provider-owned pr-agent-review-state:v1 for HEAD $HEAD_SHA; ignoring."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! jq -e \
              --arg finding "$FINDING_ID" \
              --arg head "$HEAD_SHA" \
              --arg review "$REVIEW_ID" '
                (.provider // "pr-agent" == "pr-agent")
                and (((.reviewed_sha // .head_sha // .head // "") | ascii_downcase) == ($head | ascii_downcase))
                and (((.review_id // .review_instance_id // .instance_id // .reviewed_sha // "") == $review)
                     or ((.reviewed_sha // "") == $review))
                and ([.findings[]? | select((.status // "ACTIVE" | ascii_upcase) as $s
                     | ["ACTIVE","OPEN","UNRESOLVED"] | index($s))
                     | (.id | tostring)] | index($finding))
              ' <<<"$STATE_JSON" >/dev/null; then
              echo "Finding $FINDING_ID is not an ACTIVE provider-owned finding for review $REVIEW_ID at HEAD $HEAD_SHA; ignoring."
              echo "dispatch=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Exact normalized unresolved finding set for this review/head:
            # every ACTIVE finding in provider-owned state (bounded, complete).
            FINDINGS_JSON=$(jq -c \
              --arg head "$HEAD_SHA" '
                [.findings[]?
                 | select((.status // "ACTIVE" | ascii_upcase) as $s
                   | ["ACTIVE","OPEN","UNRESOLVED"] | index($s))
                 | {id: (.id | tostring), path: (.path // ""),
                    line: (.line // 0),
                    severity: (.severity // "high"),
                    summary: (.summary // .title // .rule // (.id | tostring))}]
              ' <<<"$STATE_JSON")
            if [[ -z "$FINDINGS_JSON" || "$FINDINGS_JSON" == "[]" ]]; then
              echo "::error::Refusing empty findings_json repair dispatch."
              exit 1
            fi
            echo "findings_json=$FINDINGS_JSON" >> "$GITHUB_OUTPUT"
          fi

          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "Matched UNRESOLVED comment $UNRESOLVED_COMMENT_ID to finding $FINDING_ID, review $REVIEW_ID, provider $PROVIDER, HEAD $HEAD_SHA."

      - name: Dispatch OpenCode retry
        if: steps.context.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_ID: ${{ steps.context.outputs.review_id }}
          REVIEW_PROVIDER: ${{ steps.context.outputs.provider }}
          REVIEW_PROVIDER_VAR: ${{ vars.CONTINUUM_REVIEW_PROVIDER || '' }}
          FINDINGS_JSON: ${{ steps.context.outputs.findings_json }}
        run: |
          set -euo pipefail
          # Bounded generic re-entry: the PR-Agent path uses the generic
          # review-fix mode; the CodeRabbit path keeps its transitional
          # coderabbit-fix mode. Same-head no-progress is enforced by the
          # verification-marker match above (stale markers never dispatch).
          # Both dispatch forms below are literal so the mode contract stays
          # statically visible: every whitelisted mode must be dispatched by
          # a core workflow.
          if [[ "${REVIEW_PROVIDER:-}" == "pr-agent" ]]; then
            # Empty retry is forbidden: the exact normalized unresolved
            # finding set from provider-owned state travels with the
            # dispatch; an empty findings_json never dispatches repair.
            if [[ -z "${FINDINGS_JSON:-}" || "${FINDINGS_JSON:-}" == "[]" ]]; then
              echo "::error::Refusing empty findings_json repair dispatch for PR-Agent review ${REVIEW_ID}."
              exit 1
            fi
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/continuum-opencode.yml/dispatches" \
              -f ref=main \
              -f "inputs[mode]=review-fix" \
              -f "inputs[pr_number]=${PR_NUMBER}" \
              -f "inputs[head_ref]=${HEAD_REF}" \
              -f "inputs[review_id]=${REVIEW_ID}" \
              -f "inputs[review_provider]=${REVIEW_PROVIDER_VAR:-pr-agent}" \
              -f "inputs[reviewed_sha]=${HEAD_SHA}" \
              -f "inputs[head_sha]=${HEAD_SHA}" \
              -f "inputs[findings_json]=${FINDINGS_JSON}"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/continuum-opencode.yml/dispatches" \
              -f ref=main \
              -f "inputs[mode]=coderabbit-fix" \
              -f "inputs[pr_number]=${PR_NUMBER}" \
              -f "inputs[head_ref]=${HEAD_REF}" \
              -f "inputs[review_id]=${REVIEW_ID}"
          fi
