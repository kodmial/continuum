name: OpenCode repair controller

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      # The four inputs below are how a consumer's own CI reports a result.
      # The caller stub declares them `required: true` on `workflow_dispatch`,
      # so an operator or a CI job cannot report a partial result; here they
      # must stay optional and empty, because the pull_request_target and
      # workflow_run paths call this workflow without them.
      pr_number:
        description: >-
          Pull request whose CI result is being reported. Empty unless the
          caller was dispatched.
        type: string
        default: ''
        required: false
      head_sha:
        description: >-
          PR head SHA the reporting CI run evaluated. Empty unless the caller
          was dispatched.
        type: string
        default: ''
        required: false
      conclusion:
        description: >-
          Conclusion the reporting CI run produced for that head (success,
          failure, or timed_out). Empty unless the caller was dispatched.
        type: string
        default: ''
        required: false
      run_id:
        description: >-
          Id of the reporting CI workflow run, forwarded to the ci-fix
          dispatch. Empty unless the caller was dispatched.
        type: string
        default: ''
        required: false
      ci_repair_label:
        description: >-
          Label holding the one-automatic-attempt-per-head CI repair lock.
          Empty falls back to CONTINUUM_CI_REPAIR_LABEL.
        type: string
        default: ''
        required: false
      head_ref_pattern:
        description: >-
          Extended regular expression an OpenCode branch head must match
          before this controller touches it. Empty falls back to
          CONTINUUM_HEAD_REF_PATTERN.
        type: string
        default: ''
        required: false
      auto_merge_workflow:
        description: >-
          Workflow file name the reconciler is woken on after a successful CI
          report. Empty falls back to CONTINUUM_AUTO_MERGE_WORKFLOW.
        type: string
        default: ''
        required: false
      opencode_workflow:
        description: >-
          Workflow file name a ci-fix is dispatched to. Empty falls back to
          CONTINUUM_OPENCODE_WORKFLOW.
        type: string
        default: ''
        required: false
      ci_repair_workflows:
        description: >-
          Comma- or newline-separated exact workflow names whose completed PR
          runs may trigger a repair. Empty falls back to
          CONTINUUM_CI_REPAIR_WORKFLOWS, then to CI.
        type: string
        default: ''
        required: false
  # This trusted metadata workflow never checks out or executes PR code.

permissions: {}

concurrency:
  # Serialize both admission paths on the reported head SHA, so a completed
  # approved workflow and a reported CI result for the same commit cannot race
  # a shared lock decision. The pull_request_target path keeps its pre-existing
  # per-PR granularity because it has no reported head SHA.
  #
  # GitHub keeps at most one running and one pending run per group, so a burst
  # of same-head completions can replace an older pending controller run. That
  # is safe because both repair jobs re-reconcile the LATEST approved-workflow
  # state for the head instead of acting only on their own event: whichever
  # event survives the queue still repairs a real failure or processes the
  # green lock decision.
  group: opencode-repair-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.event.pull_request.number || inputs.pr_number || github.sha }}
  cancel-in-progress: false

jobs:
  sync-current-pr:
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'opencode/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Update branch or dispatch conflict repair
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
          CI_REPAIR_LABEL: ${{ inputs.ci_repair_label || vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
          OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow || vars.CONTINUUM_OPENCODE_WORKFLOW || 'continuum-opencode.yml' }}
        run: |
          set -euo pipefail

          # kodmial/continuum#302: canonical fail-closed branch safety for
          # the GitHub-native branch update below. update-branch merges the
          # default branch INTO the PR branch; the PR head itself must be a
          # proven non-default ref, discovered from repository metadata and
          # never hardcoded. A missing/ambiguous/default head fails closed
          # before any mutation; only the PR merge operation may update the
          # default branch.
          continuum_assert_safe_push() {
            local dest="${1:-}"
            local repo="${2:-$GITHUB_REPOSITORY}"
            dest="${dest#refs/heads/}"
            dest="$(printf '%s' "$dest" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ -z "$dest" ]]; then echo "::error::Continuum branch safety: refusing code push with an empty destination." >&2; return 1; fi
            case "$dest" in HEAD|@|FETCH_HEAD|ORIG_HEAD|MERGE_HEAD) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in *".."*|*"~"*|*"^"*|*"?"*|*"*"*|*"["*|*" "*|*"@{"*) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in -*|/*|*/|*.lock) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            if [[ "$dest" == *"//"* ]]; then echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1; fi
            local default_branch=""
            default_branch="$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || true)"
            default_branch="${default_branch#refs/heads/}"
            default_branch="$(printf '%s' "$default_branch" | tr -d '[:space:]')"
            if [[ -z "$default_branch" ]]; then echo "::error::Continuum branch safety: repository default branch is undiscoverable for '$repo'; refusing code push to '$dest'." >&2; return 1; fi
            if [[ "$dest" == "$default_branch" ]]; then echo "::error::Continuum branch safety: refusing code push to the default branch '$dest'. Recovery resumes the same PR branch; only the PR merge operation may update the default branch." >&2; return 1; fi
          }

          # Repair locks are one-attempt-per-HEAD, not one-attempt-per-PR.
          # A synchronize event means the PR has a new head commit, so the CI
          # repair lock belongs to the previous head and must not suppress
          # repair of a fresh failure on this head. Reopened PRs also get a
          # clean repair budget.
          if [[ "$PR_ACTION" == "synchronize" || "$PR_ACTION" == "reopened" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$CI_REPAIR_LABEL" \
              >/dev/null 2>&1 || true
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/opencode-conflict-repair" \
              >/dev/null 2>&1 || true
            echo "Reset per-head CI/conflict repair locks for PR #$PR_NUMBER ($PR_ACTION)."
          fi

          gh label create opencode-conflict-repair --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "One automatic OpenCode conflict-repair attempt per conflict episode." \
            --force >/dev/null

          remove_lock() {
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/opencode-conflict-repair" \
              >/dev/null 2>&1 || true
          }

          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD_SHA" --jq '.behind_by')
          if [[ "$behind" -eq 0 ]]; then
            remove_lock
            echo "PR #$PR_NUMBER already contains the current main branch."
            exit 0
          fi

          echo "PR #$PR_NUMBER is $behind commit(s) behind main; requesting GitHub-native branch update."
          continuum_assert_safe_push "$HEAD_REF" || exit 1
          if output=$(gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" \
            -f "expected_head_sha=$HEAD_SHA" 2>&1); then
            remove_lock
            echo "$output"
            exit 0
          fi

          echo "$output"
          if ! grep -Eqi 'conflict|cannot be performed|not updateable' <<<"$output"; then
            echo "::warning::GitHub update-branch failed for a reason other than a merge conflict."
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            --jq '.[].name' | grep -Fxq opencode-conflict-repair; then
            echo "Conflict repair was already dispatched for this unresolved conflict."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
            -f 'labels[]=opencode-conflict-repair' >/dev/null

          if ! gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches" \
            -f ref=main \
            -f "inputs[mode]=resolve-conflict" \
            -f "inputs[pr_number]=$PR_NUMBER" \
            -f "inputs[head_ref]=$HEAD_REF"; then
            remove_lock
            echo "::error::Failed to dispatch OpenCode conflict repair; lock cleared for retry."
            exit 1
          fi

  # The consumer's own CI reports its result here: it dispatches this workflow
  # on its installed `continuum-opencode-repair.yml` caller with the PR number,
  # the evaluated head SHA, the conclusion, and its run id. That is the path a
  # consumer with its own CI stack uses, because `workflow_run` can only observe
  # runs of workflows in the same repository — a consumer whose CI lives behind
  # its own reusable file still emits a `workflow_run`, but a consumer whose CI
  # reports through a status/API has no run for Continuum to watch at all.
  ci-repair-dispatch:
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_number != '' && inputs.head_sha != '' && inputs.conclusion != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout shared CI repair state classifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref || 'main' }}
          path: .continuum-repair-engine
          fetch-depth: 1
          persist-credentials: false
          token: ''
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/opencode_repair_state.py
            src/continuum

      - name: Reconcile one CI result reported by the consumer's own CI
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          REPAIR_STATE_HELPER: ${{ github.workspace }}/.continuum-repair-engine/.github/scripts/opencode_repair_state.py
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORTED_HEAD_SHA: ${{ inputs.head_sha }}
          REPORTED_CONCLUSION: ${{ inputs.conclusion }}
          REPORTED_RUN_ID: ${{ inputs.run_id }}
          CI_REPAIR_LABEL: ${{ inputs.ci_repair_label || vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
          HEAD_REF_PATTERN: ${{ inputs.head_ref_pattern || vars.CONTINUUM_HEAD_REF_PATTERN || '^opencode/issue[0-9]+-' }}
          AUTO_MERGE_WORKFLOW: ${{ inputs.auto_merge_workflow || vars.CONTINUUM_AUTO_MERGE_WORKFLOW || 'continuum-auto-merge.yml' }}
          OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow || vars.CONTINUUM_OPENCODE_WORKFLOW || 'continuum-opencode.yml' }}
          CI_REPAIR_WORKFLOWS: ${{ inputs.ci_repair_workflows || vars.CONTINUUM_CI_REPAIR_WORKFLOWS || 'CI' }}
        run: |
          set -euo pipefail

          # Guards run before any write, in the same order as the fork this
          # replaces: the PR must still be open, must still live in this
          # repository (a fork's head means the reporting CI is not ours), and
          # its head must still be an OpenCode branch. Everything after a guard
          # is skipped rather than failed, because a stale report is a normal
          # outcome of a CI run racing a push, not an error.
          #
          # One pulls.get serves every guard plus the lock check below: the
          # PR representation already carries labels, so no second
          # labels-list read is needed (#254).
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" || PR_JSON='{}'
          read -r pr_state head_ref head_sha head_repo < <(
            jq -r '[.state, .head.ref, .head.sha, .head.repo.full_name] | @tsv' <<<"$PR_JSON"
          )
          PR_LABELS="$(jq -r '[.labels[]?.name? // empty][]?' <<<"$PR_JSON" 2>/dev/null || true)"

          if [[ "$pr_state" != "open" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #$PR_NUMBER is not an open same-repository PR; ignoring the reported CI result."
            exit 0
          fi

          if [[ ! "$head_ref" =~ $HEAD_REF_PATTERN ]]; then
            echo "PR #$PR_NUMBER head '$head_ref' is not an OpenCode branch; ignoring the reported CI result."
            exit 0
          fi

          # Stale check: CI reported on a head the PR has already left behind.
          # Repairing that head would spend the one-attempt budget of a commit
          # nobody is going to merge.
          if [[ "$head_sha" != "$REPORTED_HEAD_SHA" ]]; then
            echo "Reported CI result for $REPORTED_HEAD_SHA is stale; PR #$PR_NUMBER is now $head_sha."
            exit 0
          fi

          # kodmial/continuum#295: frozen task-spec guard before repair
          # dispatch. The durable record is the bot-owned snapshot comment
          # on the issue; the PR's snapshot reference must match it exactly
          # and the live issue is re-read and compared. On drift (or when
          # the contract cannot be verified), hold with a deduplicated
          # diagnostic: no dispatch, no blind retry loop. A PR without a
          # snapshot reference is legacy and proceeds explicitly
          # unprotected. Canonical digests mirror
          # src/continuum/task_snapshot.py (UTF-8, NFC, LF, SHA-256).
          SNAPSHOT_PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"
          SNAPSHOT_REF="$(grep -oE '<!--[[:space:]]*continuum-task-snapshot-ref[^>]*-->' <<<"$SNAPSHOT_PR_BODY" | head -n 1 || true)"
          if [[ -n "$SNAPSHOT_REF" ]]; then
            SNAP_REF_REPO="$(sed -nE 's/.*repo=([A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            SNAP_REF_ISSUE="$(sed -nE 's/.*issue=([0-9]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            SNAP_REF_TITLE_SHA="$(sed -nE 's/.*title-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_BODY_SHA="$(sed -nE 's/.*body-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_SPEC_SHA="$(sed -nE 's/.*spec-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_GENERATION="$(sed -nE 's/.*generation=([0-9]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            if [[ -z "$SNAP_REF_REPO" || -z "$SNAP_REF_ISSUE" || -z "$SNAP_REF_TITLE_SHA" || -z "$SNAP_REF_BODY_SHA" || -z "$SNAP_REF_SPEC_SHA" || -z "$SNAP_REF_GENERATION" ]]; then
              echo "PR #$PR_NUMBER snapshot reference is malformed; holding repair without a verifiable contract."
              exit 0
            fi
            if [[ "$SNAP_REF_GENERATION" != "1" ]]; then
              echo "PR #$PR_NUMBER snapshot reference is for generation $SNAP_REF_GENERATION, expected generation 1 (stale contract); holding repair."
              exit 0
            fi
            # The PR body is mutable, so the reference alone never defines
            # the contract: require it to match the durable snapshot comment
            # before comparing live text. A PR-body edit that retargets the
            # ref shas to an edited issue otherwise passes verification.
            if ! SNAP_COMMENTS_JSON="$(gh api "repos/$SNAP_REF_REPO/issues/$SNAP_REF_ISSUE/comments?per_page=100&page=1" 2>/dev/null)"; then
              echo "Could not list task snapshot comments for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair instead of dispatching blind."
              exit 0
            fi
            SNAP_PINNED="$(SNAP_COMMENTS_JSON="$SNAP_COMMENTS_JSON" SNAP_REF_REPO="$SNAP_REF_REPO" SNAP_REF_ISSUE="$SNAP_REF_ISSUE" SNAP_REF_GENERATION="$SNAP_REF_GENERATION" python3 -c 'import json,os,re; data=json.loads(os.environ.get("SNAP_COMMENTS_JSON") or "[]"); repo=(os.environ.get("SNAP_REF_REPO") or "").lower(); issue=os.environ.get("SNAP_REF_ISSUE") or ""; gen=os.environ.get("SNAP_REF_GENERATION") or ""; pat=re.compile(r"<!--\s*continuum-task-snapshot\s+repo=([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+)\s+issue=(\d+)\s+generation=(\d+)\s+title-sha256=([0-9a-fA-F]{64})\s+body-sha256=([0-9a-fA-F]{64})\s+spec-sha256=([0-9a-fA-F]{64})\s*-->"); trusted={"OWNER","MEMBER","COLLABORATOR"}; out=[(m.group(4).lower(),m.group(5).lower(),m.group(6).lower()) for c in data if isinstance(c,dict) for u in [c.get("user") if isinstance(c.get("user"),dict) else {}] for m in [pat.search(str(c.get("body") or ""))] if m and m.group(1).lower()==repo and m.group(2)==issue and m.group(3)==gen and (str(c.get("author_association") or "").upper() in trusted or str(u.get("login") or "").lower()=="github-actions[bot]")]; print("\n".join(out[0]) if out else "",end="")')"
            SNAP_PINNED_TITLE_SHA="$(sed -n '1p' <<<"$SNAP_PINNED")"
            SNAP_PINNED_BODY_SHA="$(sed -n '2p' <<<"$SNAP_PINNED")"
            SNAP_PINNED_SPEC_SHA="$(sed -n '3p' <<<"$SNAP_PINNED")"
            if [[ -z "$SNAP_PINNED_TITLE_SHA" || -z "$SNAP_PINNED_BODY_SHA" || -z "$SNAP_PINNED_SPEC_SHA" ]]; then
              echo "No trusted task snapshot comment found for $SNAP_REF_REPO#$SNAP_REF_ISSUE generation $SNAP_REF_GENERATION; holding repair without a verifiable contract."
              exit 0
            fi
            if [[ "$SNAP_PINNED_TITLE_SHA" != "$SNAP_REF_TITLE_SHA" || "$SNAP_PINNED_BODY_SHA" != "$SNAP_REF_BODY_SHA" || "$SNAP_PINNED_SPEC_SHA" != "$SNAP_REF_SPEC_SHA" ]]; then
              echo "PR #$PR_NUMBER snapshot reference does not match the durable task snapshot comment for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair without a verifiable contract."
              exit 0
            fi
            if ! SNAP_LIVE_JSON="$(gh api "repos/$SNAP_REF_REPO/issues/$SNAP_REF_ISSUE" --jq '{title: (.title // ""), body: (.body // "")}' 2>/dev/null)"; then
              echo "Could not verify the task snapshot for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair instead of dispatching blind."
              exit 0
            fi
            SNAP_DIGESTS="$(SNAP_LIVE_JSON="$SNAP_LIVE_JSON" python3 -c 'import hashlib,json,os,unicodedata; norm=lambda v: unicodedata.normalize("NFC", v.replace("\r\n","\n").replace("\r","\n")); data=json.loads(os.environ.get("SNAP_LIVE_JSON") or "{}"); title=norm(data.get("title") or ""); body=norm(data.get("body") or ""); title_sha=hashlib.sha256(title.encode("utf-8")).hexdigest(); body_sha=hashlib.sha256(body.encode("utf-8")).hexdigest(); spec_sha=hashlib.sha256((title_sha+":"+body_sha).encode("ascii")).hexdigest(); print(title_sha); print(body_sha); print(spec_sha)')"
            SNAP_LIVE_TITLE_SHA="$(sed -n '1p' <<<"$SNAP_DIGESTS")"
            SNAP_LIVE_BODY_SHA="$(sed -n '2p' <<<"$SNAP_DIGESTS")"
            SNAP_LIVE_SPEC_SHA="$(sed -n '3p' <<<"$SNAP_DIGESTS")"
            if [[ "$SNAP_LIVE_TITLE_SHA" != "$SNAP_REF_TITLE_SHA" || "$SNAP_LIVE_BODY_SHA" != "$SNAP_REF_BODY_SHA" || "$SNAP_LIVE_SPEC_SHA" != "$SNAP_REF_SPEC_SHA" ]]; then
              SNAP_DRIFT_MARKER="<!-- continuum-task-snapshot-drift spec=$SNAP_REF_SPEC_SHA -->"
              if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=30&page=1" --jq '.[].body' 2>/dev/null | grep -Fq "$SNAP_DRIFT_MARKER"; then
                gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                  --body "$(printf '%s\n%s\n%s\n%s' "$SNAP_DRIFT_MARKER" '⚡ **Continuum · opencode-repair**' '<!-- continuum-origin role=continuum component=opencode-repair -->' "Task contract drift detected for $SNAP_REF_REPO#$SNAP_REF_ISSUE: the live issue no longer matches this PR's pinned snapshot. Repair is held for this generation; open a new follow-up issue with an explicit dependency instead of editing the working issue.")" >/dev/null 2>&1 || true
              fi
              echo "Task contract drift detected for $SNAP_REF_REPO#$SNAP_REF_ISSUE (PR #$PR_NUMBER); repair held."
              exit 0
            fi
            echo "Task snapshot verified for $SNAP_REF_REPO#$SNAP_REF_ISSUE before repair dispatch for PR #$PR_NUMBER."
          else
            echo "PR #$PR_NUMBER carries no task snapshot reference (legacy, pre-guard PR); repair proceeds explicitly without drift protection."
          fi

          gh label create "$CI_REPAIR_LABEL" --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "One automatic OpenCode CI repair attempt per failing PR head." \
            --force >/dev/null

          # GitHub keeps only one running and one pending run per concurrency
          # group: a burst of completions for the same head can replace a
          # pending controller run. Each run therefore reconciles the LATEST
          # state of every approved workflow at the head instead of acting only
          # on its own event. Whichever event survives the queue repairs a real
          # failure or processes the green lock decision, so a superseded event
          # cannot silently suppress the P1 repair guarantee.
          if [[ "$REPORTED_CONCLUSION" != "success" && "$REPORTED_CONCLUSION" != "failure" && "$REPORTED_CONCLUSION" != "timed_out" ]]; then
            echo "Conclusion '$REPORTED_CONCLUSION' is not a repairable CI failure; ignoring."
            exit 0
          fi

          runs_json=""
          runs_trusted=0
          if runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REPORTED_HEAD_SHA&event=pull_request&per_page=100" 2>/dev/null)"; then
            runs_trusted=1
          fi
          # The latest-state classification is shared with the other
          # admission path through the committed state helper; only the
          # action taken below is path-specific.
          state_output="$(printf '%s' "$runs_json" | python3 -B "$REPAIR_STATE_HELPER" \
            --runs-trusted "$runs_trusted" \
            --allowed-workflows "$CI_REPAIR_WORKFLOWS" \
            --own-name "__reported__" \
            --own-id "$REPORTED_RUN_ID" \
            --own-conclusion "$REPORTED_CONCLUSION" \
            --own-force)"
          state="$(sed -n '1p' <<<"$state_output")"
          failing_run_id="$(sed -n '2p' <<<"$state_output")"
          failing_name="$(sed -n '3p' <<<"$state_output")"

          case "$state" in
            failure)
              if grep -Fxq "$CI_REPAIR_LABEL" <<<"$PR_LABELS"; then
                echo "An automatic CI repair was already attempted for this exact PR head; waiting for a new head or a successful rerun."
                exit 0
              fi
              echo "Latest approved workflow '$failing_name' failed for $REPORTED_HEAD_SHA; dispatching its repair."
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
                -f "labels[]=$CI_REPAIR_LABEL" >/dev/null
              if ! gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches" \
                -f ref=main \
                -f "inputs[mode]=ci-fix" \
                -f "inputs[pr_number]=$PR_NUMBER" \
                -f "inputs[head_ref]=$head_ref" \
                -f "inputs[run_id]=${failing_run_id:-$REPORTED_RUN_ID}"; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$CI_REPAIR_LABEL" \
                  >/dev/null 2>&1 || true
                echo "::error::Failed to dispatch OpenCode repair for reported CI run; lock cleared for retry."
                exit 1
              fi
              ;;
            green)
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$CI_REPAIR_LABEL" \
                >/dev/null 2>&1 || true
              echo "All approved workflows passed for $REPORTED_HEAD_SHA; repair lock cleared and auto-merge reconciler woken."
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$AUTO_MERGE_WORKFLOW/dispatches" \
                -f ref=main >/dev/null
              ;;
            inflight)
              echo "Another approved workflow is still in flight for $REPORTED_HEAD_SHA; keeping repair lock '$CI_REPAIR_LABEL'."
              if [[ "$REPORTED_CONCLUSION" == "success" ]]; then
                gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$AUTO_MERGE_WORKFLOW/dispatches" \
                  -f ref=main >/dev/null
              fi
              ;;
            unknown)
              echo "Could not verify current approved workflow state for $REPORTED_HEAD_SHA; keeping repair lock '$CI_REPAIR_LABEL'."
              if [[ "$REPORTED_CONCLUSION" == "success" ]]; then
                gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/$AUTO_MERGE_WORKFLOW/dispatches" \
                  -f ref=main >/dev/null
              fi
              ;;
            *)
              echo "No approved workflow result is known for $REPORTED_HEAD_SHA; nothing to reconcile."
              ;;
          esac

  ci-repair:
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout shared CI repair state classifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref || 'main' }}
          path: .continuum-repair-engine
          fetch-depth: 1
          persist-credentials: false
          token: ''
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/opencode_repair_state.py
            src/continuum

      - name: Dispatch one automatic OpenCode fix for failed blocking workflow
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          REPAIR_STATE_HELPER: ${{ github.workspace }}/.continuum-repair-engine/.github/scripts/opencode_repair_state.py
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_REPAIR_LABEL: ${{ inputs.ci_repair_label || vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
          AUTO_MERGE_WORKFLOW: ${{ inputs.auto_merge_workflow || vars.CONTINUUM_AUTO_MERGE_WORKFLOW || 'continuum-auto-merge.yml' }}
          OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow || vars.CONTINUUM_OPENCODE_WORKFLOW || 'continuum-opencode.yml' }}
          CI_REPAIR_WORKFLOWS: ${{ inputs.ci_repair_workflows || vars.CONTINUUM_CI_REPAIR_WORKFLOWS || 'CI' }}
        run: |
          set -euo pipefail

          # The caller already excludes its own completion in the
          # workflow_run filter. Keep a second, configuration-independent
          # guard here so a broad or mistaken allow-list can never make this
          # controller repair its own run in a loop.
          if [[ "$RUN_NAME" == "OpenCode repair controller" ]]; then
            echo "Workflow '$RUN_NAME' is this controller itself; refusing a recursive repair."
            exit 0
          fi

          # The caller wakes this controller on the broad workflow_run glob
          # because an event filter cannot read repository variables. This
          # admission is therefore the authoritative allow-list: only a
          # workflow whose exact name appears in the configured set may repair
          # its own run. CI stays the default so an unconfigured consumer keeps
          # its previous behaviour. Matching is exact and case-sensitive; a
          # workflow can never authorize itself.
          #
          # An unapproved completion is not discarded before reconciliation:
          # GitHub may have replaced an approved failure's controller run in the
          # single pending concurrency slot, so the surviving event must still
          # be allowed to notice that approved failure. The allow-list below
          # still decides which runs may be repaired, so this never authorizes
          # the unapproved workflow's own run.
          repairable=no
          while IFS= read -r candidate; do
            candidate="${candidate#"${candidate%%[![:space:]]*}"}"
            candidate="${candidate%"${candidate##*[![:space:]]}"}"
            [[ -z "$candidate" ]] && continue
            if [[ "$candidate" == "$RUN_NAME" ]]; then
              repairable=yes
              break
            fi
          done < <(printf '%s\n' "$CI_REPAIR_WORKFLOWS" | tr ',' '\n')
          if [[ "$repairable" != "yes" ]]; then
            echo "Workflow '$RUN_NAME' is not in the approved repair set; it cannot repair its own run but may still wake reconciliation of an approved failure."
          fi
          if [[ "$CONCLUSION" != "success" && "$CONCLUSION" != "failure" && "$CONCLUSION" != "timed_out" ]]; then
            echo "Conclusion '$CONCLUSION' for '$RUN_NAME' is not repairable; nothing to repair."
            exit 0
          fi
          lock_label="$CI_REPAIR_LABEL"
          lock_description="One automatic OpenCode CI repair attempt per failing PR head."

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_HEAD_SHA/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '[.[] | select(.state == "open") | select(.base.ref == "main")][0].number // empty')
          [[ -n "$pr" ]] || {
            echo "No open PR found for $RUN_NAME head $RUN_HEAD_SHA; nothing to repair."
            exit 0
          }

          # One pulls.get serves the guards plus the lock check below: the
          # PR representation already carries labels (#254).
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")" || PR_JSON='{}'
          read -r head_ref head_sha head_repo < <(
            jq -r '[.head.ref, .head.sha, .head.repo.full_name] | @tsv' <<<"$PR_JSON"
          )
          PR_LABELS="$(jq -r '[.labels[]?.name? // empty][]?' <<<"$PR_JSON" 2>/dev/null || true)"

          # Generated OpenCode PRs use opencode/*; some existing Continuum
          # implementation PRs use other branch names. Recognize those by the
          # authoritative task-context marker, not by a mutable branch prefix.
          # Keep the same-repository and exact-head guards below.
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #$pr is from a different repository; ignoring."
            exit 0
          fi
          if [[ "$head_ref" != opencode/* ]]; then
            task_marker_valid="$(jq -r --arg repo "$GITHUB_REPOSITORY" '
              (.body // "") as $body |
              ($body | capture("<!--\\s*continuum-task-context\\s+repo=(?<repo>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\\s+issue=(?<issue>[0-9]+)\\s*-->")? // {}) as $marker |
              if $marker.repo == $repo and (($marker.issue // "0" | tonumber) > 0)
              then "true" else "false" end
            ' <<<"$PR_JSON")"
            if [[ "$task_marker_valid" != "true" ]]; then
              echo "PR #$pr has neither an OpenCode branch nor a valid same-repository Continuum task marker; ignoring."
              exit 0
            fi
          fi

          if [[ "$head_sha" != "$RUN_HEAD_SHA" ]]; then
            echo "$RUN_NAME run $RUN_ID is stale; PR #$pr has already advanced to $head_sha."
            exit 0
          fi

          # kodmial/continuum#295: frozen task-spec guard before repair
          # dispatch. Same contract as the reporter path above: the durable
          # snapshot comment is authoritative, the PR reference must match
          # it, and the live issue is re-read. Drift (or an unverifiable
          # contract) holds the dispatch with a deduplicated diagnostic,
          # and legacy PRs proceed explicitly unprotected.
          SNAPSHOT_PR_BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"
          SNAPSHOT_REF="$(grep -oE '<!--[[:space:]]*continuum-task-snapshot-ref[^>]*-->' <<<"$SNAPSHOT_PR_BODY" | head -n 1 || true)"
          if [[ -n "$SNAPSHOT_REF" ]]; then
            SNAP_REF_REPO="$(sed -nE 's/.*repo=([A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            SNAP_REF_ISSUE="$(sed -nE 's/.*issue=([0-9]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            SNAP_REF_TITLE_SHA="$(sed -nE 's/.*title-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_BODY_SHA="$(sed -nE 's/.*body-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_SPEC_SHA="$(sed -nE 's/.*spec-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
            SNAP_REF_GENERATION="$(sed -nE 's/.*generation=([0-9]+).*/\1/p' <<<"$SNAPSHOT_REF" | head -n 1)"
            if [[ -z "$SNAP_REF_REPO" || -z "$SNAP_REF_ISSUE" || -z "$SNAP_REF_TITLE_SHA" || -z "$SNAP_REF_BODY_SHA" || -z "$SNAP_REF_SPEC_SHA" || -z "$SNAP_REF_GENERATION" ]]; then
              echo "PR #$pr snapshot reference is malformed; holding repair without a verifiable contract."
              exit 0
            fi
            if [[ "$SNAP_REF_GENERATION" != "1" ]]; then
              echo "PR #$pr snapshot reference is for generation $SNAP_REF_GENERATION, expected generation 1 (stale contract); holding repair."
              exit 0
            fi
            # The PR body is mutable, so the reference alone never defines
            # the contract: require it to match the durable snapshot comment
            # before comparing live text.
            if ! SNAP_COMMENTS_JSON="$(gh api "repos/$SNAP_REF_REPO/issues/$SNAP_REF_ISSUE/comments?per_page=100&page=1" 2>/dev/null)"; then
              echo "Could not list task snapshot comments for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair instead of dispatching blind."
              exit 0
            fi
            SNAP_PINNED="$(SNAP_COMMENTS_JSON="$SNAP_COMMENTS_JSON" SNAP_REF_REPO="$SNAP_REF_REPO" SNAP_REF_ISSUE="$SNAP_REF_ISSUE" SNAP_REF_GENERATION="$SNAP_REF_GENERATION" python3 -c 'import json,os,re; data=json.loads(os.environ.get("SNAP_COMMENTS_JSON") or "[]"); repo=(os.environ.get("SNAP_REF_REPO") or "").lower(); issue=os.environ.get("SNAP_REF_ISSUE") or ""; gen=os.environ.get("SNAP_REF_GENERATION") or ""; pat=re.compile(r"<!--\s*continuum-task-snapshot\s+repo=([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+)\s+issue=(\d+)\s+generation=(\d+)\s+title-sha256=([0-9a-fA-F]{64})\s+body-sha256=([0-9a-fA-F]{64})\s+spec-sha256=([0-9a-fA-F]{64})\s*-->"); trusted={"OWNER","MEMBER","COLLABORATOR"}; out=[(m.group(4).lower(),m.group(5).lower(),m.group(6).lower()) for c in data if isinstance(c,dict) for u in [c.get("user") if isinstance(c.get("user"),dict) else {}] for m in [pat.search(str(c.get("body") or ""))] if m and m.group(1).lower()==repo and m.group(2)==issue and m.group(3)==gen and (str(c.get("author_association") or "").upper() in trusted or str(u.get("login") or "").lower()=="github-actions[bot]")]; print("\n".join(out[0]) if out else "",end="")')"
            SNAP_PINNED_TITLE_SHA="$(sed -n '1p' <<<"$SNAP_PINNED")"
            SNAP_PINNED_BODY_SHA="$(sed -n '2p' <<<"$SNAP_PINNED")"
            SNAP_PINNED_SPEC_SHA="$(sed -n '3p' <<<"$SNAP_PINNED")"
            if [[ -z "$SNAP_PINNED_TITLE_SHA" || -z "$SNAP_PINNED_BODY_SHA" || -z "$SNAP_PINNED_SPEC_SHA" ]]; then
              echo "No trusted task snapshot comment found for $SNAP_REF_REPO#$SNAP_REF_ISSUE generation $SNAP_REF_GENERATION; holding repair without a verifiable contract."
              exit 0
            fi
            if [[ "$SNAP_PINNED_TITLE_SHA" != "$SNAP_REF_TITLE_SHA" || "$SNAP_PINNED_BODY_SHA" != "$SNAP_REF_BODY_SHA" || "$SNAP_PINNED_SPEC_SHA" != "$SNAP_REF_SPEC_SHA" ]]; then
              echo "PR #$pr snapshot reference does not match the durable task snapshot comment for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair without a verifiable contract."
              exit 0
            fi
            if ! SNAP_LIVE_JSON="$(gh api "repos/$SNAP_REF_REPO/issues/$SNAP_REF_ISSUE" --jq '{title: (.title // ""), body: (.body // "")}' 2>/dev/null)"; then
              echo "Could not verify the task snapshot for $SNAP_REF_REPO#$SNAP_REF_ISSUE; holding repair instead of dispatching blind."
              exit 0
            fi
            SNAP_DIGESTS="$(SNAP_LIVE_JSON="$SNAP_LIVE_JSON" python3 -c 'import hashlib,json,os,unicodedata; norm=lambda v: unicodedata.normalize("NFC", v.replace("\r\n","\n").replace("\r","\n")); data=json.loads(os.environ.get("SNAP_LIVE_JSON") or "{}"); title=norm(data.get("title") or ""); body=norm(data.get("body") or ""); title_sha=hashlib.sha256(title.encode("utf-8")).hexdigest(); body_sha=hashlib.sha256(body.encode("utf-8")).hexdigest(); spec_sha=hashlib.sha256((title_sha+":"+body_sha).encode("ascii")).hexdigest(); print(title_sha); print(body_sha); print(spec_sha)')"
            SNAP_LIVE_TITLE_SHA="$(sed -n '1p' <<<"$SNAP_DIGESTS")"
            SNAP_LIVE_BODY_SHA="$(sed -n '2p' <<<"$SNAP_DIGESTS")"
            SNAP_LIVE_SPEC_SHA="$(sed -n '3p' <<<"$SNAP_DIGESTS")"
            if [[ "$SNAP_LIVE_TITLE_SHA" != "$SNAP_REF_TITLE_SHA" || "$SNAP_LIVE_BODY_SHA" != "$SNAP_REF_BODY_SHA" || "$SNAP_LIVE_SPEC_SHA" != "$SNAP_REF_SPEC_SHA" ]]; then
              SNAP_DRIFT_MARKER="<!-- continuum-task-snapshot-drift spec=$SNAP_REF_SPEC_SHA -->"
              if ! gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments?per_page=30&page=1" --jq '.[].body' 2>/dev/null | grep -Fq "$SNAP_DRIFT_MARKER"; then
                gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
                  --body "$(printf '%s\n%s\n%s\n%s' "$SNAP_DRIFT_MARKER" '⚡ **Continuum · opencode-repair**' '<!-- continuum-origin role=continuum component=opencode-repair -->' "Task contract drift detected for $SNAP_REF_REPO#$SNAP_REF_ISSUE: the live issue no longer matches this PR's pinned snapshot. Repair is held for this generation; open a new follow-up issue with an explicit dependency instead of editing the working issue.")" >/dev/null 2>&1 || true
              fi
              echo "Task contract drift detected for $SNAP_REF_REPO#$SNAP_REF_ISSUE (PR #$pr); repair held."
              exit 0
            fi
            echo "Task snapshot verified for $SNAP_REF_REPO#$SNAP_REF_ISSUE before repair dispatch for PR #$pr."
          else
            echo "PR #$pr carries no task snapshot reference (legacy, pre-guard PR); repair proceeds explicitly without drift protection."
          fi

          gh label create "$lock_label" --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "$lock_description" \
            --force >/dev/null

          # GitHub keeps only one running and one pending run per concurrency
          # group: a burst of completions for the same head can replace a
          # pending controller run. Each admitted run therefore reconciles the
          # LATEST state of every approved workflow at the head instead of
          # acting only on its own event. Whichever event survives the queue
          # repairs a real failure or processes the green lock decision, so a
          # superseded event cannot silently suppress the P1 repair guarantee.
          runs_json=""
          runs_trusted=0
          if runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RUN_HEAD_SHA&event=pull_request&per_page=100" 2>/dev/null)"; then
            runs_trusted=1
          fi
          # The latest-state classification is shared with the other
          # admission path through the committed state helper; only the
          # action taken below is path-specific.
          state_output="$(printf '%s' "$runs_json" | python3 -B "$REPAIR_STATE_HELPER" \
            --runs-trusted "$runs_trusted" \
            --allowed-workflows "$CI_REPAIR_WORKFLOWS" \
            --own-name "$RUN_NAME" \
            --own-id "$RUN_ID" \
            --own-conclusion "$CONCLUSION")"
          state="$(sed -n '1p' <<<"$state_output")"
          failing_run_id="$(sed -n '2p' <<<"$state_output")"
          failing_name="$(sed -n '3p' <<<"$state_output")"

          case "$state" in
            failure)
              if grep -Fxq "$lock_label" <<<"$PR_LABELS"; then
                echo "An automatic $RUN_NAME repair was already attempted for this exact PR head; waiting for a new head or a successful rerun."
                exit 0
              fi
              echo "Latest approved workflow '$failing_name' failed for $RUN_HEAD_SHA; dispatching its repair."
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/labels" \
                -f "labels[]=$lock_label" >/dev/null
              if ! gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches" \
                -f ref=main \
                -f "inputs[mode]=ci-fix" \
                -f "inputs[pr_number]=$pr" \
                -f "inputs[head_ref]=$head_ref" \
                -f "inputs[run_id]=${failing_run_id:-$RUN_ID}"; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/issues/$pr/labels/$lock_label" \
                  >/dev/null 2>&1 || true
                echo "::error::Failed to dispatch OpenCode repair for $RUN_NAME; lock cleared for retry."
                exit 1
              fi
              ;;
            green)
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$pr/labels/$lock_label" \
                >/dev/null 2>&1 || true
              echo "All approved workflows passed for $RUN_HEAD_SHA; automatic repair lock '$lock_label' cleared."
              ;;
            inflight)
              echo "$RUN_NAME passed, but another approved workflow for $RUN_HEAD_SHA is still in flight; keeping repair lock '$lock_label'."
              ;;
            unknown)
              echo "Could not verify current approved workflow state for $RUN_HEAD_SHA; keeping repair lock '$lock_label'."
              ;;
            *)
              echo "No approved workflow result is known for $RUN_HEAD_SHA; nothing to reconcile."
              ;;
          esac
