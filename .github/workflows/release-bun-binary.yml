name: Continuum release adapter - Bun binary

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact consumer commit to release
        required: true
        type: string
      package_dir:
        description: Directory containing package.json
        required: true
        type: string
      build_script:
        description: Legacy Bun package script; optional when build_argv_json is provided
        required: false
        default: ""
        type: string
      build_argv_json:
        description: Exact JSON argv array for the build command; executed without a shell
        required: false
        default: "[]"
        type: string
      build_env_json:
        description: JSON object of non-secret build environment values
        required: false
        default: "{}"
        type: string
      binary_path:
        description: Repository-relative path to the produced binary
        required: true
        type: string
      asset_name:
        description: GitHub Release asset filename
        required: true
        type: string
      tag_prefix:
        description: Prefix for immutable release tags
        required: false
        default: bun-v
        type: string
      bun_version:
        description: Bun version used to build the binary
        required: false
        default: 1.3.14
        type: string
      prerelease:
        description: Publish the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      expected_version:
        description: Optional exact output expected from the produced binary --version
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate adapter inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          BUILD_ARGV_JSON: ${{ inputs.build_argv_json }}
          BUILD_ENV_JSON: ${{ inputs.build_env_json }}
          BINARY_PATH: ${{ inputs.binary_path }}
          ASSET_NAME: ${{ inputs.asset_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::source_sha must be a full 40-character commit SHA"; exit 1; }
          [[ "$PACKAGE_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$PACKAGE_DIR" != /* ]] && [[ "$PACKAGE_DIR" != *..* ]] || { echo "::error::invalid package_dir"; exit 1; }
          [[ -z "$BUILD_SCRIPT" || "$BUILD_SCRIPT" =~ ^[A-Za-z0-9._:-]+$ ]] || { echo "::error::invalid build_script"; exit 1; }
          [[ "$BINARY_PATH" =~ ^[A-Za-z0-9._/-]+$ ]] && [[ "$BINARY_PATH" != /* ]] && [[ "$BINARY_PATH" != *..* ]] || { echo "::error::invalid binary_path"; exit 1; }
          [[ "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid asset_name"; exit 1; }
          [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid tag_prefix"; exit 1; }

          python3 - <<'PY'
          import json, os, re
          argv = json.loads(os.environ["BUILD_ARGV_JSON"])
          env = json.loads(os.environ["BUILD_ENV_JSON"])
          expected = os.environ.get("EXPECTED_VERSION", "")
          if not isinstance(argv, list) or not all(isinstance(v, str) and v for v in argv):
              raise SystemExit("build_argv_json must be a JSON array of non-empty strings")
          if not isinstance(env, dict):
              raise SystemExit("build_env_json must be a JSON object")
          key = re.compile(r"^[A-Z_][A-Z0-9_]*$")
          for name, value in env.items():
              if not isinstance(name, str) or not key.fullmatch(name):
                  raise SystemExit("invalid build environment key: %r" % (name,))
              if not isinstance(value, str):
                  raise SystemExit("build environment values must be strings")
          if not argv and not os.environ.get("BUILD_SCRIPT"):
              raise SystemExit("provide build_script or build_argv_json")
          if "\n" in expected or "\r" in expected:
              raise SystemExit("expected_version must be one line")
          PY

      - name: Checkout exact consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build standalone binary
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          BUILD_ARGV_JSON: ${{ inputs.build_argv_json }}
          BUILD_ENV_JSON: ${{ inputs.build_env_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          argv = json.loads(os.environ["BUILD_ARGV_JSON"])
          extra_env = json.loads(os.environ["BUILD_ENV_JSON"])
          if not argv:
              argv = ["bun", "run", "--cwd", os.environ["PACKAGE_DIR"], os.environ["BUILD_SCRIPT"]]
          child_env = os.environ.copy()
          child_env.update(extra_env)
          print("build argv:", json.dumps(argv))
          subprocess.run(argv, env=child_env, check=True)
          PY

      - name: Package immutable release assets
        id: meta
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
          BINARY_PATH: ${{ inputs.binary_path }}
          ASSET_NAME: ${{ inputs.asset_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          BUILD_ARGV_JSON: ${{ inputs.build_argv_json }}
        run: |
          set -euo pipefail
          test -f "$BINARY_PATH"
          chmod +x "$BINARY_PATH"
          BINARY_VERSION="$("$BINARY_PATH" --version | tr -d '\r\n')"
          if [[ -n "$EXPECTED_VERSION" && "$BINARY_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::binary version '$BINARY_VERSION' does not match expected '$EXPECTED_VERSION'"
            exit 1
          fi

          VERSION="$(bun -e 'const p = await Bun.file(process.argv[1]).json(); process.stdout.write(String(p.version ?? "0.0.0"))' "$PACKAGE_DIR/package.json")"
          [[ "$VERSION" =~ ^[0-9A-Za-z._+-]+$ ]] || { echo "::error::invalid package version: $VERSION"; exit 1; }
          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="${TAG_PREFIX}${VERSION}-${SHORT_SHA}"

          mkdir -p release
          install -m 0755 "$BINARY_PATH" "release/$ASSET_NAME"
          (
            cd release
            sha256sum "$ASSET_NAME" | tee "$ASSET_NAME.sha256"
          )

          BINARY_SHA256="$(sha256sum "release/$ASSET_NAME" | awk '{print $1}')"
          BINARY_SIZE="$(stat -c '%s' "release/$ASSET_NAME")"
          BUILD_MODE="$(python3 -c 'import json,os; print("argv" if json.loads(os.environ["BUILD_ARGV_JSON"]) else "script")')"
          cat > "release/$ASSET_NAME.json" <<EOF
          {
            "adapter": "bun-binary",
            "tag": "$TAG",
            "source_sha": "$SOURCE_SHA",
            "package_version": "$VERSION",
            "binary_version": "$BINARY_VERSION",
            "bun_version": "$(bun --version)",
            "asset": "$ASSET_NAME",
            "sha256": "$BINARY_SHA256",
            "size_bytes": $BINARY_SIZE,
            "build_mode": "$BUILD_MODE"
          }
          EOF

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$BINARY_SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$BINARY_SIZE" >> "$GITHUB_OUTPUT"
          echo "binary_version=$BINARY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Preserve release payload as Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.asset_name }}-${{ inputs.source_sha }}
          path: |
            release/${{ inputs.asset_name }}
            release/${{ inputs.asset_name }}.sha256
            release/${{ inputs.asset_name }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; treating the immutable release as complete."
            exit 0
          fi

          EXTRA=()
          [[ "$PRERELEASE" == "true" ]] && EXTRA+=(--prerelease)

          gh release create "$TAG" \
            "release/$ASSET_NAME" \
            "release/$ASSET_NAME.sha256" \
            "release/$ASSET_NAME.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$ASSET_NAME $TAG" \
            --generate-notes \
            "${EXTRA[@]}"

      - name: Release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Continuum bun-binary release"
            echo "- tag: \`${{ steps.meta.outputs.tag }}\`"
            echo "- source SHA: \`${{ inputs.source_sha }}\`"
            echo "- asset: \`${{ inputs.asset_name }}\`"
            echo "- SHA-256: \`${{ steps.meta.outputs.sha256 }}\`"
            echo "- binary version: \`${{ steps.meta.outputs.binary_version }}\`"
            echo "- size: \`${{ steps.meta.outputs.size }} bytes\`"
          } >> "$GITHUB_STEP_SUMMARY"
