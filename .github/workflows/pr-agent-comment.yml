# Continuum PR-Agent manual review commands.
#
#     /review           -> full review of the current pull request head
#     /verify <id>      -> re-check one tracked finding, e.g. /verify CRV-1A2B3C4D
#
# The repository owner is the only actor whose comment is read, and the engine
# parses the command: the body reaches a strict grammar, never a shell and never
# a workflow expression. Everything the commands decide is decided by the same
# engine the provider surface uses, so a manual run and a queued run cannot
# disagree about what a finding means.
name: Continuum PR-Agent manual review commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  parse:
    if: github.event.issue.pull_request && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      command: ${{ steps.route.outputs.command }}
      finding: ${{ steps.route.outputs.finding }}
      # An issue comment on a pull request is an event about that pull request,
      # so the number is the event's own rather than something the command
      # grammar parsed out of a body an author could shape.
      pr_number: ${{ github.event.issue.number }}
    steps:
      - name: Check out the engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: src/continuum
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Route the command through the trusted-actor contract
        id: route
        shell: bash
        env:
          CONTINUUM_COMMENT_BODY: ${{ github.event.comment.body }}
          CONTINUUM_ACTOR: ${{ github.actor }}
          CONTINUUM_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONTINUUM_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m continuum.cli command

  review:
    needs: parse
    if: needs.parse.outputs.command == 'review'
    uses: ./.github/workflows/pr-agent.yml
    # Permissions narrow down the call chain and never widen, so this job has to
    # grant the provider surface everything it needs on its own: a manual
    # `/review` publishes the same commit status a queued review publishes, and
    # a caller that cannot grant `statuses: write` would produce a green run
    # that left the merge gate with no status at all.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    with:
      pr_number: ${{ needs.parse.outputs.pr_number }}
      api_base: ${{ vars.PR_AGENT_API_BASE }}
      model: ${{ vars.PR_AGENT_MODEL }}
      max_tokens: ${{ vars.PR_AGENT_MAX_TOKENS }}
    secrets:
      continuum_token: ${{ secrets.GITHUB_TOKEN }}
      pr_agent_api_key: ${{ secrets.PR_AGENT_API_KEY }}

  verify:
    needs: parse
    if: needs.parse.outputs.command == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ needs.parse.outputs.pr_number }}
      FINDING: ${{ needs.parse.outputs.finding }}
      CONTINUUM_REVIEW_API_BASE: ${{ vars.PR_AGENT_API_BASE }}
      CONTINUUM_REVIEW_API_KEY: ${{ secrets.PR_AGENT_API_KEY }}
      CONTINUUM_REVIEW_MODEL: ${{ vars.PR_AGENT_MODEL }}
      CONTINUUM_REVIEW_MAX_TOKENS: ${{ vars.PR_AGENT_MAX_TOKENS }}
    steps:
      - name: Check out the engine and the repository configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Verify reads the provider's settings -- which reviewer, which
          # credential names, which verdict rules -- from the repository's own
          # configuration, so the full tree is what this step needs. A sparse
          # checkout of the engine alone would verify against defaults.
          persist-credentials: false

      - name: Re-check one finding against the current head
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m continuum.cli verify \
            --pr "$PR_NUMBER" \
            --finding "$FINDING"