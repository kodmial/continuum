name: Diagnose kodmaiadmin Continuum prerequisites

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'diagnose-kodmaiadmin-prerequisites'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check private consumer metadata
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Continuum TAP_PAT missing"; exit 1; }

          secrets_json="$(gh api repos/kodmial/kodmaiadmin/actions/secrets)"
          has_opencode="$(jq -r '[.secrets[].name] | index("OPENCODE_API_KEY") != null' <<<"$secrets_json")"
          has_tap="$(jq -r '[.secrets[].name] | index("TAP_PAT") != null' <<<"$secrets_json")"
          echo "OPENCODE_API_KEY configured: $has_opencode"
          echo "TAP_PAT configured: $has_tap"

          echo "Repository Actions policy:"
          gh api repos/kodmial/kodmaiadmin/actions/permissions             --jq '{enabled, allowed_actions, sha_pinning_required}'

          echo "Workflow token policy:"
          gh api repos/kodmial/kodmaiadmin/actions/permissions/workflow             --jq '{default_workflow_permissions, can_approve_pull_request_reviews}'
