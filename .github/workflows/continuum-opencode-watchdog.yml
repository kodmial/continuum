name: OpenCode watchdog

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      timeout_minutes:
        description: >-
          Job timeout for the recovery. Empty falls back to
          AUTOMATION_WATCHDOG_TIMEOUT_MINUTES.
        required: false
        type: string
        default: ''
      opencode_workflow:
        description: >-
          Optional repository-local OpenCode caller workflow (bare file name or
          `.github/workflows/...` path) that actually declares
          `workflow_dispatch`. Empty resolves the completed run's own path,
          then the known caller names; the reusable engine is never dispatched.
        required: false
        type: string
        default: ''
      watched_workflow:
        description: >-
          `name:` of the workflow whose completed runs this watchdog recovers.
          It must match the `name:` of the consumer's OpenCode caller, because
          GitHub's `workflow_run.workflows` filter matches on the workflow
          `name:` and never on a file name. The caller stub hardcodes the same
          value in its own `workflow_run:` block; this input only lets the
          engine recognise sibling runs of that workflow when it decides
          whether a retry is already in flight.
        required: false
        type: string
        default: ''
      max_recovery_retries:
        description: >-
          Automatic recovery retries before the issue is paused. Empty falls
          back to AUTOMATION_WATCHDOG_MAX_RETRIES.
        required: false
        type: string
        default: ''
      max_429_runner_restarts:
        description: >-
          Fresh-runner restarts after an OpenCode 429 marker. Empty falls back
          to AUTOMATION_WATCHDOG_MAX_429_RUNNER_RESTARTS, then 3.
        required: false
        type: string
        default: ''
      retry_marker:
        description: >-
          Hidden HTML marker counted to decide how many recovery retries an
          issue already consumed. Empty falls back to
          AUTOMATION_WATCHDOG_RETRY_MARKER.
        required: false
        type: string
        default: ''
      in_progress_label:
        description: >-
          Label holding an automation reservation. Empty falls back to
          AUTOMATION_IN_PROGRESS_LABEL. Must match the scheduler's
          in_progress_label.
        required: false
        type: string
        default: ''
      pause_marker:
        description: >-
          Label that pauses automation. Empty falls back to
          AUTOMATION_PAUSE_LABEL. Must match the scheduler's pause_marker.
        required: false
        type: string
        default: ''
      dispatch_marker:
        description: >-
          Hidden HTML marker the scheduler writes into its dispatch comments.
          Empty falls back to AUTOMATION_DISPATCH_MARKER. The watchdog uses it
          to detect that a *newer* automated attempt already owns the issue, in
          which case it stands down instead of racing that attempt.
        required: false
        type: string
        default: ''
      pause_on_failure:
        description: >-
          Whether exhausted watchdog recovery enters a terminal pause. Empty
          falls back to AUTOMATION_PAUSE_ON_FAILURE. When false, the watchdog
          leaves the reservation to the scheduler lease/backoff instead of
          requiring human intervention.
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-opencode-watchdog-${{ github.event_name == 'schedule' && 'catch-up' || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    # Capability-only: recovery is pure issue/label/comment bookkeeping, so it
    # runs anywhere. This job never checks out or executes issue code.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.AUTOMATION_WATCHDOG_TIMEOUT_MINUTES || '5') }}

    permissions:
      # Same-repository reads below run on READ_GITHUB_TOKEN (`github.token`),
      # so they honour these job permissions (unlike PAT reads): issues for
      # issues.get/listForRepo/listComments, pull-requests for pulls.list, and
      # actions for listWorkflowRunsForRepo. The caller stub must grant at
      # least the same scopes.
      actions: write
      contents: read
      issues: write
      pull-requests: read

    env:
      WATCHED_WORKFLOW: ${{ inputs.watched_workflow }}
      OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow || vars.CONTINUUM_OPENCODE_WORKFLOW }}
      DISPATCH_REF: ${{ vars.CONTINUUM_DISPATCH_REF || '' }}
      MAX_RECOVERY_RETRIES: ${{ inputs.max_recovery_retries || vars.AUTOMATION_WATCHDOG_MAX_RETRIES || '1' }}
      MAX_429_RUNNER_RESTARTS: ${{ inputs.max_429_runner_restarts || vars.AUTOMATION_WATCHDOG_MAX_429_RUNNER_RESTARTS || '3' }}
      GITHUB_API_URL: ${{ github.api_url }}
      RETRY_MARKER: ${{ inputs.retry_marker || vars.AUTOMATION_WATCHDOG_RETRY_MARKER || '<!-- opencode-watchdog-retry -->' }}
      IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
      PAUSE_LABEL: ${{ inputs.pause_marker || vars.AUTOMATION_PAUSE_LABEL || 'automation:paused' }}
      # Legacy 429 replay only follows issues the owner already admitted.
      # These are read-only admission gates; the watchdog never adds a label.
      READY_LABEL: ${{ vars.AUTOMATION_READY_LABEL }}
      BLOCKED_LABEL: ${{ vars.AUTOMATION_BLOCKED_LABEL || 'automation:blocked' }}
      QUALIFYING_LABEL: ${{ vars.AUTOMATION_QUALIFYING_LABEL || 'automation:qualifying' }}
      DISPATCH_MARKER: ${{ inputs.dispatch_marker || vars.AUTOMATION_DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->' }}
      PAUSE_ON_FAILURE: ${{ inputs.pause_on_failure || vars.AUTOMATION_PAUSE_ON_FAILURE || 'false' }}
      READ_GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Continuum watchdog routing helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kodmial/continuum
          # Pinned: this file is executed by require(); never leave it on a
          # mutable ref. Advance the pin only in the same PR that changes it.
          ref: b06bd207d8ff5ad079d14626eb10669c13d56435
          path: .continuum-watchdog-engine
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/opencode_429_dispatch.js

      - name: Recover failed OpenCode issue run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CONTINUUM_DISPATCH_HELPER: ${{ github.workspace }}/.continuum-watchdog-engine/.github/scripts/opencode_429_dispatch.js
        with:
          # TAP_PAT is intentional: the recovery writes labels and comments,
          # and only a PAT (not GITHUB_TOKEN) reliably fans those writes out
          # into the scheduler's and OpenCode's own event triggers.
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const dispatchRouting = require(process.env.CONTINUUM_DISPATCH_HELPER);
            const repoFullName = owner + '/' + repo;
            const watchedWorkflow = process.env.WATCHED_WORKFLOW || '';
            const retryMarker = process.env.RETRY_MARKER || '<!-- opencode-watchdog-retry -->';
            const inProgressLabel = process.env.IN_PROGRESS_LABEL || 'automation:in-progress';
            const pausedLabel = process.env.PAUSE_LABEL || 'automation:paused';
            const dispatchMarker = process.env.DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->';
            const pauseOnFailure =
              (process.env.PAUSE_ON_FAILURE || 'false') !== 'false';

            // Use the repository-scoped token for same-repository reads.
            // Keep the github-script action client PAT-authenticated below for
            // label/comment writes whose PAT actor intentionally fans out events.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            if (!readToken) {
              throw new Error(
                'READ_GITHUB_TOKEN is required for same-repository watchdog reads.'
              );
            }
            const readGithub = new github.constructor({
              auth: readToken,
              baseUrl: github.request.endpoint.DEFAULTS.baseUrl,
            });
            // github-script supplies the plugin-composed Octokit class, so
            // reusing its constructor keeps the `paginate`/`rest` plugins
            // (dynamically requiring `@actions/github` is not resolvable from
            // the script sandbox). Confirm the composition at runtime so a
            // future actions/github-script upgrade that returns a bare core
            // fails fast here instead of mid-recovery with
            // `readGithub.paginate is not a function`.
            if (
              typeof readGithub.paginate !== 'function' ||
              typeof readGithub.rest?.issues?.get !== 'function' ||
              typeof readGithub.rest?.issues?.listForRepo !== 'function' ||
              typeof readGithub.rest?.issues?.listComments !== 'function' ||
              typeof readGithub.rest?.pulls?.list !== 'function' ||
              typeof readGithub.rest?.actions?.listWorkflowRunsForRepo !== 'function' ||
              typeof readGithub.rest?.actions?.listWorkflowRuns !== 'function' ||
              typeof readGithub.rest?.actions?.getWorkflowRun !== 'function' ||
              typeof readGithub.rest?.actions?.listJobsForWorkflowRun !== 'function' ||
              typeof readGithub.rest?.actions?.reRunWorkflow !== 'function' ||
              typeof readGithub.rest?.git?.getRef !== 'function' ||
              typeof readGithub.rest?.repos?.get !== 'function' ||
              typeof readGithub.rest?.repos?.getContent !== 'function'
            ) {
              throw new Error(
                'readGithub client lacks the paginate/rest plugins; ' +
                'cannot perform same-repository watchdog reads.'
              );
            }
            // 429 is a runner-lifecycle failure, not an issue/task failure.
            // kodmial/continuum#290: the burned runner already evacuated
            // workflow-owned state to a durable checkpoint ref and terminated
            // (exit 75) without invoking the model again on that VM. The
            // watchdog never uses reRunWorkflow for 429 recovery: re-running
            // the same run would replay completed stages and re-spend
            // task-failure budgets. Instead it dispatches a NEW
            // workflow_dispatch carrying the explicit recovery identity
            // (operation id + checkpoint ref/SHA + stage + generation) onto
            // a fresh VM, which restores the exact checkpoint and continues
            // from the last completed stage. Deduplication is by stable
            // operation identity; 429 never consumes task/review/
            // qualification budgets, never applies automation:paused, and
            // never requires manual /oc. Repeated fresh-VM 429s enter
            // bounded infrastructure backoff and resume automatically.
            const rateLimitMarker = 'CONTINUUM_OPENCODE_429_RESTART_REQUIRED';
            const upstreamUnavailableMarker =
              'CONTINUUM_OPENCODE_UPSTREAM_UNAVAILABLE_RESTART_REQUIRED';
            const publishRaceMarker =
              'CONTINUUM_OPENCODE_PUBLISH_RACE_RETRY_REQUIRED';
            const metadataFailedMarker =
              'CONTINUUM_OPENCODE_429_RECOVERY_METADATA_FAILED';
            // Legacy claim/backoff markers remain readable so an older
            // in-flight watchdog pass cannot duplicate a resumption.
            const legacyResumptionPrefix = '<!-- continuum-429-resumption';
            const legacyBackoffPrefix = '<!-- continuum-429-backoff';
            // Evacuation line written by the workflow-owned 429 evacuator:
            // "Evacuated 429 checkpoint <ref> at exact SHA <sha> (operation
            // <op>, stage <stage>, generation <gen>, mode <mode>, issue <i>,
            // pr <p>, branch <b>)."
            const evacuatedRe =
              /Evacuated (?:429|infrastructure) checkpoint (\S+) at exact SHA ([0-9a-f]{40}) \(operation (\S+), stage (\S+), generation (\d+), mode (\S+), issue ([^,]*), pr ([^,]*), branch ([^)]*)\)/;
            const metadataFailedRe =
              /CONTINUUM_OPENCODE_429_RECOVERY_METADATA_FAILED operation=(\S+) generation=(\d+) stage=(\S*) mode=(\S*) issue=(\S*) pr=(\S*) salvage_ref=(\S*) reason=(.*)$/;
            function parseMetadataFailure(logText) {
              for (const line of String(logText || '').split('\n')) {
                const match = line.match(metadataFailedRe);
                if (!match) continue;
                const clean = (value) => (value === '-' ? '' : value);
                return {
                  operationId: match[1],
                  generation: Number.parseInt(match[2], 10),
                  stage: clean(match[3]),
                  mode: clean(match[4]),
                  issueNumber: clean(match[5]),
                  prNumber: clean(match[6]),
                  salvageRef: clean(match[7]),
                  reason: (match[8] || '').trim(),
                };
              }
              return null;
            }
            const max429Restarts = Number.parseInt(
              process.env.MAX_429_RUNNER_RESTARTS || '3',
              10
            );
            if (!Number.isInteger(max429Restarts) || max429Restarts < 0) {
              throw new Error(
                'Invalid MAX_429_RUNNER_RESTARTS: ' +
                process.env.MAX_429_RUNNER_RESTARTS
              );
            }

            // kodmial/continuum#290: fresh-VM 429 resumption. Dispatches a NEW
            // workflow_dispatch carrying the explicit recovery identity onto
            // a fresh VM. Never reRunWorkflow (that would replay completed
            // stages on the same run), never consumes task/review/
            // qualification budgets, never applies automation:paused, never
            // requires manual /oc. Identity and numbers only: repository
            // names never enter logs or comments, so public Parent logs keep
            // Child identities opaque.
            function recoveryStateMarker({
              operation, generation, state, checkpointRef, checkpointSha,
              runId, attempt, nextDue, detail,
            }) {
              const clean = (value, fallback) => {
                const text = String(value || '').trim().replace(/[\s"<>]+/g, '-');
                return text || (fallback || '-');
              };
              return '<!-- continuum-429-recovery op=' + clean(operation, 'unknown') +
                ' gen=' + Math.max(0, Number(generation) || 0) +
                ' state=' + clean(state) +
                ' attempt=' + Math.max(0, Number(attempt) || 0) +
                ' next_due=' + Math.max(0, Number(nextDue) || 0) +
                ' checkpoint=' + clean(checkpointRef) +
                ' sha=' + clean(checkpointSha) +
                ' run=' + clean(runId) +
                ' detail=' + clean(detail) + ' -->';
            }

            function parseRecoveryStates(body, operation, generation) {
              const re = /<!--\s*continuum-429-recovery\s+op=(\S+)\s+gen=(\d+)\s+state=(\S+)\s+attempt=(\d+)\s+next_due=(\d+)\s+checkpoint=(\S*)\s+sha=(\S*)\s+run=(\S*)\s+detail=(\S*)\s*-->/g;
              const text = String(body || '');
              const found = [];
              let match;
              while ((match = re.exec(text)) !== null) {
                if (match[1] !== operation || Number(match[2]) !== Number(generation)) continue;
                found.push({
                  operation: match[1],
                  generation: Number(match[2]),
                  state: match[3],
                  attempt: Number(match[4]),
                  nextDue: Number(match[5]),
                  checkpointRef: match[6] === '-' ? '' : match[6],
                  checkpointSha: match[7] === '-' ? '' : match[7],
                  runId: match[8] === '-' ? '' : match[8],
                  detail: match[9] === '-' ? '' : match[9],
                });
              }
              return found;
            }

            async function listThreadComments(threadNumber) {
              if (!Number.isInteger(threadNumber) || threadNumber <= 0) return [];
              return readGithub.paginate(
                readGithub.rest.issues.listComments,
                { owner, repo, issue_number: threadNumber, per_page: 100 }
              );
            }

            function latestRecoveryState(comments, operation, generation) {
              const all = [];
              for (const comment of comments) {
                for (const state of parseRecoveryStates(
                  comment.body || '', operation, generation
                )) {
                  all.push({ ...state, commentId: Number(comment.id || 0) });
                }
              }
              return all.length ? all[all.length - 1] : null;
            }

            function recoveryCommentBody(marker, summary) {
              return [
                marker,
                '⚡ **Continuum · opencode-watchdog**',
                '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                summary,
              ].join('\n');
            }

            async function recordRecoveryState({
              threadNumber, operation, generation, state, checkpointRef,
              checkpointSha, runId, attempt, nextDue, detail, summary,
              fresh = false,
            }) {
              if (!Number.isInteger(threadNumber) || threadNumber <= 0) return null;
              const marker = recoveryStateMarker({
                operation, generation, state, checkpointRef, checkpointSha,
                runId, attempt, nextDue, detail,
              });
              const body = recoveryCommentBody(marker, summary);
              // A claim must be a brand-new comment so concurrent passes get
              // distinct ids; every other update coalesces onto the existing
              // durable state comment for this exact operation+generation.
              const comments = fresh ? [] : await listThreadComments(threadNumber);
              // Match the machine-readable marker exactly (same operation and
              // arithmetic generation), never an unanchored substring: a
              // `gen=1` lookup must not update a `gen=10` comment.
              const existing = comments
                .filter(comment => parseRecoveryStates(
                  comment.body || '', operation, generation
                ).length > 0)
                .sort((a, b) => Number(a.id || 0) - Number(b.id || 0));
              if (existing.length) {
                const latest = existing[existing.length - 1];
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: latest.id, body,
                });
                return latest;
              }
              const created = await github.rest.issues.createComment({
                owner, repo, issue_number: threadNumber, body,
              });
              return created.data;
            }

            // kodmial/continuum#350: the pre-dispatch claim must be a fresh
            // comment so concurrent passes get distinct ids. Two passes can
            // read the same previous state and both reach dispatch; the lower
            // comment id wins, the loser deletes its own claim and stands
            // down, exactly like the original exactly-once fence.
            async function createRecoveryClaim({
              threadNumber, operation, generation, checkpointRef, checkpointSha,
              attempt, nextDue, summary,
            }) {
              return recordRecoveryState({
                threadNumber, operation, generation, state: 'claimed',
                checkpointRef, checkpointSha, runId: '', attempt, nextDue,
                detail: 'dispatch-starting', summary, fresh: true,
              });
            }

            async function holdsRecoveryClaim(claim, {
              threadNumber, operation, generation, attempt,
            }) {
              if (!claim) return true;
              if (!Number.isInteger(threadNumber) || threadNumber <= 0) return true;
              const comments = await listThreadComments(threadNumber);
              const claimIds = [];
              for (const comment of comments) {
                const states = parseRecoveryStates(
                  comment.body || '', operation, generation
                );
                // Any same-attempt marker (claimed, accepted, observed) is a
                // competing claim. A failed dispatch is retryable and must not
                // block another pass.
                const isCurrentClaim = states.some(state =>
                  state.attempt === attempt &&
                  state.state !== 'dispatch-failed'
                );
                if (isCurrentClaim) claimIds.push(Number(comment.id || 0));
              }
              claimIds.sort((a, b) => a - b);
              return claimIds.length > 0 &&
                claimIds[0] === Number(claim.id || 0);
            }

            async function deleteRecoveryClaim(claim) {
              if (!claim) return;
              try {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: claim.id,
                });
              } catch (err) {
                core.warning(
                  'OpenCode infrastructure recovery claim cleanup failed: ' +
                  (err.message || err)
                );
              }
            }

            function validateRecoveryMetadata(identity, expected) {
              if (!identity || typeof identity !== 'object' || Array.isArray(identity)) {
                return 'recovery metadata is not an object';
              }
              if (Number(identity.schema_version) !== 1) {
                return 'recovery metadata schema version is unsupported';
              }
              for (const field of [
                'operation_id', 'failure_kind', 'generation', 'stage', 'mode',
                'issue_number', 'pr_number', 'head_ref', 'base_sha', 'head_sha',
                'branch', 'checkpoint_ref',
              ]) {
                if (!(field in identity)) return 'recovery metadata is missing ' + field;
              }
              if (String(identity.operation_id) !== expected.operation) {
                return 'recovery metadata operation mismatch';
              }
              if (Number(identity.generation) !== Number(expected.generation)) {
                return 'recovery metadata generation mismatch';
              }
              if (String(identity.stage) !== expected.stage) {
                return 'recovery metadata stage mismatch';
              }
              if (String(identity.mode) !== expected.mode) {
                return 'recovery metadata mode mismatch';
              }
              if (String(identity.issue_number || '') !== String(expected.issueNumber || '')) {
                return 'recovery metadata issue mismatch';
              }
              if (String(identity.pr_number || '') !== String(expected.prNumber || '')) {
                return 'recovery metadata PR mismatch';
              }
              if (String(identity.checkpoint_ref || '') !== expected.checkpointRef) {
                return 'recovery metadata checkpoint ref mismatch';
              }
              if (!/^[0-9a-f]{40}$/i.test(String(identity.head_sha || ''))) {
                return 'recovery metadata head SHA is malformed';
              }
              if (!String(identity.head_ref || '').trim()) {
                return 'recovery metadata head ref is empty';
              }
              if (!['issue', 'qualification', 'coderabbit-fix', 'resolve-conflict', 'ci-fix'].includes(expected.mode)) {
                return 'recovery metadata mode is not dispatchable';
              }
              if (expected.mode === 'issue' && !/^[0-9]+$/.test(String(expected.issueNumber || ''))) {
                return 'recovery metadata issue mode requires an issue number';
              }
              return '';
            }

            async function readCheckpointMetadata({
              operation, generation, checkpointRef, checkpointSha,
            }) {
              const pointerSha = String(checkpointSha || '').trim().toLowerCase();
              let refSha = '';
              let refError = null;
              // Resolve the durable ref first. The ref tip, not a possibly
              // stale event pointer, is what a fresh runner can actually
              // fetch. A transient 404 is retried (eventual visibility), but
              // a ref that never appears is a provably missing checkpoint.
              for (let attempt = 0; attempt < 7; attempt += 1) {
                try {
                  const refResponse = await readGithub.rest.git.getRef({
                    owner, repo, ref: 'heads/' + checkpointRef,
                  });
                  refSha = String(refResponse.data.object.sha || '').toLowerCase();
                  refError = null;
                  break;
                } catch (err) {
                  refError = err;
                  const status = Number(err && err.status || 0);
                  if (status !== 404) {
                    return {
                      ok: false,
                      kind: status === 401 || status === 403 ? 'auth' : 'transient',
                      status,
                      reason: String(err && err.message || err),
                      exactSha: pointerSha,
                      stalePointer: false,
                    };
                  }
                  if (attempt < 6) {
                    await new Promise(resolve => setTimeout(resolve, 1000 * Math.pow(2, attempt)));
                  }
                }
              }
              if (!refSha) {
                return {
                  ok: false,
                  kind: 'missing',
                  status: Number(refError && refError.status || 0),
                  reason: 'checkpoint ref ' + checkpointRef + ' is not visible',
                  exactSha: pointerSha,
                  stalePointer: false,
                };
              }
              // The event pointer can be stale after a duplicate evacuation
              // force-updated the same generation. The ref tip is newer and
              // reviewable, so prefer it; record the mismatch for operators.
              const exactSha = refSha;
              const stalePointer = Boolean(pointerSha) && pointerSha !== refSha;
              try {
                const content = await readGithub.rest.repos.getContent({
                  owner, repo, path: '.continuum-429-recovery.json', ref: exactSha,
                });
                if (Array.isArray(content.data) || content.data.type !== 'file') {
                  return {
                    ok: false, kind: 'invalid',
                    reason: 'recovery metadata is not a file',
                    exactSha, stalePointer,
                  };
                }
                const identity = JSON.parse(
                  Buffer.from(content.data.content, 'base64').toString('utf8')
                );
                return { ok: true, identity, exactSha, stalePointer };
              } catch (err) {
                const status = Number(err && err.status || 0);
                // The commit is known (the ref resolved), so a 404 here
                // proves the metadata file is absent rather than merely
                // still becoming visible.
                let kind = 'transient';
                if (status === 404 || status === 422) kind = 'missing';
                else if (status === 401 || status === 403) kind = 'auth';
                return {
                  ok: false,
                  kind,
                  status,
                  reason: String(err && err.message || err),
                  exactSha,
                  stalePointer,
                };
              }
            }

            // Read the legacy issue checkpoint, if present, and bind it to the
            // expected 429 operation+generation. Any difference (different
            // tip, other issue, metadata present, missing stage file) fails
            // closed: the raw refs are preserved and no replay is dispatched.
            async function inspectLegacy429Checkpoint({
              operation, generation, checkpointRef, checkpointSha, issueNumber,
            }) {
              const issue = String(issueNumber || '').trim();
              if (!/^[0-9]+$/.test(issue)) {
                return { ok: false, reason: 'legacy checkpoint is not issue scoped' };
              }
              const parsed = parseCheckpointRef(checkpointRef);
              if (
                !parsed ||
                parsed.operationId !== operation ||
                parsed.generation !== Number(generation)
              ) {
                return { ok: false, reason: 'checkpoint ref does not match operation/generation' };
              }
              const legacyRef = legacyIssueCheckpointRef(issue);
              const pointerSha = String(checkpointSha || '').trim().toLowerCase();
              let legacySha = '';
              for (let attempt = 0; attempt < 7; attempt += 1) {
                try {
                  const response = await readGithub.rest.git.getRef({
                    owner, repo, ref: 'heads/' + legacyRef,
                  });
                  legacySha = String(response.data.object.sha || '').toLowerCase();
                  break;
                } catch (err) {
                  const status = Number(err && err.status || 0);
                  if (status !== 404) {
                    return { ok: false, reason: 'legacy-ref-http-' + (status || 'unknown') };
                  }
                  if (attempt < 6) {
                    await new Promise(resolve => setTimeout(
                      resolve, 1000 * Math.pow(2, attempt)
                    ));
                  }
                }
              }
              if (!legacySha) {
                return { ok: false, reason: 'legacy-ref-missing' };
              }
              let stageFileContent = '';
              try {
                const content = await readGithub.rest.repos.getContent({
                  owner, repo, path: '.continuum-429-stage', ref: legacySha,
                });
                if (Array.isArray(content.data) || content.data.type !== 'file') {
                  return { ok: false, reason: 'legacy-stage-is-not-a-file' };
                }
                stageFileContent = Buffer.from(
                  content.data.content || '', 'base64'
                ).toString('utf8');
              } catch (err) {
                const status = Number(err && err.status || 0);
                // Absence of the optional progress line must not block a
                // provable legacy checkpoint; other read failures do.
                if (status !== 404 && status !== 422) {
                  return { ok: false, reason: 'legacy-stage-http-' + (status || 'unknown') };
                }
                stageFileContent = '';
              }
              let metadataPresent = false;
              try {
                await readGithub.rest.repos.getContent({
                  owner, repo, path: '.continuum-429-recovery.json', ref: legacySha,
                });
                metadataPresent = true;
              } catch (err) {
                const status = Number(err && err.status || 0);
                if (status !== 404 && status !== 422) {
                  return { ok: false, reason: 'legacy-metadata-http-' + (status || 'unknown') };
                }
              }
              return bindLegacy429Checkpoint({
                issueNumber: issue,
                legacyRef,
                legacySha,
                checkpointRefs: [{
                  ref: checkpointRef,
                  sha: pointerSha,
                }],
                stageFileContent,
                metadataPresent,
              });
            }

            async function findActiveIssueRun({ target, issueNumber }) {
              const title = 'OpenCode issue #' + String(issueNumber);
              try {
                const runs = await readGithub.paginate(
                  readGithub.rest.actions.listWorkflowRuns,
                  {
                    owner, repo, workflow_id: target.workflowId,
                    per_page: 50,
                  }
                );
                return runs.find(candidate => {
                  if (candidate.status === 'completed') return false;
                  if (candidate.path && candidate.path !== target.path) return false;
                  return candidate.display_title === title;
                }) || null;
              } catch (err) {
                core.warning(
                  'OpenCode legacy recovery could not inspect active runs for issue #' +
                  issueNumber + ': ' + (err.message || err)
                );
                return null;
              }
            }

            async function legacyRecoveryAdmission(issueNumber) {
              const { data: issue } = await readGithub.rest.issues.get({
                owner, repo, issue_number: issueNumber,
              });
              const labels = (issue.labels || []).map(label =>
                typeof label === 'string' ? label : label && label.name
              );
              let openIssuePullRequests = false;
              try {
                const pulls = await readGithub.paginate(
                  readGithub.rest.pulls.list,
                  { owner, repo, state: 'open', per_page: 100 }
                );
                const prefix = 'opencode/issue' + issueNumber + '-';
                openIssuePullRequests = pulls.some(pr =>
                  pr.head && pr.head.repo &&
                  pr.head.repo.full_name === repoFullName &&
                  String(pr.head.ref || '').startsWith(prefix)
                );
              } catch (err) {
                return { ok: false, reason: 'open-pr-read-failed' };
              }
              const openBlockers = [];
              const declared = String(issue.body || '').match(
                /<!--\s*automation-blocked-by:\s*([0-9#\s,]+?)\s*-->/i
              );
              if (declared) {
                const numbers = [...new Set(
                  [...declared[1].matchAll(/\d+/g)]
                    .map(item => Number.parseInt(item[0], 10))
                    .filter(Number.isInteger)
                )];
                for (const blockerNumber of numbers) {
                  if (blockerNumber === Number(issueNumber)) continue;
                  try {
                    const blocker = await readGithub.rest.issues.get({
                      owner, repo, issue_number: blockerNumber,
                    });
                    if (blocker.data.state === 'open') openBlockers.push(blockerNumber);
                  } catch (err) {
                    return { ok: false, reason: 'blocker-read-failed' };
                  }
                }
              }
              let nativeBlockers = [];
              try {
                nativeBlockers = await readGithub.paginate(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  { owner, repo, issue_number: issueNumber, per_page: 100 }
                );
              } catch (err) {
                if (Number(err && err.status || 0) !== 404) {
                  return { ok: false, reason: 'native-blocker-read-failed' };
                }
              }
              for (const blocker of nativeBlockers) {
                if (blocker && blocker.state === 'open') {
                  openBlockers.push(Number(blocker.number) || 0);
                }
              }
              return decideLegacyRecoveryAdmission({
                issueState: issue.state,
                labels,
                openIssuePullRequests,
                openBlockers,
                readyLabel: process.env.READY_LABEL || 'automation:ready',
                pausedLabel,
                blockedLabel: process.env.BLOCKED_LABEL || 'automation:blocked',
                qualifyingLabel:
                  process.env.QUALIFYING_LABEL || 'automation:qualifying',
              });
            }

            async function resolveDispatchTarget(runPath) {
              const helper = process.env.CONTINUUM_DISPATCH_HELPER || '';
              let dispatchRouting;
              try {
                dispatchRouting = require(helper);
              } catch (err) {
                throw new Error(
                  'OpenCode 429 dispatch routing helper is unavailable: ' +
                  (err.message || err)
                );
              }
              const repoResponse = await readGithub.rest.repos.get({ owner, repo });
              const ref = String(process.env.DISPATCH_REF || '').trim() ||
                String(repoResponse.data.default_branch || 'main');
              const configured = String(process.env.OPENCODE_WORKFLOW || '').trim();
              const candidates = new Set([
                dispatchRouting.normalizeWorkflowPath(configured),
                dispatchRouting.normalizeWorkflowPath(runPath),
                ...dispatchRouting.DEFAULT_CANDIDATES,
              ].filter(Boolean));
              const workflows = {};
              for (const candidate of candidates) {
                try {
                  const content = await readGithub.rest.repos.getContent({
                    owner, repo, path: candidate, ref,
                  });
                  if (Array.isArray(content.data) || content.data.type !== 'file') {
                    workflows[candidate] = null;
                    continue;
                  }
                  workflows[candidate] = Buffer.from(
                    content.data.content || '', 'base64'
                  ).toString('utf8');
                } catch (err) {
                  workflows[candidate] = null;
                }
              }
              const target = dispatchRouting.resolveDispatchWorkflow({
                configured,
                watchedRunPath: runPath,
                workflows,
              });
              if (!target) return null;
              return { ...target, ref, configured };
            }

            // Stable run identity for one operation+generation. The callers put
            // this exact value into `run-name`, so a later pass can find an
            // already accepted dispatch even when the pass that made it died
            // before recording the run id.
            function recoveryRunName(operation, generation) {
              return 'OpenCode 429 recovery ' + String(operation) +
                ' gen ' + String(generation);
            }

            // kodmial/continuum#373: pre-#366 429 interruptions left only the
            // workflow-owned `opencode/checkpoint-issue<N>` branch and a
            // `.continuum-429-stage` progress line; they have no signed
            // recovery metadata. Such a checkpoint is never promoted to an
            // authoritative metadata-bearing checkpoint. It may only be
            // replayed through the standard issue mode, which re-runs the
            // agent/tests and revalidates the pinned snapshot. The pure
            // binder below proves the ref belongs to exactly this issue and a
            // same-tip 429/infra generation; the workflow refuses anything
            // else.
            const LEGACY_ISSUE_CHECKPOINT_PREFIX = 'opencode/checkpoint-issue';
            const LEGACY_STAGES = new Set([
              'implementation-incomplete',
              'implementation-complete',
              'tests-running',
              'tests-passed',
              'publish-pr',
              'review-repair',
              'qualification',
            ]);

            function legacyIssueCheckpointRef(issueNumber) {
              const text = String(issueNumber || '').trim();
              return /^[0-9]+$/.test(text)
                ? LEGACY_ISSUE_CHECKPOINT_PREFIX + text
                : '';
            }

            function parseCheckpointRef(ref) {
              const text = String(ref || '').trim();
              for (const prefix of [
                'opencode/429-checkpoint-',
                'opencode/infra-checkpoint-',
              ]) {
                if (!text.startsWith(prefix)) continue;
                const rest = text.slice(prefix.length);
                const at = rest.lastIndexOf('-gen-');
                if (at <= 0) return null;
                const generation = rest.slice(at + 5);
                if (!/^[0-9]+$/.test(generation)) return null;
                return {
                  operationId: rest.slice(0, at),
                  generation: Number(generation),
                };
              }
              return null;
            }

            // Pure production decision shared by the watchdog and its
            // deterministic regression test. Never returns a skip stage: the
            // stage file is untrusted for pre-metadata checkpoints.
            function bindLegacy429Checkpoint({
              issueNumber, legacyRef, legacySha, checkpointRefs,
              stageFileContent, metadataPresent,
            }) {
              const issue = String(issueNumber || '').trim();
              if (!/^[0-9]+$/.test(issue)) {
                return { ok: false, reason: 'legacy checkpoint requires an issue number' };
              }
              const expectedRef = legacyIssueCheckpointRef(issue);
              if (String(legacyRef || '').trim() !== expectedRef) {
                return { ok: false, reason: 'legacy checkpoint ref does not belong to the issue' };
              }
              const sha = String(legacySha || '').trim().toLowerCase();
              if (!/^[0-9a-f]{40}$/.test(sha)) {
                return { ok: false, reason: 'legacy checkpoint SHA is malformed' };
              }
              const rawStage = String(stageFileContent || '')
                .split(/\r?\n/)[0].trim();
              if (rawStage && !LEGACY_STAGES.has(rawStage)) {
                return { ok: false, reason: 'legacy checkpoint has no valid recorded stage' };
              }
              // Absence is not a blocker: the replay is conservative and
              // never uses the record to skip work.
              const stage = rawStage || 'implementation-incomplete';
              if (metadataPresent) {
                return { ok: false, reason: 'legacy checkpoint unexpectedly carries recovery metadata' };
              }
              const operation = 'opencode-429-issue-issue' + issue;
              let generation = 0;
              for (const item of Array.isArray(checkpointRefs) ? checkpointRefs : []) {
                const parsed = parseCheckpointRef(item && item.ref);
                if (!parsed || parsed.operationId !== operation) continue;
                if (parsed.generation < 1) continue;
                if (String(item.sha || '').trim().toLowerCase() !== sha) continue;
                if (parsed.generation > generation) generation = parsed.generation;
              }
              if (!generation) {
                return {
                  ok: false,
                  reason: 'legacy checkpoint has no matching 429 generation ref',
                };
              }
              return {
                ok: true,
                checkpointRef: expectedRef,
                checkpointSha: sha,
                generation,
                stage,
                skipAgent: false,
              };
            }

            function legacyRecoveryDispatchInputs(issueNumber) {
              return {
                mode: 'issue',
                issue_number: String(issueNumber || ''),
              };
            }

            function decideLegacyRecoveryAdmission({
              issueState, labels, openIssuePullRequests, activeRunId,
              openBlockers, readyLabel, pausedLabel, blockedLabel,
              qualifyingLabel,
            }) {
              if (String(issueState || '') !== 'open') {
                return { ok: false, reason: 'issue-closed' };
              }
              const names = new Set(
                (Array.isArray(labels) ? labels : []).map(label =>
                  typeof label === 'string' ? label : label && label.name
                ).filter(Boolean)
              );
              if (names.has(pausedLabel || 'automation:paused')) {
                return { ok: false, reason: 'owner-paused' };
              }
              if (
                names.has(blockedLabel || 'automation:blocked') ||
                names.has(qualifyingLabel || 'automation:qualifying')
              ) {
                return { ok: false, reason: 'held-label' };
              }
              // Owner authorization is the admission label when the consumer
              // enables explicit admission. A legacy checkpoint must never
              // auto-grant that label, and an issue whose owner removed it
              // (for example a cancelled task) stays untouched.
              const requiredReady = String(readyLabel || '').trim();
              if (requiredReady && !names.has(requiredReady)) {
                return { ok: false, reason: 'not-owner-authorized' };
              }
              if (openIssuePullRequests) {
                return { ok: false, reason: 'open-pr' };
              }
              if (Number(activeRunId || 0) > 0) {
                return { ok: false, reason: 'run-already-active' };
              }
              if (Array.isArray(openBlockers) && openBlockers.length > 0) {
                return { ok: false, reason: 'blocked' };
              }
              return { ok: true };
            }

            // A previously observed recovery run that later failed before it
            // could make progress must not strand the operation. Active and
            // successful runs stand down; a completed retryable failure opens
            // one more bounded attempt from the same preserved checkpoint.
            function decideObservedRecoveryState({
              recordedStatus, recordedConclusion, attempt, max429Restarts,
            }) {
              const retryable = new Set([
                'failure', 'timed_out', 'startup_failure',
                'action_required', 'stale', 'cancelled',
              ]);
              if (!recordedStatus) {
                // The recorded run is no longer readable; treat it as a failed
                // attempt rather than assuming unverified progress.
                return { action: 'retry', reason: 'run-missing' };
              }
              if (recordedStatus !== 'completed') {
                return { action: 'hold', reason: 'run-active' };
              }
              if (!retryable.has(String(recordedConclusion || ''))) {
                return { action: 'hold', reason: 'run-not-failed' };
              }
              const limit = Math.max(1, Number(max429Restarts) || 1) + 1;
              if ((Number(attempt) || 0) >= limit) {
                return { action: 'backoff', reason: 'attempts-exhausted' };
              }
              return { action: 'retry', reason: 'run-failed' };
            }

            // The checkout step runs before the exact-SHA restore. For issue
            // recovery the original head_ref can be an already-deleted task
            // branch, so check out the durable checkpoint ref instead; the
            // restore step still pins and validates the exact commit.
            function recoveryCheckoutHeadRef({ mode, headRef, checkpointRef }) {
              if (String(mode || '') === 'issue') {
                return String(checkpointRef || '');
              }
              return String(headRef || '');
            }

            async function observeDispatchedRun({
              target, notBefore, displayTitle, recoveryRunName, oldRunId,
            }) {
              for (let attempt = 0; attempt < 10; attempt += 1) {
                try {
                  const runs = await readGithub.paginate(
                    readGithub.rest.actions.listWorkflowRuns,
                    {
                      owner, repo, workflow_id: target.workflowId,
                      per_page: 50,
                    }
                  );
                  const candidates = runs.filter(candidate => {
                    if (Number(candidate.id) === Number(oldRunId || 0)) return false;
                    if (candidate.event !== 'workflow_dispatch') return false;
                    if (candidate.path && candidate.path !== target.path) return false;
                    if (new Date(candidate.created_at || 0).getTime() + 5000 < notBefore) {
                      return false;
                    }
                    return true;
                  });
                  const byTitle = title => title
                    ? candidates.find(candidate =>
                        candidate.display_title === title)
                    : null;
                  // Prefer the recovery identity embedded in run-name. Fall
                  // back to the caller's mode/issue title and finally, only
                  // when it is unambiguous, to the single new dispatch run. A
                  // missing/unrelated display_title must never turn an
                  // observable dispatch into an accepted-but-unowned one.
                  let match = byTitle(recoveryRunName) || byTitle(displayTitle);
                  if (!match) {
                    const ordered = candidates.slice().sort((a, b) =>
                      new Date(a.created_at || 0).getTime() -
                        new Date(b.created_at || 0).getTime() ||
                      Number(a.id || 0) - Number(b.id || 0)
                    );
                    if (ordered.length === 1) {
                      match = ordered[0];
                    }
                  }
                  if (match) return match;
                } catch (err) {
                  core.warning(
                    'OpenCode 429 dispatch observation attempt failed for ' +
                    target.path + ': ' + (err.message || err)
                  );
                }
                if (attempt < 9) {
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
              return null;
            }

            // Pre-#366 runs may only log the restart marker without the newer
            // evacuation line. Recover the trusted issue identity from the
            // caller's `run-name` and bind the legacy branch to the same-tip
            // 429/infra generation ref instead of guessing a checkpoint.
            async function synthesizeLegacyEvacuation(run) {
              const match = String(run && run.display_title || '')
                .match(/^OpenCode issue #(\d+)$/);
              if (!match) return null;
              const issue = match[1];
              const legacyRef = legacyIssueCheckpointRef(issue);
              let legacySha = '';
              try {
                const response = await readGithub.rest.git.getRef({
                  owner, repo, ref: 'heads/' + legacyRef,
                });
                legacySha = String(response.data.object.sha || '').toLowerCase();
              } catch (err) {
                return null;
              }
              if (!/^[0-9a-f]{40}$/.test(legacySha)) return null;
              const operation = 'opencode-429-issue-issue' + issue;
              const refs = [];
              for (const prefix of [
                'opencode/429-checkpoint-',
                'opencode/infra-checkpoint-',
              ]) {
                try {
                  const response = await readGithub.rest.git.listMatchingRefs({
                    owner, repo, ref: 'heads/' + prefix + operation,
                  });
                  for (const item of response.data || []) {
                    refs.push({
                      ref: String(item.ref || '').replace(/^refs\/heads\//, ''),
                      sha: String(item.object && item.object.sha || '')
                        .toLowerCase(),
                    });
                  }
                } catch (err) {
                  return null;
                }
              }
              let best = null;
              for (const item of refs) {
                const parsed = parseCheckpointRef(item.ref);
                if (!parsed || parsed.operationId !== operation) continue;
                if (parsed.generation < 1) continue;
                if (item.sha !== legacySha) continue;
                if (!best || parsed.generation > best.generation) {
                  best = { ref: item.ref, generation: parsed.generation };
                }
              }
              if (!best) return null;
              return {
                checkpointRef: best.ref,
                checkpointSha: legacySha,
                operationId: operation,
                stage: 'implementation-incomplete',
                generation: best.generation,
                mode: 'issue',
                issueNumber: issue,
                prNumber: '',
                branch: '',
              };
            }

            // A recovery dispatch that failed before it could emit a fresh
            // 429 marker (for example a checkout failure on an already-deleted
            // task branch) still has a durable observed run id. The scheduled
            // catch-up must be able to re-enter the same watchdog path from the
            // stable `run-name` identity, otherwise the operation sits in
            // `observed` until an unrelated workflow_run event arrives.
            async function synthesizeRecoveryEvacuation(run) {
              const match = String(run && run.display_title || '').match(
                /^OpenCode 429 recovery (opencode-429-issue-issue[0-9]+) gen ([0-9]+)$/
              );
              if (!match) return null;
              const operation = match[1];
              const generation = Number.parseInt(match[2], 10);
              if (!Number.isInteger(generation) || generation < 1) return null;
              const issue = operation.replace(
                /^opencode-429-issue-issue/, ''
              );
              if (!/^[0-9]+$/.test(issue)) return null;
              for (const prefix of [
                'opencode/429-checkpoint-',
                'opencode/infra-checkpoint-',
              ]) {
                const checkpointRef = prefix + operation + '-gen-' + generation;
                try {
                  const response = await readGithub.rest.git.getRef({
                    owner, repo, ref: 'heads/' + checkpointRef,
                  });
                  const sha = String(
                    response.data.object && response.data.object.sha || ''
                  ).toLowerCase();
                  if (!/^[0-9a-f]{40}$/.test(sha)) continue;
                  return {
                    checkpointRef,
                    checkpointSha: sha,
                    operationId: operation,
                    stage: 'implementation-incomplete',
                    generation,
                    mode: 'issue',
                    issueNumber: issue,
                    prNumber: '',
                    branch: '',
                  };
                } catch (err) {
                  const status = Number(err && err.status || 0);
                  if (status !== 404) throw err;
                }
              }
              return null;
            }

            async function recoverFrom429OnFreshVm({
              owner, repo, run, evacuated429,
              max429Restarts,
            }) {
              let resolvedEvacuation = evacuated429;
              if (!resolvedEvacuation) {
                try {
                  resolvedEvacuation = await synthesizeLegacyEvacuation(run);
                } catch (err) {
                  core.warning(
                    'OpenCode legacy 429 identity synthesis failed closed for run ' +
                    (run && run.id) + ': ' + (err.message || err)
                  );
                  resolvedEvacuation = null;
                }
              }
              const operation = String(resolvedEvacuation && resolvedEvacuation.operationId || '').trim();
              let checkpointRef = String(resolvedEvacuation && resolvedEvacuation.checkpointRef || '').trim();
              let generation = Number(resolvedEvacuation && resolvedEvacuation.generation || 0);
              if (!Number.isInteger(generation) || generation < 0) generation = 0;
              let pointerSha = String(resolvedEvacuation && resolvedEvacuation.checkpointSha || '')
                .trim().toLowerCase();
              let legacyReplay = false;
              const runPath = String(run && run.path || '');
              const numberTexts = [
                String(resolvedEvacuation && resolvedEvacuation.issueNumber || '').trim(),
                String(resolvedEvacuation && resolvedEvacuation.prNumber || '').trim(),
              ].filter(text => /^[0-9]+$/.test(text));
              const threadNumber = numberTexts.length ? Number(numberTexts[0]) : 0;
              const baseState = {
                threadNumber,
                operation,
                generation,
                checkpointRef,
                checkpointSha: pointerSha,
              };

              if (!resolvedEvacuation) {
                core.notice(
                  'OpenCode infrastructure marker without a workflow-owned evacuation ' +
                  'pointer in run ' + (run && run.id) + '; scheduling a bounded ' +
                  'watchdog catch-up without pausing or consuming task budget.'
                );
                return;
              }
              if (!operation || !/^opencode\/(?:429|infra)-checkpoint-/.test(checkpointRef)) {
                await recordRecoveryState({
                  ...baseState,
                  state: 'metadata-failed',
                  attempt: 1,
                  nextDue: Math.floor(Date.now() / 1000) + 300,
                  detail: 'malformed-pointer',
                  summary: 'OpenCode infrastructure evacuation identity is malformed; the durable checkpoint is preserved and no task budget was consumed.',
                });
                return;
              }
              const now = Math.floor(Date.now() / 1000);
              const comments = await listThreadComments(threadNumber);
              let previous = latestRecoveryState(comments, operation, generation);

              if (generation > max429Restarts) {
                // Honor the durable window instead of recording a fresh
                // `next_due` on every */15 catch-up pass, which would slide the
                // cooldown forever and strand the reservation.
                const backoffSchedule = [60, 300, 900, 1800, 3600];
                const backoffDue = backoffSchedule[
                  Math.min(
                    Math.max(0, generation - max429Restarts - 1),
                    backoffSchedule.length - 1
                  )
                ];
                if (!previous || previous.nextDue <= now) {
                  await recordRecoveryState({
                    ...baseState,
                    state: 'backoff',
                    attempt: generation,
                    nextDue: now + backoffDue,
                    detail: 'generation-exhausted',
                    summary: 'Repeated model 429s on fresh runners; entering bounded infrastructure backoff. No pause was applied and no task/review/qualification budget was consumed.',
                  });
                  core.warning(
                    'OpenCode infrastructure operation ' + operation + ' entered bounded ' +
                    'infrastructure backoff after ' + generation +
                    ' fresh-runner generation(s); checkpoint ' + checkpointRef +
                    ' preserved for automatic resume.'
                  );
                } else {
                  core.notice(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' is already in bounded infrastructure backoff until ' +
                    previous.nextDue + '; not resetting the window.'
                  );
                }
                return;
              }

              const metadata = await readCheckpointMetadata({
                operation, generation, checkpointRef,
                checkpointSha: pointerSha,
              });
              let identity = null;
              let stage = 'implementation-incomplete';
              let mode = '';
              let issueText = '';
              let prText = '';
              let checkpointSha = pointerSha;
              if (!metadata.ok) {
                let legacy = null;
                // Only a provably *absent* metadata file is a pre-fix
                // checkpoint. A malformed metadata file is tampering and
                // stays fail-closed.
                if (
                  metadata.kind === 'missing' &&
                  String(resolvedEvacuation.mode || '').trim() === 'issue'
                ) {
                  const legacyIssue = String(resolvedEvacuation.issueNumber || '').trim();
                  try {
                    legacy = await inspectLegacy429Checkpoint({
                      operation,
                      generation,
                      checkpointRef,
                      checkpointSha: metadata.exactSha || pointerSha,
                      issueNumber: legacyIssue,
                    });
                  } catch (err) {
                    core.warning(
                      'OpenCode legacy 429 checkpoint inspection for issue #' +
                      legacyIssue + ' failed closed: ' + (err.message || err)
                    );
                    legacy = null;
                  }
                  if (legacy && legacy.ok) {
                    const admission = await legacyRecoveryAdmission(legacyIssue);
                    if (!admission.ok) {
                      await recordRecoveryState({
                        ...baseState,
                        checkpointRef: legacy.checkpointRef,
                        checkpointSha: legacy.checkpointSha,
                        state: admission.reason === 'run-already-active'
                          ? 'observed'
                          : 'metadata-pending',
                        attempt: 1,
                        nextDue: Math.floor(Date.now() / 1000) + 300,
                        runId: '',
                        detail: 'legacy-' + admission.reason,
                        summary: admission.reason === 'run-already-active'
                          ? 'A real issue-mode runner already owns the preserved legacy checkpoint; no duplicate replay was dispatched.'
                          : 'Legacy 429 checkpoint is preserved, but the issue is not currently owner-authorized for an automatic replay (' +
                            admission.reason + '). No label was added or removed and no task budget was consumed.',
                      });
                      core.notice(
                        'OpenCode legacy 429 recovery for issue #' + legacyIssue +
                        ' is held (' + admission.reason + '); checkpoint ' +
                        legacy.checkpointRef + ' preserved.'
                      );
                      return;
                    }
                    legacyReplay = true;
                    checkpointRef = legacy.checkpointRef;
                    pointerSha = legacy.checkpointSha;
                    checkpointSha = legacy.checkpointSha;
                    generation = legacy.generation;
                    baseState.checkpointRef = checkpointRef;
                    baseState.checkpointSha = pointerSha;
                    baseState.generation = generation;
                    mode = 'issue';
                    issueText = legacyIssue;
                    prText = '';
                    // The pre-fix stage file is evidence only. It must never
                    // authorize skipping the agent or tests; a standard
                    // issue-mode replay revalidates everything.
                    stage = 'implementation-incomplete';
                    previous = latestRecoveryState(comments, operation, generation);
                    core.warning(
                      'OpenCode legacy 429 checkpoint ' + checkpointRef + ' at ' +
                      checkpointSha + ' has no recovery metadata (recorded stage `' +
                      legacy.stage + '`); replaying through the standard issue mode ' +
                      'without trusting that stage or fabricating metadata.'
                    );
                  }
                }
                if (!legacyReplay) {
                  const failureNow = Math.floor(Date.now() / 1000);
                  const nextDue = failureNow + (metadata.kind === 'missing' ? 60 : 300);
                  const failed = metadata.kind === 'missing' || metadata.kind === 'invalid';
                  await recordRecoveryState({
                    ...baseState,
                    checkpointSha: metadata.exactSha || pointerSha,
                    state: failed ? 'metadata-failed' : 'metadata-pending',
                    attempt: 1,
                    nextDue,
                    detail: 'metadata-' + metadata.kind,
                    summary: failed
                      ? 'Checkpoint `' + checkpointRef + '` exists but its recovery metadata is provably missing or invalid and it is not a trusted legacy issue checkpoint. Raw work is preserved; no resume is dispatched from an unproven checkpoint.'
                      : 'Checkpoint `' + checkpointRef + '` metadata is not readable yet (' + metadata.kind + '). A scheduled watchdog catch-up will retry; no pause was applied.',
                  });
                  core.warning(
                    'OpenCode infrastructure checkpoint ' + checkpointRef +
                    ' metadata is not recoverable yet (' + metadata.kind + ': ' +
                    (metadata.reason || 'unknown') + '); recorded durable ' +
                    (failed ? 'metadata-failed' : 'metadata-pending') + ' state. ' +
                    'No pause was applied.'
                  );
                  return;
                }
              } else {
                identity = metadata.identity;
                stage = String(identity.stage || 'implementation-incomplete');
                mode = String(identity.mode || '');
                issueText = String(identity.issue_number || '').trim();
                prText = String(identity.pr_number || '').trim();
                const expected = {
                  operation, generation, stage, mode,
                  issueNumber: issueText,
                  prNumber: prText,
                  checkpointRef,
                };
                const validationError = validateRecoveryMetadata(identity, expected);
                if (validationError) {
                  await recordRecoveryState({
                    ...baseState,
                    checkpointSha: metadata.exactSha,
                    state: 'metadata-failed',
                    attempt: 1,
                    nextDue: Math.floor(Date.now() / 1000) + 300,
                    detail: 'metadata-invalid',
                    summary: 'Checkpoint `' + checkpointRef + '` recovery metadata failed validation (' + validationError + '). Raw work is preserved; no resume is dispatched.',
                  });
                  core.warning(
                    'OpenCode infrastructure checkpoint ' + checkpointRef +
                    ' metadata failed validation: ' + validationError
                  );
                  return;
                }
                // The ref tip is authoritative for a fetchable checkpoint; a
                // stale event pointer must not dispatch an older SHA than the
                // ref now exposes.
                checkpointSha = metadata.exactSha || pointerSha;
                if (metadata.stalePointer) {
                  core.warning(
                    'OpenCode infrastructure checkpoint ' + checkpointRef +
                    ' advanced from stale event pointer ' + pointerSha +
                    ' to current ref tip ' + checkpointSha + '; using the tip.'
                  );
                }
              }

              const displayTitle = mode === 'issue'
                ? 'OpenCode issue #' + issueText
                : (prText ? 'OpenCode repair PR #' + prText : '');
              const recoveryTitle = recoveryRunName(operation, generation);

              // Crash-after-ack fence: an expired `claimed`/`accepted` marker
              // may describe a dispatch GitHub already accepted even though
              // the pass that made it died before recording the run id. Adopt
              // the durable operation+generation run identity before creating
              // a new attempt; never treat the claim alone as proof either
              // way.
              if (
                previous &&
                previous.nextDue <= now &&
                (previous.state === 'claimed' || previous.state === 'accepted')
              ) {
                let observedTarget = null;
                try {
                  observedTarget = await resolveDispatchTarget(runPath);
                } catch (err) {
                  core.warning(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' could not resolve a dispatch target while ' +
                    'checking for an already accepted run (' +
                    (err.message || err) + ').'
                  );
                }
                if (observedTarget) {
                  const recovered = await observeDispatchedRun({
                    target: observedTarget,
                    notBefore: Math.max(0, previous.nextDue - 300) * 1000,
                    displayTitle,
                    recoveryRunName: legacyReplay ? '' : recoveryTitle,
                    oldRunId: run && run.id,
                  });
                  if (recovered) {
                    await recordRecoveryState({
                      ...baseState,
                      checkpointSha,
                      state: 'observed',
                      attempt: previous.attempt,
                      nextDue: 0,
                      runId: String(recovered.id),
                      detail: 'run-recovered',
                      summary: 'Adopted already-dispatched fresh-VM run ' +
                        recovered.id + ' for checkpoint `' + checkpointRef +
                        '` at exact SHA `' + checkpointSha + '` (stage `' +
                        stage + '`, generation ' + generation +
                        ') instead of dispatching a duplicate.',
                    });
                    core.notice(
                      'OpenCode 429: adopted existing fresh-VM run ' + recovered.id +
                      ' for operation ' + operation + ' generation ' + generation +
                      '; no duplicate dispatch.'
                    );
                    return;
                  }
                }
              }

              if (previous) {
                if (previous.state === 'observed') {
                  let recordedRun = null;
                  const recordedRunId = Number(previous.runId);
                  if (Number.isInteger(recordedRunId) && recordedRunId > 0) {
                    try {
                      const response = await readGithub.rest.actions.getWorkflowRun({
                        owner, repo, run_id: recordedRunId,
                      });
                      recordedRun = response.data;
                    } catch (err) {
                      if (Number(err && err.status || 0) !== 404) {
                        core.warning(
                          'OpenCode infrastructure operation ' + operation +
                          ' could not read observed run ' + recordedRunId +
                          ': ' + (err.message || err) + '; holding fail-closed.'
                        );
                        return;
                      }
                    }
                  }
                  const observedDecision = decideObservedRecoveryState({
                    recordedStatus: recordedRun ? recordedRun.status : '',
                    recordedConclusion: recordedRun
                      ? recordedRun.conclusion
                      : '',
                    attempt: previous.attempt,
                    max429Restarts,
                  });
                  if (observedDecision.action === 'hold') {
                    core.notice(
                      'OpenCode infrastructure operation ' + operation + ' generation ' +
                      generation + ' was already resumed by observed run ' +
                      previous.runId + ' (' + observedDecision.reason +
                      '); watchdog will not create a competing resumption.'
                    );
                    return;
                  }
                  if (observedDecision.action === 'backoff') {
                    await recordRecoveryState({
                      ...baseState,
                      checkpointSha,
                      state: 'backoff',
                      attempt: previous.attempt,
                      nextDue: now + 3600,
                      detail: 'observed-run-attempts-exhausted',
                      summary: 'Observed recovery run ' + previous.runId +
                        ' completed without a PR and bounded attempts are exhausted. Checkpoint `' +
                        checkpointRef + '` is preserved; no pause was applied.',
                    });
                    return;
                  }
                  core.warning(
                    'Observed recovery run ' + (previous.runId || 'unknown') +
                    ' for operation ' + operation + ' did not make progress (' +
                    observedDecision.reason + '); dispatching one bounded retry ' +
                    'from the same checkpoint without pausing.'
                  );
                }
                if (previous.state === 'accepted' && previous.nextDue > now) {
                  core.notice(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' already has an accepted (not yet observed) dispatch; ' +
                    'watchdog will not create a competing resumption.'
                  );
                  return;
                }
                if (previous.state === 'claimed' && previous.nextDue > now) {
                  core.notice(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' already has a live pre-dispatch claim until ' +
                    previous.nextDue + '; no duplicate dispatch.'
                  );
                  return;
                }
                if (previous.nextDue > now) {
                  core.notice(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' is in durable ' + previous.state +
                    ' state until ' + previous.nextDue + '; no duplicate dispatch.'
                  );
                  return;
                }
                // An expired durable backoff window opens one fresh bounded
                // attempt cycle from the still-valid checkpoint instead of
                // re-recording the same exhausted backoff forever.
                const backoffExpired =
                  previous.state === 'backoff' && previous.nextDue <= now;
                if (
                  previous.attempt >= Math.max(1, max429Restarts + 1) &&
                  !backoffExpired
                ) {
                  await recordRecoveryState({
                    ...baseState,
                    checkpointSha,
                    state: 'backoff',
                    attempt: previous.attempt,
                    nextDue: now + 3600,
                    detail: 'attempts-exhausted',
                    summary: 'Bounded recovery attempts are exhausted for this generation. Checkpoint `' + checkpointRef + '` is preserved; no pause was applied.',
                  });
                  return;
                }
              }
              const attempt = (previous ? previous.attempt : 0) + 1;

              let target;
              try {
                target = await resolveDispatchTarget(runPath);
              } catch (err) {
                await recordRecoveryState({
                  ...baseState,
                  checkpointSha,
                  state: 'metadata-pending',
                  attempt,
                  nextDue: now + 300,
                  detail: 'routing-error',
                  summary: 'Could not resolve a repository-local workflow_dispatch caller (' + (err.message || err) + '). Checkpoint is preserved; a scheduled catch-up will retry.',
                });
                return;
              }
              if (!target) {
                await recordRecoveryState({
                  ...baseState,
                  checkpointSha,
                  state: 'metadata-pending',
                  attempt,
                  nextDue: now + 300,
                  detail: 'no-dispatchable-caller',
                  summary: 'No repository-local OpenCode caller declaring `workflow_dispatch` was found. The reusable engine is never dispatched directly; a scheduled catch-up will retry.',
                });
                core.warning(
                  'OpenCode 429 recovery could not find a dispatchable local caller; ' +
                  'checkpoint ' + checkpointRef + ' preserved.'
                );
                return;
              }

              // A standard issue-mode replay must not compete with a runner
              // the owner (or the scheduler) already started. Adopting the
              // live run as observed evidence also keeps the scheduler
              // reservation alive without a duplicate model invocation.
              if (legacyReplay) {
                const active = await findActiveIssueRun({
                  target, issueNumber: issueText,
                });
                if (active) {
                  await recordRecoveryState({
                    ...baseState,
                    checkpointSha,
                    state: 'observed',
                    attempt,
                    nextDue: 0,
                    runId: String(active.id),
                    detail: 'legacy-run-already-active',
                    summary: 'A real issue-mode runner ' + active.id +
                      ' already owns the preserved legacy checkpoint `' +
                      checkpointRef + '`; no duplicate replay was dispatched.',
                  });
                  core.notice(
                    'OpenCode legacy 429: adopted already-active issue-mode run ' +
                    active.id + ' for issue #' + issueText + '; no duplicate dispatch.'
                  );
                  return;
                }
              }

              const dispatchInputs = legacyReplay
                ? legacyRecoveryDispatchInputs(issueText)
                : {
                    mode: mode,
                    issue_number: issueText,
                    pr_number: prText,
                    head_ref: recoveryCheckoutHeadRef({
                      mode,
                      headRef: String(identity.head_ref || identity.branch || ''),
                      checkpointRef,
                    }),
                    review_id: String(identity.review_id || ''),
                    unresolved_items_json: String(identity.unresolved_items_json || ''),
                    run_id: String(identity.run_id || ''),
                    base_ref: String(identity.base_ref || ''),
                    capability_number: String(identity.capability_number || ''),
                    qualification_number: String(identity.qualification_number || ''),
                    required_sha: String(identity.required_sha || ''),
                    recovery_identity: JSON.stringify({
                      recovery_operation_id: operation,
                      recovery_checkpoint_ref: checkpointRef,
                      recovery_checkpoint_sha: checkpointSha,
                      recovery_stage: stage,
                      recovery_generation: String(generation),
                    }),
                  };
              // Exactly-once fence: claim before dispatch with a fresh comment.
              // A concurrent workflow_run/catch-up pass for the same
              // operation+generation either sees the claim (and stands down) or
              // creates a later id (and loses the recheck), so only one pass can
              // reach createWorkflowDispatch.
              let claim = null;
              try {
                claim = await createRecoveryClaim({
                  ...baseState,
                  checkpointSha,
                  attempt,
                  nextDue: now + 300,
                  summary: 'Claiming fresh-VM resumption dispatch for checkpoint `' +
                    checkpointRef + '` at exact SHA `' + checkpointSha +
                    '` (stage `' + stage + '`, generation ' + generation +
                    '); a concurrent pass must stand down.',
                });
              } catch (claimErr) {
                core.warning(
                  'OpenCode infrastructure operation ' + operation + ' generation ' +
                  generation + ' could not record the pre-dispatch claim (' +
                  (claimErr.message || claimErr) +
                  '); keeping the reservation for a later pass.'
                );
                return;
              }
              if (claim) {
                try {
                  // Give a concurrent create a moment to become visible, then
                  // let the lowest comment id be the single claim winner.
                  await new Promise(resolve => setTimeout(resolve, 1000));
                  const claimed = await holdsRecoveryClaim(claim, {
                    threadNumber, operation, generation, attempt,
                  });
                  if (!claimed) {
                    await deleteRecoveryClaim(claim);
                    core.notice(
                      'OpenCode 429 recovery claim for operation ' + operation +
                      ' generation ' + generation +
                      ' is already held by another pass; standing down.'
                    );
                    return;
                  }
                } catch (claimCheckErr) {
                  await deleteRecoveryClaim(claim);
                  core.warning(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' could not verify the pre-dispatch claim (' +
                    (claimCheckErr.message || claimCheckErr) +
                    '); keeping the reservation for a later pass.'
                  );
                  return;
                }
              }

              const dispatchStarted = Date.now();
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: target.workflowId,
                  ref: target.ref,
                  inputs: dispatchInputs,
                });
              } catch (dispatchErr) {
                const status = Number(dispatchErr && dispatchErr.status || 0);
                await deleteRecoveryClaim(claim);
                await recordRecoveryState({
                  ...baseState,
                  checkpointSha,
                  state: 'dispatch-failed',
                  attempt,
                  nextDue: now + 300,
                  detail: 'http-' + (status || 'unknown'),
                  summary: 'Fresh-VM recovery dispatch through `' + target.path + '` failed (' +
                    (dispatchErr.message || dispatchErr) + '). Checkpoint is preserved; no pause was applied.',
                });
                core.warning(
                  'OpenCode infrastructure operation ' + operation + ' generation ' +
                  generation + ' dispatch through ' + target.path + ' failed (' +
                  (dispatchErr.message || dispatchErr) + '); keeping the reservation ' +
                  'for a later catch-up. No pause was applied.'
                );
                return;
              }

              const observed = await observeDispatchedRun({
                target,
                notBefore: dispatchStarted,
                displayTitle,
                recoveryRunName: legacyReplay ? '' : recoveryTitle,
                oldRunId: run && run.id,
              });
              if (!observed) {
                await recordRecoveryState({
                  ...baseState,
                  checkpointSha,
                  state: 'accepted',
                  attempt,
                  nextDue: now + 120,
                  detail: 'dispatch-not-observed',
                  summary: 'GitHub accepted the ' + (legacyReplay
                    ? 'standard issue-mode legacy replay'
                    : 'fresh-VM dispatch') + ' through `' + target.path +
                    '`, but no new run was observed yet. A scheduled watchdog catch-up will verify it; a claim alone is not treated as proof that a runner started.',
                });
                core.warning(
                  'OpenCode 429 dispatch through ' + target.path + ' for operation ' +
                  operation + ' was accepted but not observed; catch-up will verify.'
                );
                return;
              }
              await recordRecoveryState({
                ...baseState,
                checkpointSha,
                state: 'observed',
                attempt,
                nextDue: 0,
                runId: String(observed.id),
                detail: legacyReplay ? 'legacy-run-started' : 'run-started',
                summary: (legacyReplay
                  ? 'Dispatched the standard issue-mode legacy replay through `' +
                    target.path + '` and observed new run ' + observed.id +
                    ' for preserved checkpoint `' + checkpointRef +
                    '` at exact SHA `' + checkpointSha + '`. The untrusted pre-fix ' +
                    'stage was not used to skip the agent or tests and no recovery ' +
                    'metadata was fabricated.'
                  : 'Dispatched a fresh-VM resumption through `' + target.path +
                    '` and observed new run ' + observed.id + ' for checkpoint `' +
                    checkpointRef + '` at exact SHA `' + checkpointSha + '` (stage `' +
                    stage + '`, generation ' + generation + '). Completed stages are not ' +
                    'repeated and no task/review/qualification budget was consumed.'),
              });
              core.notice(
                'OpenCode 429: observed ' + (legacyReplay
                  ? 'legacy issue-mode replay'
                  : 'fresh-VM') + ' run ' + observed.id +
                ' for operation ' + operation + ' generation ' + generation +
                ' stage ' + stage + ' through ' + target.path +
                ' from checkpoint ' + checkpointRef + ' at exact SHA ' +
                checkpointSha + '.'
              );
            }
            if (!run) {
              // kodmial/continuum#350: scheduled/eventless catch-up. The normal
              // path wakes only when a completed workflow_run is delivered. A
              // late or lost delivery, an API outage, or an accepted dispatch
              // that did not appear must still have a real owner. This bounded
              // pass re-reads recent completed OpenCode runs and reuses the same
              // recovery function; it is not a second controller.
              const catchUpNow = Date.now();
              const catchUpApiBase = String(
                process.env.GITHUB_API_URL || 'https://api.github.com'
              ).replace(/\/+$/, '');
              const recentRuns = [];
              for (let page = 1; page <= 2; page += 1) {
                const { data } = await readGithub.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, per_page: 100, page,
                });
                recentRuns.push(...(data.workflow_runs || []));
                if ((data.workflow_runs || []).length < 100) break;
              }
              const catchUpRetryableConclusions = new Set([
                'failure', 'timed_out', 'startup_failure',
                'action_required', 'stale', 'cancelled',
              ]);
              const catchUpAll = recentRuns.filter(candidate => {
                const path = String(candidate.path || '');
                const sameWorkflow =
                  /(?:^|\/)continuum-opencode\.yml$/.test(path) ||
                  /(?:^|\/)opencode\.yml$/.test(path) ||
                  (watchedWorkflow !== '' && candidate.name === watchedWorkflow);
                if (!sameWorkflow) return false;
                if (candidate.status !== 'completed') return false;
                const updated = new Date(candidate.updated_at || candidate.created_at || 0).getTime();
                return Number.isFinite(updated) && (catchUpNow - updated) < 48 * 60 * 60 * 1000;
              });
              // A failed recovery run is the highest-value catch-up input even
              // when newer ordinary runs exist: it already holds a durable
              // observed run id and may need only one bounded retry. Never let
              // the ordinary 8-run window starve it.
              const isFailedRecoveryRun = candidate =>
                /^OpenCode 429 recovery .+ gen [0-9]+$/.test(
                  String(candidate.display_title || '')
                ) &&
                catchUpRetryableConclusions.has(
                  String(candidate.conclusion || '')
                );
              const catchUpCandidates = [
                ...catchUpAll.filter(isFailedRecoveryRun).slice(0, 16),
                ...catchUpAll.filter(candidate => !isFailedRecoveryRun(candidate))
                  .slice(0, 8),
              ];
              for (const candidate of catchUpCandidates) {
                let candidateRecovery = null;
                try {
                  candidateRecovery = await synthesizeRecoveryEvacuation(candidate);
                } catch (err) {
                  core.warning(
                    'OpenCode 429 catch-up could not inspect recovery identity for run ' +
                    candidate.id + ': ' + (err.message || err)
                  );
                }
                if (
                  candidateRecovery &&
                  catchUpRetryableConclusions.has(String(candidate.conclusion || ''))
                ) {
                  // A recovery run that failed before its 429 marker still
                  // respects the same owner-authorization gate as every other
                  // issue path. In particular an explicit automation:paused
                  // is an owner STOP, not an invitation for the catch-up timer
                  // to bypass it.
                  let admission = null;
                  try {
                    admission = await legacyRecoveryAdmission(
                      candidateRecovery.issueNumber
                    );
                  } catch (err) {
                    core.warning(
                      'OpenCode 429 catch-up could not verify issue admission for #' +
                      candidateRecovery.issueNumber + ': ' +
                      (err.message || err) + '; holding.'
                    );
                  }
                  if (!admission || !admission.ok) {
                    core.notice(
                      'OpenCode 429 catch-up is holding failed recovery run ' +
                      candidate.id + ' for issue #' +
                      candidateRecovery.issueNumber + ' (' +
                      (admission ? admission.reason : 'admission-unreadable') +
                      '); no label or checkpoint was changed.'
                    );
                    continue;
                  }
                  await recoverFrom429OnFreshVm({
                    owner, repo, run: candidate,
                    evacuated429: candidateRecovery,
                    max429Restarts,
                  });
                  continue;
                }
                let candidateJobs = [];
                try {
                  candidateJobs = await readGithub.paginate(
                    readGithub.rest.actions.listJobsForWorkflowRun,
                    {
                      owner, repo, run_id: candidate.id,
                      filter: 'latest', per_page: 100,
                    }
                  );
                } catch (err) {
                  core.warning(
                    'OpenCode 429 catch-up could not list jobs for run ' +
                    candidate.id + ': ' + (err.message || err)
                  );
                  continue;
                }
                let candidateEvacuated = null;
                let candidateMetadataFailed = null;
                let candidateRestart = false;
                for (const job of candidateJobs) {
                  let response;
                  try {
                    response = await fetch(
                      catchUpApiBase + '/repos/' + owner + '/' + repo +
                        '/actions/jobs/' + job.id + '/logs',
                      {
                        headers: {
                          accept: 'application/vnd.github+json',
                          authorization: 'Bearer ' + readToken,
                          'x-github-api-version': '2022-11-28',
                        },
                        redirect: 'follow',
                      }
                    );
                  } catch (err) {
                    continue;
                  }
                  if (!response.ok) continue;
                  const logText = await response.text();
                  const emitted = logText.split('\n').some(line =>
                    line.includes('##[error]') &&
                    (line.includes(rateLimitMarker) ||
                     line.includes(upstreamUnavailableMarker))
                  );
                  if (!emitted) continue;
                  candidateRestart = true;
                  const evacuated = logText.match(evacuatedRe);
                  if (evacuated) {
                    candidateEvacuated = {
                      checkpointRef: evacuated[1],
                      checkpointSha: evacuated[2],
                      operationId: evacuated[3],
                      stage: evacuated[4],
                      generation: Number.parseInt(evacuated[5], 10),
                      mode: evacuated[6],
                      issueNumber: (evacuated[7] || '').trim(),
                      prNumber: (evacuated[8] || '').trim(),
                      branch: (evacuated[9] || '').trim(),
                    };
                  }
                  if (logText.includes(metadataFailedMarker)) {
                    candidateMetadataFailed = parseMetadataFailure(logText);
                  }
                  if (candidateEvacuated || candidateMetadataFailed) break;
                }
                if (!candidateRestart) continue;
                if (candidateEvacuated) {
                  await recoverFrom429OnFreshVm({
                    owner, repo, run: candidate,
                    evacuated429: candidateEvacuated,
                    max429Restarts,
                  });
                } else if (candidateMetadataFailed) {
                  const failed = candidateMetadataFailed;
                  const threadText = failed.issueNumber || failed.prNumber;
                  const threadNumber = /^[0-9]+$/.test(threadText)
                    ? Number(threadText)
                    : 0;
                  await recordRecoveryState({
                    threadNumber,
                    operation: failed.operationId,
                    generation: failed.generation,
                    checkpointRef: failed.salvageRef,
                    checkpointSha: '',
                    state: 'metadata-failed',
                    attempt: 1,
                    nextDue: Math.floor(Date.now() / 1000) + 300,
                    detail: 'workflow-metadata-failed',
                    summary: 'The burned runner preserved raw work on salvage ref `' +
                      (failed.salvageRef || 'none') + '` but could not produce valid ' +
                      'recovery metadata. No recoverable checkpoint pointer was published.',
                  });
                } else {
                  // No newer evacuation line: a pre-#366 run may still own a
                  // legacy issue checkpoint. Identify it from the caller's
                  // stable run-name, never from a guessed ref.
                  await recoverFrom429OnFreshVm({
                    owner, repo, run: candidate,
                    evacuated429: null,
                    max429Restarts,
                  });
                }
              }
              core.notice(
                'OpenCode 429 scheduled catch-up inspected ' +
                catchUpCandidates.length + ' recent completed run(s).'
              );
              return;
            }
            const jobs = await readGithub.paginate(
              readGithub.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              }
            );
            let runnerRestartRequired = false;
            let publishRaceRestartRequired = false;
            let evacuated429 = null;
            let metadataFailure429 = null;
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');
            for (const job of jobs) {
              const response = await fetch(
                apiBase + '/repos/' + owner + '/' + repo +
                  '/actions/jobs/' + job.id + '/logs',
                {
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: 'Bearer ' + readToken,
                    'x-github-api-version': '2022-11-28',
                  },
                  redirect: 'follow',
                }
              );
              if (!response.ok) {
                core.warning(
                  'Could not inspect job ' + job.id +
                  ' for 429 recovery marker: HTTP ' + response.status
                );
                continue;
              }
              const logText = await response.text();
              // GitHub echoes shell source into job logs. Match only the
              // executed workflow-command error line, not a marker embedded
              // in the printed run script or an agent prompt.
              const emittedRestartMarker = logText.split('\n').some(line =>
                line.includes('##[error]') &&
                (line.includes(rateLimitMarker) ||
                 line.includes(upstreamUnavailableMarker))
              );
              if (emittedRestartMarker) {
                runnerRestartRequired = true;
                const evacuated = logText.match(evacuatedRe);
                if (evacuated) {
                  evacuated429 = {
                    checkpointRef: evacuated[1],
                    checkpointSha: evacuated[2],
                    operationId: evacuated[3],
                    stage: evacuated[4],
                    generation: Number.parseInt(evacuated[5], 10),
                    mode: evacuated[6],
                    issueNumber: (evacuated[7] || '').trim(),
                    prNumber: (evacuated[8] || '').trim(),
                    branch: (evacuated[9] || '').trim(),
                  };
                }
              }
              if (logText.includes(metadataFailedMarker)) {
                const failed = parseMetadataFailure(logText);
                if (failed) metadataFailure429 = failed;
              }
              if (logText.includes(publishRaceMarker)) {
                publishRaceRestartRequired = true;
              }
              if ((runnerRestartRequired && (evacuated429 || metadataFailure429)) ||
                  publishRaceRestartRequired) break;
            }
            if (runnerRestartRequired) {
              if (evacuated429) {
                await recoverFrom429OnFreshVm({
                  owner, repo, run, evacuated429,
                  max429Restarts,
                });
              } else if (metadataFailure429) {
                const failed = metadataFailure429;
                const threadText = failed.issueNumber || failed.prNumber;
                const threadNumber = /^[0-9]+$/.test(threadText)
                  ? Number(threadText)
                  : 0;
                await recordRecoveryState({
                  threadNumber,
                  operation: failed.operationId,
                  generation: failed.generation,
                  checkpointRef: failed.salvageRef,
                  checkpointSha: '',
                  state: 'metadata-failed',
                  attempt: 1,
                  nextDue: Math.floor(Date.now() / 1000) + 300,
                  detail: 'workflow-metadata-failed',
                  summary: 'The burned runner preserved raw work on salvage ref `' +
                    (failed.salvageRef || 'none') + '` but could not produce valid ' +
                    'recovery metadata. No recoverable checkpoint pointer was ' +
                    'published, no task budget was consumed, and no pause was applied. ' +
                    'A bounded repair/catch-up owns the next step.',
                });
                core.warning(
                  'OpenCode 429 metadata failure for operation ' + failed.operationId +
                  ' generation ' + failed.generation + '; raw work preserved at ' +
                  (failed.salvageRef || 'no salvage ref') + '.'
                );
              } else {
                // Pre-#366 runs logged only the restart marker. Recover a
                // trusted issue identity from the stable run-name and bind the
                // legacy branch to its same-tip generation ref; if that fails
                // closed the catch-up simply re-scans without pausing.
                await recoverFrom429OnFreshVm({
                  owner, repo, run,
                  evacuated429: null,
                  max429Restarts,
                });
                core.warning(
                  'OpenCode infrastructure marker in run ' + run.id +
                  ' has no newer checkpoint pointer; legacy issue-checkpoint ' +
                  'binding (if any) owns the next step. No pause was applied.'
                );
              }
              return;
            }

            // A CodeRabbit repair can finish all code edits and still lose a
            // non-fast-forward race when auto-merge advances the PR branch.
            // Re-run the same workflow run so GitHub preserves the original
            // workflow_dispatch inputs (mode/pr/head_ref/review_id). This path
            // runs before issue-number routing because repair runs are PR work,
            // not issue implementation runs.
            if (publishRaceRestartRequired) {
              const attempt = Number(run.run_attempt || 1);
              const maxPublishRaceRestarts = 3;
              if (attempt <= maxPublishRaceRestarts) {
                await readGithub.rest.actions.reRunWorkflow({
                  owner,
                  repo,
                  run_id: run.id,
                });
                core.notice(
                  'OpenCode publish race: restarted workflow run ' + run.id +
                  ' with preserved inputs, attempt ' + (attempt + 1) +
                  '/' + (maxPublishRaceRestarts + 1) + '.'
                );
              } else {
                core.warning(
                  'OpenCode publish-race recovery exhausted after ' +
                  maxPublishRaceRestarts + ' restart(s) for run ' + run.id + '.'
                );
              }
              return;
            }

            let issueNumber = null;
            // Consumers that give their OpenCode caller a `run-name` of
            // `OpenCode issue #<n>` get an exact, unambiguous issue number here.
            const numberedRun = (run.display_title || '').match(
              /^OpenCode issue #(\d+)$/
            );
            if (numberedRun) {
              issueNumber = Number(numberedRun[1]);
            } else if (run.event === 'issue_comment') {
              // Without a `run-name`, GitHub uses the issue title as
              // display_title. Only accept an exact, unique open-issue match so
              // an unrelated run can never be mapped onto an issue.
              const openIssues = await readGithub.paginate(
                readGithub.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                }
              );
              const titleMatches = openIssues.filter(item =>
                !item.pull_request &&
                item.title === run.display_title
              );
              if (titleMatches.length === 1) {
                issueNumber = titleMatches[0].number;
                core.notice(
                  'Mapped legacy OpenCode run ' + run.id + ' to issue #' +
                  issueNumber + ' by exact title.'
                );
              }
            }

            if (issueNumber === null) {
              core.info(
                'Run is not an identifiable issue implementation run; watchdog does nothing.'
              );
              return;
            }
            const retryableConclusions = new Set([
              'failure',
              'timed_out',
              'startup_failure',
              'action_required',
              'stale',
            ]);

            const issueResponse = await readGithub.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const issue = issueResponse.data;

            if (issue.state !== 'open') {
              core.info('Issue #' + issueNumber + ' is already closed.');
              return;
            }

            const issueLabels = new Set(
              (issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              )
            );

            // Explicit pause always wins over automatic recovery.
            if (issueLabels.has(pausedLabel)) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber +
                ' is ' + pausedLabel + '; watchdog will not retry it.'
              );
              return;
            }

            const declaredDependencyMatch = (issue.body || '').match(
              /<!--\s*automation-blocked-by:\s*([0-9#\s,]+?)\s*-->/i
            );
            const declaredDependencyNumbers = declaredDependencyMatch
              ? [...new Set(
                  [...declaredDependencyMatch[1].matchAll(/\d+/g)]
                    .map(item => Number.parseInt(item[0], 10))
                    .filter(Number.isInteger)
                )]
              : [];
            const declaredOpenBlockers = [];
            for (const blockerNumber of declaredDependencyNumbers) {
              if (blockerNumber === issueNumber) continue;
              const blocker = await readGithub.rest.issues.get({
                owner,
                repo,
                issue_number: blockerNumber,
              });
              if (blocker.data.state === 'open') declaredOpenBlockers.push(blocker.data);
            }
            if (declaredOpenBlockers.length > 0) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber + ' is declared blocked by ' +
                declaredOpenBlockers.map(blocker => '#' + blocker.number).join(', ') +
                '; watchdog will not retry it.'
              );
              return;
            }

            // Native GitHub issue dependencies are authoritative. A cancelled
            // or failed run for an issue that is currently blocked must not be
            // resurrected by the watchdog before its blockers are completed.
            const blockers = await readGithub.paginate(
              'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
                headers: {
                  'X-GitHub-Api-Version': '2026-03-10',
                },
              }
            );
            const openBlockers = blockers.filter(
              blocker => blocker.state === 'open'
            );
            if (openBlockers.length > 0) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber + ' is blocked by ' +
                openBlockers.map(blocker => '#' + blocker.number).join(', ') +
                '; watchdog will not retry it.'
              );
              return;
            }

            const failedRun = retryableConclusions.has(run.conclusion);
            const successfulRunWithoutPr = run.conclusion === 'success';

            if (!failedRun && !successfulRunWithoutPr) {
              core.info(
                'Issue #' + issueNumber + ' run completed with conclusion=' +
                run.conclusion + '; watchdog does not retry this conclusion.'
              );
              return;
            }

            // If OpenCode managed to create a PR before the workflow failed,
            // that PR is authoritative. Do not start another implementation.
            const pulls = await readGithub.paginate(readGithub.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issuePr = pulls.find(pr =>
              pr.head?.repo?.full_name === repoFullName &&
              (pr.head.ref || '').startsWith('opencode/issue' + issueNumber + '-')
            );

            if (issuePr) {
              core.notice(
                'Issue #' + issueNumber + ' already has open PR #' +
                issuePr.number + '; watchdog will not retry.'
              );
              return;
            }

            // A manually queued/restarted run may already exist. Never add a
            // second retry when another run for the same issue is active.
            const runs = await readGithub.paginate(
              readGithub.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );

            const sameTitle = 'OpenCode issue #' + issueNumber;
            const legacyTitle = issue.title;
            const anotherActiveRun = runs.find(candidate => {
              // `run.path` is the workflow that produced this run, and the
              // watched workflow's `name:` is the same identity GitHub's
              // `workflow_run` filter uses. Matching on either keeps this
              // correct for a consumer that renamed the file but not the
              // workflow, and vice versa.
              const sameWorkflow =
                candidate.path === run.path ||
                (watchedWorkflow !== '' && candidate.name === watchedWorkflow);

              return (
                candidate.id !== run.id &&
                sameWorkflow &&
                candidate.status !== 'completed' &&
                (
                  candidate.display_title === sameTitle ||
                  (
                    candidate.event === 'issue_comment' &&
                    candidate.display_title === legacyTitle
                  )
                )
              );
            });

            if (anotherActiveRun) {
              core.notice(
                'Issue #' + issueNumber + ' already has active OpenCode run ' +
                anotherActiveRun.id + ' (' + anotherActiveRun.status +
                '); watchdog will not duplicate it.'
              );
              return;
            }

            const comments = await readGithub.paginate(
              readGithub.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            const previousRetries = comments.filter(comment =>
              (comment.body || '').includes(retryMarker)
            ).length;

            // A scheduler dispatch comment newer than this run means a *newer*
            // automated attempt already owns the issue. Retrying here would race
            // it, so the watchdog stands down and lets the newer attempt win.
            // Manual `/oc` runs, which carry no dispatch marker at all, are
            // exactly the runs this watchdog exists to recover.
            const runStartedAt =
              new Date(run.run_started_at || run.created_at || 0).getTime();
            const newerSchedulerDispatch = comments.find(comment =>
              (comment.body || '').includes(dispatchMarker) &&
              new Date(comment.created_at || 0).getTime() > runStartedAt
            );
            if (newerSchedulerDispatch) {
              core.notice(
                'Issue #' + issueNumber +
                ' has a newer scheduler dispatch (comment ' +
                newerSchedulerDispatch.id +
                '); watchdog will not race it.'
              );
              return;
            }

            const maxRetries = Number.parseInt(
              process.env.MAX_RECOVERY_RETRIES || '1',
              10
            );
            if (!Number.isInteger(maxRetries) || maxRetries < 0) {
              throw new Error(
                'Invalid MAX_RECOVERY_RETRIES: ' +
                process.env.MAX_RECOVERY_RETRIES
              );
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            async function addLabel(name) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [name],
              });
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            await ensureLabel(
              inProgressLabel,
              '5319E7',
              'Actively reserved or implemented by the automatic issue scheduler.'
            );
            await ensureLabel(
              pausedLabel,
              'BFDADC',
              'Automation is paused after a failed/stopped implementation; remove to retry.'
            );

            if (previousRetries >= maxRetries) {
              if (!pauseOnFailure) {
                // Keep the reservation so the scheduler lease provides a
                // bounded cooldown. The scheduler releases and retries it
                // automatically after lease expiry, avoiding both a terminal
                // human pause and a tight retry loop.
                await removeLabel(pausedLabel);
                core.warning(
                  'Issue #' + issueNumber +
                    ' exhausted automatic OpenCode recovery; pause_on_failure=false, ' +
                    'so scheduler lease/backoff remains authoritative.'
                );
                return;
              }
              await removeLabel(inProgressLabel);
              await addLabel(pausedLabel);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  '⚡ **Continuum · opencode-watchdog**',
                  '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                  '',
                  'OpenCode automation paused after ' + previousRetries +
                    ' automatic recovery retries.',
                  '',
                  'Last run: ' + run.html_url,
                  'Conclusion: ' + run.conclusion,
                  '',
                  'Remove the `' + pausedLabel + '` label and post `/oc` to retry manually.',
                ].join('\n'),
              });
              core.warning(
                'Issue #' + issueNumber + ' exhausted automatic OpenCode recovery.'
              );
              return;
            }

            await removeLabel(pausedLabel);
            await addLabel(inProgressLabel);

            // The actual recovery: a fresh `/oc` comment, which the consumer's
            // OpenCode caller admits on an owner-authored issue comment.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                '/oc',
                '',
                retryMarker,
                '⚡ **Continuum · opencode-watchdog**',
                '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                'Automatic recovery retry ' + (previousRetries + 1) +
                  '/' + maxRetries + ' after OpenCode run ' + run.id +
                  ' ended with ' + run.conclusion +
                  (run.conclusion === 'success' ? ' but produced no PR.' : '.') ,
              ].join('\n'),
            });

            core.notice(
              'Immediately retried issue #' + issueNumber +
              ' after failed OpenCode run ' + run.id + '.'
            );