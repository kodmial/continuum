name: OpenCode watchdog

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      timeout_minutes:
        description: >-
          Job timeout for the recovery. Empty falls back to
          AUTOMATION_WATCHDOG_TIMEOUT_MINUTES.
        required: false
        type: string
        default: ''
      watched_workflow:
        description: >-
          `name:` of the workflow whose completed runs this watchdog recovers.
          It must match the `name:` of the consumer's OpenCode caller, because
          GitHub's `workflow_run.workflows` filter matches on the workflow
          `name:` and never on a file name. The caller stub hardcodes the same
          value in its own `workflow_run:` block; this input only lets the
          engine recognise sibling runs of that workflow when it decides
          whether a retry is already in flight.
        required: false
        type: string
        default: ''
      max_recovery_retries:
        description: >-
          Automatic recovery retries before the issue is paused. Empty falls
          back to AUTOMATION_WATCHDOG_MAX_RETRIES.
        required: false
        type: string
        default: ''
      max_429_runner_restarts:
        description: >-
          Fresh-runner restarts after an OpenCode 429 marker. Empty falls back
          to AUTOMATION_WATCHDOG_MAX_429_RUNNER_RESTARTS, then 3.
        required: false
        type: string
        default: ''
      retry_marker:
        description: >-
          Hidden HTML marker counted to decide how many recovery retries an
          issue already consumed. Empty falls back to
          AUTOMATION_WATCHDOG_RETRY_MARKER.
        required: false
        type: string
        default: ''
      in_progress_label:
        description: >-
          Label holding an automation reservation. Empty falls back to
          AUTOMATION_IN_PROGRESS_LABEL. Must match the scheduler's
          in_progress_label.
        required: false
        type: string
        default: ''
      pause_marker:
        description: >-
          Label that pauses automation. Empty falls back to
          AUTOMATION_PAUSE_LABEL. Must match the scheduler's pause_marker.
        required: false
        type: string
        default: ''
      dispatch_marker:
        description: >-
          Hidden HTML marker the scheduler writes into its dispatch comments.
          Empty falls back to AUTOMATION_DISPATCH_MARKER. The watchdog uses it
          to detect that a *newer* automated attempt already owns the issue, in
          which case it stands down instead of racing that attempt.
        required: false
        type: string
        default: ''
      pause_on_failure:
        description: >-
          Deprecated compatibility input. Exhausted recovery never enters a
          terminal pause; the scheduler lease/backoff remains authoritative
          and automation:ready is re-checked before any new attempt.
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-opencode-watchdog-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    # Capability-only: recovery is pure issue/label/comment bookkeeping, so it
    # runs anywhere. This job never checks out or executes issue code.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.AUTOMATION_WATCHDOG_TIMEOUT_MINUTES || '5') }}

    permissions:
      # Same-repository reads below run on READ_GITHUB_TOKEN (`github.token`),
      # so they honour these job permissions (unlike PAT reads): issues for
      # issues.get/listForRepo/listComments, pull-requests for pulls.list, and
      # actions for listWorkflowRunsForRepo. The caller stub must grant at
      # least the same scopes.
      actions: write
      contents: read
      issues: write
      pull-requests: read

    env:
      WATCHED_WORKFLOW: ${{ inputs.watched_workflow }}
      MAX_RECOVERY_RETRIES: ${{ inputs.max_recovery_retries || vars.AUTOMATION_WATCHDOG_MAX_RETRIES || '1' }}
      MAX_429_RUNNER_RESTARTS: ${{ inputs.max_429_runner_restarts || vars.AUTOMATION_WATCHDOG_MAX_429_RUNNER_RESTARTS || '3' }}
      GITHUB_API_URL: ${{ github.api_url }}
      RETRY_MARKER: ${{ inputs.retry_marker || vars.AUTOMATION_WATCHDOG_RETRY_MARKER || '<!-- opencode-watchdog-retry -->' }}
      IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
      PAUSE_LABEL: ${{ inputs.pause_marker || vars.AUTOMATION_PAUSE_LABEL || 'automation:paused' }}
      DISPATCH_MARKER: ${{ inputs.dispatch_marker || vars.AUTOMATION_DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->' }}
      READ_GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Recover failed OpenCode issue run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # TAP_PAT is intentional: the recovery writes labels and comments,
          # and only a PAT (not GITHUB_TOKEN) reliably fans those writes out
          # into the scheduler's and OpenCode's own event triggers.
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const repoFullName = owner + '/' + repo;
            const watchedWorkflow = process.env.WATCHED_WORKFLOW || '';
            const retryMarker = process.env.RETRY_MARKER || '<!-- opencode-watchdog-retry -->';
            const inProgressLabel = process.env.IN_PROGRESS_LABEL || 'automation:in-progress';
            const pausedLabel = process.env.PAUSE_LABEL || 'automation:paused';
            const dispatchMarker = process.env.DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->';

            // Use the repository-scoped token for same-repository reads.
            // Keep the github-script action client PAT-authenticated below for
            // label/comment writes whose PAT actor intentionally fans out events.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            if (!readToken) {
              throw new Error(
                'READ_GITHUB_TOKEN is required for same-repository watchdog reads.'
              );
            }
            const readGithub = new github.constructor({
              auth: readToken,
              baseUrl: github.request.endpoint.DEFAULTS.baseUrl,
            });
            // github-script supplies the plugin-composed Octokit class, so
            // reusing its constructor keeps the `paginate`/`rest` plugins
            // (dynamically requiring `@actions/github` is not resolvable from
            // the script sandbox). Confirm the composition at runtime so a
            // future actions/github-script upgrade that returns a bare core
            // fails fast here instead of mid-recovery with
            // `readGithub.paginate is not a function`.
            if (
              typeof readGithub.paginate !== 'function' ||
              typeof readGithub.rest?.issues?.get !== 'function' ||
              typeof readGithub.rest?.issues?.listForRepo !== 'function' ||
              typeof readGithub.rest?.issues?.listComments !== 'function' ||
              typeof readGithub.rest?.pulls?.list !== 'function' ||
              typeof readGithub.rest?.actions?.listWorkflowRunsForRepo !== 'function' ||
              typeof readGithub.rest?.actions?.listJobsForWorkflowRun !== 'function' ||
              typeof readGithub.rest?.actions?.reRunWorkflow !== 'function'
            ) {
              throw new Error(
                'readGithub client lacks the paginate/rest plugins; ' +
                'cannot perform same-repository watchdog reads.'
              );
            }
            // 429 is a runner-lifecycle failure, not an issue/task failure.
            // kodmial/continuum#290: the burned runner already evacuated
            // workflow-owned state to a durable checkpoint ref and terminated
            // (exit 75) without invoking the model again on that VM. The
            // watchdog never uses reRunWorkflow for 429 recovery: re-running
            // the same run would replay completed stages and re-spend
            // task-failure budgets. Instead it dispatches a NEW
            // workflow_dispatch carrying the explicit recovery identity
            // (operation id + checkpoint ref/SHA + stage + generation) onto
            // a fresh VM, which restores the exact checkpoint and continues
            // from the last completed stage. Deduplication is by stable
            // operation identity; 429 never consumes task/review/
            // qualification budgets, never applies automation:paused, and
            // never requires manual /oc. Repeated fresh-VM 429s enter
            // bounded infrastructure backoff and resume automatically.
            const rateLimitMarker = 'CONTINUUM_OPENCODE_429_RESTART_REQUIRED';
            const upstreamUnavailableMarker =
              'CONTINUUM_OPENCODE_UPSTREAM_UNAVAILABLE_RESTART_REQUIRED';
            const publishRaceMarker =
              'CONTINUUM_OPENCODE_PUBLISH_RACE_RETRY_REQUIRED';
            // Evacuation line written by the workflow-owned 429 evacuator:
            // "Evacuated 429 checkpoint <ref> at exact SHA <sha> (operation
            // <op>, stage <stage>, generation <gen>, mode <mode>, issue <i>,
            // pr <p>, branch <b>)."
            const evacuatedRe =
              /Evacuated (?:429|infrastructure) checkpoint (\S+) at exact SHA ([0-9a-f]{40}) \(operation (\S+), stage (\S+), generation (\d+), mode (\S+), issue ([^,]*), pr ([^,]*), branch ([^)]*)\)/;
            const max429Restarts = Number.parseInt(
              process.env.MAX_429_RUNNER_RESTARTS || '3',
              10
            );
            if (!Number.isInteger(max429Restarts) || max429Restarts < 0) {
              throw new Error(
                'Invalid MAX_429_RUNNER_RESTARTS: ' +
                process.env.MAX_429_RUNNER_RESTARTS
              );
            }

            // kodmial/continuum#346: a watchdog recovery is a new coder
            // attempt, so it re-applies the same fixed admission and the same
            // durable generation-stop fence as the scheduler and OpenCode
            // entry. Restoring automation:ready never clears a stop.
            const generationStopRe =
              /<!--\s*continuum-task-generation-stop\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s+generation=(\d+)\s+pinned-spec=([0-9a-fA-F]{64})\s+live-spec=([0-9a-fA-F]{64})\s+reason=(drift|tampered|operator)\s*-->/;
            const generationRecoverRe =
              /<!--\s*continuum-task-generation-recover\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s+generation=(\d+)\s*-->/;
            const stopOrder = (comment) =>
              `${(comment && comment.created_at) || ''}:${String((comment && comment.id) || 0).padStart(20, '0')}`;
            function trustedOperatorComment(comment) {
              const association = String((comment && comment.author_association) || '').toUpperCase();
              if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) return true;
              const login = String((comment && comment.user && comment.user.login) || '').toLowerCase();
              return login === 'github-actions[bot]' || login === String(owner).toLowerCase();
            }
            function generationStopActive(comments, repoFull, issueNumber, generation = 1) {
              const stops = [];
              const recovers = [];
              for (const comment of comments || []) {
                if (!trustedOperatorComment(comment)) continue;
                const body = String((comment && comment.body) || '');
                const stop = body.match(generationStopRe);
                if (stop && stop[1].toLowerCase() === repoFull.toLowerCase() &&
                    Number(stop[2]) === Number(issueNumber) &&
                    Number(stop[3]) === Number(generation)) {
                  stops.push(stopOrder(comment));
                  continue;
                }
                const recover = body.match(generationRecoverRe);
                if (recover && recover[1].toLowerCase() === repoFull.toLowerCase() &&
                    Number(recover[2]) === Number(issueNumber) &&
                    Number(recover[3]) === Number(generation)) {
                  recovers.push(stopOrder(comment));
                }
              }
              stops.sort();
              recovers.sort();
              return stops.length > 0 &&
                !(recovers.length > 0 && recovers[recovers.length - 1] > stops[stops.length - 1]);
            }
            async function issueRecoveryAdmission(issueNumber, generation = 1) {
              const number = Number(issueNumber);
              if (!Number.isInteger(number) || number <= 0) {
                return { admit: false, reason: 'invalid issue identity' };
              }
              let issue;
              try {
                issue = (await readGithub.rest.issues.get({
                  owner, repo, issue_number: number,
                })).data;
              } catch (err) {
                return { admit: false, reason: 'authoritative issue read failed: ' + (err.message || err) };
              }
              if (issue.pull_request) {
                return { admit: false, reason: 'target is a pull request' };
              }
              if (issue.state !== 'open') {
                return { admit: false, reason: 'target issue is closed' };
              }
              const labels = new Set((issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              ));
              if (!labels.has('automation:ready')) {
                return { admit: false, reason: 'missing automation:ready' };
              }
              let comments;
              try {
                comments = await readGithub.paginate(
                  readGithub.rest.issues.listComments,
                  { owner, repo, issue_number: number, per_page: 100 }
                );
              } catch (err) {
                return { admit: false, reason: 'comment history read failed: ' + (err.message || err) };
              }
              if (generationStopActive(comments, repoFullName, number, generation)) {
                return {
                  admit: false,
                  reason: 'generation ' + Number(generation) + ' is terminally stopped',
                };
              }
              return { admit: true, reason: 'admitted' };
            }

            // kodmial/continuum#290: fresh-VM 429 resumption. Dispatches a NEW
            // workflow_dispatch carrying the explicit recovery identity onto
            // a fresh VM. Never reRunWorkflow (that would replay completed
            // stages on the same run), never consumes task/review/
            // qualification budgets, never applies automation:paused, never
            // requires manual /oc. Identity and numbers only: repository
            // names never enter logs or comments, so public Parent logs keep
            // Child identities opaque.
            async function recoverFrom429OnFreshVm({
              owner, repo, run, evacuated429,
              max429Restarts,
            }) {
              if (!evacuated429) {
                core.notice(
                  'OpenCode infrastructure marker without a workflow-owned evacuation ' +
                  'pointer in run ' + run.id + '; keeping the automation ' +
                  'reservation so the scheduler lease retries it. No task ' +
                  'budget was consumed and no pause was applied.'
                );
                return;
              }
              const operation = String(evacuated429.operationId || '').trim();
              const checkpointRef = String(evacuated429.checkpointRef || '').trim();
              let generation = Number(evacuated429.generation || 0);
              if (!Number.isInteger(generation) || generation < 0) generation = 0;
              if (!operation || !/^opencode\/(?:429|infra)-checkpoint-/.test(checkpointRef)) {
                core.warning(
                  'OpenCode infrastructure evacuation identity is malformed in run ' +
                  run.id + '; keeping the reservation for scheduler retry.'
                );
                return;
              }

              // The durable checkpoint metadata is the source of truth for
              // the full recovery identity (mode, issue/PR, SHAs, stage).
              let identity;
              try {
                const content = await readGithub.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.continuum-429-recovery.json',
                  ref: checkpointRef,
                });
                if (Array.isArray(content.data) || content.data.type !== 'file') {
                  throw new Error('recovery metadata is not a file');
                }
                identity = JSON.parse(
                  Buffer.from(content.data.content, 'base64').toString('utf8')
                );
              } catch (err) {
                core.warning(
                  'OpenCode infrastructure checkpoint ' + checkpointRef +
                  ' metadata is not readable yet (' + (err.message || err) +
                  '); keeping the reservation for a later watchdog pass. ' +
                  'No pause was applied.'
                );
                return;
              }
              // The durable checkpoint ref tip is the recovery-metadata
              // commit on top of the working-tree HEAD recorded inside the
              // metadata file, so identity.head_sha (working-tree HEAD) is
              // the parent of the evacuated tip, not the tip itself.
              // Identity match is operation + generation; the exact
              // checkpoint SHA dispatched is the evacuated ref tip from the
              // workflow-owned evacuation pointer (falling back to the
              // metadata working-tree HEAD only when the pointer SHA is
              // malformed).
              if (
                String(identity.operation_id || '') !== operation ||
                Number(identity.generation || 0) !== generation
              ) {
                core.warning(
                  'OpenCode infrastructure checkpoint metadata does not match the ' +
                  'evacuation pointer for operation ' + operation + '; ' +
                  'keeping the reservation for a later watchdog pass.'
                );
                return;
              }
              const stage = String(identity.stage || 'implementation-incomplete');
              const pointerSha = String(evacuated429.checkpointSha || '');
              const checkpointSha = /^[0-9a-f]{40}$/i.test(pointerSha)
                ? pointerSha.toLowerCase()
                : String(identity.head_sha || '').toLowerCase();
              const mode = String(identity.mode || '');
              if (!['issue', 'qualification', 'coderabbit-fix', 'resolve-conflict', 'ci-fix'].includes(mode)) {
                core.warning(
                  'OpenCode infrastructure checkpoint has unknown mode for operation ' + operation +
                  '; keeping reservation for later pass.'
                );
                return;
              }
              const issueText = String(identity.issue_number || '').trim();
              const prText = String(identity.pr_number || '').trim();
              const qualText = String(identity.qualification_number || '').trim();
              const threadNumber = Number(issueText || prText || qualText || 0);
              if (!/^[0-9]+$/.test(String(threadNumber)) || threadNumber <= 0) {
                // No issue/PR thread owns this operation (or the number is
                // not trustworthy): dispatch the resumption without a
                // marker thread, but still never pause and never consume
                // task budgets.
                core.notice(
                  'OpenCode infrastructure operation ' + operation + ' has no numeric ' +
                  'thread; resuming without a dedupe comment.'
                );
              }

              // kodmial/continuum#346: a fresh-VM issue recovery is a new
              // coder attempt. Require the fixed ready label and reject a
              // terminal generation stop before claiming or dispatching.
              if (mode === 'issue') {
                if (!/^[0-9]+$/.test(issueText) || Number(issueText) <= 0) {
                  core.notice(
                    'OpenCode infrastructure issue recovery for operation ' + operation +
                    ' has no valid issue identity; keeping the reservation.'
                  );
                  return;
                }
                const admission = await issueRecoveryAdmission(
                  issueText, generation > 0 ? generation : 1
                );
                if (!admission.admit) {
                  core.notice(
                    'OpenCode infrastructure issue recovery for issue ' + issueText +
                    ' generation ' + (generation > 0 ? generation : 1) +
                    ' is not admitted (' + admission.reason +
                    '); no fresh run was dispatched.'
                  );
                  return;
                }
              }

              const resumptionMarker =
                '<!-- continuum-429-resumption op=' + operation +
                ' gen=' + generation + ' -->';
              if (Number.isInteger(threadNumber) && threadNumber > 0) {
                const comments = await readGithub.paginate(
                  readGithub.rest.issues.listComments,
                  { owner, repo, issue_number: threadNumber, per_page: 100 }
                );
                if (comments.some(comment => (comment.body || '').includes(resumptionMarker))) {
                  core.notice(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' was already resumed; watchdog will not ' +
                    'create a competing resumption.'
                  );
                  return;
                }
              }

              // Repeated fresh-VM 429s enter bounded infrastructure
              // backoff: the checkpoint is preserved, the reservation is
              // kept, and the scheduler/cron resumes automatically with the
              // same checkpoint/operation identity. Never paused, never /oc.
              if (generation > max429Restarts) {
                const backoffMarker =
                  '<!-- continuum-429-backoff op=' + operation +
                  ' gen=' + generation + ' -->';
                if (Number.isInteger(threadNumber) && threadNumber > 0) {
                  const comments = await readGithub.paginate(
                    readGithub.rest.issues.listComments,
                    { owner, repo, issue_number: threadNumber, per_page: 100 }
                  );
                  if (!comments.some(comment => (comment.body || '').includes(backoffMarker))) {
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: threadNumber,
                      body: [
                        backoffMarker,
                        '⚡ **Continuum · opencode-watchdog**',
                        '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                        'Model infrastructure unavailable across fresh runners (generation ' + generation +
                          ', operation `' + operation + '`, stage `' + stage + '`): ' +
                          'entering bounded infrastructure backoff.',
                        '',
                        'This is infrastructure exhaustion, not a task failure: no ' +
                          'task/review/qualification budget was consumed and no pause was applied.',
                        '',
                        'Checkpoint `' + checkpointRef + '` at exact SHA `' + checkpointSha + '` is preserved. ' +
                          'The scheduler resumes this operation automatically with the same ' +
                          'checkpoint/operation identity; no manual `/oc` is required.',
                      ].join('\n'),
                    });
                  }
                }
                core.warning(
                  'OpenCode infrastructure operation ' + operation + ' entered bounded ' +
                  'infrastructure backoff after ' + generation +
                  ' fresh-runner generation(s); checkpoint ' + checkpointRef +
                  ' preserved for automatic resume.'
                );
                return;
              }

              // kodmial/continuum#290: the caller stub's workflow_dispatch
              // accepts at most 25 inputs, so the explicit recovery identity
              // (operation id + checkpoint ref/SHA + stage + generation)
              // travels packed into the single recovery_identity input. The
              // stub unpacks it into the reusable workflow's explicit
              // recovery inputs; every field stays explicit, none is elided.
              const dispatchInputs = {
                mode: mode,
                issue_number: String(identity.issue_number || ''),
                pr_number: String(identity.pr_number || ''),
                head_ref: String(identity.head_ref || identity.branch || ''),
                review_id: String(identity.review_id || ''),
                unresolved_items_json: String(identity.unresolved_items_json || ''),
                run_id: String(identity.run_id || ''),
                base_ref: String(identity.base_ref || ''),
                capability_number: String(identity.capability_number || ''),
                qualification_number: String(identity.qualification_number || ''),
                required_sha: String(identity.required_sha || ''),
                recovery_identity: JSON.stringify({
                  recovery_operation_id: operation,
                  recovery_checkpoint_ref: checkpointRef,
                  recovery_checkpoint_sha: checkpointSha,
                  recovery_stage: stage,
                  recovery_generation: String(generation),
                }),
              };
              // Exactly-once resumption claim: the durable resumption
              // marker is recorded BEFORE createWorkflowDispatch via a
              // fresh createComment, so two concurrent watchdog passes for
              // the same operation/generation cannot both observe an empty
              // marker and both dispatch competing resumptions. The loser
              // of the claim race deletes its own claim and stands down;
              // a dispatch failure deletes the claim so a retry that never
              // dispatched is never mistaken for a completed resumption.
              let resumptionClaim = null;
              if (Number.isInteger(threadNumber) && threadNumber > 0) {
                const claimBody = [
                  resumptionMarker,
                  '⚡ **Continuum · opencode-watchdog**',
                  '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                  'Model provider/transport failed; restarting from an exact-SHA checkpoint (not a task failure).',
                  '',
                  'Resumption claim for operation `' + operation + '` ' +
                    'from checkpoint `' + checkpointRef + '` at exact SHA `' + checkpointSha + '` ' +
                    '(stage `' + stage + '`, generation ' + generation + '); ' +
                    'dispatch in progress.',
                ].join('\n');
                try {
                  const created = await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: threadNumber,
                    body: claimBody,
                  });
                  resumptionClaim = created.data;
                } catch (claimErr) {
                  core.warning(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' could not record the resumption claim (' +
                    (claimErr.message || claimErr) +
                    '); keeping the reservation for a later watchdog pass.'
                  );
                  return;
                }
                try {
                  const recheck = await readGithub.paginate(
                    readGithub.rest.issues.listComments,
                    { owner, repo, issue_number: threadNumber, per_page: 100 }
                  );
                  const markers = recheck
                    .filter(comment => (comment.body || '').includes(resumptionMarker))
                    .sort((a, b) => Number(a.id || 0) - Number(b.id || 0));
                  if (markers.length > 0 && markers[0].id !== resumptionClaim.id) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: resumptionClaim.id,
                      });
                    } catch (pruneErr) {
                      core.warning(
                        'OpenCode infrastructure operation ' + operation +
                        ': duplicate resumption claim prune failed: ' +
                        (pruneErr.message || pruneErr)
                      );
                    }
                    core.notice(
                      'OpenCode infrastructure operation ' + operation + ' generation ' +
                      generation + ' was already claimed; watchdog will not ' +
                      'create a competing resumption.'
                    );
                    return;
                  }
                } catch (recheckErr) {
                  try {
                    await github.rest.issues.deleteComment({
                      owner,
                      repo,
                      comment_id: resumptionClaim.id,
                    });
                  } catch (cleanupErr) {
                    core.warning(
                      'OpenCode infrastructure operation ' + operation +
                      ': pre-dispatch claim cleanup failed: ' +
                      (cleanupErr.message || cleanupErr)
                    );
                  }
                  resumptionClaim = null;
                  core.warning(
                    'OpenCode infrastructure operation ' + operation + ' generation ' +
                    generation + ' could not verify the resumption claim (' +
                    (recheckErr.message || recheckErr) +
                    '); keeping the reservation for a later watchdog pass.'
                  );
                  return;
                }
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'continuum-opencode.yml',
                  ref: 'main',
                  inputs: dispatchInputs,
                });
              } catch (dispatchErr) {
                if (resumptionClaim) {
                  try {
                    await github.rest.issues.deleteComment({
                      owner,
                      repo,
                      comment_id: resumptionClaim.id,
                    });
                  } catch (cleanupErr) {
                    core.warning(
                      'OpenCode infrastructure operation ' + operation +
                      ': pre-dispatch claim cleanup failed: ' +
                      (cleanupErr.message || cleanupErr)
                    );
                  }
                }
                core.warning(
                  'OpenCode infrastructure operation ' + operation + ' generation ' +
                  generation + ' dispatch failed (' +
                  (dispatchErr.message || dispatchErr) +
                  '); keeping the reservation for a later watchdog pass. ' +
                  'No pause was applied.'
                );
                return;
              }
              core.notice(
                'OpenCode 429: dispatched fresh-VM resumption for operation ' +
                operation + ' generation ' + generation + ' stage ' + stage +
                ' from checkpoint ' + checkpointRef + ' at exact SHA ' +
                checkpointSha + '.'
              );
              if (Number.isInteger(threadNumber) && threadNumber > 0) {
                const resumptionBody = [
                  resumptionMarker,
                  '⚡ **Continuum · opencode-watchdog**',
                  '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                  'Model provider/transport failed; restarting from an exact-SHA checkpoint (not a task failure).',
                  '',
                  'Dispatched a fresh-VM resumption for operation `' + operation + '` ' +
                    'from checkpoint `' + checkpointRef + '` at exact SHA `' + checkpointSha + '` ' +
                    '(stage `' + stage + '`, generation ' + generation + ').',
                  '',
                  'Completed stages are not repeated; no task/review/qualification budget was consumed.',
                ].join('\n');
                if (resumptionClaim) {
                  try {
                    await github.rest.issues.updateComment({
                      owner,
                      repo,
                      comment_id: resumptionClaim.id,
                      body: resumptionBody,
                    });
                  } catch (updateErr) {
                    core.warning(
                      'OpenCode infrastructure operation ' + operation +
                      ': resumption marker update failed: ' +
                      (updateErr.message || updateErr)
                    );
                  }
                }
              }
            }
            const jobs = await readGithub.paginate(
              readGithub.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              }
            );
            let runnerRestartRequired = false;
            let publishRaceRestartRequired = false;
            let evacuated429 = null;
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');
            for (const job of jobs) {
              const response = await fetch(
                apiBase + '/repos/' + owner + '/' + repo +
                  '/actions/jobs/' + job.id + '/logs',
                {
                  headers: {
                    accept: 'application/vnd.github+json',
                    authorization: 'Bearer ' + readToken,
                    'x-github-api-version': '2022-11-28',
                  },
                  redirect: 'follow',
                }
              );
              if (!response.ok) {
                core.warning(
                  'Could not inspect job ' + job.id +
                  ' for 429 recovery marker: HTTP ' + response.status
                );
                continue;
              }
              const logText = await response.text();
              // GitHub echoes shell source into job logs. Match only the
              // executed workflow-command error line, not a marker embedded
              // in the printed run script or an agent prompt.
              const emittedRestartMarker = logText.split('\n').some(line =>
                line.includes('##[error]') &&
                (line.includes(rateLimitMarker) ||
                 line.includes(upstreamUnavailableMarker))
              );
              if (emittedRestartMarker) {
                runnerRestartRequired = true;
                const evacuated = logText.match(evacuatedRe);
                if (evacuated) {
                  evacuated429 = {
                    checkpointRef: evacuated[1],
                    checkpointSha: evacuated[2],
                    operationId: evacuated[3],
                    stage: evacuated[4],
                    generation: Number.parseInt(evacuated[5], 10),
                    mode: evacuated[6],
                    issueNumber: (evacuated[7] || '').trim(),
                    prNumber: (evacuated[8] || '').trim(),
                    branch: (evacuated[9] || '').trim(),
                  };
                }
              }
              if (logText.includes(publishRaceMarker)) {
                publishRaceRestartRequired = true;
              }
              if ((runnerRestartRequired && evacuated429) || publishRaceRestartRequired) break;
            }
            if (runnerRestartRequired) {
              await recoverFrom429OnFreshVm({
                owner, repo, run, evacuated429,
                max429Restarts,
              });
              return;
            }

            // A CodeRabbit repair can finish all code edits and still lose a
            // non-fast-forward race when auto-merge advances the PR branch.
            // Re-run the same workflow run so GitHub preserves the original
            // workflow_dispatch inputs (mode/pr/head_ref/review_id). This path
            // runs before issue-number routing because repair runs are PR work,
            // not issue implementation runs.
            if (publishRaceRestartRequired) {
              const attempt = Number(run.run_attempt || 1);
              const maxPublishRaceRestarts = 3;
              if (attempt <= maxPublishRaceRestarts) {
                await readGithub.rest.actions.reRunWorkflow({
                  owner,
                  repo,
                  run_id: run.id,
                });
                core.notice(
                  'OpenCode publish race: restarted workflow run ' + run.id +
                  ' with preserved inputs, attempt ' + (attempt + 1) +
                  '/' + (maxPublishRaceRestarts + 1) + '.'
                );
              } else {
                core.warning(
                  'OpenCode publish-race recovery exhausted after ' +
                  maxPublishRaceRestarts + ' restart(s) for run ' + run.id + '.'
                );
              }
              return;
            }

            let issueNumber = null;
            // Consumers that give their OpenCode caller a `run-name` of
            // `OpenCode issue #<n>` get an exact, unambiguous issue number here.
            const numberedRun = (run.display_title || '').match(
              /^OpenCode issue #(\d+)$/
            );
            if (numberedRun) {
              issueNumber = Number(numberedRun[1]);
            } else if (run.event === 'issue_comment') {
              // Without a `run-name`, GitHub uses the issue title as
              // display_title. Only accept an exact, unique open-issue match so
              // an unrelated run can never be mapped onto an issue.
              const openIssues = await readGithub.paginate(
                readGithub.rest.issues.listForRepo,
                {
                  owner,
                  repo,
                  state: 'open',
                  per_page: 100,
                }
              );
              const titleMatches = openIssues.filter(item =>
                !item.pull_request &&
                item.title === run.display_title
              );
              if (titleMatches.length === 1) {
                issueNumber = titleMatches[0].number;
                core.notice(
                  'Mapped legacy OpenCode run ' + run.id + ' to issue #' +
                  issueNumber + ' by exact title.'
                );
              }
            }

            if (issueNumber === null) {
              core.info(
                'Run is not an identifiable issue implementation run; watchdog does nothing.'
              );
              return;
            }
            const retryableConclusions = new Set([
              'failure',
              'timed_out',
              'startup_failure',
              'action_required',
              'stale',
            ]);

            const issueResponse = await readGithub.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const issue = issueResponse.data;

            if (issue.state !== 'open') {
              core.info('Issue #' + issueNumber + ' is already closed.');
              return;
            }

            const issueLabels = new Set(
              (issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              )
            );

            // Canonical admission always wins over automatic recovery:
            // without automation:ready the watchdog starts zero new runs.
            // A stale legacy pause label is inert and never re-created.
            if (!issueLabels.has('automation:ready')) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber +
                ' is missing automation:ready; watchdog will not start a new coder run.'
              );
              return;
            }

            const declaredDependencyMatch = (issue.body || '').match(
              /<!--\s*automation-blocked-by:\s*([0-9#\s,]+?)\s*-->/i
            );
            const declaredDependencyNumbers = declaredDependencyMatch
              ? [...new Set(
                  [...declaredDependencyMatch[1].matchAll(/\d+/g)]
                    .map(item => Number.parseInt(item[0], 10))
                    .filter(Number.isInteger)
                )]
              : [];
            const declaredOpenBlockers = [];
            for (const blockerNumber of declaredDependencyNumbers) {
              if (blockerNumber === issueNumber) continue;
              const blocker = await readGithub.rest.issues.get({
                owner,
                repo,
                issue_number: blockerNumber,
              });
              if (blocker.data.state === 'open') declaredOpenBlockers.push(blocker.data);
            }
            if (declaredOpenBlockers.length > 0) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber + ' is declared blocked by ' +
                declaredOpenBlockers.map(blocker => '#' + blocker.number).join(', ') +
                '; watchdog will not retry it.'
              );
              return;
            }

            // Native GitHub issue dependencies are authoritative. A cancelled
            // or failed run for an issue that is currently blocked must not be
            // resurrected by the watchdog before its blockers are completed.
            const blockers = await readGithub.paginate(
              'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
                headers: {
                  'X-GitHub-Api-Version': '2026-03-10',
                },
              }
            );
            const openBlockers = blockers.filter(
              blocker => blocker.state === 'open'
            );
            if (openBlockers.length > 0) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: inProgressLabel,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              core.notice(
                'Issue #' + issueNumber + ' is blocked by ' +
                openBlockers.map(blocker => '#' + blocker.number).join(', ') +
                '; watchdog will not retry it.'
              );
              return;
            }

            const failedRun = retryableConclusions.has(run.conclusion);
            const successfulRunWithoutPr = run.conclusion === 'success';

            if (!failedRun && !successfulRunWithoutPr) {
              core.info(
                'Issue #' + issueNumber + ' run completed with conclusion=' +
                run.conclusion + '; watchdog does not retry this conclusion.'
              );
              return;
            }

            // If OpenCode managed to create a PR before the workflow failed,
            // that PR is authoritative. Do not start another implementation.
            const pulls = await readGithub.paginate(readGithub.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issuePr = pulls.find(pr =>
              pr.head?.repo?.full_name === repoFullName &&
              (pr.head.ref || '').startsWith('opencode/issue' + issueNumber + '-')
            );

            if (issuePr) {
              core.notice(
                'Issue #' + issueNumber + ' already has open PR #' +
                issuePr.number + '; watchdog will not retry.'
              );
              return;
            }

            // A manually queued/restarted run may already exist. Never add a
            // second retry when another run for the same issue is active.
            const runs = await readGithub.paginate(
              readGithub.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              }
            );

            const sameTitle = 'OpenCode issue #' + issueNumber;
            const legacyTitle = issue.title;
            const anotherActiveRun = runs.find(candidate => {
              // `run.path` is the workflow that produced this run, and the
              // watched workflow's `name:` is the same identity GitHub's
              // `workflow_run` filter uses. Matching on either keeps this
              // correct for a consumer that renamed the file but not the
              // workflow, and vice versa.
              const sameWorkflow =
                candidate.path === run.path ||
                (watchedWorkflow !== '' && candidate.name === watchedWorkflow);

              return (
                candidate.id !== run.id &&
                sameWorkflow &&
                candidate.status !== 'completed' &&
                (
                  candidate.display_title === sameTitle ||
                  (
                    candidate.event === 'issue_comment' &&
                    candidate.display_title === legacyTitle
                  )
                )
              );
            });

            if (anotherActiveRun) {
              core.notice(
                'Issue #' + issueNumber + ' already has active OpenCode run ' +
                anotherActiveRun.id + ' (' + anotherActiveRun.status +
                '); watchdog will not duplicate it.'
              );
              return;
            }

            const comments = await readGithub.paginate(
              readGithub.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              }
            );

            // kodmial/continuum#346: an ordinary watchdog retry is a new
            // coder attempt. A terminal STOP (or drift/tamper caused by a
            // late issue edit) blocks it even if automation:ready was later
            // restored. Only an explicit newer recovery marker may rearm.
            if (generationStopActive(comments, repoFullName, issueNumber, 1)) {
              core.notice(
                'Issue #' + issueNumber + ' generation 1 is terminally stopped; ' +
                'watchdog will not start a new coder attempt.'
              );
              return;
            }

            const previousRetries = comments.filter(comment =>
              (comment.body || '').includes(retryMarker)
            ).length;

            // A scheduler dispatch comment newer than this run means a *newer*
            // automated attempt already owns the issue. Retrying here would race
            // it, so the watchdog stands down and lets the newer attempt win.
            // Manual `/oc` runs, which carry no dispatch marker at all, are
            // exactly the runs this watchdog exists to recover.
            const runStartedAt =
              new Date(run.run_started_at || run.created_at || 0).getTime();
            const newerSchedulerDispatch = comments.find(comment =>
              (comment.body || '').includes(dispatchMarker) &&
              new Date(comment.created_at || 0).getTime() > runStartedAt
            );
            if (newerSchedulerDispatch) {
              core.notice(
                'Issue #' + issueNumber +
                ' has a newer scheduler dispatch (comment ' +
                newerSchedulerDispatch.id +
                '); watchdog will not race it.'
              );
              return;
            }

            const maxRetries = Number.parseInt(
              process.env.MAX_RECOVERY_RETRIES || '1',
              10
            );
            if (!Number.isInteger(maxRetries) || maxRetries < 0) {
              throw new Error(
                'Invalid MAX_RECOVERY_RETRIES: ' +
                process.env.MAX_RECOVERY_RETRIES
              );
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            async function addLabel(name) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [name],
              });
            }

            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            await ensureLabel(
              inProgressLabel,
              '5319E7',
              'Actively reserved or implemented by the automatic issue scheduler.'
            );
            // automation:paused is retired (kodmial/continuum#346). A stale
            // label is removed, never created or read.
            await removeLabel(pausedLabel);

            if (previousRetries >= maxRetries) {
              // Keep the reservation so the scheduler lease provides a
              // bounded cooldown. No terminal human pause and no tight retry
              // loop: the next eligible attempt still requires ready.
              core.warning(
                'Issue #' + issueNumber +
                  ' exhausted automatic OpenCode recovery; scheduler ' +
                  'lease/backoff remains authoritative and ready is re-checked.'
              );
              return;
            }

            await removeLabel(pausedLabel);
            await addLabel(inProgressLabel);

            // The actual recovery: a fresh `/oc` comment, which the consumer's
            // OpenCode caller admits on an owner-authored issue comment.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                '/oc',
                '',
                retryMarker,
                '⚡ **Continuum · opencode-watchdog**',
                '<!-- continuum-origin role=continuum component=opencode-watchdog -->',
                'Automatic recovery retry ' + (previousRetries + 1) +
                  '/' + maxRetries + ' after OpenCode run ' + run.id +
                  ' ended with ' + run.conclusion +
                  (run.conclusion === 'success' ? ' but produced no PR.' : '.'),
                'Run: ' + (run.html_url || ('https://github.com/' + repoFullName + '/actions/runs/' + run.id)),
              ].join('\n'),
            });

            core.notice(
              'Immediately retried issue #' + issueNumber +
              ' after failed OpenCode run ' + run.id + '.'
            );