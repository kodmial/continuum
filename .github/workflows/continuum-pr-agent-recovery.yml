            }

            function latestContext(statuses, name) {
              return statuses
                .filter(status => status.context === name)
                .sort((a, b) =>
                  Date.parse(b.updated_at || b.created_at || 0) -
                  Date.parse(a.updated_at || a.created_at || 0)
                )[0] || null;
            }

            // Bounded active review-run snapshot (Work-Lock #58 item 6
            // B1). The recovery decision only needs active/relevant runs,
            // so query active statuses only (at most 3 pages per status)
