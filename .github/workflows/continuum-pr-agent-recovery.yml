name: PR-Agent recovery

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying the recovery engine.
        type: string
        default: main
        required: false
      review_provider:
        description: Review provider selector; empty falls back to CONTINUUM_REVIEW_PROVIDER.
        type: string
        default: ''
        required: false
      review_workflow:
        description: PR-Agent caller workflow file to dispatch.
        type: string
        default: continuum-pr-agent.yml
        required: false
      ci_workflow_name:
        description: Exact workflow name that proves current-head CI.
        type: string
        default: CI
        required: false
      stale_minutes:
        description: Pending operation age after which missing liveness becomes recoverable.
        type: string
        default: ''
        required: false
      dispatch_grace_seconds:
        description: Grace after a durable dispatch marker before a missing run may be replayed.
        type: string
        default: ''
        required: false
      target_child_id:
        description: >-
          Opaque verified child id for delegated recovery. Empty targets the
          caller repository, unless vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID
          selects a child.
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: ${{ (inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID) && format('pr-agent-recovery-child-{0}-{1}', inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID, github.repository) || format('pr-agent-recovery-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (inputs.review_provider || vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'pr-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read

    steps:
      - name: Resolve PR-Agent target context
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          CONTINUUM_SOURCE_REPO="${GITHUB_WORKFLOW_REF:-}"
          CONTINUUM_SOURCE_REPO="${CONTINUUM_SOURCE_REPO%%/.github/workflows/*}"
          if ! [[ "$CONTINUUM_SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            CONTINUUM_SOURCE_REPO="kodmial/continuum"
          fi
          if [[ -z "${TARGET_CHILD_ID:-}" ]]; then
            if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR-Agent target repository identity is invalid."
              exit 2
            fi
            {
              printf 'CONTINUUM_PR_AGENT_TARGET_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
              printf 'CONTINUUM_PR_AGENT_TARGET_OWNER=%s\n' "${GITHUB_REPOSITORY%%/*}"
              printf 'CONTINUUM_PR_AGENT_TARGET_REPO=%s\n' "${GITHUB_REPOSITORY#*/}"
              printf 'CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED=%s\n' "false"
            } >> "$GITHUB_ENV"
            echo "PR-Agent target context resolved locally."
            exit 0
          fi
          : "${CONTINUUM_REF:?CONTINUUM_REF is required for pinned target resolution}"
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! gh api --method GET "repos/$CONTINUUM_SOURCE_REPO/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | continuum_b64_decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          # The parent config lives in the execution repository: fetch its
          # default branch, never the Continuum engine pin (which may not
          # exist in the execution repository).
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | continuum_b64_decode > "$PARENT_CONFIG_FILE" 2>/dev/null || [[ ! -s "$PARENT_CONFIG_FILE" ]]; then
            echo "::error::Unable to load the parent Continuum configuration for delegated target resolution; refusing to guess."
            exit 1
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"

      - name: Reconcile PR-Agent latest state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || 'CI' }}
          STALE_MINUTES: ${{ inputs.stale_minutes || vars.PR_AGENT_RECOVERY_STALE_MINUTES || '70' }}
          DISPATCH_GRACE_SECONDS: ${{ inputs.dispatch_grace_seconds || vars.PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS || '90' }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID }}
          # Item 1 of Work Lock #58: same-repo reads use the repository-scoped
          # installation token. PAT remains the mutation/dispatch identity.
          # For delegated recovery, cross-repository target reads fall back
          # to the PAT client via withReadFallback when github.token cannot
          # see the child.
          READ_GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const executionOwner = context.repo.owner;
            const executionRepo = context.repo.repo;
            const owner = process.env.CONTINUUM_PR_AGENT_TARGET_OWNER;
            const repo = process.env.CONTINUUM_PR_AGENT_TARGET_REPO;
            const repoFullName = process.env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY;
            const reviewWorkflow = String(process.env.REVIEW_WORKFLOW || 'continuum-pr-agent.yml').trim();
            const ciWorkflowName = String(process.env.CI_WORKFLOW_NAME || 'CI').trim();
            const maxExecutions = 3;
            const staleMs = Number.parseInt(process.env.STALE_MINUTES || '70', 10) * 60_000;
            const dispatchGraceMs =
              Number.parseInt(process.env.DISPATCH_GRACE_SECONDS || '90', 10) * 1_000;
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const retryableConclusions = new Set([
              'cancelled',
              'timed_out',
              'stale',
              'startup_failure',
            ]);
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'requested',
              'pending',
            ]);
            const REVIEW_CONTEXT = 'continuum/pr-agent-review';
            const REPAIR_CONTEXT = 'continuum/pr-agent-repair';
            const CONTROLLER_STATE_MARKER = '<!-- continuum-pr-agent-controller-state:v1 -->';

            // Keep the action client PAT-authenticated for mutations/dispatch.
            // A distinct Octokit instance handles read-only same-repository calls
            // with github.token, keeping those requests off TAP_PAT's shared budget.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            // github-script already supplies the plugin-composed Octokit class.
            // Reuse its constructor instead of dynamically requiring
            // @actions/github, which is not resolvable from the script sandbox.
            // Preserve the enterprise base URL so GitHub Enterprise reads keep working.
            const readBaseUrl = (
              (github && github.request && github.request.endpoint &&
                github.request.endpoint.DEFAULTS && github.request.endpoint.DEFAULTS.baseUrl) ||
              process.env.GITHUB_API_URL || 'https://api.github.com'
            );
            const readGithub = readToken
              ? new github.constructor({ auth: readToken, baseUrl: readBaseUrl })
              : github;
            if (!readToken) {
              core.warning('READ_GITHUB_TOKEN is empty; using PAT client for PR-Agent recovery reads.');
            }
            let readTokenUnavailable = false;
            async function withReadFallback(fn) {
              if (readTokenUnavailable || readGithub === github) {
                return await fn(github);
              }
              try {
                return await fn(readGithub);
              } catch (err) {
                const status = err ? (err.status ?? err.response?.status) : undefined;
                if (status === 401 || status === 403 || status === 429) {
                  readTokenUnavailable = true;
                  core.warning('Repository-token read failed (' + status + '); retrying with PAT client: ' + err.message);
                  return await fn(github);
                }
                throw err;
              }
            }

            if (!['continuum-pr-agent.yml', 'pr-agent.yml'].includes(reviewWorkflow)) {
              core.setFailed(
                'Invalid PR-Agent review workflow: ' + reviewWorkflow +
                '. Expected continuum-pr-agent.yml or pr-agent.yml.'
              );
              return;
            }
            if (!Number.isFinite(staleMs) || staleMs < 60_000) {
              core.setFailed('PR_AGENT_RECOVERY_STALE_MINUTES must be at least 1.');
              return;
            }
            if (!Number.isFinite(dispatchGraceMs) || dispatchGraceMs < 0) {
              core.setFailed('PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS must be non-negative.');
              return;
            }

            function nowMs() {
              return Date.now();
            }

            function ageMs(value) {
              const parsed = Date.parse(String(value || ''));
              return Number.isFinite(parsed) ? Math.max(0, nowMs() - parsed) : Number.MAX_SAFE_INTEGER;
            }

            function retryMarker(head, kind, attempt) {
              return '<!-- continuum-pr-agent-retry head=' +
                String(head).toLowerCase() + ' kind=' + kind +
                ' attempt=' + String(attempt) + ' -->';
            }

            function exhaustedMarker(head, kind) {
              return '<!-- continuum-pr-agent-retry-exhausted head=' +
                String(head).toLowerCase() + ' kind=' + kind +
                ' attempts=' + String(maxExecutions) + ' -->';
            }

            function controllerStateBody(stateMarker, summary) {
              return [
                CONTROLLER_STATE_MARKER,
                String(stateMarker || '').trim(),
                '<details>',
                '<summary>Continuum PR-Agent controller state</summary>',
                '',
                String(summary || '').trim(),
                '',
                '</details>',
              ].join('\n');
            }

            async function upsertControllerState(prNumber, stateMarker, summary) {
              const comments = await withReadFallback(client =>
                client.paginate(
                  client.rest.issues.listComments,
                  { owner, repo, issue_number: prNumber, per_page: 100 }
                )
              );
              const controller = comments
                .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                .sort((a, b) => Number(a.id) - Number(b.id));
              const latest = controller.at(-1);
              // Presentation-only liveness touch. The durable retry identity
              // is the stateMarker line alone (parseEvidence matches only
              // continuum-pr-agent-retry markers). This summary line only
              // forces a body change so GitHub advances updated_at on every
              // committed dispatch; it is never parsed as retry state and its
              // literal prefix cannot match the retry/exhausted regexes.
              // The summary is coerced null-safe: a missing/non-string
              // summary must render as empty, never as "undefined"/"null".
              const body = controllerStateBody(
                stateMarker,
                String(summary || '').trim() + '\n\nController dispatch run: ' + String(context.runId)
              );
              let result;
              if (latest) {
                const { data } = await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: latest.id,
                  body,
                });
                result = {
                  comment: data,
                  created: false,
                  previousBody: String(latest.body || ''),
                };
              } else {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
                result = { comment: data, created: true, previousBody: '' };
              }
              for (const stale of controller.slice(0, -1)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stale.id,
                });
              }
              return result;
            }

            // Retained for the single-comment coalescing contract: every
            // controller-state change goes through upsertControllerState
            // (update latest, prune stale). Dispatch records a pre-dispatch
            // claim via a fresh createComment (never an update, so the
            // existing comment's updated_at is untouched), deletes that
            // claim via rollbackControllerState when the dispatch throws,
            // and coalesces via upsertControllerState after success.
            async function rollbackControllerState(stateWrite) {
              if (!stateWrite || !stateWrite.comment) return;
              if (stateWrite.created) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stateWrite.comment.id,
                });
                return;
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateWrite.comment.id,
                body: stateWrite.previousBody,
              });
            }

            function parseEvidence(comments, head, kind) {
              const exactHead = String(head).toLowerCase();
              const retryRe =
                /<!--\s*continuum-pr-agent-retry\s+head=([0-9a-f]{7,64})\s+kind=(review|repair)\s+attempt=(\d+)\s*-->/ig;
              const exhaustedRe =
                /<!--\s*continuum-pr-agent-retry-exhausted\s+head=([0-9a-f]{7,64})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/ig;
              let latestAttempt = null;
              let latestMarkerAt = null;
              let exhausted = false;
              for (const comment of comments) {
                if (!trustedAssociations.has(String(comment.author_association || '').toUpperCase())) {
                  continue;
                }
                const body = String(comment.body || '');
                const createdAt = Date.parse(String(comment.updated_at || comment.created_at || ''));
                retryRe.lastIndex = 0;
                exhaustedRe.lastIndex = 0;
                for (const match of body.matchAll(retryRe)) {
                  if (match[1].toLowerCase() !== exactHead || match[2] !== kind) continue;
                  const attempt = Number.parseInt(match[3], 10);
                  if (
                    latestAttempt === null ||
                    attempt > latestAttempt ||
                    (attempt === latestAttempt &&
                     Number.isFinite(createdAt) &&
                     (latestMarkerAt === null || createdAt > latestMarkerAt))
                  ) {
                    latestAttempt = attempt;
                    latestMarkerAt = Number.isFinite(createdAt) ? createdAt : null;
                  }
                }
                for (const match of body.matchAll(exhaustedRe)) {
                  if (
                    match[1].toLowerCase() === exactHead &&
                    match[2] === kind &&
                    Number.parseInt(match[3], 10) >= maxExecutions
                  ) {
                    exhausted = true;
                  }
                }
              }
              return { latestAttempt, latestMarkerAt, exhausted };
            }

            function latestContext(statuses, name) {
              return statuses
                .filter(status => status.context === name)
                .sort((a, b) =>
                  Date.parse(b.updated_at || b.created_at || 0) -
                  Date.parse(a.updated_at || a.created_at || 0)
                )[0] || null;
            }

            async function listReviewRuns() {
              try {
                return await withReadFallback(client =>
                  client.paginate(
                    client.rest.actions.listWorkflowRuns,
                    {
                      owner: executionOwner,
                      repo: executionRepo,
                      workflow_id: reviewWorkflow,
                      per_page: 100,
                    }
                  )
                );
              } catch (err) {
                core.setFailed(
                  'Could not inspect PR-Agent caller runs for ' + reviewWorkflow +
                  ': ' + (err.message || err)
                );
                throw err;
              }
            }

            function exactActiveRun(runs, prNumber, kind, head) {
              const prefix = 'PR-Agent PR #' + prNumber + ' [' + kind + ':';
              const suffix = '] head=' + String(head).toLowerCase();
              return runs.find(run =>
                String(run.display_title || '').startsWith(prefix) &&
                String(run.display_title || '').endsWith(suffix) &&
                activeStatuses.has(String(run.status || '').toLowerCase())
              ) || null;
            }

            async function operationIsActive(prNumber, head, kind) {
              // Re-read immediately before dispatch-grace coalescing. A fresh
              // controller marker is only proof of a live dispatch while the
              // exact PR/HEAD/operation run is still active; if that run was
              // lost or already terminated, recovery must replay the same
              // bounded attempt instead of waiting out the grace window.
              const runs = await listReviewRuns();
              return Boolean(exactActiveRun(runs, prNumber, kind, head));
            }

            async function statusRunMetadata(status) {
              const target = String(status?.target_url || '');
              const match = target.match(/\/actions\/runs\/(\d+)(?:$|[/?#])/);
              if (!match) return { conclusion: null, recoveryKind: null };
              try {
                const { data: run } = await withReadFallback(client =>
                  client.rest.actions.getWorkflowRun({
                    owner: executionOwner,
                    repo: executionRepo,
                    run_id: Number(match[1]),
                  })
                );
                const title = String(run.display_title || '');
                const identity = title.match(/\[(review|repair):\d+\]/);
                const recoveryKind = identity ? identity[1] : null;
                if (activeStatuses.has(String(run.status || '').toLowerCase())) {
                  return {
                    conclusion: String(run.status || '').toLowerCase(),
                    recoveryKind,
                  };
                }
                return {
                  conclusion:
                    String(run.conclusion || run.status || '').toLowerCase() || null,
                  recoveryKind,
                };
              } catch (err) {
                if (err.status === 404) {
                  return { conclusion: null, recoveryKind: null };
                }
                throw err;
              }
            }

            async function exactHeadCiGreen(head) {
              const runs = await withReadFallback(client =>
                client.paginate(
                  client.rest.actions.listWorkflowRunsForRepo,
                  {
                    owner,
                    repo,
                    event: 'pull_request',
                    head_sha: head,
                    per_page: 100,
                  }
                )
              );
              const latest = runs
                .filter(run => run.name === ciWorkflowName && run.head_sha === head)
                .sort((a, b) =>
                  Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0)
                )[0];
              return Boolean(
                latest &&
                latest.status === 'completed' &&
                latest.conclusion === 'success'
              );
            }

            function backoffSeconds(attempt) {
              if (attempt <= 0) return 0;
              return 15 * (1 << (attempt - 1));
            }

            function decide({
              ciGreen,
              operationStatus,
              activeRun,
              runConclusion,
              evidence,
            }) {
              if (!ciGreen) return { action: 'wait', reason: 'exact HEAD CI is not green' };
              if (evidence.exhausted) {
                return { action: 'hold', reason: 'durable retry exhaustion marker exists' };
              }
              if (activeRun) {
                return { action: 'wait', reason: 'exact PR/HEAD/operation already active' };
              }

              const state = String(operationStatus?.state || '').toLowerCase() || null;
              const description = String(operationStatus?.description || '');
              const statusAt = operationStatus
                ? Date.parse(String(operationStatus.updated_at || operationStatus.created_at || ''))
                : null;
              const markerNewer =
                evidence.latestMarkerAt !== null &&
                (!Number.isFinite(statusAt) || evidence.latestMarkerAt > statusAt);
              const markerAge =
                evidence.latestMarkerAt === null ? null : Math.max(0, nowMs() - evidence.latestMarkerAt);

              if (
                markerNewer &&
                evidence.latestAttempt !== null &&
                markerAge !== null &&
                markerAge < dispatchGraceMs
              ) {
                return {
                  action: 'wait',
                  reason: 'newer durable dispatch marker is inside grace window',
                };
              }

              let recoverable = false;
              const operationSeen = state !== null;
              if (state === null) {
                recoverable = true;
              } else if (state === 'success') {
                return { action: 'settled', reason: 'operation already settled' };
              } else if (state === 'failure') {
                if (/recovery eligible|transient/i.test(description)) {
                  recoverable = true;
                } else {
                  return {
                    action: 'hold',
                    reason: 'deterministic failure is not automatically retried',
                  };
                }
              } else if (state === 'pending') {
                if (retryableConclusions.has(String(runConclusion || '').toLowerCase())) {
                  recoverable = true;
                } else if (
                  ageMs(operationStatus.updated_at || operationStatus.created_at) >= staleMs &&
                  !activeStatuses.has(String(runConclusion || '').toLowerCase())
                ) {
                  recoverable = true;
                } else {
                  return { action: 'wait', reason: 'pending operation is not stale' };
                }
              } else {
                return { action: 'hold', reason: 'unknown operation state ' + state };
              }

              if (!recoverable) {
                return { action: 'hold', reason: 'operation is not recoverable' };
              }

              let attempt;
              if (evidence.latestAttempt === null) {
                attempt = operationSeen ? 1 : 0;
              } else if (markerNewer) {
                attempt = evidence.latestAttempt;
              } else {
                attempt = evidence.latestAttempt + 1;
              }

              if (attempt >= maxExecutions) {
                return { action: 'exhaust', reason: 'automatic execution budget exhausted' };
              }
              return {
                action: 'dispatch',
                attempt,
                reason: state === null ? 'lost/missing operation' : 'transient/stale operation',
              };
            }

            async function defaultBranch() {
              const { data } = await withReadFallback(client =>
                client.rest.repos.get({ owner: executionOwner, repo: executionRepo })
              );
              return String(data.default_branch || 'main');
            }

            async function dispatch(pr, kind, head, attempt, status) {
              const delaySeconds = backoffSeconds(attempt);
              const statusTime = status
                ? Date.parse(String(status.updated_at || status.created_at || ''))
                : null;
              const elapsedSeconds = Number.isFinite(statusTime)
                ? Math.floor(Math.max(0, nowMs() - statusTime) / 1000)
                : delaySeconds;
              const remaining = Math.max(0, delaySeconds - elapsedSeconds);
              if (remaining > 0) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': bounded backoff ' + remaining + 's before execution index ' + attempt + '.'
                );
                await new Promise(resolve => setTimeout(resolve, remaining * 1000));
              }

              const { data: fresh } = await withReadFallback(client =>
                client.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                })
              );
              if (
                fresh.state !== 'open' ||
                fresh.draft ||
                !fresh.head.repo ||
                fresh.head.repo.full_name !== repoFullName ||
                fresh.head.sha !== head
              ) {
                core.info(
                  'PR #' + pr.number + ' moved/closed during recovery backoff; stale dispatch cancelled.'
                );
                return false;
              }
              if (!(await exactHeadCiGreen(head))) {
                core.info(
                  'PR #' + pr.number + ' HEAD ' + head +
                  ': CI is no longer green; recovery dispatch cancelled.'
                );
                return false;
              }

              const refreshedRuns = await listReviewRuns();
              if (exactActiveRun(refreshedRuns, pr.number, kind, head)) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': another exact operation became active; duplicate wakeup coalesced.'
                );
                return false;
              }

              const refreshedComments = await withReadFallback(client =>
                client.paginate(
                  client.rest.issues.listComments,
                  { owner, repo, issue_number: pr.number, per_page: 100 }
                )
              );
              const refreshedEvidence = parseEvidence(refreshedComments, head, kind);
              if (refreshedEvidence.exhausted) {
                core.info('PR #' + pr.number + ' ' + kind + ': retry budget is already exhausted.');
                return false;
              }
              if (
                refreshedEvidence.latestAttempt !== null &&
                refreshedEvidence.latestAttempt > attempt
              ) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': a newer retry attempt already exists; stale dispatch cancelled.'
                );
                return false;
              }
              if (
                refreshedEvidence.latestAttempt === attempt &&
                refreshedEvidence.latestMarkerAt !== null &&
                nowMs() - refreshedEvidence.latestMarkerAt < dispatchGraceMs &&
                await operationIsActive(pr.number, head, kind)
              ) {
                // The claim from the successful dispatch is already durable
                // evidence, but a prior coalescing failure can leave it plus
                // an older controller comment behind. Re-read fresh before
                // pruning so an interleaved controller write after the
                // pre-dispatch snapshot is never invisible: pruning the stale
                // snapshot could delete pre-existing comments while leaving
                // both the local claim and a concurrent claim (breaking the
                // bounded-at-one invariant), and the generic controller
                // marker alone cannot distinguish another head/kind. Keeping
                // the fresh latest preserves a concurrent writer's state;
                // the next successful upsert finishes coalescing.
                try {
                  const graceComments = await withReadFallback(client =>
                    client.paginate(
                      client.rest.issues.listComments,
                      { owner, repo, issue_number: pr.number, per_page: 100 }
                    )
                  );
                  const controllerDupes = graceComments
                    .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                    .sort((a, b) => Number(a.id) - Number(b.id));
                  for (const stale of controllerDupes.slice(0, -1)) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: stale.id,
                      });
                    } catch (deleteErr) {
                      if (deleteErr.status !== 404) throw deleteErr;
                    }
                  }
                } catch (pruneErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': dispatch-grace duplicate prune failed: ' +
                    (pruneErr.message || pruneErr)
                  );
                }
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': matching retry marker is inside dispatch grace; duplicate wakeup coalesced.'
                );
                return false;
              }

              const marker = retryMarker(head, kind, attempt);
              const stateSummary =
                'Automatic PR-Agent ' + kind + ' recovery for exact HEAD ' + head +
                  ' (execution ' + (attempt + 1) + '/' + maxExecutions + ').';
              // Exactly-once claim: the durable retry marker is recorded
              // BEFORE createWorkflowDispatch via a fresh createComment, so a
              // runner crash after a successful dispatch can never leave the
              // next wakeup without marker evidence inside grace (which would
              // dispatch the same attempt again: duplicate recovery
              // executions, attempt-count drift). A fresh create never touches
              // the existing controller comment's updated_at; on dispatch
              // failure the claim is deleted, so a retry that never
              // dispatched leaves timestamps untouched and is never
              // coalesced as fresh. A crash between claim and dispatch only
              // delays the replay until grace expires, then replays the same
              // bounded attempt instead of duplicating or burning a slot.
              const claimBody = controllerStateBody(
                marker,
                String(stateSummary || '').trim() + '\n\nController dispatch run: ' + String(context.runId)
              );
              let claim = null;
              try {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: claimBody,
                });
                claim = data;
              } catch (err) {
                throw err;
              }
              try {
                const ref = await defaultBranch();
                // Local runs dispatch bare: a custom reviewWorkflow without
                // the target_child_id workflow_dispatch input would reject
                // an empty value, breaking local recovery. Delegated runs
                // preserve the opaque child selection.
                const recoveryInputs = {
                  pr_number: String(pr.number),
                  expected_head_sha: head,
                  retry_attempt: String(attempt),
                  retry_workflow: reviewWorkflow,
                  recovery_kind: kind,
                };
                const recoveryChildId = String(process.env.TARGET_CHILD_ID || '');
                if (recoveryChildId) {
                  recoveryInputs.target_child_id = recoveryChildId;
                }
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: executionOwner,
                    repo: executionRepo,
                    workflow_id: reviewWorkflow,
                    ref,
                    inputs: recoveryInputs,
                  });
                } catch (dispatchErr) {
                  const dispatchMessage = String(dispatchErr.message || dispatchErr);
                  const dispatchStatus = Number(dispatchErr.status || 0);
                  // Narrow input-rejection detection: only a 422 whose
                  // message names the opaque target_child_id input means
                  // the review workflow lacks the delegated selector. Any
                  // other 422 (invalid pr_number/expected_head_sha, ref, or
                  // payload validation) or any message merely containing
                  // the word "input" is rethrown verbatim so the operator
                  // fixes the true remediation path.
                  const isMissingTargetInput =
                    dispatchStatus === 422 &&
                    /target_child_id/i.test(dispatchMessage);
                  if (recoveryChildId && isMissingTargetInput) {
                    throw new Error(
                      'Delegated recovery requires reviewWorkflow ' + reviewWorkflow +
                      ' to declare a target_child_id workflow_dispatch input; ' +
                      'refusing bare retry to preserve the delegated target: ' +
                      dispatchMessage
                    );
                  }
                  throw dispatchErr;
                }
                core.notice(
                  'PR #' + pr.number + ' HEAD ' + head + ': dispatched ' +
                  kind + ' recovery execution ' + (attempt + 1) + '/' + maxExecutions + '.'
                );
              } catch (err) {
                try {
                  await rollbackControllerState(
                    claim ? { comment: claim, created: true, previousBody: '' } : null
                  );
                } catch (cleanupErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': pre-dispatch claim cleanup failed: ' +
                    (cleanupErr.message || cleanupErr)
                  );
                }
                throw err;
              }
              // Coalesce the pre-dispatch claim (plus any stale controller
              // comments) into the single controller comment. The claim is a
              // fresh controller-state comment, so on persistent upsert
              // failure delete only pre-existing snapshot comments older
              // than the claim and keep both the claim and any concurrent
              // write: exactly-once evidence for both attempts survives and
              // the next wakeup coalesces via grace. The dispatch already
              // succeeded, so this path warns and returns true instead of
              // throwing: a red run for a dispatched recovery would invite a
              // manual retry that duplicates the same attempt once grace
              // expires, and callers expect boolean dispatch() success.
              let stateError = null;
              for (let stateAttempt = 1; stateAttempt <= 3; stateAttempt++) {
                try {
                  await upsertControllerState(pr.number, marker, stateSummary);
                  stateError = null;
                  break;
                } catch (err) {
                  stateError = err;
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': controller state coalescing ' + stateAttempt + '/3 failed after a successful dispatch: ' +
                    (err.message || err)
                  );
                  if (stateAttempt < 3) {
                    await new Promise(resolve => setTimeout(resolve, 2000 * stateAttempt));
                  }
                }
              }
              if (stateError) {
                try {
                  const freshController = await withReadFallback(client =>
                    client.paginate(
                      client.rest.issues.listComments,
                      { owner, repo, issue_number: pr.number, per_page: 100 }
                    )
                  );
                  const snapshotIds = new Set(
                    refreshedComments.map(comment => Number(comment.id))
                  );
                  const claimId = Number(claim && claim.id);
                  const priorController = freshController
                    .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                    .filter(comment => snapshotIds.has(Number(comment.id)))
                    .filter(comment => Number(comment.id) !== claimId && Number(comment.id) < claimId)
                    .sort((a, b) => Number(a.id) - Number(b.id));
                  for (const stale of priorController) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: stale.id,
                      });
                    } catch (deleteErr) {
                      if (deleteErr.status !== 404) throw deleteErr;
                    }
                  }
                } catch (pruneErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': post-dispatch duplicate prune failed: ' +
                    (pruneErr.message || pruneErr)
                  );
                }
                core.warning(
                  'PR #' + pr.number + ' ' + kind +
                  ': dispatched recovery execution ' + (attempt + 1) + '/' + maxExecutions +
                  ' but coalescing into one controller comment failed; ' +
                  'kept the pre-dispatch claim plus any concurrent controller write. ' +
                  'The next wakeup coalesces via dispatch grace; no duplicate dispatch was issued. ' +
                  (stateError.message || stateError)
                );
                return true;
              }
              return true;
            }

            async function exhaust(pr, head, kind, comments) {
              const marker = exhaustedMarker(head, kind);
              const already = comments.some(comment =>
                trustedAssociations.has(String(comment.author_association || '').toUpperCase()) &&
                String(comment.body || '').includes(marker)
              );
              if (already) return;
              await upsertControllerState(
                pr.number,
                marker,
                'PR-Agent ' + kind + ' recovery exhausted the bounded ' +
                  maxExecutions + '-execution budget for exact HEAD ' + head +
                  '. A changed HEAD starts a new recovery identity.'
              );
            }

            const openPrs = await withReadFallback(client =>
              client.paginate(
                client.rest.pulls.list,
                { owner, repo, state: 'open', per_page: 100 }
              )
            );
            let reviewRuns = await listReviewRuns();

            for (const pr of openPrs) {
              if (
                pr.draft ||
                !pr.head.repo ||
                pr.head.repo.full_name !== repoFullName
              ) {
                continue;
              }
              const head = String(pr.head.sha || '').toLowerCase();
              if (!head) continue;

              const ciGreen = await exactHeadCiGreen(head);
              if (!ciGreen) {
                core.info('PR #' + pr.number + ' HEAD ' + head + ': exact-head CI not green; skip.');
                continue;
              }

              const [statuses, comments] = await Promise.all([
                withReadFallback(client =>
                  client.paginate(
                    client.rest.repos.listCommitStatusesForRef,
                    { owner, repo, ref: head, per_page: 100 }
                  )
                ),
                withReadFallback(client =>
                  client.paginate(
                    client.rest.issues.listComments,
                    { owner, repo, issue_number: pr.number, per_page: 100 }
                  )
                ),
              ]);

              const reviewStatus = latestContext(statuses, REVIEW_CONTEXT);
              const reviewRun = reviewStatus
                ? await statusRunMetadata(reviewStatus)
                : { conclusion: null, recoveryKind: null };
              let kind = 'review';
              let operationStatus = reviewStatus;
              let operationRun = reviewRun;

              if (reviewStatus?.state === 'success') {
                const reviewDescription = String(reviewStatus.description || '');
                if (/actionable/i.test(reviewDescription)) {
                  kind = 'repair';
                  operationStatus = latestContext(statuses, REPAIR_CONTEXT);
                  operationRun = operationStatus
                    ? await statusRunMetadata(operationStatus)
                    : { conclusion: null, recoveryKind: null };
                } else if (/blocking; recovery eligible/i.test(reviewDescription)) {
                  kind = 'review';
                  operationStatus = {
                    ...reviewStatus,
                    state: 'failure',
                    description: 'PR-Agent blocking review: recovery eligible',
                  };
                  operationRun = reviewRun;
                } else {
                  core.info(
                    'PR #' + pr.number + ' HEAD ' + head +
                    ': review is settled clean; recovery has nothing to do.'
                  );
                  continue;
                }
              } else if (
                reviewRun.recoveryKind === 'repair' &&
                ['pending', 'failure'].includes(
                  String(reviewStatus?.state || '').toLowerCase()
                )
              ) {
                // A repair recovery must first reconstruct canonical review/
                // improve payloads. If that prerequisite review is cancelled,
                // stale, or fails, it still belongs to the durable repair
                // operation and must consume/replay the repair budget.
                kind = 'repair';
              }

              const evidence = parseEvidence(comments, head, kind);
              const activeRun = exactActiveRun(reviewRuns, pr.number, kind, head);
              const decision = decide({
                ciGreen,
                operationStatus,
                activeRun,
                runConclusion: operationRun.conclusion,
                evidence,
              });

              core.info(
                'PR #' + pr.number + ' HEAD ' + head + ' ' + kind +
                ': recovery decision=' + decision.action +
                ' reason=' + decision.reason +
                (decision.attempt === undefined ? '' : ' attempt=' + decision.attempt)
              );

              if (decision.action === 'exhaust') {
                await exhaust(pr, head, kind, comments);
                continue;
              }
              if (decision.action !== 'dispatch') continue;

              const dispatched = await dispatch(
                pr,
                kind,
                head,
                decision.attempt,
                operationStatus
              );
              if (dispatched) {
                reviewRuns = await listReviewRuns();
              }
            }
