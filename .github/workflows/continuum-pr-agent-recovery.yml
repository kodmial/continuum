name: PR-Agent recovery

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying the recovery engine.
        type: string
        default: main
        required: false
      review_provider:
        description: Review provider selector; empty falls back to CONTINUUM_REVIEW_PROVIDER.
        type: string
        default: ''
        required: false
      review_workflow:
        description: PR-Agent caller workflow file to dispatch.
        type: string
        default: continuum-pr-agent.yml
        required: false
      ci_workflow_name:
        description: Exact workflow name that proves current-head CI.
        type: string
        default: CI
        required: false
      stale_minutes:
        description: Pending operation age after which missing liveness becomes recoverable.
        type: string
        default: ''
        required: false
      dispatch_grace_seconds:
        description: Grace after a durable dispatch marker before a missing run may be replayed.
        type: string
        default: ''
        required: false
      target_child_id:
        description: >-
          Opaque verified child id for delegated recovery. Empty targets the
          caller repository, unless vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID
          selects a child.
        type: string
        default: ''
        required: false
      max_executions:
        description: >-
          Total transient executions per exact PR/HEAD/operation (default 10,
          clamped to 1..10). Empty falls back to
          vars.PR_AGENT_RECOVERY_MAX_EXECUTIONS, then to 10. Success or a new
          HEAD resets the episode; deterministic failures never consume it.
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: ${{ (inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID) && format('pr-agent-recovery-child-{0}-{1}', inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID, github.repository) || format('pr-agent-recovery-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Child-local automatic recovery is suppressed in verified child mode
    # (issue #244): the parent is the only automatic execution plane for
    # child PR-Agent. Local/non-child behavior is unchanged.
    if: >-
      (inputs.review_provider || vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'pr-agent' &&
      vars.CONTINUUM_ROLE != 'child'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read

    steps:
      - name: Resolve PR-Agent target context
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          CONTINUUM_SOURCE_REPO="${GITHUB_WORKFLOW_REF:-}"
          CONTINUUM_SOURCE_REPO="${CONTINUUM_SOURCE_REPO%%/.github/workflows/*}"
          if ! [[ "$CONTINUUM_SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "${CONTINUUM_SOURCE_REPO%%/*}" =~ ^\.+$ ]] || [[ "${CONTINUUM_SOURCE_REPO#*/}" =~ ^\.+$ ]]; then
            CONTINUUM_SOURCE_REPO="kodmial/continuum"
          fi
          if [[ -z "${TARGET_CHILD_ID:-}" ]]; then
            if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "${GITHUB_REPOSITORY%%/*}" =~ ^\.+$ ]] || [[ "${GITHUB_REPOSITORY#*/}" =~ ^\.+$ ]]; then
              echo "::error::PR-Agent target repository identity is invalid."
              exit 2
            fi
            {
              printf 'CONTINUUM_PR_AGENT_TARGET_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
              printf 'CONTINUUM_PR_AGENT_TARGET_OWNER=%s\n' "${GITHUB_REPOSITORY%%/*}"
              printf 'CONTINUUM_PR_AGENT_TARGET_REPO=%s\n' "${GITHUB_REPOSITORY#*/}"
              printf 'CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED=%s\n' "false"
            } >> "$GITHUB_ENV"
            echo "PR-Agent target context resolved locally."
            exit 0
          fi
          : "${CONTINUUM_REF:?CONTINUUM_REF is required for pinned target resolution}"
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! gh api --method GET "repos/$CONTINUUM_SOURCE_REPO/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | continuum_b64_decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          # The parent config lives in the execution repository: fetch its
          # default branch, never the Continuum engine pin (which may not
          # exist in the execution repository).
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | continuum_b64_decode > "$PARENT_CONFIG_FILE" 2>/dev/null || [[ ! -s "$PARENT_CONFIG_FILE" ]]; then
            echo "::error::Unable to load the parent Continuum configuration for delegated target resolution; refusing to guess."
            exit 1
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"

      - name: Reconcile PR-Agent latest state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || 'CI' }}
          STALE_MINUTES: ${{ inputs.stale_minutes || vars.PR_AGENT_RECOVERY_STALE_MINUTES || '70' }}
          DISPATCH_GRACE_SECONDS: ${{ inputs.dispatch_grace_seconds || vars.PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS || '90' }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id || vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID }}
          MAX_EXECUTIONS_RAW: ${{ inputs.max_executions }}
          MAX_EXECUTIONS_FALLBACK: ${{ vars.PR_AGENT_RECOVERY_MAX_EXECUTIONS || '10' }}
          # Item 1 of Work Lock #58: same-repo reads use the repository-scoped
          # installation token. PAT remains the mutation/dispatch identity.
          # For delegated recovery, cross-repository target reads fall back
          # to the PAT client via withReadFallback when github.token cannot
          # see the child.
          READ_GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const executionOwner = context.repo.owner;
            const executionRepo = context.repo.repo;
            const owner = process.env.CONTINUUM_PR_AGENT_TARGET_OWNER;
            const repo = process.env.CONTINUUM_PR_AGENT_TARGET_REPO;
            const repoFullName = process.env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY;
            const reviewWorkflow = String(process.env.REVIEW_WORKFLOW || 'continuum-pr-agent.yml').trim();
            const ciWorkflowName = String(process.env.CI_WORKFLOW_NAME || 'CI').trim();
            // Single 10-execution transient budget (#224): default 10 total
            // executions per exact PR/HEAD/operation, configurable through a
            // safe bounded Continuum variable and always clamped to 1..10 so
            // a misconfigured value can neither silence recovery nor grant
            // an unbounded budget. Success or a new HEAD resets the episode.
            const MAX_TRANSIENT_EXECUTIONS = 10;
            const MIN_TRANSIENT_EXECUTIONS = 1;
            function resolveMaxExecutions(raw, fallback = MAX_TRANSIENT_EXECUTIONS) {
              const toBounded = (value) => {
                const parsed = Number.parseInt(String(value ?? '').trim(), 10);
                if (!Number.isFinite(parsed)) return MAX_TRANSIENT_EXECUTIONS;
                return Math.min(
                  MAX_TRANSIENT_EXECUTIONS,
                  Math.max(MIN_TRANSIENT_EXECUTIONS, parsed)
                );
              };
              if (raw === undefined || raw === null || String(raw).trim() === '') {
                return toBounded(fallback);
              }
              // A non-numeric override must honor the operator fallback (vars),
              // not silently widen to 10 executions beyond operator intent.
              if (!Number.isFinite(Number.parseInt(String(raw).trim(), 10))) {
                return toBounded(fallback);
              }
              return toBounded(raw);
            }
            const maxExecutions = resolveMaxExecutions(
              process.env.MAX_EXECUTIONS_RAW,
              process.env.MAX_EXECUTIONS_FALLBACK
            );
            const staleMs = Number.parseInt(process.env.STALE_MINUTES || '70', 10) * 60_000;
            const dispatchGraceMs =
              Number.parseInt(process.env.DISPATCH_GRACE_SECONDS || '90', 10) * 1_000;
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const retryableConclusions = new Set([
              'cancelled',
              'timed_out',
              'stale',
              'startup_failure',
            ]);
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'requested',
              'pending',
            ]);
            const REVIEW_CONTEXT = 'continuum/pr-agent-review';
            const REPAIR_CONTEXT = 'continuum/pr-agent-repair';
            const CONTROLLER_STATE_MARKER = '<!-- continuum-pr-agent-controller-state:v1 -->';

            // Keep the action client PAT-authenticated for mutations/dispatch.
            // A distinct Octokit instance handles read-only same-repository calls
            // with github.token, keeping those requests off TAP_PAT's shared budget.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            // github-script already supplies the plugin-composed Octokit class.
            // Reuse its constructor instead of dynamically requiring
            // @actions/github, which is not resolvable from the script sandbox.
            // Preserve the enterprise base URL so GitHub Enterprise reads keep working.
            const readBaseUrl = (
              (github && github.request && github.request.endpoint &&
                github.request.endpoint.DEFAULTS && github.request.endpoint.DEFAULTS.baseUrl) ||
              process.env.GITHUB_API_URL || 'https://api.github.com'
            );
            if (!readToken) {
              core.setFailed('READ_GITHUB_TOKEN is empty; same-repository reads require GITHUB_TOKEN and must not fall back to TAP_PAT.');
              return;
            }
            const readGithub = new github.constructor({ auth: readToken, baseUrl: readBaseUrl });
            let readTokenUnavailable = false;
            function isRateLimitError(err, status) {
              if (status === 429) return true;
              if (status !== 403) return false;
              const headers = (err && ((err.response && err.response.headers) || err.headers)) || {};
              const lowered = {};
              for (const [key, value] of Object.entries(headers)) {
                lowered[String(key).toLowerCase()] = value;
              }
              if (lowered['retry-after'] !== undefined && String(lowered['retry-after']).trim() !== '') return true;
              if (lowered['x-ratelimit-reset'] !== undefined && String(lowered['x-ratelimit-reset']).trim() !== '') return true;
              if (lowered['x-ratelimit-remaining'] !== undefined && String(lowered['x-ratelimit-remaining']).trim() === '0') return true;
              return /rate limit|rate-limit|ratelimit|quota exhaustion|secondary rate limit|retry after/i.test(
                String((err && err.message) || '')
              );
            }
            async function withReadFallback(fn) {
              // Per-call fallback only: one per-PR auth gap falls back for
              // that call alone and never flips the rest of the scan to PAT.
              // (readTokenUnavailable is retained for shape; never set sticky.)
              if (readTokenUnavailable || readGithub === github) {
                return await fn(github);
              }
              try {
                return await fn(readGithub);
              } catch (err) {
                const status = err ? (err.status ?? err.response?.status) : undefined;
                // Never spend TAP_PAT's shared budget on rate-limit retries:
                // a 429 or a rate-limited 403 must surface so the caller
                // defers to the next wakeup instead of re-issuing the scan
                // on the PAT client. Only authentication/permission gaps
                // (401, non-rate-limit 403) fall back, one call at a time.
                // Cross-repository target reads with github.token scoped
                // to the execution repository conventionally surface as
                // 404 (the documented inaccessible-repo response), so those
                // also fall back to TAP_PAT alongside 401/non-rate-limit 403.
                if (status === 401 || (status === 403 && !isRateLimitError(err, status)) || status === 404) {
                  core.warning('Repository-token read failed (' + status + '); retrying with PAT client: ' + err.message);
                  return await fn(github);
                }
                throw err;
              }
            }

            if (!['continuum-pr-agent.yml', 'pr-agent.yml'].includes(reviewWorkflow)) {
              core.setFailed(
                'Invalid PR-Agent review workflow: ' + reviewWorkflow +
                '. Expected continuum-pr-agent.yml or pr-agent.yml.'
              );
              return;
            }
            if (!Number.isFinite(staleMs) || staleMs < 60_000) {
              core.setFailed('PR_AGENT_RECOVERY_STALE_MINUTES must be at least 1.');
              return;
            }
            if (!Number.isFinite(dispatchGraceMs) || dispatchGraceMs < 0) {
              core.setFailed('PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS must be non-negative.');
              return;
            }

            function nowMs() {
              return Date.now();
            }

            function ageMs(value) {
              const parsed = Date.parse(String(value || ''));
              return Number.isFinite(parsed) ? Math.max(0, nowMs() - parsed) : Number.MAX_SAFE_INTEGER;
            }

            // Canonical durable marker contract (#224): exactly one marker
            // shape carries retry state, with not-before INSIDE the trailing
            // --> so a single parseable comment holds the whole record.
            // Legacy full-SHA continuum-pr-agent-retry markers remain
            // readable so existing durable state survives; all new writes
            // use the continuum-lifecycle-retry prefix. Legacy short-SHA
            // (7-39 hex) markers are intentionally never matched:
            // short-SHA markers are ignored entirely -- they neither
            // authorize retries nor preserve exhaustion -- because two
            // distinct commits can share a 7-char prefix.
            const LIFECYCLE_RETRY_PREFIX = 'continuum-lifecycle-retry';
            const LIFECYCLE_EXHAUSTED_PREFIX = 'continuum-lifecycle-retry-exhausted';
            // Exact-HEAD producer contract (#224): every durable marker
            // carries a full commit id (40-hex SHA-1 or 64-hex SHA-256).
            // Short SHAs fail loudly here at write/parse time so a short
            // marker can never be silently ignored (which would reset the
            // bounded budget) and can never split budget/exhaustion across
            // identities. All producers pass the full `pr.head.sha`.
            const FULL_HEAD_RE = /^[0-9a-f]{40,64}$/i;
            function requireFullHead(head, what) {
              if (!FULL_HEAD_RE.test(String(head || '').trim())) {
                throw new Error(
                  'Refusing ' + what + ' with a non-full commit id; ' +
                  'producers must pass the full 40-hex (or 64-hex) HEAD.'
                );
              }
              return String(head).toLowerCase();
            }
            function retryMarker(head, kind, attempt, notBefore) {
              const fullHead = requireFullHead(head, 'retry marker');
              const suffix = Number.isFinite(Number(notBefore)) && Number(notBefore) > 0
                ? ' not-before=' + Number(notBefore)
                : '';
              return '<!-- ' + LIFECYCLE_RETRY_PREFIX + ' head=' +
                fullHead + ' kind=' + kind +
                ' attempt=' + String(attempt) + suffix + ' -->';
            }

            function exhaustedMarker(head, kind) {
              const fullHead = requireFullHead(head, 'exhaustion marker');
              return '<!-- ' + LIFECYCLE_EXHAUSTED_PREFIX + ' head=' +
                fullHead + ' kind=' + kind +
                ' attempts=' + String(maxExecutions) + ' -->';
            }

            function controllerStateBody(stateMarker, summary) {
              // Continuum comment attribution (kodmial/continuum#258): the
              // legacy hidden marker lines stay first so positional
              // upsert/election matching is unchanged (HTML comments do not
              // render, so the attribution header is still the first
              // rendered line). Mirrors src/continuum/comment_attribution.py
              // and .github/scripts/pr_agent_policy.js byte-for-byte.
              return [
                CONTROLLER_STATE_MARKER,
                String(stateMarker || '').trim(),
                '⚡ **Continuum · pr-agent-recovery**',
                '<!-- continuum-origin role=continuum component=pr-agent-recovery -->',
                '<details>',
                '<summary>Continuum PR-Agent controller state</summary>',
                '',
                String(summary || '').trim(),
                '',
                '</details>',
              ].join('\n');
            }

            // Bounded collection (#254): caps every list scan at maxPages
            // instead of walking full history. Workflow-run and status
            // listings are newest-first, so a capped window preserves the
            // deciding records. Issue comments and pull reviews are
            // oldest-first, so a capped window may hide the newest markers:
            // the collected array carries a `truncated` flag plus the
            // `lastPage` anchor, and truncated comment scans recover a
            // bounded newest window (see recoverNewestComments) so a PR
            // with sustained high activity is still serviced instead of
            // deferred on every pass while the same truncation recurs.
            const MAX_COMMENT_PAGES = 10;
            const MAX_QUEUE_PAGES = 5;
            const MAX_GATE_PAGES = 2;
            async function boundedCollect(client, request, params, maxPages) {
              const items = [];
              let truncated = false;
              // Newest-window anchor: paginated REST responses carry an
              // RFC5988 Link header whose rel="last" page lets a truncated
              // oldest-first window re-anchor at the newest end with a
              // bounded number of reads instead of walking history.
              let lastPage = 0;
              for (let page = 1; page <= maxPages; page += 1) {
                const response = await request({ ...params, page });
                const link = response && response.headers && response.headers.link;
                if (typeof link === 'string') {
                  const match = link.match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
                  if (match) lastPage = Math.max(lastPage, Number(match[1]));
                }
                const data = response && response.data;
                const batch = Array.isArray(data) ? data : (data.workflow_runs || []);
                if (batch.length === 0) break;
                items.push(...batch);
                if (batch.length < (params.per_page || 100)) break;
                if (page === maxPages) truncated = true;
              }
              items.truncated = truncated;
              items.lastPage = lastPage;
              return items;
            }
            // Bounded newest-window recovery: merges up to MAX_COMMENT_PAGES
            // newest records into a truncated oldest-first comment scan so
            // the PR can still be serviced on this pass. Deciding markers
            // (retry/exhausted/controller state) are written by recent
            // activity, which the merged newest window always keeps; only a
            // middle window on very large threads may stay unseen. Only a
            // newest-recovery failure defers the PR to the next wakeup.
            // Runs on the caller's already-resolved read client so the
            // per-PR auth fallback is resolved once per scan, not once per
            // recovery page.
            async function recoverNewestComments(client, prNumber, items) {
              let lastPage = Number(items.lastPage || 0);
              if (!lastPage) {
                const meta = await client.rest.issues.get({ owner, repo, issue_number: prNumber });
                const total = Number(meta && meta.data && meta.data.comments || 0);
                if (total > 0) lastPage = Math.max(1, Math.ceil(total / 100));
              }
              if (!lastPage) {
                throw new Error('cannot anchor newest comments window');
              }
              const seen = new Set(items.map(entry => entry && entry.id));
              for (let page = 1; page <= MAX_COMMENT_PAGES; page += 1) {
                const targetPage = lastPage - (page - 1);
                if (targetPage < 1) break;
                const { data } = await client.rest.issues.listComments(
                  { owner, repo, issue_number: prNumber, per_page: 100, page: targetPage }
                );
                if (!Array.isArray(data) || data.length === 0) continue;
                for (const entry of data) {
                  if (!entry || seen.has(entry.id)) continue;
                  seen.add(entry.id);
                  items.push(entry);
                }
              }
              items.truncated = false;
            }

            async function upsertControllerState(prNumber, stateMarker, summary) {
              const comments = await withReadFallback(async (client) => {
                const items = await boundedCollect(
                  client,
                  (params) => client.rest.issues.listComments(params),
                  { owner, repo, issue_number: prNumber, per_page: 100 },
                  MAX_COMMENT_PAGES
                );
                // Truncated oldest-first windows hide the newest controller
                // marker, so recover the bounded newest window before
                // deciding. Only a newest-recovery failure holds the
                // controller write; a middle window may stay unseen on very
                // large threads.
                if (items.truncated) {
                  try {
                    await recoverNewestComments(client, prNumber, items);
                    core.warning(
                      'CONTINUUM_COMMENT_BUDGET_EXCEEDED pr=' + prNumber +
                      ': comment scan hit the ' + MAX_COMMENT_PAGES + '-page budget; deciding on the merged oldest+newest window.'
                    );
                  } catch (recoveryErr) {
                    throw new Error(
                      'CONTINUUM_COMMENT_BUDGET_EXCEEDED pr=' + prNumber +
                      ': comment scan hit the ' + MAX_COMMENT_PAGES + '-page budget and newest-window recovery failed; holding controller write instead of deciding on a truncated window.'
                    );
                  }
                }
                return items;
              });
              const controller = comments
                .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                .sort((a, b) => Number(a.id) - Number(b.id));
              const latest = controller.at(-1);
              // Presentation-only liveness touch. The durable retry identity
              // is the stateMarker line alone (parseEvidence matches only
              // continuum-pr-agent-retry markers). This summary line only
              // forces a body change so GitHub advances updated_at on every
              // committed dispatch; it is never parsed as retry state and its
              // literal prefix cannot match the retry/exhausted regexes.
              // The summary is coerced null-safe: a missing/non-string
              // summary must render as empty, never as "undefined"/"null".
              const body = controllerStateBody(
                stateMarker,
                String(summary || '').trim() + '\n\nController dispatch run: ' + String(context.runId)
              );
              let result;
              if (latest) {
                const { data } = await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: latest.id,
                  body,
                });
                result = {
                  comment: data,
                  created: false,
                  previousBody: String(latest.body || ''),
                };
              } else {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
                result = { comment: data, created: true, previousBody: '' };
              }
              for (const stale of controller.slice(0, -1)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stale.id,
                });
              }
              return result;
            }

            // Retained for the single-comment coalescing contract: every
            // controller-state change goes through upsertControllerState
            // (update latest, prune stale). Dispatch records a pre-dispatch
            // claim via a fresh createComment (never an update, so the
            // existing comment's updated_at is untouched), deletes that
            // claim via rollbackControllerState when the dispatch throws,
            // and coalesces via upsertControllerState after success.
            async function rollbackControllerState(stateWrite) {
              if (!stateWrite || !stateWrite.comment) return;
              if (stateWrite.created) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stateWrite.comment.id,
                });
                return;
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateWrite.comment.id,
                body: stateWrite.previousBody,
              });
            }

            // not-before lives inside the canonical marker only; a stray
            // not-before= outside any marker is ignored so producers cannot
            // diverge. Legacy markers predate durable not-before and carry none.
            function markerNotBefore(match) {
              const raw = match && match[4] !== undefined ? match[4] : null;
              const parsed = Number.parseInt(String(raw ?? ''), 10);
              return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
            }
            function parseEvidence(comments, head, kind) {
              // Fail closed on short SHAs: every producer writes the full
              // HEAD, so a short identity here is a programming error, not
              // a retry marker worth prefix-matching (two commits can share
              // a 7-char prefix, which would let old-HEAD evidence authorize
              // a new HEAD and silently reset the budget). short-SHA markers
              // are ignored entirely: short retry markers never advance
              // latestAttempt and short exhausted markers never preserve
              // exhaustion.
              const exactHead = requireFullHead(head, 'retry evidence read');
              // Exact-HEAD identity only: prefix matching is rejected
