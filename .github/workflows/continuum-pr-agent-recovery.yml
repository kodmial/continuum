name: PR-Agent recovery

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying the recovery engine.
        type: string
        default: main
        required: false
      review_provider:
        description: Review provider selector; empty falls back to CONTINUUM_REVIEW_PROVIDER.
        type: string
        default: ''
        required: false
      review_workflow:
        description: PR-Agent caller workflow file to dispatch.
        type: string
        default: continuum-pr-agent.yml
        required: false
      ci_workflow_name:
        description: Exact workflow name that proves current-head CI.
        type: string
        default: CI
        required: false
      stale_minutes:
        description: Pending operation age after which missing liveness becomes recoverable.
        type: string
        default: ''
        required: false
      dispatch_grace_seconds:
        description: Grace after a durable dispatch marker before a missing run may be replayed.
        type: string
        default: ''
        required: false
      max_executions:
        description: >-
          Total transient executions per exact PR/HEAD/operation (default 10,
          clamped to 1..10). Empty falls back to
          vars.PR_AGENT_RECOVERY_MAX_EXECUTIONS, then to 10. Success or a new
          HEAD resets the episode; deterministic failures never consume it.
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: pr-agent-recovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (inputs.review_provider || vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'pr-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read

    steps:
      - name: Reconcile PR-Agent latest state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || 'CI' }}
          STALE_MINUTES: ${{ inputs.stale_minutes || vars.PR_AGENT_RECOVERY_STALE_MINUTES || '70' }}
          DISPATCH_GRACE_SECONDS: ${{ inputs.dispatch_grace_seconds || vars.PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS || '90' }}
          MAX_EXECUTIONS_RAW: ${{ inputs.max_executions }}
          MAX_EXECUTIONS_FALLBACK: ${{ vars.PR_AGENT_RECOVERY_MAX_EXECUTIONS || '10' }}
          # Item 1 of Work Lock #58: same-repo reads use the repository-scoped
          # installation token. PAT remains the mutation/dispatch identity.
          READ_GITHUB_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = owner + '/' + repo;
            const reviewWorkflow = String(process.env.REVIEW_WORKFLOW || 'continuum-pr-agent.yml').trim();
            const ciWorkflowName = String(process.env.CI_WORKFLOW_NAME || 'CI').trim();
            // Single 10-execution transient budget (#224): default 10 total
            // executions per exact PR/HEAD/operation, configurable through a
            // safe bounded Continuum variable and always clamped to 1..10 so
            // a misconfigured value can neither silence recovery nor grant
            // an unbounded budget. Success or a new HEAD resets the episode.
            const MAX_TRANSIENT_EXECUTIONS = 10;
            const MIN_TRANSIENT_EXECUTIONS = 1;
            function resolveMaxExecutions(raw, fallback = MAX_TRANSIENT_EXECUTIONS) {
              const toBounded = (value) => {
                const parsed = Number.parseInt(String(value ?? '').trim(), 10);
                if (!Number.isFinite(parsed)) return MAX_TRANSIENT_EXECUTIONS;
                return Math.min(
                  MAX_TRANSIENT_EXECUTIONS,
                  Math.max(MIN_TRANSIENT_EXECUTIONS, parsed)
                );
              };
              if (raw === undefined || raw === null || String(raw).trim() === '') {
                return toBounded(fallback);
              }
              // A non-numeric override must honor the operator fallback (vars),
              // not silently widen to 10 executions beyond operator intent.
              if (!Number.isFinite(Number.parseInt(String(raw).trim(), 10))) {
                return toBounded(fallback);
              }
              return toBounded(raw);
            }
            const maxExecutions = resolveMaxExecutions(
              process.env.MAX_EXECUTIONS_RAW,
              process.env.MAX_EXECUTIONS_FALLBACK
            );
            const staleMs = Number.parseInt(process.env.STALE_MINUTES || '70', 10) * 60_000;
            const dispatchGraceMs =
              Number.parseInt(process.env.DISPATCH_GRACE_SECONDS || '90', 10) * 1_000;
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const retryableConclusions = new Set([
              'cancelled',
              'timed_out',
              'stale',
              'startup_failure',
            ]);
            const activeStatuses = new Set([
              'queued',
              'in_progress',
              'waiting',
              'requested',
              'pending',
            ]);
            const REVIEW_CONTEXT = 'continuum/pr-agent-review';
            const REPAIR_CONTEXT = 'continuum/pr-agent-repair';
            const CONTROLLER_STATE_MARKER = '<!-- continuum-pr-agent-controller-state:v1 -->';

            // Keep the action client PAT-authenticated for mutations/dispatch.
            // A distinct Octokit instance handles read-only same-repository calls
            // with github.token, keeping those requests off TAP_PAT's shared budget.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            // github-script already supplies the plugin-composed Octokit class.
            // Reuse its constructor instead of dynamically requiring
            // @actions/github, which is not resolvable from the script sandbox.
            // Preserve the enterprise base URL so GitHub Enterprise reads keep working.
            const readBaseUrl = (
              (github && github.request && github.request.endpoint &&
                github.request.endpoint.DEFAULTS && github.request.endpoint.DEFAULTS.baseUrl) ||
              process.env.GITHUB_API_URL || 'https://api.github.com'
            );
            if (!readToken) {
              core.setFailed('READ_GITHUB_TOKEN is empty; same-repository reads require GITHUB_TOKEN and must not fall back to TAP_PAT.');
              return;
            }
            const readGithub = new github.constructor({ auth: readToken, baseUrl: readBaseUrl });
            let readTokenUnavailable = false;
            function isRateLimitError(err, status) {
              if (status === 429) return true;
              if (status !== 403) return false;
              const headers = (err && ((err.response && err.response.headers) || err.headers)) || {};
              const remaining = headers['x-ratelimit-remaining'] ?? headers['X-RateLimit-Remaining'];
              if (String(remaining) === '0') return true;
              return /rate limit|rate-limit|ratelimit|quota exhaustion|secondary rate limit|retry after/i.test(
                String((err && err.message) || '')
              );
            }
            async function withReadFallback(fn) {
              if (readTokenUnavailable || readGithub === github) {
                return await fn(github);
              }
              try {
                return await fn(readGithub);
              } catch (err) {
                const status = err ? (err.status ?? err.response?.status) : undefined;
                // Never spend TAP_PAT's shared budget on rate-limit retries:
                // a 429 or a rate-limited 403 must surface so the caller
                // defers to the next wakeup instead of re-issuing the scan
                // on the PAT client. Only authentication/permission gaps
                // (401, non-rate-limit 403) fall back.
                if (status === 401 || (status === 403 && !isRateLimitError(err, status))) {
                  readTokenUnavailable = true;
                  core.warning('Repository-token read failed (' + status + '); retrying with PAT client: ' + err.message);
                  return await fn(github);
                }
                throw err;
              }
            }

            if (!['continuum-pr-agent.yml', 'pr-agent.yml'].includes(reviewWorkflow)) {
              core.setFailed(
                'Invalid PR-Agent review workflow: ' + reviewWorkflow +
                '. Expected continuum-pr-agent.yml or pr-agent.yml.'
              );
              return;
            }
            if (!Number.isFinite(staleMs) || staleMs < 60_000) {
              core.setFailed('PR_AGENT_RECOVERY_STALE_MINUTES must be at least 1.');
              return;
            }
            if (!Number.isFinite(dispatchGraceMs) || dispatchGraceMs < 0) {
              core.setFailed('PR_AGENT_RECOVERY_DISPATCH_GRACE_SECONDS must be non-negative.');
              return;
            }

            function nowMs() {
              return Date.now();
            }

            function ageMs(value) {
              const parsed = Date.parse(String(value || ''));
              return Number.isFinite(parsed) ? Math.max(0, nowMs() - parsed) : Number.MAX_SAFE_INTEGER;
            }

            // Canonical durable marker contract (#224): exactly one marker
            // shape carries retry state, with not-before INSIDE the trailing
            // --> so a single parseable comment holds the whole record.
            // Legacy full-SHA continuum-pr-agent-retry markers remain
            // readable so existing durable state survives; all new writes
            // use the continuum-lifecycle-retry prefix. Pre-existing
            // short-SHA exhausted markers never authorize a retry attempt,
            // but a prefix-matching one preserves exhaustion fail-closed
            // (see parseEvidence) so the bounded budget never restarts.
            const LIFECYCLE_RETRY_PREFIX = 'continuum-lifecycle-retry';
            const LIFECYCLE_EXHAUSTED_PREFIX = 'continuum-lifecycle-retry-exhausted';
            // Exact-HEAD producer contract (#224): every durable marker
            // carries a full commit id (40-hex SHA-1 or 64-hex SHA-256).
            // Short SHAs fail loudly here at write/parse time so a short
            // marker can never be silently ignored (which would reset the
            // bounded budget) and can never split budget/exhaustion across
            // identities. All producers pass the full `pr.head.sha`.
            const FULL_HEAD_RE = /^[0-9a-f]{40,64}$/i;
            function requireFullHead(head, what) {
              if (!FULL_HEAD_RE.test(String(head || '').trim())) {
                throw new Error(
                  'Refusing ' + what + ' with a non-full commit id; ' +
                  'producers must pass the full 40-hex (or 64-hex) HEAD.'
                );
              }
              return String(head).toLowerCase();
            }
            function retryMarker(head, kind, attempt, notBefore) {
              const fullHead = requireFullHead(head, 'retry marker');
              const suffix = Number.isFinite(Number(notBefore)) && Number(notBefore) > 0
                ? ' not-before=' + Number(notBefore)
                : '';
              return '<!-- ' + LIFECYCLE_RETRY_PREFIX + ' head=' +
                fullHead + ' kind=' + kind +
                ' attempt=' + String(attempt) + suffix + ' -->';
            }

            function exhaustedMarker(head, kind) {
              const fullHead = requireFullHead(head, 'exhaustion marker');
              return '<!-- ' + LIFECYCLE_EXHAUSTED_PREFIX + ' head=' +
                fullHead + ' kind=' + kind +
                ' attempts=' + String(maxExecutions) + ' -->';
            }

            function controllerStateBody(stateMarker, summary) {
              return [
                CONTROLLER_STATE_MARKER,
                String(stateMarker || '').trim(),
                '<details>',
                '<summary>Continuum PR-Agent controller state</summary>',
                '',
                String(summary || '').trim(),
                '',
                '</details>',
              ].join('\n');
            }

            async function upsertControllerState(prNumber, stateMarker, summary) {
              const comments = await withReadFallback(client =>
                client.paginate(
                  client.rest.issues.listComments,
                  { owner, repo, issue_number: prNumber, per_page: 100 }
                )
              );
              const controller = comments
                .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                .sort((a, b) => Number(a.id) - Number(b.id));
              const latest = controller.at(-1);
              // Presentation-only liveness touch. The durable retry identity
              // is the stateMarker line alone (parseEvidence matches only
              // continuum-pr-agent-retry markers). This summary line only
              // forces a body change so GitHub advances updated_at on every
              // committed dispatch; it is never parsed as retry state and its
              // literal prefix cannot match the retry/exhausted regexes.
              // The summary is coerced null-safe: a missing/non-string
              // summary must render as empty, never as "undefined"/"null".
              const body = controllerStateBody(
                stateMarker,
                String(summary || '').trim() + '\n\nController dispatch run: ' + String(context.runId)
              );
              let result;
              if (latest) {
                const { data } = await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: latest.id,
                  body,
                });
                result = {
                  comment: data,
                  created: false,
                  previousBody: String(latest.body || ''),
                };
              } else {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
                result = { comment: data, created: true, previousBody: '' };
              }
              for (const stale of controller.slice(0, -1)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stale.id,
                });
              }
              return result;
            }

            // Retained for the single-comment coalescing contract: every
            // controller-state change goes through upsertControllerState
            // (update latest, prune stale). Dispatch records a pre-dispatch
            // claim via a fresh createComment (never an update, so the
            // existing comment's updated_at is untouched), deletes that
            // claim via rollbackControllerState when the dispatch throws,
            // and coalesces via upsertControllerState after success.
            async function rollbackControllerState(stateWrite) {
              if (!stateWrite || !stateWrite.comment) return;
              if (stateWrite.created) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: stateWrite.comment.id,
                });
                return;
              }
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateWrite.comment.id,
                body: stateWrite.previousBody,
              });
            }

            // not-before lives inside the canonical marker only; a stray
            // not-before= outside any marker is ignored so producers cannot
            // diverge. Legacy markers predate durable not-before and carry none.
            function markerNotBefore(match) {
              const raw = match && match[4] !== undefined ? match[4] : null;
              const parsed = Number.parseInt(String(raw ?? ''), 10);
              return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
            }
            function parseEvidence(comments, head, kind) {
              // Fail closed on short SHAs: every producer writes the full
              // HEAD, so a short identity here is a programming error, not
              // a retry marker worth prefix-matching (two commits can share
              // a 7-char prefix, which would let old-HEAD evidence authorize
              // a new HEAD and silently reset the budget). The single
              // exception is fail-closed exhaustion below: a pre-existing
              // short-SHA exhausted marker that prefixes the current HEAD
              // preserves exhaustion so the budget never restarts. Short
              // retry markers never advance latestAttempt.
              const exactHead = requireFullHead(head, 'retry evidence read');
              // Exact-HEAD identity only: prefix matching is rejected
              // because two distinct commits can share a 7-char prefix,
              // which would let old-HEAD evidence authorize a new HEAD.
              // Markers always carry a full commit id.
              function sameHead(markerHead, currentHead) {
                const marker = String(markerHead || '').toLowerCase();
                const current = String(currentHead || '').toLowerCase();
                return marker.length > 0 && marker === current;
              }
              const retryRe =
                /<!--\s*continuum-lifecycle-retry\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempt=(\d+)(?:\s+not-before=(\d+))?[^>]*-->/ig;
              const legacyRetryRe =
                /<!--\s*continuum-pr-agent-retry\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempt=(\d+)[^>]*-->/ig;
              const exhaustedRe =
                /<!--\s*continuum-lifecycle-retry-exhausted\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/ig;
              const legacyExhaustedRe =
                /<!--\s*continuum-pr-agent-retry-exhausted\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/ig;
              // Pre-existing short-SHA exhausted markers (7-39 hex) from
              // before exact-HEAD safety: fail-closed only. A prefix-matching
              // one preserves exhaustion so the budget never restarts; short
              // retry markers never authorize work, so there is deliberately
              // no short retry regex feeding latestAttempt.
              const legacyShortExhaustedRe =
                /<!--\s*continuum-pr-agent-retry-exhausted\s+head=([0-9a-f]{7,39})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/ig;
              let latestAttempt = null;
              let latestMarkerAt = null;
              let notBeforeEpoch = null;
              let exhausted = false;
              const consider = (markerHead, markerKind, attemptText, markerNotBeforeEpoch, createdAt) => {
                if (markerKind !== kind || !sameHead(markerHead, exactHead)) return;
                const attempt = Number.parseInt(attemptText, 10);
                if (latestAttempt === null || attempt > latestAttempt) {
                  latestAttempt = attempt;
                  latestMarkerAt = Number.isFinite(createdAt) ? createdAt : null;
                  notBeforeEpoch = markerNotBeforeEpoch;
                } else if (
                  attempt === latestAttempt &&
                  Number.isFinite(createdAt) &&
                  (latestMarkerAt === null || createdAt > latestMarkerAt)
                ) {
                  latestMarkerAt = Number.isFinite(createdAt) ? createdAt : null;
                  // Latest write wins, including clearing: a newer
                  // same-attempt marker without not-before lifts the older
                  // reset-aware wait instead of waiting past the clearing.
                  notBeforeEpoch = markerNotBeforeEpoch;
                } else if (attempt === latestAttempt && markerNotBeforeEpoch !== null && notBeforeEpoch === null) {
                  notBeforeEpoch = markerNotBeforeEpoch;
                }
              };
              for (const comment of comments) {
                if (!trustedAssociations.has(String(comment.author_association || '').toUpperCase())) {
                  continue;
                }
                const body = String(comment.body || '');
                const createdAt = Date.parse(String(comment.updated_at || comment.created_at || ''));
                retryRe.lastIndex = 0;
                legacyRetryRe.lastIndex = 0;
                exhaustedRe.lastIndex = 0;
                legacyExhaustedRe.lastIndex = 0;
                legacyShortExhaustedRe.lastIndex = 0;
                for (const match of body.matchAll(retryRe)) {
                  consider(match[1], match[2], match[3], markerNotBefore(match), createdAt);
                }
                for (const match of body.matchAll(legacyRetryRe)) {
                  consider(match[1], match[2], match[3], null, createdAt);
                }
                for (const match of body.matchAll(exhaustedRe)) {
                  if (
                    sameHead(match[1], exactHead) &&
                    match[2] === kind &&
                    Number.parseInt(match[3], 10) >= maxExecutions
                  ) {
                    exhausted = true;
                  }
                }
                for (const match of body.matchAll(legacyExhaustedRe)) {
                  if (
                    sameHead(match[1], exactHead) &&
                    match[2] === kind &&
                    Number.parseInt(match[3], 10) >= maxExecutions
                  ) {
                    exhausted = true;
                  }
                }
                // Legacy short-SHA markers are ignored: two distinct commits
                // can share a 7-char prefix, so prefix matching would let
                // old-HEAD evidence strand an unrelated healthy HEAD with no
                // expiry path. Exact-HEAD isolation requires full-commit
                // identity only.
              }
              return { latestAttempt, latestMarkerAt, notBeforeEpoch, exhausted };
            }

            function latestContext(statuses, name) {
              return statuses
                .filter(status => status.context === name)
                .sort((a, b) =>
                  Date.parse(b.updated_at || b.created_at || 0) -
                  Date.parse(a.updated_at || a.created_at || 0)
                )[0] || null;
            }

            async function listReviewRuns() {
              try {
                return await withReadFallback(client =>
                  client.paginate(
                    client.rest.actions.listWorkflowRuns,
                    {
                      owner,
                      repo,
                      workflow_id: reviewWorkflow,
                      per_page: 100,
                    }
                  )
                );
              } catch (err) {
                // A transient/rate-limit read must never fail the run here:
                // callers defer green to the next wakeup instead of spending
                // PAT budget. Only deterministic errors fail loudly.
                if (isTransientApiError(err)) throw err;
                core.setFailed(
                  'Could not inspect PR-Agent caller runs for ' + reviewWorkflow +
                  ': ' + (err.message || err)
                );
                throw err;
              }
            }

            function exactActiveRun(runs, prNumber, kind, head) {
              const prefix = 'PR-Agent PR #' + prNumber + ' [' + kind + ':';
              const suffix = '] head=' + String(head).toLowerCase();
              return runs.find(run =>
                String(run.display_title || '').startsWith(prefix) &&
                String(run.display_title || '').endsWith(suffix) &&
                activeStatuses.has(String(run.status || '').toLowerCase())
              ) || null;
            }

            async function operationIsActive(prNumber, head, kind) {
              // Re-read immediately before dispatch-grace coalescing. A fresh
              // controller marker is only proof of a live dispatch while the
              // exact PR/HEAD/operation run is still active; if that run was
              // lost or already terminated, recovery must replay the same
              // bounded attempt instead of waiting out the grace window.
              const runs = await listReviewRuns();
              return Boolean(exactActiveRun(runs, prNumber, kind, head));
            }

            async function statusRunMetadata(status) {
              const target = String(status?.target_url || '');
              const match = target.match(/\/actions\/runs\/(\d+)(?:$|[/?#])/);
              if (!match) return { conclusion: null, recoveryKind: null };
              try {
                const { data: run } = await withReadFallback(client =>
                  client.rest.actions.getWorkflowRun({
                    owner,
                    repo,
                    run_id: Number(match[1]),
                  })
                );
                const title = String(run.display_title || '');
                const identity = title.match(/\[(review|repair):\d+\]/);
                const recoveryKind = identity ? identity[1] : null;
                if (activeStatuses.has(String(run.status || '').toLowerCase())) {
                  return {
                    conclusion: String(run.status || '').toLowerCase(),
                    recoveryKind,
                  };
                }
                return {
                  conclusion:
                    String(run.conclusion || run.status || '').toLowerCase() || null,
                  recoveryKind,
                };
              } catch (err) {
                if (err.status === 404) {
                  return { conclusion: null, recoveryKind: null };
                }
                throw err;
              }
            }

            async function exactHeadCiGreen(head) {
              const runs = await withReadFallback(client =>
                client.paginate(
                  client.rest.actions.listWorkflowRunsForRepo,
                  {
                    owner,
                    repo,
                    event: 'pull_request',
                    head_sha: head,
                    per_page: 100,
                  }
                )
              );
              const latest = runs
                .filter(run => run.name === ciWorkflowName && run.head_sha === head)
                .sort((a, b) =>
                  Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0)
                )[0];
              return Boolean(
                latest &&
                latest.status === 'completed' &&
                latest.conclusion === 'success'
              );
            }

            // Canonical 10-execution schedule (#224): execution index 0 runs
            // immediately; retries 1..9 wait ~10s, 30s, 60s, 3m, 5m, 10m,
            // 20m, 40m, 60m. Bounded deterministic jitter keeps concurrent
            // PRs from dispatching in lockstep.
            const RETRY_DELAY_SCHEDULE = [0, 10, 30, 60, 180, 300, 600, 1200, 2400, 3600];
            const JITTER_CAP_SECONDS = 5;
            function backoffSeconds(attempt) {
              if (attempt <= 0) return 0;
              if (attempt < RETRY_DELAY_SCHEDULE.length) return RETRY_DELAY_SCHEDULE[attempt];
              return RETRY_DELAY_SCHEDULE[RETRY_DELAY_SCHEDULE.length - 1];
            }
            function jitterSeconds(key, attempt, cap = JITTER_CAP_SECONDS) {
              let hash = 2166136261;
              const text = String(key || 'lifecycle') + ':' + String(attempt);
              for (let i = 0; i < text.length; i += 1) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
              }
              return cap > 0 ? (hash >>> 0) % (cap + 1) : 0;
            }

            // Generic transient-failure classification for lifecycle
            // self-healing (#224). Infrastructure gaps (GitHub 403 rate limit
            // with an empty budget, 429/Retry-After, 5xx, network
            // timeout/reset, runner cancellation/eviction, temporary
            // provider/bootstrap outage) are retryable through the bounded
            // budget. Deterministic policy outcomes (red CI, unresolved
            // findings, merge conflict, malformed state, moved HEAD) never
            // consume it and hold instead.
            function isTransientApiError(err) {
              const status = err ? (err.status ?? err.response?.status) : undefined;
              if (status === 429) return true;
              if (typeof status === 'number' && status >= 500 && status <= 599) return true;
              if (status === 403) {
                const headers = (err.response && err.response.headers) || err.headers || {};
                const remaining = headers['x-ratelimit-remaining'] ?? headers['X-RateLimit-Remaining'];
                const message = String(err.message || '');
                if (String(remaining) === '0') return true;
                if (/rate limit|rate-limit|ratelimit|quota exhaustion|secondary rate limit/i.test(message)) return true;
                return false;
              }
              // A cancelled/evicted-run error without runner/run phrasing is
              // still transient: consume the bounded transient budget and
              // retry from latest state instead of holding as deterministic.
              // Mirrors continuum-auto-merge.yml.
              const retryable = new Set(['cancelled', 'timed_out', 'stale', 'startup_failure']);
              if (err && retryable.has(String(err.conclusion || '').toLowerCase())) return true;
              // Bare timeout alone never proves infrastructure: deterministic
              // current-head CI text such as `tests timed out: assertion
              // failed` must hold. Only qualified infrastructure timeouts
              // retry; any assertion mention holds.
              const message = String((err && err.message) || '').toLowerCase();
              if (message.includes('assert')) return false;
              if (/econnreset|econnrefused|eai_again|epipe|socket hang up|network error|network failure|network timeout|network unreachable|dns error|dns failure|dns resolution|tls handshake|tls error|ssl error|connection reset|connection refused|connection aborted|temporarily unavailable|service unavailable|bad gateway|gateway timeout|bootstrap failed|bootstrap error|runner evicted|runner cancelled|runner timeout|runner lost|run evicted|run cancelled/i.test(
                String((err && err.message) || '')
              )) {
                return true;
              }
              if (/timed out|timeout/i.test(String((err && err.message) || ''))) {
                return /read|connection|network|runner|socket|dns|tls|ssl|gateway|http|request|operation|bootstrap|provider/i.test(
                  String((err && err.message) || '')
                );
              }
              return false;
            }

            // Reset-aware scheduling (#224): Retry-After, X-RateLimit-Reset
            // and any provider reset are a minimum next-attempt time. The
            // schedule plus bounded jitter is the floor; a longer reset wait
            // wins. A runner never sleeps through a long wait: delays beyond
            // the inline threshold persist not-before/next-attempt state and
            // defer to the scheduled safety net, which redispatches when the
            // window expires. Short backoffs are awaited inline.
            const MAX_INLINE_WAIT_SECONDS = 60;
            function resetAwareDelaySeconds({ attempt, retryAfterSeconds, ratelimitResetEpoch, providerResetEpoch, nowEpoch, operationKey }) {
              let delay = backoffSeconds(attempt) + jitterSeconds(operationKey || 'lifecycle', attempt);
              if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds >= 0) {
                delay = Math.max(delay, retryAfterSeconds);
              }
              for (const resetEpoch of [ratelimitResetEpoch, providerResetEpoch]) {
                if (Number.isFinite(resetEpoch) && Number.isFinite(nowEpoch)) {
                  delay = Math.max(delay, Math.max(0, resetEpoch - nowEpoch));
                }
              }
              return delay;
            }

            // Reset-signal extraction (#224): server-provided Retry-After /
            // X-RateLimit-Reset / provider reset minimums are read from the
            // failed call's headers so a 429/403 does not fall back to
            // schedule+jitter alone. Callers always pass the live clock, so a
            // reset epoch is never silently dropped.
            function extractRateLimitSignals(err) {
              const headers = (err && ((err.response && err.response.headers) || err.headers)) || {};
              const lowered = {};
              for (const [key, value] of Object.entries(headers)) {
                lowered[String(key).toLowerCase()] = value;
              }
              const retryAfterRaw = lowered['retry-after'];
              let retryAfterSeconds;
              if (retryAfterRaw !== undefined && retryAfterRaw !== null && String(retryAfterRaw).trim() !== '') {
                const text = String(retryAfterRaw).trim();
                const parsed = Number.parseInt(text, 10);
                if (Number.isFinite(parsed) && parsed >= 0 && /^\d+/.test(text)) {
                  retryAfterSeconds = parsed;
                } else {
                  // HTTP-date form (e.g. "Wed, 21 Oct 2015 07:28:00 GMT"):
                  // honor the server-requested time instead of falling back
                  // to schedule+jitter and retrying too early.
                  const when = Date.parse(text);
                  if (Number.isFinite(when)) {
                    retryAfterSeconds = Math.max(0, Math.ceil((when - Date.now()) / 1000));
                  }
                }
              }
              const resetRaw = lowered['x-ratelimit-reset'] ?? lowered['ratelimit-reset'];
              let ratelimitResetEpoch;
              if (resetRaw !== undefined && resetRaw !== null && String(resetRaw).trim() !== '') {
                const parsed = Number.parseInt(String(resetRaw).trim(), 10);
                if (Number.isFinite(parsed) && parsed > 0) ratelimitResetEpoch = parsed;
              }
              const providerRaw = lowered['x-provider-reset'] ?? lowered['provider-reset'];
              let providerResetEpoch;
              if (providerRaw !== undefined && providerRaw !== null && String(providerRaw).trim() !== '') {
                const parsed = Number.parseInt(String(providerRaw).trim(), 10);
                if (Number.isFinite(parsed) && parsed > 0) providerResetEpoch = parsed;
              }
              return { retryAfterSeconds, ratelimitResetEpoch, providerResetEpoch };
            }

            // Per-PR/HEAD/operation lease (#224): the in-memory Set below only
            // coalesces duplicate wakeups WITHIN a single run. Cross-run
            // safety comes from three durable mechanisms, not from the Set:
            // the repository-global concurrency group serializes reconciler
            // runs (cancel-in-progress:false, so a queued run re-reconciles
            // from latest state instead of racing), the durable dispatch
            // marker inside its grace window coalesces a lost dispatch replay,
            // and every dispatch re-reads the exact HEAD, CI, active runs and
            // durable evidence immediately before mutating. A stale queued run
            // therefore becomes a safe no-op instead of a concurrent writer,
            // and independent PRs never starve each other.
            const ownedLeases = new Set();
            function leaseKey(prNumber, head, kind) {
              return String(prNumber) + ':' + String(head || '').toLowerCase() + ':' + String(kind || '');
            }
            function tryAcquireLease(prNumber, head, kind) {
              const key = leaseKey(prNumber, head, kind);
              if (ownedLeases.has(key)) return false;
              ownedLeases.add(key);
              return true;
            }

            function decide({
              ciGreen,
              operationStatus,
              activeRun,
              runConclusion,
              evidence,
              failureTransient,
            }) {
              const state = String(operationStatus?.state || '').toLowerCase() || null;
              const description = String(operationStatus?.description || '');
              // Settled dominates every wait/hold below so a success clears
              // obsolete durable state (exhaustion markers, stale leases,
              // not-before waits) via the success path.
              if (state === 'success') {
                return { action: 'settled', reason: 'operation already settled' };
              }
              if (!ciGreen) return { action: 'wait', reason: 'exact HEAD CI is not green' };
              if (evidence.exhausted) {
                return { action: 'hold', reason: 'durable retry exhaustion marker exists' };
              }
              if (activeRun) {
                return { action: 'wait', reason: 'exact PR/HEAD/operation already active' };
              }
              // Durable reset-aware not-before (#224): a deferred execution
              // waits for the scheduled safety net to redispatch; it never
              // burns budget early and never sleeps a runner.
              if (
                evidence.notBeforeEpoch !== null &&
                evidence.notBeforeEpoch !== undefined &&
                Number.isFinite(evidence.notBeforeEpoch) &&
                Math.floor(nowMs() / 1000) < evidence.notBeforeEpoch
              ) {
                return { action: 'wait', reason: 'durable reset-aware not-before time has not arrived' };
              }

              const statusAt = operationStatus
                ? Date.parse(String(operationStatus.updated_at || operationStatus.created_at || ''))
                : null;
              const markerNewer =
                evidence.latestMarkerAt !== null &&
                (!Number.isFinite(statusAt) || evidence.latestMarkerAt > statusAt);
              const markerAge =
                evidence.latestMarkerAt === null ? null : Math.max(0, nowMs() - evidence.latestMarkerAt);

              if (
                markerNewer &&
                evidence.latestAttempt !== null &&
                (markerAge === null || markerAge < dispatchGraceMs)
              ) {
                return {
                  action: 'wait',
                  reason: 'newer durable dispatch marker is inside grace window',
                };
              }
              // Fail closed on unknown marker age (#224, single lifecycle
              // contract): a durable marker without a parseable timestamp
              // cannot prove grace expired, so an in-flight dispatch
              // (marker newer than status) stays inside grace instead of
              // dispatching a likely duplicate immediately. Gated on
              // markerNewer so a stale timestamp-less marker never strands
              // the PR forever: once status catches up, reconciliation
              // proceeds.
              if (
                markerNewer &&
                evidence.latestAttempt !== null &&
                evidence.latestMarkerAt === null
              ) {
                return {
                  action: 'wait',
                  reason: 'durable dispatch marker age is unknown; staying inside dispatch grace',
                };
              }

              let recoverable = false;
              const operationSeen = state !== null;
              if (state === null) {
                recoverable = true;
              } else if (state === 'success') {
                return { action: 'settled', reason: 'operation already settled' };
              } else if (state === 'failure') {
                // Explicit classifier verdicts dominate the token gate,
                // mirroring src/continuum/pr_agent_recovery.py: a proven
                // transient dispatches even without the token (so real
                // infrastructure gaps never strand for lack of a token), and
                // a proven deterministic holds even with it.
                if (failureTransient === true) {
                  recoverable = true;
                } else if (failureTransient === false) {
                  return {
                    action: 'hold',
                    reason: 'deterministic failure is not automatically retried',
                  };
                } else {
                // Only the explicit reconciler-synthesized token authorizes
                // a retry without classifier input. A bare "transient"
                // substring is never sufficient: deterministic messages such
                // as "non-transient policy failure" contain it and must never
                // burn the transient budget. Negated forms (not/no/non/never
                // plus any space/hyphen/underscore separator, including
                // concatenated "nonrecovery eligible") hold, matching the
                // single lifecycle contract. A deterministic policy hint
                // alongside the token still holds: only an explicit
                // transient classifier verdict overrides it, so PR-visible
                // output containing the token can never spend the budget.
                const lowered = description.toLowerCase();
                // Narrowed deterministic hints, mirroring
                // src/continuum/pr_agent_recovery.py: bare "unresolved"
                // alone never holds (transient "unresolved host"/DNS text
                // must retry), and bare "conflict" matches at any position
                // except inside "conflict-free"/"conflicting".
                const hasDeterministicHint = /test failure|tests failed|unresolved\s+(findings?|reviews?|threads?|comments?|conversations?)|merge conflict|malformed|stale head|moved head|invalid state|(?:^|[^a-z])conflict(?!\s*-\s*free\b)(?!ing\b)/.test(lowered);
                if (
                  /\brecovery eligible\b/.test(lowered) &&
                  !/\b(?:not|no|non|never)[\s\-_]*recovery[\s\-_]+eligible\b/.test(lowered) &&
                  !hasDeterministicHint
                ) {
                  recoverable = true;
                } else {
                  return {
                    action: 'hold',
                    reason: 'deterministic failure is not automatically retried',
                  };
                }
                }
              } else if (state === 'pending') {
                // An explicit deterministic verdict dominates staleness; an
                // explicit transient verdict dispatches without waiting for
                // staleness. Stale alone never proves transient: only a
                // retryable conclusion (or no conclusion) recovers, so a
                // stale deterministic failure waits instead of burning
                // budget.
                if (failureTransient === false) {
                  return {
                    action: 'hold',
                    reason: 'deterministic failure is not automatically retried',
                  };
                } else if (failureTransient === true) {
                  recoverable = true;
                } else if (retryableConclusions.has(String(runConclusion || '').toLowerCase())) {
                  recoverable = true;
                } else if (
                  ageMs(operationStatus.updated_at || operationStatus.created_at) >= staleMs &&
                  (runConclusion === null || runConclusion === undefined ||
                    retryableConclusions.has(String(runConclusion || '').toLowerCase()))
                ) {
                  recoverable = true;
                } else {
                  return { action: 'wait', reason: 'pending operation is not stale' };
                }
              } else {
                return { action: 'hold', reason: 'unknown operation state ' + state };
              }

              if (!recoverable) {
                return { action: 'hold', reason: 'operation is not recoverable' };
              }

              // Always advance to the next index: the dispatch-grace wait
              // above already handles an unobserved dispatch, and replaying
              // the same index would keep attempt >= budget from ever firing.
              let attempt;
              if (evidence.latestAttempt === null) {
                attempt = operationSeen ? 1 : 0;
              } else {
                attempt = evidence.latestAttempt + 1;
              }

              if (attempt >= maxExecutions) {
                return { action: 'exhaust', reason: 'automatic execution budget exhausted' };
              }
              return {
                action: 'dispatch',
                attempt,
                reason: state === null ? 'lost/missing operation' : 'transient/stale operation',
              };
            }

            async function defaultBranch() {
              const { data } = await withReadFallback(client =>
                client.rest.repos.get({ owner, repo })
              );
              return String(data.default_branch || 'main');
            }

            async function dispatch(pr, kind, head, attempt, status, signals = {}) {
              requireFullHead(head, 'recovery dispatch');
              const delaySeconds = resetAwareDelaySeconds({
                attempt,
                retryAfterSeconds: signals.retryAfterSeconds,
                ratelimitResetEpoch: signals.ratelimitResetEpoch,
                providerResetEpoch: signals.providerResetEpoch,
                nowEpoch: Math.floor(nowMs() / 1000),
                operationKey: repoFullName + '#' + pr.number + ':' + head + ':' + kind,
              });
              const statusTime = status
                ? Date.parse(String(status.updated_at || status.created_at || ''))
                : null;
              const elapsedSeconds = Number.isFinite(statusTime)
                ? Math.floor(Math.max(0, nowMs() - statusTime) / 1000)
                : delaySeconds;
              const remaining = Math.max(0, delaySeconds - elapsedSeconds);
              if (remaining > MAX_INLINE_WAIT_SECONDS) {
                // Never keep a runner sleeping through a long rate-limit or
                // quota wait. Record the reset-aware not-before time so the
                // scheduled safety net redispatches when the window expires.
                // The deferral performs no execution, so it must never
                // advance the budget: persist attempt-1 so the next wakeup
                // re-derives the same pending attempt index instead of
                // advancing to latest+1 without any execution. Attempt 0 has
                // no predecessor, so persist attempt 0 itself with the same
                // not-before: the next wakeup waits inside the window instead
                // of re-deriving a fresh attempt 0 without the original
                // Retry-After/RateLimit-Reset signals and re-hammering quota.
                const notBefore = Math.floor(nowMs() / 1000) + remaining;
                await upsertControllerState(
                  pr.number,
                  retryMarker(head, kind, attempt > 0 ? attempt - 1 : 0, notBefore),
                  'Deferred PR-Agent ' + kind + ' recovery for exact HEAD ' + head +
                    ' until ' + new Date(notBefore * 1000).toISOString() +
                    ' (reset-aware backoff ' + remaining + 's).'
                );
                core.notice(
                  'PR #' + pr.number + ' ' + kind +
                  ': deferring execution index ' + attempt + ' for ' + remaining +
                  's; the scheduled safety net will redispatch. No runner sleeps.'
                );
                return false;
              }
              if (remaining > 0) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': bounded backoff ' + remaining + 's before execution index ' + attempt + '.'
                );
                await new Promise(resolve => setTimeout(resolve, remaining * 1000));
              }

              const { data: fresh } = await withReadFallback(client =>
                client.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                })
              );
              if (
                fresh.state !== 'open' ||
                fresh.draft ||
                !fresh.head.repo ||
                fresh.head.repo.full_name !== repoFullName ||
                fresh.head.sha !== head
              ) {
                core.info(
                  'PR #' + pr.number + ' moved/closed during recovery backoff; stale dispatch cancelled.'
                );
                return false;
              }
              if (!(await exactHeadCiGreen(head))) {
                core.info(
                  'PR #' + pr.number + ' HEAD ' + head +
                  ': CI is no longer green; recovery dispatch cancelled.'
                );
                return false;
              }

              const refreshedRuns = await listReviewRuns();
              if (exactActiveRun(refreshedRuns, pr.number, kind, head)) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': another exact operation became active; duplicate wakeup coalesced.'
                );
                return false;
              }

              const refreshedComments = await withReadFallback(client =>
                client.paginate(
                  client.rest.issues.listComments,
                  { owner, repo, issue_number: pr.number, per_page: 100 }
                )
              );
              const refreshedEvidence = parseEvidence(refreshedComments, head, kind);
              if (refreshedEvidence.exhausted) {
                core.info('PR #' + pr.number + ' ' + kind + ': retry budget is already exhausted.');
                return false;
              }
              // Exact-HEAD revalidation immediately before mutation: a
              // reset-aware not-before written by a concurrent reconciler (or
              // an earlier deferred dispatch) wins over this stale wakeup.
              if (
                Number.isFinite(refreshedEvidence.notBeforeEpoch) &&
                Math.floor(nowMs() / 1000) < refreshedEvidence.notBeforeEpoch
              ) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': durable not-before has not arrived; stale dispatch cancelled.'
                );
                return false;
              }
              if (
                refreshedEvidence.latestAttempt !== null &&
                refreshedEvidence.latestAttempt > attempt
              ) {
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': a newer retry attempt already exists; stale dispatch cancelled.'
                );
                return false;
              }
              if (
                refreshedEvidence.latestAttempt === attempt &&
                refreshedEvidence.latestMarkerAt !== null &&
                nowMs() - refreshedEvidence.latestMarkerAt < dispatchGraceMs &&
                await operationIsActive(pr.number, head, kind)
              ) {
                // The claim from the successful dispatch is already durable
                // evidence, but a prior coalescing failure can leave it plus
                // an older controller comment behind. Re-read fresh before
                // pruning so an interleaved controller write after the
                // pre-dispatch snapshot is never invisible: pruning the stale
                // snapshot could delete pre-existing comments while leaving
                // both the local claim and a concurrent claim (breaking the
                // bounded-at-one invariant), and the generic controller
                // marker alone cannot distinguish another head/kind. Keeping
                // the fresh latest preserves a concurrent writer's state;
                // the next successful upsert finishes coalescing.
                try {
                  const graceComments = await withReadFallback(client =>
                    client.paginate(
                      client.rest.issues.listComments,
                      { owner, repo, issue_number: pr.number, per_page: 100 }
                    )
                  );
                  const controllerDupes = graceComments
                    .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                    .sort((a, b) => Number(a.id) - Number(b.id));
                  for (const stale of controllerDupes.slice(0, -1)) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: stale.id,
                      });
                    } catch (deleteErr) {
                      if (deleteErr.status !== 404) throw deleteErr;
                    }
                  }
                } catch (pruneErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': dispatch-grace duplicate prune failed: ' +
                    (pruneErr.message || pruneErr)
                  );
                }
                core.info(
                  'PR #' + pr.number + ' ' + kind +
                  ': matching retry marker is inside dispatch grace; duplicate wakeup coalesced.'
                );
                return false;
              }

              const marker = retryMarker(head, kind, attempt);
              const stateSummary =
                'Automatic PR-Agent ' + kind + ' recovery for exact HEAD ' + head +
                  ' (execution ' + (attempt + 1) + '/' + maxExecutions + ').';
              // Exactly-once claim: the durable retry marker is recorded
              // BEFORE createWorkflowDispatch via a fresh createComment, so a
              // runner crash after a successful dispatch can never leave the
              // next wakeup without marker evidence inside grace (which would
              // dispatch the same attempt again: duplicate recovery
              // executions, attempt-count drift). A fresh create never touches
              // the existing controller comment's updated_at; on dispatch
              // failure the claim is deleted, so a retry that never
              // dispatched leaves timestamps untouched and is never
              // coalesced as fresh. A crash between claim and dispatch only
              // delays the replay until grace expires, then replays the same
              // bounded attempt instead of duplicating or burning a slot.
              const claimBody = controllerStateBody(
                marker,
                String(stateSummary || '').trim() + '\n\nController dispatch run: ' + String(context.runId)
              );
              let claim = null;
              try {
                const { data } = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: claimBody,
                });
                claim = data;
              } catch (err) {
                throw err;
              }
              try {
                const ref = await defaultBranch();
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: reviewWorkflow,
                  ref,
                  inputs: {
                    pr_number: String(pr.number),
                    expected_head_sha: head,
                    retry_attempt: String(attempt),
                    retry_workflow: reviewWorkflow,
                    recovery_kind: kind,
                  },
                });
                core.notice(
                  'PR #' + pr.number + ' HEAD ' + head + ': dispatched ' +
                  kind + ' recovery execution ' + (attempt + 1) + '/' + maxExecutions + '.'
                );
              } catch (err) {
                try {
                  await rollbackControllerState(
                    claim ? { comment: claim, created: true, previousBody: '' } : null
                  );
                } catch (cleanupErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': pre-dispatch claim cleanup failed: ' +
                    (cleanupErr.message || cleanupErr)
                  );
                }
                // Reset-aware deferral (#224): when the dispatch itself is
                // transiently rate-limited or fails on dispatch transport
                // (5xx/network without Retry-After/Reset headers), persist a
                // durable attempt marker so the next wakeup advances toward
                // the bounded exhaustion/hold instead of re-deriving the same
                // attempt index forever. The runner still exits; nothing sleeps.
                if (isTransientApiError(err)) {
                  const signals = extractRateLimitSignals(err);
                  const delaySeconds = resetAwareDelaySeconds({
                    attempt,
                    retryAfterSeconds: signals.retryAfterSeconds,
                    ratelimitResetEpoch: signals.ratelimitResetEpoch,
                    providerResetEpoch: signals.providerResetEpoch,
                    nowEpoch: Math.floor(nowMs() / 1000),
                    operationKey: repoFullName + '#' + pr.number + ':' + head + ':' + kind,
                  });
                  const notBefore = Math.floor(nowMs() / 1000) + delaySeconds;
                  const hasResetSignal =
                    signals.retryAfterSeconds !== undefined ||
                    signals.ratelimitResetEpoch !== undefined ||
                    signals.providerResetEpoch !== undefined;
                  if (hasResetSignal) {
                    await upsertControllerState(
                      pr.number,
                      retryMarker(head, kind, attempt, notBefore),
                      'Deferred PR-Agent ' + kind + ' recovery for exact HEAD ' + head +
                        ' until ' + new Date(notBefore * 1000).toISOString() +
                        ' (dispatch was rate-limited; reset-aware backoff ' + delaySeconds + 's).'
                    );
                    core.warning(
                      'PR #' + pr.number + ' ' + kind +
                      ': dispatch was rate-limited; deferred to ' +
                      new Date(notBefore * 1000).toISOString() +
                      ' for the scheduled safety net to redispatch.'
                    );
                  } else {
                    await upsertControllerState(
                      pr.number,
                      retryMarker(head, kind, attempt, notBefore),
                      'Deferred PR-Agent ' + kind + ' recovery for exact HEAD ' + head +
                        ' until ' + new Date(notBefore * 1000).toISOString() +
                        ' (dispatch was transiently unreachable; reset-aware backoff ' + delaySeconds + 's).'
                    );
                    core.warning(
                      'PR #' + pr.number + ' ' + kind +
                      ': dispatch was transiently unreachable; deferred to ' +
                      new Date(notBefore * 1000).toISOString() +
                      ' for the scheduled safety net to redispatch.'
                    );
                  }
                }
                throw err;
              }
              // Coalesce the pre-dispatch claim (plus any stale controller
              // comments) into the single controller comment. The claim is a
              // fresh controller-state comment, so on persistent upsert
              // failure delete only pre-existing snapshot comments older
              // than the claim and keep both the claim and any concurrent
              // write: exactly-once evidence for both attempts survives and
              // the next wakeup coalesces via grace. The dispatch already
              // succeeded, so this path warns and returns true instead of
              // throwing: a red run for a dispatched recovery would invite a
              // manual retry that duplicates the same attempt once grace
              // expires, and callers expect boolean dispatch() success.
              let stateError = null;
              for (let stateAttempt = 1; stateAttempt <= 3; stateAttempt++) {
                try {
                  await upsertControllerState(pr.number, marker, stateSummary);
                  stateError = null;
                  break;
                } catch (err) {
                  stateError = err;
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': controller state coalescing ' + stateAttempt + '/3 failed after a successful dispatch: ' +
                    (err.message || err)
                  );
                  if (stateAttempt < 3) {
                    await new Promise(resolve => setTimeout(resolve, 2000 * stateAttempt));
                  }
                }
              }
              if (stateError) {
                try {
                  const freshController = await withReadFallback(client =>
                    client.paginate(
                      client.rest.issues.listComments,
                      { owner, repo, issue_number: pr.number, per_page: 100 }
                    )
                  );
                  const snapshotIds = new Set(
                    refreshedComments.map(comment => Number(comment.id))
                  );
                  const claimId = Number(claim && claim.id);
                  const priorController = freshController
                    .filter(comment => String(comment.body || '').includes(CONTROLLER_STATE_MARKER))
                    .filter(comment => snapshotIds.has(Number(comment.id)))
                    .filter(comment => Number(comment.id) !== claimId && Number(comment.id) < claimId)
                    .sort((a, b) => Number(a.id) - Number(b.id));
                  for (const stale of priorController) {
                    try {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: stale.id,
                      });
                    } catch (deleteErr) {
                      if (deleteErr.status !== 404) throw deleteErr;
                    }
                  }
                } catch (pruneErr) {
                  core.warning(
                    'PR #' + pr.number + ' ' + kind +
                    ': post-dispatch duplicate prune failed: ' +
                    (pruneErr.message || pruneErr)
                  );
                }
                core.warning(
                  'PR #' + pr.number + ' ' + kind +
                  ': dispatched recovery execution ' + (attempt + 1) + '/' + maxExecutions +
                  ' but coalescing into one controller comment failed; ' +
                  'kept the pre-dispatch claim plus any concurrent controller write. ' +
                  'The next wakeup coalesces via dispatch grace; no duplicate dispatch was issued. ' +
                  (stateError.message || stateError)
                );
                return true;
              }
              return true;
            }

            async function exhaust(pr, head, kind, comments) {
              const marker = exhaustedMarker(head, kind);
              // Fail-closed and observable: the exhausted marker is the
              // durable record. An existing marker only counts as
              // already-exhausted when it matches this exact HEAD/kind and
              // its attempts meet the current budget (same rule as
              // parseEvidence): a legacy attempts=3 marker from an older
              // budget must not suppress the canonical attempts=10 write.
              const exactHead = String(head).toLowerCase();
              const exhaustedRes = [
                /<!--\s*continuum-lifecycle-retry-exhausted\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/gi,
                /<!--\s*continuum-pr-agent-retry-exhausted\s+head=([0-9a-f]{40,64})\s+kind=(review|repair)\s+attempts=(\d+)\s*-->/gi,
              ];
              const already = comments.some(comment => {
                if (!trustedAssociations.has(String(comment.author_association || '').toUpperCase())) {
                  return false;
                }
                const body = String(comment.body || '');
                if (body.includes(marker)) return true;
                for (const re of exhaustedRes) {
                  re.lastIndex = 0;
                  for (const match of body.matchAll(re)) {
                    if (
                      String(match[1] || '').toLowerCase() === exactHead &&
                      match[2] === kind &&
                      Number.parseInt(match[3], 10) >= maxExecutions
                    ) {
                      return true;
                    }
                  }
                }
                return false;
              });
              if (already) return;
              await upsertControllerState(
                pr.number,
                marker,
                'PR-Agent ' + kind + ' recovery exhausted the bounded ' +
                  maxExecutions + '-execution budget for exact HEAD ' + head +
                  '. A changed HEAD starts a new recovery identity.'
              );
            }

            let openPrs;
            try {
              openPrs = await withReadFallback(client =>
                client.paginate(
                  client.rest.pulls.list,
                  { owner, repo, state: 'open', per_page: 100 }
                )
              );
            } catch (err) {
              // Top-level discovery sits outside the per-PR loop, so a
              // 429/rate-limited 403 here must defer green to the next
              // wakeup (PAT budget is never spent on the retry) instead of
              // failing the whole watchdog run red. Deterministic errors
              // still throw and fail loudly.
              if (isTransientApiError(err)) {
                core.warning(
                  'Open-PR discovery hit a transient/rate-limit read; ' +
                  'deferring the whole scan to the next wakeup: ' +
                  (err.message || err)
                );
                return;
              }
              throw err;
            }
            let reviewRuns;
            try {
              reviewRuns = await listReviewRuns();
            } catch (err) {
              if (isTransientApiError(err)) {
                core.warning(
                  'Review-run discovery hit a transient/rate-limit read; ' +
                  'deferring the whole scan to the next wakeup: ' +
                  (err.message || err)
                );
                return;
              }
              throw err;
            }
            // Deterministic per-PR failures must not strand healthy PRs
            // behind one bad PR in the same run: record loudly and continue.
            let deterministicFailure = null;

            for (const pr of openPrs) {
              if (
                pr.draft ||
                !pr.head.repo ||
                pr.head.repo.full_name !== repoFullName
              ) {
                continue;
              }
              const head = String(pr.head.sha || '').toLowerCase();
              if (!head) continue;
              // One bad fetch must not abort the loop: a non-full HEAD is a
              // per-PR programming/fetch error, so skip loudly and continue
              // with healthy PRs behind it instead of throwing out of the
              // repository-global scan.
              if (!FULL_HEAD_RE.test(head)) {
                core.warning(
                  'PR #' + pr.number + ': skipping recovery for non-full HEAD; ' +
                  'producers must pass the full 40-hex (or 64-hex) commit id.'
                );
                continue;
              }

              // Per-PR/HEAD/operation lease (#224): duplicate wakeups for the
              // same transition coalesce; independent PRs never starve each
              // other behind a repository-global lock.
              if (!tryAcquireLease(pr.number, head, 'reconciler')) {
                core.info(
                  'PR #' + pr.number + ' HEAD ' + head +
                  ': already owned by this reconciliation; coalescing duplicate wakeup.'
                );
                continue;
              }
              try {
                // Latest-state reconciliation body (flat inside the loop so
                // per-PR skip stays a plain `continue`).
                const ciGreen = await exactHeadCiGreen(head);
              if (!ciGreen) {
                core.info('PR #' + pr.number + ' HEAD ' + head + ': exact-head CI not green; skip.');
                continue;
              }

              const [statuses, comments] = await Promise.all([
                withReadFallback(client =>
                  client.paginate(
                    client.rest.repos.listCommitStatusesForRef,
                    { owner, repo, ref: head, per_page: 100 }
                  )
                ),
                withReadFallback(client =>
                  client.paginate(
                    client.rest.issues.listComments,
                    { owner, repo, issue_number: pr.number, per_page: 100 }
                  )
                ),
              ]);

              const reviewStatus = latestContext(statuses, REVIEW_CONTEXT);
              const reviewRun = reviewStatus
                ? await statusRunMetadata(reviewStatus)
                : { conclusion: null, recoveryKind: null };
              let kind = 'review';
              let operationStatus = reviewStatus;
              let operationRun = reviewRun;

              if (reviewStatus?.state === 'success') {
                const reviewDescription = String(reviewStatus.description || '');
                if (/actionable/i.test(reviewDescription)) {
                  kind = 'repair';
                  operationStatus = latestContext(statuses, REPAIR_CONTEXT);
                  operationRun = operationStatus
                    ? await statusRunMetadata(operationStatus)
                    : { conclusion: null, recoveryKind: null };
                } else if (/blocking; recovery eligible/i.test(reviewDescription)) {
                  kind = 'review';
                  operationStatus = {
                    ...reviewStatus,
                    state: 'failure',
                    description: 'PR-Agent blocking review: recovery eligible',
                  };
                  operationRun = reviewRun;
                } else {
                  core.info(
                    'PR #' + pr.number + ' HEAD ' + head +
                    ': review is settled clean; recovery has nothing to do.'
                  );
                  continue;
                }
              } else if (
                reviewRun.recoveryKind === 'repair' &&
                ['pending', 'failure'].includes(
                  String(reviewStatus?.state || '').toLowerCase()
                )
              ) {
                // A repair recovery must first reconstruct canonical review/
                // improve payloads. If that prerequisite review is cancelled,
                // stale, or fails, it still belongs to the durable repair
                // operation and must consume/replay the repair budget.
                kind = 'repair';
              }

              const evidence = parseEvidence(comments, head, kind);
              const activeRun = exactActiveRun(reviewRuns, pr.number, kind, head);
              const decision = decide({
                ciGreen,
                operationStatus,
                activeRun,
                runConclusion: operationRun.conclusion,
                evidence,
              });

              core.info(
                'PR #' + pr.number + ' HEAD ' + head + ' ' + kind +
                ': recovery decision=' + decision.action +
                ' reason=' + decision.reason +
                (decision.attempt === undefined ? '' : ' attempt=' + decision.attempt)
              );

              if (decision.action === 'exhaust') {
                await exhaust(pr, head, kind, comments);
                continue;
              }
              if (decision.action !== 'dispatch') continue;

              const dispatched = await dispatch(
                pr,
                kind,
                head,
                decision.attempt,
                operationStatus
              );
              if (dispatched) {
                reviewRuns = await listReviewRuns();
              }
              } catch (err) {
                // Generic transient classification (#224): infrastructure
                // gaps retry via the next event/scheduled wakeup from latest
                // state. A deterministic per-PR failure is loud but never
                // aborts the repository-global loop: one malformed PR must
                // not strand healthy PRs behind it.
                if (isTransientApiError(err)) {
                  core.warning(
                    'PR #' + pr.number + ' HEAD ' + head +
                    ': transient reconciliation error; a later wakeup retries from latest state: ' +
                    (err.message || err)
                  );
                } else {
                  core.error(
                    'PR #' + pr.number + ' HEAD ' + head +
                    ': deterministic reconciliation error; skipping PR but continuing run: ' +
                    (err.stack || err.message || err)
                  );
                  if (!deterministicFailure) deterministicFailure = err;
                }
              }
            }
            if (deterministicFailure) {
              core.setFailed(
                'Deterministic PR-Agent reconciliation failure(s) held loudly: ' +
                (deterministicFailure.message || deterministicFailure)
              );
            }
