# Continuum bootstrap: derived from NanoDictate 64e89a3bcbab671513a933855e7495a07fac56bb.
# Release and external-review modules are disabled during bootstrap.
#
# This is a dispatch control plane on a public repository: it labels issues and
# dispatches the agent workflow. Everything it acts on is attacker-supplyable,
# so the schedule is gated before any write:
#
#   1. The trust policy computes an allowlist of issues with a read-only token.
#      An issue is on it only when a trusted actor opened it, it is not a pull
#      request, and it currently carries the canonical dispatch label from
#      .github/scripts/continuum_labels.py. The script below treats that as
#      authoritative and intersects its own filter with it, so a disagreement
#      resolves in favour of the policy.
#   2. The dispatch credential must prove it acts as a trusted account. The
#      agent workflow authorizes a dispatch on the identity that requested it,
#      so dispatching as github-actions[bot] would consume an issue reservation
#      and produce no work.
#   3. Only then does the write-capable token appear, in the reconcile step.
#
# Activation is a label, not a comment. The scheduler used to post a slash
# command on the issue, which made an untrusted text field the request that
# starts a write-capable agent.
# The request is now issue metadata that appears in the issue's own history, and
# removing it withdraws the request: the agent workflow re-reads the label before
# it is allowed to start, and this workflow stops treating the issue as
# eligible. The dispatch marker comment below is audit and retry metadata only;
# it never starts anything.
#
# Failure at any gate stops the run. It never falls back to dispatching.
name: Issue scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  issues:
    # `labeled` is the prompt path: a human handed an issue to Continuum.
    # `unlabeled` is how that hand-off is withdrawn. The rest reconcile state
    # the cron would otherwise discover up to five minutes late.
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: issue-scheduler
  cancel-in-progress: false

jobs:
  # Control plane: no write scopes at all. Everything that decides *whether*
  # to dispatch happens here, on a read-only ambient token.
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: read
      pull-requests: read

    outputs:
      trusted_issues: ${{ steps.allowlist.outputs.trusted_issues }}
      trusted_issue_count: ${{ steps.allowlist.outputs.trusted_issue_count }}
      credential_login: ${{ steps.credential.outputs.credential_login }}
      dispatch_label: ${{ steps.labels.outputs.dispatch_label }}
      in_progress_label: ${{ steps.labels.outputs.in_progress_label }}
      paused_label: ${{ steps.labels.outputs.paused_label }}
      priority_labels: ${{ steps.labels.outputs.priority_labels }}
      label_specs: ${{ steps.labels.outputs.label_specs }}

    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Default branch only, read-only token: gates run from trusted policy
          # code, never from anything an issue author contributed.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read the canonical label registry
        id: labels
        env:
          # Read-only. The registry is data, but it decides which label makes an
          # issue eligible for a write-capable run, so it is rendered here -- by
          # the trusted base-branch copy -- rather than typed into the script
          # below. A label literal in this workflow is a definition that can
          # drift from the one the trust policy authorizes.
          BASE_BRANCH: ${{ vars.AUTOMATION_BASE_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          [[ "$BASE_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || {
            echo "::error::Invalid base branch."
            exit 1
          }
          registry=.github/scripts/continuum_labels.py
          test -f "$registry"

          {
            echo "dispatch_label=$(python3 "$registry" name dispatch)"
            echo "in_progress_label=$(python3 "$registry" name in-progress)"
            echo "paused_label=$(python3 "$registry" name paused)"
            echo "priority_labels=$(python3 "$registry" list --format names | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')"
            echo "label_specs=$(python3 "$registry" provision-plan)"
          } >> "$GITHUB_OUTPUT"

          echo "Canonical dispatch label: $(python3 "$registry" name dispatch)"

      - name: List the issues the trust policy allows
        id: allowlist
        env:
          # Read-only. Deciding who may be dispatched cannot require the
          # authority the dispatch would use.
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_TRUSTED_ACTORS: ${{ vars.AUTOMATION_TRUSTED_ACTORS }}
        run: |
          set -euo pipefail
          python3 .github/scripts/trust_policy.py trusted-issues

      - name: Verify the dispatch credential
        id: credential
        env:
          # The write-capable PAT, on purpose: no read-only token can report
          # which account a credential speaks for. check-token performs a single
          # GET /user and no write, and this step fails the job when the identity
          # is not trusted.
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          AUTOMATION_TRUSTED_ACTORS: ${{ vars.AUTOMATION_TRUSTED_ACTORS }}
        run: |
          set -euo pipefail
          python3 .github/scripts/trust_policy.py check-token

  # Execution plane: the only job that may write. It runs only after the control
  # plane succeeded, and only for the issues and the identity that plane named.
  schedule:
    needs: authorize
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.credential_login != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIP_LIMIT: ${{ vars.AUTOMATION_WIP_LIMIT || '3' }}
      LEASE_MINUTES: ${{ vars.AUTOMATION_LEASE_MINUTES || '45' }}
      MAX_DISPATCH_ATTEMPTS: ${{ vars.AUTOMATION_MAX_DISPATCH_ATTEMPTS || '3' }}
      BASE_BRANCH: ${{ vars.AUTOMATION_BASE_BRANCH || 'main' }}
      # Every label name below comes from .github/scripts/continuum_labels.py via
      # the read-only job, which read the trusted base-branch copy. The
      # reconcile step is handed data, not a definition: it must be impossible
      # for it to check a different label than the trust policy authorized.
      DISPATCH_LABEL: ${{ needs.authorize.outputs.dispatch_label }}
      IN_PROGRESS_LABEL: ${{ needs.authorize.outputs.in_progress_label }}
      PAUSED_LABEL: ${{ needs.authorize.outputs.paused_label }}
      PRIORITY_LABELS: ${{ needs.authorize.outputs.priority_labels }}
      LABEL_SPECS: ${{ needs.authorize.outputs.label_specs }}

    steps:
      - name: Reconcile state and dispatch ready issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Both gates, as data from the control plane. Step environment belongs
          # alongside `with`; nesting this map under action inputs makes the
          # workflow invalid before any job can be scheduled.
          TRUSTED_ISSUES: ${{ needs.authorize.outputs.trusted_issues }}
          CREDENTIAL_LOGIN: ${{ needs.authorize.outputs.credential_login }}
        with:
          # TAP_PAT is required because the agent workflow authorizes a dispatch
          # on the identity that requested it, and github.token acts as
          # github-actions[bot]. It also makes issue-state mutations and comments
          # created here visible as normal owner actions.
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = owner + '/' + repo;

            // Both gates must have produced a result. An empty allowlist is a
            // legitimate outcome (nothing is trusted right now) and is not an
            // error, but a *missing* gate result is a failure: the job must not
            // reach a write with an unverified schedule.
            if (process.env.CREDENTIAL_LOGIN === undefined) {
              throw new Error('Dispatch credential was not verified; refusing to reconcile.');
            }
            const trustedIssueNumbers = new Set(
              (process.env.TRUSTED_ISSUES || '')
                .split(',')
                .map(value => value.trim())
                .filter(value => value !== '')
            );
            core.notice(
              'Trust policy allowed ' + trustedIssueNumbers.size +
              ' open issue(s); dispatch credential verified as @' +
              process.env.CREDENTIAL_LOGIN + '.'
            );

            function positiveInt(name, fallback) {
              const value = Number.parseInt(process.env[name] || String(fallback), 10);
              if (!Number.isInteger(value) || value < 1) {
                throw new Error('Invalid ' + name + ': ' + process.env[name]);
              }
              return value;
            }

            const wipLimit = positiveInt('WIP_LIMIT', 3);
            const leaseMinutes = positiveInt('LEASE_MINUTES', 45);
            const maxDispatchAttempts = positiveInt('MAX_DISPATCH_ATTEMPTS', 3);
            const leaseMs = leaseMinutes * 60 * 1000;

            // The canonical label names, from the registry. Nothing below may
            // hard-code one: if these are missing the run must fail rather than
            // fall back to a guessed name, because a guessed name would
            // silently activate a different set of issues than the trust policy
            // authorized.
            const dispatchLabel = (process.env.DISPATCH_LABEL || '').trim();
            const inProgressLabel = (process.env.IN_PROGRESS_LABEL || '').trim();
            const pausedLabel = (process.env.PAUSED_LABEL || '').trim();
            const priorityOrder = (process.env.PRIORITY_LABELS || '')
              .split(',')
              .map(name => name.trim())
              .filter(name => name !== '');
            for (const [name, value] of Object.entries({
              DISPATCH_LABEL: dispatchLabel,
              IN_PROGRESS_LABEL: inProgressLabel,
              PAUSED_LABEL: pausedLabel,
            })) {
              if (!/^[A-Za-z0-9][A-Za-z0-9._:/-]{0,79}$/.test(value)) {
                throw new Error('Invalid ' + name + ': ' + JSON.stringify(value));
              }
            }
            if (priorityOrder.length === 0) {
              throw new Error('PRIORITY_LABELS is empty; refusing to reconcile.');
            }
            const priorityRank = new Map(
              priorityOrder.map((name, index) => [name, index])
            );

            // Audit and retry metadata. This comment is what the repair
            // controller counts semantic attempts against and what the lease
            // below measures; it is not an activation signal.
            const dispatchMarker = '<!-- issue-scheduler-dispatch -->';
            const infraRetryPrefix = '<!-- continuum-infra-retry:';

            let labelSpecs;
            try {
              labelSpecs = JSON.parse(process.env.LABEL_SPECS || '[]');
            } catch (err) {
              throw new Error('LABEL_SPECS is not valid JSON: ' + err.message);
            }
            if (!Array.isArray(labelSpecs) || labelSpecs.length === 0) {
              throw new Error('LABEL_SPECS is empty; refusing to provision nothing.');
            }

            for (const spec of labelSpecs) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...spec });
              } catch (err) {
                if (err.status !== 422) throw err; // already exists
              }
            }

            const labelsByIssue = new Map();

            function rememberIssue(issue) {
              labelsByIssue.set(
                issue.number,
                new Set(
                  (issue.labels || []).map(label =>
                    typeof label === 'string' ? label : label.name
                  )
                )
              );
            }

            // Label equality is case-insensitive: the API folds case, so a
            // scheduler that compared raw names could disagree with the trust
            // policy over a difference the API does not consider real.
            function hasLabel(issueNumber, name) {
              const labels = labelsByIssue.get(issueNumber);
              if (!labels) return false;
              const wanted = name.toLowerCase();
              for (const label of labels) {
                if (typeof label === 'string' && label.toLowerCase() === wanted) {
                  return true;
                }
              }
              return false;
            }

            function labelNames(issue) {
              return (issue.labels || []).map(label =>
                typeof label === 'string' ? label : label.name
              ).filter(name => typeof name === 'string');
            }

            async function addLabel(issueNumber, name) {
              if (hasLabel(issueNumber, name)) return;
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [name],
              });
              const labels = labelsByIssue.get(issueNumber);
              if (labels) labels.add(name);
            }

            async function removeLabel(issueNumber, name) {
              const labels = labelsByIssue.get(issueNumber);
              if (labels && !hasLabel(issueNumber, name)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              if (!labels) return;
              // Drop every tracked spelling of the name. Removing only the
              // exact string would leave `Continuum:Dispatch` in the set and
              // let a removed label read as present for the rest of the run.
              const wanted = name.toLowerCase();
              for (const label of [...labels]) {
                if (label.toLowerCase() === wanted) labels.delete(label);
              }
            }

            async function pauseIssue(issueNumber, reason) {
              await removeLabel(issueNumber, inProgressLabel);
              await addLabel(issueNumber, pausedLabel);
              core.warning('Paused issue #' + issueNumber + ': ' + reason);
            }

            async function retryEpochStartedAt(issueNumber) {
              const events = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                {owner, repo, issue_number: issueNumber, per_page: 100}
              );
              const resets = events
                .filter(event =>
                  event.event === 'unlabeled' &&
                  event.label?.name === pausedLabel &&
                  event.created_at
                )
                .map(event => new Date(event.created_at).getTime())
                .filter(Number.isFinite);
              return resets.length ? Math.max(...resets) : 0;
            }

            async function latestInfrastructureRetry(issueNumber) {
              const epochStartedAt = await retryEpochStartedAt(issueNumber);
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: issueNumber, per_page: 100}
              );
              let latest = null;
              for (const comment of comments) {
                const createdAt = new Date(comment.created_at).getTime();
                if (!Number.isFinite(createdAt) || createdAt < epochStartedAt) continue;
                const body = comment.body || '';
                if (!body.includes(infraRetryPrefix)) continue;
                const match = body.match(
                  /<!-- continuum-infra-retry:\s*attempt=(\d+)\s+next_retry_at=([^\s]+)\s+code=([A-Za-z0-9_.-]+)\s+run=(\d+)\s*-->/
                );
                if (!match) continue;
                const nextRetryAt = new Date(match[2]).getTime();
                if (!Number.isFinite(nextRetryAt)) continue;
                const candidate = {
                  attempt: Number(match[1]),
                  nextRetryAt,
                  nextRetryAtText: match[2],
                  code: match[3],
                  runId: Number(match[4]),
                  createdAt,
                };
                if (!latest || candidate.createdAt > latest.createdAt) latest = candidate;
              }
              return latest;
            }

            // Issues completed earlier in this run. The eligible list was read
            // before those reconciliations, so without this an issue closed as
            // merged would still look eligible below: it would take a fresh
            // reservation and be dispatched again in the same run.
            const completedIssues = new Set();

            // A closed OpenCode PR is authoritative:
            // - merged means the implementation is done -> close the issue;
            // - closed without merge means the attempt was rejected/stopped ->
            //   pause automation instead of looping and reopening PRs forever.
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr?.head?.repo?.full_name === repoFullName) {
                const match = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
                if (match) {
                  const issueNumber = Number(match[1]);
                  try {
                    const response = await github.rest.issues.get({
                      owner,
                      repo,
                      issue_number: issueNumber,
                    });
                    rememberIssue(response.data);

                    if (pr.merged) {
                      completedIssues.add(issueNumber);
                      await removeLabel(issueNumber, inProgressLabel);
                      await removeLabel(issueNumber, pausedLabel);
                      if (response.data.state !== 'closed') {
                        await github.rest.issues.update({
                          owner,
                          repo,
                          issue_number: issueNumber,
                          state: 'closed',
                          state_reason: 'completed',
                        });
                      }
                      core.notice(
                        'Merged OpenCode PR #' + pr.number +
                        ' completed issue #' + issueNumber + '.'
                      );
                    } else {
                      await pauseIssue(
                        issueNumber,
                        'OpenCode PR #' + pr.number + ' was closed without merge.'
                      );
                    }
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }
            }

            let issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            // Intersect with the policy allowlist. The policy is authoritative:
            // an issue it did not name is ineligible no matter what this
            // workflow's own author check concluded. It requires the canonical
            // dispatch label too, so the two sides read the same signal.
            issues = issues.filter(issue =>
              !issue.pull_request &&
              issue.user?.login === owner &&
              trustedIssueNumbers.has(String(issue.number)) &&
              labelNames(issue).some(
                name => name.toLowerCase() === dispatchLabel.toLowerCase()
              )
            );
            core.notice(
              'Public-repository bootstrap trust policy: ' + issues.length +
              ' issue(s) are owner-authored, policy-trusted, and labelled ' +
              dispatchLabel + '.'
            );
            for (const issue of issues) rememberIssue(issue);

            // One-time migration for the current backlog only. After this,
            // priority labels are the source of truth. No default priority is
            // assigned: an unprioritized issue is valid and sorts after P2.
            for (const issue of issues) {
              const labels = labelsByIssue.get(issue.number);
              const currentPriorities = [...labels].filter(name =>
                priorityRank.has(name)
              );
              if (currentPriorities.length !== 0) continue;

              const match = issue.title.match(/^P([0-2]):\s+/i);
              if (!match) continue;

              const priority = ('priority:p' + match[1]).toLowerCase();
              const cleanTitle = issue.title.replace(/^P[0-2]:\s+/i, '');

              await addLabel(issue.number, priority);
              if (cleanTitle !== issue.title) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  title: cleanTitle,
                });
                issue.title = cleanTitle;
              }

              core.notice(
                'Migrated issue #' + issue.number + ' to ' + priority + '.'
              );
            }

            // Read every OpenCode issue PR, not just open ones. This lets the
            // cron run reconcile missed PR-close events from current repository
            // state rather than depending on a permanent dispatch marker.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            const openPrIssues = new Set();
            const latestPrByIssue = new Map();

            for (const pr of pulls) {
              if (pr.head?.repo?.full_name !== repoFullName) continue;
              const match = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (!match) continue;

              const issueNumber = Number(match[1]);
              const previous = latestPrByIssue.get(issueNumber);
              if (!previous || pr.number > previous.number) {
                latestPrByIssue.set(issueNumber, pr);
              }
              if (pr.state === 'open') openPrIssues.add(issueNumber);
            }

            const issueByNumber = new Map(issues.map(issue => [issue.number, issue]));
            const activeIssueNumbers = new Set();

            // An open OpenCode PR is the strongest "in progress" signal. Keep
            // the visible label synchronized with that fact.
            for (const issueNumber of openPrIssues) {
              activeIssueNumbers.add(issueNumber);
              if (issueByNumber.has(issueNumber)) {
                await addLabel(issueNumber, inProgressLabel);
                await removeLabel(issueNumber, pausedLabel);
              }
            }

            // Reconcile reservations for the gap between the dispatch and the
            // PR appearing. The dispatch marker comment is audit/timing
            // metadata only; it never blocks an issue forever.
            //
            // Reserved issues are reconciled whether or not they are still
            // eligible. An issue whose dispatch label was removed mid-run
            // leaves the eligible set above, and if this loop only saw eligible
            // issues its reservation would never be released -- a withdrawn
            // request would hold a WIP slot for ever.
            const reservedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'open',
                labels: inProgressLabel,
                per_page: 100,
              }
            );
            for (const issue of reservedIssues) rememberIssue(issue);
            core.notice(
              reservedIssues.length + ' issue(s) hold a reservation.'
            );

            for (const issue of reservedIssues) {
              const issueNumber = issue.number;
              if (openPrIssues.has(issueNumber)) continue;

              const labels = labelsByIssue.get(issueNumber);
              if (!labels.has(inProgressLabel)) continue;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                }
              );
              const epochStartedAt = await retryEpochStartedAt(issueNumber);
              const dispatches = comments
                .filter(comment => (comment.body || '').includes(dispatchMarker))
                .filter(comment =>
                  new Date(comment.created_at).getTime() >= epochStartedAt
                )
                .sort(
                  (a, b) =>
                    new Date(a.created_at).getTime() -
                    new Date(b.created_at).getTime()
                );
              const latestDispatch = dispatches.at(-1);
              const latestPr = latestPrByIssue.get(issueNumber);
              const latestDispatchAt = latestDispatch
                ? new Date(latestDispatch.created_at).getTime()
                : null;

              if (!trustedIssueNumbers.has(String(issueNumber))) {
                // Withdrawn. Removal is a withdrawal, not a cancellation: a
                // dispatch already in flight has already passed the trust
                // policy, so nothing can recall it, and it will publish what it
                // produced. Holding the reservation until the lease expires is
                // what keeps a withdrawn issue from freeing a WIP slot while
                // its run is still using one.
                //
                // What the withdrawal does guarantee is that no *new* work
                // starts: the issue is off the allowlist, so it is not a
                // candidate below, and a lease-expired release stops any retry.
                if (latestDispatchAt !== null && Date.now() - latestDispatchAt < leaseMs) {
                  activeIssueNumbers.add(issueNumber);
                  core.notice(
                    'Issue #' + issueNumber + ' was withdrawn; its run holds ' +
                    'the reservation until the lease expires.'
                  );
                } else {
                  await removeLabel(issueNumber, inProgressLabel);
                  core.notice(
                    'Released the reservation on issue #' + issueNumber +
                    ': it is no longer labelled ' + dispatchLabel +
                    ', and no run is holding it.'
                  );
                }
                continue;
              }

              // If a PR from the current/latest dispatch already completed but
              // its event was missed, reconcile it here.
              if (latestDispatch && latestPr) {
                const dispatchAt = new Date(latestDispatch.created_at).getTime();
                const prAt = new Date(latestPr.created_at).getTime();
                if (prAt >= dispatchAt && latestPr.state === 'closed') {
                  if (latestPr.merged_at) {
                    completedIssues.add(issueNumber);
                    await removeLabel(issueNumber, inProgressLabel);
                    await removeLabel(issueNumber, pausedLabel);
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issueNumber,
                      state: 'closed',
                      state_reason: 'completed',
                    });
                    core.notice(
                      'Reconciled merged PR #' + latestPr.number +
                      ' -> completed issue #' + issueNumber + '.'
                    );
                  } else {
                    await pauseIssue(
                      issueNumber,
                      'PR #' + latestPr.number + ' closed without merge.'
                    );
                  }
                  continue;
                }
              }

              if (!latestDispatch) {
                // A stale/manual reservation with no evidence of a dispatch is
                // safe to release immediately.
                await removeLabel(issueNumber, inProgressLabel);
                core.warning(
                  'Released stale reservation on issue #' + issueNumber +
                  ': no scheduler dispatch record exists.'
                );
                continue;
              }

              if (Date.now() - latestDispatchAt < leaseMs) {
                activeIssueNumbers.add(issueNumber);
                continue;
              }

              await removeLabel(issueNumber, inProgressLabel);

              if (dispatches.length >= maxDispatchAttempts) {
                await addLabel(issueNumber, pausedLabel);
                core.warning(
                  'Issue #' + issueNumber + ' produced no OpenCode PR after ' +
                  dispatches.length + ' dispatch attempt(s); automation paused.'
                );
              } else {
                core.warning(
                  'Lease expired for issue #' + issueNumber +
                  '; it is eligible for an automatic retry.'
                );
              }
            }

            const freeSlots = Math.max(0, wipLimit - activeIssueNumbers.size);
            core.notice(
              'WIP: ' + activeIssueNumbers.size + '/' + wipLimit +
              '; free slots: ' + freeSlots +
              '; active issues: ' +
              ([...activeIssueNumbers]
                .sort((a, b) => a - b)
                .map(n => '#' + n)
                .join(', ') || 'none') + '.'
            );

            if (freeSlots === 0) {
              core.info('No free WIP slots; nothing will be dispatched.');
              return;
            }

            const candidates = [];
            for (const issue of issues) {
              if (activeIssueNumbers.has(issue.number)) continue;
              if (completedIssues.has(issue.number)) {
                core.info(
                  'Skipping #' + issue.number + ': completed earlier in this run.'
                );
                continue;
              }

              // The hand-off is the label, re-checked here against the live
              // issue rather than assumed from the filter above. Between the
              // read and here a human may have withdrawn it; the trust policy
              // checks again in the agent workflow, so this is the second of
              // three gates rather than the only one.
              if (!labelNames(issue).some(
                name => name.toLowerCase() === dispatchLabel.toLowerCase()
              )) {
                core.info(
                  'Skipping #' + issue.number + ': ' + dispatchLabel +
                  ' is no longer on it.'
                );
                continue;
              }

              const labels = labelsByIssue.get(issue.number);
              if (hasLabel(issue.number, pausedLabel)) {
                core.info('Skipping #' + issue.number + ': automation is paused.');
                continue;
              }

              const infraRetry = await latestInfrastructureRetry(issue.number);
              if (infraRetry && Date.now() < infraRetry.nextRetryAt) {
                core.info(
                  'Skipping #' + issue.number + ': infrastructure retry ' +
                  infraRetry.attempt + '/8 is not due until ' +
                  infraRetry.nextRetryAtText + ' (' + infraRetry.code + ').'
                );
                continue;
              }

              const priorities = [...labels]
                .filter(name => priorityRank.has(name))
                .sort(
                  (a, b) => priorityRank.get(a) - priorityRank.get(b)
                );

              // Multiple priority labels are not a reason to deadlock an issue.
              // Highest priority wins deterministically; the anomaly is logged.
              const priority = priorities[0] || null;
              const rank = priority === null ? priorityOrder.length : priorityRank.get(priority);
              if (priorities.length > 1) {
                core.warning(
                  'Issue #' + issue.number + ' has multiple priority labels (' +
                  priorities.join(', ') + '); using ' + priority + '.'
                );
              }

              candidates.push({ issue, priority, rank });
            }

            candidates.sort(
              (a, b) =>
                a.rank - b.rank ||
                a.issue.number - b.issue.number
            );

            const selected = [];
            for (const candidate of candidates) {
              if (selected.length >= freeSlots) break;

              const issue = candidate.issue;
              const blockers = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  headers: {
                    'X-GitHub-Api-Version': '2026-03-10',
                  },
                }
              );
              const openBlockers = blockers.filter(
                blocker => blocker.state === 'open'
              );
              if (openBlockers.length > 0) {
                core.info(
                  'Skipping #' + issue.number + ': blocked by ' +
                  openBlockers.map(blocker => '#' + blocker.number).join(', ') + '.'
                );
                continue;
              }

              selected.push(candidate);
            }

            if (selected.length === 0) {
              core.notice('No eligible unblocked issues are ready.');
              return;
            }

            // The credential was already resolved to a trusted account by the
            // check-token gate, so reaching here means the dispatch is
            // requested by an identity the agent workflow's trust policy
            // accepts. A github.token would fail that gate.
            core.notice(
              'Dispatching as @' + process.env.CREDENTIAL_LOGIN + '.'
            );

            // The dispatch runs a workflow file from this ref, so it is the one
            // value here that must not be taken from a payload. It comes from a
            // repository variable and is pattern-checked before use.
            const dispatchRef = (process.env.BASE_BRANCH || '').trim();
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(dispatchRef)) {
              throw new Error('Invalid BASE_BRANCH: ' + JSON.stringify(dispatchRef));
            }

            core.notice(
              'Selected: ' +
              selected
                .map(item =>
                  '#' + item.issue.number + ' (' +
                  (item.priority || 'no priority') + ')'
                )
                .join(', ') + '.'
            );

            for (const { issue, priority } of selected) {
              // The in-progress label is a short lease/reservation for the
              // window between this dispatch and the pull request appearing.
              // It is rolled back immediately if the dispatch fails, expires
              // automatically if no PR appears, and is reconciled from PR
              // state on every later run.
              await addLabel(issue.number, inProgressLabel);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'opencode.yml',
                  ref: dispatchRef,
                  inputs: {
                    mode: 'issue',
                    issue_number: String(issue.number),
                    // Repair inputs are sent empty rather than omitted: the
                    // agent workflow's dispatch shape requires a
                    // repair-shaped target for every other mode, and an absent
                    // input is indistinguishable from one that was forgotten.
                    pr_number: '',
                    head_ref: '',
                    run_id: '',
                    rungs_ruled_out: '',
                  },
                });
              } catch (err) {
                await removeLabel(issue.number, inProgressLabel);
                throw err;
              }

              // Audit and retry metadata only. Written after the dispatch
              // succeeded so a marker never claims work that was not started.
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  dispatchMarker,
                  'Automatically dispatched by the issue scheduler (' +
                    (priority || 'no explicit priority') + ').',
                ].join('\n'),
              });

              core.notice(
                'Dispatched issue #' + issue.number + ' (' +
                (priority || 'no priority') + ') to OpenCode.'
              );
            }
