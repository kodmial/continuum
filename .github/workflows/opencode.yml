name: OpenCode agent

# The watchdog and the scheduler both need to find a run without relying on
# issue titles, which are not unique among open issues. An issue_comment run
# and an `issue`-mode dispatch therefore report the issue number; the repair
# modes report the pull request number.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      inputs.recovery_identity &&
      format('OpenCode 429 recovery {0} gen {1}',
        fromJSON(inputs.recovery_identity).recovery_operation_id,
        fromJSON(inputs.recovery_identity).recovery_generation) ||
      github.event_name == 'issue_comment' &&
      format('OpenCode issue #{0}', github.event.issue.number) ||
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'issue' &&
      format('OpenCode issue #{0}', inputs.issue_number) ||
      github.event_name == 'workflow_dispatch' &&
      format('OpenCode repair PR #{0}', inputs.pr_number) ||
      github.event_name == 'pull_request_review_comment' &&
      format('OpenCode review PR #{0}', github.event.pull_request.number) ||
      'OpenCode agent' }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode"
        required: true
        type: choice
        options:
          - coderabbit-fix
          - resolve-conflict
          - ci-fix
          - issue
          - qualification
      issue_number:
        description: "Issue number, for context in issue_comment runs"
        required: false
        type: string
      pr_number:
        description: "Pull request number"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch"
        required: false
        type: string
      review_id:
        description: "Source CodeRabbit review id"
        required: false
        type: string
      unresolved_items_json:
        description: "Optional exact CodeRabbit UNRESOLVED batch supplied by the provider adapter"
        required: false
        type: string
      run_id:
        description: "Source failed workflow run id"
        required: false
        type: string
      ci_workflow_id:
        description: "CI workflow file to re-run after a ci-fix or an issue implementation"
        required: false
        type: string
      base_ref:
        description: "Branch the issue mode bases its implementation branch on"
        required: false
        type: string
      knowledge_protocol_path:
        description: "Knowledge-handoff protocol the issue mode must read"
        required: false
        type: string
      knowledge_records_dir:
        description: "Directory the issue mode writes its run record into"
        required: false
        type: string
      issue_commit_prefix:
        description: "Prefix of the task commit the issue mode creates"
        required: false
        type: string
      conflict_strategy:
        description: "How resolve-conflict settles a conflict"
        required: false
        type: choice
        default: merge
        options:
          - merge
          - checkout
      dispatch_marker:
        description: "Dispatch marker this repository's scheduler writes"
        required: false
        type: string
      in_progress_label:
        description: "Reservation label this repository's scheduler uses"
        required: false
        type: string
      pause_marker:
        description: "Pause label this repository's scheduler uses"
        required: false
        type: string
      max_dispatch_attempts:
        description: "Dispatch attempts before pausing the issue"
        required: false
        type: string
      pause_on_failure:
        description: "Allow terminal automation pause after failed dispatches"
        required: false
        type: string
      ci_repair_label:
        description: "CI repair in-flight lock label"
        required: false
        type: string
      packaging_repair_label:
        description: "Packaging repair in-flight lock label"
        required: false
        type: string
      timeout_minutes:
        description: "Maximum OpenCode job runtime in minutes"
        required: false
        type: string
      capability_number:
        description: "Capability issue number for qualification mode"
        required: false
        type: string
      qualification_number:
        description: "Qualification issue number for qualification mode"
        required: false
        type: string
      required_sha:
        description: "Exact main SHA a qualification run must test"
        required: false
        type: string
      recovery_identity:
        description: >-
          Packed 429 recovery identity JSON for a fresh-VM resumption
          (operation id + checkpoint ref/SHA + stage + generation). Empty
          means this is not a 429 resumption. One packed input (instead of
          one per recovery field) keeps this workflow_dispatch at or below
          the 25-input limit; the call below unpacks it into the reusable
          workflow's explicit recovery inputs.
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    # /oc-repair is handled by owner-coderabbit-repair, not interactive github run.
    if: >-
      github.event_name != 'issue_comment' ||
      !startsWith(github.event.comment.body, '/oc-repair ')
    uses: ./.github/workflows/continuum-opencode.yml
    secrets: inherit
    with:
      continuum_ref: main
      mode: "${{ inputs.mode }}"
      issue_number: "${{ inputs.issue_number }}"
      pr_number: "${{ inputs.pr_number }}"
      head_ref: "${{ inputs.head_ref }}"
      review_id: "${{ inputs.review_id }}"
      unresolved_items_json: "${{ inputs.unresolved_items_json }}"
      run_id: "${{ inputs.run_id }}"
      ci_workflow_id: "${{ inputs.ci_workflow_id }}"
      base_ref: "${{ inputs.base_ref }}"
      knowledge_protocol_path: "${{ inputs.knowledge_protocol_path }}"
      knowledge_records_dir: "${{ inputs.knowledge_records_dir }}"
      issue_commit_prefix: "${{ inputs.issue_commit_prefix }}"
      # `conflict_strategy` is a choice input in the callee, so a non-dispatch
      # event (issue_comment, pull_request_review) that leaves it unset must
      # still pass a listed value rather than an empty string.
      conflict_strategy: "${{ inputs.conflict_strategy || 'merge' }}"
      dispatch_marker: "${{ inputs.dispatch_marker }}"
      in_progress_label: "${{ inputs.in_progress_label }}"
      pause_marker: "${{ inputs.pause_marker }}"
      max_dispatch_attempts: "${{ inputs.max_dispatch_attempts }}"
      pause_on_failure: "${{ inputs.pause_on_failure }}"
      ci_repair_label: "${{ inputs.ci_repair_label }}"
      packaging_repair_label: "${{ inputs.packaging_repair_label }}"
      timeout_minutes: "${{ inputs.timeout_minutes }}"
      capability_number: "${{ inputs.capability_number }}"
      qualification_number: "${{ inputs.qualification_number }}"
      required_sha: "${{ inputs.required_sha }}"
      # kodmial/continuum#290/#350: the watchdog packs the explicit 429
      # recovery identity into the single recovery_identity dispatch input
      # above, and this local caller unpacks it into the reusable workflow's
      # explicit recovery inputs exactly like the installed consumer stub.
      recovery_operation_id: "${{ inputs.recovery_identity && fromJSON(inputs.recovery_identity).recovery_operation_id || '' }}"
      recovery_checkpoint_ref: "${{ inputs.recovery_identity && fromJSON(inputs.recovery_identity).recovery_checkpoint_ref || '' }}"
      recovery_checkpoint_sha: "${{ inputs.recovery_identity && fromJSON(inputs.recovery_identity).recovery_checkpoint_sha || '' }}"
      recovery_stage: "${{ inputs.recovery_identity && fromJSON(inputs.recovery_identity).recovery_stage || '' }}"
      recovery_generation: "${{ inputs.recovery_identity && fromJSON(inputs.recovery_identity).recovery_generation || '' }}"

  # Owner-authenticated escape hatch for an already-reviewed PR whose
  # no-auto-merge hold suppresses the merge controller's reconciliation.
  # It starts the canonical repair only; it NEVER merges or removes the hold.
  owner-coderabbit-repair:
    name: Dispatch existing CodeRabbit findings (owner)
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.actor == github.repository_owner &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/oc-repair ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Validate exact review and dispatch canonical repair from main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          OWNER_REPAIR_COMMAND: ${{ github.event.comment.body }}
          OWNER_REPAIR_PR: ${{ github.event.issue.number }}
          REPAIR_PAT: ${{ secrets.TAP_PAT }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const command = String(process.env.OWNER_REPAIR_COMMAND || '').trim();
            const parsed = /^\/oc-repair ([1-9][0-9]*)$/.exec(command);
            const number = Number(process.env.OWNER_REPAIR_PR);
            if (!parsed || !Number.isSafeInteger(number) || number < 1 ||
                !process.env.REPAIR_PAT) {
              throw new Error('Invalid owner repair request or missing dispatch credentials.');
            }
            const reviewId = Number(parsed[1]);
            if (!Number.isSafeInteger(reviewId)) throw new Error('Invalid CodeRabbit review ID.');
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: number,
            });
            if (pr.state !== 'open' || pr.draft ||
                pr.head?.repo?.full_name !== `${owner}/${repo}` ||
                !/^[A-Za-z0-9._/-]+$/.test(pr.head.ref) ||
                pr.head.ref.includes('..') ||
                pr.labels.some(label => ['automation:blocked', 'automation:paused'].includes(label.name))) {
              throw new Error('PR is not eligible for owner-requested code repair.');
            }
            const { data: review } = await github.rest.pulls.getReview({
              owner, repo, pull_number: number, review_id: reviewId,
            });
            if (review.user?.login !== 'coderabbitai[bot]' ||
                review.commit_id !== pr.head.sha ||
                !['CHANGES_REQUESTED', 'COMMENTED'].includes(review.state)) {
              throw new Error('CodeRabbit review identity is stale, non-actionable, or untrusted.');
            }
            const findings = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const actionable = findings.filter(item =>
              item.pull_request_review_id === reviewId &&
              item.user?.login === 'coderabbitai[bot]' &&
              item.in_reply_to_id == null
            );
            if (!actionable.length) {
              throw new Error('CodeRabbit review has no actionable original inline findings.');
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'opencode.yml',
              event: 'workflow_dispatch', per_page: 100,
            });
            if (runs.workflow_runs.some(run =>
                run.status !== 'completed' &&
                run.display_title === `OpenCode repair PR #${number}`)) {
              core.notice('Canonical CodeRabbit fix is already in progress; suppressing duplicate.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'opencode.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                mode: 'coderabbit-fix',
                pr_number: String(number),
                head_ref: pr.head.ref,
                review_id: String(reviewId),
              },
            });
            core.notice(
              `Dispatched canonical coderabbit-fix for PR #${number} ` +
              `at exact HEAD ${pr.head.sha}; review ${reviewId}; ` +
              `${actionable.length} original inline findings. no-auto-merge unchanged.`
            );
