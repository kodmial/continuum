name: Continuum toolchain cache qualification
on:
  pull_request:
    paths:
      - .github/actions/agent-toolchain/**
      - .github/workflows/continuum-toolchain-cache-qualification.yml
      - tests/test_agent_toolchain_cache.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain-cache:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate toolchain contract
        run: python3 -m unittest discover -s tests -p 'test_agent_toolchain_cache.py' -v
      - name: Restore and validate cached OpenCode and PR-Agent binaries
        id: toolchain
        uses: kodmial/continuum/.github/actions/agent-toolchain@work-lock-68-runtime-cache-20261019
        with:
          components: both
      - name: Verify actual runtime tools
        shell: bash
        run: |
          set -euo pipefail
          opencode --version
          pr-agent --version
          echo "Cache validated warm hit: \${{ steps.toolchain.outputs.cache-hit }}"
          echo "OpenCode: \${{ steps.toolchain.outputs.runtime-version }}"
