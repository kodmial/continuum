name: Work Lock 21 stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/work-lock-21-delete-stale-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete audited stale Work Lock 15 branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=("work-lock-15-child-run-cleanup" "work-lock-15-child-validation-role" "work-lock-15-cleanup-run-name" "work-lock-15-idempotent-main-ref" "work-lock-15-installer-canonical-main" "work-lock-15-representative-idempotency" "work-lock-15-stabilize-adoption")
          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
