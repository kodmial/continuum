name: PR-Agent recovery dogfood

on:
  workflow_dispatch:
    inputs:
      target_child_id:
        description: Opaque verified child id for delegated PR-Agent recovery
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows:
      - CI
      - PR Agent (OpenCode-backed)
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    # Automatic PR-Agent callers skip in verified child mode (issue #244):
    # the parent is the only automatic execution plane for child PR-Agent.
    # An explicit owner workflow_dispatch still reaches the reusable, which
    # fail-safes there. Local/non-child behavior is unchanged.
    if: vars.CONTINUUM_ROLE != 'child' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/continuum-pr-agent-recovery.yml
    secrets: inherit
    with:
      continuum_ref: main
      # Bare passthrough: schedule, pull_request_target, and workflow_run
      # carry no dispatch inputs, so those runs pass empty here and the
      # reusable falls through to vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID
      # (then to the execution repository).
      target_child_id: "${{ inputs.target_child_id }}"
      review_workflow: pr-agent.yml
