name: Remove PR-Agent from MVP DAG

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  clean:
    if: github.event.head_commit.message == 'remove-pr-agent-from-mvp-dag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove dependency
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "repos/$GITHUB_REPOSITORY/issues/30/dependencies/blocked_by/5615046811" >/dev/null || true
