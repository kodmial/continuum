name: Continuum automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17,47 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  status:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - CI
      - OpenCode agent
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  scheduler:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode'))) ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/opencode.yml')
    uses: ./.github/workflows/continuum-issue-scheduler.yml
    secrets: inherit
    with:
      continuum_ref: main
      opencode_workflow_name: 'OpenCode agent'
      opencode_workflow_path: '.github/workflows/opencode.yml'

  watchdog:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/opencode.yml'
    uses: ./.github/workflows/continuum-opencode-watchdog.yml
    secrets: inherit
    with:
      continuum_ref: main
      watched_workflow: 'OpenCode agent'

  repair:
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/ci.yml')
    uses: ./.github/workflows/continuum-opencode-repair.yml
    secrets: inherit
    with:
      continuum_ref: main
      auto_merge_workflow: 'automation.yml'
      opencode_workflow: 'opencode.yml'

  auto-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'status' ||
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.path == '.github/workflows/ci.yml')
    uses: ./.github/workflows/continuum-auto-merge.yml
    secrets: inherit
    with:
      continuum_ref: main
      opencode_workflow: 'opencode.yml'
