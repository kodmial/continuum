name: Continuum automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17,47 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  status:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - CI
      - OpenCode agent
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  scheduler:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode'))) ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'OpenCode agent')
    uses: ./.github/workflows/continuum-issue-scheduler.yml
    secrets: inherit
    with:
      continuum_ref: main
      opencode_workflow_name: 'OpenCode agent'
      opencode_workflow_path: '.github/workflows/opencode.yml'

  watchdog:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'OpenCode agent'
    uses: ./.github/workflows/continuum-opencode-watchdog.yml
    secrets: inherit
    with:
      continuum_ref: main
      watched_workflow: 'OpenCode agent'

  repair:
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI')
    uses: ./.github/workflows/continuum-opencode-repair.yml
    secrets: inherit
    with:
      continuum_ref: main
      auto_merge_workflow: 'automation.yml'
      opencode_workflow: 'opencode.yml'

  auto-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'status' ||
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'CI')
    uses: ./.github/workflows/continuum-auto-merge.yml
    secrets: inherit
    with:
      continuum_ref: main

  # Temporary Work Lock #19 verification harness. It exists only to create a
  # bot-authored disposable PR so the repository owner can submit a real GitHub
  # approval. It is removed after the live review/merge proof is recorded.
  work-lock-19-create-review-canary:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/work-lock-19-create-review-canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Temporarily allow GitHub Actions to create the canary PR
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/work-lock-19-actions-permissions.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" > "$STATE_FILE"
          DEFAULT_PERMISSION="$(jq -r '.default_workflow_permissions' "$STATE_FILE")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/permissions/workflow"             -f default_workflow_permissions="$DEFAULT_PERMISSION"             -F can_approve_pull_request_reviews=true

      - name: Create bot-authored review canary PR
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BRANCH="work-lock-19-review-canary-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          cat > docs/work-lock-19-bot-review-canary.md <<'EOF'
          # Work Lock 19 bot-authored review canary

          Temporary verification artifact used to prove that a real GitHub approval gates Continuum auto-merge.
          EOF
          git add docs/work-lock-19-bot-review-canary.md
          git commit -m "test: add bot-authored review canary"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH"             --title "test: bot-authored Work Lock 19 review canary"             --body "Controlled review-gate verification PR for Work Lock #19. This PR is created by github-actions[bot] so the repository owner can submit a real approval.")"
          gh issue comment "$CONTROL_ISSUE" --body "Created bot-authored review canary: $PR_URL"

      - name: Restore GitHub Actions pull-request permission
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/work-lock-19-actions-permissions.json"
          if [[ ! -f "$STATE_FILE" ]]; then
            echo "No saved workflow-permission state; nothing to restore."
            exit 0
          fi
          DEFAULT_PERMISSION="$(jq -r '.default_workflow_permissions' "$STATE_FILE")"
          CAN_APPROVE="$(jq -r '.can_approve_pull_request_reviews' "$STATE_FILE")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/permissions/workflow"             -f default_workflow_permissions="$DEFAULT_PERMISSION"             -F can_approve_pull_request_reviews="$CAN_APPROVE"
