name: CI repair liveness watchdog

# Dispatch receipts are not proof that GitHub actually instantiated a job.
# This is the operational liveness half of the existing single-owner CI-repair
# controller; it never claims or dispatches a second CI-repair attempt.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions: {}

concurrency:
  group: continuum-ci-repair-liveness
  cancel-in-progress: false
  queue: max

jobs:
  check:
    if: github.repository == 'kodmial/continuum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout current main without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reconcile accepted CI repairs with actual GitHub runs and jobs
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -B .github/scripts/ci_repair_liveness.py
