name: PR Agent (OpenCode-backed)

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-pr-agent.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      # Explicit Continuum self-opt-in, matching the qualified Kodmai consumer.
      # The provider remains OpenCode-backed and requires no paid LLM secret.
      enabled: 'true'
