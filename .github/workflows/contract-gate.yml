name: Continuum Contract Gate

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  contract:
    uses: ./.github/workflows/continuum-validation.yml
    with:
      auto_detect: ${{ 'false' }}
      dispatch_repair: ${{ 'false' }}
      # A fork pull request gets a read-only GITHUB_TOKEN; the status write
      # would fail before validation. Same-repository Dependabot PRs also get
      # a read-only token regardless of the head repository, so publishing is
      # enabled only for same-repository non-Dependabot pulls.
      publish_status: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && 'true' || 'false' }}
      status_context: continuum/contract-gate
      validation_command: bash scripts/validate-continuum.sh
