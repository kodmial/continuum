name: Auto-merge controller

# Merge gate for implementation pull requests. A PR only merges when:
#   - its branch follows the opencode/<issue>- naming convention;
#   - the current HEAD has a green, current-HEAD CI run;
#   - the current HEAD carries a green Continuum review-gate status in the
#     context named by .continuum.yml (failure closes the gate);
#   - the merge is not blocked by labels or conflicts.
# The review gate is consumed strictly through its normalized contract
# (status context + verdict=... state=... provider=... head=<sha>), never by
# parsing a provider comment. review.provider: none is a deliberate free pass.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: continuum-auto-merge
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (module + configuration)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the review-gate contract from repository configuration
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m continuum.cli config-check --config .continuum.yml

      - name: Reconcile merges against the normalized review gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          STATUS_CONTEXT: ${{ steps.check.outputs.status_context }}
          BLOCK_MERGE: ${{ steps.check.outputs.block_merge }}
          PROVIDER_ENABLED: ${{ steps.check.outputs.enabled }}
        with:
          github-token: ${{ secrets.TAP_PAT || github.token }}
          script: |
            const {owner, repo} = context.repo;
            const statusContext = process.env.STATUS_CONTEXT;
            const blockMerge = process.env.BLOCK_MERGE === 'true';
            const providerEnabled = process.env.PROVIDER_ENABLED === 'true';

            async function ciGreen(headSha) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner, repo, workflow_id: 'ci.yml', head_sha: headSha,
                  event: 'pull_request', per_page: 20,
                }
              );
              const completed = runs
                .filter(run => run.status === 'completed')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              return completed[0]?.conclusion === 'success';
            }

            // The review gate is a commit status in the configured context. Only
            // the normalized description contract counts: verdict=APPROVE on the
            // exact current HEAD. Anything else closes the gate.
            async function reviewGateGreen(headSha, contextName) {
              if (!providerEnabled || !blockMerge) return true;
              const {data} = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: headSha,
              });
              const match = (data.statuses || []).find(s => s.context === contextName);
              if (!match) {
                core.notice(`PR gate: no '${contextName}' status for ${headSha}.`);
                return false;
              }
              if (match.state !== 'success') {
                core.notice(`PR gate: '${contextName}' status is ${match.state}.`);
                return false;
              }
              const m = /verdict=([A-Z_]+) state=([a-z_]+) provider=([a-z0-9-]+) head=([0-9a-fA-F]+)/
                .exec(match.description || '');
              if (!m) {
                core.notice(`PR gate: '${contextName}' description is not the normalized contract.`);
                return false;
              }
              if (m[1] !== 'APPROVE' || m[4] !== headSha) {
                core.notice(`PR gate: closed on current HEAD (${m[1]}, head=${m[4]}).`);
                return false;
              }
              return true;
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            for (const listed of prs) {
              if (listed.head.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!listed.head.ref.startsWith('opencode/')) continue;

              const labels = new Set((listed.labels || []).map(x => x.name));
              if (labels.has('no-auto-merge')) {
                core.notice(`PR #${listed.number}: no-auto-merge is set.`);
                continue;
              }

              if (!(await ciGreen(listed.head.sha))) {
                core.notice(`PR #${listed.number}: current-head CI is not green.`);
                continue;
              }

              if (!(await reviewGateGreen(listed.head.sha, statusContext))) {
                core.notice(`PR #${listed.number}: review gate is not green on the current HEAD.`);
                continue;
              }

              const {data: pr} = await github.rest.pulls.get({
                owner, repo, pull_number: listed.number,
              });
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                core.notice(`PR #${listed.number}: merge conflict; repair controller owns it.`);
                continue;
              }
              if (pr.mergeable == null) {
                core.notice(`PR #${listed.number}: mergeability is still being computed.`);
                continue;
              }

              const result = await github.rest.pulls.merge({
                owner, repo, pull_number: listed.number,
                merge_method: 'squash', commit_title: pr.title,
              });

              if (!result.data.merged) {
                core.warning(`PR #${listed.number}: merge refused: ${result.data.message}`);
                continue;
              }

              const match = pr.head.ref.match(/^opencode\/issue(\d+)-/);
              if (match) {
                const issueNumber = Number(match[1]);
                try {
                  await github.rest.issues.update({
                    owner, repo, issue_number: issueNumber,
                    state: 'closed', state_reason: 'completed',
                  });
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
              }

              core.notice(`PR #${listed.number}: merged at ${result.data.sha}.`);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'issue-scheduler.yml', ref: 'main',
                });
              } catch (err) {
                core.warning(`Could not wake scheduler after merge: ${err.message}`);
              }
            }