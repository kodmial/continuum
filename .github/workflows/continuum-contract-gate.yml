name: Continuum Contract Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: continuum-contract-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    name: Minimal contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run existing Continuum contract tests
        run: ruby -E UTF-8 scripts/test-continuum.rb
