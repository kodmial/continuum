name: Wire extraction-audit dependency

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  wire:
    if: github.event.head_commit.message == 'wire-extraction-audit-dependency'
    runs-on: ubuntu-latest
    steps:
      - name: Add dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "repos/$GITHUB_REPOSITORY/issues/4/dependencies/blocked_by"             -F issue_id=5615019928 >/dev/null
