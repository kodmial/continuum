name: Continuum reusable OpenCode

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue_number:
        type: string
        required: false
        default: ""
      pr_number:
        type: string
        required: false
        default: ""
      head_ref:
        type: string
        required: false
        default: ""
      run_id:
        type: string
        required: false
        default: ""
      rungs_ruled_out:
        description: "Comma-separated mechanical conflict-repair rungs the controller already tried"
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: opencode/big-pickle
      task_timeout_minutes:
        description: "Maximum runtime for one OpenCode task"
        type: number
        required: false
        default: 180
      repair_timeout_minutes:
        description: "Maximum runtime for one conflict repair; repairs an existing change, so this stays small and independent of task_timeout_minutes"
        type: number
        required: false
        default: 25
      repair_agent_timeout_seconds:
        description: "Hard cap on the single model call inside a conflict repair"
        type: number
        required: false
        default: 1200
      opencode_distribution:
        description: "OpenCode binary source: upstream or github-release"
        type: string
        required: false
        default: upstream
      opencode_release_repo:
        description: "Repository that publishes the optimized OpenCode release; empty means caller repository"
        type: string
        required: false
        default: ""
      opencode_release_tag_prefix:
        description: "Release tag prefix used to select the newest optimized binary"
        type: string
        required: false
        default: coding-v
      opencode_release_asset:
        description: "Release asset filename for the OpenCode executable"
        type: string
        required: false
        default: opencode-coding-linux-x64
      opencode_release_tag:
        description: "Exact immutable release tag; when set, SHA-256 is required and prefix selection is disabled"
        type: string
        required: false
        default: ""
      opencode_release_sha256:
        description: "Expected SHA-256 for the exact release asset"
        type: string
        required: false
        default: ""
      opencode_release_version:
        description: "Expected output of opencode --version for the exact release"
        type: string
        required: false
        default: ""
      opencode_release_source_sha:
        description: "Expected source SHA from the release metadata sidecar"
        type: string
        required: false
        default: ""
    secrets:
      OPENCODE_API_KEY:
        required: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    if: contains(fromJSON('["issue","resolve-conflict","ci-fix"]'), inputs.mode)
    runs-on: ubuntu-latest
    # Conflict repair repairs a change that already exists, so it is bounded by
    # its own small constant rather than inheriting the source task's runtime.
    # That separation is what keeps a long task from deciding how long
    # repairing its own merge conflict may take.
    timeout-minutes: ${{ inputs.mode == 'issue' && inputs.task_timeout_minutes || inputs.repair_timeout_minutes }}
    concurrency:
      group: continuum-opencode-${{ inputs.mode }}-${{ inputs.issue_number || inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ inputs.model }}

    steps:
      - name: Record issue execution ownership
        if: inputs.mode == 'issue'
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid issue number."; exit 1; }
          marker="<!-- continuum-opencode-run:$GITHUB_RUN_ID -->"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$(printf '%s\nOpenCode run %s started for issue #%s.' "$marker" "$GITHUB_RUN_ID" "$ISSUE_NUMBER")"

      - name: Checkout issue base
        if: inputs.mode == 'issue'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Checkout PR branch
        if: inputs.mode != 'issue'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}
          persist-credentials: true

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate OpenCode distribution
        shell: bash
        env:
          OPENCODE_DISTRIBUTION: ${{ inputs.opencode_distribution }}
        run: |
          set -euo pipefail
          case "$OPENCODE_DISTRIBUTION" in
            upstream|github-release) ;;
            *)
              echo "::error::Unsupported opencode_distribution: $OPENCODE_DISTRIBUTION"
              exit 1
              ;;
          esac

      - name: Install upstream OpenCode
        if: inputs.opencode_distribution == 'upstream'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "OpenCode install attempt $attempt/3"
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -x "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install optimized OpenCode from GitHub Release
        if: inputs.opencode_distribution == 'github-release'
        id: optimized_opencode
        shell: bash
        env:
          RELEASE_REPO: ${{ inputs.opencode_release_repo }}
          TAG_PREFIX: ${{ inputs.opencode_release_tag_prefix }}
          ASSET_NAME: ${{ inputs.opencode_release_asset }}
          EXACT_TAG: ${{ inputs.opencode_release_tag }}
          EXPECTED_SHA256: ${{ inputs.opencode_release_sha256 }}
          EXPECTED_VERSION: ${{ inputs.opencode_release_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.opencode_release_source_sha }}
        run: |
          set -euo pipefail
          REPO="${RELEASE_REPO:-$GITHUB_REPOSITORY}"
          [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid release tag prefix"; exit 1; }
          [[ "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid release asset name"; exit 1; }

          if [[ -n "$EXACT_TAG" ]]; then
            [[ "$EXACT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid exact release tag"; exit 1; }
            [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "::error::opencode_release_sha256 is required with an exact release tag."
              exit 1
            }
            TAG="$EXACT_TAG"
            gh release view "$TAG" --repo "$REPO" >/dev/null
            selection="exact"
          else
            TAG="$(gh api "repos/$REPO/releases?per_page=100" --jq             'map(select(.draft == false and (.tag_name | startswith("'"$TAG_PREFIX"'")))) | first | .tag_name // empty')"
            if [[ -z "$TAG" ]]; then
              echo "::error::No non-draft release with prefix '$TAG_PREFIX' found in $REPO."
              exit 1
            fi
            selection="latest-prefix"
          fi

          DIR="$RUNNER_TEMP/continuum-opencode"
          mkdir -p "$DIR"
          gh release download "$TAG" --repo "$REPO" --dir "$DIR" \
            --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          gh release download "$TAG" --repo "$REPO" --dir "$DIR" \
            --pattern "$ASSET_NAME.json" >/dev/null 2>&1 || true

          test -f "$DIR/$ASSET_NAME"
          test -f "$DIR/$ASSET_NAME.sha256"
          (
            cd "$DIR"
            sha256sum -c "$ASSET_NAME.sha256"
          )
          chmod +x "$DIR/$ASSET_NAME"
          BINARY_SHA256="$(sha256sum "$DIR/$ASSET_NAME" | awk '{print $1}')"
          ACTUAL_VERSION="$("$DIR/$ASSET_NAME" --version | tr -d '\r\n')"

          if [[ -n "$EXPECTED_SHA256" && "${BINARY_SHA256,,}" != "${EXPECTED_SHA256,,}" ]]; then
            echo "::error::Release binary SHA-256 does not match the pinned identity."
            exit 1
          fi
          if [[ -n "$EXPECTED_VERSION" && "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release binary version '$ACTUAL_VERSION' does not match '$EXPECTED_VERSION'."
            exit 1
          fi

          META="$DIR/$ASSET_NAME.json"
          if [[ -f "$META" ]]; then
            jq -e --arg tag "$TAG" --arg asset "$ASSET_NAME" --arg sha "$BINARY_SHA256" \
              '.tag == $tag and .asset == $asset and ((.sha256 | ascii_downcase) == ($sha | ascii_downcase))' \
              "$META" >/dev/null || {
                echo "::error::Release metadata sidecar does not match the downloaded binary."
                exit 1
              }
          fi
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::invalid expected source SHA"; exit 1; }
            test -f "$META" || { echo "::error::Exact source verification requires the release metadata sidecar."; exit 1; }
            jq -e --arg source "${EXPECTED_SOURCE_SHA,,}" \
              '(.source_sha | ascii_downcase) == $source' "$META" >/dev/null || {
                echo "::error::Release metadata source SHA does not match the pinned identity."
                exit 1
              }
          fi

          ln -sf "$DIR/$ASSET_NAME" "$DIR/opencode"
          echo "$DIR" >> "$GITHUB_PATH"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$BINARY_SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$ACTUAL_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### OpenCode runtime"
            echo "- distribution: github-release"
            echo "- selection: `$selection`"
            echo "- repository: `$REPO`"
            echo "- release: `$TAG`"
            echo "- asset: `$ASSET_NAME`"
            echo "- sha256: `$BINARY_SHA256`"
            echo "- version: `$ACTUAL_VERSION`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Implement issue
        if: inputs.mode == 'issue'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number."
            exit 1
          fi

          BRANCH="opencode/issue${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"

          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body > /tmp/continuum-issue.json
          TITLE="$(jq -r '.title' /tmp/continuum-issue.json)"
          BODY="$(jq -r '.body // ""' /tmp/continuum-issue.json)"

          PROMPT="$(cat <<EOF
          Implement GitHub issue #${ISSUE_NUMBER} in this repository.

          Title:
          ${TITLE}

          Requirements:
          ${BODY}

          Rules:
          - Work only on the current branch.
          - Do not create, switch, delete, merge, rebase, or push git branches.
          - Do not create a pull request; the workflow owns commit/push/PR lifecycle.
          - Inspect the repository and preserve existing conventions.
          - Keep the change scoped to this issue.
          - Run relevant tests and validation before finishing.
          - Do not expose secrets.
          - Keep commit-worthy source and documentation changes in the working tree.
          EOF
          )"

          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "feat: implement issue #${ISSUE_NUMBER}"
          fi

          git fetch origin main --quiet
          AHEAD="$(git rev-list --count "origin/main..HEAD")"
          if [[ "$AHEAD" -eq 0 ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"               --body "Continuum OpenCode run completed without producing a commit."
            gh api --method DELETE               "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/automation:in-progress"               >/dev/null 2>&1 || true
            exit 0
          fi

          git push -u origin "$BRANCH"
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "$TITLE"             --body "Implemented automatically by Continuum.\n\nCloses #${ISSUE_NUMBER}"

      # Conflict repair repairs the change that already exists. It never
      # re-executes the source issue, and it never spends model time unless git
      # itself cannot finish the job.
      - name: Replay the pull request commits onto main
        id: replay
        if: inputs.mode == 'resolve-conflict' && !contains(inputs.rungs_ruled_out, 'replay-commits')
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          git fetch origin main --quiet
          ORIGINAL_HEAD="$(git rev-parse HEAD)"
          echo "REPAIR_ORIGINAL_HEAD=$ORIGINAL_HEAD" >> "$GITHUB_ENV"

          # Rung 2 of the ladder: replay the existing commits onto the current
          # base head. `--force-with-lease` makes the push a compare-and-swap
          # against the exact head this run verified, so a concurrent push fails
          # the step instead of being silently overwritten. Nothing from either
          # side is discarded.
          if git rebase --rebase-merges origin/main; then
            git push --force-with-lease="refs/heads/${HEAD_REF}:${ORIGINAL_HEAD}" origin "HEAD:${HEAD_REF}"
            echo "REPAIR_OUTCOME=replayed" >> "$GITHUB_ENV"
            echo "Replayed the existing commits onto main; no model was invoked."
            exit 0
          fi

          # A conflict here is this rung's expected result, not a step failure:
          # the next rung handles it. Drop the half-finished rebase so the
          # worktree is exactly the finished change again.
          git rebase --abort || git rebase --quit || true
          echo "REPAIR_OUTCOME=replay_conflicted" >> "$GITHUB_ENV"
          # Published as a step output so the next rung can be gated on it. A
          # dispatch that starts at rung 2 still reaches rung 3 when git cannot
          # finish, instead of spending a dispatch to learn that.
          echo "outcome=replay_conflicted" >> "$GITHUB_OUTPUT"
          echo "::notice::Mechanical replay could not merge main; the remaining conflicting hunks are delegated."

      - name: Resolve the conflicting hunks
        if: >-
          inputs.mode == 'resolve-conflict' &&
          (contains(inputs.rungs_ruled_out, 'replay-commits') ||
           steps.replay.outputs.outcome == 'replay_conflicted')
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          REPAIR_AGENT_TIMEOUT_SECONDS: ${{ inputs.repair_agent_timeout_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          git fetch origin main --quiet
          BASE_SHA="$(git rev-parse origin/main)"
          echo "REPAIR_ORIGINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # Rung 3 of the ladder, and the only rung that calls a model. A merge
          # git can complete unaided completes here with no model call at all.
          if git merge --no-edit "$BASE_SHA"; then
            git push origin "HEAD:${HEAD_REF}"
            echo "REPAIR_OUTCOME=merged_automatically" >> "$GITHUB_ENV"
            echo "Merged main into the pull request mechanically; no model was invoked."
            exit 0
          fi

          echo "REPAIR_OUTCOME=hunks_delegated" >> "$GITHUB_ENV"
          PROMPT="$(cat <<EOF
          Resolve the merge conflict between pull request #${PR_NUMBER} and current origin/main.

          This is a repair of a change that is already finished, not a new task. The
          implementation this pull request carries is complete; only the merge is
          unfinished. Do not redesign, extend, or re-implement anything, and do not
          start over from the base branch.

          Requirements:
          - Resolve the conflict markers so the merge completes, preserving the
            intended behavior from both the pull request and the base branch.
          - Keep the pull request's version where the conflict is only ordering or
            formatting; take the base's version where the base changed the same
            region for an unrelated reason.
          - Do not discard unrelated changes from either side.
          - Work only on the current checked-out PR branch.
          - Do not rebase, force-push, or reset away either side.
          - Run relevant tests after resolving conflicts.
          - Stage every file you resolved and complete the merge with
            \`git commit --no-edit\`.
          - Keep all comments and commit messages in English.
          EOF
          )"
          timeout --signal=TERM "$REPAIR_AGENT_TIMEOUT_SECONDS" \
            opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit --no-edit >/dev/null 2>&1 \
              || git commit -m "chore: resolve merge conflict with main"
          fi
          git push origin "HEAD:${HEAD_REF}"
          echo "REPAIR_OUTCOME=hunks_resolved" >> "$GITHUB_ENV"

      # Runs on success and on failure. A repair that dies mid-flight must not
      # leave the caller believing the pull request is still reserved, because
      # a lock with nothing behind it is exactly what makes a finished change
      # invisible to every later reconciliation.
      - name: Record the conflict-repair outcome
        if: always() && inputs.mode == 'resolve-conflict'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_OUTCOME: ${{ env.REPAIR_OUTCOME }}
          REPAIR_ORIGINAL_HEAD: ${{ env.REPAIR_ORIGINAL_HEAD }}
        shell: bash
        run: |
          set -euo pipefail
          outcome="${REPAIR_OUTCOME:-not_started}"
          case "$outcome" in
            replayed|merged_automatically|hunks_resolved)
              echo "Conflict repair finished with outcome '$outcome'; the pull request was repaired in place."
              ;;
            *)
              echo "::error::Conflict repair of PR #$PR_NUMBER did not complete (outcome=$outcome). The pull request stays reconcilable; no replacement or opt-out was published."
              ;;
          esac

      - name: Fix failed CI
        if: inputs.mode == 'ci-fix'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD)"
          PROMPT="$(cat <<EOF
          Fix the failed CI workflow run ${RUN_ID} for pull request #${PR_NUMBER}.

          Requirements:
          - Inspect the failed workflow and logs with GitHub CLI before changing code.
          - Fix the root cause only; do not make speculative changes for transient infrastructure failures.
          - Work only on the current branch ${HEAD_REF}.
          - Do not create another branch or pull request.
          - Run relevant tests.
          - Commit fixes if needed; do not push.
          EOF
          )"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: repair failed CI for PR #${PR_NUMBER}"
          fi
          AFTER="$(git rev-parse HEAD)"
          if [[ "$AFTER" != "$BEFORE" ]]; then
            git push origin "HEAD:${HEAD_REF}"
            while read -r label; do
              [[ "$label" == opencode-gate-repair-* ]] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$label" \
                >/dev/null 2>&1 || true
            done < <(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
          else
            echo "No source change was produced; leaving retry policy to the controller."
          fi
