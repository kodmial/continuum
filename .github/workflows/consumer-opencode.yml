name: Continuum reusable OpenCode

# The single agent surface a consumer repository drives. `mode` selects what the
# run is *for*, and there are exactly four, closed and generic:
#
#   issue              implement one issue on a new branch and open its PR
#   resolve-conflict   repair an existing change so it merges (recovery ladder)
#   ci-fix             repair a failed exact-head gate on the existing branch
#   review-fix         repair the normalized review findings on this exact HEAD
#
# The fourth is the review loop's repair leg. It is generic on purpose: the mode
# that reaches the trust-policy allowlist and this workflow must never branch on
# which reviewer produced the findings, so there is no provider-specific mode and
# no provider name anywhere below. `review-fix` also differs in where its
# instruction comes from -- the review controller normalizes, deduplicates and
# binds findings to one commit, writes that instruction to the pull request
# before dispatching, and this step reads back exactly that one. Rebuilding it
# here would hand the model an unnormalized list it could read as licence to
# widen its own scope.
#
# The execution environment is the consumer's, not Continuum's: `runner` and
# `swift_version` decide where the agent runs and which toolchain it gets, and
# no platform, language, or vendor name appears in this file.

on:
  workflow_call:
    inputs:
      base_branch:
        type: string
        required: false
        default: main
        description: Branch pull requests are opened against and changes are based on
      mode:
        type: string
        required: true
      issue_number:
        type: string
        required: false
        default: ""
      pr_number:
        type: string
        required: false
        default: ""
      head_ref:
        type: string
        required: false
        default: ""
      run_id:
        type: string
        required: false
        default: ""
      rungs_ruled_out:
        description: "Comma-separated mechanical conflict-repair rungs the controller already tried"
        type: string
        required: false
        default: ""
      runner:
        description: "GitHub-hosted runner label for the consumer execution environment"
        type: string
        required: false
        default: ubuntu-latest
      swift_version:
        description: "Optional Swift toolchain version required by the consumer; empty disables Swift setup"
        type: string
        required: false
        default: ""
      model:
        type: string
        required: false
        default: opencode/big-pickle
      task_timeout_minutes:
        description: "Maximum runtime for one OpenCode task"
        type: number
        required: false
        default: 180
      repair_timeout_minutes:
        description: "Maximum runtime for one conflict repair; repairs an existing change, so this stays small and independent of task_timeout_minutes"
        type: number
        required: false
        default: 25
      repair_agent_timeout_seconds:
        description: "Hard cap on the single model call inside a conflict repair"
        type: number
        required: false
        default: 1200
      review_agent_timeout_seconds:
        description: >-
          Hard cap on the single model call inside a review repair. Bounded
          independently of both task and conflict-repair budgets, because a
          review repair repairs a finished change against normalized findings.
        type: number
        required: false
        default: 1500
      opencode_distribution:
        description: "OpenCode binary source: upstream or github-release"
        type: string
        required: false
        default: upstream
      opencode_release_repo:
        description: "Repository that publishes the optimized OpenCode release; empty means caller repository"
        type: string
        required: false
        default: ""
      opencode_release_tag_prefix:
        description: "Release tag prefix used to select the newest optimized binary"
        type: string
        required: false
        default: coding-v
      opencode_release_asset:
        description: "Release asset filename for the OpenCode executable"
        type: string
        required: false
        default: opencode-coding-linux-x64
      opencode_release_tag:
        description: "Exact immutable release tag; when set, SHA-256 is required and prefix selection is disabled"
        type: string
        required: false
        default: ""
      opencode_release_sha256:
        description: "Expected SHA-256 for the exact release asset"
        type: string
        required: false
        default: ""
      opencode_release_version:
        description: "Expected output of opencode --version for the exact release"
        type: string
        required: false
        default: ""
      opencode_release_source_sha:
        description: "Expected source SHA from the release metadata sidecar"
        type: string
        required: false
        default: ""
    secrets:
      OPENCODE_API_KEY:
        required: false
      continuum_token:
        description: "Optional consumer-owned write token used when downstream GitHub events must fan out"
        required: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    if: contains(fromJSON('["issue","resolve-conflict","ci-fix","review-fix"]'), inputs.mode)
    runs-on: ${{ inputs.runner }}
    # Conflict repair repairs a change that already exists, so it is bounded by
    # its own small constant rather than inheriting the source task's runtime.
    # That separation is what keeps a long task from deciding how long
    # repairing its own merge conflict may take. A review repair repairs the same
    # finished change and is bounded the same way.
    timeout-minutes: ${{ inputs.mode == 'issue' && inputs.task_timeout_minutes || inputs.repair_timeout_minutes }}
    concurrency:
      group: continuum-opencode-${{ inputs.mode }}-${{ inputs.issue_number || inputs.pr_number || github.run_id }}
      cancel-in-progress: false
    # One `env:` block per job, on purpose. Two blocks means the second silently
    # replaces the first, so `BASE_BRANCH` was being dropped and every `$BASE_BRANCH`
    # reference in this job expanded to nothing.
    env:
      GH_TOKEN: ${{ secrets.continuum_token || github.token }}
      GITHUB_TOKEN: ${{ secrets.continuum_token || github.token }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ inputs.model }}
      BASE_BRANCH: ${{ inputs.base_branch }}

    steps:
      - name: Install requested Swift toolchain
        if: inputs.swift_version != ''
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: ${{ inputs.swift_version }}

      - name: Verify requested Swift toolchain
        if: inputs.swift_version != ''
        shell: bash
        run: |
          set -euo pipefail
          swift --version

      - name: Record issue execution ownership
        if: inputs.mode == 'issue'
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid issue number."; exit 1; }
          marker="<!-- continuum-opencode-run:$GITHUB_RUN_ID -->"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$(printf '%s\nOpenCode run %s started for issue #%s.' "$marker" "$GITHUB_RUN_ID" "$ISSUE_NUMBER")"

      - name: Checkout issue base
        if: inputs.mode == 'issue'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}
          token: ${{ secrets.continuum_token || github.token }}
          persist-credentials: true

      - name: Checkout PR branch
        if: inputs.mode != 'issue'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}
          token: ${{ secrets.continuum_token || github.token }}
          persist-credentials: true

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Load Continuum engine
        uses: kodmial/continuum/.github/actions/engine-path@81adcea69ce9c260f1aad4177867f8449a75d9b3

      # Before any OpenCode invocation in this job: issue implementation,
      # conflict repair, and CI repair all run under the same policy, so the
      # install is unconditional and sits ahead of all three rather than being
      # repeated at each call site. Each `opencode run` still re-verifies
      # immediately before it starts, so a removed or replaced global file is a
      # failed step instead of an agent that quietly ran without it.
      #
      # Nothing here touches the repository's own AGENTS.md.
      - name: Install Continuum global agent instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" install \
            --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"

      - name: Validate OpenCode distribution
        shell: bash
        env:
          OPENCODE_DISTRIBUTION: ${{ inputs.opencode_distribution }}
        run: |
          set -euo pipefail
          case "$OPENCODE_DISTRIBUTION" in
            upstream|github-release) ;;
            *)
              echo "::error::Unsupported opencode_distribution: $OPENCODE_DISTRIBUTION"
              exit 1
              ;;
          esac

      - name: Install upstream OpenCode
        id: upstream_opencode
        if: inputs.opencode_distribution == 'upstream'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "OpenCode install attempt $attempt/3"
            if curl -fsSL https://opencode.ai/install | bash; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -x "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          # The upstream installer is a pipe, so there is no digest to check it
          # against. The identity of whatever is on PATH is still recorded, and
          # every later step re-checks it, so a swap between install and
          # invocation is caught even though the install itself cannot be
          # attested.
          PATH="$HOME/.opencode/bin:$PATH" \
            python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" install

      - name: Install optimized OpenCode from GitHub Release
        if: inputs.opencode_distribution == 'github-release'
        id: optimized_opencode
        shell: bash
        env:
          RELEASE_REPO: ${{ inputs.opencode_release_repo }}
          TAG_PREFIX: ${{ inputs.opencode_release_tag_prefix }}
          ASSET_NAME: ${{ inputs.opencode_release_asset }}
          EXACT_TAG: ${{ inputs.opencode_release_tag }}
          EXPECTED_SHA256: ${{ inputs.opencode_release_sha256 }}
          EXPECTED_VERSION: ${{ inputs.opencode_release_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.opencode_release_source_sha }}
        run: |
          set -euo pipefail
          REPO="${RELEASE_REPO:-$GITHUB_REPOSITORY}"
          [[ "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid release tag prefix"; exit 1; }
          [[ "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid release asset name"; exit 1; }

          if [[ -n "$EXACT_TAG" ]]; then
            [[ "$EXACT_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid exact release tag"; exit 1; }
            [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "::error::opencode_release_sha256 is required with an exact release tag."
              exit 1
            }
            TAG="$EXACT_TAG"
            gh release view "$TAG" --repo "$REPO" >/dev/null
            selection="exact"
          else
            TAG="$(gh api "repos/$REPO/releases?per_page=100" --jq             'map(select(.draft == false and (.tag_name | startswith("'"$TAG_PREFIX"'")))) | first | .tag_name // empty')"
            if [[ -z "$TAG" ]]; then
              echo "::error::No non-draft release with prefix '$TAG_PREFIX' found in $REPO."
              exit 1
            fi
            selection="latest-prefix"
          fi

          DIR="$RUNNER_TEMP/continuum-opencode"
          mkdir -p "$DIR"
          gh release download "$TAG" --repo "$REPO" --dir "$DIR" \
            --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256"
          gh release download "$TAG" --repo "$REPO" --dir "$DIR" \
            --pattern "$ASSET_NAME.json" >/dev/null 2>&1 || true

          test -f "$DIR/$ASSET_NAME"
          test -f "$DIR/$ASSET_NAME.sha256"
          (
            cd "$DIR"
            sha256sum -c "$ASSET_NAME.sha256"
          )
          chmod +x "$DIR/$ASSET_NAME"
          BINARY_SHA256="$(sha256sum "$DIR/$ASSET_NAME" | awk '{print $1}')"
          ACTUAL_VERSION="$("$DIR/$ASSET_NAME" --version | tr -d '\r\n')"

          if [[ -n "$EXPECTED_SHA256" && "${BINARY_SHA256,,}" != "${EXPECTED_SHA256,,}" ]]; then
            echo "::error::Release binary SHA-256 does not match the pinned identity."
            exit 1
          fi
          if [[ -n "$EXPECTED_VERSION" && "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Release binary version '$ACTUAL_VERSION' does not match '$EXPECTED_VERSION'."
            exit 1
          fi

          META="$DIR/$ASSET_NAME.json"
          if [[ -f "$META" ]]; then
            jq -e --arg tag "$TAG" --arg asset "$ASSET_NAME" --arg sha "$BINARY_SHA256" \
              '.tag == $tag and .asset == $asset and ((.sha256 | ascii_downcase) == ($sha | ascii_downcase))' \
              "$META" >/dev/null || {
                echo "::error::Release metadata sidecar does not match the downloaded binary."
                exit 1
              }
          fi
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::invalid expected source SHA"; exit 1; }
            test -f "$META" || { echo "::error::Exact source verification requires the release metadata sidecar."; exit 1; }
            jq -e --arg source "${EXPECTED_SOURCE_SHA,,}" \
              '(.source_sha | ascii_downcase) == $source' "$META" >/dev/null || {
                echo "::error::Release metadata source SHA does not match the pinned identity."
                exit 1
              }
          fi

          ln -sf "$DIR/$ASSET_NAME" "$DIR/opencode"
          # `$GITHUB_PATH` only ever appends, so this leaves the verified copy
          # *last* on PATH: any earlier entry holding something called
          # `opencode` still wins. Prepending is not available, so shadowing is
          # made detectable instead of merely unlikely -- `install` resolves
          # `opencode` the way the shell will and refuses to proceed unless the
          # file it lands on is the binary whose digest was just verified.
          # Ordering is best-effort; this comparison is the guarantee.
          echo "$DIR" >> "$GITHUB_PATH"
          PATH="$DIR:$PATH" \
            python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" install \
              --verified-sha256 "$BINARY_SHA256"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "binary_sha256=$BINARY_SHA256" >> "$GITHUB_OUTPUT"
          echo "version=$ACTUAL_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### OpenCode runtime"
            echo "- distribution: github-release"
            echo "- selection: `$selection`"
            echo "- repository: `$REPO`"
            echo "- release: `$TAG`"
            echo "- asset: `$ASSET_NAME`"
            echo "- sha256: `$BINARY_SHA256`"
            echo "- version: `$ACTUAL_VERSION`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Implement issue
        if: inputs.mode == 'issue'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPENCODE_RUNTIME_SHA256: ${{ steps.upstream_opencode.outputs.runtime_sha256 || steps.optimized_opencode.outputs.runtime_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number."
            exit 1
          fi

          # The workflow owns the branch. It is created here, before the model
          # runs, so the ref the work is published to is decided by the workflow
          # rather than by whatever the model leaves behind.
          BRANCH="$(python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/agent_workspace.py" select-branch \
            --candidates "opencode/issue${ISSUE_NUMBER}-continuum" | sed -n 's/^owned_branch=//p')"
          if [[ -z "$BRANCH" ]]; then
            echo "::error::Could not derive the owned branch for issue #$ISSUE_NUMBER."
            exit 1
          fi
          git switch -C "$BRANCH" "origin/$BASE_BRANCH"

          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body > /tmp/continuum-issue.json
          TITLE="$(jq -r '.title' /tmp/continuum-issue.json)"
          BODY="$(jq -r '.body // ""' /tmp/continuum-issue.json)"

          PROMPT="$(cat <<EOF
          Implement GitHub issue #${ISSUE_NUMBER} in this repository.

          Title:
          ${TITLE}

          Requirements:
          ${BODY}

          Rules:
          - Work only on the current branch.
          - Do not create, switch, delete, merge, rebase, or push git branches.
          - Do not create a pull request; the workflow owns commit/push/PR lifecycle.
          - Inspect the repository and preserve existing conventions.
          - Keep the change scoped to this issue.
          - Run relevant tests and validation before finishing.
          - Do not expose secrets.
          - Keep commit-worthy source and documentation changes in the working tree.
          EOF
          )"

          # Point of use. The digest recorded at install is re-read here, so
          # the process about to start is the one that was verified rather than
          # whatever PATH happens to resolve at this moment.
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" verify --expected-sha256 "$OPENCODE_RUNTIME_SHA256"
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" verify \
            --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          # The model edited the working tree; the workflow publishes it. The
          # decision itself lives in agent_workspace.py so this plane and the
          # self plane cannot drift apart, and so branch drift cannot be a
          # silent exit 0 the way a hard-coded `git branch --show-current`
          # comparison is.
          CURRENT_BRANCH="$(git branch --show-current || true)"
          git fetch origin "$BASE_BRANCH" --quiet
          AHEAD="$(git rev-list --count "origin/$BASE_BRANCH..HEAD" 2>/dev/null || echo 0)"
          DIRTY=false
          [[ -n "$(git status --porcelain)" ]] && DIRTY=true

          # Agent branches that hold commits the base does not have, most work
          # first. Here the owned branch is derived rather than inferred, so
          # this is not about identity -- it is the only way to notice a model
          # that committed to a branch and then walked back to the owned one,
          # leaving a clean workspace that is not actually empty.
          WORK_BRANCHES="$(
            while read -r ref; do
              [[ -n "$ref" ]] || continue
              ahead="$(git rev-list --count "origin/$BASE_BRANCH..$ref" 2>/dev/null || echo 0)"
              [[ "$ahead" -gt 0 ]] && printf '%s %s\n' "$ahead" "$ref"
            done < <(git for-each-ref --format='%(refname:short)' "refs/heads/opencode/issue${ISSUE_NUMBER}-*") \
            | sort -rn -k1,1 | cut -d' ' -f2- | paste -sd, - || true
          )"

          # Open pull requests only. A merged or closed pull request for this
          # branch is not a publication: counting it as one is how a re-dispatch
          # left a branch permanently unrecoverable.
          OPEN_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
          OPEN_PR="${OPEN_PR:-0}"

          PLAN_OUTPUTS="$(python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/agent_workspace.py" workspace-plan \
            --owned-branch "$BRANCH" \
            --current-branch "$CURRENT_BRANCH" \
            --base-branch "$BASE_BRANCH" \
            --dirty "$DIRTY" \
            --commits-ahead "$AHEAD" \
            --open-pull-request "$OPEN_PR" \
            --work-branches "$WORK_BRANCHES" \
            --head-sha "$(git rev-parse HEAD 2>/dev/null || true)")"
          ACTION="$(printf '%s\n' "$PLAN_OUTPUTS" | sed -n 's/^workspace_action=//p')"

          case "$ACTION" in
            already-published)
              echo "An open pull request already owns '$BRANCH'; not opening a second one."
              exit 0
              ;;
            materialize)
              # The model moved off the branch the workflow created. Its
              # finished tree is rewritten as one commit on '$BRANCH' -- a tree
              # copy rather than a merge, because a merge at the end of a run
              # with no agent left would be a conflict nobody can resolve.
              if [[ -n "$(git status --porcelain)" ]]; then
                git add -A
                git commit -m "chore: preserve agent work from $CURRENT_BRANCH" || true
              fi
              SALVAGE_TREE="$(git rev-parse 'HEAD^{tree}')"
              if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
                git switch "$BRANCH"
              else
                git switch -c "$BRANCH" "origin/$BASE_BRANCH"
              fi
              MATERIALIZED="$(printf 'Materialized automatically after the agent left its branch during issue #%s execution.\n\nCloses #%s' \
                "$ISSUE_NUMBER" "$ISSUE_NUMBER" | git commit-tree "$SALVAGE_TREE" -p HEAD)"
              git reset --hard "$MATERIALIZED" >/dev/null
              ;;
            refuse)
              # Refusing to publish is not the same decision as discarding. The
              # work exists, so it is quarantined on a branch that is still a
              # recognisable agent branch, and the run reports what it did
              # instead of claiming a recovery it did not perform.
              SALVAGE_SOURCE="$(printf '%s\n' "$PLAN_OUTPUTS" | sed -n 's/^workspace_salvage_source=//p')"
              if [[ -n "$(git status --porcelain)" ]]; then
                git add -A
                git commit -m "chore: preserve agent work that could not be published" || true
              fi
              SOURCE_HEAD=HEAD
              if [[ -n "$SALVAGE_SOURCE" && "$SALVAGE_SOURCE" != "$CURRENT_BRANCH" ]] \
                && git show-ref --verify --quiet "refs/heads/$SALVAGE_SOURCE"; then
                SOURCE_HEAD="$SALVAGE_SOURCE"
              fi
              SALVAGE="opencode/issue${ISSUE_NUMBER}-salvage-${GITHUB_RUN_ID}"
              if git rev-list --count "origin/$BASE_BRANCH..$SOURCE_HEAD" >/dev/null 2>&1 \
                && [[ "$(git rev-list --count "origin/$BASE_BRANCH..$SOURCE_HEAD")" -gt 0 ]]; then
                SALVAGE_TREE="$(git rev-parse "${SOURCE_HEAD}^{tree}")"
                git switch -C "$SALVAGE" "origin/$BASE_BRANCH"
                SALVAGE_COMMIT="$(printf 'Preserved automatically: the agent left its branch during issue #%s and Continuum would not publish to a ref the model chose, so the finished tree is quarantined here rather than discarded.\n\nCloses #%s' \
                  "$ISSUE_NUMBER" "$ISSUE_NUMBER" | git commit-tree "$SALVAGE_TREE" -p HEAD)"
                git reset --hard "$SALVAGE_COMMIT" >/dev/null
                HUSKY=0 git push -u origin "HEAD:$SALVAGE"
                echo "::error::Preserved the agent workspace on '$SALVAGE' but did not open a pull request: $(printf '%s\n' "$PLAN_OUTPUTS" | sed -n 's/^workspace_reason=//p')"
              fi
              exit 1
              ;;
            publish)
              if [[ -n "$(git status --porcelain)" ]]; then
                git add -A
                git commit -m "feat: implement issue #${ISSUE_NUMBER}"
              fi
              ;;
          esac

          AHEAD="$(git rev-list --count "origin/$BASE_BRANCH..HEAD")"
          if [[ "$AHEAD" -eq 0 ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"               --body "Continuum OpenCode run completed without producing a commit."
            gh api --method DELETE               "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/automation:in-progress"               >/dev/null 2>&1 || true
            exit 0
          fi

          HUSKY=0 git push -u origin "$BRANCH"

          # Re-checked at the moment of creation, not only in the plan: a
          # wrapper step that retried must not turn one task into two pull
          # requests.
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' | grep -q '^[0-9]'; then
            echo "An open pull request already owns '$BRANCH'; not opening a second one."
            exit 0
          fi

          gh pr create             --repo "$GITHUB_REPOSITORY"             --base "$BASE_BRANCH"             --head "$BRANCH"             --title "$TITLE"             --body "Implemented automatically by Continuum.\n\nCloses #${ISSUE_NUMBER}"

      # Conflict repair repairs the change that already exists. It never
      # re-executes the source issue, and it never spends model time unless git
      # itself cannot finish the job.
      - name: Replay the pull request commits onto main
        id: replay
        if: inputs.mode == 'resolve-conflict' && !contains(inputs.rungs_ruled_out, 'replay-commits')
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          git fetch origin "$BASE_BRANCH" --quiet
          ORIGINAL_HEAD="$(git rev-parse HEAD)"
          echo "REPAIR_ORIGINAL_HEAD=$ORIGINAL_HEAD" >> "$GITHUB_ENV"

          # Rung 2 of the ladder: replay the existing commits onto the current
          # base head. `--force-with-lease` makes the push a compare-and-swap
          # against the exact head this run verified, so a concurrent push fails
          # the step instead of being silently overwritten. Nothing from either
          # side is discarded.
          if git rebase --rebase-merges "origin/$BASE_BRANCH"; then
            HUSKY=0 git push --force-with-lease="refs/heads/${HEAD_REF}:${ORIGINAL_HEAD}" origin "HEAD:${HEAD_REF}"
            echo "REPAIR_OUTCOME=replayed" >> "$GITHUB_ENV"
            echo "Replayed the existing commits onto main; no model was invoked."
            exit 0
          fi

          # A conflict here is this rung's expected result, not a step failure:
          # the next rung handles it. Drop the half-finished rebase so the
          # worktree is exactly the finished change again.
          git rebase --abort || git rebase --quit || true
          echo "REPAIR_OUTCOME=replay_conflicted" >> "$GITHUB_ENV"
          # Published as a step output so the next rung can be gated on it. A
          # dispatch that starts at rung 2 still reaches rung 3 when git cannot
          # finish, instead of spending a dispatch to learn that.
          echo "outcome=replay_conflicted" >> "$GITHUB_OUTPUT"
          echo "::notice::Mechanical replay could not merge main; the remaining conflicting hunks are delegated."

      - name: Resolve the conflicting hunks
        if: >-
          inputs.mode == 'resolve-conflict' &&
          (contains(inputs.rungs_ruled_out, 'replay-commits') ||
           steps.replay.outputs.outcome == 'replay_conflicted')
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          REPAIR_AGENT_TIMEOUT_SECONDS: ${{ inputs.repair_agent_timeout_seconds }}
          OPENCODE_RUNTIME_SHA256: ${{ steps.upstream_opencode.outputs.runtime_sha256 || steps.optimized_opencode.outputs.runtime_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          git fetch origin "$BASE_BRANCH" --quiet
          BASE_SHA="$(git rev-parse "origin/$BASE_BRANCH")"
          echo "REPAIR_ORIGINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # Rung 3 of the ladder, and the only rung that calls a model. A merge
          # git can complete unaided completes here with no model call at all.
          if git merge --no-edit "$BASE_SHA"; then
            HUSKY=0 git push origin "HEAD:${HEAD_REF}"
            echo "REPAIR_OUTCOME=merged_automatically" >> "$GITHUB_ENV"
            echo "Merged main into the pull request mechanically; no model was invoked."
            exit 0
          fi

          echo "REPAIR_OUTCOME=hunks_delegated" >> "$GITHUB_ENV"
          PROMPT="$(cat <<EOF
          Resolve the merge conflict between pull request #${PR_NUMBER} and current ${BASE_BRANCH}.

          This is a repair of a change that is already finished, not a new task. The
          implementation this pull request carries is complete; only the merge is
          unfinished. Do not redesign, extend, or re-implement anything, and do not
          start over from the base branch.

          Requirements:
          - Resolve the conflict markers so the merge completes, preserving the
            intended behavior from both the pull request and the base branch.
          - Keep the pull request's version where the conflict is only ordering or
            formatting; take the base's version where the base changed the same
            region for an unrelated reason.
          - Do not discard unrelated changes from either side.
          - Work only on the current checked-out PR branch.
          - Do not rebase, force-push, or reset away either side.
          - Run relevant tests after resolving conflicts.
          - Stage every file you resolved and complete the merge with
            \`git commit --no-edit\`.
          - Keep all comments and commit messages in English.
          EOF
          )"
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" verify --expected-sha256 "$OPENCODE_RUNTIME_SHA256"
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" verify \
            --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"
          timeout --signal=TERM "$REPAIR_AGENT_TIMEOUT_SECONDS" \
            opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit --no-edit >/dev/null 2>&1 \
              || git commit -m "chore: resolve merge conflict with main"
          fi
          HUSKY=0 git push origin "HEAD:${HEAD_REF}"
          echo "REPAIR_OUTCOME=hunks_resolved" >> "$GITHUB_ENV"

      # Runs on success and on failure. A repair that dies mid-flight must not
      # leave the caller believing the pull request is still reserved, because
      # a lock with nothing behind it is exactly what makes a finished change
      # invisible to every later reconciliation.
      - name: Record the conflict-repair outcome
        if: always() && inputs.mode == 'resolve-conflict'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REPAIR_OUTCOME: ${{ env.REPAIR_OUTCOME }}
          REPAIR_ORIGINAL_HEAD: ${{ env.REPAIR_ORIGINAL_HEAD }}
        shell: bash
        run: |
          set -euo pipefail
          outcome="${REPAIR_OUTCOME:-not_started}"
          case "$outcome" in
            replayed|merged_automatically|hunks_resolved)
              echo "Conflict repair finished with outcome '$outcome'; the pull request was repaired in place."
              ;;
            *)
              echo "::error::Conflict repair of PR #$PR_NUMBER did not complete (outcome=$outcome). The pull request stays reconcilable; no replacement or opt-out was published."
              ;;
          esac

      - name: Fix failed CI
        if: inputs.mode == 'ci-fix'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          RUN_ID: ${{ inputs.run_id }}
          OPENCODE_RUNTIME_SHA256: ${{ steps.upstream_opencode.outputs.runtime_sha256 || steps.optimized_opencode.outputs.runtime_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD)"
          PROMPT="$(cat <<EOF
          Fix the failed CI workflow run ${RUN_ID} for pull request #${PR_NUMBER}.

          Requirements:
          - Inspect the failed workflow and logs with GitHub CLI before changing code.
          - Fix the root cause only; do not make speculative changes for transient infrastructure failures.
          - Work only on the current branch ${HEAD_REF}.
          - Do not create another branch or pull request.
          - Run relevant tests.
          - Commit fixes if needed; do not push.
          EOF
          )"
          # Point of use. The digest recorded at install is re-read here, so
          # the process about to start is the one that was verified rather than
          # whatever PATH happens to resolve at this moment.
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" verify --expected-sha256 "$OPENCODE_RUNTIME_SHA256"
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" verify \
            --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: repair failed CI for PR #${PR_NUMBER}"
          fi
          AFTER="$(git rev-parse HEAD)"
          if [[ "$AFTER" != "$BEFORE" ]]; then
            HUSKY=0 git push origin "HEAD:${HEAD_REF}"
            while read -r label; do
              [[ "$label" == opencode-gate-repair-* ]] || continue
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$label" \
                >/dev/null 2>&1 || true
            done < <(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name')
          else
            echo "No source change was produced; leaving retry policy to the controller."
          fi

      # The review loop's repair leg. Everything about where this instruction
      # comes from is in the header: the review controller wrote it to the pull
      # request for one exact commit before dispatching this run, and this step
      # reads back that one instruction or fails. It does not talk to the
      # reviewer, and it does not read findings out of the event.
      - name: Repair the open review findings
        if: inputs.mode == 'review-fix'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          REVIEW_AGENT_TIMEOUT_SECONDS: ${{ inputs.review_agent_timeout_seconds }}
          OPENCODE_RUNTIME_SHA256: ${{ steps.upstream_opencode.outputs.runtime_sha256 || steps.optimized_opencode.outputs.runtime_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number."
            exit 1
          fi
          BEFORE_SHA="$(git rev-parse HEAD)"

          # The engine is the only code allowed to decide what a review repair
          # is. It is read from the pinned Continuum checkout this job loaded,
          # never from the pull request's own tree -- a contributor cannot
          # decide its own repair scope by editing the branch under review.
          PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src" python3 -m continuum.cli review prompt \
            --config "$CONTINUUM_ENGINE_ROOT/.github/continuum.yml" \
            --pr "$PR_NUMBER" \
            --head "$BEFORE_SHA" \
            --out "$RUNNER_TEMP/review-repair-prompt.md" >/dev/null

          PROMPT="$(cat "$RUNNER_TEMP/review-repair-prompt.md")"
          if [[ -z "$PROMPT" ]]; then
            echo "::error::No review repair instruction for this commit."
            exit 1
          fi

          # Point of use, same as every other invocation in this job.
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_runtime.py" verify --expected-sha256 "$OPENCODE_RUNTIME_SHA256"
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" verify \
            --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"
          # Bounded by the review repair policy, not by the caller and not by the
          # source task. The controller already spent an attempt for this commit,
          # so a repair that cannot finish in this window is a pause, not a
          # longer run.
          timeout --signal=TERM "$REVIEW_AGENT_TIMEOUT_SECONDS" \
            opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"

          # An unchanged HEAD is a real answer, not a failure. The controller
          # plans for it: it asks the reviewer to re-check the original findings
          # on this commit, then requests one bounded full re-review, then pauses
          # and fails closed. This step deliberately does not push, re-run, or
          # decide that -- a second attempt chosen here would be an attempt the
          # controller's durable ledger never counted.
          AFTER_SHA="$(git rev-parse HEAD)"
          if [[ "$AFTER_SHA" == "$BEFORE_SHA" ]]; then
            echo "::notice::Review repair made no code change; the controller re-verifies this commit and then pauses if the findings are still open."
            exit 0
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: repair review findings for PR #${PR_NUMBER}"
          fi
          HUSKY=0 git push origin "HEAD:${HEAD_REF}"
          echo "::notice::Pushed the review repair to ${HEAD_REF}."
