name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

jobs:
  validate:
    uses: ./.github/workflows/continuum-validation.yml
    secrets: inherit
    with:
      auto_detect: ${{ 'false' }}
      dispatch_repair: ${{ 'false' }}
      validation_command: bash scripts/validate-continuum.sh
