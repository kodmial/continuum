name: Retry CodeRabbit after rate limit

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
  # Any new/edited CodeRabbit rate-limit response wakes the global controller.

permissions: {}

# CodeRabbit's included full-review quota is shared across PRs. There must be
# exactly one controller deciding which PR gets the next review slot.
concurrency:
  # Repository-wide fixed key: every caller/event shares one quota controller.
  # Do not derive this from github.workflow; a second caller name must not create
  # an independent CodeRabbit slot.
  group: coderabbit-rate-limit-controller-${{ github.repository }}
  # Exactly one controller owns the shared slot. If the next legal transition
  # is in the future it waits inside this serialized run; any newer lifecycle
  # event cancels the sleeper and starts a fresh latest-state reconciliation.
  cancel-in-progress: true

jobs:
  controller:
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (inputs.review_provider || vars.CONTINUUM_REVIEW_PROVIDER || 'none') == 'coderabbit' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'coderabbitai[bot]' &&
       (contains(github.event.comment.body, 'Review rate limited') ||
        contains(github.event.comment.body, 'Review limit reached'))) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'coderabbitai[bot]' &&
       github.event.pull_request.state == 'open') ||
      (github.event_name == 'pull_request_review_comment' &&
       startsWith(github.event.comment.user.login, 'coderabbitai') &&
       github.event.pull_request.state == 'open'))
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read

    steps:
      - name: Reconcile global CodeRabbit review queue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REQUIRED_WORKFLOW_GATE_LABEL: ${{ vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_LABEL || '' }}
          REQUIRED_WORKFLOW_GATE_NAME: ${{ vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_NAME || '' }}
          READ_GITHUB_TOKEN: ${{ github.token }}
          COMMENT_PAT: ${{ secrets.TAP_PAT }}
        with:
          # Same-repository discovery stays on the repository token. The
          # CodeRabbit command and its tiny exact-head lock mutation share the
          # low-volume PAT client: real consumer runs can reject that lock
          # mutation from GITHUB_TOKEN, and the command itself must use the
          # non-Actions actor to trigger CodeRabbit.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;

            // Request-budget observability (#254): counts only, no secrets.
            const apiBudget = { reads: 0, patReads: 0, mutations: 0, pages: 0, event: 0 };
            function noteRead(pages = 1) {
              apiBudget.reads += 1;
              apiBudget.pages += pages;
            }
            function reportBudget() {
              core.notice(
                `continuum-api-budget: total_calls=${apiBudget.reads + apiBudget.mutations} ` +
                `reads=${apiBudget.reads} (repository-token) ` +
                `mutations=${apiBudget.mutations} (github-token) ` +
                `pages=${apiBudget.pages} event_substitutions=${apiBudget.event}`
              );
            }
            // Same-repository reads run on the repository token, keeping
            // them off the shared TAP_PAT budget.
            const readToken = String(process.env.READ_GITHUB_TOKEN || '').trim();
            if (!readToken) {
              throw new Error(
                'READ_GITHUB_TOKEN is required for same-repository CodeRabbit reads.'
              );
            }
            const readGithub = new github.constructor({
              auth: readToken,
              baseUrl: github.request.endpoint.DEFAULTS.baseUrl,
            });
            const commentToken = String(process.env.COMMENT_PAT || '').trim();
            if (!commentToken) {
              throw new Error(
                'COMMENT_PAT is required to trigger CodeRabbit full review.'
              );
            }
            const commentGithub = new github.constructor({
              auth: commentToken,
              baseUrl: github.request.endpoint.DEFAULTS.baseUrl,
            });
            if (
              typeof readGithub.paginate !== 'function' ||
              typeof readGithub.rest?.pulls?.list !== 'function' ||
              typeof readGithub.rest?.issues?.get !== 'function' ||
              typeof readGithub.rest?.actions?.listWorkflowRunsForRepo !== 'function' ||
              typeof readGithub.graphql !== 'function'
            ) {
              throw new Error(
                'readGithub client lacks the paginate/rest/graphql plugins; ' +
                'cannot perform same-repository CodeRabbit reads.'
              );
            }
            // Bounded page caps (#254): no scan scales with repository
            // lifetime/history. Gate checks only need recent branch runs;
            // queue/comment/review/thread scans are capped windows.
            const MAX_QUEUE_PAGES = 5;
            const MAX_THREAD_PAGES = 5;
            const MAX_GATE_PAGES = 2;
            async function boundedList(request, params, maxPages) {
              const items = [];
              // Fail-closed truncation flag: issue comments and pull reviews
              // are oldest-first, so a full final page at the cap may hide
              // newer records. Callers deciding per-PR eligibility must
              // recover the newest window (see mergeNewestWindow) or skip
              // the PR when truncated is true instead of deciding on partial
              // oldest data.
              let truncated = false;
              // Newest-window anchor: paginated REST responses carry an
              // RFC5988 Link header whose rel="last" page lets a truncated
              // oldest-first window re-anchor at the newest end with a
              // bounded number of reads instead of walking history.
              let lastPage = 0;
              for (let page = 1; page <= maxPages; page += 1) {
                const response = await request({ ...params, page });
                noteRead();
                const link = response && response.headers && response.headers.link;
                if (typeof link === 'string') {
                  const match = link.match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
                  if (match) lastPage = Math.max(lastPage, Number(match[1]));
                }
                const data = response && response.data;
                const batch = Array.isArray(data) ? data : ((data && data.workflow_runs) || []);
                if (batch.length === 0) break;
                items.push(...batch);
                if (batch.length < (params.per_page || 100)) break;
                if (page === maxPages) truncated = true;
              }
              items.truncated = truncated;
              items.lastPage = lastPage;
              return items;
            }
            // Bounded newest-window recovery: merges up to MAX_THREAD_PAGES
            // newest records into a truncated oldest-first scan so the PR can
            // still be serviced on this pass. Eligibility markers
            // (full-review commands, rate-limit replies, HEAD markers) are
            // written by recent activity, which the merged newest window
            // always keeps. When the thread spans more than twice the page
            // budget the merged oldest+newest window still leaves an unseen
            // middle, so the recovery throws and the caller defers the PR
            // to the next wake-up (fail closed, like the thread-budget path)
            // instead of deciding as if complete.
            async function mergeNewestWindow(request, params, items, label) {
              let lastPage = Number(items.lastPage || 0);
              if (!lastPage && label === 'comments') {
                const { data: meta } = await readGithub.rest.issues.get({
                  owner,
                  repo,
                  issue_number: params.issue_number,
                });
                noteRead();
                const total = Number(meta?.comments || 0);
                if (total > 0) lastPage = Math.max(1, Math.ceil(total / 100));
              }
              if (!lastPage) {
                throw new Error(`cannot anchor newest ${label} window`);
              }
              // Oldest MAX_THREAD_PAGES cover 1..MAX and newest MAX cover
              // lastPage-(MAX-1)..lastPage. Beyond twice the budget the
              // middle stays unseen where a deciding marker would be missed.
              if (lastPage > MAX_THREAD_PAGES * 2) {
                throw new Error(
                  `${label} scan spans more than the bounded oldest+newest window (pages=${lastPage}); skipping this PR instead of deciding with an unseen middle window`
                );
              }
              const seen = new Set(items.map(entry => entry && entry.id));
              for (let page = 1; page <= MAX_THREAD_PAGES; page += 1) {
                const targetPage = lastPage - (page - 1);
                if (targetPage < 1) break;
                const { data } = await request({ ...params, page: targetPage });
                noteRead();
                if (!Array.isArray(data) || data.length === 0) continue;
                for (const entry of data) {
                  if (!entry || seen.has(entry.id)) continue;
                  seen.add(entry.id);
                  items.push(entry);
                }
              }
            }
            // Single-pass memoization (#254): gate listings are shared per
            // branch/sha/event/workflow and issue priority per issue number, so
            // repeated checks in one reconciliation never re-fetch.
            const gateCache = new Map();
            const issueCache = new Map();

            const RATE_LIMIT_RE =
              /Review rate limited|Review limit reached/i;
            const REQUESTED_LABEL = 'coderabbit-review-requested';
            const FULL_REVIEW_COMMAND_RE =
              /^@coderabbitai\s+(?:full\s+)?review(?:\s*$|\s*\n)/i;
            const FULL_REVIEW_COMMAND_HEAD_RE =
              /<!-- continuum-coderabbit-command head=([0-9a-f]{40}) -->/i;
            function fullReviewCommandTargetsHead(comment, headSha) {
              const match = String(comment?.body || '').match(
                FULL_REVIEW_COMMAND_HEAD_RE
              );
              // Legacy commands predate exact-HEAD markers. Keep them
              // conservative; every command emitted by the current controller
              // is marked and can be invalidated immediately when HEAD moves.
              return !match || match[1].toLowerCase() === String(headSha).toLowerCase();
            }
            const priorityRank = new Map([
              ['priority:p0', 0],
              ['priority:p1', 1],
              ['priority:p2', 2],
            ]);
            const requiredWorkflowGateLabel =
              String(process.env.REQUIRED_WORKFLOW_GATE_LABEL || '').trim();
            const requiredWorkflowGateName =
              String(process.env.REQUIRED_WORKFLOW_GATE_NAME || '').trim();

            // CodeRabbit currently provides one included full review per hour.
            // A completed full review therefore moves the shared controller
            // window for every other PR, even if their old per-PR timer expired.
            const REVIEW_COOLDOWN_MS = 60 * 60_000;
            const NO_PROGRESS_MAX_REVIEWS = 3;
            const SAFETY_MARGIN_MS = 30_000;
            const IN_FLIGHT_TIMEOUT_MS = 30 * 60_000;
            // GitHub scheduled events are best-effort and have been observed
            // arriving hours late. Public repositories therefore keep one
            // serialized bounded waiter for the normal hourly CodeRabbit
            // quota window. Private repositories never pay this runner cost.
            const MAX_PUBLIC_DEFER_WAIT_MS = 70 * 60_000;
            // CodeRabbit's observed/fallback quota window is <=65 minutes.
            // Keep one serialized waiter alive rather than depending on GitHub
            // scheduled-event delivery, which can be delayed for hours.
            const MAX_CONTROLLER_WAIT_MS = 70 * 60_000;

            function retryWindowText(body = '') {
              const patterns = [
                /next\s+(?:included\s+)?review\b[^\n<.]{0,120}?\bavailable\b[^\n<.]{0,40}?\b(?:in|after)\s+([^\n<.]+)/i,
                /(?:try|retry)\s+again\b[^\n<.]{0,40}?\b(?:in|after)\s+([^\n<.]+)/i,
              ];
              for (const pattern of patterns) {
                const match = body.match(pattern);
                if (match) return match[1];
              }
              return null;
            }

            function parseDurationMs(text = '') {
              if (/less than\s+(?:a|one)\s+minute/i.test(text)) {
                return 60_000;
              }

              let totalMs = 0;
              let found = false;
              for (const part of text.matchAll(
                /(\d+)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)/gi
              )) {
                found = true;
                const value = Number(part[1]);
                const unit = part[2].toLowerCase();
                if (unit.startsWith('hour') || unit.startsWith('hr')) {
                  totalMs += value * 60 * 60_000;
                } else if (
                  unit.startsWith('minute') ||
                  unit.startsWith('min')
                ) {
                  totalMs += value * 60_000;
                } else {
                  totalMs += value * 1_000;
                }
              }
              return found ? totalMs : null;
            }

            function parseRetryDelayMs(body = '') {
              const windowText = retryWindowText(body);
              const parsed = windowText === null
                ? null
                : parseDurationMs(windowText);
              if (parsed !== null) return parsed;

              if (RATE_LIMIT_RE.test(body)) {
                core.warning(
                  'Could not parse CodeRabbit quota countdown; using 65-minute fallback.'
                );
                return 65 * 60_000;
              }
              return null;
            }

            // Keep parser behavior executable and visible inside the controller.
            const parserCases = [
              [
                'Review rate limited. Next included review available in 13 minutes.',
                13 * 60_000,
              ],
              [
                'Review rate limited. Your next included review will be available in 13 minutes.',
                13 * 60_000,
              ],
              [
                'Review limit reached. Your next review is available after 1 hour 5 minutes.',
                65 * 60_000,
              ],
              [
                'Review rate limited. Try again in less than a minute.',
                60_000,
              ],
            ];
            for (const [sample, expected] of parserCases) {
              const actual = parseRetryDelayMs(sample);
              if (actual !== expected) {
                throw new Error(
                  `CodeRabbit retry parser regression: expected ${expected}, got ${actual} for "${sample}"`
                );
              }
            }

            function hasLabel(pr, name) {
              return Boolean(
                name &&
                (pr.labels || []).some(label =>
                  (typeof label === 'string' ? label : label.name) === name
                )
              );
            }

            async function latestWorkflowForHead(pr, workflowName) {
              const cacheKey = `${pr.head.ref}|${pr.head.sha}|pull_request|${workflowName}`;
              if (gateCache.has(cacheKey)) return gateCache.get(cacheKey);
              // Branch/event-filtered server-side; only the newest runs can
              // decide the gate, so two pages bound the cost.
              const runs = await boundedList(
                (params) => readGithub.rest.actions.listWorkflowRunsForRepo(params),
                {
                  owner,
                  repo,
                  branch: pr.head.ref,
                  event: 'pull_request',
                  head_sha: pr.head.sha,
                  per_page: 100,
                },
                MAX_GATE_PAGES
              );

              const latest = runs
                .filter(run =>
                  run.name === workflowName &&
                  run.head_sha === pr.head.sha
                )
                .sort(
                  (a, b) =>
                    (new Date(b.updated_at || b.created_at).getTime() -
                      new Date(a.updated_at || a.created_at).getTime()) ||
                    (Number(b.run_attempt || 0) -
                      Number(a.run_attempt || 0))
                )[0] || null;
              gateCache.set(cacheKey, latest);
              return latest;
            }

            async function currentHeadReviewGate(pr) {
              try {
                const labelConfigured = Boolean(requiredWorkflowGateLabel);
                const nameConfigured = Boolean(requiredWorkflowGateName);
                if (labelConfigured !== nameConfigured) {
                  core.warning(
                    'Required workflow gate configuration is incomplete: both CONTINUUM_REQUIRED_WORKFLOW_GATE_LABEL and CONTINUUM_REQUIRED_WORKFLOW_GATE_NAME must be set together.'
                  );
                  return {
                    ready: false,
                    reason: 'required workflow gate configuration is incomplete',
                  };
                }

                const ci = await latestWorkflowForHead(pr, 'CI');
                if (
                  !ci ||
                  ci.status !== 'completed' ||
                  ci.conclusion !== 'success'
                ) {
                  return {
                    ready: false,
                    reason: `CI is ${ci ? `${ci.status}/${ci.conclusion || 'pending'}` : 'missing'}`,
                  };
                }

                // Match auto-merge: Packaging smoke is conditional/path-filtered.
                // Absence is allowed; an API inspection failure is not. The
                // surrounding try/catch fails this PR closed on unknown state.
                const packagingSmoke =
                  await latestWorkflowForHead(pr, 'Packaging smoke');
                if (
                  packagingSmoke &&
                  (
                    packagingSmoke.status !== 'completed' ||
                    packagingSmoke.conclusion !== 'success'
                  )
                ) {
                  return {
                    ready: false,
                    reason:
                      `Packaging smoke is ${packagingSmoke.status}/${packagingSmoke.conclusion || 'pending'}`,
                  };
                }

                if (
                  labelConfigured &&
                  hasLabel(pr, requiredWorkflowGateLabel)
                ) {
                  const required =
                    await latestWorkflowForHead(pr, requiredWorkflowGateName);
                  if (
                    !required ||
                    required.status !== 'completed' ||
                    required.conclusion !== 'success'
                  ) {
                    return {
                      ready: false,
                      reason:
                        `required workflow '${requiredWorkflowGateName}' is ${required ? `${required.status}/${required.conclusion || 'pending'}` : 'missing'}`,
                    };
                  }
                }

                return {
                  ready: true,
                  reason: 'all pre-review merge gates are green',
                };
              } catch (err) {
                core.warning(
                  `PR #${pr.number}: could not inspect pre-review workflow gates; skipping this PR for this pass: ${err.message}`
                );
                return {
                  ready: false,
                  reason: 'workflow gate state is unknown',
                };
              }
            }

            function sourceIssueNumber(pr) {
              const branchMatch =
                (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (branchMatch) return Number(branchMatch[1]);

              const bodyMatch =
                (pr.body || '').match(/\b(?:Closes|Fixes|Resolves)\s+#(\d+)\b/i);
              return bodyMatch ? Number(bodyMatch[1]) : null;
            }

            async function sourcePriority(pr) {
              const issueNumber = sourceIssueNumber(pr);
              if (!issueNumber) {
                // A PR without a source issue must not starve forever behind an
                // unbounded prioritized queue. Treat it as a deterministic P2
                // fallback for review scheduling while keeping the diagnostic
                // label explicit.
                return {
                  issueNumber: Number.MAX_SAFE_INTEGER,
                  priority: 'unprioritized:p2-fallback',
                  rank: priorityRank.get('priority:p2'),
                };
              }

              try {
                let issue = issueCache.get(issueNumber);
                if (!issue) {
                  const { data } = await readGithub.rest.issues.get({
                    owner,
                    repo,
                    issue_number: issueNumber,
                  });
                  noteRead();
                  issue = data;
                  issueCache.set(issueNumber, issue);
                }
                const labels = new Set(
                  (issue.labels || []).map(label =>
                    typeof label === 'string' ? label : label.name
                  )
                );
                for (const name of ['priority:p0', 'priority:p1', 'priority:p2']) {
                  if (labels.has(name)) {
                    return {
                      issueNumber,
                      priority: name,
                      rank: priorityRank.get(name),
                    };
                  }
                }
              } catch (err) {
                if (err.status !== 404) throw err;
              }

              return {
                issueNumber,
                priority: 'unprioritized:p2-fallback',
                rank: priorityRank.get('priority:p2'),
              };
            }

            async function latestCodeRabbitStatus(pr) {
              const { data: combined } =
                await readGithub.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                });
              noteRead();

              return (combined.statuses || [])
                .filter(status => status.context === 'CodeRabbit')
                .sort(
                  (a, b) =>
                    new Date(b.updated_at || b.created_at).getTime() -
                    new Date(a.updated_at || a.created_at).getTime()
                )[0] || null;
            }

            function codeRabbitExplicitlyResolved(body = '') {
              // UNRESOLVED contains RESOLVED as a substring, so reject it first.
              // Then accept the same semantic token used by the wake trigger,
              // regardless of markdown decoration.
              if (/\bUNRESOLVED\b/i.test(body)) return false;
              return (
                /\bRESOLVED\b/i.test(body) ||
                /✅\s*Review thread resolved\.?/i.test(body)
              );
            }

            async function unresolvedCodeRabbitThreads(pr) {
              const unresolved = [];
              let cursor = null;
              // Bounded thread walk (#254): cap GraphQL pages so one PR
              // with deep thread history cannot scale the pass. Truncation
              // fails closed for this PR (skipped this pass, retried on the
              // next wake-up) and never blocks the rest of the queue.
              let threadPages = 0;

              try {
                do {
                  threadPages += 1;
                  if (threadPages > MAX_THREAD_PAGES) {
                    core.warning(
                      `PR #${pr.number}: review-thread scan hit the ${MAX_THREAD_PAGES}-page budget; skipping this PR for this pass.`
                    );
                    throw new Error(`CONTINUUM_THREAD_BUDGET_EXCEEDED pr=${pr.number}`);
                  }
                  const data = await readGithub.graphql(
                    `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            nodes {
                              id
                              isResolved
                              comments(first: 100) {
                                nodes {
                                  databaseId
                                  body
                                  author { login }
                                }
                              }
                            }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }`,
                    {
                      owner,
                      repo,
                      number: pr.number,
                      cursor,
                    }
                  );
                  noteRead();

                  const connection =
                    data.repository?.pullRequest?.reviewThreads;
                  if (!connection) {
                    core.warning(
                      `PR #${pr.number}: review-thread query returned no pull request; skipping this PR for the current reconciliation.`
                    );
                    return null;
                  }

                  for (const thread of connection.nodes || []) {
                    const comments = thread.comments?.nodes || [];
                    const root = comments[0];
                    if (!root?.author?.login?.startsWith('coderabbitai')) {
                      continue;
                    }
                    if (thread.isResolved) continue;

                    // CodeRabbit's semantic RESOLVED reply is authoritative even
                    // when GitHub has not flipped the thread bit yet. The
                    // auto-merger later normalizes that bit with its write token.
                    const latestComment = comments.at(-1);
                    if (
                      latestComment &&
                      latestComment.author?.login?.startsWith('coderabbitai') &&
                      codeRabbitExplicitlyResolved(latestComment.body || '')
                    ) {
                      continue;
                    }

                    unresolved.push({
                      id: thread.id,
                      commentId: root.databaseId,
                    });
                  }

                  cursor = connection.pageInfo.hasNextPage
                    ? connection.pageInfo.endCursor
                    : null;
                } while (cursor);

                return unresolved;
              } catch (err) {
                // The thread-budget sentinel must reach the outer per-PR
                // skip path instead of collapsing into a null return that
                // callers could misread as zero unresolved threads.
                if (String(err?.message || '').includes('CONTINUUM_THREAD_BUDGET_EXCEEDED')) throw err;
                // A transient query/permission/deletion race on one PR must not
                // abort reconciliation for every other PR. Fail closed for this
                // PR and let the next event or safety-net pass retry it.
                core.warning(
                  `PR #${pr.number}: could not inspect CodeRabbit review threads; skipping this PR for this pass: ${err.message}`
                );
                return null;
              }
            }

            function latestCurrentHeadDecision(reviews, headSha) {
              return (reviews || [])
                .filter(review =>
                  review.user?.login?.startsWith('coderabbitai') &&
                  review.commit_id === headSha &&
                  (review.state === 'APPROVED' ||
                   review.state === 'CHANGES_REQUESTED')
                )
                .sort((a, b) => {
                  const time =
                    new Date(a.submitted_at || 0).getTime() -
                    new Date(b.submitted_at || 0).getTime();
                  return time || Number(a.id) - Number(b.id);
                })
                .at(-1) || null;
            }


            async function collectState() {
              // Refresh per-pass memoization: gate/issue state may advance between passes, so never reuse the previous pass.
              gateCache.clear();
              issueCache.clear();
              // Bounded queue scan (#254): the priority queue only needs
              // currently open PRs against main, capped at MAX_QUEUE_PAGES.
              const pulls = await boundedList(
                (params) => readGithub.rest.pulls.list(params),
                {
                  owner,
                  repo,
                  state: 'open',
                  base: 'main',
                  per_page: 100,
                },
                MAX_QUEUE_PAGES
              );

              let latestCompletedReviewAt = 0;
              let latestInFlightCommand = null;
              let latestRateLimitAt = 0;
              let globalRateLimitNotBefore = 0;
              const candidates = [];

              for (const listed of pulls) {
                try {
                // The listing already carries the full PR representation
                // (state, draft, head, labels, body): reusing it removes
                // one pulls.get per queued PR per pass (#254).
                const pr = listed;

                if (
                  pr.state !== 'open' ||
                  pr.draft ||
                  pr.head.repo?.full_name !== repoFullName
                ) {
                  continue;
                }

                // Bounded per-PR scans (#254): review/comment state that
                // decides queue eligibility lives on recent records; a
                // truncated oldest-first window is re-anchored at the newest
                // end below, so a chatty PR is still serviced instead of
                // deferred on every pass while its history only grows.
                const reviews = await boundedList(
                  (params) => readGithub.rest.pulls.listReviews(params),
                  {
                    owner,
                    repo,
                    pull_number: pr.number,
                    per_page: 100,
                  },
                  MAX_THREAD_PAGES
                );

                const comments = await boundedList(
                  (params) => readGithub.rest.issues.listComments(params),
                  {
                    owner,
                    repo,
                    issue_number: pr.number,
                    per_page: 100,
                  },
                  MAX_THREAD_PAGES
                );

                // Recover on truncation: both listings are oldest-first,
                // so a truncated window hides the newest records that decide
                // eligibility. Merge a bounded newest-first window into each
                // truncated scan and decide on the merged set, so a PR with
                // sustained high activity is still serviced instead of
                // skipped on every pass while the same truncation recurs.
                // Only a newest-recovery failure defers the PR to the next
                // wake-up; a middle window may stay unseen on very large
                // threads, which the warning below calls out.
                if (reviews.truncated || comments.truncated) {
                  try {
                    if (comments.truncated) {
                      await mergeNewestWindow(
                        (params) => readGithub.rest.issues.listComments(params),
                        {
                          owner,
                          repo,
                          issue_number: pr.number,
                          per_page: 100,
                        },
                        comments,
                        'comments'
                      );
                      comments.truncated = false;
                    }
                    if (reviews.truncated) {
                      await mergeNewestWindow(
                        (params) => readGithub.rest.pulls.listReviews(params),
                        {
                          owner,
                          repo,
                          pull_number: pr.number,
                          per_page: 100,
                        },
                        reviews,
                        'reviews'
                      );
                      reviews.truncated = false;
                    }
                    core.warning(
                      `PR #${pr.number}: comment/review scan hit the ${MAX_THREAD_PAGES}-page budget; deciding on the merged oldest+newest window.`
                    );
                  } catch {
                    core.warning(`PR #${pr.number}: comment/review scan hit budget and newest-window recovery failed; skipping this pass.`);
                    continue;
                  }
                }

                // CodeRabbit's included-review quota is repository/account
                // shared, not per PR. A provider rate-limit reply on any open
                // PR therefore creates one global not-before floor for the
                // whole queue. Without this, the controller can immediately
                // hammer the next PR and receive the same limit again.
                for (const comment of comments) {
                  if (
                    comment.user?.login !== 'coderabbitai[bot]' ||
                    !RATE_LIMIT_RE.test(comment.body || '')
                  ) {
                    continue;
                  }
                  const delayMs = parseRetryDelayMs(comment.body || '');
                  if (delayMs === null) continue;
                  const at = new Date(
                    comment.updated_at || comment.created_at
                  ).getTime();
                  // A newer provider reply supersedes an older estimate.
                  // This matters when an older response had no countdown and
                  // used the conservative 65-minute fallback, while a later
                  // response provides the real shorter reset window.
                  if (at > latestRateLimitAt) {
                    latestRateLimitAt = at;
                    globalRateLimitNotBefore =
                      at + delayMs + SAFETY_MARGIN_MS;
                  }
                }

                const carriedApprovalMarker = comments.some(comment =>
                  comment.user?.login === owner &&
                  (comment.body || '').includes(
                    `<!-- auto-main-sync head=${pr.head.sha}`
                  )
                );

                // A repository-wide review slot remains occupied from the
                // instant the controller posts a full-review command until
                // CodeRabbit either rejects it with a rate-limit response or
                // submits a full review decision. This closes the race where
                // several controller wake-ups could spend the same shared slot
                // before CodeRabbit had time to respond to the first command.
                const commands = comments
                  .filter(comment =>
                    comment.user?.login !== 'coderabbitai[bot]' &&
                    FULL_REVIEW_COMMAND_RE.test(comment.body?.trim() || '') &&
                    fullReviewCommandTargetsHead(comment, pr.head.sha)
                  )
                  .sort(
                    (a, b) =>
                      new Date(b.created_at).getTime() -
                      new Date(a.created_at).getTime()
                  );

                for (const command of commands) {
                  const commandAt = new Date(command.created_at).getTime();
                  const rateLimitedAfter = comments.some(comment =>
                    comment.user?.login === 'coderabbitai[bot]' &&
                    RATE_LIMIT_RE.test(comment.body || '') &&
                    new Date(
                      comment.updated_at || comment.created_at
                    ).getTime() > commandAt
                  );
                  const reviewedAfter = reviews.some(review => {
                    if (
                      !review.user?.login?.startsWith('coderabbitai') ||
                      !review.submitted_at
                    ) {
                      return false;
                    }
                    const fullReview =
                      review.state === 'APPROVED' ||
                      review.state === 'CHANGES_REQUESTED' ||
                      (
                        review.state === 'COMMENTED' &&
                        Boolean((review.body || '').trim())
                      );
                    return (
                      fullReview &&
                      new Date(review.submitted_at).getTime() > commandAt
                    );
                  });

                  if (!rateLimitedAfter && !reviewedAfter) {
                    if (
                      !latestInFlightCommand ||
                      commandAt > latestInFlightCommand.at
                    ) {
                      latestInFlightCommand = {
                        prNumber: pr.number,
                        at: commandAt,
                        headSha: pr.head.sha,
                      };
                    }
                    break;
                  }
                }

                let fullReviewCount = 0;
                for (const review of reviews) {
                  if (
                    !review.user?.login?.startsWith('coderabbitai') ||
                    !review.submitted_at
                  ) {
                    continue;
                  }

                  // APPROVED / CHANGES_REQUESTED are full review decisions.
                  // COMMENTED is counted only when it has a non-empty body,
                  // which covers full-review nitpick summaries but avoids
                  // treating empty thread-verification shells as quota use.
                  const fullReview =
                    review.state === 'APPROVED' ||
                    review.state === 'CHANGES_REQUESTED' ||
                    (
                      review.state === 'COMMENTED' &&
                      Boolean((review.body || '').trim())
                    );
                  if (!fullReview) continue;

                  fullReviewCount += 1;
                  latestCompletedReviewAt = Math.max(
                    latestCompletedReviewAt,
                    new Date(review.submitted_at).getTime()
                  );
                }

                const noProgressMarkerPrefix =
                  `<!-- continuum-coderabbit-no-progress head=${pr.head.sha} `;
                const noProgressMarkers = comments
                  .filter(comment => {
                    const login = comment.user?.login || '';
                    const trusted =
                      login === 'github-actions[bot]' || login === owner;
                    return trusted &&
                      (comment.body || '').includes(noProgressMarkerPrefix);
                  })
                  .sort(
                    (a, b) =>
                      new Date(b.created_at || 0).getTime() -
                      new Date(a.created_at || 0).getTime()
                  );
                const latestNoProgress = noProgressMarkers[0] || null;
                const noProgressAt = latestNoProgress
                  ? new Date(latestNoProgress.created_at || 0).getTime()
                  : 0;
                const laterApproval = latestNoProgress && reviews.some(review =>
                  review.user?.login?.startsWith('coderabbitai') &&
                  review.commit_id === pr.head.sha &&
                  review.state === 'APPROVED' &&
                  new Date(review.submitted_at || 0).getTime() > noProgressAt
                );
                const noProgressRetryDueAt =
                  latestNoProgress && !laterApproval
                    ? noProgressAt + REVIEW_COOLDOWN_MS
                    : 0;
                if (
                  latestNoProgress &&
                  !laterApproval &&
                  noProgressMarkers.length >= NO_PROGRESS_MAX_REVIEWS
                ) {
                  core.warning(
                    `PR #${pr.number}: exact HEAD ${pr.head.sha} exhausted bounded non-code CodeRabbit re-review budget (${noProgressMarkers.length}/${NO_PROGRESS_MAX_REVIEWS}); waiting for a new HEAD or later explicit approval.`
                  );
                  continue;
                }

                const labels = new Set(
                  (pr.labels || []).map(label =>
                    typeof label === 'string' ? label : label.name
                  )
                );
                if (!labels.has('review-ready')) continue;

                const reviewGate = await currentHeadReviewGate(pr);
                if (!reviewGate.ready) {
                  core.info(
                    `PR #${pr.number}: not eligible for a CodeRabbit full-review slot yet: ${reviewGate.reason}.`
                  );
                  continue;
                }

                // Full review is a finalization step, not a substitute for
                // finding verification. Wait until every CodeRabbit-authored
                // thread is resolved (including semantic RESOLVED replies)
                // before spending another included review.
                const unresolvedThreads =
                  await unresolvedCodeRabbitThreads(pr);
                if (unresolvedThreads === null) {
                  continue;
                }
                if (unresolvedThreads.length > 0) {
                  // Finding verification is owned by the existing auto-merge
                  // reconciler. Keep this quota controller read-only for
                  // Actions so older open PR callers with actions:read remain
                  // compatible; their review/review-comment wakeups will
                  // re-enter the queue as verification converges.
                  core.info(
                    `PR #${pr.number}: waiting for ${unresolvedThreads.length} unresolved CodeRabbit thread(s) before final full review.`
                  );
                  continue;
                }

                const currentDecision =
                  latestCurrentHeadDecision(reviews, pr.head.sha);
                if (currentDecision?.state === 'APPROVED') {
                  continue;
                }

                // Non-code/task-contract blockers are represented by the
                // durable exact-HEAD no-progress marker handled above. Do not
                // re-classify a summary-only review here: an older sibling
                // review on the same HEAD may still own actionable findings.
                // Keeping one authoritative marker avoids contradictory queue
                // decisions and preserves the convergence contract.


                const requested = labels.has(REQUESTED_LABEL);
                const rabbitStatus = await latestCodeRabbitStatus(pr);
                const finalReview =
                  fullReviewCount > 0 ||
                  reviews.some(review =>
                    review.user?.login?.startsWith('coderabbitai') &&
                    review.state === 'CHANGES_REQUESTED'
                  );

                let dueAt = 0;
                let kind = finalReview ? 'final-review' : 'initial';

                if (
                  rabbitStatus &&
                  RATE_LIMIT_RE.test(rabbitStatus.description || '')
                ) {
                  const latestLimit = comments
                    .filter(comment =>
                      comment.user?.login === 'coderabbitai[bot]' &&
                      RATE_LIMIT_RE.test(comment.body || '')
                    )
                    .map(comment => {
                      const delayMs = parseRetryDelayMs(comment.body || '');
                      if (delayMs === null) return null;
                      return {
                        comment,
                        delayMs,
                        at: new Date(
                          comment.updated_at || comment.created_at
                        ).getTime(),
                      };
                    })
                    .filter(Boolean)
                    .sort((a, b) => b.at - a.at)[0];

                  if (!latestLimit) continue;

                  const commandAfterLimit = comments.some(comment =>
                    comment.user?.login !== 'coderabbitai[bot]' &&
                    FULL_REVIEW_COMMAND_RE.test(comment.body?.trim() || '') &&
                    new Date(comment.created_at).getTime() > latestLimit.at
                  );
                  if (commandAfterLimit) continue;

                  dueAt =
                    latestLimit.at +
                    latestLimit.delayMs +
                    SAFETY_MARGIN_MS;
                  kind = 'retry';
                } else {
                  // Initial full reviews are also globally serialized. The
                  // requested label is acquired only by this controller when it
                  // actually emits the command for the current head.
                  if (requested) {
                    // A carried approval intentionally has the requested label
                    // without a new CodeRabbit command for this HEAD.
                    if (carriedApprovalMarker) continue;

                    // The requested label is a lock, not a permanent terminal
                    // state. If CodeRabbit never produced a full review or a
                    // rate-limit response, retry the current head after the
                    // in-flight timeout. This recovers from terminal command
                    // failures such as "Pull request base or head changed" and
                    // from lost webhook/status wake-ups.
                    const latestCommand = commands[0] || null;
                    if (latestCommand) {
                      dueAt =
                        new Date(latestCommand.created_at).getTime() +
                        IN_FLIGHT_TIMEOUT_MS;
                      kind = 'stale-retry';
                    } else {
                      // Defensive recovery for a lock label left behind without
                      // any matching review command.
                      dueAt = 0;
                      kind = 'orphan-lock-retry';
                    }
                  }
                }

                if (noProgressRetryDueAt > 0) {
                  dueAt = Math.max(dueAt, noProgressRetryDueAt);
                  kind = 'no-progress-retry';
                }

                const priority = await sourcePriority(pr);
                candidates.push({
                  prNumber: pr.number,
                  headSha: pr.head.sha,
                  dueAt,
                  kind,
                  stage: finalReview ? 'final-review' : 'initial-review',
                  stageRank: finalReview ? 0 : 1,
                  createdAt: new Date(pr.created_at || 0).getTime(),
                  fullReviewCount,
                  ...priority,
                });
                } catch (err) {
                  core.warning(
                    `PR #${listed.number}: queue reconciliation failed for this PR; skipping it for this pass: ${err.message}`
                  );
                  continue;
                }
              }

              const completedReviewNotBefore = latestCompletedReviewAt
                ? latestCompletedReviewAt +
                  REVIEW_COOLDOWN_MS +
                  SAFETY_MARGIN_MS
                : 0;
              // A later completed full review supersedes an older limit reply;
              // otherwise the newest parsed provider reset is authoritative for
              // every PR in this shared queue.
              const activeGlobalRateLimitNotBefore =
                latestRateLimitAt > latestCompletedReviewAt
                  ? globalRateLimitNotBefore
                  : 0;
              const globalNotBefore = Math.max(
                completedReviewNotBefore,
                activeGlobalRateLimitNotBefore
              );

              for (const candidate of candidates) {
                candidate.effectiveDueAt = Math.max(
                  candidate.dueAt,
                  globalNotBefore
                );
              }

              return {
                candidates,
                latestCompletedReviewAt,
                latestRateLimitAt,
                globalRateLimitNotBefore: activeGlobalRateLimitNotBefore,
                globalNotBefore,
                latestInFlightCommand,
              };
            }

            function candidateOrder(a, b) {
              // Priority is the hard primary key and must never be bypassed:
              // P0 > P1 > P2. PRs without a source issue use the explicit P2
              // fallback above so they cannot silently starve forever.
              //
              // Within one priority class, a merge-ready final review beats a
              // first review. Oldest PR then wins among otherwise equivalent
              // candidates, which prevents a constant stream of new work from
              // starving an older candidate.
              return (
                a.rank - b.rank ||
                a.stageRank - b.stageRank ||
                a.fullReviewCount - b.fullReviewCount ||
                a.createdAt - b.createdAt ||
                a.issueNumber - b.issueNumber ||
                a.prNumber - b.prNumber
              );
            }

            async function chooseDueCandidate(state) {
              const now = Date.now();
              return state.candidates
                .filter(candidate => candidate.effectiveDueAt <= now)
                .sort(candidateOrder)[0] || null;
            }

            async function waitUntil(whenMs, reason) {
              const now = Date.now();
              if (whenMs <= now) return;
              const waitMs = whenMs - now;
              if (waitMs > MAX_CONTROLLER_WAIT_MS) {
                throw new Error(
                  `CodeRabbit wait ${Math.ceil(waitMs / 60_000)} minutes exceeds the bounded controller contract (${MAX_CONTROLLER_WAIT_MS / 60_000} minutes): ${reason}`
                );
              }
              core.notice(
                `CodeRabbit controller waiting ${Math.ceil(waitMs / 1000)}s until ${new Date(whenMs).toISOString()} (${reason}). Newer lifecycle events cancel this waiter and revalidate latest state.`
              );
              await new Promise(resolve => setTimeout(resolve, waitMs));
            }

            // One serialized controller owns future liveness. This deliberately
            // does not rely on GitHub cron delivery: scheduled events can be
            // delayed for hours. Any new review/comment/controller event cancels
            // this run via concurrency and starts a fresh reconciliation.
            let state;
            let selected = null;
            while (!selected) {
              state = await collectState();

              if (state.latestInFlightCommand) {
                const ageMs = Date.now() - state.latestInFlightCommand.at;
                if (ageMs < IN_FLIGHT_TIMEOUT_MS) {
                  await waitUntil(
                    state.latestInFlightCommand.at + IN_FLIGHT_TIMEOUT_MS,
                    `in-flight review slot for PR #${state.latestInFlightCommand.prNumber}`
                  );
                  continue;
                }
                core.warning(
                  `CodeRabbit command for PR #${state.latestInFlightCommand.prNumber} has had no rate-limit response or full review for ${Math.ceil(ageMs / 60_000)} minutes; treating the slot lock as stale.`
                );
              }

              selected = await chooseDueCandidate(state);
              if (selected) break;

              if (state.candidates.length === 0) {
                core.notice('No CodeRabbit review is currently queued.');
                reportBudget();
                return;
              }

              const nextAt = Math.min(
                ...state.candidates.map(candidate => candidate.effectiveDueAt)
              );
              const queue = [...state.candidates]
                .sort(candidateOrder)
                .map(candidate =>
                  `#${candidate.prNumber}/issue#${candidate.issueNumber === Number.MAX_SAFE_INTEGER ? '?' : candidate.issueNumber} ${candidate.priority} stage=${candidate.stage} reviews=${candidate.fullReviewCount} due=${new Date(candidate.effectiveDueAt).toISOString()}`
                )
                .join(', ');

              core.notice(
                `CodeRabbit queue: ${queue}. Earliest legal slot is ${new Date(nextAt).toISOString()}.`
              );
              await waitUntil(nextAt, 'shared CodeRabbit quota window');
            }

            // Final exact-head/status/comment revalidation is implicit in the
            // fresh collectState() result above. Rank only candidates that are
            // legally due; P0 beats P1 beats P2, then lower source issue number.
            let acquiredInitialLock = false;
            if (selected.kind === 'initial') {
              await commentGithub.rest.issues.addLabels({
                owner,
                repo,
                issue_number: selected.prNumber,
                labels: [REQUESTED_LABEL],
              });
              apiBudget.mutations += 1;
              acquiredInitialLock = true;
            }

            try {
              await commentGithub.rest.issues.createComment({
                owner,
                repo,
                issue_number: selected.prNumber,
                // Continuum comment attribution (kodmial/continuum#258): the
                // @coderabbitai command stays first so the review request
                // still triggers; the header is the first rendered line.
                body: `@coderabbitai full review\n\n⚡ **Continuum · coderabbit-retry**\n<!-- continuum-origin role=continuum component=coderabbit-retry -->\n<!-- continuum-coderabbit-command head=${selected.headSha} -->`,
              });
              apiBudget.mutations += 1;
            } catch (err) {
              if (acquiredInitialLock) {
                try {
                  await commentGithub.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: selected.prNumber,
                    name: REQUESTED_LABEL,
                  });
                  apiBudget.mutations += 1;
                } catch (_) {}
              }
              throw err;
            }

            core.notice(
              `Selected PR #${selected.prNumber} from issue #${selected.issueNumber === Number.MAX_SAFE_INTEGER ? '?' : selected.issueNumber} (${selected.priority}, ${selected.stage}, ${selected.kind}) for the next CodeRabbit slot at head ${selected.headSha}.`
            );
            reportBudget();
