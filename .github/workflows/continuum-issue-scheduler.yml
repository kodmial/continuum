name: Issue scheduler

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      wip_limit:
        description: >-
          Concurrent in-progress issues the scheduler may hold. Empty falls
          back to AUTOMATION_WIP_LIMIT.
        type: string
        required: false
        default: ''
      lease_minutes:
        description: >-
          Minutes a reservation stays valid without a PR appearing. Empty falls
          back to AUTOMATION_LEASE_MINUTES.
        type: string
        required: false
        default: ''
      max_dispatch_attempts:
        description: >-
          Dispatch attempts before an issue is paused. Empty falls back to
          AUTOMATION_MAX_DISPATCH_ATTEMPTS.
        type: string
        required: false
        default: ''
      dispatch_marker:
        description: >-
          Hidden HTML marker written into each dispatch comment and counted
          towards max_dispatch_attempts. Empty falls back to
          AUTOMATION_DISPATCH_MARKER. Must match the marker the consumer's
          OpenCode workflow and the OpenCode watchdog are called with.
        type: string
        required: false
        default: '<!-- issue-scheduler-dispatch -->'
      in_progress_label:
        description: >-
          Label holding a reservation while OpenCode starts. Empty falls back to
          AUTOMATION_IN_PROGRESS_LABEL. Must match the watchdog's
          in_progress_label.
        type: string
        required: false
        default: 'automation:in-progress'
      pause_marker:
        description: >-
          Label that pauses automation until removed by a human. Empty falls
          back to AUTOMATION_PAUSE_LABEL. Must match the watchdog's
          pause_marker.
        type: string
        required: false
        default: 'automation:paused'
      qualifying_label:
        description: >-
          Label marking implementation-merged capabilities that are waiting
          on mandatory live qualification. Empty falls back to
          AUTOMATION_QUALIFYING_LABEL. The qualification gate adds it
          instead of closing the issue when an implementation PR merges
          while mandatory qualification is still pending.
        type: string
        required: false
        default: 'automation:qualifying'
      blocked_label:
        description: >-
          Label marking capabilities whose mandatory qualification failed
          and that need repair. Empty falls back to
          AUTOMATION_BLOCKED_LABEL. The qualification gate adds it on
          qualification failure and clears it when a rerun is due.
        type: string
        required: false
        default: 'automation:blocked'
      post_pause_comment:
        description: >-
          Post a comment on an issue when the scheduler pauses it. Only the
          exact string `false` disables the comment; any other value, empty
          included, keeps it enabled.
        type: string
        required: false
        default: 'true'
      reset_markers:
        description: >-
          Clear existing dispatch markers before dispatching, so a consumer
          restarting automation does not inherit a spent attempt budget.
        type: string
        required: false
        default: 'false'
      require_priority_label:
        description: >-
          Dispatch only issues carrying a priority label. Empty falls back to
          AUTOMATION_REQUIRE_PRIORITY_LABEL.
        type: string
        required: false
        default: 'false'
      command_grace_minutes:
        description: >-
          Race window after a manual owner `/oc` in which the scheduler will not
          enqueue a second OpenCode run. Empty falls back to
          AUTOMATION_COMMAND_GRACE_MINUTES.
        type: string
        required: false
        default: '5'
      child_owned_marker:
        description: >-
          Deprecated compatibility input. Repository-level child routing is
          controlled by CONTINUUM_ROLE; issue body markers no longer affect
          scheduler admission.
        type: string
        required: false
        default: '<!-- continuum-child-owned -->'
      legacy_child_owned_marker:
        description: >-
          Deprecated compatibility input retained so older callers keep working.
          Legacy issue body markers no longer affect scheduler admission.
        type: string
        required: false
        default: '<!-- runtime-worker-owned -->'
      opencode_workflow_name:
        description: >-
          `name:` of the consumer's OpenCode caller whose in-flight runs count as
          active work. Empty falls back to CONTINUUM_OPENCODE_WORKFLOW_NAME.
        type: string
        required: false
        default: 'OpenCode agent'
      opencode_workflow_path:
        description: >-
          Path of the consumer's OpenCode caller, for callers whose runs predate
          `run-name:`. Empty falls back to CONTINUUM_OPENCODE_WORKFLOW_PATH.
        type: string
        required: false
        default: '.github/workflows/continuum-opencode.yml'
      dispatch_ref:
        description: >-
          Git ref every `workflow_dispatch` from this job targets. Dispatching
          at a branch other than the one holding the workflow avoids a self-run
          on a consumer that pushes to main. Empty falls back to
          vars.CONTINUUM_DISPATCH_REF, then to `main`.
        type: string
        required: false
        default: 'main'
      opencode_dispatch:
        description: >-
          How a ready issue reaches OpenCode: `comment` posts the owner's `/oc`
          command on the issue (the default, and the only path that needs no
          extra permission), `workflow` dispatches the OpenCode caller's
          `issue` mode directly instead. Use `workflow` only when the OpenCode
          caller is installed without an `issue_comment` trigger. Any other
          value fails the run, because `workflow_call` cannot declare an
          enumerated `choice` input. Empty falls back to
          vars.CONTINUUM_OPENCODE_DISPATCH.
        type: string
        required: false
        default: 'comment'
      execution_label_routes:
        description: >-
          Label-driven execution routes, one per line, as
          `<issue label>|<workflow file name>|<input>=<value>,...`. When a
          selected issue carries one of these labels the scheduler dispatches
          that workflow with those inputs plus `issue_number` instead of waking
          OpenCode, and still records the dispatch marker. Empty (the default)
          routes nothing, so no execution workflow is dispatched by label.
          Empty falls back to vars.CONTINUUM_EXECUTION_LABEL_ROUTES.
        type: string
        required: false
        default: ''
      child_dispatch_workflow:
        description: >-
          Workflow file name the scheduler wakes after every reconcile pass, so
          a parent repository's downstream dispatcher does not have to wait for
          its own cron. Empty — the default — wakes nothing, because a parent
          that has no dispatcher must not get a 404 dispatch. Empty falls back
          to vars.CONTINUUM_CHILD_DISPATCH_WORKFLOW.
        type: string
        required: false
        default: ''
      count_open_prs_as_wip:
        description: >-
          Whether an open OpenCode PR consumes an implementation WIP slot.
          Keep true for legacy consumers that intentionally cap open PRs;
          set false when WIP means actively running implementation only.
        type: string
        required: false
        default: 'true'
      pause_on_failure:
        description: >-
          Whether exhausted dispatches or closed-without-merge OpenCode PRs
          enter a terminal automation pause. Set false for fully autonomous
          consumers that must keep retrying without human intervention.
        type: string
        required: false
        default: 'true'

# No `actions: write` here: every dispatch in this workflow authenticates with
# the TAP_PAT classic PAT (repo + workflow scopes), exactly like every other
# Continuum dispatcher, so the caller's GITHUB_TOKEN keeps its narrow grant.
permissions:
  contents: read

concurrency:
  group: issue-scheduler
  cancel-in-progress: false

jobs:
  wake_parent:
    # Child repositories never schedule work locally. Event-driven caller runs
    # only verify the bidirectional relationship and wake the parent's public
    # scheduler; the caller keeps child cron events skipped to avoid consuming
    # private child runner minutes as a polling mechanism.
    if: vars.CONTINUUM_ROLE == 'child' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_SCHEDULER_TIMEOUT_MINUTES || '5') }}
    concurrency:
      group: continuum-child-parent-wakeup
      cancel-in-progress: false
    steps:
      - name: Checkout Continuum engine for parent wake-up verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Verify relationship and wake parent scheduler
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/.continuum-engine/.github/scripts/delegation_runtime.py"

          # Fetch one named variable directly. Any API failure is
          # an outage and refuses the wake-up. Listing the whole collection
          # would truncate past 100 variables and over-expose values.
          fetch_variable() {
            local repository="$1" name="$2"
            local err_file value rc
            if [ -z "${RUNNER_TEMP:-}" ]; then
              echo "::error::Child relationship lookup is unavailable; parent wake-up refused." >&2
              return 4
            fi
            if ! err_file="$(mktemp -p "$RUNNER_TEMP" continuum-var-err.XXXXXX)"; then
              echo "::error::Child relationship lookup is unavailable; parent wake-up refused." >&2
              return 4
            fi
            if value="$(gh api "repos/$repository/actions/variables/$name" --jq '.value // ""' 2>"$err_file")"; then
              rc=0
            else
              rc=$?
              cat "$err_file" >&2 || true
            fi
            rm -f "$err_file"
            if [ "$rc" -eq 0 ]; then
              printf '%s' "$value"
              return 0
            fi
            return "$rc"
          }

          if ! child_role="$(fetch_variable "$GITHUB_REPOSITORY" CONTINUUM_ROLE)"; then
            echo "::error::Child relationship lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! child_id="$(fetch_variable "$GITHUB_REPOSITORY" CONTINUUM_CHILD_ID)"; then
            echo "::error::Child relationship lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! parent="$(fetch_variable "$GITHUB_REPOSITORY" CONTINUUM_PARENT)"; then
            echo "::error::Child relationship lookup is unavailable; parent wake-up refused."
            exit 4
          fi

          # Validate the child declaration with the same authoritative parser
          # used by parent-side delegated discovery. Values are never echoed.
          printf '::add-mask::%s\n' "$parent"
          printf '::add-mask::%s\n' "$child_id"
          if ! python3 "$runtime" verify-child-variables \
            --role "$child_role" \
            --declared-id "$child_id" \
            --declared-parent "$parent" \
            --child-id "$child_id" \
            --parent-repository "$parent" >/dev/null 2>&1; then
            echo "::error::Child relationship declaration is invalid; parent wake-up refused."
            exit 2
          fi

          parent_owner="${parent%%/*}"
          parent_name="${parent#*/}"
          if [[ ! "$parent" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "$parent_owner" == "." || "$parent_owner" == ".." || "$parent_name" == "." || "$parent_name" == ".." ]]; then
            echo "::error::Child relationship declaration is invalid; parent wake-up refused."
            exit 2
          fi
          if [ -z "$child_id" ]; then
            echo "::error::Bidirectional parent/child verification failed; parent wake-up refused."
            exit 2
          fi
          if ! parent_role="$(fetch_variable "$parent" CONTINUUM_ROLE)"; then
            echo "::error::Parent relationship lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! parent_children="$(fetch_variable "$parent" CONTINUUM_CHILDREN)"; then
            echo "::error::Parent relationship lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::Parent verification lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! parent_ids_err="$(mktemp -p "$RUNNER_TEMP" continuum-parent-ids-err.XXXXXX)"; then
            echo "::error::Parent verification lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          parent_ids_file="$(mktemp -p "$RUNNER_TEMP" continuum-parent-ids.XXXXXX)" || {
            echo "::error::Parent verification lookup is unavailable; parent wake-up refused."
            rm -f "$parent_ids_err"
            exit 4
          }
          if ! python3 "$runtime" parent-variable-ids \
            --role "$parent_role" \
            --children-json "$parent_children" >"$parent_ids_file" 2>"$parent_ids_err"; then
            cat "$parent_ids_err" >&2 || true
            rm -f "$parent_ids_file" "$parent_ids_err"
            echo "::error::Parent verification lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          rm -f "$parent_ids_err"
          if ! grep -Fxq -- "$child_id" "$parent_ids_file"; then
            rm -f "$parent_ids_file"
            echo "::error::Bidirectional parent/child verification failed; parent wake-up refused."
            exit 2
          fi
          rm -f "$parent_ids_file"
          # Exact repository allow-list membership. A substring test would let
          # `owner/child` match `owner/child2`, so parse CONTINUUM_CHILDREN as
          # JSON and require exact equality instead. Malformed JSON stays a
          # verification failure and refuses the wake-up.
          if ! CHILDREN_JSON="$parent_children" CURRENT_REPO="$GITHUB_REPOSITORY" python3 -c $'import json, os, sys\nraw = os.environ.get("CHILDREN_JSON", "")\nrepo = os.environ.get("CURRENT_REPO", "")\ntry:\n    data = json.loads(raw) if raw else []\nexcept Exception:\n    sys.exit(1)\nrepos = set()\nitems = data if isinstance(data, list) else []\nfor x in items:\n    if isinstance(x, str):\n        repos.add(x)\n    elif isinstance(x, dict):\n        for k in ("repo", "repository", "name"):\n            v = x.get(k, "")\n            if v:\n                repos.add(v)\nsys.exit(0 if repo and repo in repos else 1)'; then
            echo "::error::Bidirectional parent/child verification failed; parent wake-up refused."
            exit 2
          fi
          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::Parent default branch lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! parent_err="$(mktemp -p "$RUNNER_TEMP" continuum-parent-err.XXXXXX)"; then
            echo "::error::Parent default branch lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          if ! parent_ref="$(gh api "repos/$parent" --jq '.default_branch // ""' 2>"$parent_err")" || \
             [ -z "$parent_ref" ] || ! git check-ref-format --branch "$parent_ref" >/dev/null 2>&1; then
            cat "$parent_err" >&2 || true
            rm -f "$parent_err"
            echo "::error::Parent default branch lookup is unavailable; parent wake-up refused."
            exit 4
          fi
          rm -f "$parent_err"

          if [ -z "${RUNNER_TEMP:-}" ]; then
            echo "::error::Parent dispatch lookup is unavailable; parent wake-up refused." >&2
            exit 4
          fi
          if ! dispatch_err="$(mktemp -p "$RUNNER_TEMP" continuum-dispatch-err.XXXXXX)"; then
            echo "::error::Parent dispatch lookup is unavailable; parent wake-up refused." >&2
            exit 4
          fi
          if ! gh api --method POST \
            "repos/$parent/actions/workflows/continuum-issue-scheduler.yml/dispatches" \
            -f ref="$parent_ref" >/dev/null 2>"$dispatch_err"; then
            cat "$dispatch_err" >&2 || true
            rm -f "$dispatch_err"
            echo "::error::Verified parent scheduler could not be dispatched."
            exit 4
          fi
          rm -f "$dispatch_err"

          echo "Woke verified parent scheduler."

  schedule:
    # Repository role is the routing authority. A child keeps this workflow
    # installed, but local automatic scheduling is fail-safe disabled.
    if: vars.CONTINUUM_ROLE != 'child'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_SCHEDULER_TIMEOUT_MINUTES || '5') }}
    env:
      WIP_LIMIT: ${{ inputs.wip_limit || vars.AUTOMATION_WIP_LIMIT || '2' }}
      LEASE_MINUTES: ${{ inputs.lease_minutes || vars.AUTOMATION_LEASE_MINUTES || '45' }}
      MAX_DISPATCH_ATTEMPTS: ${{ inputs.max_dispatch_attempts || vars.AUTOMATION_MAX_DISPATCH_ATTEMPTS || '2' }}
      DISPATCH_MARKER: ${{ inputs.dispatch_marker || vars.AUTOMATION_DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->' }}
      IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
      PAUSE_LABEL: ${{ inputs.pause_marker || vars.AUTOMATION_PAUSE_LABEL || 'automation:paused' }}
      QUALIFYING_LABEL: ${{ inputs.qualifying_label || vars.AUTOMATION_QUALIFYING_LABEL || 'automation:qualifying' }}
      BLOCKED_LABEL: ${{ inputs.blocked_label || vars.AUTOMATION_BLOCKED_LABEL || 'automation:blocked' }}
      POST_PAUSE_COMMENT: ${{ inputs.post_pause_comment || 'true' }}
      RESET_MARKERS: ${{ inputs.reset_markers || 'false' }}
      REQUIRE_PRIORITY_LABEL: ${{ inputs.require_priority_label || vars.AUTOMATION_REQUIRE_PRIORITY_LABEL || 'false' }}
      COMMAND_GRACE_MINUTES: ${{ inputs.command_grace_minutes || vars.AUTOMATION_COMMAND_GRACE_MINUTES || '5' }}
      OPENCODE_WORKFLOW_NAME: ${{ inputs.opencode_workflow_name || vars.CONTINUUM_OPENCODE_WORKFLOW_NAME || 'OpenCode agent' }}
      OPENCODE_WORKFLOW_PATH: ${{ inputs.opencode_workflow_path || vars.CONTINUUM_OPENCODE_WORKFLOW_PATH || '.github/workflows/continuum-opencode.yml' }}
      DISPATCH_REF: ${{ inputs.dispatch_ref || vars.CONTINUUM_DISPATCH_REF || 'main' }}
      OPENCODE_DISPATCH: ${{ inputs.opencode_dispatch || vars.CONTINUUM_OPENCODE_DISPATCH || 'comment' }}
      EXECUTION_LABEL_ROUTES: ${{ inputs.execution_label_routes || vars.CONTINUUM_EXECUTION_LABEL_ROUTES }}
      CHILD_DISPATCH_WORKFLOW: ${{ inputs.child_dispatch_workflow || vars.CONTINUUM_CHILD_DISPATCH_WORKFLOW }}
      CHILD_WORKER_WORKFLOW: ${{ vars.CONTINUUM_CHILD_WORKER_WORKFLOW || 'continuum-child-worker.yml' }}
      CHILD_REVIEW_WORKFLOW: ${{ vars.CONTINUUM_CHILD_REVIEW_WORKFLOW || 'continuum-child-review.yml' }}
      CHILD_PR_REVIEW_WORKFLOW: ${{ vars.CONTINUUM_CHILD_PR_REVIEW_WORKFLOW || 'continuum-child-pr-review.yml' }}
      COUNT_OPEN_PRS_AS_WIP: ${{ inputs.count_open_prs_as_wip || vars.AUTOMATION_COUNT_OPEN_PRS_AS_WIP || 'true' }}
      PAUSE_ON_FAILURE: ${{ inputs.pause_on_failure || vars.AUTOMATION_PAUSE_ON_FAILURE || 'true' }}

    steps:
      - name: Checkout parent control plane for delegated scheduling
        if: vars.CONTINUUM_ROLE == 'parent'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Continuum engine for delegated scheduling
        if: vars.CONTINUUM_ROLE == 'parent'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Build delegated child queue
        id: child_queue
        if: vars.CONTINUUM_ROLE == 'parent'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CHILD_CANDIDATES_FILE: ${{ runner.temp }}/continuum-child-candidates.json
        run: |
          set -euo pipefail
          export CONTINUUM_ENGINE_ROOT="$GITHUB_WORKSPACE/.continuum-engine"
          export PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          plan="$(PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="" bash "$resolver" plan)"

          # Keep Actions-history inspection bounded. Three pages cover the latest
          # 300 completed runs without walking the repository's entire run history.
          for page in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=completed&per_page=100&page=$page" \
              --jq '.workflow_runs[]
                | select(
                    .name == "SubTask" or
                    .name == "SubTask review" or
                    .name == "SubTask PR review" or
                    .name == "Child task" or
                    .name == "Child review" or
                    .name == "Child PR review" or
                    .name == "Child dispatcher" or
                    .name == "Worker task" or
                    .name == "Worker review" or
                    .name == "Worker dispatcher"
                  )
                | .id' 2>/dev/null || break
          done |
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              >/dev/null 2>&1 || true
          done

          active_titles="$(
            gh run list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json status,displayTitle \
              --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .displayTitle' \
              2>/dev/null || true
          )"

          task_active() {
            local child_id="$1" kind="$2" task="$3"
            local neutral_title
            if [[ "$kind" == "task" ]]; then
              neutral_title="SubTask #$task"
            else
              neutral_title="SubTask review #$task"
            fi
            grep -Fxq "$neutral_title" <<<"$active_titles" ||
              grep -Fxq "Child $kind [$child_id] #$task" <<<"$active_titles"
          }

          manual_pr_active() {
            local child_id="$1" pr="$2"
            grep -Fxq "SubTask PR review #$pr" <<<"$active_titles" ||
              grep -Fxq "Child PR review [$child_id] #$pr" <<<"$active_titles"
          }

          candidate_lines="$RUNNER_TEMP/continuum-child-candidates.jsonl"
          : > "$candidate_lines"
          declare -A active_wip_keys=()

          while IFS= read -r title; do
            if [[ "$title" =~ ^SubTask[[:space:]]#([0-9]+)$ ]]; then
              active_wip_keys["subtask#${BASH_REMATCH[1]}"]=1
            elif [[ "$title" =~ ^Child[[:space:]]task[[:space:]]\[([^]]+)\][[:space:]]#([0-9]+)$ ]]; then
              active_wip_keys["${BASH_REMATCH[1]}#${BASH_REMATCH[2]}"]=1
            fi
          done <<<"$active_titles"

          invalid=0
          review_dispatches=0

          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            child_id="$(jq -r '.id' <<<"$row")"
            child_repo="$(jq -r '.repository' <<<"$row")"

            if ! PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="" \
              bash "$resolver" verify "$child_id" "$child_repo" >/dev/null 2>&1; then
              echo "::error::Delegated relationship verification failed."
              invalid=$((invalid + 1))
              continue
            fi

            while IFS=$'\t' read -r stale_pr stale_head; do
              [[ -n "$stale_pr" && -n "$stale_head" ]] || continue
              stale_task="$(
                sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p' <<<"$stale_head"
              )"
              [[ -n "$stale_task" ]] || continue
              stale_issue_json="$(gh api "repos/$child_repo/issues/$stale_task" 2>/dev/null || true)"
              [[ "$(jq -r '.state // "closed"' <<<"$stale_issue_json")" == "open" ]] || continue

              stale_ready=true
              stale_body="$(jq -r '.body // ""' <<<"$stale_issue_json")"
              stale_deps="$(
                sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p' \
                  <<<"$stale_body" | head -1 | tr ',' ' '
              )"
              for stale_dep in $stale_deps; do
                stale_dep="${stale_dep//#/}"
                stale_dep="${stale_dep//[[:space:]]/}"
                [[ "$stale_dep" =~ ^[0-9]+$ ]] || continue
                stale_dep_state="$(
                  gh api "repos/$child_repo/issues/$stale_dep" --jq '.state' 2>/dev/null || echo open
                )"
                if [[ "$stale_dep_state" != "closed" ]]; then
                  stale_ready=false
                  break
                fi
              done
              [[ "$stale_ready" == true ]] || continue

              gh pr reopen "$stale_pr" --repo "$child_repo" >/dev/null 2>&1 || true
            done < <(
              gh pr list --repo "$child_repo" --state closed --limit 100 \
                --json number,headRefName,mergedAt \
                --jq '.[] | select(.mergedAt == null) | select(
                    (.headRefName | startswith("continuum-child/task-")) or
                    (.headRefName | startswith("runtime-worker/task-"))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )

            open_prs="$(
              gh pr list --repo "$child_repo" --state open --limit 100 \
                --json number,headRefName \
                --jq 'sort_by(.number) | reverse | .[] | select(
                    (.headRefName | startswith("continuum-child/task-")) or
                    (.headRefName | startswith("runtime-worker/task-"))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )"
            open_pr_tasks="$(
              cut -f2 <<<"$open_prs" \
                | sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p'
            )"

            if [[ "${COUNT_OPEN_PRS_AS_WIP:-true}" != "false" ]]; then
              while IFS= read -r open_task; do
                [[ -n "$open_task" ]] || continue
                active_wip_keys["$child_id#$open_task"]=1
              done <<<"$open_pr_tasks"
            fi

            local_opencode_pr_tasks="$(
              gh pr list --repo "$child_repo" --state open --limit 100 \
                --json headRefName \
                --jq '.[] | .headRefName | select(startswith("opencode/issue"))' \
                | sed -nE 's#^opencode/issue([0-9]+)-.*#\1#p'
            )"
            local_opencode_run_tasks="$(
              # The scheduler only needs recent active work. Bound this lookup to
              # the latest 300 runs instead of paginating the full Actions history.
              for page in 1 2 3; do
                gh api "repos/$child_repo/actions/runs?per_page=100&page=$page" \
                  --jq '.workflow_runs[]
                    | select(.status != "completed")
                    | .display_title
                    | select(test("^OpenCode issue #[0-9]+$"))
                    | capture("^OpenCode issue #(?<task>[0-9]+)$").task' \
                  2>/dev/null || break
              done
            )"
            child_owner="$(gh api "repos/$child_repo" --jq '.owner.login' 2>/dev/null || true)"
            command_grace_seconds=$(( COMMAND_GRACE_MINUTES * 60 ))

            local_override_active() {
              local task_number="$1"
              local recent_command command_epoch now_epoch
              if grep -Fxq "$task_number" <<<"$local_opencode_pr_tasks" ||
                 grep -Fxq "$task_number" <<<"$local_opencode_run_tasks"; then
                return 0
              fi
              [[ -n "$child_owner" ]] || return 1
              recent_command="$(
                gh api --paginate "repos/$child_repo/issues/$task_number/comments?per_page=100" \
                  --jq '.[] | select(.user.login == "'"$child_owner"'") | select((.body // "") | test("(^|[[:space:]])/(oc|opencode)([[:space:]]|$)")) | .created_at' \
                  2>/dev/null | tail -1 || true
              )"
              [[ -n "$recent_command" ]] || return 1
              command_epoch="$(date -d "$recent_command" +%s 2>/dev/null || echo 0)"
              now_epoch="$(date +%s)"
              (( command_epoch > 0 && now_epoch - command_epoch < command_grace_seconds ))
            }

            if [[ -n "$open_prs" ]]; then
              selected_review_tasks=""
              while IFS=$'\t' read -r pr_number head_ref; do
                [[ -n "$pr_number" ]] || continue
                task_number="$(
                  sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p' <<<"$head_ref"
                )"
                [[ -n "$task_number" ]] || continue
                task_state="$(
                  gh api "repos/$child_repo/issues/$task_number" --jq '.state' 2>/dev/null || echo closed
                )"
                if [[ "$task_state" != "open" ]]; then
                  gh pr comment "$pr_number" --repo "$child_repo" \
                    --body "Closed automatically: delegated task #$task_number is already completed." \
                    >/dev/null 2>&1 || true
                  gh pr close "$pr_number" --repo "$child_repo" >/dev/null 2>&1 || true
                  continue
                fi
                if grep -Fxq "$task_number" <<<"$selected_review_tasks"; then
                  continue
                fi
                selected_review_tasks+="$task_number"$'\n'
                if task_active "$child_id" task "$task_number" ||
                   task_active "$child_id" review "$task_number"; then
                  continue
                fi
                gh workflow run "$CHILD_REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                  -f child_id="$child_id" -f task_number="$task_number" -f pr_number="$pr_number" >/dev/null
                review_dispatches=$((review_dispatches + 1))
              done <<<"$open_prs"
            fi

            manual_prs="$(
              gh api --paginate "repos/$child_repo/pulls?state=open&per_page=100" \
                --jq '.[] |
                  select(.draft == false) |
                  select(.head.repo.full_name == .base.repo.full_name) |
                  select(.user.login == .base.repo.owner.login) |
                  select(
                    ((.head.ref | startswith("continuum-child/task-")) or
                     (.head.ref | startswith("runtime-worker/task-"))) | not
                  ) |
                  select(([.labels[]?.name] | index("no-auto-merge")) | not) |
                  .number' 2>/dev/null || true
            )"
            while IFS= read -r manual_pr; do
              [[ -n "$manual_pr" ]] || continue
              manual_pr_active "$child_id" "$manual_pr" && continue
              gh workflow run "$CHILD_PR_REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                -f child_id="$child_id" -f pr_number="$manual_pr" >/dev/null
              review_dispatches=$((review_dispatches + 1))
            done <<<"$manual_prs"

            issues_json="$(gh api --paginate "repos/$child_repo/issues?state=open&per_page=100" 2>/dev/null)"

            while IFS= read -r paused_task; do
              [[ -n "$paused_task" ]] || continue
              gh api --method DELETE \
                "repos/$child_repo/issues/$paused_task/labels/${PAUSE_LABEL//:/%3A}" \
                >/dev/null 2>&1 || true
            done < <(
              jq -r --arg pause "$PAUSE_LABEL" '
                .[] | select(.pull_request == null)
                | select(any(.labels[]?.name; . == $pause))
                | .number
              ' <<<"$issues_json"
            )
            issues_json="$(
              jq --arg pause "$PAUSE_LABEL" '
                map(if .pull_request == null
                    then .labels = [(.labels[]? | select(.name != $pause))]
                    else . end)
              ' <<<"$issues_json"
            )"

            while IFS= read -r encoded; do
              [[ -n "$encoded" ]] || continue
              decoded="$(base64 -d <<<"$encoded")"
              task_number="$(jq -r '.number' <<<"$decoded")"
              body="$(jq -r '.body' <<<"$decoded")"
              title="$(jq -r '.title' <<<"$decoded")"
              rank="$(jq -r '.rank' <<<"$decoded")"
              priority="$(jq -r '.priority' <<<"$decoded")"

              task_active "$child_id" task "$task_number" && continue
              task_active "$child_id" review "$task_number" && continue
              grep -Fxq "$task_number" <<<"$open_pr_tasks" && continue
              local_override_active "$task_number" && continue

              ready=true
              deps="$(
                sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p' \
                  <<<"$body" | head -1 | tr ',' ' '
              )"
              for dep in $deps; do
                dep="${dep//#/}"
                dep="${dep//[[:space:]]/}"
                [[ "$dep" =~ ^[0-9]+$ ]] || continue
                state="$(gh api "repos/$child_repo/issues/$dep" --jq '.state' 2>/dev/null || echo open)"
                if [[ "$state" != "closed" ]]; then ready=false; break; fi
              done
              [[ "$ready" == true ]] || continue

              native_blockers="$(
                gh api --paginate -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "repos/$child_repo/issues/$task_number/dependencies/blocked_by?per_page=100" \
                  --jq '.[] | select(.state == "open") | .number' 2>/dev/null || true
              )"
              [[ -z "$native_blockers" ]] || continue

              jq -cn \
                --arg child_id "$child_id" --arg repository "$child_repo" \
                --argjson task_number "$task_number" --arg title "$title" \
                --arg priority "$priority" --argjson rank "$rank" \
                '{child_id:$child_id,repository:$repository,task_number:$task_number,title:$title,
                  priority:(if $priority == "" then null else $priority end),rank:$rank}' \
                >> "$candidate_lines"
            done < <(
              jq -r '
                map(
                  select(.pull_request == null)
                  | . + {
                      _rank:
                        (if any(.labels[]?.name; . == "priority:p0") then 0
                         elif any(.labels[]?.name; . == "priority:p1") then 1
                         elif any(.labels[]?.name; . == "priority:p2") then 2 else 3 end),
                      _priority:
                        (if any(.labels[]?.name; . == "priority:p0") then "priority:p0"
                         elif any(.labels[]?.name; . == "priority:p1") then "priority:p1"
                         elif any(.labels[]?.name; . == "priority:p2") then "priority:p2" else "" end)
                    }
                )
                | sort_by(._rank, .number)
                | .[]
                | {number:.number,body:(.body//""),title:(.title//""),rank:._rank,priority:._priority}
                | @base64
              ' <<<"$issues_json"
            )
          done < <(jq -c '.[]' <<<"$plan")

          jq -s '.' "$candidate_lines" > "$CHILD_CANDIDATES_FILE"
          active_wip="${#active_wip_keys[@]}"
          candidate_count="$(wc -l < "$candidate_lines" | tr -d ' ')"
          echo "active_wip=$active_wip" >> "$GITHUB_OUTPUT"
          echo "candidate_count=$candidate_count" >> "$GITHUB_OUTPUT"
          echo "Delegated queue: $active_wip active WIP item(s), $candidate_count candidate(s), $review_dispatches review run(s)."
          if [[ "$invalid" -gt 0 ]]; then
            echo "::error::$invalid configured child relationship(s) failed bidirectional verification."
            exit 2
          fi

      - name: Reconcile state and dispatch ready issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CHILD_ACTIVE_WIP: ${{ steps.child_queue.outputs.active_wip || '0' }}
          CHILD_CANDIDATES_FILE: ${{ runner.temp }}/continuum-child-candidates.json
        with:
          # TAP_PAT is required because the existing OpenCode workflow accepts
          # /oc only from the repository owner. It also makes issue-state
          # mutations and comments created here visible as normal owner actions.
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = owner + '/' + repo;
            const childWorkerWorkflow =
              process.env.CHILD_WORKER_WORKFLOW || 'continuum-child-worker.yml';
            const childActiveWipParsed = Number.parseInt(
              process.env.CHILD_ACTIVE_WIP || '0',
              10
            );
            if (!Number.isInteger(childActiveWipParsed) || childActiveWipParsed < 0) {
              throw new Error(
                'Invalid CHILD_ACTIVE_WIP: ' + process.env.CHILD_ACTIVE_WIP
              );
            }
            const childActiveWip = childActiveWipParsed;
            const childCandidatesFile = process.env.CHILD_CANDIDATES_FILE || '';
            const childCandidates =
              childCandidatesFile && fs.existsSync(childCandidatesFile)
                ? JSON.parse(fs.readFileSync(childCandidatesFile, 'utf8'))
                : [];
            if (!Array.isArray(childCandidates)) {
              throw new Error('Delegated child candidate payload is not an array.');
            }

            function positiveInt(name, fallback) {
              const value = Number.parseInt(process.env[name] || String(fallback), 10);
              if (!Number.isInteger(value) || value < 1) {
                throw new Error('Invalid ' + name + ': ' + process.env[name]);
              }
              return value;
            }

            const wipLimit = positiveInt('WIP_LIMIT', 2);
            const leaseMinutes = positiveInt('LEASE_MINUTES', 45);
            const maxDispatchAttempts = positiveInt('MAX_DISPATCH_ATTEMPTS', 2);
            const leaseMs = leaseMinutes * 60 * 1000;
            // A recent owner /oc is only a race guard while GitHub starts the
            // corresponding workflow. It must not inherit the full work lease:
            // cancelled/premature runs may legitimately become eligible again
            // as soon as their native blockers close.
            const commandGraceMinutes = positiveInt('COMMAND_GRACE_MINUTES', 5);
            const commandGraceMs = commandGraceMinutes * 60 * 1000;

            const priorityOrder = [
              'priority:p0',
              'priority:p1',
              'priority:p2',
            ];
            const priorityRank = new Map(
              priorityOrder.map((name, index) => [name, index])
            );
            const inProgressLabel = process.env.IN_PROGRESS_LABEL || 'automation:in-progress';
            const pausedLabel = process.env.PAUSE_LABEL || 'automation:paused';
            const qualifyingLabel = process.env.QUALIFYING_LABEL || 'automation:qualifying';
            const blockedLabel = process.env.BLOCKED_LABEL || 'automation:blocked';
            const dispatchMarker = process.env.DISPATCH_MARKER || '<!-- issue-scheduler-dispatch -->';
            const postPauseComment =
              (process.env.POST_PAUSE_COMMENT || 'true') !== 'false';
            const resetMarkers =
              (process.env.RESET_MARKERS || 'false') === 'true';
            const requirePriorityLabel =
              (process.env.REQUIRE_PRIORITY_LABEL || 'false') === 'true';
            const opencodeWorkflowName =
              process.env.OPENCODE_WORKFLOW_NAME || 'OpenCode agent';
            const opencodeWorkflowPath =
              process.env.OPENCODE_WORKFLOW_PATH ||
              '.github/workflows/continuum-opencode.yml';
            const dispatchRef = process.env.DISPATCH_REF || 'main';

            // A ready issue normally reaches OpenCode as an owner comment, the
            // only path that needs no extra permission. A consumer whose
            // OpenCode caller has no `issue_comment` trigger needs the
            // workflow_dispatch form instead.
            const opencodeDispatch = (
              process.env.OPENCODE_DISPATCH || 'comment'
            ).trim();
            if (!['comment', 'workflow'].includes(opencodeDispatch)) {
              throw new Error(
                "Unsupported opencode_dispatch '" + opencodeDispatch +
                  "'; expected 'comment' or 'workflow'."
              );
            }

            // Label-driven execution routes are configuration, never a table
            // inside core: the render and Docker qualification controllers are
            // separate reusable workflows that a consumer may or may not
            // install, and a consumer may route to workflows core has never
            // heard of. Empty means "route nothing".
            //
            // A malformed entry fails the run instead of being dropped,
            // because a silently ignored route looks reserved but is never
            // executed.
            const executionRoutes = (process.env.EXECUTION_LABEL_ROUTES || '')
              .split('\n')
              .map(line => line.trim())
              .filter(line => line && !line.startsWith('#'))
              .map(line => {
                const parts = line.split('|').map(part => part.trim());
                if (parts.length < 2 || parts.length > 3 || !parts[0] || !parts[1]) {
                  throw new Error(
                    "Invalid execution_label_routes line: '" +
                      line +
                      "'; expected '<issue label>|<workflow file name>|<input>=<value>,...'."
                  );
                }
                const inputs = {};
                for (const assignment of (parts[2] || '').split(',')) {
                  const trimmed = assignment.trim();
                  if (!trimmed) continue;
                  const separator = trimmed.indexOf('=');
                  if (separator <= 0) {
                    throw new Error(
                      "Invalid execution_label_routes input '" +
                        trimmed +
                        "' on line '" +
                        line +
                        "'; expected '<name>=<value>'."
                    );
                  }
                  inputs[trimmed.slice(0, separator).trim()] = trimmed
                    .slice(separator + 1)
                    .trim();
                }
                return { label: parts[0], workflow: parts[1], inputs };
              });
            const executionRouteLabels = new Set(
              executionRoutes.map(route => route.label)
            );

            const childDispatchWorkflow = (
              process.env.CHILD_DISPATCH_WORKFLOW || ''
            ).trim();
            const countOpenPrsAsWip =
              (process.env.COUNT_OPEN_PRS_AS_WIP || 'true') !== 'false';
            const pauseOnFailure =
              (process.env.PAUSE_ON_FAILURE || 'true') !== 'false';

            // Byte-for-byte the marker the watchdog parses. A doubled backslash
            // here would silently disable declared-dependency blocking.
            function declaredDependencyNumbers(issue) {
              const match = (issue.body || '').match(
                /<!--\s*automation-blocked-by:\s*([0-9#\s,]+?)\s*-->/i
              );
              if (!match) return [];
              return [...new Set(
                [...match[1].matchAll(/\d+/g)]
                  .map(item => Number.parseInt(item[0], 10))
                  .filter(Number.isInteger)
              )];
            }

            async function openDeclaredBlockers(
              issue,
              targetOwner = owner,
              targetRepo = repo
            ) {
              const open = [];
              for (const blockerNumber of declaredDependencyNumbers(issue)) {
                if (blockerNumber === issue.number) continue;
                const response = await github.rest.issues.get({
                  owner: targetOwner,
                  repo: targetRepo,
                  issue_number: blockerNumber,
                });
                if (response.data.state === 'open') open.push(response.data);
              }
              return open;
            }

            // Mandatory live-qualification gate: implementation -> qualification
            // -> capability completion. The deterministic rules live in
            // src/continuum/qualification.py; this embedding mirrors them for
            // the scheduler runtime. Byte-for-byte markers: a doubled
            // backslash here would silently disable the whole gate.
            function qualificationRefs(body, selfNumber) {
              if (typeof body !== 'string' || !body) return [];
              const found = new Set();
              const pattern = /<!--\s*automation-qualification:\s*([0-9#\s,]+?)\s*-->/gi;
              for (const match of body.matchAll(pattern)) {
                for (const item of match[1].matchAll(/\d+/g)) {
                  const number = Number.parseInt(item[0], 10);
                  if (!Number.isInteger(number) || number <= 0) continue;
                  if (number === selfNumber) continue;
                  found.add(number);
                }
              }
              return [...found].sort((a, b) => a - b);
            }

            function isValidSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value.trim());
            }

            function normalizeSha(value) {
              if (!isValidSha(value)) return null;
              return value.trim().toLowerCase();
            }

            function latestRequiredSha(body, capabilityNumber) {
              if (typeof body !== 'string' || !body) return null;
              let latest = null;
              const pattern = /<!--\s*continuum-qualification-required\s+capability\s*=\s*(\d+)\s+sha\s*=\s*([0-9a-f]{40})\s*-->/gi;
              for (const match of body.matchAll(pattern)) {
                if (capabilityNumber != null && Number(match[1]) !== capabilityNumber) continue;
                latest = match[2].toLowerCase();
              }
              return latest;
            }

            function requiredShaMarker(capabilityNumber, sha) {
              return '<!-- continuum-qualification-required capability=' +
                capabilityNumber + ' sha=' + sha + ' -->';
            }

            function qualificationDispatchMarker(capabilityNumber, qualificationNumber, sha) {
              return '<!-- continuum-qualification-dispatch capability=' +
                capabilityNumber + ' qualification=' + qualificationNumber +
                ' sha=' + sha + ' -->';
            }

            function hasQualificationDispatch(bodies, capabilityNumber, qualificationNumber, sha) {
              const wanted = normalizeSha(sha);
              if (!wanted) return false;
              const pattern = /<!--\s*continuum-qualification-dispatch\s+capability\s*=\s*(\d+)\s+qualification\s*=\s*(\d+)\s+sha\s*=\s*([0-9a-f]{40})\s*-->/gi;
              for (const body of bodies || []) {
                if (typeof body !== 'string') continue;
                for (const match of body.matchAll(pattern)) {
                  if (
                    Number(match[1]) === capabilityNumber &&
                    Number(match[2]) === qualificationNumber &&
                    match[3].toLowerCase() === wanted
                  ) {
                    return true;
                  }
                }
              }
              return false;
            }

            // Machine-readable evidence only: the canonical marker, or a
            // Docker/Render controller payload whose head SHA matches. Prose
            // verdicts never count, and entries for any other SHA are stale.
            function parseQualificationEvidenceEntries(commentBody) {
              if (typeof commentBody !== 'string' || !commentBody) return [];
              const entries = [];
              const canonical = /<!--\s*continuum-qualification-result\b([^>]*?)-->/gi;
              for (const match of commentBody.matchAll(canonical)) {
                const attrs = {};
                for (const attr of (match[1] || '').matchAll(/([A-Za-z_]+)\s*=\s*([^\s>]+)/g)) {
                  attrs[attr[1].toLowerCase()] = attr[2];
                }
                const sha = normalizeSha(attrs.sha || attrs.head);
                let verdict = null;
                for (const key of ['result', 'classification', 'verdict']) {
                  if (attrs[key] == null) continue;
                  const text = String(attrs[key]).toLowerCase();
                  verdict = ['pass', 'passed', 'success', 'approved'].includes(text)
                    ? 'pass'
                    : 'fail';
                  break;
                }
                if (!sha || !verdict) continue;
                let issue = null;
                if (attrs.issue != null) {
                  issue = Number.parseInt(String(attrs.issue), 10);
                  if (!Number.isInteger(issue)) continue;
                }
                entries.push({ issue, sha, result: verdict });
              }
              for (const marker of [
                '<!-- continuum-docker-qualification-result -->',
                '<!-- continuum-render-qualification-result -->',
              ]) {
                const at = commentBody.indexOf(marker);
                if (at === -1) continue;
                const tail = commentBody.slice(at + marker.length).split('-->')[0].trim();
                let payload = null;
                try {
                  payload = JSON.parse(tail.startsWith('{') ? tail : tail);
                } catch (err) {
                  payload = null;
                }
                if (payload && typeof payload === 'object') {
                  const sha = normalizeSha(
                    payload.head_sha || payload.sha || payload.head
                  );
                  const classification = String(
                    payload.classification || payload.result || payload.verdict || ''
                  ).toLowerCase();
                  if (sha && classification) {
                    entries.push({
                      issue: null,
                      sha,
                      result: ['pass', 'passed', 'success', 'approved'].includes(classification)
                        ? 'pass'
                        : 'fail',
                    });
                  }
                }
              }
              return entries;
            }

            function qualificationEvidenceState(commentBodies, qualificationNumber, requiredSha) {
              const sha = normalizeSha(requiredSha);
              if (!sha) return 'unknown';
              let latest = null;
              for (const body of commentBodies || []) {
                for (const entry of parseQualificationEvidenceEntries(body)) {
                  if (entry.issue != null && entry.issue !== qualificationNumber) continue;
                  if (entry.sha !== sha) continue;
                  latest = entry.result;
                }
              }
              if (latest === 'pass') return 'pass';
              if (latest === 'fail') return 'fail';
              return 'unknown';
            }

            let cachedMainSha = null;
            async function currentMainSha() {
              if (cachedMainSha) return cachedMainSha;
              const { data } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'main',
              });
              cachedMainSha = data.commit.sha;
              return cachedMainSha;
            }

            async function issueCommentsBodies(issueNumber) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              );
              return comments.map(comment => comment.body || '');
            }

            // Dispatch one mandatory qualification for an exact main SHA.
            // Pause never strands the lifecycle: a paused qualification is
            // unpaused here, not skipped. Idempotent per SHA so duplicate
            // merge events cannot start qualification storms; a closed
            // qualification is never dispatched (it must be reopened first).
            async function dispatchQualificationIssue(
              capabilityNumber,
              qualificationNumber,
              requiredSha
            ) {
              const sha = normalizeSha(requiredSha);
              if (!sha) return 'no-required-sha';
              let qual;
              try {
                qual = (await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: qualificationNumber,
                })).data;
              } catch (err) {
                if (err.status === 404) return 'qualification-missing';
                throw err;
              }
              if (qual.pull_request) return 'qualification-missing';
              if (qual.state !== 'open') return 'qualification-closed';
              rememberIssue(qual);
              const qualLabels = labelsByIssue.get(qualificationNumber) || new Set();
              const wasPaused = qualLabels.has(pausedLabel);
              await removeLabel(qualificationNumber, pausedLabel);
              const bodies = await issueCommentsBodies(qualificationNumber);
              if (
                hasQualificationDispatch(
                  bodies, capabilityNumber, qualificationNumber, sha
                )
              ) {
                return wasPaused ? 'unpaused-already-dispatched' : 'already-dispatched';
              }
              const marker = qualificationDispatchMarker(
                capabilityNumber, qualificationNumber, sha
              );
              const note =
                'Mandatory live qualification for capability #' + capabilityNumber +
                ' at main `' + sha +
                '`: automatically dispatched after implementation merge. ' +
                'Qualification must publish `<!-- continuum-qualification-result' +
                ' issue=' + qualificationNumber + ' sha=' + sha + ' result=pass -->`' +
                ' evidence for this exact SHA.';
              if (opencodeDispatch === 'workflow') {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: qualificationNumber,
                  body: [marker, dispatchMarker, '', note].join('\n'),
                });
                await github.request(
                  'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                  {
                    owner,
                    repo,
                    workflow_id: opencodeWorkflowPath.replace(
                      /^\.github\/workflows\//,
                      ''
                    ),
                    ref: dispatchRef,
                    inputs: {
                      mode: 'issue',
                      issue_number: String(qualificationNumber),
                    },
                  }
                );
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: qualificationNumber,
                  body: ['/oc', '', marker, dispatchMarker, '', note].join('\n'),
                });
              }
              await addLabel(qualificationNumber, inProgressLabel);
              return wasPaused ? 'unpause-and-dispatch' : 'dispatch';
            }

            // Reconcile one capability through the qualification phase.
            // Returns the lifecycle state: 'complete', 'qualifying', or
            // 'blocked'. A closed capability without exact-SHA pass evidence
            // fails closed ('must-reopen'), so auto-close keywords can never
            // bypass the gate.
            async function reconcileQualificationCapability(capabilityIssue) {
              const capabilityNumber = capabilityIssue.number;
              rememberIssue(capabilityIssue);
              const refs = qualificationRefs(
                capabilityIssue.body || '', capabilityNumber
              );
              if (refs.length === 0) return 'no-qualification';
              let requiredSha = latestRequiredSha(
                capabilityIssue.body || '', capabilityNumber
              );
              if (!requiredSha) {
                requiredSha = await currentMainSha();
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: capabilityNumber,
                  body: (capabilityIssue.body || '') +
                    '\n' + requiredShaMarker(capabilityNumber, requiredSha),
                });
                capabilityIssue.body =
                  (capabilityIssue.body || '') +
                  '\n' + requiredShaMarker(capabilityNumber, requiredSha);
                core.notice(
                  'Capability #' + capabilityNumber +
                  ': recorded missing required SHA ' + requiredSha + '.'
                );
              }
              const mainSha = await currentMainSha();
              if (normalizeSha(mainSha) !== requiredSha) {
                // A repair merge advanced main: stale evidence no longer
                // matches, so record the new exact SHA and rerun.
                requiredSha = normalizeSha(mainSha);
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: capabilityNumber,
                  body: (capabilityIssue.body || '') +
                    '\n' + requiredShaMarker(capabilityNumber, requiredSha),
                });
                capabilityIssue.body =
                  (capabilityIssue.body || '') +
                  '\n' + requiredShaMarker(capabilityNumber, requiredSha);
                core.notice(
                  'Capability #' + capabilityNumber +
                  ': main advanced; qualification reruns for ' + requiredSha + '.'
                );
              }
              const evidence = {};
              for (const ref of refs) {
                let bodies = [];
                try {
                  bodies = await issueCommentsBodies(ref);
                } catch (err) {
                  if (err.status !== 404) throw err;
                }
                evidence[ref] = qualificationEvidenceState(
                  bodies, ref, requiredSha
                );
              }
              const states = refs.map(ref => evidence[ref]);
              const failures = refs.filter(ref => evidence[ref] === 'fail');
              if (states.every(state => state === 'pass')) {
                await removeLabel(capabilityNumber, inProgressLabel);
                await removeLabel(capabilityNumber, pausedLabel);
                await removeLabel(capabilityNumber, qualifyingLabel);
                await removeLabel(capabilityNumber, blockedLabel);
                if (capabilityIssue.state !== 'closed') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: capabilityNumber,
                    body: [
                      'Capability complete: mandatory qualification passed for exact main `' +
                        requiredSha + '` (' +
                        refs.map(ref => '#' + ref).join(', ') + ').',
                    ].join('\n'),
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: capabilityNumber,
                    state: 'closed',
                    state_reason: 'completed',
                  });
                }
                core.notice(
                  'Capability #' + capabilityNumber +
                  ' completed with exact-SHA qualification evidence.'
                );
                return 'complete';
              }
              await addLabel(capabilityNumber, qualifyingLabel);
              if (failures.length > 0) {
                await addLabel(capabilityNumber, blockedLabel);
                await ensureRepairIssue(capabilityNumber, failures, requiredSha);
                for (const ref of refs) {
                  await dispatchQualificationIssue(
                    capabilityNumber, ref, requiredSha
                  );
                }
                core.warning(
                  'Capability #' + capabilityNumber +
                  ' blocked: qualification failure in ' +
                  failures.map(ref => '#' + ref).join(', ') + '.'
                );
                return 'blocked';
              }
              await removeLabel(capabilityNumber, blockedLabel);
              for (const ref of refs) {
                await dispatchQualificationIssue(
                  capabilityNumber, ref, requiredSha
                );
              }
              return 'qualifying';
            }

            // A failed qualification routes repair work back into the
            // capability lifecycle as a tracked issue. At most one open
            // repair issue exists per (capability, qualification) pair, so
            // repeated failures cannot file repair storms.
            const repairMarkerPattern =
              /<!--\s*continuum-qualification-repair\s+source\s*=\s*(\d+)\s+capability\s*=\s*(\d+)\s*-->/i;

            async function ensureRepairIssue(
              capabilityNumber,
              failures,
              requiredSha
            ) {
              const openIssues = await github.paginate(
                github.rest.issues.listForRepo,
                { owner, repo, state: 'open', per_page: 100 }
              );
              for (const failure of failures) {
                const existing = openIssues.find(
                  item =>
                    !item.pull_request &&
                    (item.body || '').match(repairMarkerPattern) &&
                    Number((item.body || '').match(repairMarkerPattern)[1]) === failure &&
                    Number((item.body || '').match(repairMarkerPattern)[2]) === capabilityNumber
                );
                if (existing) {
                  core.info(
                    'Repair for qualification #' + failure +
                    ' already tracked in #' + existing.number + '.'
                  );
                  continue;
                }
                const marker =
                  '<!-- continuum-qualification-repair source=' + failure +
                  ' capability=' + capabilityNumber + ' -->';
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'Repair qualification failure for #' + capabilityNumber +
                    ' (qualification #' + failure + ')',
                  body: [
                    marker,
                    '',
                    'Mandatory qualification #' + failure + ' for capability #' +
                      capabilityNumber + ' failed at main `' + requiredSha + '`.',
                    '',
                    'Repair the concrete defect, merge the fix, and the',
                    'qualification gate automatically reruns qualification #' +
                      failure + ' against the new exact main SHA.',
                    'Do not close capability #' + capabilityNumber +
                      ' manually: only exact-SHA pass evidence may complete it.',
                  ].join('\n'),
                  labels: ['priority:p0'],
                });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: capabilityNumber,
                  body: 'Qualification #' + failure + ' failed at main `' +
                    requiredSha + '`; repair tracked in #' + created.data.number + '.',
                });
                core.warning(
                  'Created repair issue #' + created.data.number +
                  ' for qualification #' + failure + '.'
                );
              }
            }

            // An implementation merge enters the qualifying state instead of
            // completing the capability. Returns 'missing' when the issue is
            // gone, otherwise the declared qualification refs (empty means
            // the caller runs the normal completion path).
            async function enterQualifyingState(
              issueNumber,
              mergedSha,
              originText
            ) {
              let fresh;
              try {
                fresh = (await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                })).data;
              } catch (err) {
                if (err.status === 404) return 'missing';
                throw err;
              }
              if (fresh.pull_request) return 'missing';
              rememberIssue(fresh);
              const refs = qualificationRefs(fresh.body || '', issueNumber);
              if (refs.length === 0) return refs;
              const sha = normalizeSha(mergedSha) || (await currentMainSha());
              const knownSha = latestRequiredSha(fresh.body || '', issueNumber);
              if (knownSha !== sha) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: (fresh.body || '') + '\n' + requiredShaMarker(issueNumber, sha),
                });
              }
              if (fresh.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'open',
                });
                core.warning(
                  'Capability #' + issueNumber +
                  ' closed with pending mandatory qualification (' + originText +
                  '); reopened instead of completing (fail closed).'
                );
              }
              await removeLabel(issueNumber, inProgressLabel);
              await removeLabel(issueNumber, pausedLabel);
              await removeLabel(issueNumber, blockedLabel);
              await addLabel(issueNumber, qualifyingLabel);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  'Implementation merged (' + originText + ') at main `' + sha + '`.',
                  '',
                  'Capability #' + issueNumber + ' enters `' + qualifyingLabel +
                    '`: mandatory qualification (' +
                    refs.map(ref => '#' + ref).join(', ') +
                    ') must publish exact-SHA pass evidence before completion.',
                  'Implementation completion and capability completion are distinct states.',
                ].join('\n'),
              });
              for (const ref of refs) {
                const outcome = await dispatchQualificationIssue(
                  issueNumber,
                  ref,
                  sha
                );
                core.notice(
                  'Qualification #' + ref + ' for capability #' +
                  issueNumber + ': ' + outcome + '.'
                );
              }
              return refs;
            }

            // Every dispatch in this job goes through the PAT, so no
            // `actions: write` grant is needed on the caller's token.
            async function dispatchWorkflow(workflow, inputs) {
              await github.request(
                'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                { owner, repo, workflow_id: workflow, ref: dispatchRef, inputs }
              );
            }

            const labelSpecs = [
              {
                name: 'priority:p0',
                color: 'B60205',
                description: 'P0 — critical work that should be handled immediately.',
              },
              {
                name: 'priority:p1',
                color: 'D93F0B',
                description: 'P1 — high-priority planned work.',
              },
              {
                name: 'priority:p2',
                color: 'FBCA04',
                description: 'P2 — normal planned work.',
              },
              {
                name: inProgressLabel,
                color: '5319E7',
                description: 'Actively reserved or implemented by the automatic issue scheduler.',
              },
              {
                name: pausedLabel,
                color: 'BFDADC',
                description: 'Automation is paused after a failed/stopped implementation; remove to retry.',
              },
              {
                name: qualifyingLabel,
                color: '0E8A16',
                description: 'Implementation merged; mandatory live qualification is pending exact-SHA evidence.',
              },
              {
                name: blockedLabel,
                color: 'B60205',
                description: 'Mandatory live qualification failed; repair is required before completion.',
              },
              // A configured route label is reserved before this run can see
              // it, so create it here rather than letting a consumer's
              // selection silently no-op on a missing label.
              ...[...executionRouteLabels].map(name => ({
                name,
                color: '0E8A16',
                description:
                  'Routes this issue to a configured execution workflow instead of the OpenCode agent.',
              })),
            ];

            for (const spec of labelSpecs) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...spec });
              } catch (err) {
                if (err.status !== 422) throw err; // already exists
              }
            }

            const labelsByIssue = new Map();

            function rememberIssue(issue) {
              labelsByIssue.set(
                issue.number,
                new Set(
                  (issue.labels || []).map(label =>
                    typeof label === 'string' ? label : label.name
                  )
                )
              );
            }

            async function addLabel(issueNumber, name) {
              const labels = labelsByIssue.get(issueNumber);
              if (labels?.has(name)) return;
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [name],
              });
              if (labels) labels.add(name);
            }

            async function removeLabel(issueNumber, name) {
              const labels = labelsByIssue.get(issueNumber);
              if (labels && !labels.has(name)) return;
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              if (labels) labels.delete(name);
            }

            async function pauseIssue(issueNumber, reason) {
              await removeLabel(issueNumber, inProgressLabel);
              if (!pauseOnFailure) {
                await removeLabel(issueNumber, pausedLabel);
                core.warning(
                  'Released issue #' + issueNumber +
                  ' for automatic retry instead of pausing: ' + reason
                );
                return;
              }
              await addLabel(issueNumber, pausedLabel);
              core.warning('Paused issue #' + issueNumber + ': ' + reason);
              if (postPauseComment) {
                try {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    body: [
                      'Automation paused: ' + reason + '.',
                      '',
                      'Remove the `' + pausedLabel + '` label to retry.',
                    ].join('\n'),
                  });
                } catch (err) {
                  core.warning(
                    'Could not post the pause comment for #' +
                      issueNumber +
                      ': ' +
                      err.message
                  );
                }
              }
            }

            // A closed OpenCode PR is authoritative:
            // - merged means the implementation is done -> close the issue;
            // - closed without merge means the attempt was rejected/stopped ->
            //   pause automation instead of looping and reopening PRs forever.
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr?.head?.repo?.full_name === repoFullName) {
                const match = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
                if (match) {
                  const issueNumber = Number(match[1]);
                  try {
                    const response = await github.rest.issues.get({
                      owner,
                      repo,
                      issue_number: issueNumber,
                    });
                    rememberIssue(response.data);

                    if (pr.merged) {
                      const entered = await enterQualifyingState(
                        issueNumber,
                        pr.merge_commit_sha,
                        'merged PR #' + pr.number
                      );
                      if (entered === 'missing' || entered.length === 0) {
                        await removeLabel(issueNumber, inProgressLabel);
                        await removeLabel(issueNumber, pausedLabel);
                        if (response.data.state !== 'closed') {
                          await github.rest.issues.update({
                            owner,
                            repo,
                            issue_number: issueNumber,
                            state: 'closed',
                            state_reason: 'completed',
                          });
                        }
                        core.notice(
                          'Merged OpenCode PR #' + pr.number +
                          ' completed issue #' + issueNumber + '.'
                        );
                      } else {
                        core.notice(
                          'Merged OpenCode PR #' + pr.number +
                          ': capability #' + issueNumber +
                          ' enters qualification instead of completing.'
                        );
                      }
                    } else {
                      const blockers = await github.paginate(
                        'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                        {
                          owner,
                          repo,
                          issue_number: issueNumber,
                          per_page: 100,
                          headers: {
                            'X-GitHub-Api-Version': '2022-11-28',
                          },
                        }
                      );
                      const openBlockers = blockers.filter(
                        blocker => blocker.state === 'open'
                      );

                      // A rejected run against a blocked issue is not a
                      // failure of the implementation; it is work that was not
                      // eligible yet. Release the reservation and let the
                      // dependency, not the pause label, decide readiness.
                      if (openBlockers.length > 0) {
                        await removeLabel(issueNumber, inProgressLabel);
                        await removeLabel(issueNumber, pausedLabel);
                        core.notice(
                          'OpenCode PR #' + pr.number +
                          ' closed without merge for blocked issue #' +
                          issueNumber + '; reservation released, issue remains ' +
                          'eligible after blockers complete.'
                        );
                      } else {
                        await pauseIssue(
                          issueNumber,
                          'OpenCode PR #' + pr.number +
                          ' was closed without merge.'
                        );
                      }
                    }
                  } catch (err) {
                    if (err.status !== 404) throw err;
                  }
                }
              }
            }

            // A closed issue is terminal for scheduler admission and must not
            // retain an implementation reservation. Reconcile this in the
            // shared engine rather than in a consumer caller so every consumer
            // releases stale WIP immediately after an issue is closed.
            const closedLeasedIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: 'closed',
                labels: inProgressLabel,
                per_page: 100,
              }
            );
            for (const issue of closedLeasedIssues) {
              if (issue.pull_request) continue;
              await removeLabel(issue.number, inProgressLabel);
              core.notice(
                'Released stale reservation on closed issue #' +
                  issue.number +
                  '.'
              );
            }

            let issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            issues = issues.filter(issue => !issue.pull_request);
            for (const issue of issues) rememberIssue(issue);

            if (!pauseOnFailure) {
              for (const issue of issues) {
                if (labelsByIssue.get(issue.number).has(pausedLabel)) {
                  await removeLabel(issue.number, pausedLabel);
                  core.notice(
                    'Cleared legacy automation pause on issue #' +
                    issue.number +
                    ' because pause_on_failure=false.'
                  );
                }
              }
            }

            // Fail-closed auto-close sweep. A PR body carrying `Fixes #N`
            // auto-closes the capability at merge time, bypassing the merge
            // handler above when the event is missed or the label was never
            // applied. The latest closed issues are bounded (one page), so
            // this sweep costs one API call plus follow-ups only for
            // capabilities that declare mandatory qualification.
            const { data: recentlyClosed } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 30,
            });
            for (const closed of recentlyClosed) {
              if (closed.pull_request) continue;
              const refs = qualificationRefs(closed.body || '', closed.number);
              if (refs.length === 0) continue;
              rememberIssue(closed);
              const requiredSha = latestRequiredSha(
                closed.body || '',
                closed.number
              );
              const commentBodies = {};
              for (const ref of refs) {
                try {
                  commentBodies[ref] = await issueCommentsBodies(ref);
                } catch (err) {
                  if (err.status === 404) commentBodies[ref] = [];
                  else throw err;
                }
              }
              const complete = requiredSha &&
                refs.every(
                  ref =>
                    qualificationEvidenceState(
                      commentBodies[ref],
                      ref,
                      requiredSha
                    ) === 'pass'
                );
              if (complete) {
                await removeLabel(closed.number, qualifyingLabel);
                await removeLabel(closed.number, blockedLabel);
                core.notice(
                  'Closed capability #' + closed.number +
                  ' holds exact-SHA qualification evidence; no reopen needed.'
                );
                continue;
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: closed.number,
                state: 'open',
              });
              await addLabel(closed.number, qualifyingLabel);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: closed.number,
                body: [
                  'Reopened by the qualification gate: this capability declares mandatory qualification (' +
                    refs.map(ref => '#' + ref).join(', ') +
                    ') but holds no exact-SHA pass evidence' +
                    (requiredSha ? ' for main `' + requiredSha + '`.' : '.') +
                    ' Auto-close keywords cannot bypass qualification.',
                ].join('\n'),
              });
              core.warning(
                'Reopened auto-closed capability #' + closed.number +
                ' with pending mandatory qualification.'
              );
              issues.push({ ...closed, state: 'open' });
            }

            // Open-capability reconcile: exact-SHA evidence may complete the
            // capability, failure blocks it with a repair issue, and anything
            // else keeps it qualifying with its qualifications dispatched.
            // A main advance since the recorded SHA invalidates stale
            // evidence and reruns qualification automatically.
            for (const issue of issues) {
              const refs = qualificationRefs(issue.body || '', issue.number);
              if (refs.length === 0) continue;
              const outcome = await reconcileQualificationCapability(issue);
              core.notice(
                'Capability #' + issue.number +
                ' qualification reconcile: ' + outcome + '.'
              );
            }

            // Manual owner-triggered /oc runs are real in-flight work too.
            // Reserve the issue immediately so the scheduler cannot enqueue a
            // second OpenCode run before the first one creates its PR.
            if (context.eventName === 'issue_comment') {
              const eventIssue = context.payload.issue;
              const comment = context.payload.comment;
              const body = comment?.body || '';
              const isOwnerCommand =
                comment?.user?.login === owner &&
                (body.includes('/oc') || body.includes('/opencode'));

              if (
                eventIssue &&
                !eventIssue.pull_request &&
                eventIssue.state === 'open' &&
                isOwnerCommand
              ) {
                if (!labelsByIssue.has(eventIssue.number)) {
                  rememberIssue(eventIssue);
                }
                await addLabel(eventIssue.number, inProgressLabel);
                core.notice(
                  'Reserved issue #' + eventIssue.number +
                  ' for manually triggered OpenCode work.'
                );
              }
            }

            // One-time migration for the current backlog only. After this,
            // priority labels are the source of truth. No default priority is
            // assigned: an unprioritized issue is valid and sorts after P2.
            for (const issue of issues) {
              const labels = labelsByIssue.get(issue.number);
              const currentPriorities = [...labels].filter(name =>
                priorityRank.has(name)
              );
              if (currentPriorities.length !== 0) continue;

              const match = issue.title.match(/^P([0-2]):\s+/i);
              if (!match) continue;

              const priority = ('priority:p' + match[1]).toLowerCase();
              const cleanTitle = issue.title.replace(/^P[0-2]:\s+/i, '');

              await addLabel(issue.number, priority);
              if (cleanTitle !== issue.title) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  title: cleanTitle,
                });
                issue.title = cleanTitle;
              }

              core.notice(
                'Migrated issue #' + issue.number + ' to ' + priority + '.'
              );
            }

            // Read every OpenCode issue PR, not just open ones. This lets the
            // cron run reconcile missed PR-close events from current repository
            // state rather than depending on a permanent dispatch marker.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });

            const openPrIssues = new Set();
            const latestPrByIssue = new Map();

            for (const pr of pulls) {
              if (pr.head?.repo?.full_name !== repoFullName) continue;
              const match = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (!match) continue;

              const issueNumber = Number(match[1]);
              const previous = latestPrByIssue.get(issueNumber);
              if (!previous || pr.number > previous.number) {
                latestPrByIssue.set(issueNumber, pr);
              }
              if (pr.state === 'open') openPrIssues.add(issueNumber);
            }

            const issueByNumber = new Map(issues.map(issue => [issue.number, issue]));
            const issueNumbersByTitle = new Map();
            for (const issue of issues) {
              if (!issueNumbersByTitle.has(issue.title)) {
                issueNumbersByTitle.set(issue.title, []);
              }
              issueNumbersByTitle.get(issue.title).push(issue.number);
            }

            const activeIssueNumbers = new Set();

            // Active/pending OpenCode Actions are authoritative in-flight work.
            // Without this, lease expiry releases an issue while GitHub is still
            // running or queueing its implementation.
            // The scheduler only needs recent active work. Never paginate the
            // complete Actions history: large repositories can exhaust the
            // GitHub API quota during a single reconciliation pass.
            const workflowRuns = [];
            for (let page = 1; page <= 3; page += 1) {
              const { data } =
                await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  per_page: 100,
                  page,
                });
              workflowRuns.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }

            const activeRunIssues = new Set();
            for (const run of workflowRuns) {
              const isOpenCodeWorkflow =
                run.path === opencodeWorkflowPath ||
                run.name === opencodeWorkflowName;
              if (
                !isOpenCodeWorkflow ||
                run.status === 'completed' ||
                run.event !== 'issue_comment'
              ) {
                continue;
              }

              const numbered = (run.display_title || '').match(
                /^OpenCode issue #(\d+)$/
              );
              if (numbered) {
                activeRunIssues.add(Number(numbered[1]));
                continue;
              }

              // A caller without `run-name:` reports the issue title instead,
              // which is only unambiguous while exactly one issue carries it.
              const matches = issueNumbersByTitle.get(run.display_title || '') || [];
              if (matches.length === 1) {
                activeRunIssues.add(matches[0]);
              }
            }

            for (const issueNumber of activeRunIssues) {
              if (!issueByNumber.has(issueNumber)) continue;
              activeIssueNumbers.add(issueNumber);
              await addLabel(issueNumber, inProgressLabel);
              await removeLabel(issueNumber, pausedLabel);
            }

            // An open OpenCode PR is still visible work, but consumers may
            // choose not to spend an implementation WIP slot while that PR is
            // merely waiting for CI, review, hardware, or merge.
            for (const issueNumber of openPrIssues) {
              if (countOpenPrsAsWip) {
                activeIssueNumbers.add(issueNumber);
              }
              if (issueByNumber.has(issueNumber)) {
                await addLabel(issueNumber, inProgressLabel);
                await removeLabel(issueNumber, pausedLabel);
              }
            }

            // Reconcile reservations for the gap between posting /oc and the PR
            // appearing. The dispatch comment is audit/timing metadata only; it
            // never blocks an issue forever.
            for (const issue of issues) {
              const issueNumber = issue.number;
              if (
                openPrIssues.has(issueNumber) ||
                activeRunIssues.has(issueNumber)
              ) continue;

              const labels = labelsByIssue.get(issueNumber);
              if (!labels.has(inProgressLabel)) continue;

              // A native open dependency is authoritative even when an older
              // dispatch lease still exists. Once the actual OpenCode run is
              // gone, release the reservation immediately so blocked work does
              // not consume WIP capacity or get resurrected from old comments.
              const reservationBlockers = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                  headers: {
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                }
              );
              const openReservationBlockers = reservationBlockers.filter(
                blocker => blocker.state === 'open'
              );
              if (openReservationBlockers.length > 0) {
                await removeLabel(issueNumber, inProgressLabel);
                core.notice(
                  'Released reservation on issue #' + issueNumber +
                  ': blocked by ' +
                  openReservationBlockers
                    .map(blocker => '#' + blocker.number)
                    .join(', ') + '.'
                );
                continue;
              }

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                }
              );
              const dispatches = comments
                .filter(comment => {
                  const body = comment.body || '';
                  const ownerOpenCodeCommand =
                    comment.user?.login === owner &&
                    (body.includes('/oc') || body.includes('/opencode'));
                  return body.includes(dispatchMarker) || ownerOpenCodeCommand;
                })
                .sort(
                  (a, b) =>
                    new Date(a.created_at).getTime() -
                    new Date(b.created_at).getTime()
                );
              // Only the scheduler's own dispatches consume the attempt budget;
              // a manual owner /oc must never burn one.
              const schedulerDispatches = comments.filter(comment =>
                (comment.body || '').includes(dispatchMarker)
              );
              const latestDispatch = dispatches.at(-1);
              const latestPr = latestPrByIssue.get(issueNumber);

              // If a PR from the current/latest dispatch already completed but
              // its event was missed, reconcile it here.
              if (latestDispatch && latestPr) {
                const dispatchAt = new Date(latestDispatch.created_at).getTime();
                const prAt = new Date(latestPr.created_at).getTime();
                if (prAt >= dispatchAt && latestPr.state === 'closed') {
                  if (latestPr.merged_at) {
                    let mergeSha = null;
                    try {
                      const fullPr = (await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: latestPr.number,
                      })).data;
                      mergeSha = normalizeSha(fullPr.merge_commit_sha);
                    } catch (err) {
                      if (err.status !== 404) throw err;
                    }
                    const entered = await enterQualifyingState(
                      issueNumber,
                      mergeSha,
                      'reconciled PR #' + latestPr.number
                    );
                    if (entered === 'missing' || entered.length === 0) {
                      await removeLabel(issueNumber, inProgressLabel);
                      await removeLabel(issueNumber, pausedLabel);
                      await github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: issueNumber,
                        state: 'closed',
                        state_reason: 'completed',
                      });
                      core.notice(
                        'Reconciled merged PR #' + latestPr.number +
                        ' -> completed issue #' + issueNumber + '.'
                      );
                    } else {
                      core.notice(
                        'Reconciled merged PR #' + latestPr.number +
                        ' -> capability #' + issueNumber +
                        ' enters qualification instead of completing.'
                      );
                    }
                  } else {
                    await pauseIssue(
                      issueNumber,
                      'PR #' + latestPr.number + ' closed without merge.'
                    );
                  }
                  continue;
                }
              }

              if (!latestDispatch) {
                // A stale/manual reservation with no evidence of a dispatch is
                // safe to release immediately.
                await removeLabel(issueNumber, inProgressLabel);
                core.warning(
                  'Released stale reservation on issue #' + issueNumber +
                  ': no scheduler dispatch record exists.'
                );
                continue;
              }

              const ageMs =
                Date.now() - new Date(latestDispatch.created_at).getTime();

              if (ageMs < leaseMs) {
                activeIssueNumbers.add(issueNumber);
                continue;
              }

              await removeLabel(issueNumber, inProgressLabel);

              if (
                schedulerDispatches.length >= maxDispatchAttempts &&
                pauseOnFailure
              ) {
                await addLabel(issueNumber, pausedLabel);
                core.warning(
                  'Issue #' + issueNumber + ' produced no OpenCode PR after ' +
                  schedulerDispatches.length +
                  ' scheduler dispatch attempt(s); automation paused.'
                );
              } else {
                await removeLabel(issueNumber, pausedLabel);
                core.warning(
                  'Lease expired for issue #' + issueNumber +
                  '; it is eligible for an automatic retry' +
                  (schedulerDispatches.length >= maxDispatchAttempts
                    ? ' because pause_on_failure=false.'
                    : '.')
                );
              }
            }

            const totalActiveWip = activeIssueNumbers.size + childActiveWip;
            const freeSlots = Math.max(0, wipLimit - totalActiveWip);
            core.notice(
              'WIP: ' + totalActiveWip + '/' + wipLimit +
              ' (local ' + activeIssueNumbers.size +
              ', delegated ' + childActiveWip + ')' +
              '; free slots: ' + freeSlots +
              '; active local issues: ' +
              ([...activeIssueNumbers]
                .sort((a, b) => a - b)
                .map(n => '#' + n)
                .join(', ') || 'none') + '.'
            );

            if (freeSlots === 0) {
              core.info('No free WIP slots; nothing will be dispatched.');
              return;
            }

            const candidates = [];
            for (const issue of issues) {
              if (activeIssueNumbers.has(issue.number)) continue;
              // An existing implementation PR must never be duplicated even
              // when it is configured not to consume a WIP slot.
              if (openPrIssues.has(issue.number)) continue;

              const labels = labelsByIssue.get(issue.number);
              if (pauseOnFailure && labels.has(pausedLabel)) {
                core.info('Skipping #' + issue.number + ': automation is paused.');
                continue;
              }

              const priorities = [...labels]
                .filter(name => priorityRank.has(name))
                .sort(
                  (a, b) => priorityRank.get(a) - priorityRank.get(b)
                );

              // Multiple priority labels are not a reason to deadlock an issue.
              // Highest priority wins deterministically; the anomaly is logged.
              const priority = priorities[0] || null;
              if (requirePriorityLabel && priority === null) {
                core.info(
                  'Skipping #' + issue.number + ': no priority label and ' +
                    'require_priority_label is enabled.'
                );
                continue;
              }
              const rank = priority === null ? priorityOrder.length : priorityRank.get(priority);
              if (priorities.length > 1) {
                core.warning(
                  'Issue #' + issue.number + ' has multiple priority labels (' +
                  priorities.join(', ') + '); using ' + priority + '.'
                );
              }

              candidates.push({ source: 'local', issue, priority, rank });
            }

            for (const child of childCandidates) {
              const taskNumber = Number.parseInt(String(child.task_number), 10);
              const rank = Number.parseInt(String(child.rank), 10);
              if (
                !child.child_id ||
                !child.repository ||
                !Number.isInteger(taskNumber) ||
                taskNumber < 1 ||
                !Number.isInteger(rank) ||
                rank < 0
              ) {
                throw new Error(
                  'Invalid delegated task candidate.'
                );
              }
              candidates.push({
                source: 'child',
                issue: {
                  number: taskNumber,
                  title: child.title || '',
                  body: '',
                },
                priority: child.priority || null,
                rank,
                child: {
                  child_id: String(child.child_id),
                  repository: String(child.repository),
                  task_number: taskNumber,
                },
              });
            }

            candidates.sort(
              (a, b) =>
                a.rank - b.rank ||
                a.issue.number - b.issue.number ||
                a.source.localeCompare(b.source) ||
                String(a.child?.repository || '').localeCompare(
                  String(b.child?.repository || '')
                )
            );

            const selected = [];
            for (const candidate of candidates) {
              if (selected.length >= freeSlots) break;

              const issue = candidate.issue;
              if (candidate.source === 'child') {
                selected.push(candidate);
                continue;
              }

              const declaredOpenBlockers = await openDeclaredBlockers(issue);
              if (declaredOpenBlockers.length > 0) {
                core.info(
                  'Skipping #' + issue.number + ': declared blocked by ' +
                  declaredOpenBlockers.map(blocker => '#' + blocker.number).join(', ') + '.'
                );
                continue;
              }

              const blockers = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  headers: {
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                }
              );
              const openBlockers = blockers.filter(
                blocker => blocker.state === 'open'
              );
              if (openBlockers.length > 0) {
                core.info(
                  'Skipping #' + issue.number + ': blocked by ' +
                  openBlockers.map(blocker => '#' + blocker.number).join(', ') + '.'
                );
                continue;
              }

              selected.push(candidate);
            }

            if (selected.length === 0) {
              core.notice('No eligible unblocked issues are ready.');
              return;
            }

            core.notice(
              'Selected: ' +
              selected
                .map(item =>
                  (item.source === 'child'
                    ? 'SubTask #' + item.issue.number
                    : '#' + item.issue.number) +
                  ' (' + (item.priority || 'no priority') + ')'
                )
                .join(', ') + '.'
            );

            for (const candidate of selected) {
              const { issue, priority } = candidate;

              if (candidate.source === 'child') {
                const child = candidate.child;
                const parts = child.repository.split('/');
                if (parts.length !== 2 || !parts[0] || !parts[1]) {
                  throw new Error(
                    'Invalid delegated repository binding.'
                  );
                }
                const [childOwner, childRepo] = parts;
                const freshResponse = await github.rest.issues.get({
                  owner: childOwner,
                  repo: childRepo,
                  issue_number: child.task_number,
                });
                const freshChildIssue = freshResponse.data;
                if (
                  freshChildIssue.state !== 'open' ||
                  freshChildIssue.pull_request
                ) {
                  core.info(
                    'Skipping SubTask #' + child.task_number +
                    ': state changed before dispatch.'
                  );
                  continue;
                }

                const childDeclaredBlockers = await openDeclaredBlockers(
                  freshChildIssue,
                  childOwner,
                  childRepo
                );
                if (childDeclaredBlockers.length > 0) {
                  core.info(
                    'Skipping SubTask #' + child.task_number +
                    ': declared blocker appeared before dispatch.'
                  );
                  continue;
                }

                const childNativeBlockers = await github.paginate(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  {
                    owner: childOwner,
                    repo: childRepo,
                    issue_number: child.task_number,
                    per_page: 100,
                    headers: {
                      'X-GitHub-Api-Version': '2022-11-28',
                    },
                  }
                );
                if (
                  childNativeBlockers.some(blocker => blocker.state === 'open')
                ) {
                  core.info(
                    'Skipping SubTask #' + child.task_number +
                    ': native blocker appeared before dispatch.'
                  );
                  continue;
                }

                await dispatchWorkflow(childWorkerWorkflow, {
                  child_id: child.child_id,
                  task_number: String(child.task_number),
                });
                core.notice(
                  'Dispatched SubTask #' + child.task_number + ' (' +
                  (priority || 'no priority') + ').'
                );
                continue;
              }
              // Re-check mutable state immediately before dispatch. Another
              // owner /oc, dependency update, pause, or reservation may have
              // landed while this scheduler run was already evaluating the
              // backlog. Without this JIT guard an older scheduler run can
              // enqueue a duplicate OpenCode run after a manual /oc.
              const freshIssueResponse = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issue.number,
              });
              const freshIssue = freshIssueResponse.data;
              const freshLabels = new Set(
                (freshIssue.labels || []).map(label =>
                  typeof label === 'string' ? label : label.name
                )
              );

              if (
                freshIssue.state !== 'open' ||
                (pauseOnFailure && freshLabels.has(pausedLabel)) ||
                freshLabels.has(inProgressLabel)
              ) {
                core.info(
                  'Skipping #' + issue.number +
                  ': state changed before dispatch.'
                );
                continue;
              }

              const freshDeclaredBlockers = await openDeclaredBlockers(freshIssue);
              if (freshDeclaredBlockers.length > 0) {
                core.info(
                  'Skipping #' + issue.number + ': declared blocker appeared before dispatch: ' +
                  freshDeclaredBlockers.map(blocker => '#' + blocker.number).join(', ') + '.'
                );
                continue;
              }

              const freshBlockers = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                  headers: {
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                }
              );
              const freshOpenBlockers = freshBlockers.filter(
                blocker => blocker.state === 'open'
              );
              if (freshOpenBlockers.length > 0) {
                core.info(
                  'Skipping #' + issue.number +
                  ': blocker appeared before dispatch: ' +
                  freshOpenBlockers
                    .map(blocker => '#' + blocker.number)
                    .join(', ') + '.'
                );
                continue;
              }

              const freshComments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100,
                }
              );
              const latestOpenCodeCommand = freshComments
                .filter(comment => {
                  const body = comment.body || '';
                  return comment.user?.login === owner &&
                    (body.includes('/oc') || body.includes('/opencode'));
                })
                .sort(
                  (a, b) =>
                    new Date(a.created_at).getTime() -
                    new Date(b.created_at).getTime()
                )
                .at(-1);

              if (latestOpenCodeCommand) {
                const commandAgeMs =
                  Date.now() -
                  new Date(latestOpenCodeCommand.created_at).getTime();
                if (commandAgeMs < commandGraceMs) {
                  core.info(
                    'Skipping #' + issue.number +
                    ': an owner OpenCode command was posted within the ' +
                    'short dispatch race window.'
                  );
                  continue;
                }
              }

              // A label acts as a short lease/reservation while OpenCode starts.
              // It is rolled back immediately if posting /oc fails, expires
              // automatically if no PR appears, and is reconciled from PR state.
              await addLabel(issue.number, inProgressLabel);

              try {
                if (resetMarkers) {
                  // Opt-in: drop previously recorded dispatch markers so the
                  // issue starts from a fresh attempt budget. Consumers that
                  // rely on markers as an audit trail leave this off.
                  const previous = await github.paginate(
                    'GET /repos/{owner}/{repo}/issues/{issue_number}/comments',
                    {
                      owner,
                      repo,
                      issue_number: issue.number,
                      per_page: 100,
                    }
                  );
                  for (const comment of previous) {
                    if ((comment.body || '').includes(dispatchMarker)) {
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: comment.id,
                      });
                    }
                  }
                }

                const markerComment = [
                  dispatchMarker,
                  'Automatically dispatched by the issue scheduler (' +
                    (priority || 'no explicit priority') + ').',
                ].join('\n');

                const route = executionRoutes.find(
                  candidate => issue.labels.some(l => l.name === candidate.label)
                );

                if (route) {
                  // The marker still lands on the issue so a consumer can see
                  // the attempt in the audit trail, but the workflow is
                  // dispatched directly: an execution workflow does not read
                  // owner comments.
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: markerComment,
                  });
                  await dispatchWorkflow(route.workflow, {
                    ...route.inputs,
                    issue_number: String(issue.number),
                  });
                } else if (opencodeDispatch === 'workflow') {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: markerComment,
                  });
                  // Inlined rather than routed through dispatchWorkflow so
                  // the dispatched mode stays visible at the call site.
                  await github.request(
                    'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                    {
                      owner,
                      repo,
                      workflow_id: opencodeWorkflowPath.replace(
                        /^\.github\/workflows\//,
                        ''
                      ),
                      ref: dispatchRef,
                      inputs: { mode: 'issue', issue_number: String(issue.number) },
                    }
                  );
                } else {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: ['/oc', '', markerComment].join('\n'),
                  });
                }
              } catch (err) {
                await removeLabel(issue.number, inProgressLabel);
                throw err;
              }

              core.notice(
                'Dispatched issue #' + issue.number + ' (' +
                (priority || 'no priority') + ').'
              );
            }

      - name: Wake the configured downstream dispatcher
        if: env.CHILD_DISPATCH_WORKFLOW != '' && vars.CONTINUUM_ROLE != 'parent'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CHILD_DISPATCH_WORKFLOW: ${{ env.CHILD_DISPATCH_WORKFLOW }}
          DISPATCH_REF: ${{ env.DISPATCH_REF }}
        run: |
          set -euo pipefail
          if ! gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$CHILD_DISPATCH_WORKFLOW/dispatches" \
            -f ref="$DISPATCH_REF" >/dev/null; then
            echo "::warning::Could not dispatch $CHILD_DISPATCH_WORKFLOW at $DISPATCH_REF."
          else
            echo "Dispatched $CHILD_DISPATCH_WORKFLOW at $DISPATCH_REF."
          fi
