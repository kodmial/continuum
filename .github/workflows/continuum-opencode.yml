name: OpenCode agent

on:
  workflow_call:
    inputs:
      mode:
        description: Invocation mode
        required: false
        type: string
      pr_number:
        description: Pull request number
        required: false
        type: string
      head_ref:
        description: Pull request head branch
        required: false
        type: string
      review_id:
        description: Source CodeRabbit review id
        required: false
        type: string
      run_id:
        description: Source failed workflow run id
        required: false
        type: string
      issue_number:
        description: >-
          Issue number supplied by the dispatcher. Empty means "read
          github.event.issue.number", so an issue_comment run is unchanged.
        required: false
        type: string
        default: ''
      max_dispatch_attempts:
        description: >-
          Dispatch attempts this run tolerates before the issue is paused.
          Empty falls back to AUTOMATION_MAX_DISPATCH_ATTEMPTS.
        required: false
        type: string
        default: ''
      dispatch_marker:
        description: >-
          Hidden HTML marker the scheduler writes into its dispatch comments.
          Empty falls back to AUTOMATION_DISPATCH_MARKER. It must match the
          marker the consumer's scheduler uses.
        required: false
        type: string
        default: ''
      in_progress_label:
        description: >-
          Label holding an automation reservation. Empty falls back to
          AUTOMATION_IN_PROGRESS_LABEL. Must match the scheduler's
          in_progress_label.
        required: false
        type: string
        default: ''
      pause_marker:
        description: >-
          Label that pauses automation after a failed dispatch. Empty falls back
          to AUTOMATION_PAUSE_LABEL. Must match the scheduler's pause_marker.
        required: false
        type: string
        default: ''
      pause_on_failure:
        description: >-
          Whether a failed scheduled issue may enter a terminal pause after
          exhausting the configured dispatch attempts. Set false for fully
          autonomous consumers.
        required: false
        type: string
        default: 'true'
      ci_repair_label:
        description: >-
          Label used as the in-flight lock for automatic CI repair.
        required: false
        type: string
        default: ''
      packaging_repair_label:
        description: >-
          Label used as the in-flight lock for packaging-smoke repair.
        required: false
        type: string
        default: ''
      ci_workflow_id:
        description: >-
          Workflow file name ci-fix reruns (for example ci.yml). Empty
          disables the rerun.
        required: false
        type: string
        default: ''
      base_ref:
        description: >-
          Branch `issue` mode bases its implementation branch on. Empty falls
          back to vars.CONTINUUM_ISSUE_BASE_REF, then to `main`.
        required: false
        type: string
        default: ''
      knowledge_protocol_path:
        description: >-
          Repository path of the knowledge-handoff protocol `issue` mode must
          read before changing code, for example
          `automation/knowledge/PROTOCOL.md`. Empty — the default — imposes no
          knowledge-handoff requirement at all, because the protocol is
          consumer-owned and Continuum ships none.
        required: false
        type: string
        default: ''
      knowledge_records_dir:
        description: >-
          Directory `issue` mode must write its single run record into, named
          `issue-<number>-run-<run id>.md`. Empty — the default — disables the
          record requirement. When both this and knowledge_protocol_path are
          empty, `issue` mode is a plain implementation run.
        required: false
        type: string
        default: ''
      issue_commit_prefix:
        description: >-
          Prefix of the task commit message `issue` mode creates. Empty falls
          back to vars.CONTINUUM_ISSUE_COMMIT_PREFIX, then to `fix`.
        required: false
        type: string
        default: ''
      capability_number:
        description: >-
          Capability issue number for qualification mode. Empty unless the
          scheduler dispatched a mandatory qualification run.
        required: false
        type: string
        default: ''
      qualification_number:
        description: >-
          Qualification issue number for qualification mode. Empty unless the
          scheduler dispatched a mandatory qualification run.
        required: false
        type: string
        default: ''
      required_sha:
        description: >-
          Exact main SHA a qualification run must checkout and test.
          Empty unless the scheduler dispatched a mandatory qualification run.
        required: false
        type: string
        default: ''
      conflict_strategy:
        description: >-
          How resolve-conflict settles a conflict: `merge` merges the default
          branch into the PR branch, `checkout` re-checks it out over the work.
          Any other value fails the step; `workflow_call` cannot declare an
          enumerated `choice` input, so the allowed set is enforced in code.
        required: false
        type: string
        default: 'merge'
      prepare_command:
        description: >-
          Optional consumer-owned environment/toolchain preparation run after
          checkout. Empty falls back to CONTINUUM_AGENT_PREPARE_COMMAND.
        required: false
        type: string
        default: ''
      runner_os:
        description: >-
          Consumer-selected OpenCode execution runner (for example macos-15).
          Empty preserves AUTOMATION_OPENCODE_RUNNER and the Linux default.
          Select the host per issue/PR platform, not per repository globally.
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: >-
          Maximum OpenCode job runtime in minutes. Empty falls back to
          AUTOMATION_OPENCODE_TIMEOUT_MINUTES, then 180.
        required: false
        type: string
        default: ''
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      recovery_operation_id:
        description: >-
          Stable 429 recovery operation identity (for example
          `opencode-429-issue-issue290`). Empty means this is not a
          fresh-VM 429 resumption.
        required: false
        type: string
        default: ''
      recovery_checkpoint_ref:
        description: >-
          Workflow-owned durable checkpoint ref a burned runner evacuated
          (for example `opencode/429-checkpoint-<operation>-gen-1`). Empty
          means this is not a fresh-VM 429 resumption.
        required: false
        type: string
        default: ''
      recovery_checkpoint_sha:
        description: >-
          Exact checkpoint commit SHA the fresh run must restore. Empty
          falls back to the tip of recovery_checkpoint_ref.
        required: false
        type: string
        default: ''
      recovery_stage:
        description: >-
          Lifecycle stage the checkpoint completed (for example
          `implementation-incomplete`, `tests-passed`, `review-repair`,
          `qualification`). The fresh run continues from this stage and
          never repeats completed stages.
        required: false
        type: string
        default: ''
      recovery_generation:
        description: >-
          Recovery generation of the checkpoint. Each fresh-VM resumption
          evacuates generation N+1. Empty means generation 0.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  dispatch-coderabbit-fix:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_DISPATCH_TIMEOUT_MINUTES || '5') }}

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Classify CodeRabbit feedback and dispatch only actionable code repair
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEWED_SHA: ${{ github.event.review.commit_id }}
          COMMENT_PAT: ${{ secrets.TAP_PAT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const reviewId = Number(process.env.REVIEW_ID);
            const expectedHead = process.env.HEAD_SHA;
            const reviewedSha = process.env.REVIEWED_SHA || '';
            const reviewState = (process.env.REVIEW_STATE || '').toLowerCase();
            const reviewBody = process.env.REVIEW_BODY || '';
            const commentToken = String(process.env.COMMENT_PAT || '').trim();
            if (!commentToken) {
              throw new Error(
                'COMMENT_PAT is required to publish CodeRabbit no-progress state.'
              );
            }
            const commentGithub = new github.constructor({
              auth: commentToken,
              baseUrl: github.request.endpoint.DEFAULTS.baseUrl,
            });

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (
              pr.state !== 'open' ||
              pr.head.repo?.full_name !== `${owner}/${repo}` ||
              pr.head.sha !== expectedHead ||
              (reviewedSha && reviewedSha !== expectedHead)
            ) {
              core.notice(
                `CodeRabbit review ${reviewId} is stale for PR #${pullNumber}; no repair is dispatched.`
              );
              return;
            }

            if (reviewState === 'approved') {
              core.notice(
                `PR #${pullNumber}: CodeRabbit approved exact HEAD ${expectedHead}; any older no-progress marker is superseded.`
              );
              return;
            }

            const actionableReview =
              reviewState === 'changes_requested' ||
              (reviewState === 'commented' && /Nitpick comments/i.test(reviewBody));
            if (!actionableReview) {
              core.info(
                `CodeRabbit review ${reviewId} state=${reviewState} is advisory; no repair dispatch is needed.`
              );
              return;
            }

            const reviewComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }
            );
            const findings = reviewComments.filter(comment =>
              comment.pull_request_review_id === reviewId &&
              comment.user?.login === 'coderabbitai[bot]' &&
              !comment.in_reply_to_id
            );

            // CHANGES_REQUESTED with no concrete inline finding is not a code
            // repair request. CodeRabbit uses this shape for pre-merge/policy
            // failures such as Linked Issues. Re-running a coding agent cannot
            // change that verdict and creates an infinite review/fix loop.
            if (reviewState === 'changes_requested' && findings.length === 0) {
              const marker =
                `<!-- continuum-coderabbit-no-progress head=${expectedHead} review=${reviewId} kind=non-code -->`;
              const issueComments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100,
                }
              );
              if (!issueComments.some(comment => (comment.body || '').includes(marker))) {
                await commentGithub.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body: [
                    marker,
                    '⚡ **Continuum · opencode**',
                    '<!-- continuum-origin role=continuum component=opencode -->',
                    'Continuum classified this CodeRabbit **CHANGES_REQUESTED** verdict as a non-code/policy blocker because the review contains no actionable inline finding.',
                    '',
                    'No OpenCode repair was dispatched for this unchanged HEAD. Automatic full re-review is suppressed until the PR HEAD changes; resolve the task/policy prerequisite instead of retrying the same code.',
                  ].join('\n'),
                });
              }
              core.warning(
                `PR #${pullNumber}: CodeRabbit review ${reviewId} has no inline code findings; recorded an exact-HEAD no-progress marker instead of dispatching OpenCode.`
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'continuum-opencode.yml',
              ref: 'main',
              inputs: {
                mode: 'coderabbit-fix',
                pr_number: String(pullNumber),
                head_ref: process.env.HEAD_REF,
                review_id: String(reviewId),
              },
            });
            core.notice(
              `Dispatched OpenCode for CodeRabbit review ${reviewId} on PR #${pullNumber} with ${findings.length} inline finding(s).`
            );

  opencode:
    # Manual invocations remain owner-only. Automated repair modes arrive via
    # internal workflow_dispatch events from trusted workflows on main.
    # Qualification mode is dispatched by the scheduler with the immutable
    # run identity (capability, qualification, exact required SHA); an
    # issue_comment carrying a trusted qualification-dispatch marker is also
    # recognized as qualification mode and bound to that marker's triple, so
    # a later main advance can never retarget an already-started run.
    # Interactive PR comments are gated narrowly: an issue_comment on a PR
    # runs only for an explicit owner command at the start of the comment on
    # a still-open PR. Substring matching is forbidden on that route because
    # OpenCode-generated prose itself can mention /oc while documenting the
    # contract, which chained one run per minute on a closed PR.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["coderabbit-fix","resolve-conflict","ci-fix","issue","qualification"]'), inputs.mode)) ||
      ((github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request) &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode'))) ||
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request) &&
       github.actor == github.repository_owner &&
       github.event.issue.state == 'open' &&
       (startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode')) &&
       !contains(github.event.comment.body, '/oc-cancel')) ||
      ((github.event_name == 'pull_request_review_comment') &&
       github.actor == github.repository_owner &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')))
    runs-on: ${{ inputs.runner_os || vars.AUTOMATION_OPENCODE_RUNNER || 'ubuntu-latest' }}
    # Execution environment is a consumer decision. Core defaults to Linux;
    # consumers select another runner and prepare its toolchain explicitly.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.AUTOMATION_OPENCODE_TIMEOUT_MINUTES || '180') }}

    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write

    concurrency:
      group: opencode-${{ inputs.pr_number || inputs.issue_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false

    outputs:
      restart_required: ${{ steps.runner_recovery.outputs.restart_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history is required for conflict-repair merges against main.
          fetch-depth: 0
          # Use the repository PAT rather than github.token. OpenCode may need
          # to push changes under .github/workflows/**; the installation token
          # is rejected by GitHub for those updates without workflows access.
          # TAP_PAT must be a classic PAT with repo + workflow scopes.
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          ref: ${{ inputs.head_ref || github.ref }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # kodmial/continuum#290: a fresh-VM 429 resumption restores the exact
      # checkpoint before doing any work. Shell/workflow code — never the
      # model — fetches the workflow-owned checkpoint ref and checks out the
      # exact checkpoint SHA. Completed stages are never repeated: a
      # tests-passed/publish-pr checkpoint sets skip_opencode so the new run
      # proceeds directly to workflow-owned commit/push/PR publication.
      - name: Restore 429 recovery checkpoint
        id: recovery_restore
        if: inputs.recovery_checkpoint_ref != ''
        env:
          RECOVERY_OPERATION_ID: ${{ inputs.recovery_operation_id }}
          RECOVERY_CHECKPOINT_REF: ${{ inputs.recovery_checkpoint_ref }}
          RECOVERY_CHECKPOINT_SHA: ${{ inputs.recovery_checkpoint_sha }}
          RECOVERY_STAGE: ${{ inputs.recovery_stage }}
          RECOVERY_GENERATION: ${{ inputs.recovery_generation }}
        run: |
          set -euo pipefail
          [[ -n "$RECOVERY_OPERATION_ID" ]] || { echo "::error::429 recovery without operation identity."; exit 1; }
          [[ "$RECOVERY_CHECKPOINT_REF" == opencode/429-checkpoint-* ]] || {
            echo "::error::Malformed 429 checkpoint ref '$RECOVERY_CHECKPOINT_REF'."
            exit 1
          }
          case "${RECOVERY_STAGE:-implementation-incomplete}" in
            implementation-incomplete|implementation-complete|tests-running|tests-passed|publish-pr|review-repair|qualification) ;;
            *) echo "::error::Unknown 429 recovery stage '$RECOVERY_STAGE'."; exit 1 ;;
          esac
          git fetch --no-tags origin "$RECOVERY_CHECKPOINT_REF" --quiet
          if [[ -n "$RECOVERY_CHECKPOINT_SHA" ]]; then
            [[ "$RECOVERY_CHECKPOINT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Malformed 429 checkpoint SHA."; exit 1; }
            FETCHED_SHA="$(git rev-parse FETCH_HEAD)"
            [[ "${FETCHED_SHA,,}" == "${RECOVERY_CHECKPOINT_SHA,,}" ]] || {
              echo "::error::Checkpoint ref tip $FETCHED_SHA does not match recovery SHA $RECOVERY_CHECKPOINT_SHA."
              exit 1
            }
          fi
          CHECKPOINT_SHA="$(git rev-parse FETCH_HEAD)"
          git switch --detach FETCH_HEAD
          # kodmial/continuum#290: drop any stage-progress file carried by
          # the checkpoint. The dispatch recovery_stage above is
          # authoritative for this run; only progress the agent makes on
          # THIS run may authorize a later skip, never a stale file.
          rm -f .continuum-429-stage
          echo "Restored 429 checkpoint $RECOVERY_CHECKPOINT_REF at exact SHA $CHECKPOINT_SHA (operation $RECOVERY_OPERATION_ID, stage ${RECOVERY_STAGE:-implementation-incomplete}, generation ${RECOVERY_GENERATION:-0})."
          {
            echo "resumed=true"
            echo "checkpoint_sha=$CHECKPOINT_SHA"
            echo "stage=${RECOVERY_STAGE:-implementation-incomplete}"
            echo "generation=${RECOVERY_GENERATION:-0}"
            case "${RECOVERY_STAGE:-implementation-incomplete}" in
              tests-passed|publish-pr) echo "skip_opencode=true" ;;
              *) echo "skip_opencode=false" ;;
            esac
          } >> "$GITHUB_OUTPUT"

      # One authoritative task-context resolver is shared by initial issue
      # implementation and later CI repair. PR metadata and failing logs are
      # diagnostic evidence; the resolved issue body/DoD remains the task spec.
      - name: Resolve authoritative task context
        id: task_context
        if: >-
          (github.event_name == 'workflow_dispatch' &&
           (inputs.mode == 'issue' || inputs.mode == 'ci-fix')) ||
          (github.event_name == 'issue_comment' &&
           !github.event.issue.pull_request &&
           github.actor == github.repository_owner &&
           (contains(github.event.comment.body, '/oc') ||
            contains(github.event.comment.body, '/opencode')) &&
           !contains(github.event.comment.body, '/oc-cancel') &&
           !contains(github.event.comment.body, 'continuum-qualification-dispatch'))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number || '' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          # Same-repository task-context reads must not consume the shared
          # user PAT core budget. TAP_PAT is reserved for true cross-repo
          # task fetches and as a bounded liveness fallback.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;
            const mode = String(process.env.MODE || '').trim();
            const issueEventNumber = Number(process.env.ISSUE_NUMBER || 0);
            const prNumber = Number(process.env.PR_NUMBER || 0);

            let taskRepository = '';
            let taskNumber = 0;
            let source = '';
            let prTitle = '';
            let prBody = '';
            const tapPat = String(process.env.TAP_PAT || '').trim();
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');

            async function fetchWithTapPat(path, description) {
              if (!tapPat) {
                throw new Error(`${description} requires TAP_PAT.`);
              }
              const response = await fetch(`${apiBase}${path}`, {
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${tapPat}`,
                  'x-github-api-version': '2022-11-28',
                },
              });
              if (!response.ok) {
                const details = (await response.text()).slice(0, 500);
                throw new Error(
                  `${description} failed with HTTP ${response.status}` +
                  (details ? `: ${details}` : '')
                );
              }
              return await response.json();
            }

            if (mode === 'issue' || (!mode && issueEventNumber > 0)) {
              if (!Number.isInteger(issueEventNumber) || issueEventNumber <= 0) {
                core.setFailed('Issue implementation has no valid authoritative issue number.');
                return;
              }
              taskRepository = repository;
              taskNumber = issueEventNumber;
              source = 'issue-dispatch';
            } else if (mode === 'ci-fix') {
              if (!Number.isInteger(prNumber) || prNumber <= 0) {
                core.setFailed('CI repair has no valid pull request number.');
                return;
              }
              let pr;
              try {
                ({ data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                }));
              } catch (err) {
                core.setFailed(`CI repair could not fetch pull request #${prNumber}: ${err.message || err}`);
                return;
              }
              prTitle = String(pr.title || '');
              prBody = String(pr.body || '');

              const marker = prBody.match(
                /<!--\s*continuum-task-context\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s*-->/i
              );
              if (marker) {
                taskRepository = marker[1];
                taskNumber = Number(marker[2]);
                source = 'canonical-marker';
              }

              if (!taskNumber) {
                const crossRepo = prBody.match(
                  /(?:implements|closes|fixes|resolves|relates\s+to)\s+(?:https:\/\/github\.com\/)?([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)(?:\/issues\/|#)(\d+)/i
                );
                if (crossRepo) {
                  taskRepository = crossRepo[1];
                  taskNumber = Number(crossRepo[2]);
                  source = 'legacy-cross-repo-reference';
                }
              }

              if (!taskNumber) {
                const sameRepo = prBody.match(
                  /(?:implements|closes|fixes|resolves|relates\s+to|automated\s+implementation\s+for)\s+#(\d+)/i
                );
                if (sameRepo) {
                  taskRepository = repository;
                  taskNumber = Number(sameRepo[1]);
                  source = 'legacy-same-repo-reference';
                }
              }

              if (!taskNumber) {
                const headFullName = String(pr.head?.repo?.full_name || '').toLowerCase();
                const branchIssue = String(pr.head?.ref || '').match(/^opencode\/issue(\d+)-/i);
                if (branchIssue && headFullName === repository.toLowerCase()) {
                  taskRepository = repository;
                  taskNumber = Number(branchIssue[1]);
                  source = 'legacy-branch-identity';
                }
              }
            }

            core.setOutput('pr_title', prTitle);
            core.setOutput('pr_body', prBody);

            if (!taskRepository || !Number.isInteger(taskNumber) || taskNumber <= 0) {
              core.setOutput('present', 'false');
              core.setOutput('source', 'none');
              core.notice('No authoritative task issue could be resolved; repair must not invent one.');
              return;
            }

            const parts = taskRepository.split('/');
            if (parts.length !== 2 || parts.some(part => !part)) {
              core.setFailed(`Invalid task repository '${taskRepository}'.`);
              return;
            }

            let issue;
            const sameRepository =
              taskRepository.toLowerCase() === repository.toLowerCase();
            try {
              if (sameRepository) {
                try {
                  const response = await github.rest.issues.get({
                    owner: parts[0], repo: parts[1], issue_number: taskNumber,
                  });
                  issue = response.data;
                } catch (err) {
                  const status = err ? (err.status ?? err.response?.status) : undefined;
                  if (![401, 403, 429].includes(status) || !tapPat) throw err;
                  core.warning(
                    `Repository-token task read failed (${status}); ` +
                    'falling back to TAP_PAT for liveness.'
                  );
                  issue = await fetchWithTapPat(
                    `/repos/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}/issues/${taskNumber}`,
                    `Authoritative task ${taskRepository}#${taskNumber}`
                  );
                }
              } else {
                issue = await fetchWithTapPat(
                  `/repos/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}/issues/${taskNumber}`,
                  `Cross-repository authoritative task ${taskRepository}#${taskNumber}`
                );
              }
            } catch (err) {
              core.setFailed(
                `Authoritative task ${taskRepository}#${taskNumber} could not be fetched: ${err.message || err}`
              );
              return;
            }
            if (issue.pull_request) {
              core.setFailed(`Resolved task ${taskRepository}#${taskNumber} is a pull request, not an issue.`);
              return;
            }

            core.setOutput('present', 'true');
            core.setOutput('source', source);
            core.setOutput('task_repo', taskRepository);
            core.setOutput('task_number', String(taskNumber));
            core.setOutput('task_title', String(issue.title || ''));
            core.setOutput('task_body', String(issue.body || ''));
            core.setOutput('task_url', String(issue.html_url || ''));
            core.notice(`Resolved authoritative task ${taskRepository}#${taskNumber} via ${source}.`);

      # kodmial/continuum#295: freeze the issue requirements at admission.
      # The issue title/body are immutable for one implementation
      # generation once admission starts. This step pins the exact
      # title/body into a bot-owned hidden-marker snapshot comment on the
      # issue (first writer wins, never overwritten) before any agent may
      # implement, writes the exact record to RUNNER_TEMP for this job so
      # the agent consumes the snapshot instead of a later live body, and
      # fails closed on drift or tampering. Canonical digest rules live in
      # src/continuum/task_snapshot.py (UTF-8, NFC, LF, SHA-256); the JS
      # below mirrors them byte-for-byte for the workflow runtime.
      - name: Pin and verify task specification snapshot
        id: task_snapshot
        if: >-
          steps.task_context.outputs.present == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'issue') ||
           (github.event_name == 'issue_comment' &&
            !github.event.issue.pull_request &&
            github.actor == github.repository_owner &&
            (contains(github.event.comment.body, '/oc') ||
             contains(github.event.comment.body, '/opencode')) &&
            !contains(github.event.comment.body, '/oc-cancel') &&
            !contains(github.event.comment.body, 'continuum-qualification-dispatch')))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TASK_REPO: ${{ steps.task_context.outputs.task_repo }}
          TASK_NUMBER: ${{ steps.task_context.outputs.task_number }}
          # kodmial/continuum#309: the live title/body are NEVER passed
          # through prior step outputs/env here. Long bodies (~55k
          # characters) can be altered/truncated/interpolated in transit
          # and read back as false contract drift. The script below
          # fetches a fresh authoritative issue API response inside this
          # exact verification step and hashes that instead.
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          # Snapshot reads use the repository installation token; only the
          # one-time snapshot comment write uses TAP_PAT (owner-visible),
          # mirroring the readiness step's read/write split.
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const taskRepo = String(process.env.TASK_REPO || '').trim().toLowerCase();
            const taskNumber = Number(process.env.TASK_NUMBER || 0);
            const tapPat = String(process.env.TAP_PAT || '').trim();
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');
            const repositoryOwner = String(process.env.REPO_OWNER || '').trim().toLowerCase();
            const generation = 1;

            function fail(message) {
              core.setOutput('snapshot_verified', 'false');
              core.setFailed(message);
            }

            if (!taskRepo || !/^[a-z0-9_.-]+\/[a-z0-9_.-]+$/.test(taskRepo)) {
              fail(`Task snapshot: invalid task repository '${process.env.TASK_REPO || ''}'.`);
              return;
            }
            if (!Number.isInteger(taskNumber) || taskNumber <= 0) {
              fail('Task snapshot: invalid task issue number.');
              return;
            }
            const sameRepository = taskRepo === `${owner}/${repo}`.toLowerCase();
            if (!sameRepository) {
              // Cross-repository snapshots are pinned by the owning
              // repository's own admission (parent/child worker); this
              // same-repo job must not invent them.
              fail(
                `Task snapshot: cross-repository task ${taskRepo}#${taskNumber} cannot be pinned from ${owner}/${repo}.`
              );
              return;
            }

            // kodmial/continuum#309: fresh authoritative live read in
            // this exact verification step. The live title/body used for
            // hashing, pinning, and the agent input below come from this
            // response only -- never from prior step outputs/env, which
            // can alter/truncate long bodies and report false drift.
            // Authorization mirrors the task-context step: the repository
            // installation token first, TAP_PAT only as a bounded
            // liveness fallback (401/403/429). Any other failure fails
            // closed; the agent must never implement unverified text.
            let liveTitle = '';
            let liveBody = '';
            try {
              const fresh = await github.rest.issues.get({
                owner, repo, issue_number: taskNumber,
              });
              if (fresh.data.pull_request) {
                fail(`Task snapshot: ${taskRepo}#${taskNumber} is a pull request, not an issue.`);
                return;
              }
              liveTitle = String(fresh.data.title ?? '');
              liveBody = String(fresh.data.body ?? '');
            } catch (err) {
              const status = err ? (err.status ?? err.response?.status) : undefined;
              if (![401, 403, 429].includes(status) || !tapPat) {
                fail(`Task snapshot: fresh authoritative issue read failed for ${taskRepo}#${taskNumber}: ${err.message || err}`);
                return;
              }
              core.warning(
                `Repository-token snapshot read failed (${status}); falling back to TAP_PAT for liveness.`
              );
              const parts0 = taskRepo.split('/');
              let fallback;
              try {
                fallback = await fetch(
                  `${apiBase}/repos/${encodeURIComponent(parts0[0])}/${encodeURIComponent(parts0[1])}/issues/${taskNumber}`,
                  {
                    headers: {
                      accept: 'application/vnd.github+json',
                      authorization: `Bearer ${tapPat}`,
                      'x-github-api-version': '2022-11-28',
                    },
                  }
                );
              } catch (fallbackErr) {
                fail(`Task snapshot: fresh authoritative issue read failed for ${taskRepo}#${taskNumber}: ${fallbackErr.message || fallbackErr}`);
                return;
              }
              if (!fallback.ok) {
                const details = (await fallback.text()).slice(0, 500);
                fail(
                  `Task snapshot: fresh authoritative issue read failed with HTTP ${fallback.status}` +
                  (details ? `: ${details}` : '')
                );
                return;
              }
              const freshJson = await fallback.json();
              if (freshJson.pull_request) {
                fail(`Task snapshot: ${taskRepo}#${taskNumber} is a pull request, not an issue.`);
                return;
              }
              liveTitle = String(freshJson.title ?? '');
              liveBody = String(freshJson.body ?? '');
            }

            // Canonical digests mirror src/continuum/task_snapshot.py.
            const normalize = (value) =>
              String(value ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').normalize('NFC');
            const sha = (text) => crypto.createHash('sha256').update(text, 'utf8').digest('hex');
            const canonicalTitle = normalize(liveTitle);
            const canonicalBody = normalize(liveBody);
            const liveTitleSha = sha(canonicalTitle);
            const liveBodySha = sha(canonicalBody);
            const liveSpecSha = sha(`${liveTitleSha}:${liveBodySha}`);
            const markerLine = (titleSha, bodySha, specSha) =>
              `<!-- continuum-task-snapshot repo=${taskRepo} issue=${taskNumber} generation=${generation} ` +
              `title-sha256=${titleSha} body-sha256=${bodySha} spec-sha256=${specSha} -->`;
            const issueLink = `https://github.com/${taskRepo}/issues/${taskNumber}`;

            const markerRe =
              /<!--\s*continuum-task-snapshot\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s+generation=(\d+)\s+title-sha256=([0-9a-fA-F]{64})\s+body-sha256=([0-9a-fA-F]{64})\s+spec-sha256=([0-9a-fA-F]{64})\s*-->/;
            const jsonBlockRe = /```json\s+([\s\S]*?)\s+```/;
            // kodmial/continuum#309: deterministic typed terminal
            // generation-stop state, keyed by
            // (repo, issue, generation, pinned/live hashes, reason).
            // Digests only -- never prompt or task text -- so the stop
            // record cannot leak content. Mirrors
            // src/continuum/task_snapshot.py render/parse_generation_stop.
            const stopMarkerRe =
              /<!--\s*continuum-task-generation-stop\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s+generation=(\d+)\s+pinned-spec=([0-9a-fA-F]{64})\s+live-spec=([0-9a-fA-F]{64})\s+reason=(drift|tampered)\s*-->/;
            const recoverMarkerRe =
              /<!--\s*continuum-task-generation-recover\s+repo=([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\s+issue=(\d+)\s+generation=(\d+)\s*-->/;
            const stopMarkerLine = (pinnedSpec, liveSpec, reason) =>
              `<!-- continuum-task-generation-stop repo=${taskRepo} issue=${taskNumber} generation=${generation} ` +
              `pinned-spec=${pinnedSpec} live-spec=${liveSpec} reason=${reason} -->`;

            function trusted(comment) {
              const association = String(comment.author_association || '').toUpperCase();
              if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) return true;
              const login = String((comment.user && comment.user.login) || '').toLowerCase();
              if (login === 'github-actions[bot]') return true;
              return Boolean(repositoryOwner) && login === repositoryOwner;
            }

            function parseComment(comment) {
              const text = String(comment.body || '');
              const match = text.match(markerRe);
              if (!match) return null;
              const parsed = {
                repo: match[1].toLowerCase(),
                issue: Number(match[2]),
                generation: Number(match[3]),
                titleSha: match[4].toLowerCase(),
                bodySha: match[5].toLowerCase(),
                specSha: match[6].toLowerCase(),
                createdAt: comment.created_at || '',
                id: comment.id || 0,
                record: null,
                tampered: false,
                tamperReason: '',
              };
              const block = text.match(jsonBlockRe);
              if (!block) {
                parsed.tampered = true;
                parsed.tamperReason = 'snapshot marker without recoverable JSON content';
                return parsed;
              }
              let record;
              try {
                record = JSON.parse(block[1]);
              } catch (err) {
                parsed.tampered = true;
                parsed.tamperReason = `snapshot JSON is unparseable: ${err.message || err}`;
                return parsed;
              }
              parsed.record = record;
              const embeddedTitle = normalize(record.title ?? '');
              const embeddedBody = normalize(record.body ?? '');
              const problems = [];
              if (sha(embeddedTitle) !== parsed.titleSha) problems.push('title digest mismatch');
              if (sha(embeddedBody) !== parsed.bodySha) problems.push('body digest mismatch');
              if (sha(`${sha(embeddedTitle)}:${sha(embeddedBody)}`) !== parsed.specSha) {
                problems.push('spec digest mismatch');
              }
              if (String(record.repo || '').toLowerCase() !== parsed.repo ||
                  Number(record.issue) !== parsed.issue ||
                  Number(record.generation) !== parsed.generation) {
                problems.push('embedded identity disagrees with marker');
              }
              if (problems.length > 0) {
                parsed.tampered = true;
                parsed.tamperReason = problems.join('; ');
              }
              return parsed;
            }

            let comments;
            try {
              comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: taskNumber, per_page: 100 }
              );
            } catch (err) {
              fail(`Task snapshot: could not list issue comments for verification: ${err.message || err}`);
              return;
            }

            function parseStop(comment) {
              const text = String(comment.body || '');
              const match = text.match(stopMarkerRe);
              if (!match) return null;
              return {
                repo: match[1].toLowerCase(),
                issue: Number(match[2]),
                generation: Number(match[3]),
                pinnedSpec: match[4].toLowerCase(),
                liveSpec: match[5].toLowerCase(),
                reason: match[6].toLowerCase(),
                createdAt: comment.created_at || '',
                id: comment.id || 0,
              };
            }

            function parseRecover(comment) {
              const text = String(comment.body || '');
              const match = text.match(recoverMarkerRe);
              if (!match) return null;
              return {
                repo: match[1].toLowerCase(),
                issue: Number(match[2]),
                generation: Number(match[3]),
                createdAt: comment.created_at || '',
                id: comment.id || 0,
              };
            }

            const orderKey = (entry) => `${entry.createdAt || ''}#${String(entry.id || 0).padStart(12, '0')}`;

            // Terminal stop gate: a trusted stop with no strictly later
            // trusted recovery closes this generation. Manual /oc for the
            // same generation stops here too; only an explicit owner
            // recovery marker (continuum-task-generation-recover),
            // a successor issue, or an explicit new generation re-arms.
            const stops = [];
            const recovers = [];
            for (const comment of comments) {
              if (!trusted(comment)) continue;
              const stop = parseStop(comment);
              if (stop && stop.repo === taskRepo && stop.issue === taskNumber && stop.generation === generation) {
                stops.push(stop);
                continue;
              }
              const recover = parseRecover(comment);
              if (recover && recover.repo === taskRepo && recover.issue === taskNumber && recover.generation === generation) {
                recovers.push(recover);
              }
            }
            stops.sort((a, b) => (orderKey(a) < orderKey(b) ? -1 : orderKey(a) > orderKey(b) ? 1 : 0));
            recovers.sort((a, b) => (orderKey(a) < orderKey(b) ? -1 : orderKey(a) > orderKey(b) ? 1 : 0));
            const terminallyStopped = stops.length > 0 &&
              !(recovers.length > 0 && orderKey(recovers[recovers.length - 1]) > orderKey(stops[stops.length - 1]));

            async function publishTerminalStopOnce(pinnedSpec, liveSpec, reason) {
              const wantPinned = String(pinnedSpec || '').toLowerCase();
              const wantLive = String(liveSpec || '').toLowerCase();
              const wantReason = String(reason || '').toLowerCase();
              // Dedup is keyed by (pinned, live, reason) and honors a
              // strictly later trusted recovery: an old stop superseded
              // by recovery must not suppress a new stop for a later
              // drift, and a new key must not be suppressed by an
              // unrelated earlier stop. Only an effective same-key stop
              // (no recovery strictly after it) suppresses publication.
              const hasEffectiveSameKey = (stopList, recoverList) => {
                const latestRecover = recoverList.length > 0
                  ? orderKey(recoverList[recoverList.length - 1])
                  : null;
                return stopList.some((entry) =>
                  entry.pinnedSpec === wantPinned &&
                  entry.liveSpec === wantLive &&
                  entry.reason === wantReason &&
                  (latestRecover === null || orderKey(entry) > latestRecover)
                );
              };
              if (hasEffectiveSameKey(stops, recovers)) return;
              if (!tapPat) return;
              // Fresh re-read before publication narrows the
              // concurrent-publish race: two drift detections that both
              // observed no stop must converge on the first writer
              // instead of posting duplicate terminal-stop comments,
              // mirroring the bash pre-agent guard below.
              try {
                const fresh = await github.paginate(
                  github.rest.issues.listComments,
                  { owner, repo, issue_number: taskNumber, per_page: 100 }
                );
                const freshStops = [];
                const freshRecovers = [];
                for (const comment of fresh) {
                  if (!trusted(comment)) continue;
                  const seen = parseStop(comment);
                  if (seen && seen.repo === taskRepo && seen.issue === taskNumber && seen.generation === generation) {
                    freshStops.push(seen);
                    continue;
                  }
                  const seenRecover = parseRecover(comment);
                  if (seenRecover && seenRecover.repo === taskRepo && seenRecover.issue === taskNumber && seenRecover.generation === generation) {
                    freshRecovers.push(seenRecover);
                  }
                }
                freshStops.sort((a, b) => (orderKey(a) < orderKey(b) ? -1 : orderKey(a) > orderKey(b) ? 1 : 0));
                freshRecovers.sort((a, b) => (orderKey(a) < orderKey(b) ? -1 : orderKey(a) > orderKey(b) ? 1 : 0));
                if (hasEffectiveSameKey(freshStops, freshRecovers)) {
                  return;
                }
              } catch (err) {
                core.warning(`Terminal generation-stop re-read failed; proceeding with publication: ${err.message || err}`);
              }
              const commentBody = [
                stopMarkerLine(pinnedSpec, liveSpec, reason),
                '⚡ **Continuum · opencode**',
                '<!-- continuum-origin role=continuum component=opencode -->',
                `Continuum terminal generation stop for ${taskRepo}#${taskNumber} generation ${generation} ` +
                `(${reason}; pinned spec ${pinnedSpec}, live spec ${liveSpec}). ` +
                'This generation will not be redispatched. Open a successor issue with an explicit ' +
                'dependency, start an explicit new generation, or post an explicit owner recovery marker.',
              ].join('\n');
              const parts = taskRepo.split('/');
              try {
                await fetch(
                  `${apiBase}/repos/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}/issues/${taskNumber}/comments`,
                  {
                    method: 'POST',
                    headers: {
                      accept: 'application/vnd.github+json',
                      authorization: `Bearer ${tapPat}`,
                      'content-type': 'application/json',
                      'x-github-api-version': '2022-11-28',
                    },
                    body: JSON.stringify({ body: commentBody }),
                  }
                );
              } catch (err) {
                core.warning(`Terminal generation-stop publication failed: ${err.message || err}`);
                return;
              }
              // Privacy-safe one-time incident log: action path plus exact
              // hashes only, never title/body content.
              core.notice(
                `Terminal generation stop published for ${taskRepo}#${taskNumber} generation ${generation} ` +
                `via snapshot-admission (${reason}; pinned ${pinnedSpec}, live ${liveSpec}).`
              );
            }

            if (terminallyStopped) {
              fail(
                `Terminal generation stop for ${taskRepo}#${taskNumber} generation ${generation} ` +
                `(${stops[0].reason}; pinned spec ${stops[0].pinnedSpec}, live spec ${stops[0].liveSpec}). ` +
                `This generation will not be redispatched: open a successor issue with an explicit dependency, ` +
                `start an explicit new generation, or post an explicit owner recovery marker ` +
                `(<!-- continuum-task-generation-recover repo=${taskRepo} issue=${taskNumber} generation=${generation} -->). ` +
                `See ${issueLink}`
              );
              return;
            }

            const candidates = [];
            let tamperedEvidence = null;
            for (const comment of comments) {
              const parsed = parseComment(comment);
              if (!parsed) continue;
              if (parsed.repo !== taskRepo || parsed.issue !== taskNumber) continue;
              if (parsed.generation !== generation) continue;
              if (!trusted(comment)) {
                continue;
              }
              candidates.push(parsed);
              if (parsed.tampered && !tamperedEvidence) tamperedEvidence = parsed;
            }
            candidates.sort((a, b) => {
              const at = a.createdAt || '';
              const bt = b.createdAt || '';
              if (at !== bt) return at < bt ? -1 : 1;
              return (a.id || 0) - (b.id || 0);
            });

            function emitOutputs(status, titleSha, bodySha, specSha, record) {
              core.setOutput('snapshot_status', status);
              core.setOutput('snapshot_verified', 'true');
              core.setOutput('spec_sha256', specSha);
              core.setOutput('title_sha256', titleSha);
              core.setOutput('body_sha256', bodySha);
              core.setOutput('generation', String(generation));
              const runnerTemp = process.env.RUNNER_TEMP || process.env.RUNNER_TMPDIR || '';
              if (runnerTemp && record) {
                fs.writeFileSync(
                  path.join(runnerTemp, 'continuum-task-snapshot.json'),
                  JSON.stringify(record),
                  'utf8'
                );
              }
            }

            const driftMessage = (parts, pinnedSpec) =>
              `Task contract drift detected for ${taskRepo}#${taskNumber} generation ${generation}: ` +
              `live ${parts} no longer matches the pinned snapshot (spec ${pinnedSpec}, live spec ${liveSpecSha}). ` +
              `Stop: this generation keeps the pinned specification. Do not rebaseline silently. ` +
              `Open a new follow-up issue with an explicit dependency instead of editing the working issue. ` +
              `See ${issueLink}`;

            if (candidates.length === 0) {
              if (tamperedEvidence && tamperedEvidence.tampered) {
                const pinnedForStop = /^[0-9a-f]{64}$/.test(tamperedEvidence.specSha || '')
                  ? tamperedEvidence.specSha.toLowerCase()
                  : liveSpecSha;
                await publishTerminalStopOnce(pinnedForStop, liveSpecSha, 'tampered');
                fail(
                  `Task snapshot for ${taskRepo}#${taskNumber} generation ${generation} failed integrity ` +
                  `validation (${tamperedEvidence.tamperReason}). Stop: never fall back to live mutable text. ` +
                  `See ${issueLink}`
                );
                return;
              }
              // Idempotent one-time admission: pin the exact live content.
              if (!tapPat) {
                fail('Task snapshot: TAP_PAT is required to pin the snapshot comment.');
                return;
              }
              const record = {
                schema_version: 1,
                repo: taskRepo,
                issue: taskNumber,
                generation,
                title: canonicalTitle,
                body: canonicalBody,
                title_sha256: liveTitleSha,
                body_sha256: liveBodySha,
                spec_sha256: liveSpecSha,
                created_by: 'github-actions[bot]',
                created_at: new Date().toISOString(),
              };
              const commentBody = [
                markerLine(liveTitleSha, liveBodySha, liveSpecSha),
                '⚡ **Continuum · opencode**',
                '<!-- continuum-origin role=continuum component=opencode -->',
                'Continuum task snapshot (machine-owned, do not edit or delete).',
                'This comment pins the exact issue title/body accepted for this implementation generation. ' +
                'Later issue edits never change it; they belong in a new follow-up issue.',
                '',
                '```json',
                JSON.stringify(record),
                '```',
              ].join('\n');
              const parts = taskRepo.split('/');
              let response;
              try {
                response = await fetch(
                  `${apiBase}/repos/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}/issues/${taskNumber}/comments`,
                  {
                    method: 'POST',
                    headers: {
                      accept: 'application/vnd.github+json',
                      authorization: `Bearer ${tapPat}`,
                      'content-type': 'application/json',
                      'x-github-api-version': '2022-11-28',
                    },
                    body: JSON.stringify({ body: commentBody }),
                  }
                );
              } catch (err) {
                fail(`Task snapshot: pinning failed and the agent must not implement live text: ${err.message || err}`);
                return;
              }
              if (!response.ok) {
                const details = (await response.text()).slice(0, 500);
                fail(
                  `Task snapshot: pinning failed with HTTP ${response.status}` +
                  (details ? `: ${details}` : '') +
                  '; the agent must not implement live mutable text.'
                );
                return;
              }
              // First-writer-wins convergence: two concurrent admissions can
              // both see zero candidates and both POST. Re-list and converge
              // on the earliest trusted pin instead of proceeding on our own
              // record, mirroring the child worker re-verify.
              let rechecked = [];
              try {
                rechecked = await github.paginate(
                  github.rest.issues.listComments,
                  { owner, repo, issue_number: taskNumber, per_page: 100 }
                );
              } catch (err) {
                fail(`Task snapshot: could not re-verify the pinned snapshot: ${err.message || err}`);
                return;
              }
              const winners = [];
              for (const comment of rechecked) {
                const parsed = parseComment(comment);
                if (!parsed) continue;
                if (parsed.repo !== taskRepo || parsed.issue !== taskNumber) continue;
                if (parsed.generation !== generation) continue;
                if (!trusted(comment) || parsed.tampered) continue;
                winners.push(parsed);
              }
              winners.sort((a, b) => {
                const at = a.createdAt || '';
                const bt = b.createdAt || '';
                if (at !== bt) return at < bt ? -1 : 1;
                return (a.id || 0) - (b.id || 0);
              });
              if (winners.length > 0 && winners[0].specSha !== liveSpecSha) {
                await publishTerminalStopOnce(winners[0].specSha, liveSpecSha, 'drift');
                fail(driftMessage('title and body', winners[0].specSha));
                return;
              }
              core.notice(`Pinned task snapshot for ${taskRepo}#${taskNumber} generation ${generation} (spec ${liveSpecSha}).`);
              emitOutputs('pinned', liveTitleSha, liveBodySha, liveSpecSha, record);
              return;
            }

            // First writer wins: later duplicates never overwrite the pin.
            const authoritative = candidates[0];
            if (authoritative.tampered) {
              const pinnedForStop = /^[0-9a-f]{64}$/.test(authoritative.specSha || '')
                ? authoritative.specSha.toLowerCase()
                : liveSpecSha;
              await publishTerminalStopOnce(pinnedForStop, liveSpecSha, 'tampered');
              fail(
                `Task snapshot for ${taskRepo}#${taskNumber} generation ${generation} failed integrity ` +
                `validation (${authoritative.tamperReason}). Stop: never fall back to live mutable text. ` +
                `See ${issueLink}`
              );
              return;
            }
            const mismatches = [];
            if (liveTitleSha !== authoritative.titleSha) mismatches.push('title');
            if (liveBodySha !== authoritative.bodySha) mismatches.push('body');
            if (mismatches.length > 0) {
              await publishTerminalStopOnce(authoritative.specSha, liveSpecSha, 'drift');
              fail(driftMessage(mismatches.join(' and '), authoritative.specSha));
              return;
            }
            core.notice(
              `Task snapshot verified for ${taskRepo}#${taskNumber} generation ${generation} (spec ${liveSpecSha}).`
            );
            emitOutputs('verified', liveTitleSha, liveBodySha, liveSpecSha, authoritative.record);

      - name: Check issue Definition of Ready
        id: issue_readiness
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'issue') ||
          (github.event_name == 'issue_comment' &&
           !github.event.issue.pull_request &&
           github.actor == github.repository_owner &&
           (contains(github.event.comment.body, '/oc') ||
            contains(github.event.comment.body, '/opencode')) &&
           !contains(github.event.comment.body, '/oc-cancel') &&
           !contains(github.event.comment.body, 'continuum-qualification-dispatch'))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          # Same-repository readiness reads use the repository installation
          # token. PAT is explicit only for event-producing mutations and
          # bounded permission/rate-limit fallback.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const inProgressLabel =
              process.env.IN_PROGRESS_LABEL || 'automation:in-progress';
            const tapPat = String(process.env.TAP_PAT || '').trim();
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');
            const repoPath =
              `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;

            async function patRequest(path, options = {}) {
              if (!tapPat) {
                throw new Error('TAP_PAT is required for readiness mutation/fallback.');
              }
              const method = options.method || 'GET';
              const apiVersion = options.apiVersion || '2022-11-28';
              const response = await fetch(`${apiBase}${path}`, {
                method,
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${tapPat}`,
                  'content-type': 'application/json',
                  'x-github-api-version': apiVersion,
                },
                body: options.body === undefined
                  ? undefined
                  : JSON.stringify(options.body),
              });
              if (options.allow404 && response.status === 404) return null;
              if (!response.ok) {
                const details = (await response.text()).slice(0, 500);
                throw new Error(
                  `Readiness PAT request ${method} ${path} failed with HTTP ${response.status}` +
                  (details ? `: ${details}` : '')
                );
              }
              if (response.status === 204) return null;
              const text = await response.text();
              return text ? JSON.parse(text) : null;
            }

            async function patPaginate(path, apiVersion = '2022-11-28') {
              const all = [];
              for (let page = 1; ; page += 1) {
                const separator = path.includes('?') ? '&' : '?';
                const pageItems = await patRequest(
                  `${path}${separator}per_page=100&page=${page}`,
                  { apiVersion }
                );
                if (!Array.isArray(pageItems)) {
                  throw new Error(`Unexpected paginated readiness response for ${path}.`);
                }
                all.push(...pageItems);
                if (pageItems.length < 100) break;
              }
              return all;
            }

            async function readWithFallback(fn, patPath, options = {}) {
              try {
                return await fn();
              } catch (err) {
                const status = err ? (err.status ?? err.response?.status) : undefined;
                if (![401, 403, 429].includes(status)) throw err;
                core.warning(
                  `Repository-token readiness read failed (${status}); ` +
                  'retrying with TAP_PAT for liveness.'
                );
                return options.paginate
                  ? await patPaginate(patPath, options.apiVersion)
                  : await patRequest(patPath, { apiVersion: options.apiVersion });
              }
            }

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid issue number for readiness check.');
              return;
            }

            const issue = await readWithFallback(
              async () => {
                const { data } = await github.rest.issues.get({
                  owner, repo, issue_number: issueNumber,
                });
                return data;
              },
              `${repoPath}/issues/${issueNumber}`
            );
            if (issue.state !== 'open') {
              core.setOutput('ready', 'false');
              core.notice(`Issue #${issueNumber} is not open; implementation will not start.`);
              return;
            }

            // Validation-only trackers are never ordinary implementation work.
            // They execute only through the immutable qualification-dispatch path.
            if (/<!--\s*automation-validation-only\s*-->/i.test(issue.body || '')) {
              core.setOutput('ready', 'false');
              core.notice(
                `Issue #${issueNumber} is validation-only; generic implementation is disabled.`
              );
              return;
            }

            // Qualification dispatch bypass (kodmial/continuum#278): a trusted
            // qualification-dispatch marker for this exact qualification issue
            // bypasses normal implementation-readiness admission for the
            // declared capability relation only. All other blockers still
            // block, and the immutable required SHA plus
            // qualification-specific safety rules still apply in
            // qualification mode.
            let bypassCapability = 0;
            try {
              const triggerBody = String(context.payload?.comment?.body || '');
              const dispatchMarker = triggerBody.match(
                /<!--\s*continuum-qualification-dispatch\s+capability\s*=\s*(\d+)\s+qualification\s*=\s*(\d+)\s+sha\s*=\s*([0-9a-f]{40})\s*-->/i
              );
              const commentTrusted =
                context.payload?.comment?.user?.login === owner;
              if (
                dispatchMarker &&
                commentTrusted &&
                Number(dispatchMarker[2]) === issueNumber
              ) {
                bypassCapability = Number(dispatchMarker[1]);
                core.notice(
                  `Qualification dispatch for issue #${issueNumber}: ` +
                  `ignoring capability back-edge blocker #${bypassCapability} for readiness.`
                );
              }
            } catch (err) {
              bypassCapability = 0;
            }

            const blockerNumbers = new Set();
            const declared = (issue.body || '').match(
              /<!--\s*automation-blocked-by:\s*([0-9#\s,]+?)\s*-->/i
            );
            if (declared) {
              for (const match of declared[1].matchAll(/\d+/g)) {
                const blockerNumber = Number(match[0]);
                if (blockerNumber === issueNumber) continue;
                if (blockerNumber === bypassCapability) continue;
                const blocker = await readWithFallback(
                  async () => {
                    const { data } = await github.rest.issues.get({
                      owner, repo, issue_number: blockerNumber,
                    });
                    return data;
                  },
                  `${repoPath}/issues/${blockerNumber}`
                );
                if (blocker.state === 'open') blockerNumbers.add(blockerNumber);
              }
            }

            const nativeBlockersPath =
              `${repoPath}/issues/${issueNumber}/dependencies/blocked_by`;
            const nativeBlockers = await readWithFallback(
              () => github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                {
                  owner, repo, issue_number: issueNumber, per_page: 100,
                  headers: { 'X-GitHub-Api-Version': '2026-03-10' },
                }
              ),
              nativeBlockersPath,
              { paginate: true, apiVersion: '2026-03-10' }
            );
            for (const blocker of nativeBlockers) {
              if (blocker.state === 'open' && blocker.number !== bypassCapability) {
                blockerNumbers.add(blocker.number);
              }
            }

            const openBlockers = [...blockerNumbers].sort((a, b) => a - b);
            if (openBlockers.length === 0) {
              core.setOutput('ready', 'true');
              return;
            }

            await patRequest(
              `${repoPath}/issues/${issueNumber}/labels/${encodeURIComponent(inProgressLabel)}`,
              { method: 'DELETE', allow404: true }
            );

            const blockerText = openBlockers.map(number => `#${number}`).join(', ');
            const marker =
              `<!-- continuum-issue-readiness-blocked issue=${issueNumber} blockers=${openBlockers.join(',')} -->`;
            const comments = await readWithFallback(
              () => github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issueNumber, per_page: 100 }
              ),
              `${repoPath}/issues/${issueNumber}/comments`,
              { paginate: true }
            );
            if (!comments.some(comment => (comment.body || '').includes(marker))) {
              await patRequest(
                `${repoPath}/issues/${issueNumber}/comments`,
                {
                  method: 'POST',
                  body: { body: [
                  marker,
                  `Automation did not start: the issue Definition of Ready is not satisfied because these dependencies are still open: ${blockerText}.`,
                  '',
                  'Continuum will not create a partial PR for a blocked/umbrella task. Complete the blockers first; the scheduler can then pick this issue up normally.',
                ].join('\n') },
                }
              );
            }

            core.setOutput('ready', 'false');
            core.notice(
              `Issue #${issueNumber} is not ready; open blockers: ${blockerText}.`
            );

      - name: Prepare consumer agent environment
        if: >-
          steps.issue_readiness.outputs.ready != 'false' &&
          (inputs.prepare_command != '' || vars.CONTINUUM_AGENT_PREPARE_COMMAND != '')
        shell: bash
        env:
          PREPARE_COMMAND: ${{ inputs.prepare_command || vars.CONTINUUM_AGENT_PREPARE_COMMAND }}
        run: |
          set -euo pipefail
          eval "$PREPARE_COMMAND"

      # Pre-emptive duplicate guard. The only other open-PR check in this
      # workflow lives in `recover-scheduled-issue`, which runs AFTER a burnt
      # run, so without this step a second dispatch for the same issue would
      # launch a second agent against work that already has a PR. The branch
      # prefix is the one the scheduler, the watchdog, and the repair
      # controller all use.
      - name: Skip duplicate issue implementation
        id: duplicate_guard
        if: >-
          steps.issue_readiness.outputs.ready != 'false' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'issue') ||
           (github.event_name == 'issue_comment' && !github.event.issue.pull_request))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            const tapPat = String(process.env.TAP_PAT || '').trim();
            const apiBase = String(process.env.GITHUB_API_URL || 'https://api.github.com')
              .replace(/\/+$/, '');

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setOutput('skip', 'false');
              return;
            }

            async function listOpenPrsWithPat() {
              if (!tapPat) throw new Error('TAP_PAT is unavailable for duplicate-guard fallback.');
              const all = [];
              for (let page = 1; ; page += 1) {
                const response = await fetch(
                  `${apiBase}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/pulls?state=open&per_page=100&page=${page}`,
                  {
                    headers: {
                      accept: 'application/vnd.github+json',
                      authorization: `Bearer ${tapPat}`,
                      'x-github-api-version': '2022-11-28',
                    },
                  }
                );
                if (!response.ok) {
                  const details = (await response.text()).slice(0, 500);
                  throw new Error(
                    `Duplicate-guard PAT fallback failed with HTTP ${response.status}` +
                    (details ? `: ${details}` : '')
                  );
                }
                const pageItems = await response.json();
                if (!Array.isArray(pageItems)) throw new Error('Unexpected duplicate-guard response.');
                all.push(...pageItems);
                if (pageItems.length < 100) break;
              }
              return all;
            }

            let openPrs;
            try {
              openPrs = await github.paginate(
                github.rest.pulls.list,
                { owner, repo, state: 'open', per_page: 100 }
              );
            } catch (err) {
              const status = err ? (err.status ?? err.response?.status) : undefined;
              if (![401, 403, 429].includes(status)) throw err;
              core.warning(
                `Repository-token duplicate read failed (${status}); ` +
                'retrying with TAP_PAT for liveness.'
              );
              openPrs = await listOpenPrsWithPat();
            }

            const prefix = `opencode/issue${issueNumber}-`;
            const existing = openPrs.find(pr =>
              String(pr.head?.ref || '').startsWith(prefix)
            );
            if (existing) {
              core.info(
                `Open PR #${existing.number} already implements issue #${issueNumber}; ` +
                'skipping duplicate OpenCode run.'
              );
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }
      # workflow_dispatch repair modes must NOT use "opencode github run":
      # that integration owns a branch/PR lifecycle and can open a new PR even
      # when the prompt says not to. Plain "opencode run" works in this already
      # checked-out PR branch and has no built-in PR-creation lifecycle.
      - name: Install OpenCode CLI for automated repair
        if: github.event_name == 'workflow_dispatch' && steps.issue_readiness.outputs.ready != 'false'
        env:
          CONTINUUM_IMAGE_DIGEST: ${{ vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # OpenCode 1.18.34. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `command -v opencode` and the
          # exact version takes the hit path with zero downloads. A cache
          # failure (empty or malformed digest) falls back to deterministic
          # reconstruction below, never failing closed. The digest is bound
          # to the runtime by the image-digest stamp
          # ($HOME/.opencode/image-digest) recorded by the validated image
          # build: a stale or unrelated
          # opencode 1.18.34 binary whose stamp does not match the digest
          # cannot take the hit path. Deterministic reconstruction below
          # never records the stamp: only the validated image build (or a
          # provider cache restore of it) proves golden-image provenance.
          export PATH="$HOME/.opencode/bin:$PATH"
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v opencode >/dev/null 2>&1 && opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"; then
            echo "prepared-runtime hit: opencode 1.18.34 already present (image digest ${CONTINUUM_IMAGE_DIGEST} validated against ${STAMP_FILE})."
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              export PATH="$HOME/.opencode/bin:$PATH"
              opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)" || exit 1
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      # The upstream composite action resolves releases/latest before doing
      # any useful work. Pin the CLI instead so GitHub API availability or
      # rate limiting cannot prevent issue/PR-comment sessions from starting.
      - name: Install OpenCode CLI for interactive agent
        if: github.event_name != 'workflow_dispatch' && steps.issue_readiness.outputs.ready != 'false'
        env:
          CONTINUUM_IMAGE_DIGEST: ${{ vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # OpenCode 1.18.34. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `command -v opencode` and the
          # exact version takes the hit path with zero downloads. A cache
          # failure (empty or malformed digest) falls back to deterministic
          # reconstruction below, never failing closed. The digest is bound
          # to the runtime by the image-digest stamp
          # ($HOME/.opencode/image-digest) recorded by the validated image
          # build: a stale or unrelated
          # opencode 1.18.34 binary whose stamp does not match the digest
          # cannot take the hit path. Deterministic reconstruction below
          # never records the stamp: only the validated image build (or a
          # provider cache restore of it) proves golden-image provenance.
          export PATH="$HOME/.opencode/bin:$PATH"
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v opencode >/dev/null 2>&1 && opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"; then
            echo "prepared-runtime hit: opencode 1.18.34 already present (image digest ${CONTINUUM_IMAGE_DIGEST} validated against ${STAMP_FILE})."
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              export PATH="$HOME/.opencode/bin:$PATH"
              opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)" || exit 1
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Install Continuum OpenCode rate-limit wrapper
        if: steps.issue_readiness.outputs.ready != 'false'
        shell: bash
        run: |
          set -euo pipefail
          wrapper="${RUNNER_TEMP:-/tmp}/continuum-opencode"
          cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          # kodmial/continuum#290: a 429 burns the current VM immediately. A
          # burned runner must never invoke the model again, so any second
          # invocation on this runner fails fast with the dedicated
          # infrastructure outcome (exit 75) without touching the model.
          if [[ -f "${RUNNER_TEMP:-/tmp}/continuum-opencode-429" ]]; then
            echo "::error::CONTINUUM_OPENCODE_429_RESTART_REQUIRED (runner already burned; refusing a second model invocation on this VM)."
            exit 75
          fi
          log="$(mktemp)"
          set +e
          opencode "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # kodmial/continuum#290: classification mirrors the
          # is_opencode_429 engine contract exactly. FreeUsageLimitError
          # always burns the runner (the provider refused usage even when
          # the CLI exits 0); any other 429 signal burns only when the
          # invocation actually failed, so a passing run whose log merely
          # mentions 429 in prose (prompts and agent output routinely do)
          # never retires a healthy runner.
          burned=false
          if grep -Eiq 'FreeUsageLimitError' "$log"; then
            burned=true
          elif [[ "$status" -ne 0 ]] && grep -Eiq 'APIError.*429|HTTP[^0-9]*429([^0-9]|$)|429[[:space:]]+Too[[:space:]]+Many[[:space:]]+Requests|statusCode[^0-9]*429([^0-9]|$)' "$log"; then
            burned=true
          fi
          if [[ "$burned" == "true" ]]; then
            : > "${RUNNER_TEMP:-/tmp}/continuum-opencode-429"
            rm -f "$log"
            echo "::error::OpenCode 429: retire this runner and recover on a fresh runner."
            exit 75
          fi
          rm -f "$log"
          exit "$status"
          SH
          chmod +x "$wrapper"
          echo "${RUNNER_TEMP:-/tmp}" >> "$GITHUB_PATH"

      # kodmial/continuum#290: workflow-owned 429 evacuation. Shell/workflow
      # code — never the model — persists all recoverable state before the
      # burned runner terminates: working-tree changes, commits already
      # created, source/base/head SHAs, exact operation identity, mode,
      # issue/PR number, recovery generation, lifecycle stage, and exact-SHA
      # evidence. The checkpoint is pushed to a private durable recovery ref
      # (`opencode/429-checkpoint-<operation>-gen-<N>`); no LLM call is
      # needed to create it. The runner is marked burned (the rate-limit
      # wrapper refuses any second model invocation on this VM) and the step
      # exits through the dedicated infrastructure outcome (exit 75) with no
      # sleep/backoff retry of the model on the same VM.
      - name: Install 429 checkpoint evacuator
        if: steps.issue_readiness.outputs.ready != 'false'
        shell: bash
        env:
          RECOVERY_GENERATION_IN: ${{ inputs.recovery_generation }}
        run: |
          set -euo pipefail
          helper="${RUNNER_TEMP:-/tmp}/continuum-429-evacuate.sh"
          cat > "$helper" <<'SH'
          #!/usr/bin/env bash
          # continuum_429_evacuate <operation-id> <stage> <mode> <issue-number> <pr-number> <base-sha>
          # Evacuates workflow-owned state to the durable 429 checkpoint ref,
          # marks this runner burned, and exits 75. Never invokes the model,
          # never sleeps, never asks the model to commit.
          # kodmial/continuum#302: canonical fail-closed branch safety for
          # every code push in this helper. The destination must be a proven
          # non-default ref; the default branch is discovered from repository
          # metadata, never hardcoded. Only the PR merge operation may update
          # the default branch. There is no bypass.
          continuum_assert_safe_push() {
            local dest="${1:-}"
            local repo="${2:-$GITHUB_REPOSITORY}"
            dest="${dest#refs/heads/}"
            dest="$(printf '%s' "$dest" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ -z "$dest" ]]; then echo "::error::Continuum branch safety: refusing code push with an empty destination." >&2; return 1; fi
            case "$dest" in HEAD|@|FETCH_HEAD|ORIG_HEAD|MERGE_HEAD) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in *".."*|*"~"*|*"^"*|*"?"*|*"*"*|*"["*|*" "*|*"@{"*) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in -*|/*|*/|*.lock) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            if [[ "$dest" == *"//"* ]]; then echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1; fi
            local default_branch=""
            default_branch="$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || true)"
            default_branch="${default_branch#refs/heads/}"
            default_branch="$(printf '%s' "$default_branch" | tr -d '[:space:]')"
            if [[ -z "$default_branch" ]]; then echo "::error::Continuum branch safety: repository default branch is undiscoverable for '$repo'; refusing code push to '$dest'." >&2; return 1; fi
            if [[ "$dest" == "$default_branch" ]]; then echo "::error::Continuum branch safety: refusing code push to the default branch '$dest'. Recovery resumes the same PR branch; only the PR merge operation may update the default branch." >&2; return 1; fi
          }
          continuum_429_evacuate() {
            local operation="$1" stage="$2" mode="$3" issue_number="$4" pr_number="$5" base_sha="$6"
            operation="$(printf '%s' "$operation" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-{2,}/-/g; s/^-//; s/-$//')"
            [[ -n "$operation" ]] || operation="unknown"
            case "$stage" in
              implementation-incomplete|implementation-complete|tests-running|tests-passed|publish-pr|review-repair|qualification) ;;
              *) stage="implementation-incomplete" ;;
            esac
            # kodmial/continuum#290: the agent tracks honest lifecycle
            # progress in .continuum-429-stage (see the issue-mode prompt).
            # For modes with a no-agent fresh-run path (issue,
            # qualification) the recorded stage wins, so a tests-passed
            # checkpoint lets the fresh run skip the model and publish
            # directly instead of repeating completed stages. Repair modes
            # always resume the agent (unaddressed findings cannot be
            # published around), so the file is ignored for them. Unknown
            # content falls back to the caller default above.
            if [[ "$mode" == "issue" || "$mode" == "qualification" ]] && [[ -f ".continuum-429-stage" ]]; then
              file_stage="$(head -n 1 ".continuum-429-stage" 2>/dev/null | tr -d '[:space:]')"
              case "$file_stage" in
                implementation-incomplete|implementation-complete|tests-running|tests-passed|publish-pr|review-repair|qualification) stage="$file_stage" ;;
              esac
            fi
            local gen="${RECOVERY_GENERATION_IN:-0}"
            [[ "$gen" =~ ^[0-9]+$ ]] || gen=0
            local next_gen=$((gen + 1))
            local checkpoint_ref="opencode/429-checkpoint-${operation}-gen-${next_gen}"
            local head_sha="" current_branch=""
            current_branch="$(git branch --show-current 2>/dev/null || true)"
            find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete 2>/dev/null || true
            if [[ -n "$(git status --porcelain 2>/dev/null)" ]]; then
              git add -A
              git commit -m "chore: checkpoint 429-interrupted ${mode} work" \
                -m "Continuum-Checkpoint-429-Operation: ${operation}" \
                -m "Continuum-Component: opencode" || true
            fi
            head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            local metadata=".continuum-429-recovery.json"
            python3 - "$metadata" "$operation" "$next_gen" "$stage" "$mode" "$issue_number" "$pr_number" "$base_sha" "$head_sha" "$current_branch" <<'PY' || true
          import json, os, sys
          path, operation, gen, stage, mode, issue, pr, base, head, branch = sys.argv[1:10]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({
                  "operation_id": operation,
                  "generation": int(gen),
                  "stage": stage,
                  "mode": mode,
                  "issue_number": issue,
                  "pr_number": pr,
                  "head_ref": os.environ.get("HEAD_REF", "") or branch,
                  "review_id": os.environ.get("REVIEW_ID", ""),
                  "run_id": os.environ.get("RUN_ID", ""),
                  "base_ref": os.environ.get("BASE_REF", ""),
                  "capability_number": os.environ.get("CAPABILITY_NUMBER", ""),
                  "qualification_number": os.environ.get("QUALIFICATION_NUMBER", ""),
                  "required_sha": os.environ.get("REQUIRED_SHA", ""),
                  "base_sha": base,
                  "head_sha": head,
                  "branch": branch,
              }, handle, indent=2, sort_keys=True)
          PY
            if [[ -f "$metadata" ]]; then
              git add "$metadata"
              git commit -m "chore: record 429 recovery identity ${operation} gen ${next_gen}" \
                -m "Continuum-Checkpoint-429-Operation: ${operation}" \
                -m "Continuum-Component: opencode" || true
              head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            fi
            local evacuated_ok=false
            if [[ -n "$head_sha" ]]; then
              # kodmial/continuum#302: checkpoint refs are permitted only as
              # proven non-default refs; fail closed before any mutation
              # when the destination is empty, ambiguous, or the discovered
              # default branch.
              continuum_assert_safe_push "$checkpoint_ref" || exit 1
              if git push --force origin "HEAD:refs/heads/${checkpoint_ref}"; then
                evacuated_ok=true
                echo "::warning::Evacuated 429 checkpoint ${checkpoint_ref} at exact SHA ${head_sha} (operation ${operation}, stage ${stage}, generation ${next_gen}, mode ${mode}, issue ${issue_number}, pr ${pr_number}, branch ${current_branch})."
                # Optional legacy-branch mirror so scheduler-native resume
                # keeps working after infrastructure cooldown even without a
                # recovery dispatch (best effort; never fails the evacuation).
                # kodmial/continuum#302: the mirror must still never alias
                # the default branch; a refused mirror is cleared and
                # skipped while the primary checkpoint still evacuates.
                continuum_assert_safe_push "${CONTINUUM_429_LEGACY_REF}" || {
                  echo "::error::Continuum branch safety: refusing legacy checkpoint mirror to '${CONTINUUM_429_LEGACY_REF}'." >&2
                  CONTINUUM_429_LEGACY_REF=""
                }
                if [[ -n "${CONTINUUM_429_LEGACY_REF:-}" ]]; then
                  git push --force origin "HEAD:refs/heads/${CONTINUUM_429_LEGACY_REF}" || true
                fi
              else
                echo "::warning::429 evacuation push failed for ${checkpoint_ref} at local SHA ${head_sha} (operation ${operation}, stage ${stage}, generation ${next_gen}); no durable checkpoint was published."
              fi
            else
              echo "::warning::429 evacuation had no committable state; recording the marker without a checkpoint ref."
            fi
            : > "${RUNNER_TEMP:-/tmp}/continuum-opencode-429"
            if [[ "$evacuated_ok" == "true" ]]; then
              echo "CONTINUUM_429_CHECKPOINT_REF=${checkpoint_ref}" >> "${GITHUB_ENV:-/dev/null}"
            else
              echo "CONTINUUM_429_CHECKPOINT_REF=" >> "${GITHUB_ENV:-/dev/null}"
            fi
            echo "CONTINUUM_429_OPERATION=${operation}" >> "${GITHUB_ENV:-/dev/null}"
            echo "::error::CONTINUUM_OPENCODE_429_RESTART_REQUIRED"
            exit 75
          }
          SH
          chmod +x "$helper"
          echo "Installed 429 checkpoint evacuator at $helper."

      # Interactive OpenCode remains available for PR/review comments. A /oc
      # comment on a plain issue is an implementation command and is routed
      # through the deterministic issue-mode contract below instead of letting
      # `opencode github run` infer intent from a bare slash command.
      # On PR issue comments the gate is deliberately narrow: the PR must
      # still be open, the author must be the repository owner, and the body
      # must start with /oc or /opencode. startsWith (not contains) is used
      # because agent-generated prose can mention /oc later in the comment,
      # which previously chained one self-triggered run per verification
      # comment. Review comments keep their existing owner + contains gate.
      - name: Run OpenCode
        if: >-
          github.event_name != 'workflow_dispatch' &&
          ((github.event_name == 'pull_request_review_comment') ||
           (github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.actor == github.repository_owner &&
            github.event.issue.state == 'open' &&
            (startsWith(github.event.comment.body, '/oc') ||
             startsWith(github.event.comment.body, '/opencode')))) &&
          steps.duplicate_guard.outputs.skip != 'true' &&
          !contains(github.event.comment.body, '/oc-cancel') &&
          !contains(github.event.comment.body, 'continuum-qualification-dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
          OPENCODE_CONFIG_CONTENT: >-
            {"permission":{"bash":{"*":"allow","git *":"deny","git status":"allow","git status *":"allow","git diff":"allow","git diff *":"allow","git log":"allow","git log *":"allow","git show":"allow","git show *":"allow","git rev-parse *":"allow","git ls-files":"allow","git ls-files *":"allow","git grep *":"allow","git blame *":"allow","git branch --show-current":"allow","git remote -v":"allow","git tag":"allow","git tag --list *":"allow","git tag -l *":"allow","git describe *":"allow"}}}
        run: continuum-opencode github run

      # Upstream OpenCode deliberately skips its infrastructure push/PR when
      # the agent leaves the branch that OpenCode created for an issue. The
      # permission guard above prevents normal Git writes from the LLM, but
      # this recovery path makes the workflow lossless if a future OpenCode
      # version, shell indirection, or tool bypass still changes branches.
      - name: Recover agent-managed issue branch
        if: >-
          steps.issue_readiness.outputs.ready != 'false' &&
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          github.actor == github.repository_owner &&
          (contains(github.event.comment.body, '/oc') ||
           contains(github.event.comment.body, '/opencode')) &&
          !contains(github.event.comment.body, '/oc-cancel') &&
          !contains(github.event.comment.body, 'continuum-qualification-dispatch')
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          SNAPSHOT_VERIFIED: ${{ steps.task_snapshot.outputs.snapshot_verified }}
          SNAPSHOT_SPEC: ${{ steps.task_snapshot.outputs.spec_sha256 }}
          SNAPSHOT_TITLE_SHA: ${{ steps.task_snapshot.outputs.title_sha256 }}
          SNAPSHOT_BODY_SHA: ${{ steps.task_snapshot.outputs.body_sha256 }}
        run: |
          set -euo pipefail

          # kodmial/continuum#302: canonical fail-closed branch safety (see
          # the 429 evacuator helper for the full contract). The recovered
          # branch must be a proven non-default ref; only the PR merge
          # operation may update the default branch.
          continuum_assert_safe_push() {
            local dest="${1:-}"
            local repo="${2:-$GITHUB_REPOSITORY}"
            dest="${dest#refs/heads/}"
            dest="$(printf '%s' "$dest" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ -z "$dest" ]]; then echo "::error::Continuum branch safety: refusing code push with an empty destination." >&2; return 1; fi
            case "$dest" in HEAD|@|FETCH_HEAD|ORIG_HEAD|MERGE_HEAD) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in *".."*|*"~"*|*"^"*|*"?"*|*"*"*|*"["*|*" "*|*"@{"*) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in -*|/*|*/|*.lock) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            if [[ "$dest" == *"//"* ]]; then echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1; fi
            local default_branch=""
            default_branch="$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || true)"
            default_branch="${default_branch#refs/heads/}"
            default_branch="$(printf '%s' "$default_branch" | tr -d '[:space:]')"
            if [[ -z "$default_branch" ]]; then echo "::error::Continuum branch safety: repository default branch is undiscoverable for '$repo'; refusing code push to '$dest'." >&2; return 1; fi
            if [[ "$dest" == "$default_branch" ]]; then echo "::error::Continuum branch safety: refusing code push to the default branch '$dest'. Recovery resumes the same PR branch; only the PR merge operation may update the default branch." >&2; return 1; fi
          }

          CURRENT_BRANCH="$(git branch --show-current)"
          if [[ "$CURRENT_BRANCH" != opencode/* ]]; then
            echo "Current branch '$CURRENT_BRANCH' is not an OpenCode issue branch; nothing to recover."
            exit 0
          fi

          # Normal OpenCode completion already created a PR for the current
          # branch. In that case this step is intentionally a no-op.
          EXISTING_PR="$(gh pr list             --repo "$GITHUB_REPOSITORY"             --head "$CURRENT_BRANCH"             --state all             --json number             --jq '.[0].number // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR #$EXISTING_PR already exists for '$CURRENT_BRANCH'; nothing to recover."
            exit 0
          fi

          # If the agent switched branches before committing, preserve those
          # edits rather than letting the runner discard them.
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            # kodmial/continuum#260: workflow-owned recovery commit uses the
            # bot identity (see Configure Git identity) plus a stable
            # component trailer so it is visibly machine-generated.
            git commit -m "chore: recover OpenCode issue changes" -m "Continuum-Component: opencode"
          fi

          git fetch origin main --quiet
          AHEAD="$(git rev-list --count "origin/main..HEAD")"
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "No commits ahead of main on '$CURRENT_BRANCH'; nothing to recover."
            exit 0
          fi

          # kodmial/continuum#302: fail closed before mutation when the
          # recovered branch is empty, ambiguous, or the default branch.
          continuum_assert_safe_push "$CURRENT_BRANCH" || exit 1
          git push -u origin "HEAD:$CURRENT_BRANCH"

          TITLE="$(git log -1 --format=%s)"
          # A capability with mandatory live qualification must never be
          # auto-closed by PR keywords: `Closes #N` would bypass the
          # qualification gate, so a qualifying issue gets a non-closing
          # body and the gate completes it only on exact-SHA evidence.
          RECOVER_ISSUE_BODY="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          TASK_MARKER="<!-- continuum-task-context repo=${GITHUB_REPOSITORY} issue=${ISSUE_NUMBER} -->"
          # kodmial/continuum#295: carry the pinned snapshot reference into
          # recovered PRs so drift validation still applies to them.
          RECOVER_SNAPSHOT_REF=""
          if [[ "${SNAPSHOT_VERIFIED:-}" == "true" && -n "${SNAPSHOT_SPEC:-}" && -n "${SNAPSHOT_TITLE_SHA:-}" && -n "${SNAPSHOT_BODY_SHA:-}" ]]; then
            RECOVER_SNAPSHOT_REF="<!-- continuum-task-snapshot-ref repo=${GITHUB_REPOSITORY,,} issue=${ISSUE_NUMBER} generation=1 title-sha256=${SNAPSHOT_TITLE_SHA} body-sha256=${SNAPSHOT_BODY_SHA} spec-sha256=${SNAPSHOT_SPEC} -->"
          fi
          if grep -Eqi '<!--[[:space:]]*automation-qualification:' <<<"$RECOVER_ISSUE_BODY"; then
            BODY="$(printf '%s\n%s\n\nRecovered automatically after the OpenCode agent changed branches during issue #%s execution.\n\nRelates to #%s\n\nMandatory live qualification is declared on #%s; this PR must not auto-close it. The qualification gate completes it only on exact-SHA pass evidence.' "$TASK_MARKER" "$RECOVER_SNAPSHOT_REF" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
          else
            BODY="$(printf '%s\n%s\n\nRecovered automatically after the OpenCode agent changed branches during issue #%s execution.\n\nCloses #%s' "$TASK_MARKER" "$RECOVER_SNAPSHOT_REF" "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CURRENT_BRANCH" --title "$TITLE" --body "$BODY"

      - name: Implement issue
        if: >-
          steps.issue_readiness.outputs.ready != 'false' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'issue') ||
           (github.event_name == 'issue_comment' &&
            !github.event.issue.pull_request &&
            github.actor == github.repository_owner &&
            (contains(github.event.comment.body, '/oc') ||
             contains(github.event.comment.body, '/opencode')) &&
            !contains(github.event.comment.body, '/oc-cancel') &&
           !contains(github.event.comment.body, 'continuum-qualification-dispatch'))) &&
          steps.duplicate_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          TASK_CONTEXT_PRESENT: ${{ steps.task_context.outputs.present }}
          TASK_REPO: ${{ steps.task_context.outputs.task_repo }}
          TASK_NUMBER: ${{ steps.task_context.outputs.task_number }}
          ISSUE_TITLE: ${{ steps.task_context.outputs.task_title }}
          ISSUE_BODY: ${{ steps.task_context.outputs.task_body }}
          ISSUE_URL: ${{ steps.task_context.outputs.task_url }}
          SNAPSHOT_VERIFIED: ${{ steps.task_snapshot.outputs.snapshot_verified }}
          SNAPSHOT_SPEC: ${{ steps.task_snapshot.outputs.spec_sha256 }}
          SNAPSHOT_TITLE_SHA: ${{ steps.task_snapshot.outputs.title_sha256 }}
          SNAPSHOT_BODY_SHA: ${{ steps.task_snapshot.outputs.body_sha256 }}
          BASE_REF: ${{ inputs.base_ref || vars.CONTINUUM_ISSUE_BASE_REF || 'main' }}
          KNOWLEDGE_PROTOCOL_PATH: ${{ inputs.knowledge_protocol_path }}
          KNOWLEDGE_RECORDS_DIR: ${{ inputs.knowledge_records_dir }}
          COMMIT_PREFIX: ${{ inputs.issue_commit_prefix || vars.CONTINUUM_ISSUE_COMMIT_PREFIX || 'fix' }}
          IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
          PAUSE_LABEL: ${{ inputs.pause_marker || vars.AUTOMATION_PAUSE_LABEL || 'automation:paused' }}
          PAUSE_ON_FAILURE: ${{ inputs.pause_on_failure || vars.AUTOMATION_PAUSE_ON_FAILURE || 'true' }}
          CI_WORKFLOW_ID: ${{ inputs.ci_workflow_id }}
          RECOVERY_RESUMED: ${{ steps.recovery_restore.outputs.resumed }}
          RECOVERY_SKIP_OPENCODE: ${{ steps.recovery_restore.outputs.skip_opencode }}
          RECOVERY_STAGE_IN: ${{ steps.recovery_restore.outputs.stage }}
          RECOVERY_GENERATION_IN: ${{ inputs.recovery_generation }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP:-/tmp}/continuum-429-evacuate.sh" 2>/dev/null || true
          # kodmial/continuum#302: the evacuator helper already defines
          # continuum_assert_safe_push; define it here as well so this step
          # stays fail-closed even when the helper failed to install.
          if ! declare -F continuum_assert_safe_push >/dev/null 2>&1; then
            continuum_assert_safe_push() {
              local dest="${1:-}"
              local repo="${2:-$GITHUB_REPOSITORY}"
              dest="${dest#refs/heads/}"
              dest="$(printf '%s' "$dest" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [[ -z "$dest" ]]; then echo "::error::Continuum branch safety: refusing code push with an empty destination." >&2; return 1; fi
              case "$dest" in HEAD|@|FETCH_HEAD|ORIG_HEAD|MERGE_HEAD) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
              case "$dest" in *".."*|*"~"*|*"^"*|*"?"*|*"*"*|*"["*|*" "*|*"@{"*) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
              case "$dest" in -*|/*|*/|*.lock) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
              if [[ "$dest" == *"//"* ]]; then echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1; fi
              local default_branch=""
              default_branch="$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || true)"
              default_branch="${default_branch#refs/heads/}"
              default_branch="$(printf '%s' "$default_branch" | tr -d '[:space:]')"
              if [[ -z "$default_branch" ]]; then echo "::error::Continuum branch safety: repository default branch is undiscoverable for '$repo'; refusing code push to '$dest'." >&2; return 1; fi
              if [[ "$dest" == "$default_branch" ]]; then echo "::error::Continuum branch safety: refusing code push to the default branch '$dest'. Recovery resumes the same PR branch; only the PR merge operation may update the default branch." >&2; return 1; fi
            }
          fi
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Missing or invalid issue number for issue mode: '${ISSUE_NUMBER}'."; exit 1; }
          [[ "$TASK_CONTEXT_PRESENT" == "true" ]] || { echo "::error::Authoritative task context was not resolved."; exit 1; }
          [[ "${TASK_REPO,,}" == "${GITHUB_REPOSITORY,,}" && "$TASK_NUMBER" == "$ISSUE_NUMBER" ]] || {
            echo "::error::Resolved task context $TASK_REPO#$TASK_NUMBER does not match issue mode $GITHUB_REPOSITORY#$ISSUE_NUMBER."
            exit 1
          }

          # kodmial/continuum#295: the pinned snapshot is the contract. Fail
          # closed when admission did not pin/verify it; never implement live
          # mutable text. The exact record lives in RUNNER_TEMP (same job),
          # so a later live edit cannot redefine the agent's specification.
          [[ "${SNAPSHOT_VERIFIED:-}" == "true" ]] || { echo "::error::Task snapshot was not pinned and verified for $GITHUB_REPOSITORY#$ISSUE_NUMBER; refusing to implement live mutable text."; exit 1; }
          [[ -n "${SNAPSHOT_SPEC:-}" && -n "${SNAPSHOT_TITLE_SHA:-}" && -n "${SNAPSHOT_BODY_SHA:-}" ]] || { echo "::error::Task snapshot digests are missing; refusing to implement."; exit 1; }
          SNAPSHOT_FILE="${RUNNER_TEMP:-/tmp}/continuum-task-snapshot.json"
          [[ -f "$SNAPSHOT_FILE" ]] || { echo "::error::Pinned task snapshot file is missing ($SNAPSHOT_FILE); refusing to implement."; exit 1; }
          EFFECTIVE_TITLE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"], end="")' "$SNAPSHOT_FILE")"
          EFFECTIVE_BODY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["body"], end="")' "$SNAPSHOT_FILE")"
          FILE_SPEC="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["spec_sha256"], end="")' "$SNAPSHOT_FILE")"
          [[ "$FILE_SPEC" == "$SNAPSHOT_SPEC" ]] || { echo "::error::Task snapshot file does not match verified digests; refusing to implement."; exit 1; }
          SNAPSHOT_REF="<!-- continuum-task-snapshot-ref repo=${GITHUB_REPOSITORY,,} issue=${ISSUE_NUMBER} generation=1 title-sha256=${SNAPSHOT_TITLE_SHA} body-sha256=${SNAPSHOT_BODY_SHA} spec-sha256=${SNAPSHOT_SPEC} -->"

          # kodmial/continuum#295: live-vs-pinned verification, used both
          # before the agent starts and right before PR publication, so a
          # mid-flight edit stops the generation at the earliest point.
          # Canonical digests mirror src/continuum/task_snapshot.py
          # (UTF-8, NFC, LF, SHA-256 over the hex pair). On drift, posts a
          # diagnostic and fails; never publishes or implements for a
          # stale contract.
          verify_snapshot_live() {
            local phase="$1"
            local live_json live_title live_body live_spec
            live_json="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body)" || return 1
            # Keep trailing newlines in title/body: Bash $(...) strips them.
            # Decode the authoritative JSON within Python before hashing.
            live_spec="$(printf '%s' "$live_json" | python3 -c 'import hashlib,json,sys,unicodedata; data=json.load(sys.stdin); norm=lambda v: unicodedata.normalize("NFC", str(v or "").replace("\r\n","\n").replace("\r","\n")); title=norm(data.get("title")); body=norm(data.get("body")); title_sha=hashlib.sha256(title.encode("utf-8")).hexdigest(); body_sha=hashlib.sha256(body.encode("utf-8")).hexdigest(); print(hashlib.sha256((title_sha+":"+body_sha).encode("ascii")).hexdigest())')" || return 1
            if [[ "$live_spec" != "$SNAPSHOT_SPEC" ]]; then
              # kodmial/continuum#309: one deterministic terminal stop,
              # never endless identical drift comments. The check is
              # trusted, generation-keyed, and scans the bounded full
              # history (up to 50 pages): only a trusted stop marker
              # for this exact (repo, issue, generation) suppresses
              # publication, so an untrusted lookalike never blocks a
              # legitimate first stop and a stop beyond 100 comments
              # is never reposted. Page arrays are merged with
              # jq -s 'add' before parsing so pretty-printed multi-line
              # gh api output never degrades to a false "active".
              # A fresh re-read before the terminal publication narrows
              # the concurrent-publish race; simultaneous writers still
              # converge on the earliest stop via first-writer-wins
              # selection. When the stop already exists this run only
              # fails; it posts nothing more and leaks no WIP.
              continuum_trusted_stop_state() {
                local stop_page stop_json stop_count stop_pages stop_file
                stop_pages="$(mktemp)"
                stop_file="$(mktemp)"
                : > "$stop_pages"
                for stop_page in $(seq 1 50); do
                  if ! stop_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100&page=$stop_page" 2>/dev/null)"; then
                    rm -f "$stop_pages" "$stop_file"
                    echo "active"
                    return 0
                  fi
                  echo "$stop_json" >> "$stop_pages"
                  stop_count="$(jq 'length' <<<"$stop_json" 2>/dev/null || echo 0)"
                  [[ "$stop_count" == "100" ]] || break
                done
                if ! jq -s 'add // []' "$stop_pages" > "$stop_file" 2>/dev/null; then
                  rm -f "$stop_pages" "$stop_file"
                  echo "active"
                  return 0
                fi
                rm -f "$stop_pages"
                CONTINUUM_STOP_FILE="$stop_file" CONTINUUM_STOP_REPO="${GITHUB_REPOSITORY,,}" CONTINUUM_STOP_ISSUE="$ISSUE_NUMBER" python3 -c 'import json,os,re; path=os.environ.get("CONTINUUM_STOP_FILE") or ""; repo=(os.environ.get("CONTINUUM_STOP_REPO") or "").lower(); issue=os.environ.get("CONTINUUM_STOP_ISSUE") or ""; data=json.load(open(path,encoding="utf-8")) if path else []; data=[data] if isinstance(data,dict) else (data if isinstance(data,list) else []); pat=re.compile(r"<!--\s*continuum-task-generation-stop\s+repo=([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+)\s+issue=(\d+)\s+generation=(\d+)\s+pinned-spec=([0-9a-fA-F]{64})\s+live-spec=([0-9a-fA-F]{64})\s+reason=(drift|tampered)\s*-->"); rec=re.compile(r"<!--\s*continuum-task-generation-recover\s+repo=([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+)\s+issue=(\d+)\s+generation=(\d+)\s*-->"); owner=(repo.split("/")[0] if "/" in repo else ""); stops=[]; recs=[]; [((stops.append(((c.get("created_at") or ""),int(c.get("id") or 0)))) if (m and m.group(1).lower()==repo and m.group(2)==issue and m.group(3)=="1") else (recs.append(((c.get("created_at") or ""),int(c.get("id") or 0)))) if (r and r.group(1).lower()==repo and r.group(2)==issue and r.group(3)=="1") else None) for c in data if isinstance(c,dict) for u in [c.get("user") if isinstance(c.get("user"),dict) else {}] if (str(c.get("author_association") or "").upper() in ("OWNER","MEMBER","COLLABORATOR") or str(u.get("login") or "").lower() in ("github-actions[bot]",owner)) for m in [pat.search(str(c.get("body") or ""))] for r in [rec.search(str(c.get("body") or ""))]]; stops.sort(); recs.sort(); print("stopped" if (stops and not (recs and recs[-1]>stops[-1])) else "active",end="")' 2>/dev/null || echo "active"
                rm -f "$stop_file"
              }
              if [[ "$(continuum_trusted_stop_state)" != "stopped" ]]; then
                gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                  --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-task-snapshot-drift -->' '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' "Task contract drift detected before $phase: the live issue no longer matches the pinned snapshot. This generation is stopped; open a new follow-up issue with an explicit dependency instead of editing the working issue.")" >/dev/null 2>&1 || true
                if [[ "$(continuum_trusted_stop_state)" != "stopped" ]]; then
                  gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                    --body "$(printf '%s\n%s\n%s\n%s' "<!-- continuum-task-generation-stop repo=${GITHUB_REPOSITORY,,} issue=${ISSUE_NUMBER} generation=1 pinned-spec=${SNAPSHOT_SPEC} live-spec=${live_spec} reason=drift -->" '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' "Continuum terminal generation stop for ${GITHUB_REPOSITORY}#${ISSUE_NUMBER} generation 1 (drift; pinned spec ${SNAPSHOT_SPEC}, live spec ${live_spec}). This generation will not be redispatched.")" >/dev/null 2>&1 || true
                fi
              fi
              echo "::error::Task contract drift detected before $phase for $GITHUB_REPOSITORY#$ISSUE_NUMBER (pinned spec $SNAPSHOT_SPEC, live spec $live_spec). Stopping; open a new follow-up issue instead of editing the working issue."
              return 1
            fi
          }

          git fetch origin "$BASE_REF" --quiet
          BASE_START_SHA="$(git rev-parse "origin/$BASE_REF")"
          BRANCH="opencode/issue${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          CHECKPOINT_BRANCH="opencode/checkpoint-issue${ISSUE_NUMBER}"

          # kodmial/continuum#290: a fresh-VM 429 resumption already restored
          # the exact checkpoint (see Restore 429 recovery checkpoint). Base
          # the task branch on the restored HEAD instead of the base or the
          # legacy interruption checkpoint, so no validated work is discarded.
          if [[ "${RECOVERY_RESUMED:-}" == "true" ]]; then
            git switch -c "$BRANCH"
            echo "Continuing issue #$ISSUE_NUMBER on fresh VM from 429 checkpoint stage '${RECOVERY_STAGE_IN:-implementation-incomplete}'."
          elif git ls-remote --exit-code --heads origin "refs/heads/$CHECKPOINT_BRANCH" >/dev/null 2>&1; then
            # Resume the latest interruption checkpoint if one exists. This
            # branch is workflow-owned and is deleted after a PR is published.
            git fetch origin "$CHECKPOINT_BRANCH" --quiet
            git switch -c "$BRANCH" FETCH_HEAD
            echo "Resuming issue #$ISSUE_NUMBER from interruption checkpoint $CHECKPOINT_BRANCH."
          else
            git switch --detach "origin/$BASE_REF"
            git switch -c "$BRANCH"
          fi

          checkpoint_issue_progress() {
            local exit_code="${1:-143}"
            trap - TERM INT HUP
            set +e
            if [[ "$(git branch --show-current)" == "$BRANCH" ]]; then
              find . -type d -name '__pycache__' -prune -exec rm -rf {} +
              find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
              if [[ -n "$(git status --porcelain)" ]]; then
                git add -A
                git commit -m "chore: checkpoint interrupted issue #${ISSUE_NUMBER}" \
                  -m "Continuum-Checkpoint-Issue: #${ISSUE_NUMBER}" \
                  -m "Continuum-Component: opencode" || true
              fi
              if [[ "$(git rev-parse HEAD)" != "$BASE_START_SHA" ]]; then
                # kodmial/continuum#302: interruption checkpoints are
                # permitted only as proven non-default refs; fail closed
                # before mutation instead of pushing to the default branch.
                continuum_assert_safe_push "$CHECKPOINT_BRANCH" || exit "$exit_code"
                git push --force origin "HEAD:refs/heads/$CHECKPOINT_BRANCH" || true
                echo "::warning::Checkpointed issue #$ISSUE_NUMBER progress before runner exit."
              fi
            fi
            exit "$exit_code"
          }
          trap 'checkpoint_issue_progress 143' TERM
          trap 'checkpoint_issue_progress 130' INT
          trap 'checkpoint_issue_progress 129' HUP

          PROMPT="$(cat <<EOF
          Implement the authoritative task ${TASK_REPO}#${TASK_NUMBER} completely.

          Task URL:
          ${ISSUE_URL}

          Title:
          ${EFFECTIVE_TITLE}

          Specification / Definition of Done:
          ${EFFECTIVE_BODY}

          Requirements:
          - Treat the issue body and its Definition of Done as authoritative.
          - The pinned task snapshot (spec ${SNAPSHOT_SPEC}) above is frozen for this generation: implement exactly it. If the live issue now differs, stop and report the drift instead of following the live edit; post-admission changes belong in a new follow-up issue.
          - Inspect the existing repository before changing code.
          - Implement the complete task, not a partial sketch.
          - Do not turn a tracking/umbrella issue or a task with unmet prerequisites into a partial PR. If the complete Definition of Done cannot be satisfied now, leave the repository unchanged and explain the blocker instead of inventing a smaller scope.
          - Add or update automated tests when appropriate.
          - Run the relevant local checks when practical.
          - Keep all comments and commit-facing text in English.
          - Do not add unrelated automation outside the issue scope.
          - You may modify .github/workflows/** when the issue requires it. Workflow changes must be published only on the task branch and reviewed through a pull request; never update main directly.
          - You may use GitHub CLI/API and dispatch existing repository workflows when required by the issue. Treat specialized workflows as tools: inspect their outputs, wait for completion, and use their evidence to satisfy the Definition of Done; the scheduler will not reroute the issue for you.
          - If the Definition of Done is fully satisfied without repository changes, post the required evidence on the issue and close the issue yourself only after every Definition of Done item is verified. Never close an implementation task that still requires code changes.
          - Track lifecycle progress for crash recovery: keep a one-line progress file at .continuum-429-stage in the repository root containing exactly one of: implementation-incomplete, implementation-complete, tests-running, tests-passed, publish-pr. Update it as you complete each phase (write tests-passed only after the full validation actually passes on the current tree). It is workflow-owned recovery metadata, never product code: never commit it, never include secrets, and never let its absence block the task.
          - Do not perform git commits, pushes, branch switches, rebases, resets, merges, or PR creation; the workflow owns Git state.
          EOF
          )"

          # The knowledge handoff is consumer-owned: Continuum ships no protocol
          # document and no validator, so both halves of the fork's mandatory
          # handoff appear in the prompt only when the consumer names them.
          if [[ -n "$KNOWLEDGE_PROTOCOL_PATH" ]]; then
            PROMPT="$PROMPT
          - Repository knowledge handoff is mandatory: before changing code, read ${KNOWLEDGE_PROTOCOL_PATH} and the prior notes and experiment records it points at.
          - Do not repeat a previously failed experiment unless a material premise changed; record that changed premise."
          fi
          if [[ -n "$KNOWLEDGE_RECORDS_DIR" ]]; then
            PROMPT="$PROMPT
          - Before finishing, write exactly one run record at ${KNOWLEDGE_RECORDS_DIR}/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}.md following the protocol. Never include secrets. The workflow validates this record and fails closed if it is missing."
          fi

          OPENCODE_RUN_LOG="$(mktemp)"
          # kodmial/continuum#295: last live check before the agent starts
          # (bounds wasted work when the issue was edited after admission).
          verify_snapshot_live "agent start" || exit 1
          # kodmial/continuum#290: a tests-passed/publish-pr checkpoint carries
          # exact-SHA evidence, so the fresh run must NOT call OpenCode again
          # merely to "finish". Skip the agent and proceed directly to
          # workflow-owned commit/push/PR publication below.
          if [[ "${RECOVERY_SKIP_OPENCODE:-}" == "true" ]]; then
            echo "429 checkpoint stage '${RECOVERY_STAGE_IN:-}' already carries exact-SHA evidence; skipping OpenCode and publishing directly."
            OPENCODE_RUN_RC=0
            rm -f "$OPENCODE_RUN_LOG"
          else
            set +e
            continuum-opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT" 2>&1 | tee "$OPENCODE_RUN_LOG"
            OPENCODE_RUN_RC=${PIPESTATUS[0]}
            set -e
          fi
          if [[ "$OPENCODE_RUN_RC" -eq 143 || "$OPENCODE_RUN_RC" -eq 130 || "$OPENCODE_RUN_RC" -eq 129 ]]; then
            rm -f "$OPENCODE_RUN_LOG"
            checkpoint_issue_progress "$OPENCODE_RUN_RC"
          fi
          trap - TERM INT HUP
          if grep -Eiq 'FreeUsageLimitError' "$OPENCODE_RUN_LOG" || \
             { [[ "$OPENCODE_RUN_RC" -ne 0 ]] && grep -Eiq 'APIError.*429|HTTP[^0-9]*429([^0-9]|$)|429[[:space:]]+Too[[:space:]]+Many[[:space:]]+Requests|statusCode[^0-9]*429([^0-9]|$)' "$OPENCODE_RUN_LOG"; }; then
            # kodmial/continuum#290: 429 burns this VM. Workflow-owned
            # evacuation persists working-tree changes, commits, SHAs,
            # operation identity, stage, and evidence to the durable
            # recovery ref, marks the runner burned (no second model call on
            # this VM), and exits 75. Never sleeps/retries the model here.
            rm -f "$OPENCODE_RUN_LOG"
            trap - TERM INT HUP
            export CONTINUUM_429_LEGACY_REF="$CHECKPOINT_BRANCH"
            continuum_429_evacuate "opencode-429-issue-issue${ISSUE_NUMBER}" "implementation-incomplete" "issue" "$ISSUE_NUMBER" "" "$BASE_START_SHA"
          fi
          rm -f "$OPENCODE_RUN_LOG"
          if [[ "$OPENCODE_RUN_RC" -ne 0 ]]; then
            exit "$OPENCODE_RUN_RC"
          fi

          if [[ -n "$KNOWLEDGE_RECORDS_DIR" ]]; then
            RECORD_PATH="${KNOWLEDGE_RECORDS_DIR}/issue-${ISSUE_NUMBER}-run-${GITHUB_RUN_ID}.md"
            [[ -f "$RECORD_PATH" ]] || {
              echo "::error::Mandatory knowledge handoff record is missing: $RECORD_PATH"
              exit 1
            }
            echo "Validated knowledge handoff: $RECORD_PATH"
          fi

          CURRENT_BRANCH="$(git branch --show-current)"
          if [[ "$CURRENT_BRANCH" != "$BRANCH" ]]; then
            echo "::error::OpenCode changed branch unexpectedly: expected '$BRANCH', got '$CURRENT_BRANCH'."
            exit 1
          fi

          WORKTREE_DIRTY=false
          if [[ -n "$(git status --porcelain)" ]]; then
            WORKTREE_DIRTY=true
          fi
          COMMITS_FROM_START="$(git rev-list --count "$BASE_START_SHA..HEAD" 2>/dev/null || echo 0)"
          if [[ "$WORKTREE_DIRTY" != "true" && "$COMMITS_FROM_START" -eq 0 ]]; then
            ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [[ "$ISSUE_STATE" == "CLOSED" ]]; then
              gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --remove-label "$IN_PROGRESS_LABEL" >/dev/null 2>&1 || true
              echo "Issue #$ISSUE_NUMBER completed without repository changes and was closed with evidence."
              exit 0
            fi
            echo "OpenCode produced no repository changes."
            if [[ "${PAUSE_ON_FAILURE,,}" == "false" ]]; then
              echo "::error::No repository changes; autonomous mode delegates bounded retry/recovery instead of pausing."
              exit 1
            fi
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '%s\n%s\n%s' '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' 'Automation produced no code changes; pausing this issue for manual inspection.')"
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label "$PAUSE_LABEL" --remove-label "$IN_PROGRESS_LABEL" >/dev/null 2>&1 || true
            exit 0
          fi

          # Keep generated Python bytecode out of task commits even when an
          # agent or test run created it before staging. .gitignore prevents new
          # cache files; this also removes any tracked leftovers.
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          # kodmial/continuum#290: the 429 stage-progress file is
          # workflow-owned recovery metadata, never product code. The
          # evacuator commits it into checkpoints when present; the task
          # commit below must not carry it into the PR.
          rm -f .continuum-429-stage

          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            # kodmial/continuum#260: workflow-owned task commit sets the bot
            # identity (see Configure Git identity) and carries the component
            # trailer. The agent itself never commits (see prompt: the workflow
            # owns Git state), so this is the single deterministic owner.
            git commit -m "${COMMIT_PREFIX}: implement issue #${ISSUE_NUMBER}" -m "Continuum-Component: opencode"
          fi
          TASK_COMMIT="$(git rev-parse HEAD)"

          # The checkout credential is TAP_PAT, which must carry repo + workflow
          # scopes so issue implementations can include Actions workflow files.
          # Publication still targets only the generated task branch; main is
          # changed exclusively through the normal pull-request lifecycle.

          # Publish the task commit from the exact base the agent used. Do not
          # replay it onto a moving base here: merge/conflict reconciliation
          # belongs to the PR controller, and conflating the two turns an
          # ordinary conflict into a failed task.
          BASE_SHA="$(git rev-parse "$TASK_COMMIT^")"
          [[ -n "$BASE_SHA" ]] || { echo "::error::Could not resolve task base SHA"; exit 1; }

          # kodmial/continuum#302: new issue implementation creates a task
          # branch plus PR. The branch must be a proven non-default ref
          # before any ref creation or push; recovery resumes this same
          # branch and never falls back to the default branch.
          continuum_assert_safe_push "$BRANCH" || exit 1

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" \
            -f sha="$BASE_SHA" >/dev/null

          git push --force-with-lease="refs/heads/$BRANCH:$BASE_SHA" -u origin "HEAD:$BRANCH"

          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all \
            --json number --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            # kodmial/continuum#295: revalidate the pinned snapshot against
            # live issue content right before publication to close
            # time-of-check/time-of-use gaps. On drift, stop with an
            # actionable diagnostic; never publish a PR for a stale contract.
            verify_snapshot_live "PR publication" || exit 1
            # A capability with mandatory live qualification must never be
            # auto-closed by PR keywords: `Closes #N` would bypass the
            # qualification gate, so a qualifying issue gets a non-closing
            # body and the gate completes it only on exact-SHA evidence.
            TASK_MARKER="<!-- continuum-task-context repo=${GITHUB_REPOSITORY} issue=${ISSUE_NUMBER} -->"
            if grep -Eqi '<!--[[:space:]]*automation-qualification:' <<<"$EFFECTIVE_BODY"; then
              PR_BODY="$(printf '%s\n%s\n\nAutomated implementation for #%s.\n\nRelates to #%s\n\nMandatory live qualification is declared on #%s; this PR must not auto-close it. The qualification gate records the merged main SHA and dispatches qualification after merge.' "$TASK_MARKER" "$SNAPSHOT_REF" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
            else
              PR_BODY="$(printf '%s\n%s\n\nAutomated implementation for #%s.\n\nCloses #%s' "$TASK_MARKER" "$SNAPSHOT_REF" "$ISSUE_NUMBER" "$ISSUE_NUMBER")"
            fi
            PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_REF" \
              --head "$BRANCH" \
              --title "$EFFECTIVE_TITLE" \
              --body "$PR_BODY")"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          fi

          if [[ -n "$CI_WORKFLOW_ID" ]]; then
            gh workflow run "$CI_WORKFLOW_ID" --repo "$GITHUB_REPOSITORY" --ref "$BASE_REF" -f "pr_number=$PR_NUMBER" \
              || echo "::warning::Could not dispatch $CI_WORKFLOW_ID for PR #$PR_NUMBER"
          fi
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/$CHECKPOINT_BRANCH" \
            >/dev/null 2>&1 || true
          echo "Created/updated PR #$PR_NUMBER for issue #$ISSUE_NUMBER."

      - name: Resolve qualification run identity
        id: qualification_identity
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification') ||
          (github.event_name == 'issue_comment' &&
           contains(github.event.comment.body, 'continuum-qualification-dispatch'))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const dispatchMode = '${{ inputs.mode }}' === 'qualification';
            let capability = '${{ inputs.capability_number }}';
            let qualification = '${{ inputs.qualification_number }}';
            let sha = '${{ inputs.required_sha }}';
            if (!dispatchMode) {
              const body = context.payload.comment?.body || '';
              const marker = body.match(
                /<!--\s*continuum-qualification-dispatch\s+capability\s*=\s*(\d+)\s+qualification\s*=\s*(\d+)\s+sha\s*=\s*([0-9a-f]{40})\s*-->/i
              );
              if (!marker) {
                core.setOutput('active', 'false');
                return;
              }
              // Bind to the triggering dispatch comment's triple, never to
              // the latest marker currently visible on the issue: a later
              // SHA-B dispatch must not retarget an already-started SHA-A run.
              capability = marker[1];
              qualification = marker[2];
              sha = marker[3].toLowerCase();
              const association = String(
                context.payload.comment?.author_association || ''
              ).toUpperCase();
              const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']).has(association) ||
                context.payload.comment?.user?.login === context.repo.owner;
              if (!trusted) {
                core.setFailed('Untrusted qualification dispatch marker; refusing to run.');
                return;
              }
            }
            if (!/^[0-9]+$/.test(capability) || !/^[0-9]+$/.test(qualification) || !/^[0-9a-f]{40}$/i.test(sha)) {
              core.setFailed('Invalid immutable qualification run identity.');
              return;
            }
            core.setOutput('active', 'true');
            core.setOutput('capability_number', capability);
            core.setOutput('qualification_number', qualification);
            core.setOutput('required_sha', sha.toLowerCase());
            core.notice(
              'Qualification run bound to capability #' + capability +
              ' qualification #' + qualification + ' sha ' + sha.toLowerCase() + '.'
            );

      - name: Run mandatory qualification at the exact required SHA
        if: >-
          steps.qualification_identity.outputs.active == 'true' &&
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification' ||
           github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          CAPABILITY_NUMBER: ${{ steps.qualification_identity.outputs.capability_number || inputs.capability_number }}
          QUALIFICATION_NUMBER: ${{ steps.qualification_identity.outputs.qualification_number || inputs.qualification_number || inputs.issue_number || github.event.issue.number }}
          REQUIRED_SHA: ${{ steps.qualification_identity.outputs.required_sha || inputs.required_sha }}
          IN_PROGRESS_LABEL: ${{ inputs.in_progress_label || vars.AUTOMATION_IN_PROGRESS_LABEL || 'automation:in-progress' }}
          RECOVERY_RESUMED: ${{ steps.recovery_restore.outputs.resumed }}
          RECOVERY_SKIP_OPENCODE: ${{ steps.recovery_restore.outputs.skip_opencode }}
          RECOVERY_STAGE_IN: ${{ steps.recovery_restore.outputs.stage }}
          RECOVERY_GENERATION_IN: ${{ inputs.recovery_generation }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP:-/tmp}/continuum-429-evacuate.sh" 2>/dev/null || true
          [[ "$QUALIFICATION_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Missing qualification issue number."; exit 2; }
          [[ "$REQUIRED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing exact required SHA for qualification."; exit 2; }
          [[ "$CAPABILITY_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Missing capability number for qualification run identity."; exit 2; }

          # Fetch the exact required SHA explicitly with depth 1 before
          # checkout. Fetching current main is insufficient when main has
          # advanced past the required SHA.
          git fetch origin "$REQUIRED_SHA" --depth 1
          git switch --detach FETCH_HEAD
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA,,}" == "${REQUIRED_SHA,,}" ]] || {
            echo "::error::Checked out $ACTUAL_SHA instead of required $REQUIRED_SHA."
            exit 2
          }
          echo "Qualification testing exact required SHA $REQUIRED_SHA for capability #$CAPABILITY_NUMBER (qualification #$QUALIFICATION_NUMBER)."

          ISSUE_BODY="$(gh issue view "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          ISSUE_TITLE="$(gh issue view "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq '.title // ""')"
          PROMPT="$(cat <<EOF
          Mandatory live qualification for capability #${CAPABILITY_NUMBER} at exact main SHA ${REQUIRED_SHA}.

          Qualification issue: #${QUALIFICATION_NUMBER}
          Title:
          ${ISSUE_TITLE}

          Specification / Definition of Done:
          ${ISSUE_BODY}

          Immutable run identity: capability=${CAPABILITY_NUMBER} qualification=${QUALIFICATION_NUMBER} sha=${REQUIRED_SHA}.
          A later main advance or a later dispatch marker must never retarget this run; test exactly ${REQUIRED_SHA}.

          Requirements:
          - This is qualification mode, not implementation mode: validate the issue Definition of Done against the exact required SHA. Do NOT implement product code.
          - Checkout and test exactly ${REQUIRED_SHA} (already checked out). Do not test whatever main has advanced to later.
          - Product and repository changes are forbidden in qualification mode. Do not edit, commit, push, or open a pull request. Leave the working tree clean.
          - Never close the qualification issue itself. Pass/fail is reported as evidence, not as issue closure. Repair is a separate task.
          - Publish exactly one canonical result marker as a comment on qualification issue #${QUALIFICATION_NUMBER} for the exact SHA, either result=pass or result=fail. Do not publish markers for any other SHA.
          - A fail verdict is a lifecycle signal for the scheduler to create the repair issue; it is not an infrastructure failure.
          - No-code plus valid pass/fail evidence is a successful qualification execution. No-code without evidence fails closed and will be retried automatically.
          - Do not perform git commits, pushes, branch switches, rebases, resets, merges, or PR creation; the workflow owns Git state.
          EOF
          )"
          # kodmial/continuum#290: a tests-passed/publish-pr checkpoint carries
          # exact-SHA evidence, so the fresh run must NOT call OpenCode again
          # merely to "finish". Skip the agent and verify the trusted evidence
          # for the exact SHA directly below.
          OPENCODE_RUN_LOG="$(mktemp)"
          # kodmial/continuum#290: a fresh-VM 429 resumption re-reads trusted
          # exact-SHA evidence before invoking the model. When the burned
          # runner's agent already published a canonical pass/fail marker
          # for REQUIRED_SHA, the new run skips OpenCode and proceeds
          # directly to the workflow-owned verification below. The read is
          # fail-closed: an unreadable API response runs the agent instead
          # of skipping on unproven state.
          if [[ "${RECOVERY_SKIP_OPENCODE:-}" != "true" && "${RECOVERY_RESUMED:-}" == "true" ]]; then
            QUAL_PRIOR_EVIDENCE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$QUALIFICATION_NUMBER/comments?per_page=100" --jq '
              [ .[] |
                select(
                  ( .author_association == "OWNER" or .author_association == "MEMBER" or
                    .author_association == "COLLABORATOR" or .user.login == "github-actions[bot]" or .author.login == "github-actions[bot]" )
                  and ( (.body // "") | contains("continuum-qualification-dispatch") | not )
                  and ( (.body // "") | test("<!--[ \\t]*continuum-qualification-result[ \\t>]") )
                ) | .body
              ] | join("\n---\n")
            ' 2>/dev/null || true)"
            if [[ -n "${REQUIRED_SHA:-}" ]] && grep -Eqi "<!--[[:space:]]*continuum-qualification-result[^>]*sha[[:space:]]*=[[:space:]]*${REQUIRED_SHA}[^>]*result[[:space:]]*=[[:space:]]*(pass|fail)" <<<"${QUAL_PRIOR_EVIDENCE:-}"; then
              echo "429 resumption: trusted exact-SHA qualification evidence already exists for $REQUIRED_SHA; skipping OpenCode qualification agent."
              RECOVERY_SKIP_OPENCODE="true"
            fi
          fi
          if [[ "${RECOVERY_SKIP_OPENCODE:-}" == "true" ]]; then
            echo "429 checkpoint stage '${RECOVERY_STAGE_IN:-}' already carries exact-SHA evidence; skipping OpenCode qualification agent."
            OPENCODE_RUN_RC=0
            rm -f "$OPENCODE_RUN_LOG"
          else
            set +e
            continuum-opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT" 2>&1 | tee "$OPENCODE_RUN_LOG"
            OPENCODE_RUN_RC=${PIPESTATUS[0]}
            set -e
          fi
          if grep -Eiq 'FreeUsageLimitError' "$OPENCODE_RUN_LOG" || \
             { [[ "$OPENCODE_RUN_RC" -ne 0 ]] && grep -Eiq 'APIError.*429|HTTP[^0-9]*429([^0-9]|$)|429[[:space:]]+Too[[:space:]]+Many[[:space:]]+Requests|statusCode[^0-9]*429([^0-9]|$)' "$OPENCODE_RUN_LOG"; }; then
            # kodmial/continuum#290: 429 burns this VM. Workflow-owned
            # evacuation persists the exact required SHA, operation identity,
            # and qualification stage to the durable recovery ref, marks the
            # runner burned (no second model call on this VM), and exits 75.
            rm -f "$OPENCODE_RUN_LOG"
            continuum_429_evacuate "opencode-429-qualification-qual${QUALIFICATION_NUMBER}-sha${REQUIRED_SHA:0:12}" "qualification" "qualification" "" "$QUALIFICATION_NUMBER" "$REQUIRED_SHA"
          fi
          rm -f "$OPENCODE_RUN_LOG"
          if [[ "$OPENCODE_RUN_RC" -ne 0 ]]; then
            exit "$OPENCODE_RUN_RC"
          fi

          # Qualification mode cannot push product changes: untracked tool
          # droppings are discarded silently, and only tracked working-tree
          # diffs are forbidden. Discard untracked files first so a leftover
          # log/tmp file next to valid evidence does not fail the run.
          git clean -fd >/dev/null 2>&1 || true
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Qualification mode produced repository changes, which are forbidden. Discarding them."
            git status --porcelain --untracked-files=no
            git reset --hard HEAD >/dev/null 2>&1 || true
            git clean -fd >/dev/null 2>&1 || true
            gh issue comment "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '%s\n%s\n%s' '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' 'Qualification attempted product changes in qualification mode, which is forbidden. The run is recorded as failed without evidence; it will be retried automatically.')" >/dev/null 2>&1 || true
            exit 1
          fi

          # Verify trusted evidence for the exact SHA exists. Dispatch bodies
          # never count, public forgeries are rejected, and stale SHAs are
          # rejected. Docker/Render automation payloads count where allowed.
          EVIDENCE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/issues/$QUALIFICATION_NUMBER/comments?per_page=100" --jq '
            [ .[] |
              select(
                ( .author_association == "OWNER" or .author_association == "MEMBER" or
                  .author_association == "COLLABORATOR" or .user.login == "github-actions[bot]" or .author.login == "github-actions[bot]" )
                and ( (.body // "") | contains("continuum-qualification-dispatch") | not )
                and (
                  ((.body // "") | test("<!--[ \\t]*continuum-qualification-result[ \\t>]")) or
                  ((.body // "") | contains("<!-- continuum-docker-qualification-result -->")) or
                  ((.body // "") | contains("<!-- continuum-render-qualification-result -->"))
                )
              ) | .body
            ] | join("\n---\n")
          ')"
          if grep -Eqi "<!--[[:space:]]*continuum-qualification-result[^>]*sha[[:space:]]*=[[:space:]]*${REQUIRED_SHA}[^>]*result[[:space:]]*=[[:space:]]*pass" <<<"$EVIDENCE_STATE"; then
            echo "Qualification pass evidence recorded for exact SHA $REQUIRED_SHA."
          elif grep -Eqi "<!--[[:space:]]*continuum-qualification-result[^>]*sha[[:space:]]*=[[:space:]]*${REQUIRED_SHA}[^>]*result[[:space:]]*=[[:space:]]*fail" <<<"$EVIDENCE_STATE"; then
            echo "Qualification fail evidence recorded for exact SHA $REQUIRED_SHA; scheduler will route repair."
          else
            echo "Docker/Render payload or canonical marker check: looking for exact-SHA evidence."
            if grep -Eq "${REQUIRED_SHA}" <<<"$EVIDENCE_STATE" && grep -Eqi "pass|fail|classification|result|verdict" <<<"$EVIDENCE_STATE"; then
              echo "Specialized controller evidence present for exact SHA $REQUIRED_SHA."
            else
              echo "::error::No trusted pass/fail evidence for exact SHA $REQUIRED_SHA; failing closed for automatic retry."
              gh issue comment "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "$(printf '%s\n%s\n%s' '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' "Qualification run for exact SHA \`$REQUIRED_SHA\` produced no trusted pass/fail evidence; it will be retried automatically with the same run identity (capability #$CAPABILITY_NUMBER, qualification #$QUALIFICATION_NUMBER, sha \`$REQUIRED_SHA\`).")" >/dev/null 2>&1 || true
              gh issue edit "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --remove-label "$IN_PROGRESS_LABEL" >/dev/null 2>&1 || true
              exit 1
            fi
          fi

          # Success in both verdicts: never pause, never close. Pass completes
          # the capability; fail routes to the existing repair issue. The
          # scheduler wakes from the result comment (cron remains the backstop).
          gh issue edit "$QUALIFICATION_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label "$IN_PROGRESS_LABEL" >/dev/null 2>&1 || true
          echo "Qualification execution succeeded with valid evidence; leaving the qualification issue open for the scheduler."

      - name: Fix CodeRabbit review findings
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coderabbit-fix' && steps.recovery_restore.outputs.skip_opencode != 'true'
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          GITHUB_TOKEN: ${{ secrets.TAP_PAT }}
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ inputs.review_id }}
          HEAD_REF: ${{ inputs.head_ref }}
          TASK_CONTEXT_PRESENT: ${{ steps.task_context.outputs.present }}
          TASK_REPO: ${{ steps.task_context.outputs.task_repo }}
          TASK_NUMBER: ${{ steps.task_context.outputs.task_number }}
          RECOVERY_GENERATION_IN: ${{ inputs.recovery_generation }}
        run: |
          set -euo pipefail
          # kodmial/continuum#295: frozen task-spec guard for repair. The
          # PR's snapshot reference is the pinned contract; the live issue
          # is re-read and compared before any repair work. On drift, stop
          # with an actionable diagnostic: no silent rebaseline, no
          # spurious "fixed" verdict. A PR without a snapshot reference is
          # legacy (created before the guard) and proceeds explicitly
          # without drift protection.
          if [[ -n "${PR_NUMBER:-}" ]]; then
            if ! REPAIR_PR_BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' 2>/dev/null)"; then
              echo "::error::Could not fetch PR #$PR_NUMBER body for snapshot verification; refusing repair."
              exit 1
            fi
            REPAIR_SNAPSHOT_REF="$(grep -oE '<!--[[:space:]]*continuum-task-snapshot-ref[^>]*-->' <<<"$REPAIR_PR_BODY" | head -n 1 || true)"
            if [[ -z "$REPAIR_SNAPSHOT_REF" ]]; then
              echo "::notice::PR #$PR_NUMBER carries no task snapshot reference (legacy, pre-guard PR); repair proceeds explicitly without drift protection."
            else
              REF_REPO="$(sed -nE 's/.*repo=([A-Za-z0-9_.\-]+\/[A-Za-z0-9_.\-]+).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1)"
              REF_ISSUE="$(sed -nE 's/.*issue=([0-9]+).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1)"
              REF_TITLE_SHA="$(sed -nE 's/.*title-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
              REF_BODY_SHA="$(sed -nE 's/.*body-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
              REF_GENERATION="$(sed -nE 's/.*generation=([0-9]+).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1)"
              REF_SPEC_SHA="$(sed -nE 's/.*spec-sha256=([0-9a-fA-F]{64}).*/\1/p' <<<"$REPAIR_SNAPSHOT_REF" | head -n 1 | tr 'A-F' 'a-f')"
              if [[ -z "$REF_REPO" || -z "$REF_ISSUE" || -z "$REF_GENERATION" || -z "$REF_TITLE_SHA" || -z "$REF_BODY_SHA" || -z "$REF_SPEC_SHA" ]]; then
                echo "::error::PR #$PR_NUMBER snapshot reference is malformed; refusing repair without a verifiable contract."
                exit 1
              fi
              if [[ "$REF_GENERATION" != "1" ]]; then
                echo "::error::PR #$PR_NUMBER snapshot reference is for generation $REF_GENERATION, expected generation 1 (stale contract); refusing repair."
                exit 1
              fi
              if [[ "${TASK_CONTEXT_PRESENT:-}" == "true" ]]; then
                if [[ -n "${TASK_REPO:-}" && "$(tr '[:upper:]' '[:lower:]' <<<"$REF_REPO")" != "$(tr '[:upper:]' '[:lower:]' <<<"$TASK_REPO")" ]]; then
                  echo "::error::PR #$PR_NUMBER snapshot reference $REF_REPO#$REF_ISSUE does not match expected task $TASK_REPO#${TASK_NUMBER:-} (wrong issue); refusing repair."
                  exit 1
                fi
                if [[ -n "${TASK_NUMBER:-}" && "$REF_ISSUE" != "$TASK_NUMBER" ]]; then
                  echo "::error::PR #$PR_NUMBER snapshot reference #$REF_ISSUE does not match expected task #${TASK_NUMBER} on $REF_REPO (wrong issue); refusing repair."
                  exit 1
                fi
              fi
              # The PR body is mutable, so the reference alone never defines
              # the contract: require it to match the durable snapshot comment
              # before comparing live text. A PR-body edit that retargets the
              # ref shas to an edited issue otherwise passes verification.
              if ! SNAP_COMMENTS_JSON="$(gh api "repos/$REF_REPO/issues/$REF_ISSUE/comments?per_page=100&page=1" 2>/dev/null)"; then
                echo "::error::Could not list task snapshot comments for $REF_REPO#$REF_ISSUE; refusing repair."
                exit 1
              fi
              SNAP_PINNED="$(SNAP_COMMENTS_JSON="$SNAP_COMMENTS_JSON" SNAP_REF_REPO="$REF_REPO" SNAP_REF_ISSUE="$REF_ISSUE" SNAP_REF_GENERATION="$REF_GENERATION" python3 -c 'import json,os,re; data=json.loads(os.environ.get("SNAP_COMMENTS_JSON") or "[]"); repo=(os.environ.get("SNAP_REF_REPO") or "").lower(); issue=os.environ.get("SNAP_REF_ISSUE") or ""; gen=os.environ.get("SNAP_REF_GENERATION") or ""; pat=re.compile(r"<!--\s*continuum-task-snapshot\s+repo=([A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+)\s+issue=(\d+)\s+generation=(\d+)\s+title-sha256=([0-9a-fA-F]{64})\s+body-sha256=([0-9a-fA-F]{64})\s+spec-sha256=([0-9a-fA-F]{64})\s*-->"); trusted={"OWNER","MEMBER","COLLABORATOR"}; out=[(m.group(4).lower(),m.group(5).lower(),m.group(6).lower()) for c in data if isinstance(c,dict) for u in [c.get("user") if isinstance(c.get("user"),dict) else {}] for m in [pat.search(str(c.get("body") or ""))] if m and m.group(1).lower()==repo and m.group(2)==issue and m.group(3)==gen and (str(c.get("author_association") or "").upper() in trusted or str(u.get("login") or "").lower()=="github-actions[bot]")]; print("\n".join(out[0]) if out else "",end="")')"
              SNAP_PINNED_TITLE_SHA="$(sed -n '1p' <<<"$SNAP_PINNED")"
              SNAP_PINNED_BODY_SHA="$(sed -n '2p' <<<"$SNAP_PINNED")"
              SNAP_PINNED_SPEC_SHA="$(sed -n '3p' <<<"$SNAP_PINNED")"
              if [[ -z "$SNAP_PINNED_TITLE_SHA" || -z "$SNAP_PINNED_BODY_SHA" || -z "$SNAP_PINNED_SPEC_SHA" ]]; then
                echo "::error::No trusted task snapshot comment found for $REF_REPO#$REF_ISSUE; refusing repair."
                exit 1
              fi
              if [[ "$SNAP_PINNED_TITLE_SHA" != "$REF_TITLE_SHA" || "$SNAP_PINNED_BODY_SHA" != "$REF_BODY_SHA" || "$SNAP_PINNED_SPEC_SHA" != "$REF_SPEC_SHA" ]]; then
                echo "::error::PR #$PR_NUMBER snapshot reference does not match the durable task snapshot comment; refusing repair."
                exit 1
              fi
              if ! REPAIR_LIVE_JSON="$(gh issue view "$REF_ISSUE" --repo "$REF_REPO" --json title,body 2>/dev/null)"; then
                echo "::error::Could not fetch live task $REF_REPO#$REF_ISSUE for snapshot verification; refusing repair."
                exit 1
              fi
              if [[ -z "$REPAIR_LIVE_JSON" ]]; then
                echo "::error::Could not fetch live task $REF_REPO#$REF_ISSUE for snapshot verification; refusing repair."
                exit 1
              fi
              REPAIR_DIGESTS="$(REPAIR_LIVE_JSON="$REPAIR_LIVE_JSON" python3 -c 'import hashlib,json,os,unicodedata; norm=lambda v: unicodedata.normalize("NFC", v.replace("\r\n","\n").replace("\r","\n")); data=json.loads(os.environ.get("REPAIR_LIVE_JSON") or "{}"); title=norm(data.get("title") or ""); body=norm(data.get("body") or ""); title_sha=hashlib.sha256(title.encode("utf-8")).hexdigest(); body_sha=hashlib.sha256(body.encode("utf-8")).hexdigest(); spec_sha=hashlib.sha256((title_sha+":"+body_sha).encode("ascii")).hexdigest(); print(title_sha); print(body_sha); print(spec_sha)')"
              LIVE_TITLE_SHA="$(sed -n '1p' <<<"$REPAIR_DIGESTS")"
              LIVE_BODY_SHA="$(sed -n '2p' <<<"$REPAIR_DIGESTS")"
              LIVE_SPEC_SHA="$(sed -n '3p' <<<"$REPAIR_DIGESTS")"
              if [[ "$LIVE_TITLE_SHA" != "$REF_TITLE_SHA" || "$LIVE_BODY_SHA" != "$REF_BODY_SHA" || "$LIVE_SPEC_SHA" != "$REF_SPEC_SHA" ]]; then
                gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                  --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-task-snapshot-drift -->' '⚡ **Continuum · opencode**' '<!-- continuum-origin role=continuum component=opencode -->' "Task contract drift detected for $REF_REPO#$REF_ISSUE: the live issue no longer matches the PR's pinned snapshot. Repair is stopped for this generation; open a new follow-up issue with an explicit dependency instead of editing the working issue.")" >/dev/null 2>&1 || true
                echo "::error::Task contract drift detected for $REF_REPO#$REF_ISSUE (PR #$PR_NUMBER). Repair stopped; open a new follow-up issue instead of editing the working issue."
                exit 1
              fi
              echo "Task snapshot verified for $REF_REPO#$REF_ISSUE before repair of PR #$PR_NUMBER."
            fi
          fi
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP:-/tmp}/continuum-429-evacuate.sh" 2>/dev/null || true
          # kodmial/continuum#302: repair updates only the exact current PR
          # head. HEAD_REF must be a proven non-default ref before the agent
          # runs; the push below re-asserts it after the exact-head race
          # check. Missing/moved/ambiguous identity fails closed, and only
          # the PR merge operation may update the default branch.
          continuum_assert_safe_push() {
            local dest="${1:-}"
            local repo="${2:-$GITHUB_REPOSITORY}"
            dest="${dest#refs/heads/}"
            dest="$(printf '%s' "$dest" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ -z "$dest" ]]; then echo "::error::Continuum branch safety: refusing code push with an empty destination." >&2; return 1; fi
            case "$dest" in HEAD|@|FETCH_HEAD|ORIG_HEAD|MERGE_HEAD) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in *".."*|*"~"*|*"^"*|*"?"*|*"*"*|*"["*|*" "*|*"@{"*) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            case "$dest" in -*|/*|*/|*.lock) echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1;; esac
            if [[ "$dest" == *"//"* ]]; then echo "::error::Continuum branch safety: refusing ambiguous push destination '$dest'." >&2; return 1; fi
            local default_branch=""
            default_branch="$(gh api "repos/$repo" --jq .default_branch 2>/dev/null || true)"
            default_branch="${default_branch#refs/heads/}"
            default_branch="$(printf '%s' "$default_branch" | tr -d '[:space:]')"
            if [[ -z "$default_branch" ]]; then echo "::error::Continuum branch safety: repository default branch is undiscoverable for '$repo'; refusing code push to '$dest'." >&2; return 1; fi
            if [[ "$dest" == "$default_branch" ]]; then echo "::error::Continuum branch safety: refusing code push to the default branch '$dest'. Recovery resumes the same PR branch; only the PR merge operation may update the default branch." >&2; return 1; fi
          }
          continuum_assert_safe_push "$HEAD_REF" || exit 1
          PROMPT=$(cat <<EOF
          Fix every CodeRabbit review finding on pull request #${PR_NUMBER}.

          Context:
          - CodeRabbit submitted review id ${REVIEW_ID}.
          - The current checkout is the existing PR head branch: ${HEAD_REF}.
          - Inspect that CodeRabbit review body, its inline review comments, the PR
            conversation, and the current diff using GitHub CLI/API as needed.

          Requirements:
          - Address every finding from that CodeRabbit review, including non-blocking
            nitpick feedback that CodeRabbit may submit as COMMENTED while also approving.
          - Keep fixes scoped to the review feedback; do not make unrelated refactors.
          - Run the relevant tests, linters, or validation for the files you change.
          - Work only in the current checked-out PR branch. Do not create or switch to
            another branch and do not create a new pull request.
          - Do not commit, push, switch branches, rebase, or reset; the workflow
            owns Git state and publishes exactly one bot-identity commit after
            this run. Leave fixes as working-tree changes.
          - If a finding is incorrect or no longer applicable, do not make a speculative
            code change; explain the reason in the existing PR conversation.
          - Do not resolve or dismiss CodeRabbit review threads yourself. CodeRabbit will
            independently verify every original finding after this repair step completes.
          - If no actionable findings remain, leave the code unchanged.
          - Keep all comments and commit messages in English.
          EOF
          )
          # Snapshot the exact PR head inspected by this repair. If trusted
          # automation advances the branch while OpenCode runs, publication
          # fails closed and the watchdog reruns coderabbit-fix on the new head.
          REPAIR_BASE_SHA="$(git rev-parse HEAD)"
          # kodmial/continuum#290: a fresh-VM resumption already restored the
          # exact 429 checkpoint before any work, so repair resumes from the
          # preserved PR HEAD identity instead of re-inspecting from scratch.
          if [[ -n "${{ inputs.recovery_checkpoint_ref }}" ]]; then
            echo "Continuing CodeRabbit repair for PR #${PR_NUMBER} on fresh VM from 429 checkpoint ${{ inputs.recovery_checkpoint_ref }}."
          fi
          OPENCODE_RUN_LOG="$(mktemp)"
          set +e
          continuum-opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT" 2>&1 | tee "$OPENCODE_RUN_LOG"
          OPENCODE_RUN_RC=${PIPESTATUS[0]}
          set -e
          if grep -Eiq 'FreeUsageLimitError' "$OPENCODE_RUN_LOG" || \
             { [[ "$OPENCODE_RUN_RC" -ne 0 ]] && grep -Eiq 'APIError.*429|HTTP[^0-9]*429([^0-9]|$)|429[[:space:]]+Too[[:space:]]+Many[[:space:]]+Requests|statusCode[^0-9]*429([^0-9]|$)' "$OPENCODE_RUN_LOG"; }; then
            # kodmial/continuum#290: 429 burns this VM. Workflow-owned
            # evacuation preserves the working tree, the exact PR HEAD
            # identity (REPAIR_BASE_SHA), and the review-repair stage to the
            # durable recovery ref; repair resumes on a new run without losing
            # the PR HEAD. No second model call on this VM; exit 75.
            rm -f "$OPENCODE_RUN_LOG"
            continuum_429_evacuate "opencode-429-coderabbit-fix-pr${PR_NUMBER}-review${REVIEW_ID}" "review-repair" "coderabbit-fix" "" "$PR_NUMBER" "$REPAIR_BASE_SHA"
          fi
          rm -f "$OPENCODE_RUN_LOG"
          if [[ "$OPENCODE_RUN_RC" -ne 0 ]]; then
            exit "$OPENCODE_RUN_RC"
          fi

          # kodmial/continuum#260: deterministic ownership — the workflow owns
          # the final commit with the bot identity (see Configure Git
          # identity) plus the component trailer. The agent never commits.
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: address CodeRabbit review findings for PR #${PR_NUMBER}" -m "Continuum-Component: opencode"
          fi

          # Main-sync and other trusted automation may advance the PR branch
          # while OpenCode is working. Never rewrite developer history to replay
          # a repair. If the remote HEAD moved, fail with a dedicated recovery
          # marker; the watchdog re-runs this same workflow with preserved
          # coderabbit-fix inputs against the latest PR HEAD.
          if [[ "$(git rev-list --count "${REPAIR_BASE_SHA}"..HEAD)" -gt 0 ]]; then
            git fetch --no-tags origin "${HEAD_REF}"
            REMOTE_HEAD="$(git rev-parse "origin/${HEAD_REF}")"

            if [[ "$REMOTE_HEAD" != "$REPAIR_BASE_SHA" ]]; then
              echo "::error::CONTINUUM_OPENCODE_PUBLISH_RACE_RETRY_REQUIRED"
              echo "::error::PR head advanced from $REPAIR_BASE_SHA to $REMOTE_HEAD while repairing; restarting coderabbit-fix on the latest branch state."
              exit 76
            fi

            # kodmial/continuum#302: exact-head race check passed; the push
            # must still target a proven non-default ref.
            continuum_assert_safe_push "${HEAD_REF}" || exit 1
            if ! git push origin "HEAD:${HEAD_REF}"; then
              echo "::error::CONTINUUM_OPENCODE_PUBLISH_RACE_RETRY_REQUIRED"
              echo "::error::OpenCode repair publication raced with another PR update; restarting coderabbit-fix on the latest branch state."
              exit 76
            fi
          fi

      - name: Ask CodeRabbit to verify every original finding
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coderabbit-fix'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ inputs.review_id }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const reviewId = Number(process.env.REVIEW_ID);

            if (!Number.isInteger(pullNumber) || !Number.isInteger(reviewId)) {
              core.setFailed('Invalid pull request number or CodeRabbit review id.');
              return;
            }

            const sourceReview = await github.rest.pulls.getReview({
              owner,
              repo,
              pull_number: pullNumber,
              review_id: reviewId,
            });
            const reviewedSha = sourceReview.data.commit_id;

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (pr.data.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed(
                `PR #${pullNumber}: CodeRabbit repair verification requires a same-repository head branch.`
              );
              return;
            }

            // pulls.get can lag immediately after the repair push. Resolve the
            // authoritative branch ref directly so verification is always
            // pinned to the commit that was actually published.
            const headRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${pr.data.head.ref}`,
            });
            const headSha = headRef.data.object.sha;
            if (pr.data.head.sha !== headSha) {
              core.notice(
                `PR #${pullNumber}: pull metadata still reports stale HEAD ${pr.data.head.sha}; verifying published branch HEAD ${headSha}.`
              );
            }

            const comments = await github.paginate(
              github.rest.pulls.listReviewComments,
              {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }
            );

            const findings = comments.filter(
              (comment) =>
                comment.pull_request_review_id === reviewId &&
                comment.user?.login === 'coderabbitai[bot]' &&
                !comment.in_reply_to_id
            );

            let requested = 0;
            if (findings.length === 0) {
              core.notice(
