name: Continuum reusable child dispatcher

on:
  workflow_call:
    inputs:
      worker_workflow:
        type: string
        required: false
        default: continuum-child-worker.yml
      review_workflow:
        type: string
        required: false
        default: continuum-child-review.yml
      manual_pr_review_workflow:
        type: string
        required: false
        default: continuum-child-pr-review.yml
      engine_ref:
        type: string
        required: false
        default: main
    secrets:
      CHILD_RUNTIME_TOKEN:
        required: true
      CHILD_RUNTIME_REPOSITORIES:
        required: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    # Compatibility shim for already-installed Child dispatcher callers. Parent
    # repositories are now scheduled by the ordinary Issue scheduler, so an
    # old caller must not start a second independent child queue.
    if: vars.CONTINUUM_ROLE != 'parent'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_CHILD_DISPATCH_TIMEOUT_MINUTES || '8') }}
    env:
      GH_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      CHILD_REPOSITORIES: ${{ secrets.CHILD_RUNTIME_REPOSITORIES }}
      WORKER_WORKFLOW: ${{ inputs.worker_workflow }}
      REVIEW_WORKFLOW: ${{ inputs.review_workflow }}
      MANUAL_PR_REVIEW_WORKFLOW: ${{ inputs.manual_pr_review_workflow }}
      # Same default as continuum-issue-scheduler.yml's pause_marker, so a parent that
      # renames the scheduler's pause label must rename this knob too.
      AUTOMATION_PAUSE_LABEL: ${{ vars.AUTOMATION_PAUSE_LABEL || 'automation:paused' }}
      COMMAND_GRACE_MINUTES: ${{ vars.AUTOMATION_COMMAND_GRACE_MINUTES || '5' }}
    steps:
      - name: Checkout parent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Continuum engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.engine_ref }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Export Continuum engine root
        shell: bash
        run: |
          set -euo pipefail
          echo "CONTINUUM_ENGINE_ROOT=$GITHUB_WORKSPACE/.continuum-engine" >> "$GITHUB_ENV"

      - name: Reconcile configured children
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          plan="$(PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES" bash "$resolver" plan)"

          active_titles="$(
            gh run list --repo "$GITHUB_REPOSITORY" --limit 100               --json status,displayTitle               --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .displayTitle'               2>/dev/null || true
          )"

          task_active() {
            local child_id="$1" kind="$2" task="$3"
            local neutral_title
            if [[ "$kind" == "task" ]]; then
              neutral_title="SubTask #$task"
            else
              neutral_title="SubTask review #$task"
            fi
            grep -Fxq "$neutral_title" <<<"$active_titles" ||
              grep -Fxq "Child $kind [$child_id] #$task" <<<"$active_titles"
          }

          manual_pr_active() {
            local child_id="$1" pr="$2"
            grep -Fxq "SubTask PR review #$pr" <<<"$active_titles" ||
              grep -Fxq "Child PR review [$child_id] #$pr" <<<"$active_titles"
          }

          invalid=0
          dispatched=0

          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            child_id="$(jq -r '.id' <<<"$row")"
            child_repo="$(jq -r '.repository' <<<"$row")"

            # Single-pass dependency-state memo (#254): repeated lookups of
            # the same blocking issue across tasks in this child cost one
            # API read. Callers pass an output variable name (no command
            # substitution) so the cache survives in this shell.
            declare -A CONTINUUM_DEP_STATE=()
            dep_state() {
              local __out="$1" __dep="$2" __cached="__missing__"
              if [[ -v CONTINUUM_DEP_STATE[$__dep] ]]; then
                __cached="${CONTINUUM_DEP_STATE[$__dep]}"
              fi
              if [[ "$__cached" == "__missing__" ]]; then
                __cached="$(gh api "repos/$child_repo/issues/$__dep" --jq '.state' 2>/dev/null || echo open)"
                CONTINUUM_DEP_STATE[$__dep]="$__cached"
              fi
              printf -v "$__out" '%s' "$__cached"
            }

            if ! PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES" \
              bash "$resolver" verify "$child_id" "$child_repo" >/dev/null 2>&1; then
              echo "::error::Delegated relationship verification failed."
              invalid=$((invalid + 1))
              continue
            fi

            # Delegated tasks must not become permanently stranded because a
            # previous controller closed their PR. Reopen automation-owned
            # unmerged PRs while the task is still open; explicit dependency
            # markers remain the source of intentional blocking.
            while IFS=$'\t' read -r stale_pr stale_head; do
              [[ -n "$stale_pr" && -n "$stale_head" ]] || continue
              stale_task="$(
                sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p' <<<"$stale_head"
              )"
              [[ -n "$stale_task" ]] || continue
              stale_issue_json="$(
                gh api "repos/$child_repo/issues/$stale_task" 2>/dev/null || true
              )"
              stale_issue_state="$(jq -r '.state // "closed"' <<<"$stale_issue_json")"
              [[ "$stale_issue_state" == "open" ]] || continue

              # A closed delegated PR is recoverable only when the task is
              # actually ready. Never resurrect a superseded implementation
              # whose issue is still dependency-blocked.
              stale_body="$(jq -r '.body // ""' <<<"$stale_issue_json")"
              stale_ready=true
              stale_deps="$(
                sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p' \
                  <<<"$stale_body" | head -1 | tr ',' ' '
              )"
              for stale_dep in $stale_deps; do
                stale_dep="${stale_dep//#/}"
                stale_dep="${stale_dep//[[:space:]]/}"
                [[ "$stale_dep" =~ ^[0-9]+$ ]] || continue
                dep_state stale_dep_state "$stale_dep"
                if [[ "$stale_dep_state" != "closed" ]]; then
                  stale_ready=false
                  break
                fi
              done
              [[ "$stale_ready" == true ]] || continue

              if gh pr reopen "$stale_pr" --repo "$child_repo" >/dev/null 2>&1; then
                echo "Reopened stale delegated PR #$stale_pr for child task #$stale_task."
              fi
            done < <(
              gh pr list --repo "$child_repo" --state closed --limit 100 \
                --json number,headRefName,mergedAt \
                --jq '.[] | select(.mergedAt == null) | select(
                    (.headRefName | startswith("continuum-child/task-")) or
                    (.headRefName | startswith("runtime-worker/task-"))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )

            open_prs="$(
              gh pr list --repo "$child_repo" --state open --limit 100 \
                --json number,headRefName \
                --jq 'sort_by(.number) | reverse | .[] | select(
                    (.headRefName | startswith("continuum-child/task-")) or
                    (.headRefName | startswith("runtime-worker/task-"))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )"
            open_pr_tasks="$(
              cut -f2 <<<"$open_prs" \
                | sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p'
            )"
            local_opencode_pr_tasks="$(
              gh pr list --repo "$child_repo" --state open --limit 100 \
                --json headRefName \
                --jq '.[] | .headRefName | select(startswith("opencode/issue"))' \
                | sed -nE 's#^opencode/issue([0-9]+)-.*#\1#p'
            )"
            local_opencode_run_tasks="$(
              # Only recent active work matters here. Bound the lookup to the
              # latest 300 runs instead of paginating the full Actions history.
              for page in 1 2 3; do
                gh api "repos/$child_repo/actions/runs?per_page=100&page=$page" \
                  --jq '.workflow_runs[]
                    | select(.status != "completed")
                    | .display_title
                    | select(test("^OpenCode issue #[0-9]+$"))
                    | capture("^OpenCode issue #(?<task>[0-9]+)$").task' \
                  2>/dev/null || break
              done
            )"
            child_owner="$(gh api "repos/$child_repo" --jq '.owner.login' 2>/dev/null || true)"
            command_grace_seconds=$(( COMMAND_GRACE_MINUTES * 60 ))

            local_override_active() {
              local task_number="$1"
              local recent_command command_epoch now_epoch

              if grep -Fxq "$task_number" <<<"$local_opencode_pr_tasks" ||
                 grep -Fxq "$task_number" <<<"$local_opencode_run_tasks"; then
                return 0
              fi

              [[ -n "$child_owner" ]] || return 1
              # Bounded comment window (#254): owner override commands are
              # recent by construction, so the newest five pages bound the
              # cost without walking full comment history. Comments list
              # oldest-first, so pages 1-5 would miss a recent override on
              # a long thread; scan newest-first instead.
              recent_command=""
              override_seen=""
              override_total="$(gh api "repos/$child_repo/issues/$task_number" --jq '.comments // 0' 2>/dev/null || echo 0)"
              [[ "$override_total" =~ ^[0-9]+$ ]] || override_total=0
              override_last_page=$(( (override_total + 99) / 100 ))
              [[ "$override_last_page" -ge 1 ]] || override_last_page=1
              override_first_page=$(( override_last_page - 4 ))
              [[ "$override_first_page" -ge 1 ]] || override_first_page=1
              for override_page in $(seq "$override_first_page" "$override_last_page"); do
                override_json="$(
                  gh api "repos/$child_repo/issues/$task_number/comments?per_page=100&page=$override_page" \
                    2>/dev/null || true
                )"
                override_count="$(jq 'length' <<<"$override_json" 2>/dev/null || echo 0)"
                [[ "$override_count" =~ ^[0-9]+$ ]] && [[ "$override_count" -gt 0 ]] || break
                override_seen+="$(jq -r --arg owner "$child_owner" \
                  '.[] | select(.user.login == $owner) | select((.body // "") | test("(^|[[:space:]])/(oc|opencode)([[:space:]]|$)")) | .created_at' \
                  <<<"$override_json" 2>/dev/null)"$'\n'
                [[ "$override_count" -lt 100 ]] && break
              done
              recent_command="$(grep -v '^$' <<<"$override_seen" | tail -n 1 | tr -d '[:space:]' || true)"
              [[ -n "$recent_command" ]] || return 1

              command_epoch="$(date -d "$recent_command" +%s 2>/dev/null || echo 0)"
              now_epoch="$(date +%s)"
              (( command_epoch > 0 && now_epoch - command_epoch < command_grace_seconds ))
            }

            if [[ -n "$open_prs" ]]; then
              selected_review_tasks=""
              while IFS=$'\t' read -r pr_number head_ref; do
                [[ -n "$pr_number" ]] || continue
                task_number="$(
                  sed -nE 's#^(continuum-child|runtime-worker)/task-([0-9]+)-.*#\2#p' <<<"$head_ref"
                )"
                [[ -n "$task_number" ]] || continue

                # A completed child task must never resurrect through a stale
                # retry PR. Close leftovers immediately.
                task_state="$(
                  gh api "repos/$child_repo/issues/$task_number" --jq '.state' 2>/dev/null || echo closed
                )"
                if [[ "$task_state" != "open" ]]; then
                  gh pr comment "$pr_number" --repo "$child_repo" \
                    --body "Closed automatically: delegated task #$task_number is already completed." \
                    >/dev/null 2>&1 || true
                  gh pr close "$pr_number" --repo "$child_repo" >/dev/null 2>&1 || true
                  echo "Closed stale delegated PR #$pr_number for completed task #$task_number."
                  continue
                fi

                # Only the newest open retry for a task enters delegated review
                # during one dispatcher cycle.
                if grep -Fxq "$task_number" <<<"$selected_review_tasks"; then
                  echo "Skipping duplicate delegated PR #$pr_number for task #$task_number in this cycle."
                  continue
                fi
                selected_review_tasks+="$task_number"$'\n'

                if task_active "$child_id" task "$task_number" ||
                   task_active "$child_id" review "$task_number"; then
                  continue
                fi
                gh workflow run "$REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                  -f child_id="$child_id" \
                  -f task_number="$task_number" \
                  -f pr_number="$pr_number" >/dev/null
                dispatched=$((dispatched + 1))
              done <<<"$open_prs"
            fi

            # Owner-created same-repository PRs are first-class child work even
            # when they have no source issue. Automation-owned task branches
            # keep the stronger issue-based review path above.
            manual_prs="$(
              gh api --paginate "repos/$child_repo/pulls?state=open&per_page=100" \
                --jq '.[] |
                  select(.draft == false) |
                  select(.head.repo.full_name == .base.repo.full_name) |
                  select(.user.login == .base.repo.owner.login) |
                  select(
                    ((.head.ref | startswith("continuum-child/task-")) or
                     (.head.ref | startswith("runtime-worker/task-"))) | not
                  ) |
                  select(([.labels[]?.name] | index("no-auto-merge")) | not) |
                  .number' 2>/dev/null || true
            )"

            if [[ -n "$manual_prs" ]]; then
              while IFS= read -r manual_pr; do
                [[ -n "$manual_pr" ]] || continue
                manual_pr_active "$child_id" "$manual_pr" && continue
                gh workflow run "$MANUAL_PR_REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                  -f child_id="$child_id" \
                  -f pr_number="$manual_pr" >/dev/null
                dispatched=$((dispatched + 1))
                echo "Dispatched owner-created child PR #$manual_pr for independent review."
              done <<<"$manual_prs"
            fi

            issues_json="$(
              gh api --paginate "repos/$child_repo/issues?state=open&per_page=100" 2>/dev/null
            )"

            # Every open issue in a verified child belongs to the parent execution
            # plane. A stale automation pause from an older local scheduler must
            # therefore not strand child work.
            while IFS= read -r paused_task; do
              [[ -n "$paused_task" ]] || continue
              gh api --method DELETE \
                "repos/$child_repo/issues/$paused_task/labels/${AUTOMATION_PAUSE_LABEL//:/%3A}" \
                >/dev/null 2>&1 || true
              echo "Cleared stale $AUTOMATION_PAUSE_LABEL on child task #$paused_task."
            done < <(
              jq -r --arg pause "$AUTOMATION_PAUSE_LABEL" '
                .[]
                | select(.pull_request == null)
                | select(any(.labels[]?.name; . == $pause))
                | .number
              ' <<<"$issues_json"
            )
            issues_json="$(
              jq --arg pause "$AUTOMATION_PAUSE_LABEL" '
                map(
                  if .pull_request == null
                  then .labels = [(.labels[]? | select(.name != $pause))]
                  else .
                  end
                )
              ' <<<"$issues_json"
            )"
            # Preload known-open states from the snapshot just fetched so
            # steady-state passes skip re-reading them below.
            while IFS= read -r open_number; do
              [[ -n "$open_number" && "$open_number" =~ ^[0-9]+$ ]] || continue
              CONTINUUM_DEP_STATE[$open_number]="${CONTINUUM_DEP_STATE[$open_number]:-open}"
            done < <(jq -r '.[].number' <<<"$issues_json" 2>/dev/null || true)

            while IFS= read -r encoded; do
              [[ -n "$encoded" ]] || continue
              decoded="$(base64 -d <<<"$encoded")"
              task_number="$(jq -r '.[0]' <<<"$decoded")"
              body="$(jq -r '.[1]' <<<"$decoded")"

              task_active "$child_id" task "$task_number" && continue
              task_active "$child_id" review "$task_number" && continue
              grep -Fxq "$task_number" <<<"$open_pr_tasks" && continue

              if local_override_active "$task_number"; then
                echo "Skipping child task #$task_number: local manual OpenCode work is active."
                continue
              fi

              ready=true
              deps="$(
                sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p' \
                  <<<"$body" | head -1 | tr ',' ' '
              )"
              for dep in $deps; do
                dep="${dep//#/}"
                dep="${dep//[[:space:]]/}"
                [[ "$dep" =~ ^[0-9]+$ ]] || continue
                dep_state state "$dep"
                if [[ "$state" != "closed" ]]; then
                  ready=false
                  break
                fi
              done
              [[ "$ready" == true ]] || continue

              gh workflow run "$WORKER_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                -f child_id="$child_id" \
                -f task_number="$task_number" >/dev/null
              dispatched=$((dispatched + 1))
            done < <(
              jq -r '
                map(
                  select(.pull_request == null)
                  | . + {
                      _continuum_priority_rank:
                        (if any(.labels[]?.name; . == "priority:p0") then 0
                         elif any(.labels[]?.name; . == "priority:p1") then 1
                         elif any(.labels[]?.name; . == "priority:p2") then 2
                         else 3
                         end)
                    }
                )
                | sort_by(._continuum_priority_rank, .number)
                | .[]
                | [.number, (.body // "")]
                | @base64
              ' <<<"$issues_json"
            )
          done < <(jq -c '.[]' <<<"$plan")

          echo "Reconciled configured child relationships; dispatched $dispatched run(s)."
          if [[ "$invalid" -gt 0 ]]; then
            echo "::error::$invalid configured child relationship(s) failed bidirectional verification."
            exit 2
          fi
