name: Continuum reusable scheduler

on:
  workflow_call:
    inputs:
      opencode_workflow:
        description: >-
          Entry workflow file the scheduler dispatches the agent into. Left
          unset, it resolves from CONTINUUM_AGENT_ENTRY_WORKFLOW, because the
          file a repository's agent runs in is that repository's own choice.
        type: string
        required: false
      wip_limit:
        type: number
        required: false
        default: 2
      lease_minutes:
        type: number
        required: false
        default: 45
      max_attempts:
        type: number
        required: false
        default: 3

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reconcile and dispatch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow || vars.CONTINUUM_AGENT_ENTRY_WORKFLOW }}
          WIP_LIMIT: ${{ inputs.wip_limit }}
          LEASE_MINUTES: ${{ inputs.lease_minutes }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          # Which labels rank work, in order, and which body marker makes an
          # issue delegation-owned. Both are the consumer's own labelling
          # convention; Continuum reads them and never invents them.
          PRIORITY_LABELS: ${{ vars.CONTINUUM_DISPATCH_PRIORITY_LABELS }}
          TASK_OPT_IN_MARKER: ${{ vars.CONTINUUM_TASK_OPT_IN_MARKER }}
          LEGACY_TASK_MARKER: ${{ vars.CONTINUUM_LEGACY_TASK_MARKER }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const repoFullName = `${owner}/${repo}`;
            const inProgress = 'automation:in-progress';
            const paused = 'automation:paused';
            const marker = '<!-- continuum-dispatch -->';
            const infraRetryPrefix = '<!-- continuum-infra-retry:';
            const wipLimit = Number(process.env.WIP_LIMIT || 2);
            const leaseMs = Number(process.env.LEASE_MINUTES || 45) * 60 * 1000;
            const maxAttempts = Number(process.env.MAX_ATTEMPTS || 3);
            const requiredSetting = name => {
              const value = (process.env[name] || '').trim();
              if (!value) {
                throw new Error(
                  `repository variable ${name} is required: Continuum does not choose it`
                );
              }
              return value;
            };
            const agentWorkflow = requiredSetting('OPENCODE_WORKFLOW');
            const priorityLabels = requiredSetting('PRIORITY_LABELS')
              .split(',').map(l => l.trim()).filter(l => l);
            const priority = new Map(priorityLabels.map((label, rank) => [label, rank]));
            const optInMarker = requiredSetting('TASK_OPT_IN_MARKER');
            const legacyMarker = (process.env.LEGACY_TASK_MARKER || '').trim();

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({owner, repo, name});
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              }
            }
            async function addLabel(number, name) {
              await github.rest.issues.addLabels({owner, repo, issue_number:number, labels:[name]});
            }
            async function removeLabel(number, name) {
              try { await github.rest.issues.removeLabel({owner, repo, issue_number:number, name}); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            async function retryEpochStartedAt(number) {
              const events = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/events',
                {owner, repo, issue_number:number, per_page:100}
              );
              const resets = events
                .filter(e => e.event === 'unlabeled' && e.label?.name === paused && e.created_at)
                .map(e => new Date(e.created_at).getTime())
                .filter(Number.isFinite);
              return resets.length ? Math.max(...resets) : 0;
            }
            async function retryState(number) {
              const [comments, epochStartedAt] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number:number, per_page:100
                }),
                retryEpochStartedAt(number),
              ]);
              const current = comments
                .filter(c => new Date(c.created_at).getTime() >= epochStartedAt)
                .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
              const dispatches = current.filter(c => (c.body || '').includes(marker));
              const infraRetries = [];
              let latestInfraRetry = null;
              for (const comment of current) {
                const body = comment.body || '';
                if (!body.includes(infraRetryPrefix)) continue;
                const match = body.match(
                  /<!-- continuum-infra-retry:\s*attempt=(\d+)\s+next_retry_at=([^\s]+)\s+code=([A-Za-z0-9_.-]+)\s+run=(\d+)\s*-->/
                );
                if (!match) continue;
                const nextRetryAt = new Date(match[2]).getTime();
                if (!Number.isFinite(nextRetryAt)) continue;
                const candidate = {
                  attempt:Number(match[1]),
                  nextRetryAt,
                  nextRetryAtText:match[2],
                  code:match[3],
                  runId:Number(match[4]),
                  createdAt:new Date(comment.created_at).getTime(),
                };
                infraRetries.push(candidate);
                if (!latestInfraRetry || candidate.createdAt > latestInfraRetry.createdAt) {
                  latestInfraRetry = candidate;
                }
              }
              return {
                dispatches,
                infraRetries,
                semanticAttempts:Math.max(0, dispatches.length - infraRetries.length),
                latestInfraRetry,
              };
            }

            await ensureLabel(inProgress, 'FBCA04', 'Continuum currently owns this issue');
            await ensureLabel(paused, 'B60205', 'Continuum automation is paused');

            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state:'open', per_page:100
            });
            const issues = all.filter(i => !i.pull_request && i.user?.login === owner);
            const labelsOf = i => new Set((i.labels || []).map(l => typeof l === 'string' ? l : l.name));
            const delegatedToParent = i => {
              const body = i.body || '';
              return body.includes(optInMarker) ||
                (legacyMarker !== '' && body.includes(legacyMarker));
            };

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state:'open', per_page:100
            });
            const activeByPr = new Set();
            for (const pr of prs) {
              if (pr.head?.repo?.full_name !== repoFullName) continue;
              const m = (pr.head.ref || '').match(/^opencode\/issue(\d+)-/);
              if (m) activeByPr.add(Number(m[1]));
            }

            const active = new Set(activeByPr);
            for (const issue of issues) {
              const labels = labelsOf(issue);
              if (!labels.has(inProgress) || activeByPr.has(issue.number)) continue;

              const retry = await retryState(issue.number);
              const last = retry.dispatches.at(-1);
              if (!last) {
                await removeLabel(issue.number, inProgress);
                continue;
              }
              const age = Date.now() - new Date(last.created_at).getTime();
              if (age < leaseMs) {
                active.add(issue.number);
              } else {
                await removeLabel(issue.number, inProgress);
                if (retry.semanticAttempts >= maxAttempts) await addLabel(issue.number, paused);
              }
            }

            const free = Math.max(0, wipLimit - active.size);
            core.notice(`Continuum WIP ${active.size}/${wipLimit}; free=${free}.`);
            if (!free) return;

            const candidates = issues
              .filter(i => !active.has(i.number))
              .filter(i => !labelsOf(i).has(paused))
              .filter(i => !delegatedToParent(i))
              .map(i => {
                const ranks = [...labelsOf(i)].filter(l => priority.has(l)).map(l => priority.get(l));
                return {issue:i, rank:ranks.length ? Math.min(...ranks) : 3};
              })
              .sort((a,b) => a.rank - b.rank || a.issue.number - b.issue.number);

            let dispatched = 0;
            for (const item of candidates) {
              if (dispatched >= free) break;
              const issue = item.issue;

              // Enforce the retry budget before every dispatch, not only when
              // an in-progress lease expires. Fast deterministic failures can
              // clear the ownership label immediately; without this guard each
              // scheduler reconciliation would dispatch the same broken task
              // forever.
              const retry = await retryState(issue.number);
              if (retry.latestInfraRetry && Date.now() < retry.latestInfraRetry.nextRetryAt) {
                core.info(
                  `Issue #${issue.number}: infrastructure retry ${retry.latestInfraRetry.attempt}/8 ` +
                  `is deferred until ${retry.latestInfraRetry.nextRetryAtText} (${retry.latestInfraRetry.code}).`
                );
                continue;
              }
              if (retry.semanticAttempts >= maxAttempts) {
                await addLabel(issue.number, paused);
                core.warning(
                  `Issue #${issue.number}: semantic attempt budget ${maxAttempts} exhausted; ` +
                  `${retry.infraRetries.length} infrastructure retry/retries were excluded.`
                );
                continue;
              }

              let blockers = [];
              try {
                blockers = await github.paginate(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  {
                    owner, repo, issue_number:issue.number, per_page:100,
                    headers:{'X-GitHub-Api-Version':'2026-03-10'}
                  }
                );
              } catch (e) {
                core.warning(`Could not read dependencies for #${issue.number}: ${e.message}`);
                continue;
              }
              if (blockers.some(b => b.state === 'open')) continue;

              await addLabel(issue.number, inProgress);
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: agentWorkflow,
                  ref: 'main',
                  inputs: {mode:'issue', issue_number:String(issue.number)}
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number:issue.number,
                  body:[marker, 'Automatically dispatched by Continuum.'].join('\n')
                });
                dispatched++;
                core.notice(`Dispatched #${issue.number} to ${agentWorkflow}.`);
              } catch (e) {
                await removeLabel(issue.number, inProgress);
                throw e;
              }
            }
