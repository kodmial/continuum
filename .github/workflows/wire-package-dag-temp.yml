name: Wire package-publisher DAG

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  wire:
    if: github.event.head_commit.message == 'wire-package-publisher-dag'
    runs-on: ubuntu-latest
    steps:
      - name: Add dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          H=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10")
          gh api --method POST "${H[@]}"             "repos/$GITHUB_REPOSITORY/issues/23/dependencies/blocked_by"             -F issue_id=5614461245 >/dev/null
          gh api --method POST "${H[@]}"             "repos/$GITHUB_REPOSITORY/issues/22/dependencies/blocked_by"             -F issue_id=5614989614 >/dev/null
