name: Model route availability canary

on:
  push:
    branches: [fix/model-route-probe-20261018]
    paths:
      - .github/workflows/model-route-availability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-route-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CI: "true"
    steps:
      - name: Install official OpenCode CLI
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 45 https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify old PR-Agent OpenCode 1.18.34 compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 40 https://opencode.ai/install | bash -s -- --version 1.18.34
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version
          set +e
          timeout 50s opencode run --model opencode/nemotron-3-ultra-free "Reply exactly OK." > "$RUNNER_TEMP/v1-model-output.txt" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            if grep -qi 'deprecated' "$RUNNER_TEMP/v1-model-output.txt"; then
              echo "v1.18.34/Nemotron: DEPRECATED" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "v1.18.34/Nemotron: FAILED (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          echo "v1.18.34/Nemotron: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove actual Hello World inference
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          results = []
          available = []
          model_rejected_by_zen = False

          def record(label, state):
              results.append((label, state))
              if state == "PASS":
                  available.append(label)
              print(f"{label}: {state}", flush=True)

          def classify(output):
              s = output.lower()
              if "free tier can only be used from within opencode" in s:
                  return "DENIED_CLIENT_OR_AUTH"
              if "deprecated" in s:
                  return "DEPRECATED"
              if "429" in s or "rate limit" in s:
                  return "RATE_LIMITED"
              if "unauthorized" in s or "authentication" in s or "401" in s:
                  return "AUTH_REQUIRED"
              return "FAILED"

          try:
              ver = subprocess.run(["opencode", "--version"], capture_output=True, text=True, timeout=12)
              if ver.returncode == 0:
                  record("official CLI installation", "PASS")
              else:
                  record("official CLI installation", "FAILED")
          except (OSError, subprocess.TimeoutExpired):
              record("official CLI installation", "FAILED")

          if "official CLI installation" in available:
              for model in ("opencode/mimo-v2.5-free", "opencode/nemotron-3-ultra-free"):
                  if model_rejected_by_zen:
                      record(model, "SKIPPED_SHARED_ZEN_AUTH_FAILURE")
                      break
                  try:
                      proc = subprocess.run(
                          ["opencode", "run", "--model", model, "Reply with exactly OK."],
                          cwd="/tmp", capture_output=True, text=True, timeout=55,
                          env={**os.environ, "DO_NOT_TRACK": "1"},
                      )
                      output = proc.stdout + "\n" + proc.stderr
                      state = "PASS" if proc.returncode == 0 and "OK" in proc.stdout.upper() else classify(output)
                      if state == "DENIED_CLIENT_OR_AUTH":
                          model_rejected_by_zen = True
                      record(model, state)
                  except subprocess.TimeoutExpired:
                      record(model, "TIMEOUT")
                  except OSError:
                      record(model, "CLI_ERROR")

          def external_call(label, endpoint, key_env, model):
              key = os.getenv(key_env, "").strip()
              if not key:
                  record(label, "NOT_CONFIGURED")
                  return
              body = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                  "max_tokens": 32,
                  "stream": False,
              }).encode()
              req = urllib.request.Request(
                  endpoint, data=body, headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                  }, method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      parsed = json.loads(res.read(200000).decode())
                  answer = parsed.get("choices", [{}])[0].get("message", {}).get("content", "")
                  record(label, "PASS" if "OK" in str(answer).upper() else "EMPTY_OR_INVALID_RESPONSE")
              except urllib.error.HTTPError as exc:
                  # Never emit response bodies, credentials or prompt content.
                  record(label, f"HTTP_{exc.code}")
              except Exception as exc:
                  record(label, type(exc).__name__.upper())

          external_call("Groq GPT-OSS-120B", "https://api.groq.com/openai/v1/chat/completions",
                        "GROQ_API_KEY", "openai/gpt-oss-120b")
          external_call("OpenRouter free router", "https://openrouter.ai/api/v1/chat/completions",
                        "OPENROUTER_API_KEY", "openrouter/free")

          print("RESULT: " + ("HAS_WORKING_MODEL " + ",".join(available) if
                               any(x != "official CLI installation" for x in available)
                               else "NO_WORKING_MODEL"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Actual inference canary (not model catalogue)\n\n")
              f.write("| Route | Result |\n|---|---|\n")
              for k, v in results:
                  f.write(f"| {k} | {v} |\n")
          if not any(x != "official CLI installation" for x in available):
              sys.exit(1)
          PY
