# Every fresh PR head invalidates CI readiness and the per-head review-request
# lock. After CI succeeds, continuum-add-review-label.yml either requests a fresh full
# CodeRabbit review or safely carries an earlier approval when continuum-auto-merge.yml
# proves that the new HEAD is only a clean controller-generated merge of main.
name: remove-review-ready-on-sync

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    # Verified child PR lifecycle runs in the public parent. Duplicate label
    # housekeeping is parent-owned work. A fork PR has no write permission for
    # the label mutation, so it is never attempted.
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # This synchronize reset can name only the repository-variable
          # repair label, not a label supplied through the repair caller's
          # optional `ci_repair_label` dispatch input. Such an override is
          # still reset because the repair engine stamps the lock description
          # below on every CI repair label it creates: the reset finds those
          # labels by their marker, so a lock taken for the previous head can
          # never suppress repair of the new one. Keep this literal identical
          # to `lock_description`/`--description` in
          # continuum-opencode-repair.yml.
          CI_REPAIR_LABEL: ${{ vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
          CI_REPAIR_LOCK_DESCRIPTION: 'One automatic OpenCode CI repair attempt per failing PR head.'
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const payload = context.payload || {};
            const currentHeadSha = String(
              (payload.pull_request &&
               payload.pull_request.head &&
               payload.pull_request.head.sha) ||
              payload.after ||
              ''
            ).trim();

            // A new head always requires fresh CI and a fresh CI-repair
            // opportunity. The review-request lock is also reset here; after
            // green CI, continuum-add-review-label.yml recreates it either by requesting
            // CodeRabbit or by proving a safe clean-main-sync carry-forward.
            const ciRepairLabel =
              String(process.env.CI_REPAIR_LABEL || 'opencode-ci-repair').trim();
            const repairLockDescription =
              String(process.env.CI_REPAIR_LOCK_DESCRIPTION || '').trim();

            const reviewLabels = new Set([
              'review-ready',
              'coderabbit-review-requested',
            ]);
            // Always collect the known repair labels, even when the
            // attached-label read below fails. Anything the repair engine
            // tagged with its lock description is added to that set, which
            // covers a dispatch input override this event cannot name from
            // configuration.
            const repairLabels = new Set([
              'opencode-ci-repair',
            ]);
            if (!reviewLabels.has(ciRepairLabel)) {
              repairLabels.add(ciRepairLabel);
            }
            let labelDiscoveryFailed = false;
            if (repairLockDescription) {
              const maxAttempts = 3;
              let attached = [];
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  attached = await github.paginate(
                    github.rest.issues.listLabelsOnIssue,
                    { owner, repo, issue_number: number, per_page: 100 }
                  );
                  labelDiscoveryFailed = false;
                  break;
                } catch (err) {
                  if (attempt === maxAttempts) {
                    labelDiscoveryFailed = true;
                    console.log(
                      `Could not list attached labels to find repair-lock overrides after ${maxAttempts} attempts: ${err.message}`
                    );
                  } else {
                    console.log(
                      `Could not list attached labels to find repair-lock overrides (attempt ${attempt}/${maxAttempts}): ${err.message}; retrying`
                    );
                    await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
                  }
                }
              }
              for (const label of attached) {
                if (label && label.description === repairLockDescription &&
                    !reviewLabels.has(label.name)) {
                  repairLabels.add(label.name);
                }
              }
            }

            // A repair lock attached after the current head became the PR head
            // belongs to that head. Preserve it so a CI report that acquired
            // the lock before this reset ran cannot be dispatched a second
            // time. The issue timeline orders each `committed` event before
            // the labels attached to that head, so a lock event after the
            // current head's commit is current-head state; an earlier lock is
            // previous-head state and must still be reset. The timeline is the
            // durable head-specific record this reset relies on: the label
            // itself is mutable and cannot be read atomically with its
            // removal, so acquisitions inside the race window are reconciled
            // against the timeline again after the removals below.
            let preserveAllRepairLocks = false;
            const preservedRepairLocks = new Set();
            if (currentHeadSha) {
              try {
                const timeline = await github.paginate(
                  github.rest.issues.listEventsForTimeline,
                  { owner, repo, issue_number: number, per_page: 100 }
                );
                let headEventIndex = -1;
                const lastLabeledIndex = new Map();
                timeline.forEach((event, index) => {
                  if (!event) {
                    return;
                  }
                  if (event.event === 'committed' && event.sha === currentHeadSha) {
                    headEventIndex = index;
                  } else if (event.event === 'labeled' && event.label) {
                    lastLabeledIndex.set(event.label.name, index);
                  }
                });
                if (headEventIndex < 0) {
                  preserveAllRepairLocks = true;
                } else {
                  for (const name of repairLabels) {
                    const index = lastLabeledIndex.get(name);
                    if (index !== undefined && index > headEventIndex) {
                      preservedRepairLocks.add(name);
                    }
                  }
                }
              } catch (err) {
                console.log(
                  `Could not read the issue timeline to identify repair locks for head ${currentHeadSha}: ${err.message}`
                );
                preserveAllRepairLocks = true;
              }
            }

            for (const name of reviewLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }

            const removedRepairLocks = [];
            for (const name of repairLabels) {
              if (preserveAllRepairLocks || preservedRepairLocks.has(name)) {
                console.log(`Kept repair lock ${name} on #${number} for ${currentHeadSha}`);
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                removedRepairLocks.push(name);
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }

            // Removal is not atomic with the snapshot above. A CI report can
            // attach a repair lock for the current head after that read and
            // before the removal, which would let a later report dispatch a
            // second repair for the same head. The issue timeline keeps that
            // acquisition permanently and the removals just performed added
            // their own `unlabeled` events, so a second read proves whether
            // this reset removed a current-head lock. A removal is accepted
            // only when the timeline reflects it; otherwise the timeline read
            // is stale and every removed lock is restored and the job fails
            // visibly instead of risking a duplicate dispatch.
            const ensureRepairLocksAttached = async (names, reason) => {
              for (const name of names) {
                try {
                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: number,
                    labels: [name],
                  });
                  console.log(`Restored repair lock ${name} on #${number}: ${reason}`);
                } catch (err) {
                  throw new Error(
                    `Could not restore repair lock ${name} on #${number} after an unverifiable reset: ${err.message}`
                  );
                }
              }
            };
            if (removedRepairLocks.length > 0 && currentHeadSha) {
              let verification = null;
              try {
                verification = await github.paginate(
                  github.rest.issues.listEventsForTimeline,
                  { owner, repo, issue_number: number, per_page: 100 }
                );
              } catch (err) {
                console.log(
                  `Could not re-read the issue timeline after removing repair locks for head ${currentHeadSha}: ${err.message}`
                );
              }
              let verified = false;
              const restoreRepairLocks = [];
              if (verification) {
                let headEventIndex = -1;
                const labeledAfterHead = new Set();
                const removalsSeen = new Set();
                verification.forEach((event, index) => {
                  if (!event) {
                    return;
                  }
                  if (event.event === 'committed' && event.sha === currentHeadSha) {
                    headEventIndex = index;
                  }
                });
                if (headEventIndex >= 0) {
                  verification.forEach((event, index) => {
                    if (!event || index <= headEventIndex || !event.label) {
                      return;
                    }
                    const name = event.label.name;
                    if (event.event === 'labeled') {
                      labeledAfterHead.add(name);
                    } else if (event.event === 'unlabeled') {
                      removalsSeen.add(name);
                    }
                  });
                  // Every removal this job performed must appear in the
                  // timeline. A read that misses one is stale, so it cannot
                  // prove that no concurrent acquisition preceded the removal.
                  verified = removedRepairLocks.every((name) => removalsSeen.has(name));
                  if (verified) {
                    // The snapshot preserved every lock already labeled for
                    // this head, so any recovery of a removed label after the
                    // head commit was acquired while this reset was removing
                    // it. Re-attach it; the add is idempotent when the label
                    // is already back.
                    for (const name of removedRepairLocks) {
                      if (labeledAfterHead.has(name)) {
                        restoreRepairLocks.push(name);
                      }
                    }
                  }
                }
              }
              if (!verified) {
                await ensureRepairLocksAttached(
                  removedRepairLocks,
                  'the reset could not be verified against the issue timeline'
                );
                throw new Error(
                  'Could not verify the repair-lock reset against the issue timeline; removed repair locks were restored. Rerun this job after issue-timeline discovery recovers.'
                );
              }
              if (restoreRepairLocks.length > 0) {
                await ensureRepairLocksAttached(
                  restoreRepairLocks,
                  `a CI report acquired it for ${currentHeadSha} during this reset`
                );
              }
            }

            // A failed discovery can leave a dispatch-only repair label
            // attached, which would suppress repair of the new head. Known
            // labels were removed above, but fail the job so the incomplete
            // reset is visible and can be rerun once label discovery recovers.
            // When head identification failed, repair locks are deliberately
            // kept instead of risking a duplicate dispatch; the failed job is
            // still visible for a rerun.
            if (labelDiscoveryFailed) {
              throw new Error(
                'Could not list attached labels; dispatch-only CI repair locks may remain. Rerun this job after label discovery recovers.'
              );
            }
            if (preserveAllRepairLocks) {
              throw new Error(
                'Could not identify current-head repair locks; existing repair locks were kept. Rerun this job after issue-timeline discovery recovers.'
              );
            }
