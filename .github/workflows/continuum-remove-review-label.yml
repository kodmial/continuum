# Every fresh PR head invalidates CI readiness and the per-head review-request
# lock. After CI succeeds, continuum-add-review-label.yml either requests a fresh full
# CodeRabbit review or safely carries an earlier approval when continuum-auto-merge.yml
# proves that the new HEAD is only a clean controller-generated merge of main.
name: remove-review-ready-on-sync

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    # Verified child PR lifecycle runs in the public parent. Duplicate label
    # housekeeping is parent-owned work. A fork PR has no write permission for
    # the label mutation, so it is never attempted.
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # This synchronize reset can name only the repository-variable
          # repair label, not a label supplied through the repair caller's
          # optional `ci_repair_label` dispatch input. Such an override is
          # still reset because the repair engine stamps the lock description
          # below on every CI repair label it creates: the reset finds those
          # labels by their marker, so a lock taken for the previous head can
          # never suppress repair of the new one. Keep this literal identical
          # to `lock_description`/`--description` in
          # continuum-opencode-repair.yml.
          CI_REPAIR_LABEL: ${{ vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
          CI_REPAIR_LOCK_DESCRIPTION: 'One automatic OpenCode CI repair attempt per failing PR head.'
        with:
          script: |
            const { owner, repo, number } = context.issue;

            // A new head always requires fresh CI and a fresh CI-repair
            // opportunity. The review-request lock is also reset here; after
            // green CI, continuum-add-review-label.yml recreates it either by requesting
            // CodeRabbit or by proving a safe clean-main-sync carry-forward.
            const ciRepairLabel =
              String(process.env.CI_REPAIR_LABEL || 'opencode-ci-repair').trim();
            const repairLockDescription =
              String(process.env.CI_REPAIR_LOCK_DESCRIPTION || '').trim();

            // Always reset the known labels, even when the attached-label
            // read below fails. Anything the repair engine tagged with its
            // lock description is added to that set, which covers a dispatch
            // input override this event cannot name from configuration.
            const labelsToRemove = new Set([
              'review-ready',
              'coderabbit-review-requested',
              'opencode-ci-repair',
              ciRepairLabel,
            ]);
            if (repairLockDescription) {
              try {
                const attached = await github.paginate(
                  github.rest.issues.listLabelsOnIssue,
                  { owner, repo, issue_number: number, per_page: 100 }
                );
                for (const label of attached) {
                  if (label && label.description === repairLockDescription) {
                    labelsToRemove.add(label.name);
                  }
                }
              } catch (err) {
                console.log(
                  `Could not list attached labels to find repair-lock overrides: ${err.message}`
                );
              }
            }

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }
