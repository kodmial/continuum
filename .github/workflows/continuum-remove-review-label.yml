# Every fresh PR head invalidates CI readiness and the per-head review-request
# lock. After CI succeeds, continuum-add-review-label.yml either requests a fresh full
# CodeRabbit review or safely carries an earlier approval when continuum-auto-merge.yml
# proves that the new HEAD is only a clean controller-generated merge of main.
#
# kodmial/continuum#446: this reset is review/CodeRabbit-readiness housekeeping
# only. CI-repair admission is a durable exact-HEAD receipt owned by the
# serialized opencode-repair controller. This workflow never reads, removes,
# restores, or infers CI-repair labels or attempt state.
name: remove-review-ready-on-sync

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    # Verified child PR lifecycle runs in the public parent. Duplicate label
    # housekeeping is parent-owned work. A fork PR has no write permission for
    # the label mutation, so it is never attempted.
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo, number } = context.issue;

            // Review readiness belongs to the previous HEAD. A new HEAD must
            // request a fresh CodeRabbit review or prove a safe clean-main-sync
            // carry-forward; neither decision uses a mutable CI-repair label.
            const reviewLabels = [
              'review-ready',
              'coderabbit-review-requested',
            ];

            for (const name of reviewLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }
