# Every fresh PR head invalidates CI readiness and the per-head review-request
# lock. After CI succeeds, continuum-add-review-label.yml either requests a fresh full
# CodeRabbit review or safely carries an earlier approval when continuum-auto-merge.yml
# proves that the new HEAD is only a clean controller-generated merge of main.
name: remove-review-ready-on-sync

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-label:
    # Verified child PR lifecycle runs in the public parent. Duplicate label
    # housekeeping is parent-owned work. A fork PR has no write permission for
    # the label mutation, so it is never attempted.
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # This synchronize reset can read only the repository variable, not
          # the repair caller's optional `ci_repair_label` dispatch input. A
          # label supplied only through that input is therefore not reset on a
          # new head; keep such an override unique per head or expect a stale
          # lock. When the engine falls back to the variable, that configured
          # label must be reset here too, otherwise a stale lock from the
          # previous head suppresses the next repair attempt.
          CI_REPAIR_LABEL: ${{ vars.CONTINUUM_CI_REPAIR_LABEL || 'opencode-ci-repair' }}
        with:
          script: |
            const { owner, repo, number } = context.issue;

            // A new head always requires fresh CI and a fresh CI-repair
            // opportunity. The review-request lock is also reset here; after
            // green CI, continuum-add-review-label.yml recreates it either by requesting
            // CodeRabbit or by proving a safe clean-main-sync carry-forward.
            const ciRepairLabel =
              String(process.env.CI_REPAIR_LABEL || 'opencode-ci-repair').trim();
            for (const name of new Set([
              'review-ready',
              'coderabbit-review-requested',
              'opencode-ci-repair',
              ciRepairLabel,
            ])) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name,
                });
                console.log(`Removed ${name} from #${number}`);
              } catch (err) {
                if (err.status === 404) {
                  console.log(`No ${name} label on #${number} (nothing to remove)`);
                } else {
                  throw err;
                }
              }
            }
