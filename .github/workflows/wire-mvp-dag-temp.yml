name: Wire Continuum MVP DAG

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  wire:
    if: github.event.head_commit.message == 'wire-continuum-mvp-dag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add native MVP dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10")
          add_dep() {
            gh api --method POST "${H[@]}"               "repos/$GITHUB_REPOSITORY/issues/$1/dependencies/blocked_by"               -F "issue_id=$2" >/dev/null
          }

          # PR-Agent is the first MVP review implementation.
          add_dep 18 5615046811 || true

          # Minimal reusable consumer surface.
          add_dep 27 5614457679 || true  # config
          add_dep 27 5614458030 || true  # public security
          add_dep 27 5615046811 || true  # PR-Agent gate

          # NanoDictate release-enabled consumer.
          add_dep 28 5615658995 || true  # reusable MVP
          add_dep 28 5614461245 || true  # release core
          add_dep 28 5614936406 || true  # Apple self-signed adapter
          add_dep 28 5614937533 || true  # release orchestrator
          add_dep 28 5614989614 || true  # Homebrew/MacPorts

          # kodmai release-disabled consumer.
          add_dep 29 5615658995 || true

          # Definition of MVP done.
          add_dep 30 5615660461 || true
          add_dep 30 5615662034 || true

          echo "Continuum MVP dependency DAG wired."
