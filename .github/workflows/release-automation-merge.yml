name: Merge trusted release automation PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

# This workflow is deliberately privileged but never checks out or executes PR
# code. It only reads PR metadata/file contents through the GitHub API, validates
# the generator-owned allow-list, then merges with the repo PAT so downstream
# push workflows (notably release.yml) fire normally.
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: nanodictate-release-automation-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and merge trusted generated PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # A PAT-authored merge is intentional: GITHUB_TOKEN merges suppress
          # parts of the downstream event fan-out. release.yml must see the main
          # push created by the Release PR merge.
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const run = context.payload.workflow_run || null;
            const BLOCK_LABEL = 'no-auto-merge';
            const AUTOMATION_LABEL = 'release-automation';

            const RELEASE_FILES = new Set([
              '.release-please-manifest.json',
              'CHANGELOG.md',
              'Sources/NanoDictateCore/Version.swift',
            ]);
            const MANIFEST_FILES = new Set([
              'nanodictate.rb',
              'packaging/homebrew/nanodictate.rb',
              'packaging/homebrew/Casks/nanodictate.rb',
              'packaging/macports/Portfile',
              'scripts/install-macports.sh',
            ]);

            const hasLabel = (pr, name) =>
              (pr.labels || []).some(label => label.name === name);

            async function getPull(number) {
              const { data } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              return data;
            }

            async function listFiles(pr) {
              return github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
            }

            async function readText(path, ref) {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path, ref,
              });
              if (Array.isArray(data) || !data.content) {
                throw new Error(`Expected file ${path} at ${ref}`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8');
            }

            function parseVersion(source, label) {
              const match = source.match(/\b(\d+)\.(\d+)\.(\d+)\b/);
              if (!match) throw new Error(`Could not parse semver from ${label}`);
              return {
                text: match[0],
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3]),
              };
            }

            function exactlyFiles(files, allowed) {
              const names = files.map(file => file.filename);
              return (
                names.length === allowed.size &&
                names.every(name => allowed.has(name)) &&
                [...allowed].every(name => names.includes(name))
              );
            }

            function isAutomationBranch(pr) {
              return (
                pr.base.ref === 'main' &&
                pr.head.repo?.full_name === repoFullName &&
                (
                  pr.head.ref === 'release-please--branches--main' ||
                  /^chore\/release-manifests-v\d+\.\d+\.\d+$/.test(pr.head.ref)
                )
              );
            }

            async function latestSuccessfulCi(pr) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  branch: pr.head.ref,
                  event: 'pull_request',
                  per_page: 100,
                }
              );
              const latest = runs
                .filter(item => item.name === 'CI' && item.head_sha === pr.head.sha)
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() -
                    new Date(a.created_at).getTime()
                )[0];
              return Boolean(
                latest &&
                latest.status === 'completed' &&
                latest.conclusion === 'success'
              );
            }

            async function compareWithMain(headSha) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                { owner, repo, basehead: `main...${headSha}` }
              );
              return data;
            }

            async function validateReleasePr(pr, files) {
              if (!hasLabel(pr, 'autorelease: pending')) {
                throw new Error(
                  `PR #${pr.number}: release-please lifecycle label 'autorelease: pending' is missing.`
                );
              }
              if (!exactlyFiles(files, RELEASE_FILES)) {
                throw new Error(
                  `PR #${pr.number}: Release PR must change exactly: ${[...RELEASE_FILES].join(', ')}; got: ${files.map(f => f.filename).join(', ')}`
                );
              }

              const [baseVersionSource, headVersionSource, manifestSource, changelog] =
                await Promise.all([
                  readText('Sources/NanoDictateCore/Version.swift', pr.base.sha),
                  readText('Sources/NanoDictateCore/Version.swift', pr.head.sha),
                  readText('.release-please-manifest.json', pr.head.sha),
                  readText('CHANGELOG.md', pr.head.sha),
                ]);

              const base = parseVersion(baseVersionSource, 'base Version.swift');
              const head = parseVersion(headVersionSource, 'head Version.swift');
              const manifest = JSON.parse(manifestSource)['.'];

              if (head.major !== base.major || head.minor !== base.minor || head.patch !== base.patch + 1) {
                throw new Error(
                  `PR #${pr.number}: expected next patch after ${base.text}, got ${head.text}.`
                );
              }
              if (manifest !== head.text) {
                throw new Error(
                  `PR #${pr.number}: manifest version ${manifest} != Version.swift ${head.text}.`
                );
              }
              const escaped = head.text.replace(/\./g, '\\.');
              if (!new RegExp(`^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`, 'm').test(changelog)) {
                throw new Error(
                  `PR #${pr.number}: CHANGELOG has no release section for ${head.text}.`
                );
              }
              core.notice(`PR #${pr.number}: validated Release PR ${base.text} -> ${head.text}.`);
              return head.text;
            }

            async function validateManifestPr(pr, files) {
              if (!exactlyFiles(files, MANIFEST_FILES)) {
                throw new Error(
                  `PR #${pr.number}: manifest PR must change exactly: ${[...MANIFEST_FILES].join(', ')}; got: ${files.map(f => f.filename).join(', ')}`
                );
              }

              const branchMatch = pr.head.ref.match(
                /^chore\/release-manifests-v(\d+\.\d+\.\d+)$/
              );
              if (!branchMatch) throw new Error(`Unexpected manifest branch ${pr.head.ref}`);
              const version = branchMatch[1];

              const [rootFormula, formula, cask, portfile, installer] =
                await Promise.all([
                  readText('nanodictate.rb', pr.head.sha),
                  readText('packaging/homebrew/nanodictate.rb', pr.head.sha),
                  readText('packaging/homebrew/Casks/nanodictate.rb', pr.head.sha),
                  readText('packaging/macports/Portfile', pr.head.sha),
                  readText('scripts/install-macports.sh', pr.head.sha),
                ]);

              const expectedFormulaVersion = `version "${version}"`;
              for (const [name, source] of [
                ['nanodictate.rb', rootFormula],
                ['packaging/homebrew/nanodictate.rb', formula],
                ['packaging/homebrew/Casks/nanodictate.rb', cask],
              ]) {
                if (!source.includes(expectedFormulaVersion)) {
                  throw new Error(`PR #${pr.number}: ${name} does not pin version ${version}.`);
                }
              }
              const escapedVersion = version.replace(/\./g, '\\.');
              const portVersionLine = new RegExp(
                `^\\s*github\\.setup\\s+kodmial\\s+nanodictate\\s+${escapedVersion}\\s+v\\s*$`,
                'm'
              );
              if (!portVersionLine.test(portfile)) {
                throw new Error(`PR #${pr.number}: Portfile does not pin version ${version}.`);
              }
              if (!/^PIN_REV="[0-9a-f]{40}"$/m.test(installer)) {
                throw new Error(`PR #${pr.number}: installer PIN_REV is missing or malformed.`);
              }

              for (const [name, source] of [
                ['nanodictate.rb', rootFormula],
                ['packaging/homebrew/nanodictate.rb', formula],
                ['packaging/homebrew/Casks/nanodictate.rb', cask],
                ['packaging/macports/Portfile', portfile],
              ]) {
                // Generated files intentionally keep explanatory comments that
                // mention placeholder names. Only executable/configuration
                // lines can represent an actually unfilled template token.
                const activeSource = source
                  .split('\n')
                  .filter(line => !line.trimStart().startsWith('#'))
                  .join('\n');
                if (/__VERSION__|__SHA256_|__ZIP_SHA256_|__MAINTAINERS__|__REVISION__/.test(activeSource)) {
                  throw new Error(`PR #${pr.number}: unfilled template placeholder remains in ${name}.`);
                }
              }

              core.notice(`PR #${pr.number}: validated generated manifests for v${version}.`);
              return version;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: AUTOMATION_LABEL,
                color: '5319E7',
                description: 'Trusted generated release automation; lightweight validation only.',
              });
            } catch (err) {
              if (err.status !== 422) throw err;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const candidates = pulls.filter(pr =>
              !pr.draft &&
              isAutomationBranch(pr) &&
              (!run || pr.head.sha === run.head_sha)
            );

            if (run && run.conclusion !== 'success') {
              core.info(`CI run ${run.id} concluded ${run.conclusion}; no automation PR can merge.`);
              return;
            }

            for (const listed of candidates) {
              let pr = await getPull(listed.number);
              if (!isAutomationBranch(pr) || pr.draft || hasLabel(pr, BLOCK_LABEL)) {
                continue;
              }

              const ciOk = run
                ? pr.head.sha === run.head_sha
                : await latestSuccessfulCi(pr);
              if (!ciOk) {
                core.info(`PR #${pr.number}: waiting for successful CI on current head ${pr.head.sha}.`);
                continue;
              }

              const comparison = await compareWithMain(pr.head.sha);
              if (comparison.behind_by > 0) {
                await github.request(
                  'PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                  {
                    owner,
                    repo,
                    pull_number: pr.number,
                    expected_head_sha: pr.head.sha,
                  }
                );
                core.notice(`PR #${pr.number}: updated from main; fresh lightweight CI will revalidate it.`);
                continue;
              }

              const files = await listFiles(pr);
              const version = pr.head.ref === 'release-please--branches--main'
                ? await validateReleasePr(pr, files)
                : await validateManifestPr(pr, files);

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [AUTOMATION_LABEL],
              });

              // Re-read merge-critical state after validation to close the
              // validation/write race. A changed head must get a fresh CI run.
              pr = await getPull(pr.number);
              if (
                !isAutomationBranch(pr) ||
                pr.draft ||
                hasLabel(pr, BLOCK_LABEL) ||
                (run && pr.head.sha !== run.head_sha)
              ) {
                core.info(`PR #${pr.number}: state/head changed during validation; merge cancelled.`);
                continue;
              }
              if (!run && !(await latestSuccessfulCi(pr))) {
                core.info(`PR #${pr.number}: CI state changed during validation; merge cancelled.`);
                continue;
              }
              const finalComparison = await compareWithMain(pr.head.sha);
              if (finalComparison.behind_by > 0) {
                core.info(`PR #${pr.number}: main advanced during validation; merge cancelled.`);
                continue;
              }

              const conventionalTitle = /^[a-z]+(?:\([^)]*\))?!?:\s/i.test(pr.title)
                ? pr.title
                : `chore(release): ${pr.title}`;
              const { data: result } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: conventionalTitle,
                sha: pr.head.sha,
              });

              if (!result.merged) {
                throw new Error(
                  `PR #${pr.number}: GitHub refused merge: ${result.message || 'unknown reason'}`
                );
              }
              core.notice(
                `PR #${pr.number}: merged trusted release automation for v${version}; commit ${result.sha}.`
              );

              // One merge changes main. Let its push/CI events reconcile any
              // remaining automation PR against the new base.
              break;
            }
