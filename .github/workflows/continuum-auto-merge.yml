name: Auto-merge reviewed pull requests

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      require_coderabbit:
        description: >-
          Require a CodeRabbit approval before merging and delegate rate-limited
          reviews to the CodeRabbit retry controller. Empty falls back to
          vars.CONTINUUM_REQUIRE_CODERABBIT. CodeRabbit is an optional
          integration, so the default is OFF: a project that did not ask for
          CodeRabbit must not be made to wait for an approval nobody will ever
          give, and must not have a workflow dispatched it does not own.
        type: string
        default: ''
        required: false
      post_merge_wakeups:
        description: >-
          Workflows to wake after a successful merge, comma-separated. The fork
          auto-merger woke a knowledge-sync workflow and re-woke the issue
          scheduler; neither is a core workflow (`knowledge-sync.yml` does not
          exist in Continuum at all), so the list must come from the consumer.
          Empty — the default — wakes nothing after a merge. Empty falls back to
          vars.CONTINUUM_POST_MERGE_WAKEUPS.
        type: string
        default: ''
        required: false
      post_merge_wakeup_ref:
        description: >-
          Git ref the post-merge wake-ups are dispatched at. Empty falls back to
          vars.CONTINUUM_POST_MERGE_WAKEUP_REF, then to the main branch.
        type: string
        default: ''
        required: false
      required_workflow_gate_label:
        description: >-
          Optional PR label that activates an additional current-head workflow
          gate before auto-merge. Empty disables the extra gate.
        type: string
        default: ''
        required: false
      required_workflow_gate_name:
        description: >-
          Exact GitHub Actions workflow name required to complete successfully
          when required_workflow_gate_label is present on a PR.
        type: string
        default: ''
        required: false
  # Successful PR CI explicitly dispatches this reconciler from
  # mark-ready-for-coderabbit. CodeRabbit status/review and main pushes are
  # additional event-driven wake-ups; no critical transition depends on cron.

permissions: {}

concurrency:
  # Every trigger (CI dispatch, CodeRabbit, push, manual, or cron) enters the
  # same pure latest-state reconciler. It revalidates every gate immediately
  # before each write. A newer wake-up makes an older queued/in-flight run
  # obsolete, so at most one reconciliation owns side effects at a time.
  group: ${{ github.workflow }}-auto-merge
  cancel-in-progress: true

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_AUTOMERGE_TIMEOUT_MINUTES || '10') }}

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: read

    steps:
      - name: Merge only fully reviewed current heads
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        # Use the repository PAT intentionally. A merge performed with the
        # ephemeral GITHUB_TOKEN does not reliably fan out into the downstream
        # push/merge workflows (version bump, release, PR reconciliation).
        env:
          CONTINUUM_VERSION_FILE: ${{ vars.CONTINUUM_VERSION_FILE || '' }}
          REQUIRE_CODERABBIT: ${{ inputs.require_coderabbit || vars.CONTINUUM_REQUIRE_CODERABBIT || 'false' }}
          POST_MERGE_WAKEUPS: ${{ inputs.post_merge_wakeups || vars.CONTINUUM_POST_MERGE_WAKEUPS }}
          POST_MERGE_WAKEUP_REF: ${{ inputs.post_merge_wakeup_ref || vars.CONTINUUM_POST_MERGE_WAKEUP_REF || github.event.repository.default_branch || 'main' }}
          REQUIRED_WORKFLOW_GATE_LABEL: ${{ inputs.required_workflow_gate_label || vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_LABEL || '' }}
          REQUIRED_WORKFLOW_GATE_NAME: ${{ inputs.required_workflow_gate_name || vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_NAME || '' }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const AUTO_MERGE_BLOCK_LABEL = 'no-auto-merge';
            const CONFLICT_LOCK_LABEL = 'opencode-conflict-repair';
            // CodeRabbit is an optional integration. When this project did not
            // ask for it, every CodeRabbit gate below is skipped and no
            // CodeRabbit workflow is ever dispatched: requiring an approval
            // nobody will give would hang the PR forever, and dispatching a
            // workflow the repository does not have is a 404.
            const REQUIRE_CODERABBIT =
              String(process.env.REQUIRE_CODERABBIT || '').trim().toLowerCase();
            const requireCodeRabbit =
              REQUIRE_CODERABBIT === 'true' || REQUIRE_CODERABBIT === '1';
            const requiredWorkflowGateLabel =
              String(process.env.REQUIRED_WORKFLOW_GATE_LABEL || '').trim();
            const requiredWorkflowGateName =
              String(process.env.REQUIRED_WORKFLOW_GATE_NAME || '').trim();

            // Downstream wake-ups after a merge are consumer-owned. The fork
            // auto-merger woke `knowledge-sync.yml` (which has no core
            // equivalent at all) and re-woke the issue scheduler, so the list
            // is configuration and is empty unless the consumer sets it:
            // dispatching a workflow the repository does not own is a 404 and
            // would fail a run that did nothing wrong.
            const postMergeWakeups = String(process.env.POST_MERGE_WAKEUPS || '')
              .split(',')
              .map(name => name.trim())
              .filter(name => name.length > 0);
            const postMergeWakeupRef = String(
              process.env.POST_MERGE_WAKEUP_REF || ''
            ).trim();

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name, color, description,
                });
              } catch (err) {
                if (err.status !== 422) throw err; // label already exists
              }
            }

            await ensureLabel(
              AUTO_MERGE_BLOCK_LABEL,
              'B60205',
              'Do not automatically merge this pull request.'
            );
            await ensureLabel(
              CONFLICT_LOCK_LABEL,
              'B60205',
              'One automatic OpenCode conflict-repair attempt per conflict episode.'
            );

            if (requiredWorkflowGateLabel) {
              await ensureLabel(
                requiredWorkflowGateLabel,
                '0E8A16',
                'Required additional workflow gate.'
              );
            }

            function hasLabel(pr, name) {
              return (pr.labels || []).some(label => label.name === name);
            }

            async function getPull(pullNumber) {
              const { data } = await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber,
              });
              return data;
            }

            async function compareWithMain(headSha) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {
                  owner,
                  repo,
                  basehead: `main...${headSha}`,
                }
              );
              return data;
            }

            function isNonMergeCriticalMainPath(path) {
              // Continuum caller pins are executable control-plane code. A
              // consumer that advances its pinned Continuum revision must
              // synchronize open PRs so their CI/review/repair semantics are
              // evaluated against that exact revision as well.
              if (path.startsWith('.github/workflows/continuum-')) {
                return false;
              }
              return (
                path === 'LICENSE' ||
                path === '.gitignore' ||
                path === '.release-please-manifest.json' ||
                path === 'CHANGELOG.md' ||
                path.endsWith('.md') ||
                path.startsWith('docs/') ||
                path.startsWith('.github/')
              );
            }

            async function mainDeltaSincePrHead(headSha) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {
                  owner,
                  repo,
                  // Reverse the normal PR comparison on purpose. GitHub uses
                  // the merge base, so this side contains only commits/files
                  // that advanced main since the PR diverged.
                  basehead: `${headSha}...main`,
                }
              );

              const files = (data.files || []).map(file => file.filename);
              const criticalFiles = files.filter(
                path => !isNonMergeCriticalMainPath(path)
              );

              return {
                files,
                criticalFiles,
                onlyNonCritical:
                  files.length > 0 && criticalFiles.length === 0,
              };
            }

            async function shouldSyncFromMain(pr, comparison) {
              if (comparison.behind_by <= 0) {
                return {
                  required: false,
                  reason: 'up-to-date',
                  files: [],
                  criticalFiles: [],
                };
              }

              const delta = await mainDeltaSincePrHead(pr.head.sha);
              if (delta.onlyNonCritical) {
                return {
                  required: false,
                  reason: 'non-merge-critical-main-delta',
                  ...delta,
                };
              }

              // Be conservative if GitHub cannot provide a useful file list:
              // an unknown main delta must never silently bypass integration
              // validation.
              return {
                required: true,
                reason:
                  delta.files.length === 0
                    ? 'unknown-main-delta'
                    : 'merge-critical-main-delta',
                ...delta,
              };
            }

            async function latestWorkflowForHead(pr, headSha, workflowName) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  branch: pr.head.ref,
                  event: 'pull_request',
                  per_page: 100,
                }
              );

              return runs
                .filter(run =>
                  run.name === workflowName &&
                  run.head_sha === headSha
                )
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() -
                    new Date(a.created_at).getTime()
                )[0] || null;
            }

            async function latestCiForHead(pr, headSha) {
              return latestWorkflowForHead(pr, headSha, 'CI');
            }

            async function latestCurrentHeadCi(pr) {
              return latestCiForHead(pr, pr.head.sha);
            }

            async function latestCurrentHeadPackagingSmoke(pr) {
              return latestWorkflowForHead(pr, pr.head.sha, 'Packaging smoke');
            }

            async function requiredWorkflowGate(pr, headSha = pr.head.sha) {
              if (
                !requiredWorkflowGateLabel ||
                !requiredWorkflowGateName ||
                !hasLabel(pr, requiredWorkflowGateLabel)
              ) {
                return null;
              }
              return latestWorkflowForHead(
                pr,
                headSha,
                requiredWorkflowGateName
              );
            }

            async function latestCodeRabbitStatus(headSha) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: headSha,
              });

              return (data.statuses || [])
                .filter(status => status.context === 'CodeRabbit')
                .sort(
                  (a, b) =>
                    new Date(b.updated_at || b.created_at).getTime() -
                    new Date(a.updated_at || a.created_at).getTime()
                )[0] || null;
            }

            async function latestReviewConvergenceStatus(headSha) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: headSha,
              });

              return (data.statuses || [])
                .filter(
                  status => status.context === 'continuum/review-convergence'
                )
                .sort(
                  (a, b) =>
                    new Date(b.updated_at || b.created_at).getTime() -
                    new Date(a.updated_at || a.created_at).getTime()
                )[0] || null;
            }

            function retryWindowText(body = '') {
              const patterns = [
                /next\s+(?:included\s+)?review\b[^\n<.]{0,120}?\bavailable\b[^\n<.]{0,40}?\b(?:in|after)\s+([^\n<.]+)/i,
                /(?:try|retry)\s+again\b[^\n<.]{0,40}?\b(?:in|after)\s+([^\n<.]+)/i,
              ];
              for (const pattern of patterns) {
                const match = body.match(pattern);
                if (match) return match[1];
              }
              return null;
            }

            function parseDurationMs(text = '') {
              if (/less than\s+(?:a|one)\s+minute/i.test(text)) {
                return 60_000;
              }

              let totalMs = 0;
              let found = false;
              for (const part of text.matchAll(
                /(\d+)\s*(hours?|hrs?|minutes?|mins?|seconds?|secs?)/gi
              )) {
                found = true;
                const value = Number(part[1]);
                const unit = part[2].toLowerCase();
                if (unit.startsWith('hour') || unit.startsWith('hr')) {
                  totalMs += value * 60 * 60_000;
                } else if (unit.startsWith('minute') || unit.startsWith('min')) {
                  totalMs += value * 60_000;
                } else {
                  totalMs += value * 1_000;
                }
              }
              return found ? totalMs : null;
            }

            function parseCodeRabbitRetryDelayMs(body = '') {
              const windowText = retryWindowText(body);
              const parsed = windowText === null
                ? null
                : parseDurationMs(windowText);
              if (parsed !== null) return parsed;

              if (/Review rate limited|Review limit reached/i.test(body)) {
                core.warning(
                  'Could not parse CodeRabbit quota countdown; using 65-minute fallback.'
                );
                return 65 * 60_000;
              }
              return null;
            }

            const retryParserCases = [
              [
                'Review rate limited. Next included review available in 13 minutes.',
                13 * 60_000,
              ],
              [
                'Review rate limited. Your next included review will be available in 13 minutes.',
                13 * 60_000,
              ],
              [
                'Review limit reached. Your next review is available after 1 hour 5 minutes.',
                65 * 60_000,
              ],
              [
                'Review rate limited. Try again in less than a minute.',
                60_000,
              ],
            ];
            for (const [sample, expected] of retryParserCases) {
              const actual = parseCodeRabbitRetryDelayMs(sample);
              if (actual !== expected) {
                throw new Error(
                  `CodeRabbit retry parser regression: expected ${expected}, got ${actual} for "${sample}"`
                );
              }
            }

            function latestCodeRabbitRateLimit(comments) {
              return comments
                .filter(comment => comment.user?.login === 'coderabbitai[bot]')
                .map(comment => {
                  const delayMs = parseCodeRabbitRetryDelayMs(comment.body || '');
                  return delayMs === null ? null : { comment, delayMs };
                })
                .filter(Boolean)
                .sort(
                  (a, b) =>
                    new Date(b.comment.updated_at).getTime() -
                    new Date(a.comment.updated_at).getTime()
                )[0] || null;
            }

            function reviewCommandPostedAfter(comments, timestamp) {
              return comments.some(comment =>
                comment.user?.login !== 'coderabbitai[bot]' &&
                /^@coderabbitai\s+(?:full\s+)?review\s*$/i.test(
                  comment.body?.trim() || ''
                ) &&
                new Date(comment.created_at).getTime() > timestamp
              );
            }

            async function retryRateLimitedCodeRabbit(pr, ci, rabbitStatus) {
              if (!/Review rate limited|Review limit reached/i.test(
                rabbitStatus?.description || ''
              )) {
                return false;
              }

              let comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                }
              );

              const limited = latestCodeRabbitRateLimit(comments);
              if (!limited) {
                core.info(
                  `PR #${pr.number}: CodeRabbit status is rate-limited but no rate-limit comment with retry timing was found.`
                );
                return false;
              }

              const limitedAt =
                new Date(limited.comment.updated_at).getTime();
              const dueAt = limitedAt + limited.delayMs + 30_000;
              if (Date.now() < dueAt) {
                core.info(
                  `PR #${pr.number}: CodeRabbit retry is not due yet; waiting until ${new Date(dueAt).toISOString()}.`
                );
                return false;
              }

              if (reviewCommandPostedAfter(comments, limitedAt)) {
                core.info(
                  `PR #${pr.number}: a CodeRabbit review command was already posted after the latest rate-limit response.`
                );
                return false;
              }

              const fresh = await getPull(pr.number);
              if (
                fresh.state !== 'open' ||
                fresh.draft ||
                fresh.head.sha !== pr.head.sha ||
                fresh.head.repo?.full_name !== repoFullName
              ) {
                core.info(
                  `PR #${pr.number}: PR/head changed before CodeRabbit retry; cancelling retry.`
                );
                return false;
              }

              const freshCi = await latestCurrentHeadCi(fresh);
              if (
                !freshCi ||
                freshCi.status !== 'completed' ||
                freshCi.conclusion !== 'success' ||
                freshCi.id !== ci.id
              ) {
                core.info(
                  `PR #${pr.number}: current-head CI changed before CodeRabbit retry; cancelling retry.`
                );
                return false;
              }

              const freshStatus = await latestCodeRabbitStatus(fresh.head.sha);
              if (
                !freshStatus ||
                !/Review rate limited|Review limit reached/i.test(
                  freshStatus.description || ''
                )
              ) {
                core.info(
                  `PR #${pr.number}: CodeRabbit status changed before retry; cancelling retry.`
                );
                return false;
              }

              comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: fresh.number,
                  per_page: 100,
                }
              );

              const freshLimited = latestCodeRabbitRateLimit(comments);
              if (
                !freshLimited ||
                freshLimited.comment.id !== limited.comment.id ||
                freshLimited.comment.updated_at !== limited.comment.updated_at ||
                reviewCommandPostedAfter(comments, limitedAt)
              ) {
                core.info(
                  `PR #${pr.number}: CodeRabbit rate-limit state changed during retry evaluation.`
                );
                return false;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: fresh.number,
                body: '@coderabbitai full review',
              });
              core.notice(
                `PR #${pr.number}: retried full CodeRabbit review after the rate-limit window expired.`
              );
              return true;
            }

            async function latestCodeRabbitDecision(pr, headSha = pr.head.sha) {
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }
              );

              return reviews
                .filter(review =>
                  review.user?.login?.startsWith('coderabbitai') &&
                  review.commit_id === headSha &&
                  (review.state === 'APPROVED' ||
                   review.state === 'CHANGES_REQUESTED')
                )
                .sort((a, b) => {
                  const time =
                    new Date(a.submitted_at || 0).getTime() -
                    new Date(b.submitted_at || 0).getTime();
                  return time || Number(a.id) - Number(b.id);
                })
                .at(-1) || null;
            }

            async function codeRabbitNitpickReviews(pr, headSha = pr.head.sha) {
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }
              );

              const headReviews = reviews.filter(review =>
                review.user?.login?.startsWith('coderabbitai') &&
                review.commit_id === headSha
              );

              // A later decisive CodeRabbit review supersedes earlier advisory
              // nitpick-only COMMENTED reviews on the exact same head. Without
              // this, an APPROVED review can never clear an older nitpick review
              // because GitHub keeps both review records forever.
              const latestDecision = headReviews
                .filter(review =>
                  review.state === 'APPROVED' ||
                  review.state === 'CHANGES_REQUESTED'
                )
                .sort((a, b) => {
                  const time =
                    new Date(a.submitted_at || 0).getTime() -
                    new Date(b.submitted_at || 0).getTime();
                  return time || Number(a.id) - Number(b.id);
                })
                .at(-1) || null;
              const decisionAt = latestDecision
                ? new Date(latestDecision.submitted_at || 0).getTime()
                : 0;

              return headReviews.filter(review =>
                review.state === 'COMMENTED' &&
                /comments?\s*\(\s*[1-9]\d*\s*\)/i.test(review.body || '') &&
                (
                  !latestDecision ||
                  new Date(review.submitted_at || 0).getTime() > decisionAt
                )
              );
            }

            async function directCodeRabbitReviewBasis(pr, headSha) {
              const [ci, decision] = await Promise.all([
                latestCiForHead(pr, headSha),
                latestCodeRabbitDecision(pr, headSha),
              ]);

              if (
                !ci ||
                ci.status !== 'completed' ||
                ci.conclusion !== 'success' ||
                !decision ||
                decision.state !== 'APPROVED'
              ) {
                return null;
              }

              const nitpicks = await codeRabbitNitpickReviews(pr, headSha);
              if (nitpicks.length !== 0) {
                return null;
              }

              // Bind both gates to the exact same immutable head SHA. Their
              // relative timestamps do not add safety: a later CI rerun does not
              // change the reviewed code. CodeRabbit's commit status is kept for
              // operational state/rate-limit recovery, but it is not merge
              // evidence because auto-review-disabled events can overwrite a
              // prior "Review completed" status with "Review skipped".
              return {
                sourceSha: headSha,
                carried: false,
                decision,
              };
            }

            async function carriedCodeRabbitReviewBasis(pr, headSha) {
              const { data: commit } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: headSha,
              });
              const parents = (commit.parents || []).map(parent =>
                parent.sha.toLowerCase()
              );
              if (parents.length !== 2) return null;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                }
              );

              const markerPattern =
                /<!-- auto-main-sync head=([0-9a-f]{40}) from=([0-9a-f]{40}) main=([0-9a-f]{40}) carry=([0-9a-f]{40}) -->/i;

              const marker = comments
                .filter(comment => comment.user?.login === owner)
                .map(comment => {
                  const match = (comment.body || '').match(markerPattern);
                  if (!match) return null;
                  return {
                    head: match[1].toLowerCase(),
                    from: match[2].toLowerCase(),
                    main: match[3].toLowerCase(),
                    carry: match[4].toLowerCase(),
                    createdAt: new Date(comment.created_at || 0).getTime(),
                  };
                })
                .filter(Boolean)
                .filter(item => item.head === headSha.toLowerCase())
                .sort((a, b) => b.createdAt - a.createdAt)[0];

              if (!marker) return null;

              const parentSet = new Set(parents);
              if (
                !parentSet.has(marker.from) ||
                !parentSet.has(marker.main)
              ) {
                return null;
              }

              const source = await directCodeRabbitReviewBasis(
                pr,
                marker.carry
              );
              if (!source) return null;

              return {
                ...source,
                carried: true,
                syncedHead: headSha,
                fromHead: marker.from,
                mainHead: marker.main,
              };
            }

            async function codeRabbitReviewBasis(pr, headSha = pr.head.sha) {
              const direct = await directCodeRabbitReviewBasis(pr, headSha);
              if (direct) return direct;
              return carriedCodeRabbitReviewBasis(pr, headSha);
            }

            function codeRabbitExplicitlyResolved(body = '') {
              if (/\bUNRESOLVED\b/i.test(body)) return false;
              return (
                /\*\*RESOLVED(?:\.|\*\*)/i.test(body) ||
                /✅\s*Review thread resolved\.?/i.test(body)
              );
            }

            async function unresolvedCodeRabbitThreads(pr) {
              const unresolved = [];
              let cursor = null;

              do {
                const data = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          nodes {
                            id
                            isResolved
                            isOutdated
                            path
                            comments(first: 100) {
                              nodes {
                                databaseId
                                body
                                author { login }
                              }
                            }
                          }
                          pageInfo {
                            hasNextPage
                            endCursor
                          }
                        }
                      }
                    }
                  }`,
                  {
                    owner,
                    repo,
                    number: pr.number,
                    cursor,
                  }
                );

                const connection =
                  data.repository.pullRequest.reviewThreads;
                for (const thread of connection.nodes || []) {
                  const comments = thread.comments?.nodes || [];
                  const root = comments[0];
                  if (!root?.author?.login?.startsWith('coderabbitai')) {
                    continue;
                  }

                  if (thread.isResolved) {
                    continue;
                  }

                  // CodeRabbit can explicitly answer RESOLVED without flipping
                  // GitHub's review-thread isResolved bit. Treat the bot's latest
                  // reply as the semantic verdict and normalize GitHub state with
                  // our own write-capable token. UNRESOLVED always wins.
                  const latestRabbitReply = comments
                    .slice(1)
                    .filter(comment =>
                      comment.author?.login?.startsWith('coderabbitai')
                    )
                    .at(-1);
                  if (
                    latestRabbitReply &&
                    codeRabbitExplicitlyResolved(latestRabbitReply.body || '')
                  ) {
                    try {
                      await github.graphql(
                        `mutation($threadId: ID!) {
                          resolveReviewThread(input: {threadId: $threadId}) {
                            thread { id isResolved }
                          }
                        }`,
                        { threadId: thread.id }
                      );
                      core.notice(
                        `PR #${pr.number}: normalized CodeRabbit RESOLVED reply into GitHub thread resolution for ${thread.id} (${thread.path}).`
                      );
                      continue;
                    } catch (err) {
                      core.warning(
                        `PR #${pr.number}: CodeRabbit marked ${thread.id} resolved, but GitHub thread resolution failed: ${err.message}`
                      );
                    }
                  }

                  unresolved.push({
                    id: thread.id,
                    commentId: root.databaseId,
                    path: thread.path,
                    outdated: thread.isOutdated,
                  });
                }

                cursor = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (cursor);

              return unresolved;
            }

            async function requestCodeRabbitThreadVerification(pr, threads) {
              if (!threads.length) return 0;

              const comments = await github.paginate(
                github.rest.pulls.listReviewComments,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                }
              );

              let requested = 0;
              for (const thread of threads) {
                if (!thread.commentId) continue;

                const marker =
                  `<!-- auto-merge-coderabbit-verification finding=${thread.commentId} head=${pr.head.sha} -->`;

                const duplicate = comments.some(comment =>
                  comment.in_reply_to_id === thread.commentId &&
                  comment.body?.includes(marker)
                );
                if (duplicate) continue;

                const body = [
                  marker,
                  '@coderabbitai Re-check this unresolved original finding against the current PR HEAD.',
                  '',
                  `Current PR HEAD: \`${pr.head.sha}\``,
                  '',
                  'Inspect the current code itself, not only the incremental diff.',
                  'Resolve this thread only if the underlying issue is fully fixed.',
                  'Otherwise explain exactly what remains unresolved.',
                ].join('\n');

                await github.request(
                  'POST /repos/{owner}/{repo}/pulls/{pull_number}/comments/{comment_id}/replies',
                  {
                    owner,
                    repo,
                    pull_number: pr.number,
                    comment_id: thread.commentId,
                    body,
                  }
                );
                requested += 1;
              }

              return requested;
            }

            async function cancelObsoleteRuns(openPulls) {
              const { data: mainBranch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'main',
              });
              const mainSha = mainBranch.commit.sha;

              const liveHeads = new Set([
                mainSha,
                ...openPulls.map(pr => pr.head.sha),
              ]);

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  per_page: 100,
                }
              );

              const activeStates =
                ['queued', 'in_progress', 'waiting', 'pending', 'requested'];
              let ci = 0;
              let noopRelease = 0;

              async function cancelRun(run, reason) {
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  core.notice(
                    `Cancelled ${reason} run ${run.id} for head ${run.head_sha}.`
                  );
                  return true;
                } catch (err) {
                  // A run may finish or be cancelled by concurrency between the
                  // list and the write; that race is harmless.
                  if (![409, 422].includes(err.status)) throw err;
                  core.info(
                    `Run ${run.id} changed state before cancellation: ${err.message}`
                  );
                  return false;
                }
              }

              for (const run of runs) {
                if (!activeStates.includes(run.status)) continue;

                if (
                  run.name === 'CI' &&
                  !liveHeads.has(run.head_sha)
                ) {
                  if (await cancelRun(run, 'obsolete CI')) ci += 1;
                  continue;
                }

                // Older push-to-main Release runs for a version that was already
                // published before the run started are guaranteed preflight
                // no-ops. They used to queue two unnecessary macOS builds.
                // Never cancel the current-main Release run, and never cancel a
                // run that may itself be publishing a new release.
                if (
                  run.name === 'Release' &&
                  run.event === 'push' &&
                  run.head_branch === 'main' &&
                  run.head_sha !== mainSha
                ) {
                  try {
                    const { data: versionFile } =
                      await github.rest.repos.getContent({
                        owner,
                        repo,
                        path: process.env.CONTINUUM_VERSION_FILE,
                        ref: run.head_sha,
                      });
                    if (Array.isArray(versionFile) || !versionFile.content) {
                      continue;
                    }

                    const source = Buffer.from(
                      versionFile.content,
                      'base64'
                    ).toString('utf8');
                    const match = source.match(/\b\d+\.\d+\.\d+\b/);
                    if (!match) continue;

                    const { data: release } =
                      await github.rest.repos.getReleaseByTag({
                        owner,
                        repo,
                        tag: `v${match[0]}`,
                      });

                    const publishedAt = new Date(
                      release.published_at || release.created_at || 0
                    ).getTime();
                    const runCreatedAt = new Date(run.created_at || 0).getTime();

                    if (
                      publishedAt > 0 &&
                      runCreatedAt > 0 &&
                      publishedAt < runCreatedAt
                    ) {
                      if (await cancelRun(run, 'stale no-op Release')) {
                        noopRelease += 1;
                      }
                    }
                  } catch (err) {
                    if (err.status !== 404) throw err;
                    // No matching release existed: this may be a real release.
                  }
                }
              }

              return { ci, noopRelease };
            }

            async function dispatchConflictRepair(pr, reason) {
              if (hasLabel(pr, CONFLICT_LOCK_LABEL)) {
                core.info(
                  `PR #${pr.number}: conflict repair already active; waiting.`
                );
                return;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [CONFLICT_LOCK_LABEL],
              });

              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                  {
                    owner,
                    repo,
                    workflow_id: 'continuum-opencode.yml',
                    ref: 'main',
                    inputs: {
                      mode: 'resolve-conflict',
                      pr_number: String(pr.number),
                      head_ref: pr.head.ref,
                    },
                  }
                );
                core.notice(
                  `PR #${pr.number}: dispatched OpenCode conflict repair (${reason}).`
                );
              } catch (err) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: CONFLICT_LOCK_LABEL,
                  });
                } catch (_) {}
                throw err;
              }
            }

            async function updateFromMain(pr) {
              const oldHead = pr.head.sha;
              const { data: mainBranch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: 'main',
              });
              const mainHead = mainBranch.commit.sha;

              // Carry is allowed only from a fully valid review basis and only
              // when there are no unresolved CodeRabbit threads. If update-branch
              // hits a conflict, no marker is ever written; OpenCode's conflict
              // resolution therefore becomes an ordinary new commit that must be
              // reviewed again.
              // Carry exists only to reuse a CodeRabbit approval across a
              // controller-generated sync. With CodeRabbit disabled there is no
              // approval to carry, so no marker is written and the
              // GraphQL thread queries are skipped entirely.
              const unresolvedBeforeSync = requireCodeRabbit
                ? await unresolvedCodeRabbitThreads(pr)
                : [];
              const reviewBasis =
                requireCodeRabbit && unresolvedBeforeSync.length === 0
                  ? await codeRabbitReviewBasis(pr, oldHead)
                  : null;

              try {
                await github.request(
                  'PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                  {
                    owner,
                    repo,
                    pull_number: pr.number,
                    expected_head_sha: oldHead,
                  }
                );

                let fresh = null;
                for (let attempt = 0; attempt < 6; attempt += 1) {
                  fresh = await getPull(pr.number);
                  if (fresh.head.sha !== oldHead) break;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }

                let carried = false;
                if (reviewBasis && fresh && fresh.head.sha !== oldHead) {
                  const { data: newCommit } = await github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: fresh.head.sha,
                  });
                  const parents = (newCommit.parents || []).map(parent =>
                    parent.sha.toLowerCase()
                  );
                  const parentSet = new Set(parents);

                  // The marker is written only after GitHub itself completed a
                  // clean update-branch merge, and only when the resulting
                  // commit has exactly the old PR head + the exact main head as
                  // its two parents. A human/OpenCode conflict resolution can
                  // never satisfy this path because update-branch failed before
                  // any marker was emitted.
                  if (
                    parents.length === 2 &&
                    parentSet.has(oldHead.toLowerCase()) &&
                    parentSet.has(mainHead.toLowerCase())
                  ) {
                    const marker =
                      `<!-- auto-main-sync head=${fresh.head.sha} from=${oldHead} main=${mainHead} carry=${reviewBasis.sourceSha} -->`;
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: pr.number,
                      body: marker,
                    });
                    carried = true;
                    core.notice(
                      `PR #${pr.number}: clean main sync ${oldHead} -> ${fresh.head.sha}; carrying CodeRabbit approval from ${reviewBasis.sourceSha}.`
                    );
                  }
                }

                core.notice(
                  carried
                    ? `PR #${pr.number}: updated from main; waiting for fresh CI only (CodeRabbit approval carried).`
                    : `PR #${pr.number}: updated from main; waiting for fresh CI and a fresh CodeRabbit review.`
                );
                return true;
              } catch (err) {
                const message = String(err.message || err);

                // GitHub returns 422 when expected_head_sha became stale. That is
                // a normal race with OpenCode/CI/main-sync, not a merge conflict.
                // Re-read before deciding whether a repair agent is warranted.
                const fresh = await getPull(pr.number);
                if (fresh.head.sha !== oldHead) {
                  core.info(
                    `PR #${pr.number}: head advanced from ${oldHead} to ${fresh.head.sha} during update; no conflict repair needed.`
                  );
                  return false;
                }

                if (
                  err.status === 409 ||
                  /merge conflict|conflict|cannot be performed|not updateable/i.test(message)
                ) {
                  await dispatchConflictRepair(fresh, message);
                  return false;
                }

                core.warning(
                  `PR #${pr.number}: update-branch failed without a confirmed conflict: ${message}`
                );
                return false;
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            const cancelledRuns = await cancelObsoleteRuns(pulls);
            if (cancelledRuns.ci > 0 || cancelledRuns.noopRelease > 0) {
              core.notice(
                `Cancelled ${cancelledRuns.ci} obsolete CI run(s) and ${cancelledRuns.noopRelease} stale no-op Release run(s) before reconciliation.`
              );
            }

            // Oldest first makes autonomous behavior deterministic.
            pulls.sort(
              (a, b) =>
                new Date(a.created_at).getTime() -
                new Date(b.created_at).getTime()
            );

            let codeRabbitRetryControllerDispatched = false;

            for (const listed of pulls) {
              let pr = await getPull(listed.number);

              if (
                pr.state !== 'open' ||
                pr.draft ||
                pr.head.repo?.full_name !== repoFullName
              ) {
                continue;
              }

              if (hasLabel(pr, AUTO_MERGE_BLOCK_LABEL)) {
                core.info(
                  `PR #${pr.number}: ${AUTO_MERGE_BLOCK_LABEL} is set; skipping.`
                );
                continue;
              }

              // Do not churn PR HEADs merely because main advanced in
              // documentation or repository control-plane files. CodeRabbit
              // review is a property of the PR source HEAD; changing README or
              // workflow plumbing must not invalidate it. Runtime/build/test/
              // packaging changes on main remain strict and force a real sync.
              const comparison = await compareWithMain(pr.head.sha);
              const mainSync = await shouldSyncFromMain(pr, comparison);
              if (mainSync.required) {
                core.notice(
                  `PR #${pr.number}: main advanced in merge-critical files; synchronizing before merge: ${mainSync.criticalFiles.join(', ') || mainSync.reason}.`
                );
                await updateFromMain(pr);
                continue;
              }
              if (mainSync.reason === 'non-merge-critical-main-delta') {
                core.notice(
                  `PR #${pr.number}: main advanced only in non-merge-critical files; preserving PR HEAD and existing review/CI state: ${mainSync.files.join(', ')}.`
                );
              }

              const ci = await latestCurrentHeadCi(pr);
              if (
                !ci ||
                ci.status !== 'completed' ||
                ci.conclusion !== 'success'
              ) {
                core.info(
                  `PR #${pr.number}: waiting for successful CI on head ${pr.head.sha}.`
                );
                continue;
              }

              // Packaging smoke is conditional/path-filtered. If this HEAD has
              // a Packaging smoke run, it is a blocking quality gate just like
              // CI; an absent run means the workflow was not applicable.
              const packagingSmoke =
                await latestCurrentHeadPackagingSmoke(pr);
              if (
                packagingSmoke &&
                (packagingSmoke.status !== 'completed' ||
                 packagingSmoke.conclusion !== 'success')
              ) {
                core.info(
                  `PR #${pr.number}: waiting for successful Packaging smoke on head ${pr.head.sha}; current state=${packagingSmoke.status}/${packagingSmoke.conclusion || 'pending'}.`
                );
                continue;
              }

              const extraWorkflowGate =
                await requiredWorkflowGate(pr, pr.head.sha);
              if (
                requiredWorkflowGateLabel &&
                requiredWorkflowGateName &&
                hasLabel(pr, requiredWorkflowGateLabel) &&
                (
                  !extraWorkflowGate ||
                  extraWorkflowGate.status !== 'completed' ||
                  extraWorkflowGate.conclusion !== 'success'
                )
              ) {
                core.info(
                  `PR #${pr.number}: waiting for required workflow '${requiredWorkflowGateName}' on head ${pr.head.sha}; current state=${extraWorkflowGate ? `${extraWorkflowGate.status}/${extraWorkflowGate.conclusion || 'pending'}` : 'missing'}.`
                );
                continue;
              }

              // A clean controller-generated merge of main can reuse a prior
              // completed APPROVED review. Any other new HEAD must have its own
              // CodeRabbit review. Without CodeRabbit there is no review basis
              // to establish and nothing to wait for.
              const reviewBasis = requireCodeRabbit
                ? await codeRabbitReviewBasis(pr, pr.head.sha)
                : null;
              const rabbitStatus = requireCodeRabbit
                ? await latestCodeRabbitStatus(pr.head.sha)
                : null;
              const reviewConvergenceStatus = requireCodeRabbit
                ? await latestReviewConvergenceStatus(pr.head.sha)
                : null;

              // A policy/task-contract verdict with no actionable code finding
              // is terminal for this exact HEAD. Re-dispatching CodeRabbit or a
              // coding agent cannot make progress and would only burn quota.
              // A new HEAD gets a fresh status namespace automatically; a later
              // explicit CodeRabbit approval on the same HEAD clears this status.
              if (
                requireCodeRabbit &&
                !reviewBasis &&
                reviewConvergenceStatus?.state === 'error'
              ) {
                core.warning(
                  `PR #${pr.number}: exact HEAD ${pr.head.sha} is blocked by a non-code CodeRabbit verdict; automatic review/fix retries are suppressed.`
                );
                continue;
              }

              // Any green current HEAD that still lacks a valid CodeRabbit
              // approval belongs to the global serialized review queue. Wake
              // that controller even when CodeRabbit reports "review skipped",
              // a stale success status, or no status at all. The controller
              // owns quota timing and de-duplicates in-flight commands.
              //
              // `requireCodeRabbit` is checked here, not only through
              // `!reviewBasis`: with the flag off there is no review queue to
              // wake, and a repository without `continuum-coderabbit-retry.yml`
              // would answer the dispatch with a 404.
              if (requireCodeRabbit && !reviewBasis && !codeRabbitRetryControllerDispatched) {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'continuum-coderabbit-retry.yml',
                  ref: 'main',
                });
                codeRabbitRetryControllerDispatched = true;
                core.notice(
                  `PR #${pr.number}: missing a valid CodeRabbit approval; dispatched the global review controller.`
                );
              }

              // Rate-limit recovery applies only when this HEAD still needs its
              // own review. A safely carried approval must not burn another
              // included CodeRabbit review merely because the merge SHA changed.
              if (
                requireCodeRabbit &&
                !reviewBasis &&
                rabbitStatus &&
                /Review rate limited|Review limit reached/i.test(
                  rabbitStatus.description || ''
                )
              ) {
                // Full-review quota is shared across PRs. Delegate selection to
                // the global CodeRabbit retry controller, which ranks the
                // source issues P0 -> P1 -> P2 and emits at most one review
                // command for the next legal quota slot.
                if (!codeRabbitRetryControllerDispatched) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: 'continuum-coderabbit-retry.yml',
                    ref: 'main',
                  });
                  codeRabbitRetryControllerDispatched = true;
                  core.notice(
                    'Delegated rate-limited CodeRabbit reviews to the global priority controller.'
                  );
                }
                continue;
              }

              if (
                requireCodeRabbit &&
                !reviewBasis &&
                (
                  !rabbitStatus ||
                  rabbitStatus.state !== 'success' ||
                  !/Review completed/i.test(rabbitStatus.description || '')
                )
              ) {
                core.info(
                  `PR #${pr.number}: waiting for completed CodeRabbit review on current head.`
                );
                continue;
              }

              // Never lose an old CodeRabbit finding just because its diff is
              // now outdated. Every CodeRabbit-authored inline thread must be
              // resolved by CodeRabbit before merge.
              const unresolvedThreads = requireCodeRabbit
                ? await unresolvedCodeRabbitThreads(pr)
                : [];
              if (unresolvedThreads.length > 0) {
                const requested = await requestCodeRabbitThreadVerification(
                  pr,
                  unresolvedThreads
                );
                core.info(
                  `PR #${pr.number}: waiting for ${unresolvedThreads.length} unresolved CodeRabbit thread(s); requested ${requested} fresh verification(s) for head ${pr.head.sha}: ` +
                  unresolvedThreads
                    .map(thread =>
                      `#${thread.commentId || thread.id} ${thread.path}${thread.outdated ? ' (outdated)' : ''}`
                    )
                    .join(', ')
                );
                continue;
              }

              // If CodeRabbit happened to comment on the synchronized current
              // head, do not ignore those findings merely because the approval
              // basis came from an older cleanly-carried head.
              const currentHeadNitpicks = requireCodeRabbit
                ? await codeRabbitNitpickReviews(pr)
                : [];
              if (currentHeadNitpicks.length > 0) {
                core.info(
                  `PR #${pr.number}: waiting for ${currentHeadNitpicks.length} current-head CodeRabbit nitpick review(s) to be addressed.`
                );
                continue;
              }

              if (requireCodeRabbit && !reviewBasis) {
                const decision = await latestCodeRabbitDecision(pr);
                core.info(
                  `PR #${pr.number}: current-head CodeRabbit decision is ${decision?.state || 'missing'}; not mergeable yet.`
                );
                continue;
              }

              if (reviewBasis && reviewBasis.carried) {
                core.info(
                  `PR #${pr.number}: using CodeRabbit approval from ${reviewBasis.sourceSha} for clean main-sync head ${pr.head.sha}; current-head CI remains mandatory.`
                );
              }

              // Re-read every merge-critical fact immediately before the write.
              pr = await getPull(pr.number);
              if (
                pr.state !== 'open' ||
                pr.draft ||
                pr.head.repo?.full_name !== repoFullName ||
                hasLabel(pr, AUTO_MERGE_BLOCK_LABEL)
              ) {
                continue;
              }

              const finalComparison = await compareWithMain(pr.head.sha);
              const finalMainSync =
                await shouldSyncFromMain(pr, finalComparison);
              if (finalMainSync.required) {
                core.notice(
                  `PR #${pr.number}: merge-critical main delta appeared during final revalidation; synchronizing instead of merging.`
                );
                await updateFromMain(pr);
                continue;
              }

              const finalCi = await latestCurrentHeadCi(pr);
              const finalPackagingSmoke =
                await latestCurrentHeadPackagingSmoke(pr);
              const finalExtraWorkflowGate =
                await requiredWorkflowGate(pr, pr.head.sha);
              const finalReviewBasis = requireCodeRabbit
                ? await codeRabbitReviewBasis(pr, pr.head.sha)
                : null;
              const finalUnresolvedThreads = requireCodeRabbit
                ? await unresolvedCodeRabbitThreads(pr)
                : [];
              const finalCurrentHeadNitpicks = requireCodeRabbit
                ? await codeRabbitNitpickReviews(pr)
                : [];

              if (
                !finalCi ||
                finalCi.status !== 'completed' ||
                finalCi.conclusion !== 'success' ||
                (finalPackagingSmoke &&
                 (finalPackagingSmoke.status !== 'completed' ||
                  finalPackagingSmoke.conclusion !== 'success')) ||
                (requiredWorkflowGateLabel &&
                 requiredWorkflowGateName &&
                 hasLabel(pr, requiredWorkflowGateLabel) &&
                 (!finalExtraWorkflowGate ||
                  finalExtraWorkflowGate.status !== 'completed' ||
                  finalExtraWorkflowGate.conclusion !== 'success')) ||
                // The CodeRabbit half of the revalidation is itself conditional:
                // with the integration off there is nothing to re-read, and
                // requiring a review basis that can never exist would cancel
                // every merge.
                (requireCodeRabbit &&
                  (!finalReviewBasis ||
                   finalUnresolvedThreads.length !== 0 ||
                   finalCurrentHeadNitpicks.length !== 0))
              ) {
                core.info(
                  `PR #${pr.number}: gate changed during final revalidation; merge cancelled.`
                );
                continue;
              }

              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                await dispatchConflictRepair(
                  pr,
                  `mergeable_state=${pr.mergeable_state}`
                );
                continue;
              }
              if (pr.mergeable === null) {
                core.info(
                  `PR #${pr.number}: GitHub mergeability is still being computed; waiting.`
                );
                continue;
              }

              // release-please parses the squash commit on main, not the PR
              // title separately. Keep PR titles human-friendly and normalize
              // the generated squash commit here so contributors never need to
              // write Conventional Commit prefixes themselves.
              const conventionalTitle = /^(?:fix|feat|perf|refactor)(?:\([^)]*\))?!?:\s/i.test(pr.title)
                ? pr.title
                : `fix: ${pr.title}`;

              const { data: result } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                commit_title: conventionalTitle,
                sha: pr.head.sha,
              });

              if (!result.merged) {
                core.warning(
                  `PR #${pr.number}: GitHub refused merge: ${result.message || 'unknown reason'}`
                );
                continue;
              }

              core.notice(
                `PR #${pr.number}: auto-merged head ${pr.head.sha} using ${
                  requireCodeRabbit
                    ? `CodeRabbit approval from ${finalReviewBasis.sourceSha}`
                    : 'CI only; CodeRabbit is disabled for this repository'
                }; merge commit ${result.sha}.`
              );

              // Waking downstream workflows is best-effort and never changes the
              // merge outcome: a merge already landed, so a wake-up that cannot
              // be delivered must not turn the run red or stop the scheduler
              // from being woken at all.
              for (const workflow of postMergeWakeups) {
                try {
                  await github.request(
                    'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                    { owner, repo, workflow_id: workflow, ref: postMergeWakeupRef }
                  );
                  core.notice(`Woke ${workflow} at ${postMergeWakeupRef}.`);
                } catch (err) {
                  core.warning(
                    `PR #${pr.number}: could not wake ${workflow}: ${err.message}`
                  );
                }
              }

              // Merge at most one PR per controller run. The main push triggers
              // a new run, which first refreshes every remaining branch from the
              // new main. Clean controller-generated syncs keep an already valid
              // CodeRabbit approval; all other new commits require a fresh review.
              break;
            }
