name: Release PR

# Maintains the single automated Release PR from what has actually landed in
# `main` — the "Release PR" model from issue #10:
#
# 1. Feature/fix/docs PRs do NOT choose or bump the release version.
# 2. They merge into protected `main` normally after CI.
# 3. This workflow observes the merged `main` tip and runs release-please,
#    which creates or updates ONE Release PR
#    (`release-please--branches--main`) with the next patch version in
#    `Sources/NanoDictateCore/Version.swift` (via the generic `extra-files`
#    updater, see release-please-config.json) and the manifest version.
# 4. The changelog step below then cuts the matching `## [<version>]` section
#    in CHANGELOG.md on that same branch, so Version.swift and the changelog
#    a test compares it against can never drift apart.
# 5. Merging the Release PR publishes the release through release.yml
#    (tag + GitHub Release + binaries + Homebrew/MacPorts manifests).
#
# No step pushes to `main`: the version bump, the manifest and the changelog
# cut all land on the Release PR branch and reach `main` only through a normal
# PR merge. Concurrent development PRs therefore cannot race or pick duplicate
# versions — version selection is serialized at release time.
#
# Release policy — the same gates bump-version.yml enforced, and every
# "do not release" answer is a GREEN no-op (no Release PR update):
#   1. Automation loop guard — merges of the Release PR itself or of a
#      release-manifests PR never open another Release PR.
#   2. `skip-release` label on the merged PR — a deliberate opt-out. Checked
#      before the version comparison and before any diff is computed, so
#      a labeled PR never triggers a Release PR update even if its paths would
#      count as real changes. The label is read from the pull_request event
#      payload — no extra API call.
#   3. Path-based guard — a diff limited to Version.swift, the release-please
#      config/manifest, CHANGELOG.md, README.md, SECURITY.md, LICENSE, docs/,
#      .github/, .githooks/, the root meta-dotfiles and packaging files would
#      publish an empty release, so it is classified non-releasable.
# Unrelated labels (chore, documentation, ci, ...) are deliberately NOT
# overloaded — the release decision stays explicit.
# Only a broken policy input (unparsable or out-of-series version) fails the
# workflow: a human error must be surfaced, not silently swallowed.
# The decisions themselves live in scripts/release-policy.sh and are covered by
# scripts/test-release-policy.sh (run by .github/workflows/continuum-ci.yml).
#
# Versioning: release-please is configured with `versioning: always-bump-patch`
# (see release-please-config.json), which preserves NanoDictate's patch-only
# policy — a `feat:` commit bumps the patch, never the minor. Tag shape
# (`v<version>`, no component prefix) and the 0.0.x/0.1.x series guard match
# the existing release pipeline; `skip-github-release` keeps tag/release
# creation in release.yml so artifact generation, packaging, validation and
# publication behavior are unchanged.
#
# Automatic bump limit: automatic bumps in the 0.0.x series stop at 0.0.100.
# release.yml separately validates the selected version format and series.
#
# Authentication: a PR created with the default GITHUB_TOKEN does NOT trigger
# other GitHub Actions workflows, so CI would never run on the Release PR.
# All Release PR writes therefore use RELEASE_PR_TOKEN (a fine-grained PAT
# with Contents: write + Pull requests: write) when it is configured,
# falling back to the existing TAP_PAT repo secret (same scopes, already used
# by auto-merge and the tap sync). Either token makes the Release PR an
# ordinary PAT-authored PR, so required CI runs before merge without any
# branch-protection bypass. Only when neither secret exists does the workflow
# fall back to GITHUB_TOKEN, with a loud warning that CI will not trigger.
#
# No loop by construction: this workflow triggers ONLY on `pull_request` closed
# (not on `push`), so commits pushed to the Release PR branch cannot
# re-trigger it. The Release PR merge itself is a green no-op (loop guard).

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions: {}

concurrency:
  # Release PR updates must be serialized, never cancelled: two merges in quick
  # succession each recompute the Release PR from the current `main` tip, and
  # cancelling the first would leave the Release PR behind the second merge.
  group: nanodictate-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please labels the Release PR (autorelease: pending/tagged).
      issues: write
    steps:
      - name: Checkout main
        # Same pinned actions/checkout as release.yml. Explicit main ref: the
        # default ref for a pull_request event is the merge ref, which is gone
        # once the PR is closed. fetch-depth: 0 + fetch-tags pull the full
        # history INCLUDING the previous release tag (v$LATEST): the "real
        # code changes" guard below diffs the merged HEAD against that tag.
        # persist-credentials: false — every write below authenticates
        # explicitly with the release token, so the job token never gains a
        # reusable credential in .git/config (CWE-522).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Everything that DECIDES whether the Release PR is updated happens here,
      # so the only steps that can touch the Release PR branch are the ones
      # gated on decision == 'releasable'.
      - name: Ensure Continuum scripts available
        if: hashFiles('scripts/release-policy.sh') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref || 'main' }}
          path: .continuum
          persist-credentials: false

      - name: Copy missing Continuum scripts
        if: hashFiles('scripts/release-policy.sh') == ''
        run: |
          mkdir -p scripts
          rsync -a --ignore-existing .continuum/scripts/ scripts/

      - name: Decide release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          # Labels straight from the event payload (github.event.pull_request
          # .labels) — no extra GitHub API request. Emitted through env, not
          # interpolated into the script, so the JSON needs no shell escaping.
          # A workflow_dispatch run has no PR payload: empty labels fall
          # through to the automatic path-based policy.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh

          # --- Gate 0: the automation loop guard -------------------------------
          # Merges of automation branches must never open another Release PR:
          # the Release PR merge itself (release.yml publishes it) and the
          # release-manifests PR merge (packaging-only by construction).
          if [[ "${HEAD_REF:-}" == "release-please--branches--main" ]]; then
            echo "Merged PR is the Release PR itself — release.yml publishes it; no Release PR update."
            echo "decision=release-pr-merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${HEAD_REF:-}" == chore/release-manifests-* ]]; then
            echo "Merged PR is a release-manifests sync — packaging-only by construction; no Release PR update."
            echo "decision=manifests-merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Gate 1: the explicit `skip-release` opt-out -------------------
          # Deliberately before the version comparison, before any diff.
          if policy_pr_has_label "$PR_LABELS" skip-release; then
            echo "::notice::Merged PR #${PR_NUMBER} carries the 'skip-release' label — no Release PR update."
            echo "decision=skip-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No 'skip-release' label on the merged PR — applying the automatic release policy."

          # Current version from the single source of truth (same extraction
          # as release.yml's preflight step).
          CURRENT=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' Sources/NanoDictateCore/Version.swift)
          echo "Version.swift: ${CURRENT:-<none>}"
          if [[ -z "$CURRENT" ]]; then
            echo "::error::Could not extract a version from Sources/NanoDictateCore/Version.swift"
            exit 1
          fi

          # Latest published release (release tags are v0.0.N; strip the v).
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty' | sed 's/^v//')
          echo "Latest release: ${LATEST:-<none>}"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [[ -z "$LATEST" ]]; then
            echo "::warning::No published release yet — the first release of the series is created manually (tag push); nothing to propose."
            echo "decision=no-release-yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strict version shape guard: only 0.0.x / 0.1.x (no leading zeros)
          # is accepted. Both versions are policy INPUTS here, so a failure is
          # a real error and fails the workflow.
          if ! policy_version_is_allowed "$CURRENT"; then
            echo "::error::Unexpected version in Version.swift: '$CURRENT' — expected 0.0.x or 0.1.x (no leading zeros)."
            exit 1
          fi
          if ! policy_version_is_allowed "$LATEST"; then
            echo "::error::Unexpected latest release tag: '$LATEST' — expected 0.0.x or 0.1.x (no leading zeros)."
            exit 1
          fi

          # Full semver order (sort -V): 0.1.0 ranks AHEAD of 0.0.99 even
          # though its patch part (0) is smaller — patch-only compares would
          # misrank across minor versions.
          EARLIEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n 1)

          if [[ "$CURRENT" != "$LATEST" && "$EARLIEST" == "$LATEST" ]]; then
            echo "Version.swift ($CURRENT) is already ahead of the latest release ($LATEST) — a release is pending; no new Release PR update."
            echo "decision=already-bumped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$CURRENT" != "$LATEST" && "$EARLIEST" == "$CURRENT" ]]; then
            echo "::warning::Version.swift ($CURRENT) is BEHIND the latest release ($LATEST) — refusing to propose; fix the version through the Release PR."
            echo "decision=behind-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Gate 2: the path-based "real change" guard --------------------
          # Refuse a Release PR update when the merged HEAD carries NO code
          # change vs the previous release tag (v$LATEST) — a diff limited to
          # Version.swift, the release-please config/manifest, CHANGELOG.md,
          # README.md, SECURITY.md, LICENSE, docs/, .github/ (workflows, issue
          # templates, PR template), .githooks/, the root meta-dotfiles and
          # packaging files would publish an empty release.
          #
          # The release workflow pins the installer to the just-synced macports
          # tree revision via a one-line PIN_REV edit to a manifests PR branch
          # after every tag. That generated line is not a user code change —
          # it is filtered out, so a docs-only merge still refuses a Release PR
          # update, while a real installer edit keeps counting.
          PREV_TAG="v$LATEST"
          ALL_CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD)
          NON_PINREV=$(git diff "$PREV_TAG"..HEAD -- "$POLICY_INSTALLER_PATH" \
            | policy_installer_diff_wo_pinrev)
          # policy_decide re-evaluates the label gate, which is harmless: it
          # already answered above and a labeled PR never reached this line.
          # Calling the same tested entry point the test suite exercises keeps
          # the workflow and the tests from drifting apart.
          DECISION=$(policy_decide "$PR_LABELS" "$ALL_CHANGED" "$NON_PINREV")
          case "$DECISION" in
            releasable)
              echo "Real changes since $PREV_TAG:"
              printf '%s\n' "$ALL_CHANGED" | policy_releasable_paths "$NON_PINREV" | sed 's/^/  /'
              ;;
            no-changes)
              echo "::warning::nothing changed since $PREV_TAG — no Release PR update."
              ;;
            non-releasable)
              echo "::warning::no code changes — no Release PR update (only Version.swift / release-please config / CHANGELOG.md / README.md / SECURITY.md / LICENSE / docs / .github / .githooks / repo meta files / packaging files changed since $PREV_TAG)."
              ;;
            *)
              echo "::error::policy_decide returned an unknown decision: '$DECISION'"
              exit 1
              ;;
          esac
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"

          # --- Automatic bump limit ------------------------------------------
          # Equal versions here: the merged PR did NOT bump the version, so a
          # Release PR would bump it — unless the 0.0.x series already hit its
          # hard cap. The limit applies ONLY to the 0.0.x series: 0.1.x may
          # grow past patch=100 (0.1.101 is fine), so it is gated on the "0.0."
          # prefix. Checked here, not in the update step, so a capped version is
          # a decision (and stays a green no-op) instead of a half-applied bump.
          # Gated on DECISION == releasable: a no-changes / non-releasable
          # merge never reaches the Release PR, so the cap must not overwrite its
          # own (more precise) reason in the job summary.
          if [[ "$DECISION" == releasable ]] && policy_automatic_bump_blocked "$CURRENT"; then
            echo "::warning::Version $CURRENT is the 0.0.100 hard cap of the 0.0.x series (user policy) — no Release PR update. A future series (e.g. 0.1.x) requires a manual version change through the Release PR."
            echo "decision=at-cap" >> "$GITHUB_OUTPUT"
          fi

      # Resolve the token every Release PR write authenticates with. A PAT is
      # required so CI runs on the Release PR (GITHUB_TOKEN writes suppress
      # downstream workflow runs). RELEASE_PR_TOKEN is the dedicated secret;
      # TAP_PAT (already repo-scoped, already used by auto-merge) is the
      # fallback so existing installations keep working.
      - name: Resolve release token
        id: release-token
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          GH_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_PR_TOKEN:-}" ]]; then
            echo "::add-mask::${RELEASE_PR_TOKEN}"
            echo "token=${RELEASE_PR_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "source=RELEASE_PR_TOKEN" >> "$GITHUB_OUTPUT"
          elif [[ -n "${TAP_PAT:-}" ]]; then
            echo "::add-mask::${TAP_PAT}"
            echo "token=${TAP_PAT}" >> "$GITHUB_OUTPUT"
            echo "source=TAP_PAT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Neither RELEASE_PR_TOKEN nor TAP_PAT is configured — falling back to GITHUB_TOKEN. The Release PR will be created, but required CI will NOT run on it. Configure RELEASE_PR_TOKEN (fine-grained PAT: Contents write, Pull requests write) or TAP_PAT."
            echo "token=${GH_FALLBACK}" >> "$GITHUB_OUTPUT"
            echo "source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      # The only step that proposes a version: release-please creates or updates
      # the single Release PR from the merged history on `main`.
      - name: Update Release PR
        id: release-please
        if: steps.policy.outputs.decision == 'releasable'
        # Pinned googleapis/release-please-action@v4 (v4.4.1; CWE-829: mutable
        # tag could be swapped upstream).
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # The version constant and the changelog are one release: the
      # VersionTests.testVersionStringEqualsCurrentRelease test compares
      # Version.swift with the first `## [<semver>]` header after
      # `## [Unreleased]`, so a Release PR that skips the changelog turns every
      # later build red. Cut the section on the Release PR branch in the same
      # flow (release-please owns Version.swift + the manifest; this step owns
      # CHANGELOG.md, which release-please is configured to skip).
      - name: Ensure Continuum scripts available
        if: hashFiles('scripts/release-policy.sh') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref || 'main' }}
          path: .continuum
          persist-credentials: false

      - name: Copy missing Continuum scripts
        if: hashFiles('scripts/release-policy.sh') == ''
        run: |
          mkdir -p scripts
          rsync -a --ignore-existing .continuum/scripts/ scripts/

      - name: Cut CHANGELOG section on Release PR branch
        id: changelog
        if: steps.policy.outputs.decision == 'releasable'
        env:
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh

          BRANCH="release-please--branches--main"
          if ! git fetch --quiet origin "$BRANCH"; then
            echo "::notice::No Release PR branch found after the release-please step (no conventional commits since the last release?) — nothing to cut."
            echo "cut=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --quiet "origin/$BRANCH"

          PROPOSED=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' Sources/NanoDictateCore/Version.swift)
          if [[ -z "$PROPOSED" ]]; then
            echo "::error::Could not extract a version from Sources/NanoDictateCore/Version.swift on $BRANCH"
            exit 1
          fi
          if ! policy_version_is_allowed "$PROPOSED"; then
            echo "::error::Release PR proposes an unpublishable version '$PROPOSED' — expected 0.0.x or 0.1.x (no leading zeros)."
            exit 1
          fi
          FIRST=$(awk '
            /^## \[Unreleased\]$/ { after = 1; next }
            after && /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {
              header = $0; sub(/^## \[/, "", header); sub(/\].*$/, "", header)
              print header; exit
            }' CHANGELOG.md)
          if [[ "$FIRST" == "$PROPOSED" ]]; then
            echo "CHANGELOG.md already opens with ## [$PROPOSED] — nothing to cut."
            echo "cut=already-cut" >> "$GITHUB_OUTPUT"
            echo "proposed=${PROPOSED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # release-please is intentionally configured with skip-changelog=true so
          # NanoDictate can preserve its existing Keep a Changelog layout. Pull
          # the generated notes from the Release PR body and seed them into the
          # Unreleased block before cutting that block into the new release.
          # This keeps the detailed release notes instead of creating an empty
          # version header (the v0.1.7 failure mode).
          PR_BODY=$(GH_TOKEN="$RELEASE_TOKEN" gh pr view "$BRANCH" --repo "$REPO" --json body --jq '.body // ""')
          NOTES=$(printf '%s\n' "$PR_BODY" | awk -v version="$PROPOSED" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^---$/ { exit }
            capture { print }
          ')
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "::error::Release PR contains no generated notes for v$PROPOSED — refusing to cut an empty CHANGELOG section."
            exit 1
          fi
          NOTES_FILE=$(mktemp)
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          awk -v notes_file="$NOTES_FILE" '
            /^## \[Unreleased\]$/ && !inserted {
              print
              print ""
              while ((getline line < notes_file) > 0) print line
              close(notes_file)
              inserted = 1
              next
            }
            { print }
            END { if (!inserted) exit 2 }
          ' CHANGELOG.md > CHANGELOG.md.with-notes || {
            rm -f "$NOTES_FILE" CHANGELOG.md.with-notes
            echo "::error::Could not seed generated release notes under ## [Unreleased]."
            exit 1
          }
          rm -f "$NOTES_FILE"

          if ! policy_changelog_cut_release "$PROPOSED" "$(date -u +%F)" < CHANGELOG.md.with-notes > CHANGELOG.md.new; then
            rm -f CHANGELOG.md.new CHANGELOG.md.with-notes
            echo "::error::Failed to cut a '## [$PROPOSED]' release section in CHANGELOG.md — is the '## [Unreleased]' header present?"
            exit 1
          fi
          rm -f CHANGELOG.md.with-notes
          mv CHANGELOG.md.new CHANGELOG.md
          echo "Cut the CHANGELOG.md release section: ## [$PROPOSED] - $(date -u +%F)"

          git config user.name "kodmial"
          git config user.email "kodmial@gmail.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged after the cut — nothing to commit."
            echo "cut=noop" >> "$GITHUB_OUTPUT"
            echo "proposed=${PROPOSED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): cut CHANGELOG for v$PROPOSED"
          # PAT-authenticated push (not the checkout's credentials, which were
          # disabled with persist-credentials: false): a PAT push triggers the
          # Release PR's CI, a GITHUB_TOKEN push would suppress it. Pushing a
          # feature branch is allowed under branch protection — only `main`
          # requires a pull request.
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${REPO}.git"
          git push origin "HEAD:${BRANCH}"
          echo "Pushed the CHANGELOG cut to ${BRANCH}."
          echo "cut=cut" >> "$GITHUB_OUTPUT"
          echo "proposed=${PROPOSED}" >> "$GITHUB_OUTPUT"

      # One place that spells out what happened, so a no-op merge is not
      # mistaken for a broken pipeline.
      - name: Ensure Continuum scripts available
        if: hashFiles('scripts/release-policy.sh') == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref || 'main' }}
          path: .continuum
          persist-credentials: false

      - name: Copy missing Continuum scripts
        if: hashFiles('scripts/release-policy.sh') == ''
        run: |
          mkdir -p scripts
          rsync -a --ignore-existing .continuum/scripts/ scripts/

      - name: Release policy summary
        # hashFiles guard: if the checkout itself failed there is no script to
        # source, and a second red step would only hide the real failure.
        if: always() && hashFiles('scripts/release-policy.sh') != ''
        env:
          DECISION: ${{ steps.policy.outputs.decision }}
          TOKEN_SOURCE: ${{ steps.release-token.outputs.source }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          PRS_CREATED: ${{ steps.release-please.outputs.prs_created }}
          RELEASE_PR: ${{ steps.release-please.outputs.pr }}
          CUT: ${{ steps.changelog.outputs.cut }}
          PROPOSED: ${{ steps.changelog.outputs.proposed }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/release-policy.sh
          source scripts/release-policy.sh
          {
            echo "### Release PR — PR #${PR_NUMBER:-<manual>}"
            echo
            case "${DECISION:-}" in
              skip-release)
                echo "Labels: \`$(policy_label_names "$PR_LABELS" | tr '\n' ' ' | sed -e 's/[[:space:]]*$//')\`"
                echo
                echo "**Release PR update skipped** — this PR carries the \`skip-release\` label."
                echo "No version is proposed; the changes will ride along with the next Release PR."
                ;;
              releasable)
                if [[ "$PRS_CREATED" == "true" ]]; then
                  echo "release-please created/updated the Release PR (token: \`${TOKEN_SOURCE:-unknown}\`)."
                else
                  echo "release-please ran (token: \`${TOKEN_SOURCE:-unknown}\`) but proposed no Release PR — the merged history holds no conventional commits to release."
                fi
                case "${CUT:-}" in
                  cut)
                    echo "Cut the \`## [${PROPOSED}]\` CHANGELOG section on \`release-please--branches--main\`."
                    ;;
                  already-cut)
                    echo "CHANGELOG.md already opens with \`## [${PROPOSED}]\` — nothing to cut."
                    ;;
                  none)
                    echo "No Release PR branch exists — no CHANGELOG cut was needed."
                    ;;
                  noop)
                    echo "The CHANGELOG cut produced no diff — nothing was committed."
                    ;;
                  *)
                    echo "No CHANGELOG cut was recorded."
                    ;;
                esac
                echo "Merge the Release PR to publish **v${PROPOSED:-<pending>}** through the Release workflow."
                ;;
              release-pr-merged)
                echo "Green no-op — the merged PR is the Release PR itself; the Release workflow publishes it."
                ;;
              manifests-merged)
                echo "Green no-op — the merged PR is a release-manifests sync; packaging-only by construction."
                ;;
              no-changes)
                echo "Green no-op — nothing changed since the latest release tag."
                ;;
              non-releasable)
                echo "Green no-op — only non-releasable paths changed (docs, .github, packaging, meta files); the path-based guard refused an empty release."
                ;;
              already-bumped)
                echo "Green no-op — Version.swift is ahead of the latest release; a release is pending."
                ;;
              behind-release)
                echo "Green no-op — Version.swift is behind the latest release; the version must be fixed through the Release PR."
                ;;
              no-release-yet)
                echo "Green no-op — no release is published yet; the first release is created manually."
                ;;
              at-cap)
                echo "Green no-op — the 0.0.x series reached its 0.0.100 automatic-bump cap."
                ;;
              *)
                echo "No decision was recorded (the run failed before the policy step finished)."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
