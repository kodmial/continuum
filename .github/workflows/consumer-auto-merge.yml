# Continuum reusable auto-merge: the single merge reconciler a consumer runs.
#
# This workflow owns exactly one decision -- may this pull request merge right
# now, and may this merge happen -- and it recomputes that from live repository
# state on every wake-up. Events are wake-ups, never inputs: a stale event can
# cost this workflow one no-op, never one wrong merge.
#
# Single owner, single flight
# ---------------------------
# Merge writes are the only writes in Continuum that cannot be replayed, so the
# controller is deliberately structured so that at most one reconciliation owns
# side effects at any moment, and so that ownership is not merely hoped for:
#
#   1. One repository-scoped concurrency group, constant for the repository and
#      derived from no event payload. Every trigger -- CI completion, a push,
#      a manual dispatch, the recovery schedule -- enters the same group, so
#      GitHub itself guarantees at most one run is executing.
#   2. `cancel-in-progress: false`. Cancelling a reconciler between its merge
#      write and its release handoff would drop a release on the floor, so a
#      newer wake-up queues behind the running one instead of replacing it. A
#      queued run is stale the moment it starts, and that is safe: step 3 makes
#      every write re-derive its own preconditions.
#   3. Every write revalidates the exact-head gates immediately before it acts.
#      The candidate loop's filters are a cheap pre-pass; the block immediately
#      before `pulls.merge` re-reads base freshness, exact-head CI, the
#      applicable blocking workflows and the review gate, and the merge itself
#      carries `sha: <head>` so GitHub performs the final compare-and-swap. A
#      reconciler that was queued behind another one therefore cannot merge
#      something that stopped being mergeable while it waited.
#
# The toggle posture comes from the versioned contract file, never from this
# workflow's caller. `review` and `release` are resolved once per run by the
# engine's own configuration resolver from the consumer's `.github/continuum.yml`
# and published to the job summary, so the entrypoint cannot disagree with the
# file a reviewer reads and there is no second place to declare the same switch.
on:
  workflow_call:
    inputs:
      engine_repository:
        description: >-
          Repository that hosts the Continuum release this run is part of. The
          caller already names it in its `uses:` line, and GitHub forbids an
          expression there, so the same literal is declared here as well. The
          commit still comes from the run (`job.workflow_sha`), never from an
          input, so a caller cannot run Continuum other than the release it
          pinned.
        type: string
        required: true
      config_path:
        type: string
        required: false
        default: .github/continuum.yml
        description: "Path to the validated Continuum v0.1 contract file in the base branch"
      base_branch:
        type: string
        required: false
        default: main
        description: "Branch pull requests are merged into"
      ci_workflow:
        type: string
        required: false
        default: CI
      additional_blocking_workflows:
        description: "Comma-separated optional workflow names; absent runs are treated as not applicable, present runs must succeed"
        type: string
        required: false
        default: ""
      review_status_context:
        type: string
        required: false
        default: continuum/review
      scheduler_workflow:
        type: string
        required: false
        default: continuum-scheduler.yml
      release_workflow:
        type: string
        required: false
        default: continuum-release.yml
    secrets:
      continuum_token:
        description: "Optional consumer-owned write token used when merge fan-out must trigger downstream workflows"
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  # Read-only. Resolves the two-toggle contract once per run so the privileged
  # job below consumes a value that was validated against the same
  # configuration a human reads, and so an invalid contract fails the entrypoint
  # loudly instead of quietly resolving to "both off".
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      review: ${{ steps.resolve.outputs.review }}
      release: ${{ steps.resolve.outputs.release }}
    env:
      # Read-only by construction: this job resolves a switch, and a job that
      # could write would not be able to say the merge posture it reports is the
      # one it read.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the pinned Continuum release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ job.workflow_sha }}
          path: .continuum-engine
          persist-credentials: false

      - name: Load Continuum engine
        shell: bash
        env:
          ENGINE_SHA: ${{ job.workflow_sha }}
          ENGINE_REPOSITORY: ${{ inputs.engine_repository }}
        run: |
          set -euo pipefail
          # `uses:` cannot take an expression, so the caller names this release
          # twice: once in the pin that selected this file, and once in
          # engine_repository. job.workflow_sha is the commit of this file as
          # the caller pinned it, so checking *that* out is what makes the
          # engine the release the consumer chose. Resolving it from a repository
          # named inside this file instead would quietly hand one repository's
          # scripts to a consumer who pinned another's.
          if ! printf '%s' "${ENGINE_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the pinned Continuum release must be a full commit sha, got '${ENGINE_SHA:-}'"
            exit 1
          fi
          if [[ -z "${ENGINE_REPOSITORY:-}" ]]; then
            echo "::error::engine_repository is unset; name the Continuum to run"
            exit 1
          fi
          root="$GITHUB_WORKSPACE/.continuum-engine"
          head="$(git -C .continuum-engine rev-parse HEAD)"
          if [[ "$head" != "$ENGINE_SHA" ]]; then
            echo "::error::engine checked out at $head, expected $ENGINE_SHA"
            exit 1
          fi
          for required in .github/scripts/conflict_repair.py .github/scripts/agent_workspace.py .github/scripts/opencode_runtime.py .github/scripts/opencode_instructions.py .github/agents/AGENTS.md src/continuum/cli.py; do
            [[ -f "$root/$required" ]] || {
              echo "::error::the pinned Continuum release is missing $required"
              exit 1
            }
          done
          echo "CONTINUUM_ENGINE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Resolve the Continuum contract
        id: resolve
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          DEFAULT_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # The contract is repository-controlled and versioned with the code, so
          # it is read from the base branch. A pull request does not get to
          # declare that review is off.
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/$CONFIG_PATH?ref=$DEFAULT_BRANCH" \
            --jq '.content' 2>/dev/null | base64 --decode > "$RUNNER_TEMP/continuum-contract.yml"; then
            printf '' > "$RUNNER_TEMP/continuum-contract.yml"
          fi
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/continuum_config.py" \
            --config "$RUNNER_TEMP/continuum-contract.yml" >/dev/null

  merge:
    needs: contract
    runs-on: ubuntu-latest
    concurrency:
      group: continuum-auto-merge-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Reconcile eligible PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REVIEW_ENABLED: ${{ needs.contract.outputs.review }}
          RELEASE_ENABLED: ${{ needs.contract.outputs.release }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          ADDITIONAL_BLOCKING_WORKFLOWS: ${{ inputs.additional_blocking_workflows }}
          REVIEW_CONTEXT: ${{ inputs.review_status_context }}
          SCHEDULER_WORKFLOW: ${{ inputs.scheduler_workflow }}
          RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
        with:
          github-token: ${{ secrets.continuum_token || github.token }}
          script: |
            const {owner, repo} = context.repo;
            const reviewEnabled = process.env.REVIEW_ENABLED === 'true';
            const releaseEnabled = process.env.RELEASE_ENABLED === 'true';
            const baseBranch = process.env.BASE_BRANCH;

            // Release handoff state is durable, not in-memory. A hand-off that
            // was recorded but not confirmed is re-driven on a later run, so a
            // dispatch that failed after the merge was durable is retried
            // instead of lost. `RELEASE_PENDING_ATTEMPTS` bounds that retry and
            // `RELEASE_RECOVERY_WINDOW_HOURS` bounds how far back recovery looks,
            // so a run cannot walk a repository's whole merge history.
            const RELEASE_PENDING_ATTEMPTS = 3;
            const RELEASE_RECOVERY_WINDOW_HOURS = 72;
            const releasePending = sha => `<!-- continuum-release-pending:${sha} -->`;
            const releaseDispatched = sha => `<!-- continuum-release-dispatched:${sha} -->`;

            async function baseFresh(sha) {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseBranch}...${sha}`,
              });
              return data.status === 'ahead' || data.status === 'identical';
            }

            async function latestWorkflowForHead(sha, workflowName) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {owner, repo, event:'pull_request', per_page:100}
              );
              const wanted = String(workflowName || '').trim();
              return runs
                .filter(r => {
                  if (r.head_sha !== sha) return false;
                  const path = String(r.path || '');
                  const basename = path.split('/').pop() || '';
                  return r.name === wanted || path === wanted || basename === wanted;
                })
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
            }

            async function currentHeadCiGreen(sha) {
              const run = await latestWorkflowForHead(sha, process.env.CI_WORKFLOW);
              return Boolean(
                run &&
                run.status === 'completed' &&
                run.conclusion === 'success'
              );
            }

            function additionalBlockingWorkflowNames() {
              return (process.env.ADDITIONAL_BLOCKING_WORKFLOWS || '')
                .split(',')
                .map(name => name.trim())
                .filter(Boolean);
            }

            async function optionalBlockingWorkflowsGreen(sha) {
              for (const workflowName of additionalBlockingWorkflowNames()) {
                const run = await latestWorkflowForHead(sha, workflowName);
                // Path-filtered / conditional gates are optional by presence:
                // if no run exists for this exact head, the gate is not
                // applicable. Once a run exists, it is blocking and must pass.
                if (!run) continue;
                if (run.status !== 'completed' || run.conclusion !== 'success') {
                  core.info(
                    `Head ${sha}: optional blocking workflow "${workflowName}" is ${run.status}/${run.conclusion || 'pending'}.`
                  );
                  return false;
                }
              }
              return true;
            }

            async function reviewGreen(sha) {
              if (!reviewEnabled) return true;
              const {data} = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha});
              const status = (data.statuses || []).find(s => s.context === process.env.REVIEW_CONTEXT);
              return Boolean(status && status.state === 'success');
            }

            async function commentBodies(number) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number: number, per_page: 100}
              );
              return comments.map(c => c.body || '');
            }

            // The consumer's release entrypoint receives the merge SHA, so a
            // re-driven hand-off is safe to be duplicated on its side; what
            // must not happen here is a hand-off that silently disappears. The
            // pending marker is written first and the confirmation only after a
            // dispatch returned, which is what makes "recorded but unconfirmed"
            // the recoverable state.
            async function dispatchRelease(number, sha) {
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `${releasePending(sha)}\nContinuum is handing ${sha} to ${process.env.RELEASE_WORKFLOW}.`
                });
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: process.env.RELEASE_WORKFLOW,
                  ref: baseBranch,
                  inputs: {source_sha: sha}
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: number,
                  body: `${releaseDispatched(sha)}\nContinuum dispatched the consumer release entrypoint for ${sha}.`
                });
                core.notice(`Handed ${sha} to ${process.env.RELEASE_WORKFLOW}.`);
                return true;
              } catch (e) {
                // The pending marker stays, so a later run re-drives this
                // hand-off instead of the merge silently losing its release.
                core.warning(`Release hand-off for ${sha} did not complete: ${e.message}`);
                return false;
              }
            }

            // Pure latest-state reconciliation of interrupted hand-offs: any
            // recently merged pull request that carries a pending marker and no
            // confirmation is re-driven, within the attempt budget. Nothing here
            // is remembered by this process, so a crashed or cancelled run costs
            // nothing, and a queued run behind another one simply finds the work
            // already confirmed.
            async function recoverReleaseHandoffs() {
              const cutoff = Date.now() - RELEASE_RECOVERY_WINDOW_HOURS * 3600 * 1000;
              const {data: merged} = await github.rest.pulls.list({
                owner, repo, state:'closed', base: baseBranch,
                sort:'updated', direction:'desc', per_page: 20
              });
              for (const pull of merged) {
                const sha = pull.merged_commit?.sha || '';
                if (!sha) continue;
                if (!pull.merged_at || new Date(pull.merged_at).getTime() < cutoff) continue;
                const bodies = await commentBodies(pull.number);
                const pending = bodies.filter(b => b.includes(releasePending(sha))).length;
                if (!pending) continue;
                if (bodies.some(b => b.includes(releaseDispatched(sha)))) continue;
                if (pending > RELEASE_PENDING_ATTEMPTS) {
                  core.warning(
                    `Release hand-off for PR #${pull.number} (${sha}) exhausted ${RELEASE_PENDING_ATTEMPTS} attempts; not retrying.`
                  );
                  continue;
                }
                await dispatchRelease(pull.number, sha);
              }
            }

            if (releaseEnabled) await recoverReleaseHandoffs();

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state:'open', base: baseBranch, per_page:100
            });

            for (const listed of prs) {
              if (listed.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!listed.head.ref.startsWith('opencode/')) continue;
              const labels = new Set((listed.labels || []).map(x => x.name));
              if (labels.has('no-auto-merge')) continue;

              if (!(await baseFresh(listed.head.sha))) {
                core.info(`PR #${listed.number}: stale against current ${baseBranch}; branch sync/repair must run first.`);
                continue;
              }
              if (!(await currentHeadCiGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: current-head CI is not green.`);
                continue;
              }
              if (!(await optionalBlockingWorkflowsGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: an applicable blocking workflow is not green.`);
                continue;
              }
              if (!(await reviewGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: review gate is not green.`);
                continue;
              }

              const {data: pr} = await github.rest.pulls.get({
                owner, repo, pull_number:listed.number
              });
              if (pr.mergeable == null) {
                core.info(`PR #${pr.number}: mergeability still computing.`);
                continue;
              }
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                core.info(`PR #${pr.number}: conflict; repair controller owns it.`);
                continue;
              }

              // Re-check immediately before the write. If another PR merged
              // earlier in this same run, every sibling branch is stale now.
              if (!(await baseFresh(pr.head.sha))) {
                core.info(`PR #${pr.number}: ${baseBranch} advanced before merge; branch sync/repair must run first.`);
                continue;
              }
              if (!(await currentHeadCiGreen(pr.head.sha)) ||
                  !(await optionalBlockingWorkflowsGreen(pr.head.sha)) ||
                  !(await reviewGreen(pr.head.sha))) {
                core.info(`PR #${pr.number}: a merge gate changed before the write; skipping.`);
                continue;
              }

              const result = await github.rest.pulls.merge({
                owner, repo, pull_number:pr.number,
                merge_method:'squash',
                commit_title:pr.title,
                sha:pr.head.sha
              });
              if (!result.data.merged) {
                core.warning(`PR #${pr.number}: merge refused: ${result.data.message}`);
                continue;
              }

              const match = pr.head.ref.match(/^opencode\/issue(\d+)-/);
              if (match) {
                const issue = Number(match[1]);
                try {
                  const {data: sourceIssue} = await github.rest.issues.get({
                    owner, repo, issue_number:issue
                  });
                  if (sourceIssue.state !== 'closed') {
                    await github.rest.issues.update({
                      owner, repo, issue_number:issue,
                      state:'closed', state_reason:'completed'
                    });
                  } else {
                    core.info(`Issue #${issue} is already closed; merge finalization is converged.`);
                  }
                } catch (e) {
                  // The merge is already durable. Bookkeeping must be
                  // retryable/observable, never rewrite a successful merge as
                  // a failed controller outcome.
                  core.warning(`Could not finalize source issue #${issue}: ${e.message}`);
                }
              }

              for (const label of ['automation:in-progress','opencode-ci-repair','opencode-conflict-repair']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number:pr.number, name:label
                  });
                } catch (e) {
                  if (e.status !== 404) core.warning(`Could not remove ${label}: ${e.message}`);
                }
              }

              core.notice(`Merged PR #${pr.number} at ${result.data.sha}.`);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id:process.env.SCHEDULER_WORKFLOW,
                  ref: baseBranch
                });
              } catch (e) {
                core.warning(`Could not wake scheduler: ${e.message}`);
              }

              if (releaseEnabled) {
                await dispatchRelease(pr.number, result.data.sha);
              }
            }
