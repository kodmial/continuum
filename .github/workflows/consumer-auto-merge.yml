name: Continuum reusable auto-merge

on:
  workflow_call:
    inputs:
      review:
        type: boolean
        required: false
        default: false
      release:
        type: boolean
        required: false
        default: false
      ci_workflow:
        type: string
        required: false
        default: CI
      additional_blocking_workflows:
        description: "Comma-separated optional workflow names; absent runs are treated as not applicable, present runs must succeed"
        type: string
        required: false
        default: ""
      review_status_context:
        type: string
        required: false
        default: continuum/review
      review_queue_workflow:
        description: "The consumer's review queue entry workflow, woken when a green pull request's review gate is closed"
        type: string
        required: false
        default: review-queue.yml
      scheduler_workflow:
        type: string
        required: false
        default: continuum-scheduler.yml
      release_workflow:
        type: string
        required: false
        default: continuum-release.yml

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile eligible PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REVIEW_ENABLED: ${{ inputs.review }}
          RELEASE_ENABLED: ${{ inputs.release }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
          ADDITIONAL_BLOCKING_WORKFLOWS: ${{ inputs.additional_blocking_workflows }}
          REVIEW_CONTEXT: ${{ inputs.review_status_context }}
          REVIEW_QUEUE_WORKFLOW: ${{ inputs.review_queue_workflow }}
          SCHEDULER_WORKFLOW: ${{ inputs.scheduler_workflow }}
          RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner, repo} = context.repo;
            const reviewEnabled = process.env.REVIEW_ENABLED === 'true';
            const releaseEnabled = process.env.RELEASE_ENABLED === 'true';

            async function baseFresh(sha) {
              const {data} = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `main...${sha}`,
              });
              return data.status === 'ahead' || data.status === 'identical';
            }

            async function latestWorkflowForHead(sha, workflowName) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {owner, repo, event:'pull_request', per_page:100}
              );
              return runs
                .filter(r => r.name === workflowName && r.head_sha === sha)
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
            }

            async function currentHeadCiGreen(sha) {
              const run = await latestWorkflowForHead(sha, process.env.CI_WORKFLOW);
              return Boolean(
                run &&
                run.status === 'completed' &&
                run.conclusion === 'success'
              );
            }

            function additionalBlockingWorkflowNames() {
              return (process.env.ADDITIONAL_BLOCKING_WORKFLOWS || '')
                .split(',')
                .map(name => name.trim())
                .filter(Boolean);
            }

            async function optionalBlockingWorkflowsGreen(sha) {
              for (const workflowName of additionalBlockingWorkflowNames()) {
                const run = await latestWorkflowForHead(sha, workflowName);
                // Path-filtered / conditional gates are optional by presence:
                // if no run exists for this exact head, the gate is not
                // applicable. Once a run exists, it is blocking and must pass.
                if (!run) continue;
                if (run.status !== 'completed' || run.conclusion !== 'success') {
                  core.info(
                    `Head ${sha}: optional blocking workflow "${workflowName}" is ${run.status}/${run.conclusion || 'pending'}.`
                  );
                  return false;
                }
              }
              return true;
            }

            async function reviewGreen(sha) {
              if (!reviewEnabled) return true;
              const {data} = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha});
              const status = (data.statuses || []).find(s => s.context === process.env.REVIEW_CONTEXT);
              return Boolean(status && status.state === 'success');
            }

            // A green pull request with a closed review gate is exactly the case
            // where nothing merges, and a head with no approval and no further
            // change emits no event that would otherwise start the serialized
            // review queue. This reconciliation is the only place that sees the
            // state, so it wakes the queue once. It is a wake-up and not an
            // authorization: the queue recomputes eligibility from live state
            // before spending shared quota.
            let queueWoken = false;
            async function wakeReviewQueue(number) {
              const workflow = process.env.REVIEW_QUEUE_WORKFLOW;
              if (queueWoken || !workflow) return;
              if (!/^[A-Za-z0-9._/-]+$/.test(workflow)) {
                core.warning(`Ignoring an invalid review queue workflow name: ${workflow}`);
                return;
              }
              queueWoken = true;
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: workflow,
                  ref: context.payload.repository?.default_branch || 'main',
                  inputs: {reason: `auto-merge found a green pull request with a closed review gate: ${number}`}
                });
                core.info(`PR #${number}: review gate is closed; woke ${workflow}.`);
              } catch (err) {
                // The queue's own event coverage and schedule remain able to
                // make progress, so a refused dispatch must not fail this run.
                core.warning(`Could not wake ${workflow}: ${err.message}`);
              }
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state:'open', base:'main', per_page:100
            });

            for (const listed of prs) {
              if (listed.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              if (!listed.head.ref.startsWith('opencode/')) continue;
              const labels = new Set((listed.labels || []).map(x => x.name));
              if (labels.has('no-auto-merge')) continue;

              if (!(await baseFresh(listed.head.sha))) {
                core.info(`PR #${listed.number}: stale against current main; branch sync/repair must run first.`);
                continue;
              }
              if (!(await currentHeadCiGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: current-head CI is not green.`);
                continue;
              }
              if (!(await optionalBlockingWorkflowsGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: an applicable blocking workflow is not green.`);
                continue;
              }
              if (!(await reviewGreen(listed.head.sha))) {
                core.info(`PR #${listed.number}: review gate is not green.`);
                await wakeReviewQueue(listed.number);
                continue;
              }

              const {data: pr} = await github.rest.pulls.get({
                owner, repo, pull_number:listed.number
              });
              if (pr.mergeable == null) {
                core.info(`PR #${pr.number}: mergeability still computing.`);
                continue;
              }
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                core.info(`PR #${pr.number}: conflict; repair controller owns it.`);
                continue;
              }

              // Re-check immediately before the write. If another PR merged
              // earlier in this same run, every sibling branch is stale now.
              if (!(await baseFresh(pr.head.sha))) {
                core.info(`PR #${pr.number}: main advanced before merge; branch sync/repair must run first.`);
                continue;
              }
              if (!(await currentHeadCiGreen(pr.head.sha)) ||
                  !(await optionalBlockingWorkflowsGreen(pr.head.sha)) ||
                  !(await reviewGreen(pr.head.sha))) {
                core.info(`PR #${pr.number}: a merge gate changed before the write; skipping.`);
                continue;
              }

              const result = await github.rest.pulls.merge({
                owner, repo, pull_number:pr.number,
                merge_method:'squash',
                commit_title:pr.title,
                sha:pr.head.sha
              });
              if (!result.data.merged) {
                core.warning(`PR #${pr.number}: merge refused: ${result.data.message}`);
                continue;
              }

              const match = pr.head.ref.match(/^opencode\/issue(\d+)-/);
              if (match) {
                const issue = Number(match[1]);
                try {
                  const {data: sourceIssue} = await github.rest.issues.get({
                    owner, repo, issue_number:issue
                  });
                  if (sourceIssue.state !== 'closed') {
                    await github.rest.issues.update({
                      owner, repo, issue_number:issue,
                      state:'closed', state_reason:'completed'
                    });
                  } else {
                    core.info(`Issue #${issue} is already closed; merge finalization is converged.`);
                  }
                } catch (e) {
                  // The merge is already durable. Bookkeeping must be
                  // retryable/observable, never rewrite a successful merge as
                  // a failed controller outcome.
                  core.warning(`Could not finalize source issue #${issue}: ${e.message}`);
                }
              }

              for (const label of ['automation:in-progress','opencode-ci-repair','opencode-conflict-repair']) {
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number:pr.number, name:label
                  });
                } catch (e) {
                  if (e.status !== 404) core.warning(`Could not remove ${label}: ${e.message}`);
                }
              }

              core.notice(`Merged PR #${pr.number} at ${result.data.sha}.`);

              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id:process.env.SCHEDULER_WORKFLOW,
                  ref:'main'
                });
              } catch (e) {
                core.warning(`Could not wake scheduler: ${e.message}`);
              }

              if (releaseEnabled) {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id:process.env.RELEASE_WORKFLOW,
                  ref:'main',
                  inputs:{source_sha:result.data.sha}
                });
              }
            }
