name: Continuum reusable child pull-request review

on:
  workflow_call:
    inputs:
      child_id:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      model:
        type: string
        required: false
        default: opencode/muse-spark-1.3-contributor-free
      max_review_passes:
        type: number
        required: false
        default: 3
      python_version:
        description: Python version available to the child validation gate
        type: string
        required: false
        default: '3.12'
      engine_ref:
        type: string
        required: false
        default: main
      image_digest:
        description: Per-profile prepared-image digest for this review's runtime profile. Takes precedence over the vars.CONTINUUM_IMAGE_DIGEST repository variable when set; multi-profile consumers pass one digest per profile job.
        type: string
        required: false
        default: ''
    secrets:
      CHILD_RUNTIME_TOKEN:
        required: true
      CHILD_RUNTIME_REPOSITORIES:
        required: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: continuum-subtask-pr-review-${{ inputs.pr_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      CHILD_REPOSITORIES: ${{ secrets.CHILD_RUNTIME_REPOSITORIES }}
      CHILD_ID: ${{ inputs.child_id }}
      PR_NUMBER: ${{ inputs.pr_number }}
      OPENCODE_MODEL: ${{ inputs.model }}
      MAX_REVIEW_PASSES: ${{ inputs.max_review_passes }}
    steps:
      - name: Checkout parent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Continuum engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.engine_ref }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Review and repair owner-created child pull request
        shell: bash
        env:
          CONTINUUM_IMAGE_DIGEST: ${{ inputs.image_digest || vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid pull request number."; exit 2; }

          export CONTINUUM_ENGINE_ROOT="$GITHUB_WORKSPACE/.continuum-engine"
          export PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          child_repo="$(
            PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES"               bash "$resolver" resolve "$CHILD_ID"
          )"
          PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES"             bash "$resolver" verify "$CHILD_ID" "$child_repo" >/dev/null
          validation_script="$(
            PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES"               bash "$resolver" validation "$child_repo"
          )"

          pr_json="$(gh api "repos/$child_repo/pulls/$PR_NUMBER" 2>/dev/null)"
          state="$(jq -r '.state' <<<"$pr_json")"
          merged_at="$(jq -r '.merged_at // ""' <<<"$pr_json")"
          [[ -z "$merged_at" ]] || { echo "PR #$PR_NUMBER is already merged."; exit 0; }
          [[ "$state" == "open" ]] || { echo "PR #$PR_NUMBER is not open."; exit 0; }
          [[ "$(jq -r '.draft // false' <<<"$pr_json")" == "false" ]] || { echo "PR #$PR_NUMBER is draft."; exit 0; }

          child_owner="${child_repo%%/*}"
          author="$(jq -r '.user.login // ""' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          [[ "$author" == "$child_owner" && "$head_repo" == "$child_repo" ]] || {
            echo "PR #$PR_NUMBER is not an owner-created same-repository pull request; ignoring."
            exit 0
          }

          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          title="$(jq -r '.title' <<<"$pr_json")"
          body="$(jq -r '.body // ""' <<<"$pr_json")"

          # Delegated task branches already have their own stronger task review
          # contract. This workflow is only for ordinary owner-created PRs.
          if [[ "$head_ref" == continuum-child/task-* || "$head_ref" == runtime-worker/task-* ]]; then
            echo "PR #$PR_NUMBER is automation-owned delegated task work; task review owns it."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$child_repo"             --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-started -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' "Independent external review/repair started for owner-created PR #$PR_NUMBER.")"             >/dev/null 2>&1 || true

          workdir="$RUNNER_TEMP/continuum-child-pr-review"
          transcript="$RUNNER_TEMP/continuum-child-pr-review.log"
          review_file="$RUNNER_TEMP/continuum-child-pr-review-result.md"
          validation_log="$RUNNER_TEMP/continuum-child-pr-validation.log"

          gh auth setup-git >/dev/null 2>&1
          rm -rf "$workdir"
          gh repo clone "$child_repo" "$workdir" -- --quiet >/dev/null 2>&1
          cd "$workdir"
          git fetch origin "$base_ref" "$head_ref" --quiet >/dev/null 2>&1
          git checkout -B "$head_ref" "origin/$head_ref" >/dev/null 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-edit "origin/$base_ref" >/dev/null 2>&1
          base_sync_rc=$?
          set -e
          if [[ "$base_sync_rc" -ne 0 ]]; then
            echo "PR #$PR_NUMBER has conflicts with $base_ref; review agent will repair them."
          fi

          trusted_validation=""
          run_validation() {
            [[ -n "$trusted_validation" ]] || return 0
            env -i PATH="$PATH" HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-C.UTF-8}" CI=true               bash "$trusted_validation" >"$validation_log" 2>&1
          }

          initial_validation="not configured"
          if [[ -n "$validation_script" ]]; then
            if ! git cat-file -e "origin/$base_ref:$validation_script" 2>/dev/null; then
              gh pr comment "$PR_NUMBER" --repo "$child_repo"                 --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-validation-missing -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' 'Configured delegated validation gate is missing from the base branch.')"                 >/dev/null 2>&1 || true
              exit 5
            fi
            trusted_validation="$RUNNER_TEMP/continuum-child-pr-validation.sh"
            git show "origin/$base_ref:$validation_script" >"$trusted_validation"
            chmod 700 "$trusted_validation"
            set +e
            run_validation
            validation_rc=$?
            set -e
            if [[ "$validation_rc" -eq 0 ]]; then
              initial_validation="passed"
            else
              initial_validation="failed; diagnostics are available only in the local runner at $validation_log"
            fi
          fi

          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # OpenCode 1.18.34. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `command -v opencode` and the
          # exact version takes the hit path with zero downloads. A cache
          # failure (empty or malformed digest) falls back to deterministic
          # reconstruction below, never failing closed. The digest is bound
          # to the runtime by the image-digest stamp
          # ($HOME/.opencode/image-digest) recorded by the validated image
          # build: a stale or unrelated
          # opencode 1.18.34 binary whose stamp does not match the digest
          # cannot take the hit path. Deterministic reconstruction below
          # never records the stamp, so a later job cannot take the warm
          # path from a reconstruction self-stamp.
          # The digest is content-addressed per runtime profile (Continuum
          # ref, profile digest including os/arch, base image, toolchain):
          # the `image_digest` input carries the digest for this review's
          # profile (ubuntu-latest / linux-x64 here) and falls back to the
          # `vars.CONTINUUM_IMAGE_DIGEST` repository variable when unset.
          # Multi-profile consumers pass one digest per profile job (each
          # matrix leg wires its own profile digest into `image_digest`)
          # instead of publishing a single global value that a second
          # profile promotion would evict.
          export PATH="$HOME/.opencode/bin:$PATH"
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v opencode >/dev/null 2>&1 && opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"; then
            echo "prepared-runtime hit: opencode 1.18.34 already present (image digest ${CONTINUUM_IMAGE_DIGEST} validated against ${STAMP_FILE})."
          else
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34 >/dev/null 2>&1; then
              # Deterministic reconstruction never records the stamp: only
              # the validated image build (or a provider cache restore of
              # it) proves golden-image provenance.
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              gh pr comment "$PR_NUMBER" --repo "$child_repo"                 --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-infra -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' 'Review could not install the agent runtime; dispatcher may retry.')"                 >/dev/null 2>&1 || true
              exit 4
            fi
            sleep $((attempt * 5))
          done
          fi
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          command -v opencode >/dev/null 2>&1
          opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"

          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" install             --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"

          prompt="$RUNNER_TEMP/continuum-child-pr-review.txt"
          cat >"$prompt" <<EOF
          Independently review and, if necessary, repair owner-created pull request #$PR_NUMBER in $child_repo.

          Rules:
          - Treat the PR title/body and the actual diff against origin/$base_ref as the intended change.
          - Do not assume prior tests or the author's summary are correct.
          - Resolve all merge conflicts with current origin/$base_ref while preserving the intended behavior from both sides.
          - Inspect every behaviorally relevant change, including tests and configuration.
          - Run relevant tests and the repository's deterministic validation gate.
          - Fix defects directly on this existing PR branch.
          - Do not create another branch or another pull request.
          - Never expose credentials or secret values.
          - Do not upload child source, diffs, logs, or transcripts to the public parent repository.
          - You may make local commits. Do not push; the outer workflow pushes the branch.
          - Before finishing, create or replace exactly: $review_file
          - Record findings, repairs, verification and remaining risks.
          - End that file with a standalone line exactly: Review: PASS
          - Write Review: PASS only when this PR is safe to merge and satisfies its stated intent.
          - The deterministic validation gate is loaded from the trusted base branch and must not be edited or weakened.
          - Initial validation state: $initial_validation
          - If it failed, inspect local diagnostics at: $validation_log

          --- PR TITLE ---
          $title

          --- PR BODY ---
          $body
          EOF

          accepted=false
          for pass in $(seq 1 "$MAX_REVIEW_PASSES"); do
            pass_prompt="$RUNNER_TEMP/continuum-child-pr-review-pass-$pass.txt"
            cp "$prompt" "$pass_prompt"
            if [[ "$pass" -gt 1 ]]; then
              cat >>"$pass_prompt" <<EOF

          Continuation review pass $pass:
          - Continue from the existing working tree.
          - Repair remaining blockers, rerun verification, and update $review_file.
          EOF
            fi

            python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/opencode_instructions.py" verify               --source "$CONTINUUM_ENGINE_ROOT/.github/agents/AGENTS.md"
            rm -f "$review_file"
            set +e
            opencode run --auto --model "$OPENCODE_MODEL" "$(cat "$pass_prompt")" >"$transcript" 2>&1
            rc=$?
            set -e

            if [[ -f "$review_file" ]] && grep -qx 'Review: PASS' "$review_file"; then
              set +e
              run_validation
              validation_rc=$?
              set -e
              if [[ "$validation_rc" -eq 0 ]] && ! git diff --name-only --diff-filter=U | grep -q .; then
                accepted=true
                break
              fi
            fi
            echo "Manual child PR #$PR_NUMBER review pass $pass incomplete (agent rc=$rc); continuing."
          done

          if [[ "$accepted" != true ]]; then
            gh pr comment "$PR_NUMBER" --repo "$child_repo"               --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-needs-retry -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' 'Independent review did not reach verified acceptance; the PR remains open for automatic retry.')"               >/dev/null 2>&1 || true
            exit 30
          fi

          if git diff --no-ext-diff "origin/$base_ref"...HEAD -- . |              grep -Eiq '(github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|rnd_[A-Za-z0-9]+)'; then
            gh pr comment "$PR_NUMBER" --repo "$child_repo"               --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-security -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' 'Token-like material detected; merge blocked.')"               >/dev/null 2>&1 || true
            exit 31
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: repair PR #$PR_NUMBER after independent review" >/dev/null 2>&1
          fi
          if [[ "$(git rev-list --count "origin/$head_ref"..HEAD)" -gt 0 ]]; then
            git push origin "HEAD:$head_ref" >/dev/null 2>&1
          fi

          merge_ok=false
          for merge_attempt in 1 2 3; do
            live_pr="$(gh pr view "$PR_NUMBER" --repo "$child_repo"               --json state,mergedAt,headRefOid 2>/dev/null || true)"
            if [[ -n "$live_pr" && "$(jq -r '.mergedAt // ""' <<<"$live_pr")" != "" ]]; then
              merge_ok=true
              break
            fi
            [[ "$(jq -r '.state // ""' <<<"$live_pr")" == "OPEN" ]] || {
              echo "PR #$PR_NUMBER closed before merge; stopping."
              exit 0
            }

            set +e
            gh pr merge "$PR_NUMBER" --repo "$child_repo" --squash --delete-branch >/dev/null 2>&1
            merge_rc=$?
            if [[ "$merge_rc" -ne 0 ]]; then
              gh pr merge "$PR_NUMBER" --repo "$child_repo" --squash --delete-branch --admin >/dev/null 2>&1
              merge_rc=$?
            fi
            set -e
            if [[ "$merge_rc" -eq 0 ]]; then
              merge_ok=true
              break
            fi

            live_head="$(jq -r '.headRefOid // ""' <<<"$live_pr")"
            if [[ -n "$live_head" ]]; then
              gh api --method PUT "repos/$child_repo/pulls/$PR_NUMBER/update-branch"                 -f "expected_head_sha=$live_head" >/dev/null 2>&1 || true
            fi
            sleep $((merge_attempt * 2))
          done

          if [[ "$merge_ok" != true ]]; then
            gh pr comment "$PR_NUMBER" --repo "$child_repo"               --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-merge-retry -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' 'Review passed, but merge was deferred; dispatcher will retry.')"               >/dev/null 2>&1 || true
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$child_repo"             --body "$(printf '%s\n%s\n%s\n%s' '<!-- continuum-child-pr-review-merged -->' '⚡ **Continuum · delegation-pr-review**' '<!-- continuum-origin role=continuum component=delegation-pr-review -->' "Independent review passed and this owner-created PR was merged.")"             >/dev/null 2>&1 || true
          echo "SubTask PR review #$PR_NUMBER reviewed and merged."
