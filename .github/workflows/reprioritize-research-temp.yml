name: Reprioritize non-MVP research

on:
  push:
    branches: [main]

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  reprioritize:
    if: github.event.head_commit.message == 'reprioritize-research-for-mvp'
    runs-on: ubuntu-latest
    steps:
      - name: Free one WIP slot for PR-Agent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/36431538417/cancel" >/dev/null || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/7/labels/priority:p0" >/dev/null 2>&1 || true
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/7/labels" -f 'labels[]=priority:p2' >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/7/labels/automation:in-progress" >/dev/null 2>&1 || true
          gh workflow run issue-scheduler.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Research deferred; scheduler awakened for MVP-critical work."
