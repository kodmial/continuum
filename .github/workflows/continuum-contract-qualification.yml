name: Contract qualification

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying this contract
        required: false
        type: string
        default: main
      pr_number:
        description: Optional pull request number for manual qualification
        required: false
        type: string
        default: ''
      head_sha:
        description: Optional exact HEAD SHA to qualify instead of the PR head
        required: false
        type: string
        default: ''
      mode:
        description: >-
          Qualification mode, verify for PR evidence or canary for the live main probe
        required: false
        type: string
        default: verify
      timeout_minutes:
        description: Optional timeout override for the qualification job
        required: false
        type: string
        default: ''
      status_context:
        description: Commit-status context; empty uses CONTINUUM_CONTRACT_STATUS_CONTEXT
        required: false
        type: string
        default: ''
      publish_status:
        description: Empty uses CONTINUUM_PUBLISH_STATUS then true
        required: false
        type: string
        default: ''
    secrets:
      TAP_PAT:
        description: >-
          Classic PAT used only by the live-canary job to read the canary
          issue and dispatch bounded recovery; verification mode does not use it.
        required: false

permissions: {}

jobs:
  qualify:
    name: Qualify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.CONTINUUM_CONTRACT_TIMEOUT_MINUTES || '15') }}

    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            let sha = context.sha;
            let ref = context.ref;
            let prNumber = '';
            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
              ref = context.payload.pull_request.head.ref;
              prNumber = String(context.payload.pull_request.number);
            } else if (process.env.MANUAL_PR_NUMBER) {
              prNumber = process.env.MANUAL_PR_NUMBER;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              sha = pr.head.sha;
              ref = pr.head.ref;
            }
            if (process.env.MANUAL_HEAD_SHA) {
              sha = String(process.env.MANUAL_HEAD_SHA).trim();
            }
            if (!/^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$/.test(sha)) {
              core.setFailed('Contract qualification requires a full HEAD SHA.');
              return;
            }
            core.setOutput('sha', sha.toLowerCase());
            core.setOutput('ref', ref);
            core.setOutput('pr_number', prNumber);

      - name: Mark contract qualification pending
        # A fork pull request receives a read-only GITHUB_TOKEN, so the status
        # write would fail before checkout. Qualification still runs; only the
        # write is skipped.
        if: >-
          fromJSON(inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true') &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_CONTRACT_STATUS_CONTEXT || 'continuum/contract-qualification' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Contract qualification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'

      - name: Install Python qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Run Layer 1 regression gate on the exact HEAD
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-continuum.sh
          echo "regression=pass" >> "$GITHUB_OUTPUT"

      - name: Run Layer 2 lifecycle integration probe
        id: lifecycle
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Observe the real reservations this repository holds before the
          # deterministic invariants below. A stranded
          # `automation:in-progress` label is a live scheduler defect and must
          # fail qualification even when every constructed assertion passes.
          observation_dir="$RUNNER_TEMP/continuum-observation"
          mkdir -p "$observation_dir"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automation:in-progress --limit 200 \
            --json number,state,labels,createdAt,updatedAt,closedAt,body,title \
            > "$observation_dir/issues.json"
          gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name \
            > "$observation_dir/runs.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 \
            --json number,state,body,title,headRefName,updatedAt,mergedAt,reviewDecision \
            > "$observation_dir/pulls.json"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src OBSERVATION_DIR="$observation_dir" \
            python3 - <<'PY'
          import json
          import os
          from continuum import contract_observation as observation
          from continuum import contract_qualification as contract

          root = os.environ["OBSERVATION_DIR"]
          def load(name):
              with open(os.path.join(root, name), encoding="utf-8") as handle:
                  return json.load(handle)

          issues = observation.select_observations(load("issues.json"))
          runs = load("runs.json")
          pulls = load("pulls.json")
          reservations = [
              observation.observe_reservation(issue, runs, pulls)
              for issue in issues
          ]
          stranded = []
          for reservation in reservations:
              verdict = contract.evaluate_reservation_liveness(reservation)
              print(
                  "observed reservation issue={} label={} run={} pr={} verdict={} ({})".format(
                      reservation.issue_number,
                      reservation.has_label,
                      reservation.live_run_id,
                      reservation.live_pr_number,
                      verdict.outcome,
                      verdict.reason,
                  )
              )
              if verdict.outcome == contract.ERROR:
                  stranded.append(reservation.issue_number)
          assert not stranded, "stranded automation:in-progress reservation(s): %s" % stranded
          print("Observed %d real reservation(s); none stranded." % len(reservations))
          PY
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python3 - <<'PY'
          import os
          from continuum import contract_qualification as contract
          # A deliberately broken lifecycle change is rejected: red/stale
          # evidence on the exact HEAD never passes Layer 1.
          head = os.environ["TARGET_SHA"].strip().lower()
          assert contract.is_full_sha(head), "target must be a full HEAD SHA"
          broken = [
              contract.GateEvidence("CI", head, "completed", "failure"),
              contract.GateEvidence(contract.CONTRACT_WORKFLOW_NAME, head, "completed", "success"),
          ]
          assert contract.evaluate_regression_gate(head, broken).outcome == contract.GATE_BLOCK
          # A deliberately stranded automation:in-progress reservation is
          # detected: a label with no live run/PR/lease is an error, while a
          # stale lease and terminal workers route to bounded recovery.
          stranded = contract.evaluate_reservation_liveness(
              contract.Reservation(issue_number=1, has_label=True)
          )
          assert stranded.outcome == "error", stranded
          stale = contract.evaluate_reservation_liveness(
              contract.Reservation(issue_number=1, has_label=True, live_lease=True, lease_stale=True)
          )
          assert stale.outcome == "recover", stale
          for state in ("completed", "failed", "cancelled"):
              verdict = contract.evaluate_reservation_liveness(
                  contract.Reservation(issue_number=1, has_label=True, live_run_id=9, worker_state=state)
              )
              assert verdict.outcome == "recover", (state, verdict)
          # Duplicate wakeups coalesce instead of duplicating work.
          assert contract.coalesce_wakeups(["a", "A", "b", "a"]) == ["a", "b"]
          # WAIT (backpressure) is distinguishable from ERROR.
          assert contract.classify_wait_vs_error("running") == contract.WAIT
          assert contract.classify_wait_vs_error("failed") == contract.ERROR
          # The watchdog moves stalled work forward without human intervention.
          assert contract.watchdog_advance(stalled=True, attempt=0).action == "retry"
          # Exact-HEAD evidence is required before merge on both merge paths.
          for provider in ("none", "coderabbit", "pr-agent"):
              allowed, _ = contract.merge_path_allowed(head, [], provider)
              assert not allowed, provider
          print("Layer 2 lifecycle probe passed for HEAD", head)
          PY

      - name: Publish contract qualification result
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_CONTRACT_STATUS_CONTEXT || 'continuum/contract-qualification' }}
          PUBLISH_STATUS: ${{ inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true' }}
          STATUS_ELIGIBLE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          script: |
            const passed = process.env.REGRESSION_OUTCOME === 'success' && process.env.LIFECYCLE_OUTCOME === 'success';
            const state = passed ? 'success' : 'failure';
            // Fork PRs are read-only; the qualification verdict still fails
            // the job, but no commit status can be written.
            if (process.env.PUBLISH_STATUS === 'true' && process.env.STATUS_ELIGIBLE === 'true') {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state,
                context: process.env.STATUS_CONTEXT,
                description: passed ? 'Contract qualification passed' : 'Contract qualification failed',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
            if (!passed) {
              core.setFailed('Contract qualification failed for the exact HEAD.');
            }

  canary:
    name: Live canary
    # Layer 3 observes a real canary task on current main. It runs in its own
    # job because it needs issue writes (recovery comment/dispatch) while the
    # qualify job checks out and executes untrusted PR code and must not hold
    # them.
    if: inputs.mode == 'canary'
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.CONTINUUM_CONTRACT_TIMEOUT_MINUTES || '15') }}

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            let sha = context.sha;
            if (process.env.MANUAL_HEAD_SHA) {
              sha = String(process.env.MANUAL_HEAD_SHA).trim();
            }
            if (!/^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$/.test(sha)) {
              core.setFailed('Live canary requires a full HEAD SHA.');
              return;
            }
            core.setOutput('sha', sha.toLowerCase());

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3c910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'

      - name: Observe the live canary task
        id: canary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CANARY_ISSUE: ${{ vars.CONTINUUM_CANARY_ISSUE }}
          SCHEDULER_WORKFLOW: ${{ vars.CONTINUUM_SCHEDULER_WORKFLOW || 'automation.yml' }}
        run: |
          set -euo pipefail
          if ! [[ "${CANARY_ISSUE:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::CONTINUUM_CANARY_ISSUE must name the live canary issue; refusing to report canary success without an observed task."
            exit 1
          fi
          observation_dir="$RUNNER_TEMP/continuum-canary"
          mkdir -p "$observation_dir"
          gh issue view "$CANARY_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json number,state,labels,createdAt,updatedAt,closedAt,body,title \
            > "$observation_dir/issue.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$CANARY_ISSUE/comments?per_page=100" \
            | jq -s 'add // []' > "$observation_dir/comments.json"
          gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name \
            > "$observation_dir/runs.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 \
            --json number,state,body,title,headRefName,updatedAt,mergedAt,reviewDecision \
            > "$observation_dir/pulls.json"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src OBSERVATION_DIR="$observation_dir" \
            CANARY_ISSUE="$CANARY_ISSUE" SCHEDULER_WORKFLOW="$SCHEDULER_WORKFLOW" \
            python3 - <<'PY'
          import json
          import os
          import subprocess
          from continuum import contract_observation as observation
          from continuum import contract_qualification as contract

          root = os.environ["OBSERVATION_DIR"]
          def load(name):
              with open(os.path.join(root, name), encoding="utf-8") as handle:
                  return json.load(handle)

          issue_number = int(os.environ["CANARY_ISSUE"])
          observed = observation.observe_canary(
              load("issue.json"),
              runs=load("runs.json"),
              pull_requests=load("pulls.json"),
              comments=load("comments.json"),
              canary_id="canary-main",
          )
          if observed.failure:
              raise SystemExit("live canary failed: " + observed.failure)
          if observed.completed:
              print("Live canary issue #%d completed with a merged implementation PR." % issue_number)
              raise SystemExit(0)
          verdict = contract.evaluate_canary(observed.state)
          print("Observed live canary: %s -> %s (%s)" % (observed.state, verdict.outcome, verdict.detail))
          if verdict.outcome == contract.CANARY_PROGRESS:
              raise SystemExit(0)
          if verdict.outcome == contract.CANARY_STALLED_FAILED:
              raise SystemExit("live canary stalled and exhausted its bounded recovery budget: " + verdict.detail)
          # Bounded autonomous recovery: wake the scheduler that owns the
          # canary reservation and record the attempt on the issue. The next
          # scheduled canary run re-observes the real stage.
          attempt = int(observed.state.recovery_attempts) + 1
          subprocess.run(
              [
                  "gh", "workflow", "run", os.environ["SCHEDULER_WORKFLOW"],
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--ref", "main",
                  "-f", "periodic_wake=true",
              ],
              check=True,
          )
          body = (
              "<!-- continuum-canary-recovery issue=%d attempt=%d -->\n"
              "Live canary stalled at stage `%s` (%s). Bounded recovery attempt %d/%d dispatched to `%s`."
              % (
                  issue_number,
                  attempt,
                  observed.state.stage,
                  verdict.detail,
                  attempt,
                  contract.MAX_CANARY_RECOVERY_ATTEMPTS,
                  os.environ["SCHEDULER_WORKFLOW"],
              )
          )
          subprocess.run(
              [
                  "gh", "issue", "comment", str(issue_number),
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--body", body,
              ],
              check=True,
          )
          print("Dispatched bounded canary recovery attempt %d/%d." % (attempt, contract.MAX_CANARY_RECOVERY_ATTEMPTS))
          PY

      - name: Publish live canary result
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_CONTRACT_STATUS_CONTEXT || 'continuum/contract-qualification' }}-canary
          PUBLISH_STATUS: ${{ inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true' }}
        with:
          script: |
            const passed = process.env.CANARY_OUTCOME === 'success';
            if (process.env.PUBLISH_STATUS === 'true') {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state: passed ? 'success' : 'failure',
                context: process.env.STATUS_CONTEXT,
                description: passed ? 'Live canary progressed within its deadline' : 'Live canary failed or stalled',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
            if (!passed) {
              core.setFailed('Live canary failed for the exact HEAD.');
            }
