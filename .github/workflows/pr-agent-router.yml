name: PR-Agent review router entry

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for an explicit manual route
        required: false
        type: string
      review_workflow:
        description: Heavy PR-Agent caller workflow file to dispatch
        required: false
        type: string
      review_provider:
        description: Review provider selector override
        required: false
        type: string
      target_child_id:
        description: Opaque verified child id for delegated PR-Agent routing
        required: false
        type: string
      expected_head_sha:
        description: Exact PR HEAD for delegated routing
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

# No entry-level concurrency by design (issue #227): the actionable /review
# filter lives in the job `if` gate below, which is evaluated only after a
# workflow-level lock would already have queued this run. A per-PR entry lock
# would let a plain non-`/review` comment run queue ahead of an immediately
# following owner `/review` dispatch for the same PR.

jobs:
  call:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       contains(github.event.comment.body, '/review'))
    uses: ./.github/workflows/continuum-pr-agent-router.yml
    secrets: inherit
    with:
      continuum_ref: main
      review_workflow: "${{ inputs.review_workflow || 'pr-agent.yml' }}"
      review_provider: "${{ inputs.review_provider }}"
      pr_number: "${{ inputs.pr_number }}"
      target_child_id: "${{ inputs.target_child_id }}"
      expected_head_sha: "${{ inputs.expected_head_sha }}"
