name: PR-Agent repair (OpenCode)

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
      pr_number:
        description: Pull request number carrying the current review result.
        type: string
        default: ''
        required: false
      target_child_id:
        description: Opaque verified child id for delegated execution. Empty targets the caller repository.
        type: string
        default: ''
        required: false
      head_sha:
        description: Exact HEAD SHA the review evaluated.
        type: string
        default: ''
        required: false
      review_json:
        description: >-
          Canonical upstream review JSON (steps.pragent.outputs.review) for the
          exact HEAD. Must match the PRReview schema.
        type: string
        default: ''
        required: false
      improve_jsonl:
        description: >-
          Runner-local push_outputs file payload
          (pr-agent-outputs/continuum.jsonl) carrying payload.code_suggestions.
        type: string
        default: ''
        required: false
      retry_attempt:
        description: Bounded PR-Agent retry attempt number (0 = initial run).
        type: string
        default: '0'
        required: false
      retry_workflow:
        description: Caller workflow filename used to restart the isolated PR-Agent stack.
        type: string
        default: 'continuum-pr-agent.yml'
        required: false

permissions: {}

concurrency:
  group: ${{ inputs.target_child_id && format('pr-agent-repair-child-{0}-{1}-{2}', inputs.target_child_id, inputs.pr_number || github.run_id, inputs.head_sha || github.sha) || format('pr-agent-repair-{0}-{1}', inputs.pr_number || github.run_id, inputs.head_sha || github.sha) }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Resolve the isolated PR-Agent stack
        id: stack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // One selector owns the entire review stack.
            const reviewProvider = String(
              process.env.INPUT_REVIEW_PROVIDER || process.env.CFG_REVIEW_PROVIDER || 'none'
            ).trim().toLowerCase();
            if (!['none', 'coderabbit', 'pr-agent'].includes(reviewProvider)) {
              core.setFailed(
                `Invalid CONTINUUM_REVIEW_PROVIDER="${reviewProvider}". Expected none, coderabbit, or pr-agent.`
              );
              return;
            }
            if (reviewProvider !== 'pr-agent') {
              core.setFailed(
                `PR-Agent repair requires CONTINUUM_REVIEW_PROVIDER=pr-agent; got ${reviewProvider}.`
              );
              return;
            }
            core.setOutput('stack', 'pr-agent');

      - name: Resolve PR-Agent target context
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          CONTINUUM_SOURCE_REPO="${GITHUB_WORKFLOW_REF:-}"
          CONTINUUM_SOURCE_REPO="${CONTINUUM_SOURCE_REPO%%/.github/workflows/*}"
          if ! [[ "$CONTINUUM_SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            CONTINUUM_SOURCE_REPO="kodmial/continuum"
          fi
          if [[ -z "${TARGET_CHILD_ID:-}" ]]; then
            # Local fast path: no delegated resolver is needed and
            # CONTINUUM_REF is not required for local-only repair.
            if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR-Agent target repository identity is invalid."
              exit 2
            fi
            {
              printf 'CONTINUUM_PR_AGENT_TARGET_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
              printf 'CONTINUUM_PR_AGENT_TARGET_OWNER=%s\n' "${GITHUB_REPOSITORY%%/*}"
              printf 'CONTINUUM_PR_AGENT_TARGET_REPO=%s\n' "${GITHUB_REPOSITORY#*/}"
              printf 'CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED=%s\n' "false"
            } >> "$GITHUB_ENV"
            echo "PR-Agent target context resolved locally."
            exit 0
          fi
          : "${CONTINUUM_REF:?CONTINUUM_REF is required for pinned target resolution}"
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! gh api --method GET "repos/$CONTINUUM_SOURCE_REPO/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | base64 --decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | base64 --decode > "$PARENT_CONFIG_FILE" 2>/dev/null; then
            printf 'version: 1\n' > "$PARENT_CONFIG_FILE"
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"

      - name: Validate PR-Agent target context
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          # Fail closed before any checkout/push/comment: an empty target
          # makes actions/checkout fall back to the execution repository and
          # would then push/comment against the parent.
          : "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY:?PR-Agent target repository is unset; refusing to fall back to the execution repository.}"
          : "${CONTINUUM_PR_AGENT_TARGET_OWNER:?PR-Agent target owner is unset.}"
          : "${CONTINUUM_PR_AGENT_TARGET_REPO:?PR-Agent target repository name is unset.}"
          if ! [[ "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::PR-Agent target repository identity is invalid."
            exit 2
          fi
          if [[ -z "${CONTINUUM_PR_AGENT_TARGET_OWNER:-}" || -z "${CONTINUUM_PR_AGENT_TARGET_REPO:-}" ]]; then
            echo "::error::PR-Agent target owner/repo is unset."
            exit 2
          fi
          if [[ "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" != "$CONTINUUM_PR_AGENT_TARGET_OWNER/$CONTINUUM_PR_AGENT_TARGET_REPO" ]]; then
            echo "::error::PR-Agent target repository identity is inconsistent."
            exit 2
          fi
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-}" != "true" && "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-}" != "false" ]]; then
            echo "::error::PR-Agent target delegation flag is invalid."
            exit 2
          fi
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi

      - name: Resolve PR-Agent signal policy
        id: policy
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          POLICY_SCRIPT="$RUNNER_TEMP/pr_agent_policy.js"
          gh api --method GET \
            "repos/kodmial/continuum/contents/.github/scripts/pr_agent_policy.js" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | base64 --decode > "$POLICY_SCRIPT"
          node --check "$POLICY_SCRIPT"
          echo "policy_script=$POLICY_SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Build one bounded repair batch from native outputs
        id: batch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_JSON: ${{ inputs.review_json }}
          IMPROVE_JSONL: ${{ inputs.improve_jsonl }}
          POLICY_SCRIPT: ${{ steps.policy.outputs.policy_script }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Canonical inputs only:
            //   review: steps.pragent.outputs.review (key_issues_to_review)
            //   improve: runner-local push_outputs file payload
            //            (pr-agent-outputs/continuum.jsonl payload.code_suggestions)
            // Comment prose is never scraped. Every current review finding and
            // every high-signal improve suggestion enters one bounded OpenCode
            // pass. Overlap emitted by both upstream tools is conservatively
            // deduplicated by the centralized provider policy, preferring the
            // review finding while preserving native source data for diagnostics.
            const prNumber = String(process.env.PR_NUMBER || '').trim();
            const headSha = String(process.env.HEAD_SHA || '').trim();
            if (!prNumber || !headSha) {
              core.setFailed('PR-Agent repair requires pr_number and head_sha for the exact reviewed HEAD.');
              return;
            }
            let review;
            try {
              review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            } catch (err) {
              core.setFailed(`Invalid PR-Agent review JSON: ${err.message}`);
              return;
            }
            const inner = review.review || review;
            const keyIssues = inner.key_issues_to_review;
            if (!Array.isArray(keyIssues)) {
              core.setFailed('PR-Agent review JSON has no key_issues_to_review list.');
              return;
            }
            // Centralized Work Lock #37 policy owns the autonomous /improve
            // threshold, conservative review/improve deduplication, and the
            // logical fingerprint used by no-progress suppression.
            const policy = require(process.env.POLICY_SCRIPT);
            const raw = String(process.env.IMPROVE_JSONL || '').trim();
            let batch;
            try {
              batch = policy.buildRepairBatch(review, raw);
            } catch (err) {
              core.setFailed(err.message);
              return;
            }
            const items = batch.items;
            const fingerprint = batch.fingerprint;
            const truncated = batch.truncated;
            const qualifyingCount = batch.qualifyingSuggestionCount;
            const deduplicatedCount = batch.deduplicatedSuggestions;
            const crypto = require('crypto');
            const logicalVolatileKeys = new Set([
              'index', 'line', 'line_number', 'start_line', 'end_line',
              'position', 'start_position', 'end_position', 'rank', 'score',
            ]);
            const logicalStable = (value) => {
              if (Array.isArray(value)) return value.map(logicalStable);
              if (value && typeof value === 'object') {
                return Object.fromEntries(
                  Object.keys(value)
                    .filter(key => !logicalVolatileKeys.has(String(key).toLowerCase()))
                    .sort()
                    .map(key => [key, logicalStable(value[key])])
                );
              }
              if (typeof value === 'string') return value.trim().replace(/\s+/g, ' ');
              return value;
            };
            const identified = items.map(item => ({
              id: crypto.createHash('sha256')
                .update(JSON.stringify(logicalStable(item)))
                .digest('hex'),
              item,
            }));
            const findingIds = [...new Set(identified.map(entry => entry.id))].sort();
            if (items.length === 0) {
              core.setOutput('empty', 'true');
              core.notice(`PR #${prNumber} HEAD ${headSha}: no current high-signal findings; no repair to dispatch.`);
              return;
            }
            core.setOutput('empty', 'false');
            core.setOutput('count', String(items.length));
            core.setOutput('truncated', truncated ? 'true' : 'false');
            core.setOutput('fingerprint', fingerprint);
            core.setOutput('finding_ids', findingIds.join(','));
            core.setOutput('identified_batch', JSON.stringify(identified));
            core.setOutput('batch', JSON.stringify(items));
            core.setOutput('deduplicated_suggestions', String(deduplicatedCount));
            core.notice(
              `PR #${prNumber} HEAD ${headSha}: batching ${keyIssues.length} review finding(s) ` +
              `and ${qualifyingCount - deduplicatedCount} unique high-signal improve suggestion(s); ` +
              `${deduplicatedCount} overlapping suggestion(s) deduplicated.`
            );

      - name: Check durable PR-Agent no-progress state
        if: steps.batch.outputs.empty != 'true'
        id: convergence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          FINGERPRINT: ${{ steps.batch.outputs.fingerprint }}
          FINDING_IDS: ${{ steps.batch.outputs.finding_ids }}
          IDENTIFIED_BATCH: ${{ steps.batch.outputs.identified_batch }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
        with:
          # Target-aware no-progress check (issues.listComments plus marker
          # parsing only against the resolved target). Local same-repository
          # reads use github.token; delegated cross-repository reads require
          # TAP_PAT.
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || github.token }}
          script: |
            if (process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true' &&
                !String(process.env.TAP_PAT || '').trim()) {
              core.setFailed(
                'Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token.'
              );
              return;
            }
            const owner = process.env.CONTINUUM_PR_AGENT_TARGET_OWNER;
            const repo = process.env.CONTINUUM_PR_AGENT_TARGET_REPO;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = String(process.env.HEAD_SHA || '').toLowerCase();
            const fingerprint = String(process.env.FINGERPRINT || '').toLowerCase();
            const findingIds = new Set(
              String(process.env.FINDING_IDS || '').toLowerCase().split(',').filter(Boolean)
            );
            const failClosed = (message) => {
              core.setOutput('held', 'true');
              core.setOutput('eligible_batch', '[]');
              core.setOutput('eligible_count', '0');
              core.setOutput('surviving_findings', '');
              core.setFailed(message);
            };
            let identified;
            try {
              identified = JSON.parse(String(process.env.IDENTIFIED_BATCH || '[]'));
            } catch (err) {
              failClosed('PR-Agent identified batch is invalid JSON: ' + err.message);
              return;
            }
            const shaRe = /^[0-9a-f]{40}$/;
            const fpRe = /^[0-9a-f]{64}$/;
            if (!prNumber || !shaRe.test(headSha) || !fpRe.test(fingerprint) || findingIds.size === 0 ||
                !Array.isArray(identified) || identified.length === 0) {
              failClosed('PR-Agent no-progress check requires PR, HEAD, batch fingerprint, and identified logical findings.');
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            // The marker carries the exact HEAD plus the structured finding
            // state token. It is written only by this workflow through the
            // single persistent controller-state API path, so the marker body is the trust anchor:
            // the comment author's login must not be consulted. Markers land
            // under whichever identity owns TAP_PAT (often a machine user that
            // is neither the repository owner nor the actions bot identity),
            // and a login allow-list would miss them, leaving `held` false
            // forever and repairing the same HEAD/state repeatedly.
            // Same-HEAD hold is exact fingerprint (#33 contract) or same HEAD
            // plus same logical finding: the optional findings= suffix lets a
            // same logical finding hold even when volatile fields
            // (line/whitespace) changed the whole-batch fingerprint.
            const marker =
              '<!-- continuum-pr-agent-no-progress head=' + headSha +
              ' fingerprint=' + fingerprint + ' -->';
            const noProgressRe =
              /<!-- continuum-pr-agent-no-progress head=([0-9a-f]{40}) fingerprint=([0-9a-f]{64})(?: findings=([0-9a-f]{64}(?:,[0-9a-f]{64})*))? -->/gi;
            let sameHeadHeld = comments.some(comment =>
              String(comment.body || '').toLowerCase().includes(marker)
            );
            const sameHeadFindings = new Set();
            for (const comment of comments) {
              const body = String(comment.body || '');
              for (const match of body.matchAll(noProgressRe)) {
                if (String(match[1] || '').toLowerCase() !== headSha) continue;
                if (String(match[2] || '').toLowerCase() === fingerprint) {
                  sameHeadHeld = true;
                }
                for (const id of String(match[3] || '').toLowerCase().split(',').filter(Boolean).slice(0, 500)) {
                  sameHeadFindings.add(id);
                }
              }
            }
            const sameHeadSurviving = [...findingIds]
              .filter(id => sameHeadFindings.has(id));
            // Cross-HEAD state is per logical finding, not per whole batch.
            // This catches F surviving A->B even if some other findings were
            // resolved or new findings appeared on B.
            let surviving = [];
            const transitionRe =
              /<!-- continuum-pr-agent-convergence from=([0-9a-f]{40}) to=([0-9a-f]{40}) findings=([0-9a-f]{64}(?:,[0-9a-f]{64})*) -->/gi;
            let transitionCount = 0;
            const MAX_TRANSITIONS = 50;
            const MAX_IDS_PER_MARKER = 500;
            for (const comment of comments) {
              if (transitionCount >= MAX_TRANSITIONS) break;
              const body = String(comment.body || '');
              for (const match of body.matchAll(transitionRe)) {
                if (transitionCount >= MAX_TRANSITIONS) break;
                transitionCount++;
                const fromHead = String(match[1] || '').toLowerCase();
                const toHead = String(match[2] || '').toLowerCase();
                if (fromHead === toHead) continue;
                if (toHead !== headSha) continue;
                const prior = new Set(String(match[3] || '').toLowerCase().split(',').filter(Boolean).slice(0, MAX_IDS_PER_MARKER));
                for (const id of findingIds) {
                  if (prior.has(id)) surviving.push(id);
                }
              }
            }
            const idRe = /^[0-9a-f]{64}$/;
            for (const entry of identified) {
              const id = String(entry?.id || '').toLowerCase();
              if (!idRe.test(id) || typeof entry?.item !== 'object' || entry?.item === null) {
                failClosed('PR-Agent identified batch contains an invalid logical finding entry.');
                return;
              }
            }
            const identifiedIds = new Set(identified.map(entry => String(entry.id || '').toLowerCase()));
            for (const id of findingIds) {
              if (!identifiedIds.has(id)) {
                failClosed('PR-Agent finding IDs do not match identified batch.');
                return;
              }
            }
            if (identifiedIds.size !== findingIds.size) {
              failClosed('PR-Agent finding IDs do not match identified batch.');
              return;
            }
            surviving = [...new Set([...surviving, ...sameHeadSurviving])].sort();
            const survivingSet = new Set(surviving);
            const eligible = sameHeadHeld
              ? []
              : identified.filter(entry => !survivingSet.has(String(entry.id || '').toLowerCase()));
            const held = eligible.length === 0;
            core.setOutput('surviving_findings', surviving.join(','));
            core.setOutput('eligible_count', String(eligible.length));
            core.setOutput('eligible_batch', JSON.stringify(eligible.map(entry => entry.item)));
            core.setOutput('eligible_findings', eligible.map(entry => String(entry.id || '').toLowerCase()).sort().join(','));
            core.setOutput('held', held ? 'true' : 'false');
            if (held) {
              core.notice(
                'PR #' + prNumber + ' HEAD ' + headSha +
                ': identical structured PR-Agent finding state or no eligible logical findings remain (' +
                surviving.length + ' survived a workflow-generated repair HEAD).'
              );
            }

      - name: Resolve the writable PR source branch
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true'
        id: target
        env:
          # Target-aware PR resolution (GET the current pull only against the
          # resolved target). Local reads use github.token; delegated
          # cross-repository reads require TAP_PAT. Every GitHub operation in
          # this step is read-only and fails closed on mismatch.
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || github.token }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          PR_JSON="$(gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/pulls/$PR_NUMBER")"
          CURRENT_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          PR_DRAFT="$(jq -r '.draft' <<<"$PR_JSON")"
          if [[ "$PR_STATE" != "open" || "$PR_DRAFT" == "true" ]]; then
            echo "::notice::PR #$PR_NUMBER is closed or draft; automatic repair will not modify it."
            exit 1
          fi
          if [[ "$CURRENT_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::PR head moved ($HEAD_SHA -> $CURRENT_SHA); discarding this repair batch."
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" ]]; then
            echo "::error::PR-Agent automatic repair supports same-repository PR branches only."
            exit 1
          fi
          [[ -n "$HEAD_REF" && "$HEAD_REF" != "null" ]] || {
            echo "::error::Could not resolve the writable PR source branch."
            exit 1
          }
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved writable PR source branch refs/heads/$HEAD_REF at $CURRENT_SHA."

      - name: Mark PR-Agent repair in flight
        id: repair_status
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true' && steps.target.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'continuum/pr-agent-repair',
              description: 'PR-Agent repair is running',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Checkout the writable PR source branch
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          repository: ${{ env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY }}
          ref: ${{ steps.target.outputs.head_ref }}

      - name: Confirm the checked-out branch is the reviewed HEAD
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Checked-out branch $HEAD_REF does not match reviewed HEAD $HEAD_SHA."
            exit 1
          fi

      - name: Install pinned OpenCode CLI for PR-Agent repair
        id: install_opencode
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Run one bounded OpenCode repair pass over every current item
        id: repair_pass
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          BATCH_JSON: ${{ steps.convergence.outputs.eligible_batch }}
          BATCH_FINGERPRINT: ${{ steps.batch.outputs.fingerprint }}
          FINDING_IDS: ${{ steps.convergence.outputs.eligible_findings }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
        run: |
          set -euo pipefail
          # OpenCode is repairer only: it receives every current native review
          # finding and qualifying improve suggestion in one bounded pass.
          # The workflow, not OpenCode, owns commit/push so publication always
          # targets the real writable PR source branch.
          PROMPT="$(python3 - <<'PY'
          import json, os
          items = json.loads(os.environ.get('BATCH_JSON', '[]'))
          lines = [
              'Repair every item below on the current PR branch in one bounded pass.',
              'Process every item; do not stop after the first finding.',
              '',
          ]
          for item in items:
              source = item.get('source', '')
              if source == 'review':
                  lines.append(f"[review] {json.dumps(item.get('finding', {}))}")
              else:
                  lines.append(f"[improve] {json.dumps(item.get('suggestion', {}))}")
          lines += [
              '',
              'Apply the required code changes only.',
              'Do not commit, push, create a PR, or manufacture review state; the workflow owns publication.',
          ]
          print('\n'.join(lines))
          PY
          )"
          START_HEAD="$(git rev-parse HEAD)"
          if ! opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"; then
            echo "classification=transient" >> "$GITHUB_OUTPUT"
            echo "::error::OpenCode repair runtime failed; recovery may retry this exact operation."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$START_HEAD" ]]; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::error::OpenCode created a commit; PR-Agent repair requires the workflow to own commit/push."
            exit 1
          fi

          # Remove only repository-ignored build/cache artifacts left by tools
          # the repair agent ran. This cannot delete source changes because
          # git clean -X is restricted to ignored paths. If an older branch
          # already tracks an ignored generated file, restore it to the reviewed
          # HEAD so repair cannot smuggle a cache/build mutation into the commit.
          git clean -fdX
          mapfile -t TRACKED_IGNORED < <(git ls-files -ci --exclude-standard)
          if (( ${#TRACKED_IGNORED[@]} > 0 )); then
            git restore --source="$START_HEAD" --worktree --staged -- "${TRACKED_IGNORED[@]}"
          fi

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "classification=settled" >> "$GITHUB_OUTPUT"
            echo "no_progress=true" >> "$GITHUB_OUTPUT"
            echo "no_progress_reason=no-code-change" >> "$GITHUB_OUTPUT"
            echo "No repair diff; controller state will hold PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "classification=settled" >> "$GITHUB_OUTPUT"
            echo "no_progress=true" >> "$GITHUB_OUTPUT"
            echo "no_progress_reason=no-staged-change" >> "$GITHUB_OUTPUT"
            echo "No staged repair diff; controller state will hold this exact finding state."
            exit 0
          fi
          # Revalidate immediately before publication so a long repair run can
          # never publish against a PR branch that moved after repair started.
          CURRENT_STATE="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv' || true)"
          CURRENT_SHA="$(cut -f1 <<<"$CURRENT_STATE")"
          CURRENT_PR_STATE="$(cut -f2 <<<"$CURRENT_STATE")"
          CURRENT_DRAFT="$(cut -f3 <<<"$CURRENT_STATE")"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}' || true)"
          if [[ "$CURRENT_PR_STATE" != "OPEN" || "$CURRENT_DRAFT" == "true" ]]; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER became closed or draft during repair; discarding local changes without publication."
            exit 1
          fi
          if [[ -z "$HEAD_SHA" || -z "$CURRENT_SHA" || -z "$REMOTE_SHA" ]]; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::error::Unable to revalidate PR branch before publish (reviewed=$HEAD_SHA current=$CURRENT_SHA remote=$REMOTE_SHA); discarding repair."
            exit 1
          fi
          if [[ "$CURRENT_SHA" != "$HEAD_SHA" || "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::error::PR branch moved before publish (reviewed=$HEAD_SHA current=$CURRENT_SHA remote=$REMOTE_SHA); discarding repair."
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix: apply PR-Agent review findings for HEAD $HEAD_SHA"
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::error::Local repair is not based on reviewed HEAD $HEAD_SHA; discarding repair."
            exit 1
          fi
          NEW_HEAD="$(git rev-parse HEAD)"
          FINDING_IDS_LOWER="${FINDING_IDS,,}"
          HEAD_SHA_LOWER="${HEAD_SHA,,}"
          NEW_HEAD_LOWER="${NEW_HEAD,,}"
          [[ "$HEAD_SHA_LOWER" =~ ^[0-9a-f]{40}$ ]] || { echo "classification=deterministic" >> "$GITHUB_OUTPUT"; echo "::error::Invalid reviewed HEAD."; exit 1; }
          [[ "$NEW_HEAD_LOWER" =~ ^[0-9a-f]{40}$ ]] || { echo "classification=deterministic" >> "$GITHUB_OUTPUT"; echo "::error::Invalid repair HEAD."; exit 1; }
          [[ "$FINDING_IDS_LOWER" =~ ^[0-9a-f]{64}(,[0-9a-f]{64})*$ ]] || { echo "classification=deterministic" >> "$GITHUB_OUTPUT"; echo "::error::Invalid eligible finding IDs."; exit 1; }
          if [[ "$HEAD_SHA_LOWER" == "$NEW_HEAD_LOWER" ]]; then
            echo "classification=deterministic" >> "$GITHUB_OUTPUT"
            echo "::error::Repair produced no new HEAD; refusing convergence transition."
            exit 1
          fi
          MARKER="<!-- continuum-pr-agent-convergence from=${HEAD_SHA_LOWER} to=${NEW_HEAD_LOWER} findings=${FINDING_IDS_LOWER} -->"
          CONTROLLER_MARKER='<!-- continuum-pr-agent-controller-state:v1 -->'
          printf -v BODY '%s\n%s\n<details>\n<summary>Continuum PR-Agent controller state</summary>\n\n%s\n\n</details>' \
            "$CONTROLLER_MARKER" "$MARKER" \
            "Repair prepared ${HEAD_SHA_LOWER} -> ${NEW_HEAD_LOWER}; a fresh exact-HEAD review will hold only surviving logical findings."

          mapfile -t CONTROLLER_IDS < <(
            gh api --paginate "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.body | contains("<!-- continuum-pr-agent-controller-state:v1 -->")) | .id'
          )
          if (( ${#CONTROLLER_IDS[@]} > 0 )); then
            LAST_INDEX=$((${#CONTROLLER_IDS[@]} - 1))
            CONTROLLER_ID="${CONTROLLER_IDS[$LAST_INDEX]}"
            gh api --method PATCH "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/comments/$CONTROLLER_ID" \
              -f body="$BODY" >/dev/null
            if (( LAST_INDEX > 0 )); then
              for STALE_ID in "${CONTROLLER_IDS[@]:0:$LAST_INDEX}"; do
                gh api --method DELETE "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/comments/$STALE_ID" >/dev/null
              done
            fi
          else
            gh api --method POST "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null
          fi

          if ! git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"; then
            CURRENT_AFTER="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid || true)"
            REMOTE_AFTER="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}' || true)"
            if [[ "$CURRENT_AFTER" != "$HEAD_SHA" || "$REMOTE_AFTER" != "$HEAD_SHA" ]]; then
              echo "classification=deterministic" >> "$GITHUB_OUTPUT"
              echo "::error::PR branch moved during publish; stale repair will not be retried."
            else
              echo "classification=transient" >> "$GITHUB_OUTPUT"
              echo "::error::Repair push failed without a branch move; recovery may retry."
            fi
            exit 1
          fi
          echo "classification=settled" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Pushed one bounded repair to refs/heads/$HEAD_REF for PR #$PR_NUMBER."

      - name: Persist PR-Agent no-progress controller state
        if: steps.repair_pass.outputs.no_progress == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          FINGERPRINT: ${{ steps.batch.outputs.fingerprint }}
          FINDING_IDS: ${{ steps.convergence.outputs.eligible_findings }}
          REASON: ${{ steps.repair_pass.outputs.no_progress_reason }}
          POLICY_SCRIPT: ${{ steps.policy.outputs.policy_script }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            const prNumber = Number(process.env.PR_NUMBER);
            const head = String(process.env.HEAD_SHA || '').toLowerCase();
            const fingerprint = String(process.env.FINGERPRINT || '').toLowerCase();
            const findingIds = String(process.env.FINDING_IDS || '').toLowerCase();
            const validFindingIds = /^[0-9a-f]{64}(,[0-9a-f]{64})*$/.test(findingIds);
            const stateMarker =
              '<!-- continuum-pr-agent-no-progress head=' + head +
              ' fingerprint=' + fingerprint +
              (validFindingIds ? ' findings=' + findingIds : '') + ' -->';
            const summary =
              'No progress for exact HEAD ' + head +
              ' (' + String(process.env.REASON || 'no-effective-change') +
              '); automatic same-state repair is held until the HEAD or logical finding state changes.';
            const body = policy.controllerStateBody(stateMarker, summary);
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: prNumber, per_page: 100 }
            );
            const controller = comments
              .filter(comment => String(comment.body || '').includes(policy.CONTROLLER_STATE_MARKER))
              .sort((a, b) => Number(a.id) - Number(b.id));
            const latest = controller.at(-1);
            if (latest) {
              await github.rest.issues.updateComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: latest.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                issue_number: prNumber,
                body,
              });
            }
            for (const stale of controller.slice(0, -1)) {
              await github.rest.issues.deleteComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: stale.id,
              });
            }

      - name: Publish durable PR-Agent repair state
        if: steps.repair_status.outcome == 'success' && steps.repair_pass.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'continuum/pr-agent-repair',
              description: 'PR-Agent repair settled',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Publish failed PR-Agent repair state
        if: failure() && steps.repair_status.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          RETRYABLE_FAILURE: ${{ (steps.install_opencode.outcome == 'failure' || (steps.repair_pass.outcome == 'failure' && steps.repair_pass.outputs.classification == 'transient')) && 'true' || 'false' }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'continuum/pr-agent-repair',
              description:
                process.env.RETRYABLE_FAILURE === 'true'
                  ? 'PR-Agent repair failed: transient; recovery eligible'
                  : 'PR-Agent repair failed: deterministic; recovery held',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Update persistent PR-Agent repair retry controller state
        if: >-
          always() &&
          steps.batch.outputs.empty != 'true' &&
          steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true' &&
          failure() &&
          (steps.install_opencode.outcome == 'failure' ||
           (steps.repair_pass.outcome == 'failure' &&
            steps.repair_pass.outputs.classification == 'transient'))
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          POLICY_SCRIPT: ${{ steps.policy.outputs.policy_script }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            const prNumber = Number(process.env.PR_NUMBER);
            const head = String(process.env.HEAD_SHA || '').toLowerCase();
            const attempt = Number(process.env.RETRY_ATTEMPT || '0');
            const exhausted = Number.isInteger(attempt) && attempt >= 2;
            const next = Number.isInteger(attempt) ? attempt + 1 : 1;
            const stateMarker = exhausted
              ? '<!-- continuum-pr-agent-retry-exhausted head=' + head +
                ' kind=repair attempts=' + next + ' -->'
              : '<!-- continuum-pr-agent-retry head=' + head +
                ' kind=repair attempt=' + next + ' -->';
            const summary = exhausted
              ? 'Retry budget exhausted for repair on exact HEAD ' + head + '.'
              : 'Transient repair failure; bounded retry ' + next + '/3 is scheduled for exact HEAD ' + head + '.';
            const body = policy.controllerStateBody(stateMarker, summary);
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: prNumber, per_page: 100 }
            );
            const controller = comments
              .filter(comment => String(comment.body || '').includes(policy.CONTROLLER_STATE_MARKER))
              .sort((a, b) => Number(a.id) - Number(b.id));
            const latest = controller.at(-1);
            if (latest) {
              await github.rest.issues.updateComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: latest.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                issue_number: prNumber,
                body,
              });
            }
            for (const stale of controller.slice(0, -1)) {
              await github.rest.issues.deleteComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: stale.id,
              });
            }

      - name: Schedule bounded retry for retryable PR-Agent repair failure
        if: >-
          always() &&
          steps.batch.outputs.empty != 'true' &&
          steps.convergence.outcome == 'success' && steps.convergence.outputs.held != 'true' &&
          failure() &&
          (steps.install_opencode.outcome == 'failure' ||
           (steps.repair_pass.outcome == 'failure' &&
            steps.repair_pass.outputs.classification == 'transient'))
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          RETRY_WORKFLOW: ${{ inputs.retry_workflow || 'continuum-pr-agent.yml' }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CI_WORKFLOW_NAME: ${{ vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        run: |
          set -euo pipefail
          # Target-aware revalidation runs wholly PAT-backed (GH_TOKEN is
          # TAP_PAT) so delegated cross-repository reads succeed. Fail
          # closed when delegated without PAT instead of masking an auth
          # failure as stale-cancelled via `|| true`.
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Delegated repair retry requires TAP_PAT; refusing to silently cancel."
            exit 1
          fi
          attempt="${RETRY_ATTEMPT:-0}"
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0
          case "$RETRY_WORKFLOW" in
            continuum-pr-agent.yml|pr-agent.yml) ;;
            *)
              echo "::error::Invalid isolated PR-Agent retry workflow: $RETRY_WORKFLOW"
              exit 1
              ;;
          esac

          current_sha="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid || true)"
          if [[ -z "$current_sha" || "$current_sha" != "$HEAD_SHA" ]]; then
            echo "PR HEAD changed during failed repair; stale retry cancelled."
            exit 0
          fi

          if (( attempt >= 2 )); then
            echo "Repair retry budget exhausted for PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi

          next=$((attempt + 1))
          delay=$((15 * (1 << attempt)))
          sleep "$delay"

          if ! current="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv')"; then
            echo "Could not revalidate PR state after backoff; stale retry cancelled."
            exit 0
          fi
          current_sha="$(cut -f1 <<<"$current")"
          current_state="$(cut -f2 <<<"$current")"
          current_draft="$(cut -f3 <<<"$current")"
          if [[ "$current_sha" != "$HEAD_SHA" || "$current_state" != "OPEN" || "$current_draft" == "true" ]]; then
            echo "PR state changed during repair retry backoff; stale retry cancelled."
            exit 0
          fi
          CI_JSON="$RUNNER_TEMP/pr-agent-repair-ci-runs.json"
          if ! gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" > "$CI_JSON"; then
            echo "Could not revalidate exact-HEAD CI after backoff; stale retry cancelled."
            exit 0
          fi
          if ! python3 - "$CI_JSON" "$CI_WORKFLOW_NAME" "$HEAD_SHA" <<'PY'
          import json, sys
          path, workflow, head = sys.argv[1:4]
          with open(path, "r", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          current = sorted(
              (run for run in runs if run.get("name") == workflow and run.get("head_sha") == head),
              key=lambda run: run.get("created_at") or "",
              reverse=True,
          )
          raise SystemExit(
              0 if current and current[0].get("status") == "completed"
              and current[0].get("conclusion") == "success" else 1
          )
          PY
          then
            echo "Exact HEAD no longer has green CI; retry cancelled until a fresh CI event."
            exit 0
          fi

          DEFAULT_BRANCH="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)"
          DEFAULT_BRANCH="$(printf '%s' "${DEFAULT_BRANCH:-main}" | tr -d ' \t\r\n')"
          case "$DEFAULT_BRANCH" in
            ""|*".."*|*"//"*|*"@{"*|*/|*.|*.lock|HEAD|"@"|refs/*|-*|.*) DEFAULT_BRANCH="main" ;;
          esac
          if ! [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then DEFAULT_BRANCH="main"; fi
          if [[ "$DEFAULT_BRANCH" == */.*/* || "$DEFAULT_BRANCH" == .*/ || "$DEFAULT_BRANCH" == */. ]] || [[ "$DEFAULT_BRANCH" =~ (^|/)\. ]] || [[ "$DEFAULT_BRANCH" =~ \.lock($|/) ]]; then DEFAULT_BRANCH="main"; fi
          # Local runs dispatch bare: a custom retry_workflow without the
          # target_child_id workflow_dispatch input rejects unknown inputs,
          # so an empty value must be omitted (mirrors recovery JS).
          if [[ -n "${TARGET_CHILD_ID:-}" ]]; then
            gh workflow run "$RETRY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"             -f pr_number="$PR_NUMBER"             -f expected_head_sha="$HEAD_SHA"             -f retry_attempt="$next"             -f retry_workflow="$RETRY_WORKFLOW"             -f recovery_kind="repair"             -f target_child_id="$TARGET_CHILD_ID"
          else
            gh workflow run "$RETRY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"             -f pr_number="$PR_NUMBER"             -f expected_head_sha="$HEAD_SHA"             -f retry_attempt="$next"             -f retry_workflow="$RETRY_WORKFLOW"             -f recovery_kind="repair"
          fi
          echo "Dispatched isolated PR-Agent repair retry via fresh review attempt $next/3."
