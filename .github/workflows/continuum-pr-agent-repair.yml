name: PR-Agent repair (OpenCode)

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
      pr_number:
        description: Pull request number carrying the current review result.
        type: string
        default: ''
        required: false
      head_sha:
        description: Exact HEAD SHA the review evaluated.
        type: string
        default: ''
        required: false
      review_json:
        description: >-
          Canonical upstream review JSON (steps.pragent.outputs.review) for the
          exact HEAD. Must match the PRReview schema.
        type: string
        default: ''
        required: false
      improve_jsonl:
        description: >-
          Runner-local push_outputs file payload
          (pr-agent-outputs/continuum.jsonl) carrying payload.code_suggestions.
        type: string
        default: ''
        required: false
      retry_attempt:
        description: Bounded PR-Agent retry attempt number (0 = initial run).
        type: string
        default: '0'
        required: false
      retry_workflow:
        description: Caller workflow filename used to restart the isolated PR-Agent stack.
        type: string
        default: 'continuum-pr-agent.yml'
        required: false

permissions: {}

concurrency:
  group: pr-agent-repair-${{ inputs.pr_number || github.run_id }}-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Resolve the isolated PR-Agent stack
        id: stack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // One selector owns the entire review stack.
            const reviewProvider = String(
              process.env.INPUT_REVIEW_PROVIDER || process.env.CFG_REVIEW_PROVIDER || 'none'
            ).trim().toLowerCase();
            if (!['none', 'coderabbit', 'pr-agent'].includes(reviewProvider)) {
              core.setFailed(
                `Invalid CONTINUUM_REVIEW_PROVIDER="${reviewProvider}". Expected none, coderabbit, or pr-agent.`
              );
              return;
            }
            if (reviewProvider !== 'pr-agent') {
              core.setFailed(
                `PR-Agent repair requires CONTINUUM_REVIEW_PROVIDER=pr-agent; got ${reviewProvider}.`
              );
              return;
            }
            core.setOutput('stack', 'pr-agent');

      - name: Build one bounded repair batch from native outputs
        id: batch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_JSON: ${{ inputs.review_json }}
          IMPROVE_JSONL: ${{ inputs.improve_jsonl }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Canonical inputs only:
            //   review: steps.pragent.outputs.review (key_issues_to_review)
            //   improve: runner-local push_outputs file payload
            //            (pr-agent-outputs/continuum.jsonl payload.code_suggestions)
            // Comment prose is never scraped. Every current review finding and
            // every qualifying improve suggestion enters ONE bounded OpenCode
            // pass together, each preserving its native source (review or
            // improve). The pass never stops after the first finding and never
            // fans out one agent per finding.
            const prNumber = String(process.env.PR_NUMBER || '').trim();
            const headSha = String(process.env.HEAD_SHA || '').trim();
            if (!prNumber || !headSha) {
              core.setFailed('PR-Agent repair requires pr_number and head_sha for the exact reviewed HEAD.');
              return;
            }
            let review;
            try {
              review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            } catch (err) {
              core.setFailed(`Invalid PR-Agent review JSON: ${err.message}`);
              return;
            }
            const inner = review.review || review;
            const keyIssues = inner.key_issues_to_review;
            if (!Array.isArray(keyIssues)) {
              core.setFailed('PR-Agent review JSON has no key_issues_to_review list.');
              return;
            }
            // Improve suggestions come only from the file channel payload.
            let suggestions = [];
            const raw = String(process.env.IMPROVE_JSONL || '').trim();
            if (raw) {
              for (const line of raw.split('\n')) {
                if (!line.trim()) continue;
                let record;
                try {
                  record = JSON.parse(line);
                } catch (err) {
                  core.setFailed(`Invalid improve push_outputs line: ${err.message}`);
                  return;
                }
                const payload = record.payload || record;
                for (const entry of payload.code_suggestions || []) {
                  suggestions.push(entry);
                }
              }
            }
            // suggestions_score_threshold=1: only a score below 1 is dropped.
            // A missing score is conservatively qualifying.
            const qualifying = suggestions.filter((entry) => {
              const score = entry.score;
              if (score === undefined || score === null) return true;
              const numeric = Number(score);
              if (Number.isNaN(numeric)) return true;
              return numeric >= 1;
            });
            // A batch at the findings cap is potentially truncated: it still
            // repairs the visible batch and re-reviews, but never declares
            // the HEAD clean from this batch alone.
            const truncated = keyIssues.length === 6;
            const items = [
              ...keyIssues.map((finding, index) => ({ source: 'review', index, finding })),
              ...qualifying.map((suggestion, index) => ({ source: 'improve', index, suggestion })),
            ];
            if (items.length === 0) {
              core.setOutput('empty', 'true');
              core.notice(`PR #${prNumber} HEAD ${headSha}: no current findings; no repair to dispatch.`);
              return;
            }
            // At most one OpenCode repair per review result: the per-head
            // marker below makes a second dispatch for the same HEAD a no-op,
            // so a repeated run cannot storm the same HEAD.
            const crypto = require('crypto');
            const stable = (value) => {
              if (Array.isArray(value)) return value.map(stable);
              if (value && typeof value === 'object') {
                return Object.fromEntries(
                  Object.keys(value).sort().map(key => [key, stable(value[key])])
                );
              }
              return value;
            };
            const fingerprint = crypto
              .createHash('sha256')
              .update(JSON.stringify(stable(items)))
              .digest('hex');
            core.setOutput('empty', 'false');
            core.setOutput('count', String(items.length));
            core.setOutput('truncated', truncated ? 'true' : 'false');
            core.setOutput('fingerprint', fingerprint);
            core.setOutput('batch', JSON.stringify(items));
            core.notice(
              `PR #${prNumber} HEAD ${headSha}: batching ${keyIssues.length} review finding(s) ` +
              `and ${qualifying.length} qualifying suggestion(s) into one bounded repair pass.`
            );

      - name: Check durable PR-Agent no-progress state
        if: steps.batch.outputs.empty != 'true'
        id: convergence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          FINGERPRINT: ${{ steps.batch.outputs.fingerprint }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = String(process.env.HEAD_SHA || '').toLowerCase();
            const fingerprint = String(process.env.FINGERPRINT || '').toLowerCase();
            if (!prNumber || !headSha || !fingerprint) {
              core.setFailed('PR-Agent no-progress check requires PR, HEAD, and finding fingerprint.');
              return;
            }
            const marker =
              '<!-- continuum-pr-agent-no-progress head=' + headSha +
              ' fingerprint=' + fingerprint + ' -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            // The marker carries the exact HEAD plus the structured finding
            // state token. It is written only by this workflow (gh pr comment
            // with TAP_PAT), so the marker body itself is the trust anchor:
            // the comment author's login must not be consulted. Markers land
            // under whichever identity owns TAP_PAT (often a machine user that
            // is neither the repository owner nor the actions bot identity),
            // and a login allow-list would miss them, leaving `held` false
            // forever and repairing the same HEAD/state repeatedly.
            const held = comments.some(comment =>
              String(comment.body || '').includes(marker)
            );
            core.setOutput('held', held ? 'true' : 'false');
            if (held) {
              core.notice(
                'PR #' + prNumber + ' HEAD ' + headSha +
                ': identical structured PR-Agent finding state already made no progress; repair suppressed.'
              );
            }

      - name: Resolve the writable PR source branch
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outputs.held != 'true'
        id: target
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          CURRENT_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          if [[ "$CURRENT_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::PR head moved ($HEAD_SHA -> $CURRENT_SHA); discarding this repair batch."
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::PR-Agent automatic repair supports same-repository PR branches only."
            exit 1
          fi
          [[ -n "$HEAD_REF" && "$HEAD_REF" != "null" ]] || {
            echo "::error::Could not resolve the writable PR source branch."
            exit 1
          }
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved writable PR source branch refs/heads/$HEAD_REF at $CURRENT_SHA."

      - name: Checkout the writable PR source branch
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outputs.held != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_PAT }}
          persist-credentials: true
          ref: ${{ steps.target.outputs.head_ref }}

      - name: Confirm the checked-out branch is the reviewed HEAD
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outputs.held != 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Checked-out branch $HEAD_REF does not match reviewed HEAD $HEAD_SHA."
            exit 1
          fi

      - name: Install pinned OpenCode CLI for PR-Agent repair
        id: install_opencode
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outputs.held != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Run one bounded OpenCode repair pass over every current item
        id: repair_pass
        if: steps.batch.outputs.empty != 'true' && steps.convergence.outputs.held != 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REF: ${{ steps.target.outputs.head_ref }}
          BATCH_JSON: ${{ steps.batch.outputs.batch }}
          BATCH_FINGERPRINT: ${{ steps.batch.outputs.fingerprint }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
        run: |
          set -euo pipefail
          # OpenCode is repairer only: it receives every current native review
          # finding and qualifying improve suggestion in one bounded pass.
          # The workflow, not OpenCode, owns commit/push so publication always
          # targets the real writable PR source branch.
          PROMPT="$(python3 - <<'PY'
          import json, os
          items = json.loads(os.environ.get('BATCH_JSON', '[]'))
          lines = [
              'Repair every item below on the current PR branch in one bounded pass.',
              'Process every item; do not stop after the first finding.',
              '',
          ]
          for item in items:
              source = item.get('source', '')
              if source == 'review':
                  lines.append(f"[review] {json.dumps(item.get('finding', {}))}")
              else:
                  lines.append(f"[improve] {json.dumps(item.get('suggestion', {}))}")
          lines += [
              '',
              'Apply the required code changes only.',
              'Do not commit, push, create a PR, or manufacture review state; the workflow owns publication.',
          ]
          print('\n'.join(lines))
          PY
          )"
          START_HEAD="$(git rev-parse HEAD)"
          opencode run --auto --model "$OPENCODE_MODEL" "$PROMPT"
          if [[ "$(git rev-parse HEAD)" != "$START_HEAD" ]]; then
            echo "::error::OpenCode created a commit; PR-Agent repair requires the workflow to own commit/push."
            exit 1
          fi
          if [[ -z "$(git status --porcelain)" ]]; then
            MARKER="<!-- continuum-pr-agent-no-progress head=${HEAD_SHA,,} fingerprint=${BATCH_FINGERPRINT,,} -->"
            printf -v BODY '%s\n%s' "$MARKER" "PR-Agent reported actionable structured findings, but the bounded OpenCode repair produced no code change for this exact HEAD/finding state. Automatic same-state repair is held until the HEAD or structured finding state changes."
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "No repair diff; recorded durable no-progress state for PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            MARKER="<!-- continuum-pr-agent-no-progress head=${HEAD_SHA,,} fingerprint=${BATCH_FINGERPRINT,,} -->"
            printf -v BODY '%s\n%s' "$MARKER" "PR-Agent repair staged no effective change for this exact HEAD/finding state. Automatic same-state repair is held until the HEAD or structured finding state changes."
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "No staged repair diff; recorded durable no-progress state."
            exit 0
          fi
          # Revalidate immediately before publication so a long repair run can
          # never publish against a PR branch that moved after repair started.
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid || true)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}' || true)"
          if [[ -z "$HEAD_SHA" || -z "$CURRENT_SHA" || -z "$REMOTE_SHA" ]]; then
            echo "::error::Unable to revalidate PR branch before publish (reviewed=$HEAD_SHA current=$CURRENT_SHA remote=$REMOTE_SHA); discarding repair."
            exit 1
          fi
          if [[ "$CURRENT_SHA" != "$HEAD_SHA" || "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "::error::PR branch moved before publish (reviewed=$HEAD_SHA current=$CURRENT_SHA remote=$REMOTE_SHA); discarding repair."
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix: apply PR-Agent review findings for HEAD $HEAD_SHA"
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "::error::Local repair is not based on reviewed HEAD $HEAD_SHA; discarding repair."
            exit 1
          fi
          git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF"
          echo "Pushed one bounded repair to refs/heads/$HEAD_REF for PR #$PR_NUMBER."

      - name: Schedule bounded retry for retryable PR-Agent repair failure
        if: >-
          always() &&
          steps.batch.outputs.empty != 'true' &&
          steps.convergence.outputs.held != 'true' &&
          failure() &&
          (steps.install_opencode.outcome == 'failure' ||
           steps.repair_pass.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RETRY_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
          RETRY_WORKFLOW: ${{ inputs.retry_workflow || 'continuum-pr-agent.yml' }}
        run: |
          set -euo pipefail
          attempt="${RETRY_ATTEMPT:-0}"
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0
          case "$RETRY_WORKFLOW" in
            continuum-pr-agent.yml|pr-agent.yml) ;;
            *)
              echo "::error::Invalid isolated PR-Agent retry workflow: $RETRY_WORKFLOW"
              exit 1
              ;;
          esac

          current_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid || true)"
          if [[ -z "$current_sha" || "$current_sha" != "$HEAD_SHA" ]]; then
            echo "PR HEAD changed during failed repair; stale retry cancelled."
            exit 0
          fi

          if (( attempt >= 3 )); then
            MARKER="<!-- continuum-pr-agent-retry-exhausted head=${HEAD_SHA,,} kind=repair attempts=$attempt -->"
            printf -v BODY '%s\n%s' "$MARKER" "PR-Agent repair exhausted the bounded retry budget for this exact HEAD. A changed HEAD/finding state or explicit owner /review starts a fresh evaluation."
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Repair retry budget exhausted for PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi

          next=$((attempt + 1))
          delay=$((15 * (1 << attempt)))
          MARKER="<!-- continuum-pr-agent-retry head=${HEAD_SHA,,} kind=repair attempt=$next -->"
          printf -v BODY '%s\n%s' "$MARKER" "Retrying a transient PR-Agent repair/runtime failure through a fresh exact-HEAD review (attempt $next/3, backoff ${delay}s)."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          sleep "$delay"

          if ! current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv')"; then
            echo "Could not revalidate PR state after backoff; stale retry cancelled."
            exit 0
          fi
          current_sha="$(cut -f1 <<<"$current")"
          current_state="$(cut -f2 <<<"$current")"
          current_draft="$(cut -f3 <<<"$current")"
          if [[ "$current_sha" != "$HEAD_SHA" || "$current_state" != "OPEN" || "$current_draft" == "true" ]]; then
            echo "PR state changed during repair retry backoff; stale retry cancelled."
            exit 0
          fi
          if ! combined="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" --jq .state)"; then
            echo "Could not revalidate exact-HEAD CI after backoff; stale retry cancelled."
            exit 0
          fi
          if [[ "$combined" != "success" ]]; then
            echo "Exact HEAD no longer has green CI; retry cancelled until a fresh CI event."
            exit 0
          fi

          DEFAULT_BRANCH="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)"
          gh workflow run "$RETRY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "${DEFAULT_BRANCH:-main}"             -f pr_number="$PR_NUMBER"             -f expected_head_sha="$HEAD_SHA"             -f retry_attempt="$next"             -f retry_workflow="$RETRY_WORKFLOW"
          echo "Dispatched isolated PR-Agent repair retry via fresh review attempt $next/3."
