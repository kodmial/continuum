name: Continuum review-provider cutover (one-shot, issue 481)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/continuum-provider-cutover-once.yml

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: continuum-review-provider-cutover-once
  cancel-in-progress: false

jobs:
  cutover:
    if: github.repository == 'kodmial/continuum'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set and verify repository review provider
        shell: bash
        env:
          ADMIN_PAT: ${{ secrets.TAP_PAT }}
          REPORT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="kodmial/continuum"
          endpoint="https://api.github.com/repos/$repo/actions/variables/CONTINUUM_REVIEW_PROVIDER"
          headers=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          report() {
            local text="$1"
            local json
            json=$(jq -nc --arg body "$text" '{body:$body}')
            curl -sS --fail -o /dev/null -X POST \
              -H "Authorization: Bearer $REPORT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              --data "$json" \
              "https://api.github.com/repos/$repo/issues/481/comments" || true
          }
          if [[ -z "$ADMIN_PAT" ]]; then
            report "Continuum cutover #481: FAILED — TAP_PAT is missing; no variable was changed."
            echo "::error::TAP_PAT is missing; no change made."
            exit 1
          fi
          auth=(-H "Authorization: Bearer $ADMIN_PAT")
          status=$(curl -sS -o /tmp/cutover-before.json -w '%{http_code}' \
            "${headers[@]}" "${auth[@]}" "$endpoint")
          if [[ "$status" == "200" ]]; then
            before=$(jq -r '.value // ""' /tmp/cutover-before.json)
            rollback="restore CONTINUUM_REVIEW_PROVIDER to the recorded value"
            action="updated"
          elif [[ "$status" == "404" ]]; then
            before="<not set>"
            rollback="delete newly created CONTINUUM_REVIEW_PROVIDER"
            action="created"
          else
            report "Continuum cutover #481: FAILED — could not read repository variable (HTTP $status); no change made."
            echo "::error::Variable read failed (HTTP $status); no change made."
            exit 1
          fi
          echo "Prior CONTINUUM_REVIEW_PROVIDER: $before"
          if [[ "$before" == "pr-agent" ]]; then
            action="already set"
          else
            payload=$(jq -nc --arg name "CONTINUUM_REVIEW_PROVIDER" --arg value "pr-agent" '{name:$name,value:$value}')
            if [[ "$status" == "200" ]]; then
              write_status=$(curl -sS -o /tmp/cutover-write.json -w '%{http_code}' \
                "${headers[@]}" "${auth[@]}" -H "Content-Type: application/json" \
                -X PATCH --data "$payload" "$endpoint")
              expected="204"
            else
              write_status=$(curl -sS -o /tmp/cutover-write.json -w '%{http_code}' \
                "${headers[@]}" "${auth[@]}" -H "Content-Type: application/json" \
                -X POST --data "$payload" \
                "https://api.github.com/repos/$repo/actions/variables")
              expected="201"
            fi
            if [[ "$write_status" != "$expected" ]]; then
              report "Continuum cutover #481: FAILED — variable API rejected the write (HTTP $write_status); previous value was $before."
              echo "::error::Variable write failed HTTP $write_status; expected $expected."
              exit 1
            fi
          fi
          verified_status=$(curl -sS -o /tmp/cutover-after.json -w '%{http_code}' \
            "${headers[@]}" "${auth[@]}" "$endpoint")
          verified=""
          if [[ "$verified_status" == "200" ]]; then
            verified=$(jq -r '.value // ""' /tmp/cutover-after.json)
          fi
          if [[ "$verified" != "pr-agent" ]]; then
            report "Continuum cutover #481: FAILED verification; read HTTP $verified_status; previous value was $before."
            echo "::error::Variable verification failed (HTTP $verified_status)."
            exit 1
          fi
          echo "Verified CONTINUUM_REVIEW_PROVIDER=pr-agent (previous=$before, action=$action)."
          wake_status=$(curl -sS -o /tmp/cutover-wake.json -w '%{http_code}' \
            -H "Authorization: Bearer $REPORT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -X POST --data '{"ref":"main"}' \
            "https://api.github.com/repos/$repo/actions/workflows/pr-agent-recovery.yml/dispatches")
          if [[ "$wake_status" == "204" ]]; then
            wake="PR-Agent recovery dispatched"
          else
            wake="immediate wake HTTP $wake_status; normal 10-minute recovery cron remains available"
          fi
          report "Continuum #481: VERIFIED switch to CONTINUUM_REVIEW_PROVIDER=pr-agent; previous value: $before; $action; rollback: $rollback; $wake. Cutover used one-shot workflow, to be deleted after verification. #403 policy risk remains separately owner-blocked."
          echo "Cutover verified; $wake"
