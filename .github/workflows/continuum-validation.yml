name: CI

on:
  workflow_call:
    inputs:
      runner:
        description: Optional runner override; empty uses CONTINUUM_RUNNER then ubuntu-latest
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: Optional timeout override; empty uses CONTINUUM_VALIDATION_TIMEOUT_MINUTES then 25
        required: false
        type: string
        default: ''
      prepare_command:
        description: Optional preparation hook executed before validation
        required: false
        type: string
        default: ''
      build_command:
        description: Optional consumer build hook
        required: false
        type: string
        default: ''
      test_command:
        description: Optional consumer test hook
        required: false
        type: string
        default: ''
      validation_command:
        description: Optional additional consumer validation hook
        required: false
        type: string
        default: ''
      package_command:
        description: Optional packaging hook
        required: false
        type: string
        default: ''
      release_command:
        description: Optional release hook
        required: false
        type: string
        default: ''
      auto_detect:
        description: Empty uses CONTINUUM_AUTO_DETECT then true
        required: false
        type: string
        default: ''
      node_version:
        description: Optional Node.js version setup; empty keeps the runner-provided Node
        required: false
        type: string
        default: ''
      php_version:
        description: Optional PHP version setup; empty keeps the runner-provided PHP
        required: false
        type: string
        default: ''
      php_extensions:
        description: Optional comma-separated PHP extensions when php_version is configured
        required: false
        type: string
        default: ''
      php_coverage:
        description: Optional PHP coverage driver when php_version is configured
        required: false
        type: string
        default: ''
      bun_version:
        description: Optional Bun version setup for consumer validation hooks
        required: false
        type: string
        default: ''
      artifact_paths:
        description: Newline-separated paths uploaded after validation
        required: false
        type: string
        default: ''
      artifact_name:
        description: Artifact bundle name; empty uses CONTINUUM_ARTIFACT_NAME
        required: false
        type: string
        default: ''
      status_context:
        description: Commit-status context; empty uses CONTINUUM_STATUS_CONTEXT
        required: false
        type: string
        default: ''
      publish_status:
        description: Empty uses CONTINUUM_PUBLISH_STATUS then true
        required: false
        type: string
        default: ''
      dispatch_repair:
        description: Empty uses CONTINUUM_DISPATCH_REPAIR then true
        required: false
        type: string
        default: ''
      repair_workflow:
        description: Repair workflow file; empty uses CONTINUUM_REPAIR_WORKFLOW
        required: false
        type: string
        default: ''
      pr_number:
        description: Optional pull request number for manual validation
        required: false
        type: string
        default: ''
      skip_opencode_pull_request:
        description: Empty uses CONTINUUM_SKIP_OPENCODE_PR then false
        required: false
        type: string
        default: ''
      continuum_ref:
        description: Continuum revision supplying this contract
        required: false
        type: string
        default: main

permissions: {}

jobs:
  validate:
    name: Validate
    if: >-
      vars.CONTINUUM_ROLE != 'child' &&
      (
        !fromJSON(inputs.skip_opencode_pull_request || vars.CONTINUUM_SKIP_OPENCODE_PR || 'false') ||
        github.event_name != 'pull_request' ||
        !startsWith(github.head_ref, 'opencode/')
      )
    runs-on: ${{ inputs.runner || vars.CONTINUUM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.CONTINUUM_VALIDATION_TIMEOUT_MINUTES || '25') }}

    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            let sha = context.sha;
            let ref = context.ref;
            let prNumber = '';

            if (context.eventName === 'pull_request') {
              sha = context.payload.pull_request.head.sha;
              ref = context.payload.pull_request.head.ref;
              prNumber = String(context.payload.pull_request.number);
            } else if (process.env.MANUAL_PR_NUMBER) {
              prNumber = process.env.MANUAL_PR_NUMBER;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(prNumber),
              });
              sha = pr.head.sha;
              ref = pr.head.ref;
            }

            core.setOutput('sha', sha);
            core.setOutput('ref', ref);
            core.setOutput('pr_number', prNumber);

      - name: Mark validation pending
        if: fromJSON(inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_STATUS_CONTEXT || 'continuum/validation' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Validation is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Detect project stack
        if: fromJSON(inputs.auto_detect || vars.CONTINUUM_AUTO_DETECT || 'true')
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          python=false
          node=false
          php=false
          java=false
          go=false
          rust=false

          if [[ -f pyproject.toml || -f requirements.txt || -f setup.py || -f setup.cfg ]] || \
             find . -type f -name '*.py' -not -path './.git/*' -not -path './.github/*' | grep -q .; then
            python=true
          fi
          [[ -f package.json ]] && node=true
          if [[ -f composer.json || -f artisan ]] ||              find . -type f -name '*.php' -not -path './.git/*' -not -path './vendor/*' | grep -q .; then
            php=true
          fi
          if [[ -f pom.xml || -f mvnw || -f build.gradle || -f build.gradle.kts || -f gradlew ]]; then
            java=true
          fi
          [[ -f go.mod ]] && go=true
          [[ -f Cargo.toml ]] && rust=true

          {
            echo "python=$python"
            echo "node=$node"
            echo "php=$php"
            echo "java=$java"
            echo "go=$go"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

          echo "Detected: python=$python node=$node php=$php java=$java go=$go rust=$rust"

      - name: Set up Python
        if: fromJSON(inputs.auto_detect || vars.CONTINUUM_AUTO_DETECT || 'true') && steps.stack.outputs.python == 'true'
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: (inputs.node_version || vars.CONTINUUM_NODE_VERSION) != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version || vars.CONTINUUM_NODE_VERSION }}

      - name: Set up PHP
        if: (inputs.php_version || vars.CONTINUUM_PHP_VERSION) != ''
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2
        with:
          php-version: ${{ inputs.php_version || vars.CONTINUUM_PHP_VERSION }}
          extensions: ${{ inputs.php_extensions || vars.CONTINUUM_PHP_EXTENSIONS }}
          tools: composer
          coverage: ${{ inputs.php_coverage || vars.CONTINUUM_PHP_COVERAGE || 'none' }}

      - name: Set up Bun
        if: (inputs.bun_version || vars.CONTINUUM_BUN_VERSION) != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun_version || vars.CONTINUUM_BUN_VERSION }}

      - name: Run validation contract
        id: checks
        shell: bash
        env:
          AUTO_DETECT: ${{ inputs.auto_detect || vars.CONTINUUM_AUTO_DETECT || 'true' }}
          STACK_PYTHON: ${{ steps.stack.outputs.python }}
          STACK_NODE: ${{ steps.stack.outputs.node }}
          STACK_PHP: ${{ steps.stack.outputs.php }}
          STACK_JAVA: ${{ steps.stack.outputs.java }}
          STACK_GO: ${{ steps.stack.outputs.go }}
          STACK_RUST: ${{ steps.stack.outputs.rust }}
          PREPARE_COMMAND: ${{ inputs.prepare_command || vars.CONTINUUM_PREPARE_COMMAND || '' }}
          BUILD_COMMAND: ${{ inputs.build_command || vars.CONTINUUM_BUILD_COMMAND || '' }}
          TEST_COMMAND: ${{ inputs.test_command || vars.CONTINUUM_TEST_COMMAND || '' }}
          VALIDATION_COMMAND: ${{ inputs.validation_command || vars.CONTINUUM_VALIDATION_COMMAND || '' }}
          PACKAGE_COMMAND: ${{ inputs.package_command || vars.CONTINUUM_PACKAGE_COMMAND || '' }}
          RELEASE_COMMAND: ${{ inputs.release_command || vars.CONTINUUM_RELEASE_COMMAND || '' }}
        run: |
          set -euo pipefail

          ran=false
          run_hook() {
            local stage="$1"
            local command="$2"
            [[ -n "$command" ]] || return 0
            ran=true
            echo "::group::$stage hook"
            eval "$command"
            echo "::endgroup::"
          }

          run_hook prepare "$PREPARE_COMMAND"

          if [[ "$AUTO_DETECT" == "true" ]]; then
            if [[ "$STACK_PYTHON" == "true" ]]; then
              ran=true
              echo "::group::Python"
              python -m compileall -q -x '(^|/)(\.git|\.venv|venv)(/|$)' .
              python -m pip install --upgrade pip
              [[ ! -f requirements.txt ]] || python -m pip install -r requirements.txt
              [[ ! -f pyproject.toml ]] || python -m pip install -e .
              if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
                python -m pip install pytest
                python -m pytest -q
              else
                echo "No Python tests detected."
              fi
              echo "::endgroup::"
            fi

            if [[ "$STACK_NODE" == "true" ]]; then
              ran=true
              echo "::group::Node"
              node --version
              npm --version
              if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
              npm test --if-present
              npm run build --if-present
              echo "::endgroup::"
            fi

            if [[ "$STACK_PHP" == "true" ]]; then
              ran=true
              echo "::group::PHP"
              php --version
              composer --version
              if [[ -f composer.lock ]]; then
                composer install --prefer-dist --no-interaction --no-progress
              elif [[ -f composer.json ]]; then
                composer install --prefer-dist --no-interaction --no-progress
              fi
              if [[ -x vendor/bin/phpunit ]]; then
                vendor/bin/phpunit
              else
                echo "No PHPUnit binary detected."
              fi
              echo "::endgroup::"
            fi

            if [[ "$STACK_JAVA" == "true" ]]; then
              ran=true
              echo "::group::Java"
              java -version
              if [[ -f mvnw ]]; then
                chmod +x mvnw
                ./mvnw -B verify
              elif [[ -f pom.xml ]]; then
                mvn -B verify
              fi
              if [[ -f gradlew ]]; then
                chmod +x gradlew
                ./gradlew build
              elif [[ -f build.gradle || -f build.gradle.kts ]]; then
                gradle build
              fi
              echo "::endgroup::"
            fi

            if [[ "$STACK_GO" == "true" ]]; then
              ran=true
              echo "::group::Go"
              go version
              go test ./...
              go build ./...
              echo "::endgroup::"
            fi

            if [[ "$STACK_RUST" == "true" ]]; then
              ran=true
              echo "::group::Rust"
              rustc --version
              cargo --version
              cargo test --all-targets
              cargo build --all-targets
              echo "::endgroup::"
            fi

            if [[ -f Dockerfile ]]; then
              ran=true
              echo "::group::Docker"
              docker build -t continuum-validation .
              echo "::endgroup::"
            fi

            while IFS= read -r -d '' script; do
              ran=true
              bash -n "$script"
            done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          fi

          run_hook build "$BUILD_COMMAND"
          run_hook test "$TEST_COMMAND"
          run_hook validation "$VALIDATION_COMMAND"
          run_hook package "$PACKAGE_COMMAND"
          run_hook release "$RELEASE_COMMAND"

          if [[ "$ran" == "false" ]]; then
            echo "No implementation stack or explicit hook is configured; validation has nothing to execute."
          fi

      - name: Upload declared artifacts
        if: always() && (inputs.artifact_paths != '' || vars.CONTINUUM_ARTIFACT_PATHS != '')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name || vars.CONTINUUM_ARTIFACT_NAME || 'continuum-validation' }}
          path: ${{ inputs.artifact_paths || vars.CONTINUUM_ARTIFACT_PATHS }}
          if-no-files-found: error

      - name: Publish validation result and continue repair lifecycle
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_STATUS_CONTEXT || 'continuum/validation' }}
          PUBLISH_STATUS: ${{ inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true' }}
          DISPATCH_REPAIR: ${{ inputs.dispatch_repair || vars.CONTINUUM_DISPATCH_REPAIR || 'true' }}
          REPAIR_WORKFLOW: ${{ inputs.repair_workflow || vars.CONTINUUM_REPAIR_WORKFLOW || 'continuum-opencode-repair.yml' }}
        with:
          script: |
            const passed = process.env.CHECK_OUTCOME === 'success';
            const state = passed ? 'success' : 'failure';

            if (process.env.PUBLISH_STATUS === 'true') {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state,
                context: process.env.STATUS_CONTEXT,
                description: passed ? 'Validation passed' : 'Validation failed',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

            if (process.env.DISPATCH_REPAIR === 'true' && process.env.PR_NUMBER) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: process.env.REPAIR_WORKFLOW,
                ref: context.payload.repository?.default_branch || 'main',
                inputs: {
                  pr_number: process.env.PR_NUMBER,
                  head_sha: process.env.TARGET_SHA,
                  conclusion: state,
                  run_id: String(context.runId),
                },
              });
            }
