name: Contract canary

# Layer 3 of the contract qualification gate (kodmial/continuum#286). It
# observes a real scheduled canary task on current `main`. This is a separate
# reusable workflow so the pull-request qualification caller never needs the
# issue/action writes that live-canary recovery requires.
#
# kodmial/continuum#458: the scheduled canary no longer requires an operator to
# configure CONTINUUM_CANARY_ISSUE. It discovers exactly one repository-owned
# canary issue (or creates a bounded replacement after the previous canary is
# conclusively complete and the seven-day window elapsed). Bootstrap is only
# allowed in kodmial/continuum; an installed consumer keeps the explicit
# CONTINUUM_CANARY_ISSUE override and never bootstraps.

on:
  workflow_call:
    inputs:
      head_sha:
        description: Optional exact HEAD SHA to observe instead of the caller SHA
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: Optional timeout override for the canary job
        required: false
        type: string
        default: ''
      status_context:
        description: Commit-status context; empty uses CONTINUUM_CONTRACT_STATUS_CONTEXT
        required: false
        type: string
        default: ''
      publish_status:
        description: Empty uses CONTINUUM_PUBLISH_STATUS then true
        required: false
        type: string
        default: ''
    secrets:
      TAP_PAT:
        description: >-
          Classic PAT used only to read the canary issue, create the bounded
          owned canary in kodmial/continuum, and dispatch bounded recovery; the
          canary fails closed when it is absent.
        required: false

permissions: {}

jobs:
  canary:
    name: Live canary
    # Layer 3 observes a real canary task on current main. It runs in its own
    # job because it needs issue writes (bootstrap/recovery) while the qualify
    # job checks out and executes untrusted PR code and must not hold them.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || vars.CONTINUUM_CONTRACT_TIMEOUT_MINUTES || '15') }}

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve target
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANUAL_HEAD_SHA: ${{ inputs.head_sha }}
        with:
          script: |
            let sha = context.sha;
            if (process.env.MANUAL_HEAD_SHA) {
              sha = String(process.env.MANUAL_HEAD_SHA).trim();
            }
            if (!/^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$/.test(sha)) {
              core.setFailed('Live canary requires a full HEAD SHA.');
              return;
            }
            core.setOutput('sha', sha.toLowerCase());

      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5
        with:
          python-version: '3.12'

      - name: Resolve or bootstrap the live canary task
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CANARY_ISSUE_OVERRIDE: ${{ vars.CONTINUUM_CANARY_ISSUE }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::TAP_PAT is required to resolve, bootstrap, and observe the live canary; refusing to report success."
            exit 1
          fi
          configured="${CANARY_ISSUE_OVERRIDE:-}"
          if [[ -n "$configured" ]]; then
            if ! [[ "$configured" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::CONTINUUM_CANARY_ISSUE must be a positive integer when provided; refusing to guess the live canary issue."
              exit 1
            fi
            echo "issue_number=$configured" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "resolution=configured-override"
            exit 0
          fi
          if [[ "${GITHUB_REPOSITORY}" != "kodmial/continuum" ]]; then
            echo "::error::Live-canary bootstrap is only allowed in kodmial/continuum; refusing to create an issue in ${GITHUB_REPOSITORY}."
            exit 1
          fi

          observation_dir="$RUNNER_TEMP/continuum-canary"
          mkdir -p "$observation_dir"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100&sort=created&direction=desc" \
            | jq -s 'add // []' > "$observation_dir/issues.json"
          # Paginate the full PR history: an old canary PR must never fall out
          # of a bounded page and look absent, which would block the 7-day
          # replacement decision. Normalize REST fields to the gh shape the
          # Python probes already consume.
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100&sort=updated&direction=desc" \
            | jq -s 'add // [] | map({number, state, body, title, headRefName: .head.ref, headRefOid: .head.sha, updatedAt: .updated_at, mergedAt: .merged_at, mergeCommit: (if .merge_commit_sha then {oid: .merge_commit_sha} else null end), url: .html_url})' \
            > "$observation_dir/pulls.json"
          gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name,workflowName,headSha,event \
            > "$observation_dir/runs.json"

          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src OBSERVATION_DIR="$observation_dir" \
            CANARY_REPO="$GITHUB_REPOSITORY" \
            python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from continuum import contract_canary as canary

          root = os.environ["OBSERVATION_DIR"]
          def load(name):
              with open(os.path.join(root, name), encoding="utf-8") as handle:
                  return json.load(handle)

          def save(name, payload):
              with open(os.path.join(root, name), "w", encoding="utf-8") as handle:
                  json.dump(payload, handle, sort_keys=True)

          issues = load("issues.json")
          pulls = load("pulls.json")
          runs = load("runs.json")
          repo = os.environ["CANARY_REPO"]

          # A closed canary is only reusable when its merged PR carries
          # exact-HEAD CI/contract evidence. Fetch runs for that exact head
          # rather than trusting a bounded global run page.
          candidate = canary.select_canary_issue(issues, expected_repo=repo)
          if candidate is not None and candidate.state == "closed":
              latest = canary.select_implementation_pr(candidate.number, pulls)
              head = str((latest or {}).get("headRefOid") or "").strip().lower()
              if head:
                  proc = subprocess.run(
                      [
                          "gh", "run", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--commit", head, "--limit", "100",
                          "--json", "databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name,workflowName,headSha,event",
                      ],
                      check=True, capture_output=True, text=True,
                  )
                  runs = canary.merge_exact_head_runs(
                      runs, head, json.loads(proc.stdout)
                  )

          decision = canary.resolve_canary(
              issues,
              pull_requests=pulls,
              runs=runs,
              expected_repo=repo,
              now=datetime.now(timezone.utc),
          )
          payload = {
              "action": decision.action,
              "issue_number": decision.issue_number,
              "reason": decision.reason,
              "detail": decision.detail,
              "previous_issue_number": decision.previous_issue_number,
          }
          if decision.action == "create":
              title, body = canary.build_canary_issue(
                  nonce="{}-{}".format(
                      os.environ.get("GITHUB_RUN_ID", "unknown"),
                      os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
                  ),
                  run_id=os.environ.get("GITHUB_RUN_ID", ""),
                  run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  repo=repo,
              )
              with open(os.path.join(root, "issue-body.md"), "w", encoding="utf-8") as handle:
                  handle.write(body)
              payload["title"] = title
          save("decision.json", payload)
          print("Canary resolution: {} ({})".format(decision.action, decision.detail))
          PY

          action="$(jq -r '.action' "$observation_dir/decision.json")"
          case "$action" in
            observe)
              issue_number="$(jq -r '.issue_number' "$observation_dir/decision.json")"
              if ! [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Live-canary discovery returned no usable issue number."
                exit 1
              fi
              echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "resolution=$(jq -r '.reason' "$observation_dir/decision.json")"
              ;;
            create)
              title="$(jq -r '.title' "$observation_dir/decision.json")"
              url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" \
                --body-file "$observation_dir/issue-body.md" \
                --label "automation:ready")"
              issue_number="$(grep -oE '[0-9]+$' <<<"$url" | tail -n 1 || true)"
              if ! [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::Created live canary issue but could not determine its number; refusing to continue."
                exit 1
              fi
              # Re-read the complete inventory and require the new issue to be
              # the only open owned canary. If metadata is temporarily
              # unreadable or another open canary appeared, fail closed; never
              # fan out a second active canary.
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100&sort=created&direction=desc" \
                | jq -s 'add // []' > "$observation_dir/issues-after-create.json"
              # The heredoc body and its terminator must stay at the run-script
              # base indentation: a shell heredoc does not trim leading spaces
              # from the body or terminator, so indenting them with the `case`
              # branch would make both the shell and Python parse them wrongly.
              PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src OBSERVATION_DIR="$observation_dir" \
                CANARY_REPO="$GITHUB_REPOSITORY" CANARY_CREATED="$issue_number" \
                python3 - <<'PY'
          import json
          import os
          from continuum import contract_canary as canary

          root = os.environ["OBSERVATION_DIR"]
          with open(os.path.join(root, "issues-after-create.json"), encoding="utf-8") as handle:
              issues = json.load(handle)
          created = int(os.environ["CANARY_CREATED"])
          selected = canary.select_canary_issue(
              issues, expected_repo=os.environ["CANARY_REPO"]
          )
          if selected is None or selected.number != created:
              raise SystemExit(
                  "created live canary issue #%d is not uniquely discoverable; "
                  "refusing to report canary success" % created
              )
          print("Bootstrapped live canary issue #%d (owned marker verified)." % created)
          PY
              echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
              echo "created=true" >> "$GITHUB_OUTPUT"
              echo "resolution=$(jq -r '.reason' "$observation_dir/decision.json")"
              ;;
            *)
              echo "::error::Live-canary discovery returned unsupported action '$action'."
              exit 1
              ;;
          esac

      - name: Observe the live canary task
        id: canary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CANARY_ISSUE: ${{ steps.resolve.outputs.issue_number }}
          CANARY_CREATED: ${{ steps.resolve.outputs.created }}
          SCHEDULER_WORKFLOW: ${{ vars.CONTINUUM_SCHEDULER_WORKFLOW || 'automation.yml' }}
        run: |
          set -euo pipefail
          if ! [[ "${CANARY_ISSUE:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CONTINUUM_CANARY_ISSUE was not configured and live-canary bootstrap produced no issue; refusing to report canary success without an observed task."
            exit 1
          fi
          observation_dir="$RUNNER_TEMP/continuum-canary"
          mkdir -p "$observation_dir"
          gh issue view "$CANARY_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json number,state,labels,createdAt,updatedAt,closedAt,body,title \
            > "$observation_dir/issue.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$CANARY_ISSUE/comments?per_page=100" \
            | jq -s 'add // []' > "$observation_dir/comments.json"
          gh run list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name,workflowName,headSha,event \
            > "$observation_dir/runs.json"
          # Paginate the full PR history: an old canary PR must never fall out
          # of a bounded page and look absent, which would block the 7-day
          # replacement decision. Normalize REST fields to the gh shape the
          # Python probes already consume.
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100&sort=updated&direction=desc" \
            | jq -s 'add // [] | map({number, state, body, title, headRefName: .head.ref, headRefOid: .head.sha, updatedAt: .updated_at, mergedAt: .merged_at, mergeCommit: (if .merge_commit_sha then {oid: .merge_commit_sha} else null end), url: .html_url})' \
            > "$observation_dir/pulls.json"
          # REST pull objects do not carry reviewDecision. Enrich the small
          # open-PR set so the canary still distinguishes review from merge;
          # closed history stays fully paginated above so old canary PRs are
          # never hidden by a bounded page.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,reviewDecision > "$observation_dir/review-decisions.json"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src OBSERVATION_DIR="$observation_dir" \
            CANARY_ISSUE="$CANARY_ISSUE" CANARY_CREATED="$CANARY_CREATED" \
            SCHEDULER_WORKFLOW="$SCHEDULER_WORKFLOW" \
            python3 - <<'PY'
          import json
          import os
          import subprocess
          from continuum import contract_canary as canary
          from continuum import contract_observation as observation
          from continuum import contract_qualification as contract

          root = os.environ["OBSERVATION_DIR"]
          def load(name):
              with open(os.path.join(root, name), encoding="utf-8") as handle:
                  return json.load(handle)

          def save(name, payload):
              with open(os.path.join(root, name), "w", encoding="utf-8") as handle:
                  json.dump(payload, handle, sort_keys=True)

          def outcome(evidence, detail, **fields):
              payload = {"evidence": evidence, "detail": detail}
              payload.update(fields)
              save("outcome.json", payload)

          issue_number = int(os.environ["CANARY_ISSUE"])
          created = os.environ.get("CANARY_CREATED") == "true"
          issue = load("issue.json")
          runs = load("runs.json")
          pulls = load("pulls.json")
          comments = load("comments.json")
          review_decisions = {
              int(item["number"]): item.get("reviewDecision")
              for item in load("review-decisions.json")
              if str(item.get("number") or "").isdigit()
          }
          for pull in pulls:
              number = str(pull.get("number") or "")
              if number.isdigit():
                  pull["reviewDecision"] = review_decisions.get(int(number))

          observed = observation.observe_canary(
              issue,
              runs=runs,
              pull_requests=pulls,
              comments=comments,
              canary_id="canary-main",
          )
          if observed.failure:
              raise SystemExit("live canary failed: " + observed.failure)
          if observed.completed:
              latest = canary.select_implementation_pr(issue_number, pulls)
              head = str((latest or {}).get("headRefOid") or "").strip().lower()
              if head:
                  proc = subprocess.run(
                      [
                          "gh", "run", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--commit", head, "--limit", "100",
                          "--json", "databaseId,status,conclusion,createdAt,startedAt,headBranch,displayTitle,name,workflowName,headSha,event",
                      ],
                      check=True, capture_output=True, text=True,
                  )
                  runs = canary.merge_exact_head_runs(
                      runs, head, json.loads(proc.stdout)
                  )
              problem = canary.validate_completed_canary(latest, runs, issue_number)
              if problem:
                  raise SystemExit("live canary completion is not trustworthy: " + problem)
              merge = (latest or {}).get("mergeCommit") or {}
              merge_sha = str(merge.get("oid") or "").strip()
              age = canary._age_seconds(
                  issue.get("createdAt") or issue.get("created_at"), None
              )
              print(
                  "Completed live canary issue #%d PR #%s head=%s merge=%s age_seconds=%s"
                  % (
                      issue_number,
                      (latest or {}).get("number", "-"),
                      head or "-",
                      merge_sha or "-",
                      age if age is not None else "-",
                  )
              )
              outcome(
                  "completed",
                  "merged PR with exact-HEAD CI/contract evidence",
                  issue=issue_number,
                  pr=(latest or {}).get("number"),
                  head_sha=head,
                  merge_sha=merge_sha,
                  age_seconds=age,
              )
              raise SystemExit(0)

          verdict = contract.evaluate_canary(observed.state)
          print(
              "Observed live canary: %s -> %s (%s)"
              % (observed.state, verdict.outcome, verdict.detail)
          )
          if verdict.outcome == contract.CANARY_PROGRESS:
              if created and observed.state.stage == "admission":
                  outcome(
                      "bootstrapped",
                      "created issue waits for scheduler admission",
                      issue=issue_number,
                      stage=observed.state.stage,
                      age_seconds=observed.state.stage_elapsed_seconds,
                  )
              else:
                  outcome(
                      "progress",
                      verdict.reason,
                      issue=issue_number,
                      pr=observed.state.pr_number,
                      run=observed.state.run_id,
                      stage=observed.state.stage,
                      age_seconds=observed.state.stage_elapsed_seconds,
                  )
              raise SystemExit(0)
          if verdict.outcome == contract.CANARY_STALLED_FAILED:
              raise SystemExit(
                  "live canary stalled and exhausted its bounded recovery budget: "
                  + verdict.detail
              )
          # Bounded autonomous recovery: wake the scheduler that owns the
          # canary reservation and record the attempt on the issue. The next
          # scheduled canary run re-observes the real stage.
          attempt = int(observed.state.recovery_attempts) + 1
          subprocess.run(
              [
                  "gh", "workflow", "run", os.environ["SCHEDULER_WORKFLOW"],
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--ref", "main",
                  "-f", "periodic_wake=true",
              ],
              check=True,
          )
          body = (
              "<!-- continuum-canary-recovery issue=%d attempt=%d -->\n"
              "Live canary stalled at stage `%s` (%s). Bounded recovery attempt %d/%d dispatched to `%s`."
              % (
                  issue_number,
                  attempt,
                  observed.state.stage,
                  verdict.detail,
                  attempt,
                  contract.MAX_CANARY_RECOVERY_ATTEMPTS,
                  os.environ["SCHEDULER_WORKFLOW"],
              )
          )
          subprocess.run(
              [
                  "gh", "issue", "comment", str(issue_number),
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--body", body,
              ],
              check=True,
          )
          print(
              "Dispatched bounded canary recovery attempt %d/%d."
              % (attempt, contract.MAX_CANARY_RECOVERY_ATTEMPTS)
          )
          outcome(
              "recovering",
              verdict.reason,
              issue=issue_number,
              pr=observed.state.pr_number,
              run=observed.state.run_id,
              stage=observed.state.stage,
              age_seconds=observed.state.stage_elapsed_seconds,
              attempt=attempt,
          )
          PY

          if [[ -f "$observation_dir/outcome.json" ]]; then
            echo "evidence=$(jq -r '.evidence' "$observation_dir/outcome.json")" >> "$GITHUB_OUTPUT"
            echo "detail=$(jq -r '.detail' "$observation_dir/outcome.json")" >> "$GITHUB_OUTPUT"
            {
              echo "## Live canary evidence"
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              jq -r '
                "| evidence | `\(.evidence)` |",
                "| detail | \(.detail) |",
                (.issue // empty | "| issue | #\(.) |"),
                (.pr // empty | "| pull request | #\(.) |"),
                (.run // empty | "| run id | \(.) |"),
                (.stage // empty | "| stage | \(.) |"),
                (.age_seconds // empty | "| age (seconds) | \(.) |"),
                (.head_sha // empty | "| PR head | `\(.)` |"),
                (.merge_sha // empty | "| merge commit | `\(.)` |"),
                (.attempt // empty | "| recovery attempt | \(.) |")
              ' "$observation_dir/outcome.json"
              echo
              echo "Action run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish live canary result
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CANARY_OUTCOME: ${{ steps.canary.outcome }}
          CANARY_EVIDENCE: ${{ steps.canary.outputs.evidence }}
          CANARY_DETAIL: ${{ steps.canary.outputs.detail }}
          STATUS_CONTEXT: ${{ inputs.status_context || vars.CONTINUUM_CONTRACT_STATUS_CONTEXT || 'continuum/contract-qualification' }}-canary
          PUBLISH_STATUS: ${{ inputs.publish_status || vars.CONTINUUM_PUBLISH_STATUS || 'true' }}
        with:
          script: |
            const evidence = process.env.CANARY_EVIDENCE || '';
            const passed = process.env.CANARY_OUTCOME === 'success' && evidence === 'completed';
            const pending = process.env.CANARY_OUTCOME === 'success' &&
              ['progress', 'recovering', 'bootstrapped'].includes(evidence);
            if (process.env.PUBLISH_STATUS === 'true') {
              const state = passed ? 'success' : pending ? 'pending' : 'failure';
              const description = passed
                ? 'Live canary completed through a merged PR'
                : pending
                  ? `Live canary in progress (${evidence || 'waiting'})`
                  : 'Live canary failed or stalled';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state,
                context: process.env.STATUS_CONTEXT,
                description,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
            if (pending) {
              core.notice(
                `Live canary evidence is ${evidence}: ${process.env.CANARY_DETAIL || 'waiting'}. ` +
                'This run is not a completed end-to-end pass.'
              );
            }
            if (!passed && !pending) {
              core.setFailed('Live canary failed for the exact HEAD.');
            }
