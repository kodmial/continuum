name: One-shot backlog DAG reconcile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-backlog-dag.yml"

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply and verify native issue dependencies
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const api = { headers: { 'X-GitHub-Api-Version': '2026-03-10' } };

            const adds = [
              [11, 37],
              [16, 64],
              [22, 59],
              [29, 68],
              [59, 37],
              [62, 59],
            ];
            const removals = [
              [1, 7],
              [1, 13],
              [8, 7],
              [9, 7],
              [10, 7],
              [15, 13],
              [16, 6],
              [16, 13],
            ];

            async function blockers(issueNumber) {
              return await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                { owner, repo, issue_number: issueNumber, per_page: 100, ...api }
              );
            }

            for (const [issueNumber, blockerNumber] of removals) {
              const current = await blockers(issueNumber);
              const blocker = current.find(item => item.number === blockerNumber);
              if (!blocker) continue;
              await github.request(
                'DELETE /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by/{issue_id}',
                { owner, repo, issue_number: issueNumber, issue_id: blocker.id, ...api }
              );
              core.notice(`Removed #${issueNumber} <- #${blockerNumber}`);
            }

            for (const [issueNumber, blockerNumber] of adds) {
              const current = await blockers(issueNumber);
              if (current.some(item => item.number === blockerNumber)) continue;
              const blocker = await github.rest.issues.get({ owner, repo, issue_number: blockerNumber });
              await github.request(
                'POST /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                { owner, repo, issue_number: issueNumber, issue_id: blocker.data.id, ...api }
              );
              core.notice(`Added #${issueNumber} <- #${blockerNumber}`);
            }

            const expected = new Map([
              [1, [5, 6, 9]],
              [8, []],
              [9, [4]],
              [10, [8]],
              [11, [60, 37]],
              [15, [5]],
              [16, [5, 15, 64]],
              [22, [21, 23, 59]],
              [29, [27, 68]],
              [59, [60, 61, 37]],
              [62, [59]],
            ]);

            for (const [issueNumber, expectedOpen] of expected) {
              const current = await blockers(issueNumber);
              const open = current.filter(x => x.state === 'open').map(x => x.number).sort((a,b)=>a-b);
              const want = [...expectedOpen].sort((a,b)=>a-b);
              if (JSON.stringify(open) !== JSON.stringify(want)) {
                throw new Error(`#${issueNumber} open blocked_by=${open.join(',')} expected=${want.join(',')}`);
              }
              core.notice(`Verified #${issueNumber}: ${open.join(',') || 'none'}`);
            }
