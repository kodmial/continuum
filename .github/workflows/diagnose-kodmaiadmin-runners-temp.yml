name: Diagnose kodmaiadmin runners

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'diagnose-kodmaiadmin-runners'
    runs-on: ubuntu-latest
    steps:
      - name: List runner metadata
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          gh api repos/kodmial/kodmaiadmin/actions/runners             --jq '{total_count, runners: [.runners[] | {name,status,busy,labels:[.labels[].name]}]}'
