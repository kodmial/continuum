name: Diagnose kodmaiadmin billing

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'diagnose-kodmaiadmin-billing'
    runs-on: ubuntu-latest
    steps:
      - name: Check Actions billing metadata
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='users/kodmial/settings/billing/usage/summary?year=2026&month=9&product=Actions'
          if out="$(gh api "$endpoint" 2>/tmp/billing.err)"; then
            jq '{timePeriod, usageItems: [.usageItems[] | {product,sku,unitType,grossQuantity,discountQuantity,netQuantity,grossAmount,netAmount}]}' <<<"$out"
          else
            echo "Billing API unavailable to this token:"
            sed -E 's/(token|authorization|bearer)[^ ]*/[redacted]/Ig' /tmp/billing.err
          fi
