name: Continuum reusable child dispatcher

on:
  workflow_call:
    inputs:
      worker_workflow:
        description: >-
          Entry workflow file that runs one delegated child task. Left unset,
          it resolves from CONTINUUM_CHILD_WORKER_WORKFLOW, because the file a
          parent's tasks run in is the parent's own choice.
        type: string
        required: false
      review_workflow:
        description: >-
          Entry workflow file that reviews one delegated child task. Left
          unset, it resolves from CONTINUUM_CHILD_REVIEW_WORKFLOW.
        type: string
        required: false
      manual_pr_review_workflow:
        description: >-
          Entry workflow file that reviews owner-created child pull requests.
          Left unset, it resolves from CONTINUUM_CHILD_PR_REVIEW_WORKFLOW.
        type: string
        required: false
      engine_repository:
        description: >-
          Repository that hosts the Continuum release this run is part of. The
          caller already names it in its `uses:` line, and GitHub forbids an
          expression there, so the same literal is declared here as well. What
          Continuum does *not* accept is a second choice of ref: the release is
          the commit of this workflow file, read from the run itself.
        type: string
        required: true
    secrets:
      CHILD_RUNTIME_TOKEN:
        required: true
      CHILD_RUNTIME_REPOSITORIES:
        required: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.CHILD_RUNTIME_TOKEN }}
      CHILD_REPOSITORIES: ${{ secrets.CHILD_RUNTIME_REPOSITORIES }}
      # An explicit input wins; otherwise the parent's own variable names the
      # file. Whichever way it resolves, an empty value is a configuration error
      # the cycle refuses, not a file name Continuum supplies.
      WORKER_WORKFLOW: ${{ inputs.worker_workflow || vars.CONTINUUM_CHILD_WORKER_WORKFLOW }}
      REVIEW_WORKFLOW: ${{ inputs.review_workflow || vars.CONTINUUM_CHILD_REVIEW_WORKFLOW }}
      MANUAL_PR_REVIEW_WORKFLOW: ${{ inputs.manual_pr_review_workflow || vars.CONTINUUM_CHILD_PR_REVIEW_WORKFLOW }}
      # Consumer policy: which issue labels carry which dispatch priority, the
      # marker that makes a child issue opt in, and the opt-in marker and branch
      # prefix an earlier Continuum release wrote. All of it is the parent's
      # own labelling convention, so none of it is Continuum's to guess.
      PRIORITY_LABELS: ${{ vars.CONTINUUM_DISPATCH_PRIORITY_LABELS }}
      TASK_OPT_IN_MARKER: ${{ vars.CONTINUUM_TASK_OPT_IN_MARKER }}
      LEGACY_TASK_MARKER: ${{ vars.CONTINUUM_LEGACY_TASK_MARKER }}
      LEGACY_TASK_BRANCH_PREFIX: ${{ vars.CONTINUUM_LEGACY_TASK_BRANCH_PREFIX }}
    steps:
      - name: Checkout parent control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the selected Continuum release
        id: engine
        shell: bash
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ENGINE_REPOSITORY: ${{ inputs.engine_repository }}
        run: |
          set -euo pipefail
          # job.workflow_sha is the commit of this reusable workflow definition
          # as selected by the caller's `uses:` reference, so the engine this
          # run executes is exactly the release the consumer pinned. Nothing in
          # the call can point it anywhere else, which is the whole point: a
          # ref input here would be a way to run Continuum other than the
          # release the consumer chose.
          if [[ -z "${ENGINE_REPOSITORY:-}" ]]; then
            echo "::error::engine_repository is unset; name the Continuum to run"
            exit 1
          fi
          sha="${JOB_WORKFLOW_SHA:-}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the selected Continuum release must be a full commit sha, got '${sha}'"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "engine $sha"

      - name: Checkout the selected Continuum release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ steps.engine.outputs.sha }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse any other commit
        shell: bash
        env:
          ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git -C .continuum-engine rev-parse HEAD)"
          if [[ "$head" != "$ENGINE_SHA" ]]; then
            echo "::error::engine checked out at $head, expected $ENGINE_SHA"
            exit 1
          fi
          echo "engine $head is the selected release"

      - name: Export Continuum engine root
        shell: bash
        run: |
          set -euo pipefail
          echo "CONTINUUM_ENGINE_ROOT=$GITHUB_WORKSPACE/.continuum-engine" >> "$GITHUB_ENV"

      - name: Reconcile configured children
        shell: bash
        run: |
          set -euo pipefail
          # Every one of these is the parent's own naming convention. Guessing
          # any of them would dispatch work the parent never opted in to, so an
          # unset variable stops the cycle instead of picking something plausible.
          for required_setting in WORKER_WORKFLOW REVIEW_WORKFLOW MANUAL_PR_REVIEW_WORKFLOW; do
            if [[ -z "${!required_setting:-}" ]]; then
              echo "::error::$required_setting is unset; pass the workflow as an input or set its CONTINUUM_* repository variable"
              exit 2
            fi
          done
          for required_setting in PRIORITY_LABELS TASK_OPT_IN_MARKER; do
            if [[ -z "${!required_setting:-}" ]]; then
              echo "::error::repository variable ${required_setting} is required to dispatch delegated child work"
              exit 2
            fi
          done

          # Delegated task branches carry one prefix Continuum owns; an earlier
          # Continuum release used a second one, and a repository that has not
          # finished migrating declares it. An unset legacy prefix simply does
          # not participate, which is the correct end state.
          TASK_BRANCH_PREFIX="continuum-child/"
          TASK_BRANCH_PATTERN="$TASK_BRANCH_PREFIX"
          if [[ -n "$LEGACY_TASK_BRANCH_PREFIX" ]]; then
            TASK_BRANCH_PATTERN="$TASK_BRANCH_PREFIX|$LEGACY_TASK_BRANCH_PREFIX"
          fi

          export PYTHONPATH="$CONTINUUM_ENGINE_ROOT/src"
          resolver="$CONTINUUM_ENGINE_ROOT/.github/scripts/delegation_repository.sh"
          plan="$(PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES" bash "$resolver" plan)"

          active_titles="$(
            gh run list --repo "$GITHUB_REPOSITORY" --limit 100               --json status,displayTitle               --jq '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .displayTitle'               2>/dev/null || true
          )"

          task_active() {
            local child_id="$1" kind="$2" task="$3"
            grep -Fxq "Child $kind [$child_id] #$task" <<<"$active_titles"
          }

          manual_pr_active() {
            local child_id="$1" pr="$2"
            grep -Fxq "Child PR review [$child_id] #$pr" <<<"$active_titles"
          }

          invalid=0
          dispatched=0

          while IFS= read -r row; do
            [[ -n "$row" ]] || continue
            child_id="$(jq -r '.id' <<<"$row")"
            child_repo="$(jq -r '.repository' <<<"$row")"

            if ! PARENT_CONFIG=.continuum.yml CHILD_REPOSITORIES="$CHILD_REPOSITORIES" \
              bash "$resolver" verify "$child_id" "$child_repo" >/dev/null 2>&1; then
              echo "::error::Child '$child_id' relationship verification failed."
              invalid=$((invalid + 1))
              continue
            fi

            # Delegated tasks must not become permanently stranded because a
            # previous controller closed their PR. Reopen automation-owned
            # unmerged PRs while the task is still open; explicit dependency
            # markers remain the source of intentional blocking.
            while IFS=$'\t' read -r stale_pr stale_head; do
              [[ -n "$stale_pr" && -n "$stale_head" ]] || continue
              stale_task="$(
                sed -nE "s#^(${TASK_BRANCH_PATTERN})/task-([0-9]+)-.*#\2#p" <<<"$stale_head"
              )"
              [[ -n "$stale_task" ]] || continue
              stale_issue_json="$(
                gh api "repos/$child_repo/issues/$stale_task" 2>/dev/null || true
              )"
              stale_issue_state="$(jq -r '.state // "closed"' <<<"$stale_issue_json")"
              [[ "$stale_issue_state" == "open" ]] || continue

              # A closed delegated PR is recoverable only when the task is
              # actually ready. Never resurrect a superseded implementation
              # whose issue is still dependency-blocked.
              stale_body="$(jq -r '.body // ""' <<<"$stale_issue_json")"
              stale_ready=true
              stale_deps="$(
                sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p' \
                  <<<"$stale_body" | head -1 | tr ',' ' '
              )"
              for stale_dep in $stale_deps; do
                stale_dep="${stale_dep//#/}"
                stale_dep="${stale_dep//[[:space:]]/}"
                [[ "$stale_dep" =~ ^[0-9]+$ ]] || continue
                stale_dep_state="$(
                  gh api "repos/$child_repo/issues/$stale_dep" --jq '.state' 2>/dev/null || echo open
                )"
                if [[ "$stale_dep_state" != "closed" ]]; then
                  stale_ready=false
                  break
                fi
              done
              [[ "$stale_ready" == true ]] || continue

              if gh pr reopen "$stale_pr" --repo "$child_repo" >/dev/null 2>&1; then
                echo "Reopened stale delegated PR #$stale_pr for child task #$stale_task."
              fi
            done < <(
              gh pr list --repo "$child_repo" --state closed --limit 100 \
                --json number,headRefName,mergedAt \
                --arg task_prefix "$TASK_BRANCH_PREFIX" \
                --arg legacy_prefix "$LEGACY_TASK_BRANCH_PREFIX" \
                --jq '.[] | select(.mergedAt == null) | select(
                    (.headRefName | startswith($task_prefix)) or
                    (($legacy_prefix | length) > 0 and (.headRefName | startswith($legacy_prefix)))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )

            open_prs="$(
              gh pr list --repo "$child_repo" --state open --limit 100 \
                --json number,headRefName \
                --arg task_prefix "$TASK_BRANCH_PREFIX" \
                --arg legacy_prefix "$LEGACY_TASK_BRANCH_PREFIX" \
                --jq 'sort_by(.number) | reverse | .[] | select(
                    (.headRefName | startswith($task_prefix)) or
                    (($legacy_prefix | length) > 0 and (.headRefName | startswith($legacy_prefix)))
                  ) | [.number,.headRefName] | @tsv' 2>/dev/null || true
            )"
            open_pr_tasks="$(
              cut -f2 <<<"$open_prs" \
                | sed -nE "s#^(${TASK_BRANCH_PATTERN})/task-([0-9]+)-.*#\2#p"
            )"

            if [[ -n "$open_prs" ]]; then
              selected_review_tasks=""
              while IFS=$'\t' read -r pr_number head_ref; do
                [[ -n "$pr_number" ]] || continue
                task_number="$(
                  sed -nE "s#^(${TASK_BRANCH_PATTERN})/task-([0-9]+)-.*#\2#p" <<<"$head_ref"
                )"
                [[ -n "$task_number" ]] || continue

                # A completed child task must never resurrect through a stale
                # retry PR. Close leftovers immediately.
                task_state="$(
                  gh api "repos/$child_repo/issues/$task_number" --jq '.state' 2>/dev/null || echo closed
                )"
                if [[ "$task_state" != "open" ]]; then
                  gh pr comment "$pr_number" --repo "$child_repo" \
                    --body "Closed automatically: delegated task #$task_number is already completed." \
                    >/dev/null 2>&1 || true
                  gh pr close "$pr_number" --repo "$child_repo" >/dev/null 2>&1 || true
                  echo "Closed stale delegated PR #$pr_number for completed task #$task_number."
                  continue
                fi

                # Only the newest open retry for a task enters delegated review
                # during one dispatcher cycle.
                if grep -Fxq "$task_number" <<<"$selected_review_tasks"; then
                  echo "Skipping duplicate delegated PR #$pr_number for task #$task_number in this cycle."
                  continue
                fi
                selected_review_tasks+="$task_number"$'\n'

                if task_active "$child_id" task "$task_number" ||
                   task_active "$child_id" review "$task_number"; then
                  continue
                fi
                gh workflow run "$REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                  -f child_id="$child_id" \
                  -f task_number="$task_number" \
                  -f pr_number="$pr_number" >/dev/null
                dispatched=$((dispatched + 1))
              done <<<"$open_prs"
            fi

            # Owner-created same-repository PRs are first-class child work even
            # when they have no source issue. Automation-owned task branches
            # keep the stronger issue-based review path above.
            manual_prs="$(
              gh api --paginate "repos/$child_repo/pulls?state=open&per_page=100" \
                --arg task_prefix "$TASK_BRANCH_PREFIX" \
                --arg legacy_prefix "$LEGACY_TASK_BRANCH_PREFIX" \
                --jq '.[] |
                  select(.draft == false) |
                  select(.head.repo.full_name == .base.repo.full_name) |
                  select(.user.login == .base.repo.owner.login) |
                  select(
                    ((.head.ref | startswith($task_prefix)) or
                     (($legacy_prefix | length) > 0 and (.head.ref | startswith($legacy_prefix)))) | not
                  ) |
                  select(([.labels[]?.name] | index("no-auto-merge")) | not) |
                  .number' 2>/dev/null || true
            )"

            if [[ -n "$manual_prs" ]]; then
              while IFS= read -r manual_pr; do
                [[ -n "$manual_pr" ]] || continue
                manual_pr_active "$child_id" "$manual_pr" && continue
                gh workflow run "$MANUAL_PR_REVIEW_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
                  -f child_id="$child_id" \
                  -f pr_number="$manual_pr" >/dev/null
                dispatched=$((dispatched + 1))
                echo "Dispatched owner-created child PR #$manual_pr for independent review."
              done <<<"$manual_prs"
            fi

            issues_json="$(
              gh api --paginate "repos/$child_repo/issues?state=open&per_page=100" 2>/dev/null
            )"

            # A delegated technical failure must never turn automation:paused
            # into a terminal state. Clear stale pause labels on automation-
            # owned child tasks and let dependency markers decide readiness.
            while IFS= read -r paused_task; do
              [[ -n "$paused_task" ]] || continue
              gh api --method DELETE \
                "repos/$child_repo/issues/$paused_task/labels/automation%3Apaused" \
                >/dev/null 2>&1 || true
              echo "Cleared stale automation:paused on child task #$paused_task."
            done < <(
              jq -r --arg opt_in "$TASK_OPT_IN_MARKER" \
                    --arg legacy_marker "$LEGACY_TASK_MARKER" '
                .[]
                | select(.pull_request == null)
                | select(any(.labels[]?.name; . == "automation:paused"))
                | select(
                    ((.body // "") | contains($opt_in)) or
                    ((($legacy_marker | length) > 0) and ((.body // "") | contains($legacy_marker)))
                  )
                | .number
              ' <<<"$issues_json"
            )
            issues_json="$(
              jq --arg opt_in "$TASK_OPT_IN_MARKER" \
                 --arg legacy_marker "$LEGACY_TASK_MARKER" '
                map(
                  if (
                    ((.body // "") | contains($opt_in)) or
                    ((($legacy_marker | length) > 0) and ((.body // "") | contains($legacy_marker)))
                  )
                  then .labels = [(.labels[]? | select(.name != "automation:paused"))]
                  else .
                  end
                )
              ' <<<"$issues_json"
            )"

            for priority in $PRIORITY_LABELS; do
              while IFS= read -r encoded; do
                [[ -n "$encoded" ]] || continue
                decoded="$(base64 -d <<<"$encoded")"
                task_number="$(jq -r '.[0]' <<<"$decoded")"
                body="$(jq -r '.[1]' <<<"$decoded")"

                task_active "$child_id" task "$task_number" && continue
                task_active "$child_id" review "$task_number" && continue
                grep -qx "$task_number" <<<"$open_pr_tasks" && continue

                ready=true
                deps="$(
                  sed -nE 's/.*<!-- *automation-blocked-by: *([^>]*) *-->.*/\1/p'                     <<<"$body" | head -1 | tr ',' ' '
                )"
                for dep in $deps; do
                  dep="${dep//#/}"
                  dep="${dep//[[:space:]]/}"
                  [[ "$dep" =~ ^[0-9]+$ ]] || continue
                  state="$(
                    gh api "repos/$child_repo/issues/$dep" --jq '.state' 2>/dev/null || echo open
                  )"
                  if [[ "$state" != "closed" ]]; then
                    ready=false
                    break
                  fi
                done
                [[ "$ready" == true ]] || continue

                gh workflow run "$WORKER_WORKFLOW" --repo "$GITHUB_REPOSITORY"                   -f child_id="$child_id"                   -f task_number="$task_number" >/dev/null
                dispatched=$((dispatched + 1))
              done < <(
                jq -r --arg p "$priority" \
                   --arg opt_in "$TASK_OPT_IN_MARKER" \
                   --arg legacy_marker "$LEGACY_TASK_MARKER" '
                  .[]
                  | select(.pull_request == null)
                  | select(any(.labels[]?.name; . == $p))
                  | select(all(.labels[]?.name; . != "automation:paused"))
                  | select(
                      ((.body // "") | contains($opt_in)) or
                      ((($legacy_marker | length) > 0) and ((.body // "") | contains($legacy_marker)))
                    )
                  | [.number, (.body // "")]
                  | @base64
                ' <<<"$issues_json"
              )
            done
          done < <(jq -c '.[]' <<<"$plan")

          echo "Reconciled configured child relationships; dispatched $dispatched run(s)."
          if [[ "$invalid" -gt 0 ]]; then
            echo "::error::$invalid configured child relationship(s) failed bidirectional verification."
            exit 2
          fi
