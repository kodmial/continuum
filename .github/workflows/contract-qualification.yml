name: Contract qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The former `mode: canary` dispatch path moved with Layer 3: to run the
  # live canary manually, dispatch contract-qualification-canary.yml, which
  # runs this verify layer followed by the shared canary workflow. This entry
  # stays verify-only so untrusted PR code never receives issue/action writes.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number carrying the candidate HEAD
        required: false
        type: string
      head_sha:
        description: Exact HEAD SHA to qualify instead of the PR head
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  call:
    uses: ./.github/workflows/continuum-contract-qualification.yml
    secrets: inherit
    with:
      continuum_ref: main
      pr_number: "${{ inputs.pr_number || github.event.pull_request.number }}"
      head_sha: "${{ inputs.head_sha || github.event.pull_request.head.sha }}"
