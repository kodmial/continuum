name: PR Agent (OpenCode backend)

on:
  workflow_call:
    outputs:
      admitted:
        description: Whether the exact PR HEAD was admitted for review.
        value: ${{ jobs.pr_agent.outputs.admitted }}
      head_sha:
        description: Exact PR HEAD reviewed by upstream PR-Agent.
        value: ${{ jobs.pr_agent.outputs.head_sha }}
      review_json:
        description: Native upstream PR-Agent structured review JSON for head_sha.
        value: ${{ jobs.pr_agent.outputs.review_json }}
      improve_jsonl:
        description: Native upstream /improve push_outputs JSONL for head_sha.
        value: ${{ jobs.pr_agent.outputs.improve_jsonl }}
      persistent_state_json:
        description: Native upstream persistent finding state for head_sha.
        value: ${{ jobs.pr_agent.outputs.persistent_state_json }}
      needs_repair:
        description: Whether current native review/improve output requires repair.
        value: ${{ jobs.pr_agent.outputs.needs_repair }}
      ready_to_merge:
        description: Whether review policy is safe-to-merge with no actionable items.
        value: ${{ jobs.pr_agent.outputs.ready_to_merge }}
      needs_rereview:
        description: Whether a blocking recommendation has no actionable payload and needs bounded re-review.
        value: ${{ jobs.pr_agent.outputs.needs_rereview }}
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
      pr_number:
        description: Pull request number to review. Empty resolves from the event.
        type: string
        default: ''
        required: false
      target_child_id:
        description: Opaque verified child id for delegated execution. Empty targets the caller repository.
        type: string
        default: ''
        required: false
      expected_head_sha:
        description: Exact HEAD SHA the caller observed. Empty resolves from GitHub.
        type: string
        default: ''
        required: false
      api_base:
        description: >-
          OpenAI-compatible backend base URL PR-Agent talks to. Empty falls
          back to vars.PR_AGENT_API_BASE, then to the runner-local bridge
          (http://127.0.0.1:<bridge_port>/v1).
        type: string
        default: ''
        required: false
      model:
        description: >-
          LiteLLM model id PR-Agent requests (openai/ prefix routes through
          the bridge). Empty falls back to vars.PR_AGENT_MODEL, then to
          'openai/continuum-review'.
        type: string
        default: ''
        required: false
      max_tokens:
        description: >-
          Token/output limit forwarded as the custom-model cap. Empty falls
          back to vars.PR_AGENT_MAX_TOKENS, then to '128000'.
        type: string
        default: ''
        required: false
      opencode_model:
        description: >-
          OpenCode provider/model the bridge infers with. Empty falls back to
          vars.OPENCODE_MODEL, then to the free
          'opencode/muse-spark-1.3-contributor-free' route. No paid-provider
          secret is ever required.
        type: string
        default: ''
        required: false
      bridge_port:
        description: >-
          Loopback port the compatibility bridge binds. Empty falls back to
          vars.PR_AGENT_BRIDGE_PORT, then to '18000'.
        type: string
        default: ''
        required: false
      server_port:
        description: >-
          Loopback port `opencode serve` binds. Empty falls back to
          vars.PR_AGENT_OPENCODE_PORT, then to '4096'.
        type: string
        default: ''
        required: false
      pr_agent_version:
        description: >-
          Pinned upstream PR-Agent release installed on the runner. Empty falls
          back to vars.PR_AGENT_VERSION, then to '0.46.0'.
        type: string
        default: ''
        required: false
      retry_attempt:
        description: Bounded PR-Agent retry attempt number (0 = initial run).
        type: string
        default: '0'
        required: false
      retry_workflow:
        description: Caller workflow filename used for isolated PR-Agent retries.
        type: string
        default: 'continuum-pr-agent.yml'
        required: false
      recovery_kind:
        description: "Durable recovery operation identity: review or repair."
        type: string
        default: 'review'
        required: false
      ci_workflow_name:
        description: Exact workflow name proving current-head CI.
        type: string
        default: ''
        required: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

# Orchestration serialization (issue #227): this reusable layer owns the only
# authoritative per-PR serialization for PR-Agent operations. The
# workflow-level group below serializes the whole run, including the
# downstream repair/merge wrappers that consume `admitted` outputs, so a
# stale run past `pr_agent` can never run its downstream jobs in parallel
# with the new run (no duplicate publish/auto-merge races). Callers carry
# no concurrency block so no-op issue_comment runs can never queue ahead of
# useful exact-HEAD work. There is no unconditional preemption: an
# out-of-order or duplicate old-HEAD event must never cancel newer
# exact-HEAD work, and same-HEAD duplicates coalesce instead of
# cancelling/restarting. Staleness is decided by exact-HEAD comparison only
# (stale_review_may_be_cancelled): the admission expected-HEAD check, the
# before/after review revalidation, and the retry-backoff HEAD recheck below
# implement that predicate. Repair publication keeps its own
# non-cancellable per-PR-HEAD group in continuum-pr-agent-repair.yml and is
# never interrupted by serialized review work
# (repair_is_protected_from_review_preemption): the review group itself
# is non-preemptive (cancel-in-progress: false). The group is additionally
# scoped by the opaque delegated child id while preserving the exact local
# string when empty: only the opaque id ever appears here, never a concrete
# child repository name.

concurrency:
  group: ${{ inputs.target_child_id && format('pr-agent-child-{0}-{1}', inputs.target_child_id, github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id) || format('pr-agent-{0}', github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id) }}
  cancel-in-progress: false

jobs:
  pr_agent:
    # Verified child repositories never execute PR-Agent locally: the parent
    # control plane is the only automatic execution plane for child PR-Agent
    # (issue #244). Delegated runs execute in the parent (role=parent), so
    # this gate only suppresses child-local execution while local/non-child
    # behavior is unchanged.
    if: vars.CONTINUUM_ROLE != 'child'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_PR_AGENT_TIMEOUT_MINUTES || '60') }}
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      pr_number: ${{ steps.stack.outputs.pr_number }}
      review_provider: ${{ steps.stack.outputs.stack }}
      head_sha: ${{ steps.result.outputs.head_sha }}
      review_json: ${{ steps.pragent.outputs.review }}
      improve_jsonl: ${{ steps.improve_output.outputs.improve_jsonl }}
      persistent_state_json: ${{ steps.persistent.outputs.persistent_state_json }}
      needs_repair: ${{ steps.route.outputs.needs_repair }}
      ready_to_merge: ${{ steps.route.outputs.ready_to_merge }}
      needs_rereview: ${{ steps.route.outputs.needs_rereview }}
      retry_attempt: ${{ steps.stack.outputs.retry_attempt }}
      retry_workflow: ${{ steps.stack.outputs.retry_workflow }}
      recovery_kind: ${{ steps.stack.outputs.recovery_kind }}

    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Resolve the isolated PR-Agent stack
        id: stack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || '' }}
          INPUT_EXPECTED_HEAD: ${{ inputs.expected_head_sha || github.event.inputs.expected_head_sha || '' }}
          INPUT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || github.event.inputs.retry_attempt || '0' }}
          INPUT_RETRY_WORKFLOW: ${{ inputs.retry_workflow || '' }}
          INPUT_RECOVERY_KIND: ${{ inputs.recovery_kind || github.event.inputs.recovery_kind || 'review' }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
          INPUT_OPENCODE_MODEL: ${{ inputs.opencode_model }}
          INPUT_BRIDGE_PORT: ${{ inputs.bridge_port }}
          INPUT_SERVER_PORT: ${{ inputs.server_port }}
          INPUT_PR_AGENT_VERSION: ${{ inputs.pr_agent_version }}
          CFG_API_BASE: ${{ vars.PR_AGENT_API_BASE }}
          CFG_MODEL: ${{ vars.PR_AGENT_MODEL }}
          CFG_MAX_TOKENS: ${{ vars.PR_AGENT_MAX_TOKENS }}
          CFG_OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          CFG_BRIDGE_PORT: ${{ vars.PR_AGENT_BRIDGE_PORT }}
          CFG_SERVER_PORT: ${{ vars.PR_AGENT_OPENCODE_PORT }}
          CFG_PR_AGENT_VERSION: ${{ vars.PR_AGENT_VERSION }}
        with:
          github-token: ${{ github.token }}
          script: |
            // A single selector owns the whole review stack.
            const pick = (input, vars, fallback) =>
              String(input || process.env[vars] || fallback || '').trim();
            const reviewProvider = pick(
              process.env.INPUT_REVIEW_PROVIDER,
              'CFG_REVIEW_PROVIDER',
              'none'
            ).toLowerCase();
            if (!['none', 'coderabbit', 'pr-agent'].includes(reviewProvider)) {
              core.setFailed(
                `Invalid CONTINUUM_REVIEW_PROVIDER="${reviewProvider}". Expected none, coderabbit, or pr-agent.`
              );
              return;
            }
            const enabled = reviewProvider === 'pr-agent';
            const eventPr =
              context.payload.pull_request?.number ||
              context.payload.issue?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              '';
            const prNumber = String(process.env.INPUT_PR_NUMBER || eventPr || '').trim();
            if (!prNumber) {
              core.setFailed('PR-Agent could not resolve a pull request number.');
              return;
            }
            const bridgePort = pick(process.env.INPUT_BRIDGE_PORT, 'CFG_BRIDGE_PORT', '18000');
            const apiBase = pick(
              process.env.INPUT_API_BASE, 'CFG_API_BASE', `http://127.0.0.1:${bridgePort}/v1`
            );
            core.setOutput('enabled', enabled ? 'true' : 'false');
            core.setOutput('stack', enabled ? 'pr-agent' : reviewProvider);
            core.setOutput('pr_number', prNumber);
            const retryAttempt = String(process.env.INPUT_RETRY_ATTEMPT || '0').trim();
            if (!/^\d+$/.test(retryAttempt)) {
              core.setFailed('PR-Agent retry_attempt must be a non-negative integer.');
              return;
            }
            core.setOutput('retry_attempt', retryAttempt);
            const retryWorkflow =
              String(process.env.INPUT_RETRY_WORKFLOW || 'continuum-pr-agent.yml').trim();
            if (!['continuum-pr-agent.yml', 'pr-agent.yml'].includes(retryWorkflow)) {
              core.setFailed(
                'PR-Agent retry_workflow must be continuum-pr-agent.yml or pr-agent.yml.'
              );
              return;
            }
            core.setOutput('retry_workflow', retryWorkflow);
            const recoveryKind =
              String(process.env.INPUT_RECOVERY_KIND || 'review').trim().toLowerCase();
            if (!['review', 'repair'].includes(recoveryKind)) {
              core.setFailed('PR-Agent recovery_kind must be review or repair.');
              return;
            }
            core.setOutput('recovery_kind', recoveryKind);
            const eventExpectedHead = context.payload.workflow_run?.head_sha || '';
            core.setOutput(
              'expected_head',
              String(process.env.INPUT_EXPECTED_HEAD || eventExpectedHead || '').trim()
            );
            core.setOutput('api_base', apiBase);
            core.setOutput('model', pick(process.env.INPUT_MODEL, 'CFG_MODEL', 'openai/continuum-review'));
            core.setOutput('max_tokens', pick(process.env.INPUT_MAX_TOKENS, 'CFG_MAX_TOKENS', '128000'));
            core.setOutput(
              'opencode_model',
              pick(process.env.INPUT_OPENCODE_MODEL, 'CFG_OPENCODE_MODEL', 'opencode/muse-spark-1.3-contributor-free')
            );
            core.setOutput('bridge_port', bridgePort);
            core.setOutput('server_port', pick(process.env.INPUT_SERVER_PORT, 'CFG_SERVER_PORT', '4096'));
            core.setOutput(
              'pr_agent_version', pick(process.env.INPUT_PR_AGENT_VERSION, 'CFG_PR_AGENT_VERSION', '0.46.0')
            );

      - name: Resolve PR-Agent target context
        if: steps.stack.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          READ_GITHUB_TOKEN: ${{ github.token }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          CONTINUUM_SOURCE_REPO="kodmial/continuum"
          if [[ -z "${TARGET_CHILD_ID:-}" ]]; then
            # Local fast path: no delegated resolver is needed, so skip every
            # network fetch and resolve directly from the execution repository.
            # A previously local-only review must not fail on resolver-fetch
            # rate limits, token scopes, or transient network errors, and must
            # not require CONTINUUM_REF.
            if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "${GITHUB_REPOSITORY%%/*}" =~ ^\.+$ ]] || [[ "${GITHUB_REPOSITORY#*/}" =~ ^\.+$ ]]; then
              echo "::error::PR-Agent target repository identity is invalid."
              exit 2
            fi
            {
              printf 'CONTINUUM_PR_AGENT_TARGET_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
              printf 'CONTINUUM_PR_AGENT_TARGET_OWNER=%s\n' "${GITHUB_REPOSITORY%%/*}"
              printf 'CONTINUUM_PR_AGENT_TARGET_REPO=%s\n' "${GITHUB_REPOSITORY#*/}"
              printf 'CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED=%s\n' "false"
            } >> "$GITHUB_ENV"
            echo "PR-Agent target context resolved locally."
            exit 0
          fi
          : "${CONTINUUM_REF:?CONTINUUM_REF is required for pinned target resolution}"
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts" "$RUNTIME_ROOT/src/continuum"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! GH_TOKEN="$READ_GITHUB_TOKEN" gh api --method GET "repos/$CONTINUUM_SOURCE_REPO/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | continuum_b64_decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          fetch_runtime_file "src/continuum/__init__.py" "$RUNTIME_ROOT/src/continuum/__init__.py"
          fetch_runtime_file "src/continuum/config.py" "$RUNTIME_ROOT/src/continuum/config.py"
          fetch_runtime_file "src/continuum/yamlmini.py" "$RUNTIME_ROOT/src/continuum/yamlmini.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          # The parent config lives in the execution repository: fetch its
          # default branch, never the Continuum engine pin (which may not
          # exist in the execution repository).
          if ! GH_TOKEN="$READ_GITHUB_TOKEN" gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | continuum_b64_decode > "$PARENT_CONFIG_FILE" 2>/dev/null || [[ ! -s "$PARENT_CONFIG_FILE" ]]; then
            echo "::error::Unable to load the parent Continuum configuration for delegated target resolution; refusing to guess."
            exit 1
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"

      - name: Fail closed when delegated without PAT
        if: steps.stack.outputs.enabled == 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi

      - name: Report the disabled provider explicitly
        if: steps.stack.outputs.enabled != 'true'
        run: echo "PR-Agent skipped because CONTINUUM_REVIEW_PROVIDER is not pr-agent."

      - name: Admit only a review-ready PR with green CI on the exact HEAD
        if: steps.stack.outputs.enabled == 'true'
        id: admit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.stack.outputs.expected_head }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
        with:
          # Target-aware admission (pulls.get plus exact-HEAD workflow-run
          # evidence against the resolved target repository). Local
          # same-repository reads use github.token; delegated cross-repository
          # reads require TAP_PAT. The fallback is gated on non-delegated runs
          # so a delegated run without PAT yields an empty token instead of
          # silently reading as github.token (auth itself fails closed before
          # the embedded script runs). Only the opaque child id ever selects
          # the target; concrete repository identity stays runner-local.
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            // Admission: open, non-draft, same-repo PR whose exact current HEAD
            // has green CI. Anything else is skipped, never reviewed.
            if (process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true' &&
                !String(process.env.TAP_PAT || '').trim()) {
              core.setFailed(
                'Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token.'
              );
              return;
            }
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is not open; skipping PR-Agent review.`);
              return;
            }
            if (pr.draft) {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is a draft; skipping PR-Agent review.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== process.env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY) {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is not same-repo; skipping PR-Agent review.`);
              return;
            }
            const headSha = pr.head.sha;
            core.setOutput('head_sha', headSha);
            const expected = String(process.env.EXPECTED_HEAD || '').trim().toLowerCase();
            if (expected && expected !== headSha.toLowerCase()) {
              // A moved HEAD is a normal race: an earlier review/repair dispatch
              // may arrive after another repair or main-sync already advanced the
              // PR. Never publish a red review state for an obsolete SHA.
              core.setOutput('admitted', 'false');
              core.notice(
                `Stale admission ignored: caller observed ${expected} but PR #${prNumber} is now ${headSha}; recovery will evaluate the current HEAD.`
              );
              return;
            }
            // Exact-current-HEAD CI is determined from the CI workflow run,
            // not the combined Statuses API. PR-Agent's own failure/pending
            // statuses must never make a recovered CI-green HEAD inadmissible.
            const ciWorkflowName = String(process.env.CI_WORKFLOW_NAME || 'CI').trim();
            // Bounded gate read (#254): the head_sha filter is server-side
            // and only the newest matching run decides admission, so two
            // pages bound the cost without walking run history.
            // Target-aware: delegated admission reads the resolved child.
            const runs = [];
            for (let page = 1; page <= 2; page += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo(
                {
                  owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                  repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                  event: 'pull_request',
                  head_sha: headSha,
                  per_page: 100,
                  page,
                }
              );
              const batch = data.workflow_runs || [];
              if (batch.length === 0) break;
              runs.push(...batch);
              if (batch.length < 100) break;
            }
            const latestCi = runs
              .filter(run => run.name === ciWorkflowName && run.head_sha === headSha)
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              )[0];
            const delegatedTarget =
              process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true';
            const delegatedSkippedCi =
              delegatedTarget &&
              latestCi &&
              latestCi.status === 'completed' &&
              latestCi.conclusion === 'skipped';
            if (
              !latestCi ||
              latestCi.status !== 'completed' ||
              (latestCi.conclusion !== 'success' && !delegatedSkippedCi)
            ) {
              core.setOutput('admitted', 'false');
              core.notice(
                `PR #${prNumber} HEAD ${headSha} has no acceptable current-head ` +
                `${ciWorkflowName} evidence; PR-Agent waits for exact-head CI.`
              );
              return;
            }
            core.setOutput('admitted', 'true');
            core.setOutput('head_sha', headSha);
            core.notice(
              `PR #${prNumber} admitted at HEAD ${headSha} with ` +
              (delegatedSkippedCi
                ? 'verified delegated child CI suppression.'
                : 'green CI.')
            );

      - name: Mark PR-Agent review in flight
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
        with:
          # Target-aware status (createCommitStatus against the resolved
          # target). Local same-repository writes use github.token;
          # delegated cross-repository writes require TAP_PAT. The fallback
          # is gated on non-delegated runs so a delegated run without PAT
          # yields an empty token (auth itself fails closed).
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            if (process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true' &&
                !String(process.env.TAP_PAT || '').trim()) {
              core.setFailed(
                'Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token.'
              );
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'continuum/pr-agent-review',
              description: 'PR-Agent review is running',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Checkout the pull request head without exposing delegated repository metadata
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          # Scoped to the resolved target: local same-repository checkout
          # uses github.token so a missing PAT never breaks local-only runs;
          # delegated cross-repository checkout requires TAP_PAT. The fallback
          # is gated on non-delegated runs so a delegated run without PAT
          # yields an empty token (auth itself fails closed before the guard).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          : "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY:?PR-Agent target repository is unset; refusing to fall back to the execution repository.}"
          if ! [[ "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY%%/*}" =~ ^\.+$ ]] || [[ "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY#*/}" =~ ^\.+$ ]]; then
            echo "::error::PR-Agent target repository identity is invalid."
            exit 2
          fi
          if ! [[ "${HEAD_SHA:-}" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "::error::PR-Agent target HEAD is missing or malformed; refusing to checkout."
            exit 1
          fi
          if [[ -n "${PR_NUMBER:-}" ]] && ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::PR-Agent target PR number is malformed; refusing to checkout."
            exit 1
          fi
          worktree="$RUNNER_TEMP/continuum-pr-agent-review-worktree"
          rm -rf "$worktree"
          mkdir -p "$worktree"
          cd "$worktree"
          git init --quiet
          gh auth setup-git >/dev/null 2>&1
          trap 'git config --unset credential.helper || true; git config --unset credential.https://github.com.helper || true; git config --global --unset credential.helper || true; git config --global --unset credential.https://github.com.helper || true' EXIT
          git remote add origin "https://github.com/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY.git"
          fetched=false
          for attempt in 1 2 3; do
            if git fetch --depth=1 --no-tags origin "$HEAD_SHA" --quiet >/dev/null 2>&1; then
              fetched=true
              break
            fi
            sleep $((attempt * 5))
          done
          if [[ "$fetched" != true && -n "${PR_NUMBER:-}" ]]; then
            if git fetch --depth=1 --no-tags origin "pull/$PR_NUMBER/head" --quiet >/dev/null 2>&1; then
              fetched=true
            fi
          fi
          if [[ "$fetched" != true ]]; then
            echo "::error::Unable to fetch the exact PR-Agent target HEAD."
            exit 1
          fi
          if ! git checkout --detach FETCH_HEAD --quiet >/dev/null 2>&1 ||
             [[ "$(git rev-parse HEAD)" != "${HEAD_SHA,,}" ]]; then
            echo "::error::Unable to checkout the exact PR-Agent target HEAD."
            exit 1
          fi
          echo "CONTINUUM_PR_AGENT_WORKTREE=$worktree" >> "$GITHUB_ENV"

      - name: Install the pinned upstream PR-Agent release on the runner
        id: install_pragent
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          PR_AGENT_VERSION: ${{ steps.stack.outputs.pr_agent_version }}
          CONTINUUM_IMAGE_DIGEST: ${{ vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Pinned upstream reviewer: PR-Agent v0.46.0 runs on the runner (a
          # Docker action cannot reach the runner-local bridge). The version
          # default is 0.46.0; any other value fails closed below.
          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # PR-Agent 0.46.0. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `pr-agent --version` and the
          # exact pin takes the hit path; an empty digest falls through to
          # deterministic reconstruction below. A cache failure (empty or
          # malformed digest) falls back to deterministic reconstruction
          # below, never failing closed. The digest is bound to the runtime
          # by the image-digest stamp ($HOME/.opencode/image-digest)
          # recorded by the validated image build: a stale or unrelated
          # 0.46.0 binary whose stamp does not match the digest cannot take
          # the hit path. Deterministic reconstruction below never records
          # the stamp, so a later job cannot take the warm path from a
          # reconstruction self-stamp: only the validated image build (or a
          # provider cache restore of it) proves golden-image provenance.
          # Fresh GitHub-hosted runners carry no pre-populated stamp or
          # binaries, so with the default empty digest they take the
          # reconstruction path below: that fall-through is the expected
          # cold path, not a warm hit. The hit path serves jobs whose
          # image build (or provider cache restore) pre-populated the
          # stamp and binaries for this digest.
          if [[ "$PR_AGENT_VERSION" != "0.46.0" ]]; then
            echo "::error::Isolated PR-Agent stack pins upstream v0.46.0, got $PR_AGENT_VERSION."
            exit 1
          fi
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v pr-agent >/dev/null 2>&1 && pr-agent --version 2>&1 | grep -E -q "(^|[^0-9.])0\.46\.0([^0-9.]|$)"; then
            echo "prepared-runtime hit: pr-agent 0.46.0 already present (image digest ${CONTINUUM_IMAGE_DIGEST} matched stamp ${STAMP_FILE} recorded by the validated image build)."
            exit 0
          fi
          python3 -m pip install --quiet "pr-agent==${PR_AGENT_VERSION}"
          pr-agent --version 2>&1 | grep -E -q "(^|[^0-9.])0\.46\.0([^0-9.]|$)" || exit 1

      - name: Install pinned OpenCode CLI for the PR-Agent backend
        id: install_opencode
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          CONTINUUM_IMAGE_DIGEST: ${{ vars.CONTINUUM_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Continuum #179 prepared agent runtime: the immutable golden image
          # (or its provider-native cache equivalent) already carries pinned
          # OpenCode 1.18.34. The warm hit below is keyed by the image digest
          # in CONTINUUM_IMAGE_DIGEST (wired from the repository variable):
          # only a set, well-formed digest plus `command -v opencode` and the
          # exact version takes the hit path with zero downloads. A cache
          # failure (empty or malformed digest) falls back to deterministic
          # reconstruction below, never failing closed. The digest is bound
          # to the runtime by the image-digest stamp
          # ($HOME/.opencode/image-digest) recorded by the validated image
          # build: a stale or unrelated opencode 1.18.34 binary whose stamp
          # does not match the digest cannot take the hit path.
          # Deterministic reconstruction below never records the stamp, so
          # a later job cannot take the warm path from a reconstruction
          # self-stamp: only the validated image build (or a provider cache
          # restore of it) proves golden-image provenance.
          # Fresh GitHub-hosted runners carry no pre-populated stamp or
          # binaries, so with the default empty digest they take the
          # reconstruction path below: that fall-through is the expected
          # cold path, not a warm hit. The hit path serves jobs whose
          # image build (or provider cache restore) pre-populated the
          # stamp and binaries for this digest.
          export PATH="$HOME/.opencode/bin:$PATH"
          STAMP_FILE="$HOME/.opencode/image-digest"
          if [[ -n "${CONTINUUM_IMAGE_DIGEST:-}" ]] && ! [[ "$CONTINUUM_IMAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::CONTINUUM_IMAGE_DIGEST is malformed; falling back to deterministic reconstruction."
            CONTINUUM_IMAGE_DIGEST=""
          fi
          if [[ "${CONTINUUM_IMAGE_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] && [[ -f "$STAMP_FILE" ]] && [[ "$(cat "$STAMP_FILE")" == "$CONTINUUM_IMAGE_DIGEST" ]] && command -v opencode >/dev/null 2>&1 && opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)"; then
            echo "prepared-runtime hit: opencode 1.18.34 already present (image digest ${CONTINUUM_IMAGE_DIGEST} matched stamp ${STAMP_FILE} recorded by the validated image build)."
            echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              export PATH="$HOME/.opencode/bin:$PATH"
              opencode --version 2>&1 | grep -E -q "(^|[^0-9.])1\.18\.34([^0-9.]|$)" || exit 1
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start opencode serve on loopback
        id: start_opencode
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          OPENCODE_MODEL: ${{ steps.stack.outputs.opencode_model }}
          SERVER_PORT: ${{ steps.stack.outputs.server_port }}
        run: |
          set -euo pipefail
          (setsid nohup opencode serve --hostname 127.0.0.1 --port "$SERVER_PORT" \
            > "$RUNNER_TEMP/opencode-serve.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${SERVER_PORT}/global/health" >/dev/null 2>&1; then
              echo "opencode serve is up on 127.0.0.1:${SERVER_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::opencode serve did not become ready."
          cat "$RUNNER_TEMP/opencode-serve.log" || true
          exit 1

      - name: Resolve the Continuum-owned PR-Agent runtime bundle
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-runtime"
          BRIDGE_SCRIPT="$RUNTIME_ROOT/.github/scripts/pr_agent_bridge.py"
          POLICY_SCRIPT="$RUNTIME_ROOT/.github/scripts/pr_agent_policy.js"
          FALLBACK_SCRIPT="$RUNTIME_ROOT/src/continuum/pr_agent_fallback_state.py"
          mkdir -p "$RUNTIME_ROOT/.github/scripts" "$RUNTIME_ROOT/src/continuum"
          gh api --method GET \
            "repos/kodmial/continuum/contents/.github/scripts/pr_agent_bridge.py" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | continuum_b64_decode > "$BRIDGE_SCRIPT"
          gh api --method GET \
            "repos/kodmial/continuum/contents/src/continuum/pr_agent.py" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | continuum_b64_decode > "$RUNTIME_ROOT/src/continuum/pr_agent.py"
          gh api --method GET \
            "repos/kodmial/continuum/contents/.github/scripts/pr_agent_policy.js" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | continuum_b64_decode > "$POLICY_SCRIPT"
          gh api --method GET \
            "repos/kodmial/continuum/contents/src/continuum/pr_agent_fallback_state.py" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | continuum_b64_decode > "$FALLBACK_SCRIPT"
          : > "$RUNTIME_ROOT/src/continuum/__init__.py"
          PYTHONPATH="$RUNTIME_ROOT/src" python3 -m py_compile \
            "$BRIDGE_SCRIPT" "$RUNTIME_ROOT/src/continuum/pr_agent.py" "$FALLBACK_SCRIPT"
          node --check "$POLICY_SCRIPT"
          # Policy-bundle sync: the gate/route/threshold steps below require
          # these exports with fail-closed semantics. Validate immediately so
          # a stale bundle (CONTINUUM_REF predating the improve-skip policy)
          # fails closed here with a clear message instead of throwing in the
          # gate and blocking all admitted HEADs.
          POLICY_SCRIPT="$POLICY_SCRIPT" node -e '
            const p = require(process.env.POLICY_SCRIPT);
            for (const key of [
              "isCleanReviewForImproveSkip",
              "hasIncompleteCoverageSignal",
              "hasToolErrorSignal",
              "hasBlockingSecuritySignal",
              "isSkippedCleanImprovePayload",
              "qualifyingImproveSuggestions",
              "unwrapReview"
            ]) {
              if (typeof p[key] !== "function") {
                console.error("::error::Continuum PR-Agent policy bundle is missing export: " + key);
                process.exit(1);
              }
            }
            if (!/^[0-9]+$/.test(String(p.IMPROVE_REPAIR_THRESHOLD))) {
              console.error("::error::Invalid centralized PR-Agent improve threshold in policy bundle.");
              process.exit(1);
            }
            if (!/^[0-9]+$/.test(String(p.REVIEW_MAX_FINDINGS))) {
              console.error("::error::Invalid centralized PR-Agent review findings cap in policy bundle.");
              process.exit(1);
            }
            if (typeof p.REVIEW_MERGE_SAFE !== "string" || !p.REVIEW_MERGE_SAFE.trim()) {
              console.error("::error::Invalid centralized PR-Agent merge-safe recommendation in policy bundle.");
              process.exit(1);
            }
          '
          echo "bridge_script=$BRIDGE_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "policy_script=$POLICY_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "fallback_pythonpath=$RUNTIME_ROOT/src" >> "$GITHUB_OUTPUT"

      - name: Start the OpenAI-compatibility bridge on loopback
        id: start_bridge
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          OPENCODE_SERVER_URL: http://127.0.0.1:${{ steps.stack.outputs.server_port }}
          OPENCODE_MODEL: ${{ steps.stack.outputs.opencode_model }}
          PR_AGENT_BRIDGE_PORT: ${{ steps.stack.outputs.bridge_port }}
          PR_AGENT_TIMEOUT_SECONDS: '170'
          BRIDGE_SCRIPT: ${{ steps.runtime.outputs.bridge_script }}
        run: |
          set -euo pipefail
          [[ -s "$BRIDGE_SCRIPT" ]] || { echo "::error::Continuum PR-Agent bridge was not resolved."; exit 1; }
          (setsid nohup python3 "$BRIDGE_SCRIPT" \
            > "$RUNNER_TEMP/pr-agent-bridge.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PR_AGENT_BRIDGE_PORT}/v1/models" >/dev/null 2>&1; then
              echo "bridge is up on 127.0.0.1:${PR_AGENT_BRIDGE_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::compatibility bridge did not become ready."
          cat "$RUNNER_TEMP/pr-agent-bridge.log" || true
          exit 1

      - name: Revalidate the admitted exact HEAD immediately before review
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: before
        env:
          # Target-aware revalidation (gh pr view plus exact-HEAD workflow-run
          # evidence against the resolved target). Local same-repository reads
          # use github.token; delegated cross-repository reads require TAP_PAT.
          # The fallback is gated on non-delegated runs so a delegated run
          # without PAT yields an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          ADMITTED_SHA: ${{ steps.admit.outputs.head_sha }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "${CURRENT_SHA,,}" != "${ADMITTED_SHA,,}" ]]; then
            echo "::error::PR head moved after CI admission ($ADMITTED_SHA -> $CURRENT_SHA); refusing to review an unqualified HEAD."
            exit 1
          fi
          CI_JSON="$RUNNER_TEMP/pr-agent-before-review-ci-runs.json"
          gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/actions/runs?event=pull_request&head_sha=$ADMITTED_SHA&per_page=100" > "$CI_JSON"
          if ! python3 - "$CI_JSON" "$CI_WORKFLOW_NAME" "$ADMITTED_SHA" "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" <<'PY'
          import json, sys
          path, workflow, head, delegated = sys.argv[1:5]
          with open(path, "r", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          current = sorted(
              (run for run in runs if run.get("name") == workflow and run.get("head_sha") == head),
              key=lambda run: run.get("created_at") or "",
              reverse=True,
          )
          conclusion = current[0].get("conclusion") if current else None
          accepted = (
              current
              and current[0].get("status") == "completed"
              and (
                  conclusion == "success"
                  or (delegated == "true" and conclusion == "skipped")
              )
          )
          raise SystemExit(0 if accepted else 1)
          PY
          then
            echo "::error::CI for admitted HEAD $ADMITTED_SHA is no longer completed:success."
            exit 1
          fi
          echo "sha=$ADMITTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact CI-qualified HEAD $ADMITTED_SHA is still current."

      - name: Run upstream full review on the exact HEAD
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: pragent
        env:
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          # Target-aware PR-Agent auth (pr-agent --pr_url against the resolved
          # target). Local same-repository runs use github.token; delegated
          # cross-repository runs require TAP_PAT. The fallback is gated on
          # non-delegated runs so a delegated run without PAT yields an empty
          # token (auth itself fails closed).
          GITHUB__USER_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          CONFIG__GIT_PROVIDER: github
          CONFIG__MODEL: ${{ steps.stack.outputs.model }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ steps.stack.outputs.max_tokens }}
          CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
          CONFIG__PERSISTENT_INLINE_COMMENTS: 'true'
          OPENAI__API_BASE: ${{ steps.stack.outputs.api_base }}
          OPENAI__KEY: continuum-loopback
          GITHUB__PUBLISH_AS_CHECK_RUN: 'false'
          GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: 'true'
          GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: 'true'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: 'false'
          GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_BOT_COMMITS: 'true'
          PR_REVIEWER__PERSISTENT_COMMENT: 'true'
          PR_REVIEWER__FINAL_UPDATE_MESSAGE: 'false'
          PR_REVIEWER__PERSISTENT_FINDING_STATE: 'true'
          PR_REVIEWER__INLINE_KEY_ISSUES: 'true'
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
          PR_REVIEWER__MAX_NUMBER_OF_CALLS: '10'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_RISK_ASSESSMENT: 'true'
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: 'true'
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'true'
          PR_REVIEWER__ENABLE_REVIEW_COVERAGE_FOOTER: 'true'
          PR_REVIEWER__NUM_MAX_FINDINGS: '6'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: >-
            Large-PR reviews may be chunked. Never infer that implementation, tests,
            workflow wiring, or ticket requirements are missing merely because a file
            or symbol is absent from the current review chunk. Report an actionable
            key issue or lower the merge recommendation only for a concrete defect
            evidenced by code visible in the current chunk or repository context.
            When confirmation depends on files outside the current chunk, put it under
            human verification instead of treating it as an actionable defect.
          PR_CODE_SUGGESTIONS__FOCUS_ONLY_ON_PROBLEMS: 'true'
          PR_CODE_SUGGESTIONS__PERSISTENT_COMMENT: 'true'
          PR_CODE_SUGGESTIONS__PUBLISH_OUTPUT_NO_SUGGESTIONS: 'false'
          PR_CODE_SUGGESTIONS__MAX_SUGGESTIONS_PER_FILE: '0'
          PR_CODE_SUGGESTIONS__MAX_NUMBER_OF_CALLS: '10'
          PR_CODE_SUGGESTIONS__ENABLE_SUGGESTIONS_COVERAGE_FOOTER: 'true'
          PUSH_OUTPUTS__ENABLE: 'true'
          PUSH_OUTPUTS__CHANNELS: '["file"]'
          PUSH_OUTPUTS__FILE_PATH: 'pr-agent-outputs/continuum.jsonl'
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          : "${CONTINUUM_PR_AGENT_WORKTREE:?PR-Agent worktree is unavailable; the manual checkout failed before exporting the worktree.}"
          : "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY:?PR-Agent target repository is unset; refusing to fall back to the execution repository.}"
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          PR_URL="https://github.com/${CONTINUUM_PR_AGENT_TARGET_REPOSITORY}/pull/${PR_NUMBER}"
          IMPROVE_REPAIR_THRESHOLD="$(node -e 'const p=require(process.env.POLICY_SCRIPT); process.stdout.write(String(p.IMPROVE_REPAIR_THRESHOLD));')"
          [[ "$IMPROVE_REPAIR_THRESHOLD" =~ ^[0-9]+$ ]] || { echo "::error::Invalid centralized PR-Agent improve threshold."; exit 1; }
          mkdir -p pr-agent-outputs
          : > pr-agent-outputs/continuum.jsonl
          # The authoritative re-review is CI-gated by this controller: after
          # OpenCode pushes a repair, a new HEAD waits for CI success and then
          # receives a complete upstream review on that exact HEAD. An
          # automatic improve pass runs only when the authoritative review
          # still carries actionable repair value (see the improve-gate step
          # below); a clean review reaches the merge gate without paying a
          # second LLM pass. Push-command handling is disabled
          # (handle_push_trigger=false), so the default bot-commit push filter
          # cannot skip OpenCode-authored repair commits.
          #
          # Upstream reviewer is PR-Agent v0.46.0 (pinned above). The native
          # tools run on the admitted HEAD:
          #   review  -> structured review output (steps.pragent.outputs.review)
          #   improve -> native code suggestions via the runner-local
          #             push_outputs file channel
          #            (pr-agent-outputs/continuum.jsonl payload.code_suggestions)
          #             only when the improve-gate step allows it.
          # Check-run publishing stays disabled so persistent finding state
          # remains active (github.publish_as_check_run=false).
          run_review() {
            pr-agent --pr_url "$PR_URL" review \
              --config.propagate_tool_errors=true \
              --config.persistent_inline_comments=true \
              --pr_reviewer.persistent_finding_state=true \
              --pr_reviewer.final_update_message=false \
              --pr_reviewer.inline_key_issues=true \
              --pr_reviewer.require_merge_recommendation=true \
              --pr_reviewer.require_ticket_analysis_review=true \
              --github.publish_as_check_run=false \
              --github_action_config.enable_output=true \
              --github_action_config.fail_on_tool_errors=true
          }
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" ]]; then
            if ! run_review >"$RUNNER_TEMP/pr-agent-delegated-review.log" 2>&1; then
              echo "::error::Delegated PR-Agent review failed; detailed output remains runner-local."
              exit 1
            fi
          else
            run_review
          fi
          # Canonical machine source: the structured review JSON is exported
          # as the step output `review` (steps.pragent.outputs.review) for
          # the repair and merge workflows. Prose comments are presentation
          # only and are never the primary protocol.
          echo "review_head=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
          echo "improve_repair_threshold=$IMPROVE_REPAIR_THRESHOLD" >> "$GITHUB_OUTPUT"
          # Persist the push_outputs file payload for the repair workflow.
          # The improve payload is consumed only from this runner-local file
          # channel, never by scraping comments.
          echo "improve_file=pr-agent-outputs/continuum.jsonl" >> "$GITHUB_OUTPUT"
          echo "Upstream review completed for $REVIEWED_SHA; improve is gated below."

      - name: Revalidate the PR head and native review output after review
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        with:
          # Target-aware revalidation (pulls.get for the current PR head only
          # against the resolved target). Local reads use github.token;
          # delegated cross-repository reads require TAP_PAT. The fallback is
          # gated on non-delegated runs so a delegated run without PAT yields
          # an empty token (auth itself fails closed before the script runs).
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            if (process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true' &&
                !String(process.env.TAP_PAT || '').trim()) {
              core.setFailed(
                'Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token.'
              );
              return;
            }
            const prNumber = Number(process.env.PR_NUMBER);
            const reviewedSha = String(process.env.REVIEWED_SHA || '').toLowerCase();
            const { data: pr } = await github.rest.pulls.get({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              pull_number: prNumber,
            });
            const currentSha = String(pr.head.sha || '').toLowerCase();
            if (currentSha !== reviewedSha) {
              core.setOutput('stale_head', 'true');
              core.setFailed(
                `PR head moved during review (${reviewedSha} -> ${currentSha}); ` +
                'discarding the review result and waiting for fresh CI on the new HEAD.'
              );
              return;
            }
            const raw = String(process.env.REVIEW_JSON || '').trim();
            if (!raw) {
              core.setFailed('Upstream PR-Agent produced no structured review output.');
              return;
            }
            let review;
            try {
              review = JSON.parse(raw);
            } catch (err) {
              core.setFailed(`Upstream PR-Agent review output is invalid JSON: ${err.message}`);
              return;
            }
            // Split envelopes carry signals on both sides: merge fail-closed
            // via the centralized policy so no finding is lost.
            let inner;
            try {
              inner = require(process.env.POLICY_SCRIPT).unwrapReview(review);
            } catch (err) {
              core.setFailed(err.message);
              return;
            }
            if (!inner || typeof inner !== 'object' || !Array.isArray(inner.key_issues_to_review)) {
              core.setFailed('Upstream PR-Agent review output does not match the expected PRReview schema.');
              return;
            }
            core.setOutput('head_sha', currentSha);
            core.notice(`Native PR-Agent review output for ${reviewedSha} is current and machine-readable.`);

      - name: Export native persistent finding state for the reviewed HEAD
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: persistent
        env:
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.result.outputs.head_sha }}
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          FALLBACK_PYTHONPATH: ${{ steps.runtime.outputs.fallback_pythonpath }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent persistent-state export requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          COMMENTS_JSON="$RUNNER_TEMP/pr-agent-comments.json"
          # Bounded persistent-state lookup (#254): state markers for the
          # reviewed HEAD are written by recent reviews, so a server-side
          # `since` window answers in one request and keeps the
          # array-of-pages shape below. A short window is trusted only when
          # it contains the reviewed-HEAD marker; otherwise a capped 10-page
          # walk runs instead of full-history pagination.
          # Target-aware: delegated reads use the resolved child repository.
          SINCE_TS="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")"
          WINDOW_JSON=""
          if [[ -n "$SINCE_TS" ]]; then
            WINDOW_JSON="$(gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&since=$SINCE_TS" 2>/dev/null || true)"
          fi
          WINDOW_LEN="$(jq 'length' <<<"$WINDOW_JSON" 2>/dev/null || echo 100)"
          if [[ "$WINDOW_LEN" =~ ^[0-9]+$ ]] && [[ "$WINDOW_LEN" -lt 100 ]] && [[ -n "${REVIEWED_SHA:-}" ]] && jq -e --arg head "$REVIEWED_SHA" 'any(.[]; ((.body // "") | contains($head)))' <<<"$WINDOW_JSON" >/dev/null 2>&1; then
            jq -s '.' <<<"$WINDOW_JSON" > "$COMMENTS_JSON"
          else
            rm -f "$RUNNER_TEMP/pr-agent-comment-pages.jsonl"
            # Newest-first window: comments list oldest-first, so pages
            # 1-10 would miss a recent reviewed-HEAD marker on a PR with
            # >1000 comments. Derive the last page from the issue total
            # and scan the newest 10 pages instead.
            EXPORT_TOTAL_RAW="$(gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER" --jq '.comments // 0' 2>/dev/null || echo unknown)"
            if [[ "$EXPORT_TOTAL_RAW" =~ ^[0-9]+$ ]]; then
              EXPORT_LAST_PAGE=$(( (EXPORT_TOTAL_RAW + 99) / 100 ))
              [[ "$EXPORT_LAST_PAGE" -ge 1 ]] || EXPORT_LAST_PAGE=1
              EXPORT_FIRST_PAGE=$(( EXPORT_LAST_PAGE - 9 ))
              [[ "$EXPORT_FIRST_PAGE" -ge 1 ]] || EXPORT_FIRST_PAGE=1
            else
              # Issue-total lookup failed; oldest-first pages 1-10 would
              # scan the wrong end on a PR with >1000 comments because the
              # comments list is oldest-first, missing the recent
              # reviewed-HEAD marker. Anchor at the newest end instead: the
              # paginated Link header advertises the last page in one read.
              # Fail closed when the newest page cannot be determined
              # rather than exporting state from the wrong window.
              if ! EXPORT_INCLUDE="$(gh api --include "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&page=1" 2>/dev/null)"; then
                echo "::error::Could not determine the newest PR comment page for persistent-state export."
                exit 1
              fi
              EXPORT_HEADERS="$(tr -d '\r' <<<"$EXPORT_INCLUDE" | sed -n '1,/^$/p')"
              EXPORT_LINK_LAST="$(grep -i '^link:' <<<"$EXPORT_HEADERS" | tr '[:upper:]' '[:lower:]' | sed -nE 's/.*<[^>]*[?&]page=([0-9]+)[^>]*>[[:space:]]*;[[:space:]]*rel="last".*/\1/p' | tail -n 1)"
              if [[ "$EXPORT_LINK_LAST" =~ ^[0-9]+$ ]] && [[ "$EXPORT_LINK_LAST" -ge 1 ]]; then
                EXPORT_LAST_PAGE="$EXPORT_LINK_LAST"
                EXPORT_FIRST_PAGE=$(( EXPORT_LAST_PAGE - 9 ))
                [[ "$EXPORT_FIRST_PAGE" -ge 1 ]] || EXPORT_FIRST_PAGE=1
              elif grep -qi '^link:' <<<"$EXPORT_HEADERS"; then
                echo "::error::Could not parse the newest PR comment page for persistent-state export."
                exit 1
              else
                # No Link header means the thread fits in a single page.
                EXPORT_FIRST_PAGE=1
                EXPORT_LAST_PAGE=1
              fi
            fi
            for comment_page in $(seq "$EXPORT_FIRST_PAGE" "$EXPORT_LAST_PAGE"); do
              if ! gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&page=$comment_page" \
                > "$RUNNER_TEMP/pr-agent-comment-page.json" 2>/dev/null; then
                echo "::error::Could not read PR comments for persistent-state export."
                exit 1
              fi
              if ! PAGE_LEN="$(jq 'length' "$RUNNER_TEMP/pr-agent-comment-page.json" 2>/dev/null)"; then
                echo "::error::Could not parse PR comments page."; exit 1
              fi
              [[ "$PAGE_LEN" =~ ^[0-9]+$ ]] || { echo "::error::Could not parse PR comments page."; exit 1; }
              cat "$RUNNER_TEMP/pr-agent-comment-page.json" >> "$RUNNER_TEMP/pr-agent-comment-pages.jsonl"
              echo >> "$RUNNER_TEMP/pr-agent-comment-pages.jsonl"
              rm -f "$RUNNER_TEMP/pr-agent-comment-page.json"
            done
            jq -s '.' "$RUNNER_TEMP/pr-agent-comment-pages.jsonl" > "$COMMENTS_JSON"
            rm -f "$RUNNER_TEMP/pr-agent-comment-pages.jsonl"
          fi
          PYTHONPATH="$FALLBACK_PYTHONPATH" python3 - "$COMMENTS_JSON" <<'PY'
          import json
          import os
          import sys
          from continuum.pr_agent_fallback_state import (
              FallbackStateError,
              derive_fallback_state,
          )
          from pr_agent.algo.review_finding_state import parse_review_state

          path = sys.argv[1]
          reviewed = os.environ["REVIEWED_SHA"].strip().lower()
          if not reviewed:
              raise SystemExit(
                  "No validated reviewed HEAD; refusing to export persistent finding state."
              )
          with open(path, "r", encoding="utf-8") as handle:
              pages = json.load(handle)
          comments = []
          for page in pages:
              if isinstance(page, list):
                  comments.extend(page)
          candidates = [
              c for c in comments
              if "<!-- pr-agent-review-state:" in str(c.get("body") or "")
          ]
          def derive_current_fallback():
              try:
                  review = json.loads(os.environ.get("REVIEW_JSON", ""))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Cannot validate review for persistent-state fallback: {exc}")
              # Split-envelope union is handled inside derive_fallback_state (union + fail-closed on invalid shapes). Do not pre-merge here to avoid duplicating findings.
              try:
                  return derive_fallback_state(
                      review,
                      reviewed,
                      run_id=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{reviewed}",
                  )
              except FallbackStateError as exc:
                  raise SystemExit(f"Cannot derive fallback persistent state: {exc}")

          state = None
          if candidates:
              latest = max(candidates, key=lambda c: str(c.get("updated_at") or c.get("created_at") or ""))
              parsed = parse_review_state(str(latest.get("body") or ""))
              if parsed.present and parsed.valid and isinstance(parsed.state, dict):
                  candidate = parsed.state
                  last = candidate.get("last_run")
                  findings = candidate.get("findings")
                  native_usable = (
                      isinstance(last, dict)
                      and str(last.get("head_sha") or "").strip().lower() == reviewed
                      and last.get("complete") is True
                      and str(last.get("kind") or "") == "full"
                      and isinstance(findings, list)
                      and all(
                          isinstance(finding, dict)
                          and str(finding.get("state") or "").upper() in {"ACTIVE", "RESOLVED"}
                          for finding in findings
                      )
                  )
                  if native_usable:
                      state = candidate
          if state is None:
              # Upstream may publish a marker before its full-review last_run
              # is complete. That incomplete marker is not authoritative.
              # The exact-HEAD structured review has already passed schema and
              # stale-HEAD validation, so derive the canonical fallback rather
              # than dead-ending before repair routing.
              state = derive_current_fallback()
          last = state.get("last_run")
          if not isinstance(last, dict):
              raise SystemExit("Upstream PR-Agent persistent state has no last_run.")
          state_head = str(last.get("head_sha") or "").strip().lower()
          if state_head != reviewed:
              # Expected stale-head discard, not a retryable tool error: flag
              # it so the bounded-retry controller does not reschedule the
              # already-superseded admitted SHA and simply waits for fresh CI.
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("stale_head=true\n")
              raise SystemExit(
                  f"Persistent state is stale: last_run.head_sha={state_head or '<empty>'}, reviewed={reviewed}."
              )
          if last.get("complete") is not True or str(last.get("kind") or "") != "full":
              raise SystemExit("Persistent state does not represent a complete full review.")
          findings = state.get("findings")
          if not isinstance(findings, list):
              raise SystemExit("Upstream PR-Agent persistent state findings is not a list.")
          try:
              current_review = json.loads(os.environ.get("REVIEW_JSON", ""))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Cannot validate current review against persistent state: {exc}")
          current_inner = current_review.get("review", current_review) if isinstance(current_review, dict) else None
          current_key_issues = current_inner.get("key_issues_to_review") if isinstance(current_inner, dict) else None
          if not isinstance(current_key_issues, list):
              raise SystemExit("Current exact-HEAD review has no key_issues_to_review list.")
          current_structured_clean = len(current_key_issues) == 0

          valid_states = {"ACTIVE", "RESOLVED"}
          current_findings = []
          stale_active = 0
          same_head_stale_active = 0
          for finding in findings:
              if not isinstance(finding, dict):
                  raise SystemExit("Upstream PR-Agent persistent state contains a non-object finding.")
              finding_state = str(finding.get("state") or "").upper()
              if finding_state not in valid_states:
                  raise SystemExit("Upstream PR-Agent persistent state contains an unknown finding state.")
              if finding_state == "ACTIVE":
                  last_seen_head = str(finding.get("last_seen_head_sha") or "").strip().lower()
                  if not last_seen_head:
                      raise SystemExit(
                          "ACTIVE PR-Agent persistent finding has no last_seen_head_sha; failing closed."
                      )
                  if last_seen_head != reviewed:
                      stale_active += 1
                      continue
                  if current_structured_clean:
                      # A complete machine-readable review just ran for this
                      # exact HEAD and reports zero current key issues. Upstream
                      # persistent state is historical presentation and may fail
                      # to resolve an older same-HEAD finding after a bounded
                      # re-review. Such history must not veto the authoritative
                      # current structured result.
                      same_head_stale_active += 1
                      continue
              current_findings.append(finding)
          if stale_active or same_head_stale_active:
              # Persistent state spans review history. The merge contract is
              # exact-HEAD: after a complete full review for this HEAD, an
              # ACTIVE finding last seen only on an older HEAD is historical
              # evidence, not a current-head veto. Current findings are still
              # represented by structured review output and by ACTIVE entries
              # whose last_seen_head_sha equals the reviewed HEAD.
              state = dict(state)
              state["findings"] = current_findings
              if stale_active:
                  print(
                      f"Ignored {stale_active} stale ACTIVE persistent finding(s) "
                      f"from older HEADs while reviewing {reviewed}."
                  )
              if same_head_stale_active:
                  print(
                      f"Ignored {same_head_stale_active} stale same-HEAD ACTIVE persistent "
                      f"finding(s) absent from the complete current structured review {reviewed}."
                  )
          compact = json.dumps(state, separators=(",", ":"), ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"persistent_state_json={compact}\n")
          PY

      - name: Decide whether automatic improve can be skipped
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.result.outcome == 'success' &&
          steps.persistent.outcome == 'success'
        id: improve_gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          PERSISTENT_STATE_JSON: ${{ steps.persistent.outputs.persistent_state_json }}
          HEAD_SHA: ${{ steps.result.outputs.head_sha }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          PRAGENT_OUTCOME: ${{ steps.pragent.outcome }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            // Automatic-improve gate: review is the authoritative merge gate.
            // A clean authoritative review (safe_to_merge, zero
            // key_issues_to_review, complete full persistent state for the
            // exact HEAD, no blocking security/tool/coverage signal) skips the
            // second LLM pass and routes directly to the merge gate. A review
            // with actionable findings still runs improve for repair
            // suggestions. Exact-HEAD mismatch or invalid state fails closed
            // and never skips. Explicit manual improve remains available by
            // invoking the improve tool directly; this gate only governs the
            // automatic pass.
            const policy = require(process.env.POLICY_SCRIPT);
            const headSha = String(process.env.HEAD_SHA || '').trim().toLowerCase();
            const reviewedSha = String(process.env.REVIEWED_SHA || '').trim().toLowerCase();
            if (!headSha || !reviewedSha) {
              core.setFailed('Improve gate requires the exact reviewed HEAD.');
              return;
            }
            if (headSha !== reviewedSha) {
              core.setOutput('stale_head', 'true');
              core.setFailed(
                `PR head moved before the improve gate (${reviewedSha} -> ${headSha}); ` +
                'discarding the review result and waiting for fresh CI on the new HEAD.'
              );
              return;
            }
            // Stored step outputs alone cannot prove the HEAD is still
            // current: a push after `result`/`persistent` leaves old==old.
            // Revalidate against the live PR head before deciding.
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('Improve gate requires a pull request number for live HEAD validation.');
              return;
            }
            let liveSha = '';
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                pull_number: prNumber,
              });
              liveSha = String((pr && pr.head && pr.head.sha) || '').trim().toLowerCase();
            } catch (err) {
              core.setFailed(`Improve gate could not revalidate the live PR head: ${err.message}`);
              return;
            }
            if (!liveSha) {
              core.setFailed('Improve gate requires the exact reviewed HEAD.');
              return;
            }
            if (liveSha !== reviewedSha || liveSha !== headSha) {
              core.setOutput('stale_head', 'true');
              core.setFailed(
                `PR head moved before the improve gate (${reviewedSha} -> ${liveSha}); ` +
                'discarding the review result and waiting for fresh CI on the new HEAD.'
              );
              return;
            }
            let review;
            try {
              review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            } catch (err) {
              core.setFailed(`Invalid PR-Agent review JSON: ${err.message}`);
              return;
            }
            let persistentState;
            try {
              persistentState = JSON.parse(String(process.env.PERSISTENT_STATE_JSON || ''));
            } catch (err) {
              core.setFailed(`Invalid PR-Agent persistent state JSON: ${err.message}`);
              return;
            }
            const stateHead = String(
              (persistentState && persistentState.last_run && persistentState.last_run.head_sha) || ''
            ).trim().toLowerCase();
            if (!stateHead || stateHead !== reviewedSha) {
              core.setOutput('stale_head', 'true');
              core.setFailed(
                `PR-Agent persistent state is stale: last_run.head_sha=${stateHead || '<empty>'}, reviewed=${reviewedSha}.`
              );
              return;
            }
            // Wire the real tool-error and review-coverage signals instead
            // of assuming a clean run: with
            // github_action_config.fail_on_tool_errors=true a failed
            // review tool surfaces as steps.pragent.outcome == 'failure',
            // and partial large-PR coverage surfaces as an explicit
            // coverage signal inside the review payload. Either must keep
            // the automatic improve pass (fail closed, never skip).
            const pragentOutcome = String(process.env.PRAGENT_OUTCOME || '').trim().toLowerCase();
            let reviewCoverageComplete = true;
            try {
              reviewCoverageComplete = !policy.hasIncompleteCoverageSignal(review);
            } catch (err) {
              core.setFailed(`Invalid PR-Agent review coverage signal: ${err.message}`);
              return;
            }
            let decision;
            try {
              decision = policy.isCleanReviewForImproveSkip(
                review,
                persistentState,
                {
                  headMatches: true,
                  toolError: pragentOutcome === 'failure',
                  reviewCoverageComplete,
                  reviewedHeadSha: reviewedSha,
                }
              );
            } catch (err) {
              core.setFailed(err.message);
              return;
            }
            core.setOutput('skip_improve', decision.skip ? 'true' : 'false');
            core.setOutput('reason', String(decision.reason || ''));
            core.notice(
              decision.skip
                ? `Clean authoritative review at ${reviewedSha}; skipping automatic improve: ${decision.reason}`
                : `Automatic improve still required at ${reviewedSha}: ${decision.reason}`
            );

      - name: Run upstream improve on the exact HEAD when repair value remains
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.improve_gate.outcome == 'success' &&
          steps.improve_gate.outputs.skip_improve != 'true'
        id: improve
        env:
          # Target-aware moved-head check (gh pr view for the current PR head
          # only against the resolved target). Local reads use github.token;
          # delegated cross-repository reads require TAP_PAT. The fallback is
          # gated on non-delegated runs so a delegated run without PAT yields
          # an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          # Target-aware PR-Agent auth (pr-agent --pr_url against the resolved
          # target). Local same-repository runs use github.token; delegated
          # cross-repository runs require TAP_PAT. The fallback is gated on
          # non-delegated runs so a delegated run without PAT yields an empty
          # token (auth itself fails closed).
          GITHUB__USER_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          CONFIG__GIT_PROVIDER: github
          CONFIG__MODEL: ${{ steps.stack.outputs.model }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ steps.stack.outputs.max_tokens }}
          CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
          OPENAI__API_BASE: ${{ steps.stack.outputs.api_base }}
          OPENAI__KEY: continuum-loopback
          GITHUB__PUBLISH_AS_CHECK_RUN: 'false'
          GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: 'true'
          PR_CODE_SUGGESTIONS__FOCUS_ONLY_ON_PROBLEMS: 'true'
          PR_CODE_SUGGESTIONS__PERSISTENT_COMMENT: 'true'
          PR_CODE_SUGGESTIONS__PUBLISH_OUTPUT_NO_SUGGESTIONS: 'false'
          PR_CODE_SUGGESTIONS__MAX_SUGGESTIONS_PER_FILE: '0'
          PR_CODE_SUGGESTIONS__MAX_NUMBER_OF_CALLS: '3'
          PR_CODE_SUGGESTIONS__ENABLE_SUGGESTIONS_COVERAGE_FOOTER: 'true'
          PUSH_OUTPUTS__ENABLE: 'true'
          PUSH_OUTPUTS__CHANNELS: '["file"]'
          PUSH_OUTPUTS__FILE_PATH: 'pr-agent-outputs/continuum.jsonl'
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          : "${CONTINUUM_PR_AGENT_WORKTREE:?PR-Agent worktree is unavailable; the manual checkout failed before exporting the worktree.}"
          : "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY:?PR-Agent target repository is unset; refusing to fall back to the execution repository.}"
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          PR_URL="https://github.com/${CONTINUUM_PR_AGENT_TARGET_REPOSITORY}/pull/${PR_NUMBER}"
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "${CURRENT_SHA,,}" != "${REVIEWED_SHA,,}" ]]; then
            echo "::error::PR head moved before improve ($REVIEWED_SHA -> $CURRENT_SHA); discarding stale gate decision."
            echo "stale_head=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          IMPROVE_REPAIR_THRESHOLD="$(node -e 'const p=require(process.env.POLICY_SCRIPT); process.stdout.write(String(p.IMPROVE_REPAIR_THRESHOLD));')"
          [[ "$IMPROVE_REPAIR_THRESHOLD" =~ ^[0-9]+$ ]] || { echo "::error::Invalid centralized PR-Agent improve threshold."; exit 1; }
          mkdir -p pr-agent-outputs
          : > pr-agent-outputs/continuum.jsonl
          # The authoritative review carried actionable findings, so run one
          # bounded upstream improve pass for additional repair suggestions.
          # The improve payload is consumed only from the runner-local file
          # channel, never by scraping comments.
          run_improve() {
            pr-agent --pr_url "$PR_URL" improve \
              --config.propagate_tool_errors=true \
              --pr_code_suggestions.focus_only_on_problems=true \
              --pr_code_suggestions.publish_output_no_suggestions=false \
              --pr_code_suggestions.suggestions_score_threshold="$IMPROVE_REPAIR_THRESHOLD" \
              --github.publish_as_check_run=false
          }
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" ]]; then
            if ! run_improve >"$RUNNER_TEMP/pr-agent-delegated-improve.log" 2>&1; then
              echo "::error::Delegated PR-Agent improve failed; detailed output remains runner-local."
              exit 1
            fi
          else
            run_improve
          fi
          if [[ ! -s pr-agent-outputs/continuum.jsonl ]]; then
            echo "No improve suggestions were published; recording an empty payload."
            echo '{"payload": {"code_suggestions": []}}' > pr-agent-outputs/continuum.jsonl
          fi
          echo "improve_repair_threshold=$IMPROVE_REPAIR_THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "improve_file=pr-agent-outputs/continuum.jsonl" >> "$GITHUB_OUTPUT"
          echo "Upstream improve completed for $REVIEWED_SHA."

      - name: Record skipped automatic improve for the clean HEAD
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.improve_gate.outcome == 'success' &&
          steps.improve_gate.outputs.skip_improve == 'true'
        id: improve_skipped
        env:
          # Target-aware moved-head check (gh pr view for the current PR head
          # only against the resolved target). Local reads use github.token;
          # delegated cross-repository reads require TAP_PAT. The fallback is
          # gated on non-delegated runs so a delegated run without PAT yields
          # an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          : "${CONTINUUM_PR_AGENT_WORKTREE:?PR-Agent worktree is unavailable; the manual checkout failed before exporting the worktree.}"
          : "${CONTINUUM_PR_AGENT_TARGET_REPOSITORY:?PR-Agent target repository is unset; refusing to fall back to the execution repository.}"
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "${CURRENT_SHA,,}" != "${REVIEWED_SHA,,}" ]]; then
            echo "::error::PR head moved before recording skipped improve ($REVIEWED_SHA -> $CURRENT_SHA); refusing empty payload for the wrong HEAD."
            echo "stale_head=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          IMPROVE_REPAIR_THRESHOLD="$(node -e 'const p=require(process.env.POLICY_SCRIPT); process.stdout.write(String(p.IMPROVE_REPAIR_THRESHOLD));')"
          [[ "$IMPROVE_REPAIR_THRESHOLD" =~ ^[0-9]+$ ]] || { echo "::error::Invalid centralized PR-Agent improve threshold."; exit 1; }
          mkdir -p pr-agent-outputs
          # The skipped-clean marker lets downstream repair/merge gating tell
          # "improve skipped for a clean HEAD" apart from "improve never
          # ran": only the marked empty payload satisfies the
          # improve-coverage leg without an improve run (mirrors
          # GateInputs.improve_skipped_clean). Suggestion parsing ignores
          # the extra key.
          echo '{"payload": {"code_suggestions": []}, "continuum": {"improve_skipped_clean": true}}' > pr-agent-outputs/continuum.jsonl
          echo "improve_repair_threshold=$IMPROVE_REPAIR_THRESHOLD" >> "$GITHUB_OUTPUT"
          echo "improve_file=pr-agent-outputs/continuum.jsonl" >> "$GITHUB_OUTPUT"
          echo "Automatic improve skipped for clean HEAD $REVIEWED_SHA; empty payload recorded."

      - name: Revalidate the PR head after improve
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          (steps.improve.outcome == 'success' || steps.improve_skipped.outcome == 'success')
        id: post_improve
        env:
          # Target-aware moved-head check (gh pr view for the current PR head
          # only against the resolved target). Local reads use github.token;
          # delegated cross-repository reads require TAP_PAT. The fallback is
          # gated on non-delegated runs so a delegated run without PAT yields
          # an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "${CURRENT_SHA,,}" != "${REVIEWED_SHA,,}" ]]; then
            echo "::error::PR head moved during improve ($REVIEWED_SHA -> $CURRENT_SHA); discarding stale improve output."
            echo "stale_head=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Improve output for $REVIEWED_SHA is still current."

      - name: Export native improve output
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          (steps.improve.outcome == 'success' || steps.improve_skipped.outcome == 'success') &&
          steps.post_improve.outcome == 'success'
        id: improve_output
        run: |
          set -euo pipefail
          : "${CONTINUUM_PR_AGENT_WORKTREE:?PR-Agent worktree is unavailable; the manual checkout failed before exporting the worktree.}"
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          [[ -s pr-agent-outputs/continuum.jsonl ]] || {
            echo "::error::Native PR-Agent improve output file is missing."
            exit 1
          }
          DELIMITER="__CONTINUUM_PR_AGENT_IMPROVE_EOF__"
          {
            echo "improve_jsonl<<$DELIMITER"
            cat pr-agent-outputs/continuum.jsonl
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Normalize persistent improve presentation
        if: >-
          steps.result.outcome == 'success' &&
          steps.result.outputs.head_sha &&
          steps.improve_output.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
          IMPROVE_JSONL: ${{ steps.improve_output.outputs.improve_jsonl }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            const prNumber = Number(process.env.PR_NUMBER);
            const qualifying = policy.qualifyingImproveSuggestions(
              String(process.env.IMPROVE_JSONL || '')
            );
            // Bounded scan (#254): improve presentation is rewritten every
            // run, so the newest five pages cover live state; older leftovers are
            // cosmetic and pruned once visible again. `listComments` is
            // oldest-first and ignores sort/direction, so count down from
            // the issue total to scan newest-first. The issue total is
            // only fetched after a full first window so small threads cost
            // a single list request.
            // Target-aware: delegated reads use the resolved child.
            const comments = [];
            const firstResp = await github.rest.issues.listComments(
              {
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                issue_number: prNumber,
                per_page: 100,
                page: 1,
              }
            );
            const firstPage = firstResp && firstResp.data;
            if (Array.isArray(firstPage)) comments.push(...firstPage);
            if (Array.isArray(firstPage) && firstPage.length === 100) {
              let lastPage = 0;
              const link = firstResp && firstResp.headers && firstResp.headers.link;
              if (typeof link === 'string') {
                const match = link.match(/[?&]page=(\d+)[^>]*>;\s*rel="last"/);
                if (match) lastPage = Math.max(lastPage, Number(match[1]));
              }
              if (!lastPage) {
                const total = (await github.rest.issues.get({ owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: prNumber })).data.comments || 0;
                if (total > 0) lastPage = Math.max(1, Math.ceil(total / 100));
              }
              if (!lastPage) lastPage = 1;
              const seen = new Set(comments.map(entry => entry && entry.id));
              for (let page = 1; page <= 5; page += 1) {
                const targetPage = lastPage - (page - 1);
                if (targetPage < 1) break;
                if (targetPage === 1) continue;
                const { data } = await github.rest.issues.listComments(
                  {
                    owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                    repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                    issue_number: prNumber,
                    per_page: 100,
                    page: targetPage,
                  }
                );
                if (!Array.isArray(data) || data.length === 0) continue;
                for (const entry of data) {
                  if (!entry || seen.has(entry.id)) continue;
                  seen.add(entry.id);
                  comments.push(entry);
                }
              }
            }
            const improveComments = comments
              .filter(comment => String(comment.body || '').includes('<!-- pr-agent:improve:'))
              .sort((a, b) => Number(a.id) - Number(b.id));
            if (qualifying.length === 0) {
              for (const comment of improveComments) {
                await github.rest.issues.deleteComment({
                  owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                  repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                  comment_id: comment.id,
                });
              }
              core.notice('No high-signal /improve suggestions; stale improve presentation removed.');
            } else {
              for (const comment of improveComments.slice(0, -1)) {
                await github.rest.issues.deleteComment({
                  owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                  repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                  comment_id: comment.id,
                });
              }
              core.notice(
                'Kept one persistent /improve comment for ' +
                qualifying.length + ' high-signal suggestion(s).'
              );
            }

      - name: Route the current PR-Agent result
        if: >-
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.post_improve.outcome == 'success'
        id: route
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          IMPROVE_JSONL: ${{ steps.improve_output.outputs.improve_jsonl }}
          IMPROVE_SKIPPED: ${{ steps.improve_skipped.outcome == 'success' }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        with:
          github-token: ${{ github.token }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            const review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            // Split envelopes share the merged helper: checking only one
            // side would miss nested findings or nested blocking security.
            let inner;
            try {
              inner = policy.unwrapReview(review);
            } catch (err) {
              core.setFailed(err.message);
              return;
            }
            const keyIssues = Array.isArray(inner.key_issues_to_review)
              ? inner.key_issues_to_review
              : [];
            const suggestions = policy.qualifyingImproveSuggestions(
              String(process.env.IMPROVE_JSONL || '')
            );
            // The authoritative review owns repair/merge disposition.
            // /improve is auxiliary input to an already-required repair and
            // cannot promote a clean reviewed HEAD into another polish cycle.
            const improveSkippedClean =
              String(process.env.IMPROVE_SKIPPED || '').trim().toLowerCase() === 'true';
            if (improveSkippedClean && suggestions.length > 0) {
              core.notice(
                'Clean authoritative review carries advisory/stale improve suggestions; ' +
                'ignoring them for merge disposition.'
              );
            }
            // One canonical policy owns repair/merge/re-review routing.
            const disposition = policy.reviewDisposition(
              review,
              String(process.env.IMPROVE_JSONL || '')
            );
            const needsRepair = disposition.action === 'repair';
            const readyToMerge = disposition.action === 'merge';
            const needsRereview = disposition.action === 'rereview';
            core.setOutput('needs_repair', needsRepair ? 'true' : 'false');
            core.setOutput('ready_to_merge', readyToMerge ? 'true' : 'false');
            core.setOutput('needs_rereview', needsRereview ? 'true' : 'false');
            core.setOutput('review_disposition', disposition.action);
            core.setOutput('review_findings', String(disposition.reviewCount));
            core.setOutput('improve_suggestions', String(disposition.qualifyingSuggestionCount));
            core.notice(
              'PR-Agent disposition=' + disposition.action + ': ' + disposition.reason
            );

      - name: Clear settled PR-Agent controller state
        if: steps.route.outcome == 'success' && steps.route.outputs.ready_to_merge == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            // Bounded cleanup scan (#254): controller markers gate the next
            // run, so the newest five pages cover live state; older leftovers are
            // cosmetic and pruned once visible again. `listComments` is
            // oldest-first and ignores sort/direction, so count down from
            // the issue total to scan newest-first.
            // Target-aware: delegated reads use the resolved child.
            const comments = [];
            const total = (await github.rest.issues.get({ owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: Number(process.env.PR_NUMBER) })).data.comments || 0;
            const lastPage = Math.max(1, Math.ceil(total / 100));
            for (let page = 1; page <= 5; page += 1) {
              const targetPage = lastPage - (page - 1);
              if (targetPage < 1) break;
              const { data } = await github.rest.issues.listComments(
                {
                  owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                  repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                  issue_number: Number(process.env.PR_NUMBER),
                  per_page: 100,
                  page: targetPage,
                }
              );
              if (!Array.isArray(data) || data.length === 0) continue;
              comments.push(...data);
            }
            for (const comment of comments) {
              if (!String(comment.body || '').includes(policy.CONTROLLER_STATE_MARKER)) continue;
              await github.rest.issues.deleteComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: comment.id,
              });
            }

      - name: Publish durable PR-Agent review state
        if: steps.route.outcome == 'success' && steps.result.outputs.head_sha
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.result.outputs.head_sha }}
          REVIEW_DISPOSITION: ${{ steps.route.outputs.review_disposition }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            const disposition = String(process.env.REVIEW_DISPOSITION || '').trim();
            const descriptions = {
              repair: 'PR-Agent review complete: actionable',
              merge: 'PR-Agent review complete: clean',
              rereview: 'PR-Agent review complete: blocking; recovery eligible',
            };
            if (!descriptions[disposition]) {
              core.setFailed('Unknown PR-Agent review disposition: ' + (disposition || '<empty>'));
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'continuum/pr-agent-review',
              description: descriptions[disposition],
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Publish failed PR-Agent review state
        if: >-
          failure() &&
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.admit.outputs.head_sha
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          RETRYABLE_FAILURE: ${{ (steps.install_pragent.outcome == 'failure' || steps.install_opencode.outcome == 'failure' || steps.start_opencode.outcome == 'failure' || steps.runtime.outcome == 'failure' || steps.start_bridge.outcome == 'failure' || steps.pragent.outcome == 'failure' || steps.result.outcome == 'failure' || steps.persistent.outcome == 'failure' || steps.improve_gate.outcome == 'failure' || steps.improve.outcome == 'failure' || steps.improve_skipped.outcome == 'failure' || steps.post_improve.outcome == 'failure' || steps.improve_output.outcome == 'failure') && steps.result.outputs.stale_head != 'true' && steps.persistent.outputs.stale_head != 'true' && steps.improve_gate.outputs.stale_head != 'true' && steps.improve.outputs.stale_head != 'true' && steps.improve_skipped.outputs.stale_head != 'true' && steps.post_improve.outputs.stale_head != 'true' && 'true' || 'false' }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            // Defense in depth: every stale-head discard above carries its
            // own flag, but revalidate the live PR head anyway so a
            // superseded SHA is never reported as recovery-eligible.
            let retryable = process.env.RETRYABLE_FAILURE === 'true';
            if (retryable) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                  repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                  pull_number: Number(process.env.PR_NUMBER),
                });
                const liveSha = String((pr && pr.head && pr.head.sha) || '').trim().toLowerCase();
                if (liveSha && liveSha !== String(process.env.HEAD_SHA || '').trim().toLowerCase()) {
                  retryable = false;
                }
              } catch (err) {
                core.warning(`Could not revalidate the live PR head: ${err.message}`);
              }
            }
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'continuum/pr-agent-review',
              description:
                retryable
                  ? 'PR-Agent review failed: transient; recovery eligible'
                  : 'PR-Agent review failed: deterministic; recovery held',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Fail closed on a moved head
        if: steps.stack.outputs.enabled == 'true' && always()
        env:
          # Target-aware moved-head check (gh pr view for the current PR head
          # only against the resolved target). Local reads use github.token;
          # delegated cross-repository reads require TAP_PAT. The fallback is
          # gated on non-delegated runs so a delegated run without PAT yields
          # an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent execution requires TAP_PAT; refusing to fall back to github.token."
            exit 1
          fi
          if [[ -z "${REVIEWED_SHA:-}" ]]; then
            echo "No review was admitted; nothing to revalidate."
            exit 0
          fi
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "$CURRENT_SHA" != "$REVIEWED_SHA" ]]; then
            echo "::error::PR head moved during review ($REVIEWED_SHA -> $CURRENT_SHA); the review is stale."
            exit 1
          fi
          echo "Reviewed head $REVIEWED_SHA is still current."

      - name: Prove the checkout is unmodified
        if: always() && steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${CONTINUUM_PR_AGENT_WORKTREE:-}" ]]; then
            echo "::error::PR-Agent worktree is unavailable; the manual checkout failed before exporting the worktree."
            exit 1
          fi
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          DIRTY="$(git status --porcelain -- . ':(exclude)pr-agent-outputs')"
          if [[ -n "$DIRTY" ]]; then
            echo "::error::PR-Agent modified the checkout; reviewer-only runs must not."
            printf '%s\n' "$DIRTY"
            exit 1
          fi
          echo "Checkout is unmodified: reviewer-only holds."

      - name: Stop the review backend
        if: always()
        run: |
          pkill -f "opencode serv[e] --hostname 127.0.0.1" || true
          pkill -f "continuum-pr-agent-bridge.p[y]" || true
          pkill -f "pr_agent_bridge.p[y]" || true

      - name: Update persistent PR-Agent retry controller state
        if: >-
          always() &&
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          failure() &&
          (steps.install_pragent.outcome == 'failure' ||
           steps.install_opencode.outcome == 'failure' ||
           steps.start_opencode.outcome == 'failure' ||
           steps.runtime.outcome == 'failure' ||
           steps.start_bridge.outcome == 'failure' ||
           steps.pragent.outcome == 'failure' ||
           steps.result.outcome == 'failure' ||
           steps.persistent.outcome == 'failure' ||
           steps.improve_gate.outcome == 'failure' ||
           steps.improve.outcome == 'failure' ||
           steps.improve_skipped.outcome == 'failure' ||
           steps.post_improve.outcome == 'failure' ||
           steps.improve_output.outcome == 'failure') &&
           steps.result.outputs.stale_head != 'true' &&
           steps.persistent.outputs.stale_head != 'true' &&
           steps.improve_gate.outputs.stale_head != 'true' &&
           steps.improve.outputs.stale_head != 'true' &&
           steps.improve_skipped.outputs.stale_head != 'true' &&
           steps.post_improve.outputs.stale_head != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          RETRY_ATTEMPT: ${{ steps.stack.outputs.retry_attempt }}
          RECOVERY_KIND: ${{ steps.stack.outputs.recovery_kind }}
          POLICY_SCRIPT: ${{ steps.runtime.outputs.policy_script }}
        with:
          github-token: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          script: |
            const policy = require(process.env.POLICY_SCRIPT);
            const prNumber = Number(process.env.PR_NUMBER);
            const head = String(process.env.HEAD_SHA || '').toLowerCase();
            // Defense in depth: every stale-head discard above carries its
            // own flag, but revalidate the live PR head first so a
            // bounded retry is never scheduled for an already-superseded
            // admitted SHA. Fresh CI on the new HEAD recovers on its own.
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                pull_number: prNumber,
              });
              const liveSha = String((pr && pr.head && pr.head.sha) || '').trim().toLowerCase();
              if (liveSha && liveSha !== head) {
                core.notice(
                  'PR head moved during review (' + head + ' -> ' + liveSha + '); ' +
                  'stale retry cancelled, waiting for fresh CI on the new HEAD.'
                );
                return;
              }
            } catch (err) {
              core.warning(`Could not revalidate the live PR head: ${err.message}`);
            }
            const kind = String(process.env.RECOVERY_KIND || 'review').toLowerCase();
            const attempt = Number(process.env.RETRY_ATTEMPT || '0');
            const exhausted = Number.isInteger(attempt) && attempt >= 2;
            const next = Number.isInteger(attempt) ? attempt + 1 : 1;
            const stateMarker = exhausted
              ? '<!-- continuum-pr-agent-retry-exhausted head=' + head +
                ' kind=' + kind + ' attempts=' + next + ' -->'
              : '<!-- continuum-pr-agent-retry head=' + head +
                ' kind=' + kind + ' attempt=' + next + ' -->';
            const summary = exhausted
              ? 'Retry budget exhausted for ' + kind + ' on exact HEAD ' + head + '.'
              : 'Transient ' + kind + ' failure; bounded retry ' + next + '/3 is scheduled for exact HEAD ' + head + '.';
            const body = policy.controllerStateBody(stateMarker, summary);
            // Bounded scan (#254): ten pages cover any realistic controller
            // history; a truncated window only drops old history, which the
            // prune loop below removes once visible. `listComments` is
            // oldest-first and ignores sort/direction, so count down from
            // the issue total to scan newest-first.
            // Target-aware: delegated reads use the resolved child.
            const comments = [];
            const total = (await github.rest.issues.get({ owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: prNumber })).data.comments || 0;
            const lastPage = Math.max(1, Math.ceil(total / 100));
            for (let page = 1; page <= 10; page += 1) {
              const targetPage = lastPage - (page - 1);
              if (targetPage < 1) break;
              const { data } = await github.rest.issues.listComments(
                { owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER, repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO, issue_number: prNumber, per_page: 100, page: targetPage }
              );
              if (!Array.isArray(data) || data.length === 0) continue;
              comments.push(...data);
            }
            const controller = comments
              .filter(comment => String(comment.body || '').includes(policy.CONTROLLER_STATE_MARKER))
              .sort((a, b) => Number(a.id) - Number(b.id));
            const latest = controller.at(-1);
            if (latest) {
              await github.rest.issues.updateComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: latest.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                issue_number: prNumber,
                body,
              });
            }
            for (const stale of controller.slice(0, -1)) {
              await github.rest.issues.deleteComment({
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                comment_id: stale.id,
              });
            }

      - name: Schedule bounded retry for retryable PR-Agent review failure
        if: >-
          always() &&
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          failure() &&
          (steps.install_pragent.outcome == 'failure' ||
           steps.install_opencode.outcome == 'failure' ||
           steps.start_opencode.outcome == 'failure' ||
           steps.runtime.outcome == 'failure' ||
           steps.start_bridge.outcome == 'failure' ||
           steps.pragent.outcome == 'failure' ||
           steps.result.outcome == 'failure' ||
           steps.persistent.outcome == 'failure' ||
           steps.improve_gate.outcome == 'failure' ||
           steps.improve.outcome == 'failure' ||
           steps.improve_skipped.outcome == 'failure' ||
           steps.post_improve.outcome == 'failure' ||
           steps.improve_output.outcome == 'failure') &&
           steps.result.outputs.stale_head != 'true' &&
           steps.persistent.outputs.stale_head != 'true' &&
           steps.improve_gate.outputs.stale_head != 'true' &&
           steps.improve.outputs.stale_head != 'true' &&
           steps.improve_skipped.outputs.stale_head != 'true' &&
           steps.post_improve.outputs.stale_head != 'true'
        env:
          # Target-aware revalidation (gh pr view plus exact-HEAD workflow-run
          # evidence against the resolved target). Local same-repository reads
          # use github.token; delegated cross-repository reads require TAP_PAT.
          # The fallback is gated on non-delegated runs so a delegated run
          # without PAT yields an empty token (auth itself fails closed).
          GH_TOKEN: ${{ env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED == 'true' && secrets.TAP_PAT || (env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED != 'true' && github.token || '') }}
          TAP_PAT: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          RETRY_ATTEMPT: ${{ steps.stack.outputs.retry_attempt }}
          RETRY_WORKFLOW: ${{ steps.stack.outputs.retry_workflow }}
          CURRENT_RECOVERY_KIND: ${{ steps.stack.outputs.recovery_kind }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CONTINUUM_REF_INPUT: ${{ inputs.continuum_ref }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        run: |
          set -euo pipefail
          # Target-aware revalidation against the resolved target: local
          # same-repository reads use github.token while delegated
          # cross-repository reads require TAP_PAT. Fail closed when
          # delegated without PAT instead of masking an auth failure as
          # stale-cancelled via the revalidation branches below.
          if [[ "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" == "true" && -z "${TAP_PAT:-}" ]]; then
            echo "::error::Delegated PR-Agent retry requires TAP_PAT; refusing to silently cancel."
            exit 1
          fi
          attempt="${RETRY_ATTEMPT:-0}"
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0
          case "$RETRY_WORKFLOW" in
            continuum-pr-agent.yml|pr-agent.yml) ;;
            *)
              echo "::error::Invalid isolated PR-Agent retry workflow: $RETRY_WORKFLOW"
              exit 1
              ;;
          esac
          if (( attempt >= 2 )); then
            echo "Retry budget exhausted for PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi

          # Defense in depth: every stale-head discard above carries its own
          # flag, but cancel before the backoff anyway so a superseded SHA
          # never sleeps toward a dispatch. The post-backoff revalidation
          # below remains as further defense in depth.
          if live_head="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid 2>/dev/null)"; then
            if [[ -n "$live_head" && "$live_head" != "$HEAD_SHA" ]]; then
              echo "PR head moved ($HEAD_SHA -> $live_head); stale retry cancelled."
              exit 0
            fi
          fi

          next=$((attempt + 1))
          delay=$((15 * (1 << attempt)))
          sleep "$delay"

          if ! current="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv')"; then
            echo "Could not revalidate PR state after backoff; stale retry cancelled."
            exit 0
          fi
          current_sha="$(cut -f1 <<<"$current")"
          current_state="$(cut -f2 <<<"$current")"
          current_draft="$(cut -f3 <<<"$current")"
          if [[ "$current_sha" != "$HEAD_SHA" || "$current_state" != "OPEN" || "$current_draft" == "true" ]]; then
            echo "PR state changed during retry backoff; stale retry cancelled."
            exit 0
          fi
          CI_JSON="$RUNNER_TEMP/pr-agent-ci-runs.json"
          if ! gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" > "$CI_JSON"; then
            echo "Could not revalidate exact-HEAD CI after backoff; stale retry cancelled."
            exit 0
          fi
          if ! python3 - "$CI_JSON" "$CI_WORKFLOW_NAME" "$HEAD_SHA" "${CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED:-false}" <<'PY'
          import json, sys
          path, workflow, head, delegated = sys.argv[1:5]
          with open(path, "r", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          current = sorted(
              (run for run in runs if run.get("name") == workflow and run.get("head_sha") == head),
              key=lambda run: run.get("created_at") or "",
              reverse=True,
          )
          conclusion = current[0].get("conclusion") if current else None
          accepted = (
              current
              and current[0].get("status") == "completed"
              and (
                  conclusion == "success"
                  or (delegated == "true" and conclusion == "skipped")
              )
          )
          raise SystemExit(0 if accepted else 1)
          PY
          then
            echo "Exact HEAD no longer has green CI; retry cancelled until a fresh CI event."
            exit 0
          fi

          DEFAULT_BRANCH="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)"
          DEFAULT_BRANCH="$(printf '%s' "${DEFAULT_BRANCH:-main}" | tr -d ' \t\r\n')"
          case "$DEFAULT_BRANCH" in
            ""|*".."*|*"//"*|*"@{"*|*/|*.|*.lock|HEAD|"@"|refs/*|-*|.*) DEFAULT_BRANCH="main" ;;
          esac
          if ! [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then DEFAULT_BRANCH="main"; fi
          if [[ "$DEFAULT_BRANCH" == */.*/* || "$DEFAULT_BRANCH" == .*/ || "$DEFAULT_BRANCH" == */. ]] || [[ "$DEFAULT_BRANCH" =~ (^|/)\. ]] || [[ "$DEFAULT_BRANCH" =~ \.lock($|/) ]]; then DEFAULT_BRANCH="main"; fi
          # Local runs dispatch bare: a custom retry_workflow without the
          # target_child_id workflow_dispatch input rejects unknown inputs,
          # so an empty value must be omitted (mirrors recovery JS). A
          # delegated dispatch rejected as an unknown input fails closed
          # here with an explicit message instead of a generic shell error
          # (mirrors the merge-wakeup 422 detection).
          dispatch_isolated_retry() {
            local dispatch_output dispatch_status
            set +e
            dispatch_output="$(gh workflow run "$RETRY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" "$@" 2>&1)"
            dispatch_status=$?
            set -e
            if (( dispatch_status == 0 )); then
              printf '%s\n' "$dispatch_output"
              return 0
            fi
            printf '%s\n' "$dispatch_output" >&2
            if [[ -n "${TARGET_CHILD_ID:-}" ]] && [[ "$dispatch_output" == *"422"* ]] && [[ "${dispatch_output,,}" == *"target_child_id"* ]]; then
              echo "::error::Delegated retry requires retry workflow $RETRY_WORKFLOW to declare a target_child_id workflow_dispatch input; refusing bare retry to preserve the delegated target."
              return 1
            fi
            return "$dispatch_status"
          }
          CONTINUUM_REF_INPUT="${CONTINUUM_REF_INPUT:-}"
          if [[ -n "${TARGET_CHILD_ID:-}" ]]; then
            : "${CONTINUUM_REF_INPUT:?CONTINUUM_REF is required for delegated retry}"
            dispatch_isolated_retry -f pr_number="$PR_NUMBER" -f expected_head_sha="$HEAD_SHA" -f retry_attempt="$next" -f retry_workflow="$RETRY_WORKFLOW" -f recovery_kind="${CURRENT_RECOVERY_KIND:-review}" -f target_child_id="$TARGET_CHILD_ID" -f continuum_ref="$CONTINUUM_REF_INPUT"
          else
            dispatch_isolated_retry -f pr_number="$PR_NUMBER" -f expected_head_sha="$HEAD_SHA" -f retry_attempt="$next" -f retry_workflow="$RETRY_WORKFLOW" -f recovery_kind="${CURRENT_RECOVERY_KIND:-review}"
          fi
          echo "Dispatched isolated PR-Agent retry attempt $next/3 for PR #$PR_NUMBER HEAD $HEAD_SHA."

  repair:
    needs: pr_agent
    if: >-
      needs.pr_agent.outputs.admitted == 'true' &&
      needs.pr_agent.outputs.needs_repair == 'true'
    uses: ./.github/workflows/continuum-pr-agent-repair.yml
    secrets: inherit
    with:
      continuum_ref: ${{ inputs.continuum_ref }}
      review_provider: ${{ needs.pr_agent.outputs.review_provider }}
      pr_number: ${{ needs.pr_agent.outputs.pr_number }}
      head_sha: ${{ needs.pr_agent.outputs.head_sha }}
      review_json: ${{ needs.pr_agent.outputs.review_json }}
      improve_jsonl: ${{ needs.pr_agent.outputs.improve_jsonl }}
      retry_attempt: ${{ needs.pr_agent.outputs.recovery_kind == 'repair' && needs.pr_agent.outputs.retry_attempt || '0' }}
      retry_workflow: ${{ needs.pr_agent.outputs.retry_workflow }}
      target_child_id: ${{ inputs.target_child_id }}

  merge:
    needs: pr_agent
    if: >-
      needs.pr_agent.outputs.admitted == 'true' &&
      needs.pr_agent.outputs.ready_to_merge == 'true'
    uses: ./.github/workflows/continuum-pr-agent-auto-merge.yml
    secrets: inherit
    with:
      continuum_ref: ${{ inputs.continuum_ref }}
      review_provider: ${{ needs.pr_agent.outputs.review_provider }}
      pr_number: ${{ needs.pr_agent.outputs.pr_number }}
      head_sha: ${{ needs.pr_agent.outputs.head_sha }}
      review_json: ${{ needs.pr_agent.outputs.review_json }}
      improve_jsonl: ${{ needs.pr_agent.outputs.improve_jsonl }}
      persistent_state_json: ${{ needs.pr_agent.outputs.persistent_state_json }}
      target_child_id: ${{ inputs.target_child_id }}
