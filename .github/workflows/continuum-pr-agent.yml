name: PR Agent (OpenCode backend)

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      enabled:
        description: >-
          Legacy enable flag for the PR-Agent review provider. Empty falls
          back to vars.CONTINUUM_PR_AGENT_ENABLED, then to 'false'. Prefer
          the canonical review_provider input /
          vars.CONTINUUM_REVIEW_PROVIDER: contradictory values fail closed.
          Consumers that do not enable PR-Agent are unaffected: the run
          posts one explicit disabled notice instead of reviewing.
        type: string
        default: ''
        required: false
      review_provider:
        description: >-
          Canonical review provider (none|coderabbit|pr-agent). Empty falls
          back to vars.CONTINUUM_REVIEW_PROVIDER, then to legacy enabled /
          vars.CONTINUUM_PR_AGENT_ENABLED compatibility. The selected
          provider must be pr-agent (or empty with the legacy flag on) for
          this workflow to review; any other selected provider skips with an
          explicit notice.
        type: string
        default: ''
        required: false
      api_base:
        description: >-
          OpenAI-compatible backend base URL PR-Agent talks to. Empty falls
          back to vars.PR_AGENT_API_BASE, then to the runner-local bridge
          (http://127.0.0.1:<bridge_port>/v1).
        type: string
        default: ''
        required: false
      model:
        description: >-
          LiteLLM model id PR-Agent requests (openai/ prefix routes through
          the bridge). Empty falls back to vars.PR_AGENT_MODEL, then to
          'openai/continuum-review'.
        type: string
        default: ''
        required: false
      max_tokens:
        description: >-
          Token/output limit forwarded as the custom-model cap. Empty falls
          back to vars.PR_AGENT_MAX_TOKENS, then to '128000'.
        type: string
        default: ''
        required: false
      opencode_model:
        description: >-
          OpenCode provider/model the bridge infers with. Empty falls back to
          vars.OPENCODE_MODEL, then to the free
          'opencode/muse-spark-1.3-contributor-free' route. No paid-provider
          secret is ever required.
        type: string
        default: ''
        required: false
      bridge_port:
        description: >-
          Loopback port the compatibility bridge binds. Empty falls back to
          vars.PR_AGENT_BRIDGE_PORT, then to '18000'.
        type: string
        default: ''
        required: false
      server_port:
        description: >-
          Loopback port `opencode serve` binds. Empty falls back to
          vars.PR_AGENT_OPENCODE_PORT, then to '4096'.
        type: string
        default: ''
        required: false
      pr_agent_version:
        description: >-
          Pinned pr-agent PyPI release installed on the runner. Empty falls
          back to vars.PR_AGENT_VERSION, then to '0.46.0'.
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  pr-agent:
    if: >-
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.actor == github.repository_owner &&
        (
          startsWith(github.event.comment.body, '/review') ||
          startsWith(github.event.comment.body, '/describe') ||
          startsWith(github.event.comment.body, '/ask') ||
          startsWith(github.event.comment.body, '/verify')
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_PR_AGENT_TIMEOUT_MINUTES || '60') }}

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Resolve PR-Agent configuration
        id: config
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_ENABLED: ${{ inputs.enabled }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
          INPUT_OPENCODE_MODEL: ${{ inputs.opencode_model }}
          INPUT_BRIDGE_PORT: ${{ inputs.bridge_port }}
          INPUT_SERVER_PORT: ${{ inputs.server_port }}
          INPUT_PR_AGENT_VERSION: ${{ inputs.pr_agent_version }}
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_ENABLED: ${{ vars.CONTINUUM_PR_AGENT_ENABLED }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
          CFG_REQUIRE_CODERABBIT: ${{ vars.CONTINUUM_REQUIRE_CODERABBIT }}
          CFG_API_BASE: ${{ vars.PR_AGENT_API_BASE }}
          CFG_MODEL: ${{ vars.PR_AGENT_MODEL }}
          CFG_MAX_TOKENS: ${{ vars.PR_AGENT_MAX_TOKENS }}
          CFG_OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          CFG_BRIDGE_PORT: ${{ vars.PR_AGENT_BRIDGE_PORT }}
          CFG_SERVER_PORT: ${{ vars.PR_AGENT_OPENCODE_PORT }}
          CFG_PR_AGENT_VERSION: ${{ vars.PR_AGENT_VERSION }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const automaticReview = context.eventName === 'pull_request_target';
            const body = String(context.payload.comment?.body || '');
            const prNumber = automaticReview
              ? context.payload.pull_request?.number
              : context.payload.issue?.number;
            if (!prNumber) {
              core.setFailed('PR-Agent could not resolve a pull request number.');
              return;
            }

            let command = automaticReview ? 'review' : null;
            let argument = '';
            if (!automaticReview) {
              for (const name of ['/verify', '/review', '/describe', '/ask']) {
                if (body.startsWith(name) && (body.length === name.length || /\s/.test(body[name.length]))) {
                  command = name.slice(1);
                  argument = body.slice(name.length).trim();
                  break;
                }
              }
            }
            if (!command) {
              core.setFailed(`Unsupported PR-Agent command in: ${body.split('\n')[0]}`);
              return;
            }

            const pick = (input, vars, fallback) =>
              String(input || process.env[vars] || fallback || '').trim();
            // vars.* are read via the env snapshot below, because
            // github-script expressions cannot expand them dynamically.
            const enabledRaw = pick(process.env.INPUT_ENABLED, 'CFG_ENABLED', 'false').toLowerCase();
            const legacyEnabled = enabledRaw === 'true' || enabledRaw === '1';
            const canonical = pick(process.env.INPUT_REVIEW_PROVIDER, 'CFG_REVIEW_PROVIDER', '').toLowerCase();
            const legacyRabbitRaw = String(process.env.CFG_REQUIRE_CODERABBIT || '').trim().toLowerCase();
            const legacyRabbit = legacyRabbitRaw === 'true' || legacyRabbitRaw === '1';
            if (legacyEnabled && legacyRabbit) {
              core.setFailed(
                'Contradictory review configuration: CONTINUUM_PR_AGENT_ENABLED and CONTINUUM_REQUIRE_CODERABBIT are both enabled; select exactly one review provider.'
              );
              return;
            }
            if (canonical && !['none', 'coderabbit', 'pr-agent'].includes(canonical)) {
              core.setFailed(`Unknown review provider: ${canonical}`);
              return;
            }
            const legacyProvider = legacyEnabled ? 'pr-agent' : (legacyRabbit ? 'coderabbit' : '');
            if (canonical && legacyProvider && canonical !== legacyProvider) {
              core.setFailed(
                `Contradictory review configuration: CONTINUUM_REVIEW_PROVIDER=${canonical} disagrees with legacy selection ${legacyProvider}.`
              );
              return;
            }
            // Single canonical selector: an explicit provider wins, otherwise
            // the legacy flag decides, otherwise no provider is required.
            const reviewProvider = canonical || legacyProvider || 'none';
            const enabled = reviewProvider === 'pr-agent' ? 'true' : 'false';
            core.setOutput('review_provider', reviewProvider);
            const bridgePort = pick(process.env.INPUT_BRIDGE_PORT, 'CFG_BRIDGE_PORT', '18000');
            const apiBase = pick(
              process.env.INPUT_API_BASE, 'CFG_API_BASE', `http://127.0.0.1:${bridgePort}/v1`
            );

            core.setOutput('enabled', enabled === 'true' || enabled === '1' ? 'true' : 'false');
            core.setOutput('api_base', apiBase);
            core.setOutput('model', pick(process.env.INPUT_MODEL, 'CFG_MODEL', 'openai/continuum-review'));
            core.setOutput('max_tokens', pick(process.env.INPUT_MAX_TOKENS, 'CFG_MAX_TOKENS', '128000'));
            core.setOutput(
              'opencode_model',
              pick(process.env.INPUT_OPENCODE_MODEL, 'CFG_OPENCODE_MODEL', 'opencode/muse-spark-1.3-contributor-free')
            );
            core.setOutput('bridge_port', bridgePort);
            core.setOutput('server_port', pick(process.env.INPUT_SERVER_PORT, 'CFG_SERVER_PORT', '4096'));
            core.setOutput(
              'pr_agent_version', pick(process.env.INPUT_PR_AGENT_VERSION, 'CFG_PR_AGENT_VERSION', '0.46.0')
            );
            core.setOutput('command', command);
            core.setOutput('argument', argument);
            core.setOutput('pr_number', String(prNumber));

            if (command === 'verify' && !argument) {
              core.setFailed('Usage: /verify <finding-id> (the inline review comment id).');
            }

      - name: Report the disabled provider explicitly
        if: steps.config.outputs.enabled != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.config.outputs.pr_number }}'),
              body: [
                'PR-Agent is not enabled in this repository.',
                '',
                'Set the `CONTINUUM_PR_AGENT_ENABLED` repository variable to `true` ' +
                'to enable the optional OpenCode-backed review provider. ' +
                'No paid-provider secret is required.',
              ].join('\n'),
            });

      - name: Checkout the pull request head
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: refs/pull/${{ steps.config.outputs.pr_number }}/head

      - name: Checkout Continuum engine for bridge fallback
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kodmial/continuum
          ref: ${{ inputs.continuum_ref }}
          path: .continuum-engine
          fetch-depth: 1
          persist-credentials: false

      - name: Record the reviewed head
        if: steps.config.outputs.enabled == 'true'
        id: head
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.config.outputs.pr_number }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ -n "$HEAD_SHA" ]] || { echo "::error::Could not resolve PR #$PR_NUMBER head."; exit 1; }
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "LOCAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The bridge script ships in Continuum; a consumer checkout never has
          # it, so fall back to the pinned engine revision.
          if [[ -f .github/scripts/pr_agent_bridge.py ]]; then
            echo "BRIDGE_SCRIPT=.github/scripts/pr_agent_bridge.py" >> "$GITHUB_ENV"
          else
            echo "BRIDGE_SCRIPT=.continuum-engine/.github/scripts/pr_agent_bridge.py" >> "$GITHUB_ENV"
          fi

      # The upstream composite action resolves releases/latest before doing any
      # useful work. Pin the CLI instead so API availability or rate limiting
      # cannot prevent the review backend from starting.
      - name: Install OpenCode CLI
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Install the pinned PR-Agent release on the runner
        if: steps.config.outputs.enabled == 'true'
        env:
          PR_AGENT_VERSION: ${{ steps.config.outputs.pr_agent_version }}
        run: |
          set -euo pipefail
          # A Docker action cannot reach the runner-local 127.0.0.1 bridge, so
          # the pinned release runs directly on the runner instead of in a
          # container. Never use host.docker.internal here: it is undocumented
          # on GitHub-hosted runners.
          python3 -m pip install --quiet "pr-agent==${PR_AGENT_VERSION}"
          pr-agent --version

      - name: Start opencode serve on loopback
        if: steps.config.outputs.enabled == 'true'
        env:
          OPENCODE_MODEL: ${{ steps.config.outputs.opencode_model }}
          SERVER_PORT: ${{ steps.config.outputs.server_port }}
        run: |
          set -euo pipefail
          # Bind the minimum network surface: loopback only. Do NOT inject a
          # restrictive OPENCODE_CONFIG_CONTENT here: the free tier rejects
          # server-side permission overrides, so inference hardening lives in
          # the bridge (read-only plan agent + reviewer-only system prompt)
          # and in the post-run git-clean guard below.
          (setsid nohup opencode serve --hostname 127.0.0.1 --port "$SERVER_PORT" \
            > "$RUNNER_TEMP/opencode-serve.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${SERVER_PORT}/global/health" >/dev/null 2>&1; then
              echo "opencode serve is up on 127.0.0.1:${SERVER_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::opencode serve did not become ready."
          cat "$RUNNER_TEMP/opencode-serve.log" || true
          exit 1

      - name: Start the OpenAI-compatibility bridge on loopback
        if: steps.config.outputs.enabled == 'true'
        env:
          OPENCODE_SERVER_URL: http://127.0.0.1:${{ steps.config.outputs.server_port }}
          OPENCODE_MODEL: ${{ steps.config.outputs.opencode_model }}
          PR_AGENT_BRIDGE_PORT: ${{ steps.config.outputs.bridge_port }}
          PR_AGENT_TIMEOUT_SECONDS: '170'
        run: |
          set -euo pipefail
          # The bridge exposes only the OpenAI-compatible surface PR-Agent
          # needs (/v1/chat/completions, /v1/models, health). The full
          # OpenCode control API is never exposed.
          (setsid nohup python3 "$BRIDGE_SCRIPT" \
            > "$RUNNER_TEMP/pr-agent-bridge.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PR_AGENT_BRIDGE_PORT}/v1/models" >/dev/null 2>&1; then
              echo "bridge is up on 127.0.0.1:${PR_AGENT_BRIDGE_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::compatibility bridge did not become ready."
          cat "$RUNNER_TEMP/pr-agent-bridge.log" || true
          exit 1

      - name: Run PR-Agent review over the bridge
        if: steps.config.outputs.enabled == 'true' && (steps.config.outputs.command == 'review' || steps.config.outputs.command == 'describe' || steps.config.outputs.command == 'ask')
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          GITHUB__USER_TOKEN: ${{ secrets.TAP_PAT }}
          CONFIG__GIT_PROVIDER: github
          CONFIG__MODEL: ${{ steps.config.outputs.model }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ steps.config.outputs.max_tokens }}
          OPENAI__API_BASE: ${{ steps.config.outputs.api_base }}
          # LiteLLM requires a key string on the OpenAI route; this loopback
          # placeholder is not a credential and the bridge ignores it.
          OPENAI__KEY: continuum-loopback
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.config.outputs.pr_number }}
          PR_COMMAND: ${{ steps.config.outputs.command }}
          PR_ARGUMENT: ${{ steps.config.outputs.argument }}
        run: |
          set -euo pipefail
          case "$PR_COMMAND" in
            review)
              # Reviews the exact current PR head: PR-Agent fetches the diff
              # for the head resolved above. Large-PR chunking and the review
              # coverage footer come from the shipped .pr_agent.toml.
              pr-agent --pr_url "$PR_URL" review
              ;;
            describe)
              pr-agent --pr_url "$PR_URL" describe
              ;;
            ask)
              [[ -n "$PR_ARGUMENT" ]] || { echo "::error::Usage: /ask <question>."; exit 1; }
              pr-agent --pr_url "$PR_URL" ask "$PR_ARGUMENT"
              ;;
          esac

      - name: Verify one finding against the current head
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.command == 'verify'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          FINDING_ID: ${{ steps.config.outputs.argument }}
          BRIDGE_URL: ${{ steps.config.outputs.api_base }}
          BRIDGE_MODEL: ${{ steps.config.outputs.model }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const headSha = process.env.HEAD_SHA;
            // Normalized finding identity: the stable `pra-<digest>` id from
            // the provider-owned `pr-agent-review-state:v1` block for this
            // review instance. Raw inline review-comment ids are never
            // accepted here: verification selects the exact normalized id,
            // excludes replies/unrelated comments, and enforces
            // provider/head correlation.
            const findingId = String(process.env.FINDING_ID || '').trim().split(/\s+/)[0] || '';
            if (!findingId || !/^[A-Za-z0-9_-]+$/.test(findingId)) {
              core.setFailed('Usage: /verify <finding-id> (the normalized PR-Agent finding id, e.g. pra-<digest>).');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number('${{ steps.config.outputs.pr_number }}');
            const providerOwned = (login) =>
              login === owner || login === 'github-actions[bot]' || login === 'github-actions';
            const stateRe = /<!--\s*pr-agent-review-state:v1\s*\n([\s\S]*?)-->/g;

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pullNumber, per_page: 100 }
            );
            // Provider-owned state only: arbitrary human/other-bot comments
            // are never findings, even when they carry a similar marker.
            const states = [];
            for (const comment of issueComments) {
              if (!providerOwned(comment.user?.login)) continue;
              stateRe.lastIndex = 0;
              let match = null;
              while ((match = stateRe.exec(comment.body || '')) !== null) {
                try {
                  states.push({ state: JSON.parse(match[1]), createdAt: comment.created_at });
                } catch (err) {
                  core.setFailed(`PR-Agent review state is not valid JSON: ${err.message}`);
                  return;
                }
              }
            }
            const headOf = (state) =>
              state.reviewed_sha || state.head_sha || state.head || state.sha ||
              state.last_run?.reviewed_sha || state.last_run?.head_sha || '';
            const exact = states.filter((entry) =>
              String(entry.state.provider || 'pr-agent').toLowerCase() === 'pr-agent' &&
              String(headOf(entry.state) || '').toLowerCase() === String(headSha).toLowerCase()
            );
            if (exact.length === 0) {
              core.setFailed(
                `No provider-owned PR-Agent state for exact HEAD ${headSha}; stale verification is rejected.`
              );
              return;
            }
            const state = exact[exact.length - 1].state;
            const complete = state.complete ?? state.last_run?.complete;
            if (complete !== true) {
              core.setFailed('PR-Agent review state is incomplete or partial: failing closed.');
              return;
            }
            const coverage = state.coverage;
            if (coverage && Number(coverage.total) > 0 && Number(coverage.reviewed) < Number(coverage.total)) {
              core.setFailed('PR-Agent review coverage is partial: failing closed.');
              return;
            }
            const ACTIVE = new Set(['ACTIVE', 'OPEN', 'UNRESOLVED']);
            const entries = Array.isArray(state.findings) ? state.findings : [];
            const entry = entries.find((item) => String(item?.id || '') === findingId);
            if (!entry || !ACTIVE.has(String(entry.status || 'ACTIVE').toUpperCase())) {
              core.setFailed(
                `Finding ${findingId} is not an ACTIVE normalized finding of the provider-owned review instance at ${headSha}.`
              );
              return;
            }
            const marker =
              `<!-- continuum-pr-agent-verify finding=${findingId} head=${headSha} -->`;
            if (issueComments.some((c) =>
              providerOwned(c.user?.login) && (c.body || '').includes(marker))) {
              core.notice(`Finding ${findingId} was already verified at ${headSha}.`);
              return;
            }

            let current = '';
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: entry.path, ref: headSha,
              });
              if (!Array.isArray(file) && file.content) {
                current = Buffer.from(file.content, 'base64').toString('utf8');
              }
            } catch (err) {
              if (err.status !== 404) throw err;
            }
            const prompt = [
              'You are a read-only code reviewer. Decide whether the review finding below',
              `still applies to the CURRENT file content at PR HEAD ${headSha}.`,
              '',
              `Finding (${entry.path || ''}, line ${entry.line || 0}):`,
              entry.summary || entry.title || findingId,
              '',
              'Current file content:',
              current ? current.slice(0, 20000) : '(file no longer exists at this HEAD)',
              '',
              'Reply with exactly **RESOLVED** if the underlying issue is fully fixed,',
              'otherwise reply with exactly **UNRESOLVED** and state what remains.',
            ].join('\n');

            const res = await fetch(`${process.env.BRIDGE_URL}/chat/completions`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: process.env.BRIDGE_MODEL,
                messages: [{ role: 'user', content: prompt }],
              }),
            });
            if (!res.ok) {
              core.setFailed(`Verify inference failed: bridge answered ${res.status}.`);
              return;
            }
            const completion = await res.json();
            const text = completion.choices?.[0]?.message?.content || '';
            // UNRESOLVED always wins: only an explicit **RESOLVED** without any
            // UNRESOLVED mention counts as resolved.
            const verdict = /\bUNRESOLVED\b/i.test(text)
              ? 'UNRESOLVED'
              : (/\*\*RESOLVED(?:\.|\*\*)/i.test(text) ? 'RESOLVED' : 'UNRESOLVED');
            await github.rest.issues.createComment({
              owner, repo, issue_number: pullNumber,
              body: [
                marker,
                `Verification at HEAD \`${headSha}\`: **${verdict}**`,
                '',
                `Finding: \`${findingId}\` (${entry.path || ''}:${entry.line || 0})`,
                '',
                text.slice(0, 3000),
              ].join('\n'),
            });
            core.notice(`Finding ${findingId} verified at ${headSha}: ${verdict}.`);

      - name: Fail closed on a moved head
        if: steps.config.outputs.enabled == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.config.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "$CURRENT_SHA" != "$REVIEWED_SHA" ]]; then
            echo "::error::PR head moved during review ($REVIEWED_SHA -> $CURRENT_SHA); the review is stale."
            exit 1
          fi
          echo "Reviewed head $REVIEWED_SHA is still current."

      # PR-Agent is reviewer-only: it must never modify the checkout. The
      # read-only plan agent and the reviewer-only system prompt already
      # constrain inference; this guard proves the run kept that promise.
      - name: Prove the checkout is unmodified
        if: steps.config.outputs.enabled == 'true' && always()
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain -- . ':(exclude).continuum-engine')"
          if [[ -n "$DIRTY" ]]; then
            echo "::error::PR-Agent modified the checkout; reviewer-only runs must not."
            printf '%s\n' "$DIRTY"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$LOCAL_SHA" ]]; then
            echo "::error::PR-Agent created commits; reviewer-only runs must not."
            exit 1
          fi
          echo "Checkout is unmodified: reviewer-only holds."

      - name: Record review evidence and dispatch generic repair
        if: steps.config.outputs.enabled == 'true' && steps.config.outputs.command == 'review'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
          REVIEW_PROVIDER: ${{ steps.config.outputs.review_provider }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number('${{ steps.config.outputs.pr_number }}');
            const reviewedSha = process.env.REVIEWED_SHA;
            const provider = process.env.REVIEW_PROVIDER || 'pr-agent';
            // The destructured `data` IS the pull request object itself, so
            // the head ships directly on it (re-qualifying through a nested
            // data member crashes after destructuring).
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber });
            const headSha = pr.head.sha;
            if (headSha !== reviewedSha) {
              core.setFailed(`PR head moved during review (${reviewedSha} -> ${headSha}); the review is stale.`);
              return;
            }
            // Adapter parses its own native output: the provider-owned
            // `pr-agent-review-state:v1` block in the persistent PR Reviewer
            // Guide comment. Inline review comments are NEVER findings on
            // this path: the OpenCode-backed backend emits zero review
            // submissions, so counting them false-approves real findings.
            const providerOwned = (login) =>
              login === owner || login === 'github-actions[bot]' || login === 'github-actions';
            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pullNumber, per_page: 100 }
            );
            const stateRe = /<!--\s*pr-agent-review-state:v1\s*\n([\s\S]*?)-->/g;
            const states = [];
            for (const comment of issueComments) {
              if (!providerOwned(comment.user?.login)) continue;
              stateRe.lastIndex = 0;
              let match = null;
              while ((match = stateRe.exec(comment.body || '')) !== null) {
                try {
                  states.push({ state: JSON.parse(match[1]), createdAt: comment.created_at });
                } catch (err) {
                  core.setFailed(`PR-Agent review state is not valid JSON: ${err.message}`);
                  return;
                }
              }
            }
            const headOf = (state) =>
              state.reviewed_sha || state.head_sha || state.head || state.sha ||
              state.last_run?.reviewed_sha || state.last_run?.head_sha || '';
            // Correlate the state to the exact reviewed HEAD: stale blocks
            // from an old HEAD never satisfy the current review, and a stale
            // review/verification is rejected, not silently carried.
            const exact = states.filter((entry) =>
              String(entry.state.provider || 'pr-agent').toLowerCase() === 'pr-agent' &&
              String(headOf(entry.state) || '').toLowerCase() === String(headSha).toLowerCase()
            );
            if (exact.length === 0) {
              core.setFailed(
                `No provider-owned pr-agent-review-state:v1 for exact HEAD ${headSha}; failing closed (never APPROVED).`
              );
              return;
            }
            const state = exact[exact.length - 1].state;
            const reviewId = state.review_id || state.review_instance_id || state.instance_id || reviewedSha;
            // Incomplete/partial review state fails closed and must never
            // become APPROVED.
            const complete = state.complete ?? state.last_run?.complete;
            if (complete !== true) {
              core.setFailed('PR-Agent review state is incomplete (last_run.complete !== true): failing closed.');
              return;
            }
            const coverage = state.coverage;
            if (coverage && Number(coverage.total) > 0 && Number(coverage.reviewed) < Number(coverage.total)) {
              core.setFailed(
                `PR-Agent review coverage is partial (${coverage.reviewed}/${coverage.total}): failing closed.`
              );
              return;
            }
            if (coverage && Number(coverage.total) <= 0) {
              core.setFailed('PR-Agent review coverage is unknown: failing closed.');
              return;
            }
            const ACTIVE = new Set(['ACTIVE', 'OPEN', 'UNRESOLVED']);
            const RESOLVED = new Set(['RESOLVED', 'FIXED', 'DISMISSED', 'DONE']);
            const rawFindings = Array.isArray(state.findings) ? state.findings : [];
            for (const item of rawFindings) {
              const status = String(item?.status || 'ACTIVE').toUpperCase();
              if (!ACTIVE.has(status) && !RESOLVED.has(status)) {
                core.setFailed(`PR-Agent review state has unknown finding status ${status}: failing closed.`);
                return;
              }
            }
            const findings = rawFindings
              .filter((item) => ACTIVE.has(String(item?.status || 'ACTIVE').toUpperCase()))
              .map((item) => ({
                id: String(item.id || ''),
                path: String(item.path || ''),
                line: Number(item.line || 0),
                severity: String(item.severity || 'high'),
                summary: String(item.summary || item.title || item.rule || item.id || ''),
              }))
              .filter((item) => item.id);
            const verdict = findings.length > 0 ? 'CHANGES_REQUESTED' : 'APPROVED';
            const marker =
              `<!-- continuum-pr-agent-review head=${headSha} verdict=${verdict} -->`;
            if (!issueComments.some((comment) => (comment.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pullNumber,
                body: [marker, `PR-Agent ${verdict} for exact HEAD \`${headSha}\` (${findings.length} normalized finding(s) from pr-agent-review-state:v1).`].join('\n'),
              });
            }
            // Blocking/green semantics: a real GitHub review is created when
            // the execution identity allows it. GitHub forbids approving the
            // actor's own PR, so that limitation is recorded explicitly and
            // the exact-head normalized marker stays authoritative instead of
            // faking APPROVED.
            try {
              await github.rest.pulls.createReview({
                owner, repo, pull_number: pullNumber, commit_id: headSha,
                event: findings.length > 0 ? 'REQUEST_CHANGES' : 'APPROVE',
                body: `${marker}\nPR-Agent ${verdict} for exact HEAD \`${headSha}\`.`,
              });
            } catch (err) {
              const limitation =
                `<!-- continuum-pr-agent-github-review head=${headSha} verdict=${verdict} -->`;
              if (!issueComments.some((comment) => (comment.body || '').includes(limitation))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pullNumber,
                  body: [
                    limitation,
                    `GitHub review submission returned ${err.status || 'an error'} (${(err.message || '').split('\n')[0]}); ` +
                    'the exact-head normalized marker above remains authoritative.',
                  ].join('\n'),
                });
              }
              core.warning(`GitHub review submission unavailable: ${err.message}`);
            }
            if (findings.length === 0) {
              core.notice(`PR #${pullNumber}: PR-Agent approved exact HEAD ${headSha}; no repair dispatch needed.`);
              return;
            }
            // Bounded complete batching: every actionable finding reaches
            // repair. Findings are chunked into complete batches; if complete
            // coverage cannot be represented, the run fails closed instead of
            // silently truncating.
            const PER_BATCH = 50;
            const MAX_BATCHES = 10;
            const batches = [];
            for (let i = 0; i < findings.length; i += PER_BATCH) {
              batches.push(findings.slice(i, i + PER_BATCH));
            }
            if (batches.length > MAX_BATCHES) {
              core.setFailed(
                `PR-Agent finding set needs ${batches.length} batches: failing closed rather than truncating.`
              );
              return;
            }
            let dispatched = 0;
            for (let index = 0; index < batches.length; index += 1) {
              const batch = batches[index];
              // Generic repair controller: one dispatch per normalized batch
              // (provider/review/head/batch/finding-set). Duplicate
              // protection is the per-batch verification marker.
              const batchMarker = `<!-- opencode-review-verification provider=pr-agent review=${reviewId} head=${headSha} batch=${index + 1}/${batches.length} findings=${batch.map((f) => f.id).join(',')} -->`;
              if (issueComments.some((comment) => (comment.body || '').includes(
                `<!-- opencode-review-verification provider=pr-agent review=${reviewId} head=${headSha} batch=${index + 1}/${batches.length}`
              ))) {
                core.info(`Repair already dispatched for PR-Agent review ${reviewId} batch ${index + 1}/${batches.length}.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: pullNumber, body: batchMarker,
              });
              const findingPayload = batch.map((finding) => ({
                id: finding.id, path: finding.path, line: finding.line,
                severity: finding.severity, summary: finding.summary,
              }));
              const findingsJson = JSON.stringify(findingPayload);
              if (!findingsJson || findingsJson === '[]') {
                core.setFailed('Refusing empty findings_json repair dispatch.');
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'continuum-opencode.yml',
                ref: 'main',
                inputs: {
                  mode: 'review-fix',
                  pr_number: String(pullNumber),
                  head_ref: pr.head.ref,
                  review_id: String(reviewId),
                  review_provider: provider,
                  reviewed_sha: reviewedSha,
                  head_sha: headSha,
                  findings_json: findingsJson,
                },
              });
              dispatched += 1;
            }
            core.notice(
              `Dispatched generic OpenCode repair for PR-Agent review ${reviewId} on PR #${pullNumber} with ${findings.length} finding(s) in ${dispatched} batch(es).`
            );

      - name: Stop the review backend
        if: always()
        run: |
          # Bracketed tails keep pkill from matching its own command line.
          pkill -f "opencode serv[e] --hostname 127.0.0.1" || true
          pkill -f "pr_agent_bridge.p[y]" || true
