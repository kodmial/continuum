name: PR Agent (OpenCode backend)

on:
  workflow_call:
    outputs:
      admitted:
        description: Whether the exact PR HEAD was admitted for review.
        value: ${{ jobs.pr_agent.outputs.admitted }}
      head_sha:
        description: Exact PR HEAD reviewed by upstream PR-Agent.
        value: ${{ jobs.pr_agent.outputs.head_sha }}
      review_json:
        description: Native upstream PR-Agent structured review JSON for head_sha.
        value: ${{ jobs.pr_agent.outputs.review_json }}
      improve_jsonl:
        description: Native upstream /improve push_outputs JSONL for head_sha.
        value: ${{ jobs.pr_agent.outputs.improve_jsonl }}
      persistent_state_json:
        description: Native upstream persistent finding state for head_sha.
        value: ${{ jobs.pr_agent.outputs.persistent_state_json }}
      needs_repair:
        description: Whether current native review/improve output requires repair.
        value: ${{ jobs.pr_agent.outputs.needs_repair }}
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
      pr_number:
        description: Pull request number to review. Empty resolves from the event.
        type: string
        default: ''
        required: false
      target_child_id:
        description: Opaque verified child id for delegated execution. Empty targets the caller repository.
        type: string
        default: ''
        required: false
      expected_head_sha:
        description: Exact HEAD SHA the caller observed. Empty resolves from GitHub.
        type: string
        default: ''
        required: false
      api_base:
        description: >-
          OpenAI-compatible backend base URL PR-Agent talks to. Empty falls
          back to vars.PR_AGENT_API_BASE, then to the runner-local bridge
          (http://127.0.0.1:<bridge_port>/v1).
        type: string
        default: ''
        required: false
      model:
        description: >-
          LiteLLM model id PR-Agent requests (openai/ prefix routes through
          the bridge). Empty falls back to vars.PR_AGENT_MODEL, then to
          'openai/continuum-review'.
        type: string
        default: ''
        required: false
      max_tokens:
        description: >-
          Token/output limit forwarded as the custom-model cap. Empty falls
          back to vars.PR_AGENT_MAX_TOKENS, then to '128000'.
        type: string
        default: ''
        required: false
      opencode_model:
        description: >-
          OpenCode provider/model the bridge infers with. Empty falls back to
          vars.OPENCODE_MODEL, then to the free
          'opencode/muse-spark-1.3-contributor-free' route. No paid-provider
          secret is ever required.
        type: string
        default: ''
        required: false
      bridge_port:
        description: >-
          Loopback port the compatibility bridge binds. Empty falls back to
          vars.PR_AGENT_BRIDGE_PORT, then to '18000'.
        type: string
        default: ''
        required: false
      server_port:
        description: >-
          Loopback port `opencode serve` binds. Empty falls back to
          vars.PR_AGENT_OPENCODE_PORT, then to '4096'.
        type: string
        default: ''
        required: false
      pr_agent_version:
        description: >-
          Pinned upstream PR-Agent release installed on the runner. Empty falls
          back to vars.PR_AGENT_VERSION, then to '0.46.0'.
        type: string
        default: ''
        required: false
      retry_attempt:
        description: Bounded PR-Agent retry attempt number (0 = initial run).
        type: string
        default: '0'
        required: false
      retry_workflow:
        description: Caller workflow filename used for isolated PR-Agent retries.
        type: string
        default: 'continuum-pr-agent.yml'
        required: false
      recovery_kind:
        description: "Durable recovery operation identity: review or repair."
        type: string
        default: 'review'
        required: false
      ci_workflow_name:
        description: Exact workflow name proving current-head CI.
        type: string
        default: ''
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr-agent-${{ inputs.target_child_id && format('child-{0}', inputs.target_child_id) || 'local' }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.AUTOMATION_PR_AGENT_TIMEOUT_MINUTES || '60') }}
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      pr_number: ${{ steps.stack.outputs.pr_number }}
      review_provider: ${{ steps.stack.outputs.stack }}
      head_sha: ${{ steps.result.outputs.head_sha }}
      review_json: ${{ steps.pragent.outputs.review }}
      improve_jsonl: ${{ steps.improve_output.outputs.improve_jsonl }}
      persistent_state_json: ${{ steps.persistent.outputs.persistent_state_json }}
      needs_repair: ${{ steps.route.outputs.needs_repair }}
      retry_attempt: ${{ steps.stack.outputs.retry_attempt }}
      retry_workflow: ${{ steps.stack.outputs.retry_workflow }}
      recovery_kind: ${{ steps.stack.outputs.recovery_kind }}

    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: read

    steps:
      - name: Resolve the isolated PR-Agent stack
        id: stack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || github.event.inputs.pr_number || '' }}
          INPUT_EXPECTED_HEAD: ${{ inputs.expected_head_sha || github.event.inputs.expected_head_sha || '' }}
          INPUT_RETRY_ATTEMPT: ${{ inputs.retry_attempt || github.event.inputs.retry_attempt || '0' }}
          INPUT_RETRY_WORKFLOW: ${{ inputs.retry_workflow || '' }}
          INPUT_RECOVERY_KIND: ${{ inputs.recovery_kind || github.event.inputs.recovery_kind || 'review' }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
          INPUT_OPENCODE_MODEL: ${{ inputs.opencode_model }}
          INPUT_BRIDGE_PORT: ${{ inputs.bridge_port }}
          INPUT_SERVER_PORT: ${{ inputs.server_port }}
          INPUT_PR_AGENT_VERSION: ${{ inputs.pr_agent_version }}
          CFG_API_BASE: ${{ vars.PR_AGENT_API_BASE }}
          CFG_MODEL: ${{ vars.PR_AGENT_MODEL }}
          CFG_MAX_TOKENS: ${{ vars.PR_AGENT_MAX_TOKENS }}
          CFG_OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          CFG_BRIDGE_PORT: ${{ vars.PR_AGENT_BRIDGE_PORT }}
          CFG_SERVER_PORT: ${{ vars.PR_AGENT_OPENCODE_PORT }}
          CFG_PR_AGENT_VERSION: ${{ vars.PR_AGENT_VERSION }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // A single selector owns the whole review stack.
            const pick = (input, vars, fallback) =>
              String(input || process.env[vars] || fallback || '').trim();
            const reviewProvider = pick(
              process.env.INPUT_REVIEW_PROVIDER,
              'CFG_REVIEW_PROVIDER',
              'none'
            ).toLowerCase();
            if (!['none', 'coderabbit', 'pr-agent'].includes(reviewProvider)) {
              core.setFailed(
                `Invalid CONTINUUM_REVIEW_PROVIDER="${reviewProvider}". Expected none, coderabbit, or pr-agent.`
              );
              return;
            }
            const enabled = reviewProvider === 'pr-agent';
            const eventPr =
              context.payload.pull_request?.number ||
              context.payload.issue?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              '';
            const prNumber = String(process.env.INPUT_PR_NUMBER || eventPr || '').trim();
            if (!prNumber) {
              core.setFailed('PR-Agent could not resolve a pull request number.');
              return;
            }
            const bridgePort = pick(process.env.INPUT_BRIDGE_PORT, 'CFG_BRIDGE_PORT', '18000');
            const apiBase = pick(
              process.env.INPUT_API_BASE, 'CFG_API_BASE', `http://127.0.0.1:${bridgePort}/v1`
            );
            core.setOutput('enabled', enabled ? 'true' : 'false');
            core.setOutput('stack', enabled ? 'pr-agent' : reviewProvider);
            core.setOutput('pr_number', prNumber);
            const retryAttempt = String(process.env.INPUT_RETRY_ATTEMPT || '0').trim();
            if (!/^\d+$/.test(retryAttempt)) {
              core.setFailed('PR-Agent retry_attempt must be a non-negative integer.');
              return;
            }
            core.setOutput('retry_attempt', retryAttempt);
            const retryWorkflow =
              String(process.env.INPUT_RETRY_WORKFLOW || 'continuum-pr-agent.yml').trim();
            if (!['continuum-pr-agent.yml', 'pr-agent.yml'].includes(retryWorkflow)) {
              core.setFailed(
                'PR-Agent retry_workflow must be continuum-pr-agent.yml or pr-agent.yml.'
              );
              return;
            }
            core.setOutput('retry_workflow', retryWorkflow);
            const recoveryKind =
              String(process.env.INPUT_RECOVERY_KIND || 'review').trim().toLowerCase();
            if (!['review', 'repair'].includes(recoveryKind)) {
              core.setFailed('PR-Agent recovery_kind must be review or repair.');
              return;
            }
            core.setOutput('recovery_kind', recoveryKind);
            const eventExpectedHead = context.payload.workflow_run?.head_sha || '';
            core.setOutput(
              'expected_head',
              String(process.env.INPUT_EXPECTED_HEAD || eventExpectedHead || '').trim()
            );
            core.setOutput('api_base', apiBase);
            core.setOutput('model', pick(process.env.INPUT_MODEL, 'CFG_MODEL', 'openai/continuum-review'));
            core.setOutput('max_tokens', pick(process.env.INPUT_MAX_TOKENS, 'CFG_MAX_TOKENS', '128000'));
            core.setOutput(
              'opencode_model',
              pick(process.env.INPUT_OPENCODE_MODEL, 'CFG_OPENCODE_MODEL', 'opencode/muse-spark-1.3-contributor-free')
            );
            core.setOutput('bridge_port', bridgePort);
            core.setOutput('server_port', pick(process.env.INPUT_SERVER_PORT, 'CFG_SERVER_PORT', '4096'));
            core.setOutput(
              'pr_agent_version', pick(process.env.INPUT_PR_AGENT_VERSION, 'CFG_PR_AGENT_VERSION', '0.46.0')
            );

      - name: Resolve PR-Agent target context
        if: steps.stack.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! gh api --method GET "repos/kodmial/continuum/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | base64 --decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | base64 --decode > "$PARENT_CONFIG_FILE" 2>/dev/null; then
            printf 'version: 1\n' > "$PARENT_CONFIG_FILE"
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"
      - name: Report the disabled provider explicitly
        if: steps.stack.outputs.enabled != 'true'
        run: echo "PR-Agent skipped because CONTINUUM_REVIEW_PROVIDER is not pr-agent."

      - name: Admit only a review-ready PR with green CI on the exact HEAD
        if: steps.stack.outputs.enabled == 'true'
        id: admit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.stack.outputs.expected_head }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Admission: open, non-draft, same-repo PR whose exact current HEAD
            // has green CI. Anything else is skipped, never reviewed.
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              pull_number: prNumber,
            });
            if (pr.state !== 'open') {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is not open; skipping PR-Agent review.`);
              return;
            }
            if (pr.draft) {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is a draft; skipping PR-Agent review.`);
              return;
            }
            if (!pr.head.repo || pr.head.repo.full_name !== process.env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY) {
              core.setOutput('admitted', 'false');
              core.notice(`PR #${prNumber} is not same-repo; skipping PR-Agent review.`);
              return;
            }
            const headSha = pr.head.sha;
            core.setOutput('head_sha', headSha);
            const expected = String(process.env.EXPECTED_HEAD || '').trim().toLowerCase();
            if (expected && expected !== headSha.toLowerCase()) {
              core.setFailed(
                `Stale admission: caller observed ${expected} but PR #${prNumber} is now ${headSha}.`
              );
              return;
            }
            // Exact-current-HEAD CI is determined from the CI workflow run,
            // not the combined Statuses API. PR-Agent's own failure/pending
            // statuses must never make a recovered CI-green HEAD inadmissible.
            const ciWorkflowName = String(process.env.CI_WORKFLOW_NAME || 'CI').trim();
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
                repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
                event: 'pull_request',
                head_sha: headSha,
                per_page: 100,
              }
            );
            const latestCi = runs
              .filter(run => run.name === ciWorkflowName && run.head_sha === headSha)
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              )[0];
            if (
              !latestCi ||
              latestCi.status !== 'completed' ||
              latestCi.conclusion !== 'success'
            ) {
              core.setOutput('admitted', 'false');
              core.notice(
                `PR #${prNumber} HEAD ${headSha} has no successful current-head ` +
                `${ciWorkflowName} run; PR-Agent waits for exact-head CI.`
              );
              return;
            }
            core.setOutput('admitted', 'true');
            core.setOutput('head_sha', headSha);
            core.notice(`PR #${prNumber} admitted at HEAD ${headSha} with green CI.`);

      - name: Mark PR-Agent review in flight
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'pending',
              context: 'continuum/pr-agent-review',
              description: 'PR-Agent review is running',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Checkout the pull request head without exposing delegated repository metadata
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/continuum-pr-agent-review-worktree"
          rm -rf "$worktree"
          mkdir -p "$worktree"
          cd "$worktree"
          git init --quiet
          gh auth setup-git >/dev/null 2>&1
          git remote add origin "https://github.com/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY.git"
          if ! git fetch --depth=1 --no-tags origin "$HEAD_SHA" --quiet >/dev/null 2>&1 ||
             ! git checkout --detach FETCH_HEAD --quiet >/dev/null 2>&1 ||
             [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Unable to checkout the exact PR-Agent target HEAD."
            exit 1
          fi
          echo "CONTINUUM_PR_AGENT_WORKTREE=$worktree" >> "$GITHUB_ENV"

      - name: Install the pinned upstream PR-Agent release on the runner
        id: install_pragent
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          PR_AGENT_VERSION: ${{ steps.stack.outputs.pr_agent_version }}
        run: |
          set -euo pipefail
          # Pinned upstream reviewer: PR-Agent v0.46.0 runs on the runner (a
          # Docker action cannot reach the runner-local bridge). The version
          # default is 0.46.0; any other value fails closed below.
          if [[ "$PR_AGENT_VERSION" != "0.46.0" ]]; then
            echo "::error::Isolated PR-Agent stack pins upstream v0.46.0, got $PR_AGENT_VERSION."
            exit 1
          fi
          python3 -m pip install --quiet "pr-agent==${PR_AGENT_VERSION}"
          pr-agent --version

      - name: Install pinned OpenCode CLI for the PR-Agent backend
        id: install_opencode
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 https://opencode.ai/install | bash -s -- --version 1.18.34; then
              echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::OpenCode installer failed after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Start opencode serve on loopback
        id: start_opencode
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          OPENCODE_MODEL: ${{ steps.stack.outputs.opencode_model }}
          SERVER_PORT: ${{ steps.stack.outputs.server_port }}
        run: |
          set -euo pipefail
          (setsid nohup opencode serve --hostname 127.0.0.1 --port "$SERVER_PORT" \
            > "$RUNNER_TEMP/opencode-serve.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${SERVER_PORT}/global/health" >/dev/null 2>&1; then
              echo "opencode serve is up on 127.0.0.1:${SERVER_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::opencode serve did not become ready."
          cat "$RUNNER_TEMP/opencode-serve.log" || true
          exit 1

      - name: Resolve the Continuum-owned PR-Agent runtime bundle
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: runtime
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-runtime"
          BRIDGE_SCRIPT="$RUNTIME_ROOT/.github/scripts/pr_agent_bridge.py"
          mkdir -p "$RUNTIME_ROOT/.github/scripts" "$RUNTIME_ROOT/src/continuum"
          gh api --method GET \
            "repos/kodmial/continuum/contents/.github/scripts/pr_agent_bridge.py" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | base64 --decode > "$BRIDGE_SCRIPT"
          gh api --method GET \
            "repos/kodmial/continuum/contents/src/continuum/pr_agent.py" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNTIME_ROOT/src/continuum/pr_agent.py"
          : > "$RUNTIME_ROOT/src/continuum/__init__.py"
          PYTHONPATH="$RUNTIME_ROOT/src" python3 -m py_compile \
            "$BRIDGE_SCRIPT" "$RUNTIME_ROOT/src/continuum/pr_agent.py"
          echo "bridge_script=$BRIDGE_SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Start the OpenAI-compatibility bridge on loopback
        id: start_bridge
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        env:
          OPENCODE_SERVER_URL: http://127.0.0.1:${{ steps.stack.outputs.server_port }}
          OPENCODE_MODEL: ${{ steps.stack.outputs.opencode_model }}
          PR_AGENT_BRIDGE_PORT: ${{ steps.stack.outputs.bridge_port }}
          PR_AGENT_TIMEOUT_SECONDS: '170'
          BRIDGE_SCRIPT: ${{ steps.runtime.outputs.bridge_script }}
        run: |
          set -euo pipefail
          [[ -s "$BRIDGE_SCRIPT" ]] || { echo "::error::Continuum PR-Agent bridge was not resolved."; exit 1; }
          (setsid nohup python3 "$BRIDGE_SCRIPT" \
            > "$RUNNER_TEMP/pr-agent-bridge.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PR_AGENT_BRIDGE_PORT}/v1/models" >/dev/null 2>&1; then
              echo "bridge is up on 127.0.0.1:${PR_AGENT_BRIDGE_PORT}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::compatibility bridge did not become ready."
          cat "$RUNNER_TEMP/pr-agent-bridge.log" || true
          exit 1

      - name: Revalidate the admitted exact HEAD immediately before review
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: before
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          ADMITTED_SHA: ${{ steps.admit.outputs.head_sha }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "${CURRENT_SHA,,}" != "${ADMITTED_SHA,,}" ]]; then
            echo "::error::PR head moved after CI admission ($ADMITTED_SHA -> $CURRENT_SHA); refusing to review an unqualified HEAD."
            exit 1
          fi
          CI_JSON="$RUNNER_TEMP/pr-agent-before-review-ci-runs.json"
          gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/actions/runs?event=pull_request&head_sha=$ADMITTED_SHA&per_page=100" > "$CI_JSON"
          if ! python3 - "$CI_JSON" "$CI_WORKFLOW_NAME" "$ADMITTED_SHA" <<'PY'
          import json, sys
          path, workflow, head = sys.argv[1:4]
          with open(path, "r", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          current = sorted(
              (run for run in runs if run.get("name") == workflow and run.get("head_sha") == head),
              key=lambda run: run.get("created_at") or "",
              reverse=True,
          )
          raise SystemExit(
              0 if current and current[0].get("status") == "completed"
              and current[0].get("conclusion") == "success" else 1
          )
          PY
          then
            echo "::error::CI for admitted HEAD $ADMITTED_SHA is no longer completed:success."
            exit 1
          fi
          echo "sha=$ADMITTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact CI-qualified HEAD $ADMITTED_SHA is still current."

      - name: Run upstream full review and full improve on the exact HEAD
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: pragent
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          GITHUB__USER_TOKEN: ${{ secrets.TAP_PAT }}
          CONFIG__GIT_PROVIDER: github
          CONFIG__MODEL: ${{ steps.stack.outputs.model }}
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ steps.stack.outputs.max_tokens }}
          CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
          CONFIG__PERSISTENT_INLINE_COMMENTS: 'true'
          OPENAI__API_BASE: ${{ steps.stack.outputs.api_base }}
          OPENAI__KEY: continuum-loopback
          GITHUB__PUBLISH_AS_CHECK_RUN: 'false'
          GITHUB_ACTION_CONFIG__ENABLE_OUTPUT: 'true'
          GITHUB_ACTION_CONFIG__FAIL_ON_TOOL_ERRORS: 'true'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: 'false'
          GITHUB_ACTION_CONFIG__PUSH_TRIGGER_IGNORE_BOT_COMMITS: 'true'
          PR_REVIEWER__PERSISTENT_COMMENT: 'true'
          PR_REVIEWER__PERSISTENT_FINDING_STATE: 'true'
          PR_REVIEWER__INLINE_KEY_ISSUES: 'true'
          PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
          PR_REVIEWER__MAX_NUMBER_OF_CALLS: '3'
          PR_REVIEWER__REQUIRE_TESTS_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_SECURITY_REVIEW: 'true'
          PR_REVIEWER__REQUIRE_RISK_ASSESSMENT: 'true'
          PR_REVIEWER__REQUIRE_MERGE_RECOMMENDATION: 'true'
          PR_REVIEWER__REQUIRE_TICKET_ANALYSIS_REVIEW: 'true'
          PR_REVIEWER__ENABLE_REVIEW_COVERAGE_FOOTER: 'true'
          PR_REVIEWER__NUM_MAX_FINDINGS: '6'
          PR_CODE_SUGGESTIONS__FOCUS_ONLY_ON_PROBLEMS: 'true'
          PR_CODE_SUGGESTIONS__PERSISTENT_COMMENT: 'true'
          PR_CODE_SUGGESTIONS__PUBLISH_OUTPUT_NO_SUGGESTIONS: 'true'
          PR_CODE_SUGGESTIONS__SUGGESTIONS_SCORE_THRESHOLD: '1'
          PR_CODE_SUGGESTIONS__MAX_SUGGESTIONS_PER_FILE: '0'
          PR_CODE_SUGGESTIONS__MAX_NUMBER_OF_CALLS: '3'
          PR_CODE_SUGGESTIONS__ENABLE_SUGGESTIONS_COVERAGE_FOOTER: 'true'
          PUSH_OUTPUTS__ENABLE: 'true'
          PUSH_OUTPUTS__CHANNELS: '["file"]'
          PUSH_OUTPUTS__FILE_PATH: 'pr-agent-outputs/continuum.jsonl'
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          PR_URL="https://github.com/${CONTINUUM_PR_AGENT_TARGET_REPOSITORY}/pull/${PR_NUMBER}"
          mkdir -p pr-agent-outputs
          : > pr-agent-outputs/continuum.jsonl
          # The authoritative re-review is CI-gated by this controller: after
          # OpenCode pushes a repair, a new HEAD waits for CI success and then
          # receives a complete upstream review plus a complete upstream
          # improve on that exact HEAD. Push-command handling is disabled
          # (handle_push_trigger=false), so the default bot-commit push filter
          # cannot skip OpenCode-authored repair commits.
          #
          # Upstream reviewer is PR-Agent v0.46.0 (pinned above). Both native
          # tools run in full on the admitted HEAD:
          #   review  -> structured review output (steps.pragent.outputs.review)
          #   improve -> native code suggestions via the runner-local
          #             push_outputs file channel
          #            (pr-agent-outputs/continuum.jsonl payload.code_suggestions)
          # Check-run publishing stays disabled so persistent finding state
          # remains active (github.publish_as_check_run=false).
          run_full_review() {
            pr-agent --pr_url "$PR_URL" review \
              --config.propagate_tool_errors=true \
              --config.persistent_inline_comments=true \
              --pr_reviewer.persistent_finding_state=true \
              --pr_reviewer.inline_key_issues=true \
              --pr_reviewer.require_merge_recommendation=true \
              --pr_reviewer.require_ticket_analysis_review=true \
              --github.publish_as_check_run=false \
              --github_action_config.enable_output=true \
              --github_action_config.fail_on_tool_errors=true
            pr-agent --pr_url "$PR_URL" improve \
              --config.propagate_tool_errors=true \
              --pr_code_suggestions.focus_only_on_problems=true \
              --pr_code_suggestions.suggestions_score_threshold=1 \
              --github.publish_as_check_run=false
          }
          if [[ "$CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED" == true ]]; then
            if ! run_full_review >"$RUNNER_TEMP/pr-agent-delegated-review.log" 2>&1; then
              echo "::error::Delegated PR-Agent review failed; detailed output remains runner-local."
              exit 1
            fi
          else
            run_full_review
          fi
          # Canonical machine source: the structured review JSON is exported
          # as the step output `review` (steps.pragent.outputs.review) for
          # the repair and merge workflows. Prose comments are presentation
          # only and are never the primary protocol.
          if [[ ! -s pr-agent-outputs/continuum.jsonl ]]; then
            echo "No improve suggestions were published; recording an empty payload."
            echo '{"payload": {"code_suggestions": []}}' > pr-agent-outputs/continuum.jsonl
          fi
          echo "review_head=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"
          # Persist the push_outputs file payload for the repair workflow.
          # The improve payload is consumed only from this runner-local file
          # channel, never by scraping comments.
          echo "improve_file=pr-agent-outputs/continuum.jsonl" >> "$GITHUB_OUTPUT"
          echo "Upstream review and improve completed for $REVIEWED_SHA."

      - name: Export native improve output
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: improve_output
        run: |
          set -euo pipefail
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          [[ -s pr-agent-outputs/continuum.jsonl ]] || {
            echo "::error::Native PR-Agent improve output file is missing."
            exit 1
          }
          DELIMITER="__CONTINUUM_PR_AGENT_IMPROVE_EOF__"
          {
            echo "improve_jsonl<<$DELIMITER"
            cat pr-agent-outputs/continuum.jsonl
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Revalidate the PR head and native review output after review
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const reviewedSha = String(process.env.REVIEWED_SHA || '').toLowerCase();
            const { data: pr } = await github.rest.pulls.get({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              pull_number: prNumber,
            });
            const currentSha = String(pr.head.sha || '').toLowerCase();
            if (currentSha !== reviewedSha) {
              core.setFailed(
                `PR head moved during review (${reviewedSha} -> ${currentSha}); ` +
                'discarding both results and waiting for fresh CI on the new HEAD.'
              );
              return;
            }
            const raw = String(process.env.REVIEW_JSON || '').trim();
            if (!raw) {
              core.setFailed('Upstream PR-Agent produced no structured review output.');
              return;
            }
            let review;
            try {
              review = JSON.parse(raw);
            } catch (err) {
              core.setFailed(`Upstream PR-Agent review output is invalid JSON: ${err.message}`);
              return;
            }
            if (!review || typeof review !== 'object' || !Array.isArray(review.key_issues_to_review)) {
              core.setFailed('Upstream PR-Agent review output does not match the expected PRReview schema.');
              return;
            }
            core.setOutput('head_sha', currentSha);
            core.notice(`Native PR-Agent review output for ${reviewedSha} is current and machine-readable.`);

      - name: Export native persistent finding state for the reviewed HEAD
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: persistent
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.result.outputs.head_sha }}
        run: |
          set -euo pipefail
          COMMENTS_JSON="$RUNNER_TEMP/pr-agent-comments.json"
          gh api --paginate --slurp \
            "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            > "$COMMENTS_JSON"
          python3 - "$COMMENTS_JSON" <<'PY'
          import json
          import os
          import sys
          from pr_agent.algo.review_finding_state import parse_review_state

          path = sys.argv[1]
          reviewed = os.environ["REVIEWED_SHA"].strip().lower()
          with open(path, "r", encoding="utf-8") as handle:
              pages = json.load(handle)
          comments = []
          for page in pages:
              if isinstance(page, list):
                  comments.extend(page)
          candidates = [
              c for c in comments
              if "<!-- pr-agent-review-state:" in str(c.get("body") or "")
          ]
          if not candidates:
              raise SystemExit("No upstream PR-Agent persistent finding state marker was published.")
          latest = max(candidates, key=lambda c: str(c.get("updated_at") or c.get("created_at") or ""))
          parsed = parse_review_state(str(latest.get("body") or ""))
          if not parsed.present or not parsed.valid or not isinstance(parsed.state, dict):
              raise SystemExit("Latest upstream PR-Agent persistent finding state is missing or invalid.")
          state = parsed.state
          last = state.get("last_run")
          if not isinstance(last, dict):
              raise SystemExit("Upstream PR-Agent persistent state has no last_run.")
          state_head = str(last.get("head_sha") or "").strip().lower()
          if state_head != reviewed:
              raise SystemExit(
                  f"Persistent state is stale: last_run.head_sha={state_head or '<empty>'}, reviewed={reviewed}."
              )
          if last.get("complete") is not True or str(last.get("kind") or "") != "full":
              raise SystemExit("Persistent state does not represent a complete full review.")
          findings = state.get("findings")
          if not isinstance(findings, list):
              raise SystemExit("Upstream PR-Agent persistent state findings is not a list.")
          valid_states = {"ACTIVE", "RESOLVED"}
          for finding in findings:
              if not isinstance(finding, dict):
                  raise SystemExit("Upstream PR-Agent persistent state contains a non-object finding.")
              if str(finding.get("state") or "").upper() not in valid_states:
                  raise SystemExit("Upstream PR-Agent persistent state contains an unknown finding state.")
          compact = json.dumps(state, separators=(",", ":"), ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"persistent_state_json={compact}\n")
          PY

      - name: Route the current PR-Agent result
        if: steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        id: route
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_JSON: ${{ steps.pragent.outputs.review }}
          IMPROVE_JSONL: ${{ steps.improve_output.outputs.improve_jsonl }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            const keyIssues = Array.isArray(review.key_issues_to_review)
              ? review.key_issues_to_review
              : [];
            const suggestions = [];
            for (const line of String(process.env.IMPROVE_JSONL || '').split('\n')) {
              if (!line.trim()) continue;
              const record = JSON.parse(line);
              const payload = record.payload || record;
              for (const entry of payload.code_suggestions || []) {
                const score = entry?.score;
                if (score === undefined || score === null || Number.isNaN(Number(score)) || Number(score) >= 1) {
                  suggestions.push(entry);
                }
              }
            }
            const needsRepair = keyIssues.length > 0 || suggestions.length > 0;
            core.setOutput('needs_repair', needsRepair ? 'true' : 'false');
            core.setOutput('review_findings', String(keyIssues.length));
            core.setOutput('improve_suggestions', String(suggestions.length));
            core.notice(
              needsRepair
                ? `Routing ${keyIssues.length} review finding(s) and ${suggestions.length} improve suggestion(s) to PR-Agent repair.`
                : 'No current actionable review/improve items; routing this exact HEAD to the PR-Agent merge gate.'
            );

      - name: Publish durable PR-Agent review state
        if: steps.route.outcome == 'success' && steps.result.outputs.head_sha
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.result.outputs.head_sha }}
          NEEDS_REPAIR: ${{ steps.route.outputs.needs_repair }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            const actionable = process.env.NEEDS_REPAIR === 'true';
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'continuum/pr-agent-review',
              description: actionable
                ? 'PR-Agent review complete: actionable'
                : 'PR-Agent review complete: clean',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Publish failed PR-Agent review state
        if: >-
          failure() &&
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          steps.admit.outputs.head_sha
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          RETRYABLE_FAILURE: ${{ (steps.install_pragent.outcome == 'failure' || steps.install_opencode.outcome == 'failure' || steps.start_opencode.outcome == 'failure' || steps.runtime.outcome == 'failure' || steps.start_bridge.outcome == 'failure' || steps.pragent.outcome == 'failure') && 'true' || 'false' }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: process.env.CONTINUUM_PR_AGENT_TARGET_OWNER,
              repo: process.env.CONTINUUM_PR_AGENT_TARGET_REPO,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'continuum/pr-agent-review',
              description:
                process.env.RETRYABLE_FAILURE === 'true'
                  ? 'PR-Agent review failed: transient; recovery eligible'
                  : 'PR-Agent review failed: deterministic; recovery held',
              target_url:
                context.serverUrl + '/' + context.repo.owner + '/' +
                context.repo.repo + '/actions/runs/' + context.runId,
            });

      - name: Fail closed on a moved head
        if: steps.stack.outputs.enabled == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.before.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${REVIEWED_SHA:-}" ]]; then
            echo "No review was admitted; nothing to revalidate."
            exit 0
          fi
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [[ "$CURRENT_SHA" != "$REVIEWED_SHA" ]]; then
            echo "::error::PR head moved during review ($REVIEWED_SHA -> $CURRENT_SHA); the review is stale."
            exit 1
          fi
          echo "Reviewed head $REVIEWED_SHA is still current."

      - name: Prove the checkout is unmodified
        if: always() && steps.stack.outputs.enabled == 'true' && steps.admit.outputs.admitted == 'true'
        run: |
          set -euo pipefail
          cd "$CONTINUUM_PR_AGENT_WORKTREE"
          DIRTY="$(git status --porcelain -- . ':(exclude)pr-agent-outputs')"
          if [[ -n "$DIRTY" ]]; then
            echo "::error::PR-Agent modified the checkout; reviewer-only runs must not."
            printf '%s\n' "$DIRTY"
            exit 1
          fi
          echo "Checkout is unmodified: reviewer-only holds."

      - name: Stop the review backend
        if: always()
        run: |
          pkill -f "opencode serv[e] --hostname 127.0.0.1" || true
          pkill -f "continuum-pr-agent-bridge.p[y]" || true
          pkill -f "pr_agent_bridge.p[y]" || true

      - name: Schedule bounded retry for retryable PR-Agent review failure
        if: >-
          always() &&
          steps.stack.outputs.enabled == 'true' &&
          steps.admit.outputs.admitted == 'true' &&
          failure() &&
          (steps.install_pragent.outcome == 'failure' ||
           steps.install_opencode.outcome == 'failure' ||
           steps.start_opencode.outcome == 'failure' ||
           steps.runtime.outcome == 'failure' ||
           steps.start_bridge.outcome == 'failure' ||
           steps.pragent.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          PR_NUMBER: ${{ steps.stack.outputs.pr_number }}
          HEAD_SHA: ${{ steps.admit.outputs.head_sha }}
          RETRY_ATTEMPT: ${{ steps.stack.outputs.retry_attempt }}
          RETRY_WORKFLOW: ${{ steps.stack.outputs.retry_workflow }}
          CURRENT_RECOVERY_KIND: ${{ steps.stack.outputs.recovery_kind }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name || vars.CONTINUUM_CI_WORKFLOW_NAME || 'CI' }}
        run: |
          set -euo pipefail
          attempt="${RETRY_ATTEMPT:-0}"
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0
          case "$RETRY_WORKFLOW" in
            continuum-pr-agent.yml|pr-agent.yml) ;;
            *)
              echo "::error::Invalid isolated PR-Agent retry workflow: $RETRY_WORKFLOW"
              exit 1
              ;;
          esac
          if (( attempt >= 2 )); then
            MARKER="<!-- continuum-pr-agent-retry-exhausted head=${HEAD_SHA,,} kind=${CURRENT_RECOVERY_KIND:-review} attempts=$((attempt + 1)) -->"
            printf -v BODY '%s\n%s' "$MARKER" "PR-Agent ${CURRENT_RECOVERY_KIND:-review} recovery exhausted the bounded retry budget for this exact HEAD. A new HEAD or an explicit owner /review starts a fresh evaluation."
            gh pr comment "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --body "$BODY"
            echo "Retry budget exhausted for PR #$PR_NUMBER HEAD $HEAD_SHA."
            exit 0
          fi

          next=$((attempt + 1))
          delay=$((15 * (1 << attempt)))
          MARKER="<!-- continuum-pr-agent-retry head=${HEAD_SHA,,} kind=${CURRENT_RECOVERY_KIND:-review} attempt=$next -->"
          printf -v BODY '%s\n%s' "$MARKER" "Retrying a transient PR-Agent ${CURRENT_RECOVERY_KIND:-review} recovery/runtime failure for this exact HEAD (attempt $next/3, backoff ${delay}s)."
          gh pr comment "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --body "$BODY"
          sleep "$delay"

          if ! current="$(gh pr view "$PR_NUMBER" --repo "$CONTINUUM_PR_AGENT_TARGET_REPOSITORY" --json headRefOid,state,isDraft --jq '[.headRefOid,.state,(.isDraft|tostring)]|@tsv')"; then
            echo "Could not revalidate PR state after backoff; stale retry cancelled."
            exit 0
          fi
          current_sha="$(cut -f1 <<<"$current")"
          current_state="$(cut -f2 <<<"$current")"
          current_draft="$(cut -f3 <<<"$current")"
          if [[ "$current_sha" != "$HEAD_SHA" || "$current_state" != "OPEN" || "$current_draft" == "true" ]]; then
            echo "PR state changed during retry backoff; stale retry cancelled."
            exit 0
          fi
          CI_JSON="$RUNNER_TEMP/pr-agent-ci-runs.json"
          if ! gh api "repos/$CONTINUUM_PR_AGENT_TARGET_REPOSITORY/actions/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" > "$CI_JSON"; then
            echo "Could not revalidate exact-HEAD CI after backoff; stale retry cancelled."
            exit 0
          fi
          if ! python3 - "$CI_JSON" "$CI_WORKFLOW_NAME" "$HEAD_SHA" <<'PY'
          import json, sys
          path, workflow, head = sys.argv[1:4]
          with open(path, "r", encoding="utf-8") as handle:
              runs = json.load(handle).get("workflow_runs", [])
          current = sorted(
              (run for run in runs if run.get("name") == workflow and run.get("head_sha") == head),
              key=lambda run: run.get("created_at") or "",
              reverse=True,
          )
          raise SystemExit(
              0 if current and current[0].get("status") == "completed"
              and current[0].get("conclusion") == "success" else 1
          )
          PY
          then
            echo "Exact HEAD no longer has green CI; retry cancelled until a fresh CI event."
            exit 0
          fi

          DEFAULT_BRANCH="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)"
          DEFAULT_BRANCH="$(printf '%s' "${DEFAULT_BRANCH:-main}" | tr -d ' \t\r\n')"
          case "$DEFAULT_BRANCH" in
            ""|*".."*|*"//"*|*"@{"*|*/|*.|*.lock|HEAD|"@"|refs/*|-*|.*) DEFAULT_BRANCH="main" ;;
          esac
          if ! [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then DEFAULT_BRANCH="main"; fi
          if [[ "$DEFAULT_BRANCH" == */.*/* || "$DEFAULT_BRANCH" == .*/ || "$DEFAULT_BRANCH" == */. ]] || [[ "$DEFAULT_BRANCH" =~ (^|/)\. ]] || [[ "$DEFAULT_BRANCH" =~ \.lock($|/) ]]; then DEFAULT_BRANCH="main"; fi
          gh workflow run "$RETRY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"             -f pr_number="$PR_NUMBER"             -f expected_head_sha="$HEAD_SHA"             -f retry_attempt="$next"             -f retry_workflow="$RETRY_WORKFLOW"             -f recovery_kind="${CURRENT_RECOVERY_KIND:-review}"             -f target_child_id="$TARGET_CHILD_ID"
          echo "Dispatched isolated PR-Agent retry attempt $next/3 for PR #$PR_NUMBER HEAD $HEAD_SHA."

  repair:
    needs: pr_agent
    if: >-
      needs.pr_agent.outputs.admitted == 'true' &&
      needs.pr_agent.outputs.needs_repair == 'true'
    uses: ./.github/workflows/continuum-pr-agent-repair.yml
    secrets: inherit
    with:
      continuum_ref: ${{ inputs.continuum_ref }}
      review_provider: ${{ needs.pr_agent.outputs.review_provider }}
      pr_number: ${{ needs.pr_agent.outputs.pr_number }}
      head_sha: ${{ needs.pr_agent.outputs.head_sha }}
      review_json: ${{ needs.pr_agent.outputs.review_json }}
      improve_jsonl: ${{ needs.pr_agent.outputs.improve_jsonl }}
      retry_attempt: ${{ needs.pr_agent.outputs.recovery_kind == 'repair' && needs.pr_agent.outputs.retry_attempt || '0' }}
      retry_workflow: ${{ needs.pr_agent.outputs.retry_workflow }}
      target_child_id: ${{ inputs.target_child_id }}

  merge:
    needs: pr_agent
    if: >-
      needs.pr_agent.outputs.admitted == 'true' &&
      needs.pr_agent.outputs.needs_repair == 'false'
    uses: ./.github/workflows/continuum-pr-agent-auto-merge.yml
    secrets: inherit
    with:
      continuum_ref: ${{ inputs.continuum_ref }}
      review_provider: ${{ needs.pr_agent.outputs.review_provider }}
      pr_number: ${{ needs.pr_agent.outputs.pr_number }}
      head_sha: ${{ needs.pr_agent.outputs.head_sha }}
      review_json: ${{ needs.pr_agent.outputs.review_json }}
      improve_jsonl: ${{ needs.pr_agent.outputs.improve_jsonl }}
      persistent_state_json: ${{ needs.pr_agent.outputs.persistent_state_json }}
      target_child_id: ${{ inputs.target_child_id }}
