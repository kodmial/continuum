name: Relax adapter implementation dependencies

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  wire:
    if: github.event.head_commit.message == 'relax-adapter-dependencies'
    runs-on: ubuntu-latest
    steps:
      - name: Remove release-core blockers from isolated adapter work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          H=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10")
          for target in 18 19 20 23; do
            gh api --method DELETE "${H[@]}"               "repos/$GITHUB_REPOSITORY/issues/$target/dependencies/blocked_by/5614461245" >/dev/null || true
          done
