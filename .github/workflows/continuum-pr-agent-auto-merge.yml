name: PR-Agent merge gate

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false
      review_provider:
        description: >-
          Review provider: none, coderabbit, or pr-agent. Empty falls back to
          vars.CONTINUUM_REVIEW_PROVIDER, then to none.
        type: string
        default: ''
        required: false
      pr_number:
        description: Pull request number carrying the candidate HEAD.
        type: string
        default: ''
        required: false
      target_child_id:
        description: Opaque verified child id for delegated execution. Empty targets the caller repository.
        type: string
        default: ''
        required: false
      head_sha:
        description: Exact HEAD SHA the review evaluated.
        type: string
        default: ''
        required: false
      review_json:
        description: >-
          Canonical upstream review JSON (steps.pragent.outputs.review) for the
          exact HEAD.
        type: string
        default: ''
        required: false
      improve_jsonl:
        description: >-
          Runner-local push_outputs file payload
          (pr-agent-outputs/continuum.jsonl) for the exact HEAD.
        type: string
        default: ''
        required: false
      persistent_state_json:
        description: >-
          Upstream PR-Agent v0.46.0 persistent finding state for the latest
          successful full review (findings[].state plus last_run metadata).
        type: string
        default: ''
        required: false
      post_merge_wakeups:
        description: Workflows to wake after a successful merge, comma-separated.
        type: string
        default: ''
        required: false
      post_merge_wakeup_ref:
        description: Git ref used for post-merge wakeups.
        type: string
        default: ''
        required: false
      required_workflow_gate_label:
        description: Label enabling an additional required workflow gate.
        type: string
        default: ''
        required: false
      required_workflow_gate_name:
        description: Required workflow name when the gate label is present.
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: ${{ inputs.target_child_id && format('pr-agent-merge-child-{0}-{1}', inputs.target_child_id, inputs.pr_number || github.run_id) || format('pr-agent-merge-{0}', inputs.pr_number || github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: read

    steps:
      - name: Resolve the isolated PR-Agent stack
        id: stack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_REVIEW_PROVIDER: ${{ inputs.review_provider }}
          CFG_REVIEW_PROVIDER: ${{ vars.CONTINUUM_REVIEW_PROVIDER }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Only the PR-Agent-owned merge path is active in PR-Agent mode.
            // The generic merge path cannot merge a green-CI HEAD without the
            // PR-Agent green gate, and no CodeRabbit workflow is dispatched here.
            const reviewProvider = String(
              process.env.INPUT_REVIEW_PROVIDER || process.env.CFG_REVIEW_PROVIDER || 'none'
            ).trim().toLowerCase();
            if (!['none', 'coderabbit', 'pr-agent'].includes(reviewProvider)) {
              core.setFailed(
                `Invalid CONTINUUM_REVIEW_PROVIDER="${reviewProvider}". Expected none, coderabbit, or pr-agent.`
              );
              return;
            }
            if (reviewProvider !== 'pr-agent') {
              core.setFailed(
                `PR-Agent merge requires CONTINUUM_REVIEW_PROVIDER=pr-agent; got ${reviewProvider}.`
              );
              return;
            }
            core.setOutput('stack', 'pr-agent');

      - name: Resolve PR-Agent target context
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          CONTINUUM_SOURCE_REPO="${GITHUB_WORKFLOW_REF:-}"
          CONTINUUM_SOURCE_REPO="${CONTINUUM_SOURCE_REPO%%/.github/workflows/*}"
          if ! [[ "$CONTINUUM_SOURCE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            CONTINUUM_SOURCE_REPO="kodmial/continuum"
          fi
          if [[ -z "${TARGET_CHILD_ID:-}" ]]; then
            # Local fast path: no delegated resolver is needed and
            # CONTINUUM_REF is not required for local-only merge.
            if ! [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::PR-Agent target repository identity is invalid."
              exit 2
            fi
            {
              printf 'CONTINUUM_PR_AGENT_TARGET_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
              printf 'CONTINUUM_PR_AGENT_TARGET_OWNER=%s\n' "${GITHUB_REPOSITORY%%/*}"
              printf 'CONTINUUM_PR_AGENT_TARGET_REPO=%s\n' "${GITHUB_REPOSITORY#*/}"
              printf 'CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED=%s\n' "false"
            } >> "$GITHUB_ENV"
            echo "PR-Agent target context resolved locally."
            exit 0
          fi
          : "${CONTINUUM_REF:?CONTINUUM_REF is required for pinned target resolution}"
          RUNTIME_ROOT="$RUNNER_TEMP/continuum-pr-agent-target-runtime"
          mkdir -p "$RUNTIME_ROOT/.github/scripts"
          fetch_runtime_file() {
            local path="$1" dest="$2"
            if ! gh api --method GET "repos/$CONTINUUM_SOURCE_REPO/contents/$path" -f ref="$CONTINUUM_REF" --jq .content 2>/dev/null \
              | tr -d '\n' | continuum_b64_decode > "$dest" 2>/dev/null; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
            if [[ ! -s "$dest" ]]; then
              echo "::error::Unable to load the Continuum PR-Agent target resolver."
              exit 1
            fi
          }
          fetch_runtime_file ".github/scripts/pr_agent_target.sh" "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh"
          fetch_runtime_file ".github/scripts/delegation_repository.sh" "$RUNTIME_ROOT/.github/scripts/delegation_repository.sh"
          fetch_runtime_file ".github/scripts/delegation_runtime.py" "$RUNTIME_ROOT/.github/scripts/delegation_runtime.py"
          PARENT_CONFIG_FILE="$RUNTIME_ROOT/parent.continuum.yml"
          # The parent config lives in the execution repository: fetch its
          # default branch, never the Continuum engine pin (which may not
          # exist in the execution repository).
          if ! gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.continuum.yml" --jq .content 2>/dev/null \
            | tr -d '\n' | continuum_b64_decode > "$PARENT_CONFIG_FILE" 2>/dev/null || [[ ! -s "$PARENT_CONFIG_FILE" ]]; then
            echo "::error::Unable to load the parent Continuum configuration for delegated target resolution; refusing to guess."
            exit 1
          fi
          CONTINUUM_ENGINE_ROOT="$RUNTIME_ROOT" PARENT_CONFIG="$PARENT_CONFIG_FILE" \
            bash "$RUNTIME_ROOT/.github/scripts/pr_agent_target.sh" "$TARGET_CHILD_ID"

      - name: Resolve PR-Agent signal policy
        id: policy
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
          CONTINUUM_REF: ${{ inputs.continuum_ref }}
        run: |
          set -euo pipefail
          continuum_b64_decode() {
            if printf '' | base64 --decode >/dev/null 2>&1; then
              base64 --decode
            elif printf '' | base64 -d >/dev/null 2>&1; then
              base64 -d
            elif printf '' | base64 -D >/dev/null 2>&1; then
              base64 -D
            elif command -v python3 >/dev/null 2>&1; then
              python3 -c 'import sys,base64; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))'
            else
              openssl base64 -d
            fi
          }
          POLICY_SCRIPT="$RUNNER_TEMP/pr_agent_policy.js"
          gh api --method GET \
            "repos/kodmial/continuum/contents/.github/scripts/pr_agent_policy.js" \
            -f ref="$CONTINUUM_REF" --jq .content \
            | tr -d '\n' | continuum_b64_decode > "$POLICY_SCRIPT"
          node --check "$POLICY_SCRIPT"
          echo "policy_script=$POLICY_SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Evaluate the exact-head PR-Agent gate
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_JSON: ${{ inputs.review_json }}
          IMPROVE_JSONL: ${{ inputs.improve_jsonl }}
          PERSISTENT_STATE_JSON: ${{ inputs.persistent_state_json }}
          POLICY_SCRIPT: ${{ steps.policy.outputs.policy_script }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Exact-head, fail-closed PR-Agent gate. Green requires every
            // native signal at once for the exact current HEAD:
            //   - no tool error (config.propagate_tool_errors,
            //     github_action_config.fail_on_tool_errors)
            //   - complete review and improve coverage (upstream chunking
            //     coverage footers; incomplete coverage never greens)
            //   - green CI on the exact HEAD, revalidated immediately before
            //     merge, plus draft/conflict revalidation
            //   - matching HEAD (results for SHA A never merge SHA B;
            //     main synchronization never carries approval)
            //   - merge_recommendation == safe_to_merge only (caution and
            //     changes_required block)
            //   - empty current key_issues_to_review (a batch at the findings
            //     cap is potentially truncated and never clean)
            //   - no high-signal improve code_suggestions according to the
            //     centralized PR-Agent provider policy (threshold 7)
            //   - native persistent review state has no ACTIVE finding
            // Inline presentation (inline_key_issues) never decides the gate:
            // absence of inline comments cannot produce green while summary
            // or output findings remain.
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = String(process.env.HEAD_SHA || '').trim().toLowerCase();
            if (!prNumber || !headSha) {
              core.setFailed('PR-Agent merge requires pr_number and head_sha.');
              return;
            }
            let review;
            try {
              review = JSON.parse(String(process.env.REVIEW_JSON || ''));
            } catch (err) {
              core.setFailed(`Invalid PR-Agent review JSON: ${err.message}`);
              return;
            }
            const policy = require(process.env.POLICY_SCRIPT);
            const raw = String(process.env.IMPROVE_JSONL || '').trim();
            let disposition;
            try {
              disposition = policy.reviewDisposition(review, raw);
            } catch (err) {
              core.setFailed(err.message);
              return;
            }
            const stateRaw = String(process.env.PERSISTENT_STATE_JSON || '').trim();
            if (!stateRaw) {
              core.setFailed('PR-Agent gate requires native persistent finding state for the exact reviewed HEAD.');
              return;
            }
            let persistentState;
            try {
              persistentState = JSON.parse(stateRaw);
            } catch (err) {
              core.setFailed(`Invalid PR-Agent persistent state JSON: ${err.message}`);
              return;
            }
            if (!persistentState || typeof persistentState !== 'object' || Array.isArray(persistentState)) {
              core.setFailed('PR-Agent persistent state must be the upstream state object.');
              return;
            }
            if (persistentState.schema_version !== 1 || !Array.isArray(persistentState.findings)) {
              core.setFailed('PR-Agent persistent state does not match upstream v0.46.0 schema.');
              return;
            }
            const lastRun = persistentState.last_run;
            if (!lastRun || typeof lastRun !== 'object') {
              core.setFailed('PR-Agent persistent state has no last_run metadata.');
              return;
            }
            const stateHead = String(lastRun.head_sha || '').trim().toLowerCase();
            if (stateHead !== headSha) {
              core.setFailed(
                `PR-Agent persistent state is stale: last_run.head_sha=${stateHead || '<empty>'}, expected=${headSha}.`
              );
              return;
            }
            if (lastRun.complete !== true || String(lastRun.kind || '') !== 'full') {
              core.setFailed('PR-Agent persistent state is not from a complete full review.');
              return;
            }
            let hasActive = false;
            for (const entry of persistentState.findings) {
              if (!entry || typeof entry !== 'object') {
                core.setFailed('PR-Agent persistent state contains a non-object finding.');
                return;
              }
              const state = String(entry.state || '').trim().toUpperCase();
              if (!['ACTIVE', 'RESOLVED'].includes(state)) {
                core.setFailed(`PR-Agent persistent finding has invalid state "${state || '<empty>'}".`);
                return;
              }
              if (state === 'ACTIVE') hasActive = true;
            }
            const fail = (reason) => {
              core.setOutput('green', 'false');
              core.setOutput('reason', reason);
              core.setFailed(`PR-Agent gate blocks PR #${prNumber}: ${reason}`);
            };
            if (disposition.action !== 'merge') {
              fail(disposition.reason);
              return;
            }
            if (hasActive) {
              fail('native persistent state has an ACTIVE finding');
              return;
            }
            // Exact-HEAD plus CI plus draft/conflict revalidation happens in
            // the next step immediately before merge; this step records that
            // the review portion of the gate is satisfied for this HEAD.
            core.setOutput('green', 'true');
            core.setOutput('reason', 'review portion satisfied');
            core.setOutput('head_sha', headSha);
            core.notice(`PR #${prNumber} review portion satisfied at ${headSha}.`);


      - name: Reconcile current PR state and merge only the exact reviewed HEAD
        if: steps.gate.outputs.green == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_HEAD: ${{ inputs.head_sha }}
          POST_MERGE_WAKEUPS: ${{ inputs.post_merge_wakeups || vars.CONTINUUM_POST_MERGE_WAKEUPS }}
          POST_MERGE_WAKEUP_REF: ${{ inputs.post_merge_wakeup_ref || vars.CONTINUUM_POST_MERGE_WAKEUP_REF || github.event.repository.default_branch || 'main' }}
          REQUIRED_WORKFLOW_GATE_LABEL: ${{ inputs.required_workflow_gate_label || vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_LABEL || '' }}
          REQUIRED_WORKFLOW_GATE_NAME: ${{ inputs.required_workflow_gate_name || vars.CONTINUUM_REQUIRED_WORKFLOW_GATE_NAME || '' }}
          TARGET_CHILD_ID: ${{ inputs.target_child_id }}
        with:
          github-token: ${{ secrets.TAP_PAT }}
          script: |
            // Work Lock #33 mirrors the mature provider-neutral mechanics from
            // continuum-auto-merge.yml while keeping CodeRabbit untouched.
            // Target-aware: review, repair, recovery, merge and exact-HEAD
            // validation operate against the resolved target repository while
            // execution remains in the parent. Only the opaque child id ever
            // selects the target; concrete identity stays runner-local.
            const executionOwner = context.repo.owner;
            const executionRepo = context.repo.repo;
            const owner = process.env.CONTINUUM_PR_AGENT_TARGET_OWNER;
            const repo = process.env.CONTINUUM_PR_AGENT_TARGET_REPO;
            const repoFullName = process.env.CONTINUUM_PR_AGENT_TARGET_REPOSITORY;
            const delegated =
              process.env.CONTINUUM_PR_AGENT_TARGET_IS_DELEGATED === 'true';
            if (!owner || !repo || !repoFullName) {
              core.setFailed(
                delegated
                  ? 'PR-Agent target relationship is missing: delegated execution requires non-empty CONTINUUM_PR_AGENT_TARGET_OWNER/REPO/REPOSITORY.'
                  : 'PR-Agent target context is missing: CONTINUUM_PR_AGENT_TARGET_OWNER/REPO/REPOSITORY must be non-empty.'
              );
              return;
            }
            const targetChildId = String(process.env.TARGET_CHILD_ID || '').trim();
            const prNumber = Number(process.env.PR_NUMBER);
            const reviewedHead = String(process.env.REVIEWED_HEAD || '').trim().toLowerCase();
            const AUTO_MERGE_BLOCK_LABEL = 'no-auto-merge';
            const CONFLICT_LOCK_LABEL = 'opencode-conflict-repair';
            const requiredWorkflowGateLabel =
              String(process.env.REQUIRED_WORKFLOW_GATE_LABEL || '').trim();
            const requiredWorkflowGateName =
              String(process.env.REQUIRED_WORKFLOW_GATE_NAME || '').trim();
            const postMergeWakeups = String(process.env.POST_MERGE_WAKEUPS || '')
              .split(',')
              .map(name => name.trim())
              .filter(Boolean);
            let postMergeWakeupRef =
              String(process.env.POST_MERGE_WAKEUP_REF || 'main').trim();
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(postMergeWakeupRef) || postMergeWakeupRef.includes('..') || postMergeWakeupRef.includes('//') || postMergeWakeupRef.includes('@{') || postMergeWakeupRef.endsWith('/') || postMergeWakeupRef.endsWith('.') || postMergeWakeupRef.endsWith('.lock') || postMergeWakeupRef === 'HEAD' || postMergeWakeupRef === '@' || postMergeWakeupRef.startsWith('refs/') || postMergeWakeupRef.startsWith('-') || postMergeWakeupRef.startsWith('.')) {
              core.warning('Invalid post-merge wakeup ref; falling back to main: ' + postMergeWakeupRef);
              postMergeWakeupRef = 'main';
            }

            if (!prNumber || !reviewedHead) {
              core.setFailed('PR-Agent reconciliation requires pr_number and reviewed HEAD.');
              return;
            }

            async function getPull() {
              const response = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              return response.data;
            }

            function hasLabel(pr, name) {
              return (pr.labels || []).some(label =>
                (typeof label === 'string' ? label : label.name) === name
              );
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name, color, description,
                });
              } catch (err) {
                if (err.status !== 422) throw err;
              }
            }

            async function latestWorkflowForHead(pr, headSha, workflowName) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  branch: pr.head.ref,
                  event: 'pull_request',
                  per_page: 100,
                }
              );
              return runs
                .filter(run => run.name === workflowName && run.head_sha === headSha)
                .sort((a, b) =>
                  new Date(b.created_at || 0).getTime() -
                  new Date(a.created_at || 0).getTime()
                )[0] || null;
            }

            async function currentHeadGates(pr) {
              const ci = await latestWorkflowForHead(pr, pr.head.sha, 'CI');
              if (!ci || ci.status !== 'completed' || ci.conclusion !== 'success') {
                return { ok: false, reason: 'Current-head CI is not successful' };
              }

              const combinedResponse =
                await github.rest.repos.getCombinedStatusForRef({
                  owner, repo, ref: pr.head.sha,
                });
              if (combinedResponse.data.state !== 'success') {
                return {
                  ok: false,
                  reason: 'combined status is ' + combinedResponse.data.state + ', not success',
                };
              }

              const packaging =
                await latestWorkflowForHead(pr, pr.head.sha, 'Packaging smoke');
              if (
                packaging &&
                (packaging.status !== 'completed' || packaging.conclusion !== 'success')
              ) {
                return {
                  ok: false,
                  reason:
                    'Packaging smoke is ' + packaging.status + '/' +
                    (packaging.conclusion || 'pending'),
                };
              }

              if (
                requiredWorkflowGateLabel &&
                requiredWorkflowGateName &&
                hasLabel(pr, requiredWorkflowGateLabel)
              ) {
                const required =
                  await latestWorkflowForHead(pr, pr.head.sha, requiredWorkflowGateName);
                if (
                  !required ||
                  required.status !== 'completed' ||
                  required.conclusion !== 'success'
                ) {
                  return {
                    ok: false,
                    reason:
                      'required workflow ' + requiredWorkflowGateName + ' is not successful',
                  };
                }
              }

              return { ok: true };
            }

            function isNonMergeCriticalMainPath(path) {
              if (path.startsWith('.github/workflows/continuum-')) return false;
              return (
                path === 'LICENSE' ||
                path === '.gitignore' ||
                path === '.release-please-manifest.json' ||
                path === 'CHANGELOG.md' ||
                path.endsWith('.md') ||
                path.startsWith('docs/') ||
                path.startsWith('.github/')
              );
            }

            function sanitizeBranch(name, fallback = 'main') {
              let value = String(name || '').trim() || String(fallback || '').trim() || 'main';
              if (!/^[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(value)) return 'main';
              if (value.includes('..') || value.includes('//') || value.includes('@{')) return 'main';
              if (value.endsWith('/') || value.endsWith('.') || value.endsWith('.lock')) return 'main';
              if (value === 'HEAD' || value === '@') return 'main';
              if (value.startsWith('refs/') || value.startsWith('-') || value.startsWith('.')) return 'main';
              if (value.split('/').some(part => part.startsWith('.') || part.endsWith('.lock'))) return 'main';
              return value;
            }
            let cachedDefaultBranch = null;
            async function getDefaultBranch() {
              if (cachedDefaultBranch) return cachedDefaultBranch;
              try {
                const { data: repoInfo } = await github.rest.repos.get({
                  owner, repo,
                });
                const name = String(repoInfo.default_branch || '').trim();
                cachedDefaultBranch = sanitizeBranch(name, 'main');
              } catch (err) {
                core.warning(
                  'Could not resolve the repository default branch; falling back to main: ' +
                  (err.message || err)
                );
                cachedDefaultBranch = 'main';
              }
              return cachedDefaultBranch;
            }

            async function mainSyncDecision(pr) {
              const defaultBranch = await getDefaultBranch();
              const comparison = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {
                  owner,
                  repo,
                  basehead: defaultBranch + '...' + pr.head.sha,
                }
              );
              if ((comparison.data.behind_by || 0) <= 0) {
                return {
                  required: false,
                  reason: 'up-to-date',
                  files: [],
                  criticalFiles: [],
                };
              }

              const reverse = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}',
                {
                  owner,
                  repo,
                  basehead: pr.head.sha + '...' + defaultBranch,
                }
              );
              const files = (reverse.data.files || []).map(file => file.filename);
              const criticalFiles =
                files.filter(path => !isNonMergeCriticalMainPath(path));
              const onlyNonCritical =
                files.length > 0 && criticalFiles.length === 0;
              return {
                required: !onlyNonCritical,
                reason:
                  files.length === 0
                    ? 'unknown-main-delta'
                    : onlyNonCritical
                      ? 'non-merge-critical-main-delta'
                      : 'merge-critical-main-delta',
                files,
                criticalFiles,
              };
            }

            function conflictAttemptMarker(headSha) {
              return '<!-- opencode-conflict-repair-attempt head=' +
                String(headSha || '').toLowerCase() + ' -->';
            }

            async function releaseConflictLock() {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: CONFLICT_LOCK_LABEL,
                });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }

            async function dispatchConflictRepair(pr, reason) {
              await ensureLabel(
                CONFLICT_LOCK_LABEL,
                'B60205',
                'One automatic OpenCode conflict-repair attempt per conflict episode.'
              );
              const defaultBranch = await getDefaultBranch();
              let fresh = await getPull();
              if (hasLabel(fresh, CONFLICT_LOCK_LABEL)) {
                // This merge workflow is serialized per PR. A bare label is
                // therefore never treated as a repository-global liveness
                // signal: the exact-HEAD attempt marker below is authoritative.
                // Release stale/inherited lock state before deciding this HEAD.
                await releaseConflictLock();
                core.warning(
                  'PR #' + prNumber +
                  ': released pre-existing conflict-repair lock; exact-HEAD marker decides whether this PR may dispatch.'
                );
                fresh = await getPull();
              }

              // Bounded retry: exactly one automatic conflict-repair attempt
              // per PR HEAD. A repeat conflict on the same HEAD after an
              // attempt already ran means OpenCode could not resolve it;
              // re-dispatching the same full run would replay the whole task
              // duration with no new information. A new HEAD starts a new
              // episode.
              if (fresh.head.sha.toLowerCase() !== reviewedHead) {
                core.warning('PR #' + prNumber + ': head moved during conflict handling; stale repair cancelled.');
                return;
              }
              const attemptMarker = conflictAttemptMarker(fresh.head.sha);
              const priorComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              if (priorComments.some(comment =>
                String(comment.body || '').includes(attemptMarker)
              )) {
                await releaseConflictLock();
                core.warning(
                  'PR #' + prNumber + ' HEAD ' + fresh.head.sha +
                  ': a conflict-repair attempt already ran for this HEAD; ' +
                  'not re-dispatching. Push a new HEAD to start a new episode.'
                );
                return;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [CONFLICT_LOCK_LABEL],
              });
              // Task-replay record: the repair run merges the default branch
              // into this exact HEAD and preserves intent from both sides; it
              // never redoes the original task. The marker bounds retries and
              // carries the replay coordinates (HEAD, base, reason) so a timed
              // out episode can be replaced from evidence instead of rerun.
              const attemptComment = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  attemptMarker,
                  'Automatic OpenCode conflict repair, attempt 1/1 for HEAD `' +
                    fresh.head.sha + '` (base `' + defaultBranch + '`, reason: ' +
                    reason + '). Scope is merge-conflict resolution only; ' +
                    'the repair merges the base into the PR branch and preserves ' +
                    'intent from both sides without redoing the original task.',
                ].join('\n'),
              });
              try {
                if (delegated) {
                  // Delegated: execution stays in the parent, so dispatch
                  // target-aware repair in the execution repository with the
                  // opaque child id (the repair workflow resolves the target
                  // via target_child_id). The exact-HEAD attempt marker and
                  // lock are preserved as this HEAD's single bounded attempt.
                  if (!targetChildId) {
                    core.setFailed(
                      'PR #' + prNumber +
                      ': delegated conflict repair requires target_child_id; ' +
                      'no target-aware dispatch was made for HEAD ' + fresh.head.sha +
                      ' (' + reason + ').'
                    );
                    return;
                  }
                  try {
                    await github.request(
                      'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                      {
                        owner: executionOwner,
                        repo: executionRepo,
                        workflow_id: 'continuum-pr-agent-repair.yml',
                        ref: defaultBranch,
                        inputs: {
                          pr_number: String(prNumber),
                          head_sha: fresh.head.sha,
                          target_child_id: targetChildId,
                        },
                      }
                    );
                  } catch (dispatchErr) {
                    const dispatchMessage = String(dispatchErr.message || dispatchErr);
                    const dispatchStatus = Number(dispatchErr.status || 0);
                    // Narrow input-rejection detection (mirrors recovery/wakeup):
                    // only a 422 naming the opaque target_child_id input means
                    // the repair workflow lacks the delegated selector. Any
                    // other 422 or message is a transient/payload failure and
                    // is rethrown for the outer cleanup; the marker/lock are
                    // removed there so recovery per #224 can reconcile a
                    // transient dispatch on its next wakeup.
                    const isMissingTargetInput =
                      dispatchStatus === 422 &&
                      /target_child_id/i.test(dispatchMessage);
                    if (isMissingTargetInput) {
                      throw new Error(
                        'PR #' + prNumber +
                        ': delegated conflict repair requires continuum-pr-agent-repair.yml ' +
                        'to declare a target_child_id input; refusing bare retry to preserve the delegated target: ' +
                        dispatchMessage
                      );
                    }
                    throw dispatchErr;
                  }
                  core.notice(
                    'PR #' + prNumber + ': dispatched delegated conflict repair via parent (' + reason + ').'
                  );
                  return;
                }
                await github.request(
                  'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                  {
                    owner,
                    repo,
                    workflow_id: 'continuum-opencode.yml',
                    ref: defaultBranch,
                    inputs: {
                      mode: 'resolve-conflict',
                      pr_number: String(prNumber),
                      head_ref: fresh.head.ref,
                      conflict_strategy: 'merge',
                      timeout_minutes: '60',
                    },
                  }
                );
                core.notice(
                  'PR #' + prNumber + ': dispatched OpenCode conflict repair (' + reason + ').'
                );
              } catch (err) {
                try {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: attemptComment.data.id,
                  });
                } catch (cleanupErr) {
                  core.warning(
                    'PR #' + prNumber +
                    ': failed to remove uncommitted conflict-attempt marker: ' +
                    (cleanupErr.message || cleanupErr)
                  );
                }
                await releaseConflictLock();
                throw err;
              }
            }

            async function syncFromMain(pr, reason) {
              const oldHead = pr.head.sha;
              try {
                await github.request(
                  'PUT /repos/{owner}/{repo}/pulls/{pull_number}/update-branch',
                  {
                    owner,
                    repo,
                    pull_number: prNumber,
                    expected_head_sha: oldHead,
                  }
                );
                core.notice(
                  'PR #' + prNumber +
                  ': synchronized merge-critical main delta (' + reason +
                  '); the new HEAD must pass fresh CI and a fresh full PR-Agent review.'
                );
                return true;
              } catch (err) {
                const fresh = await getPull();
                if (fresh.head.sha !== oldHead) {
                  core.notice(
                    'PR #' + prNumber +
                    ': head advanced during main sync; stale review will not be merged.'
                  );
                  return true;
                }
                const message = String(err.message || err);
                if (
                  err.status === 409 ||
                  /merge conflict|conflict|cannot be performed|not updateable/i.test(message)
                ) {
                  await dispatchConflictRepair(fresh, message);
                  return true;
                }
                throw err;
              }
            }

            let pr = await getPull();
            if (
              pr.state !== 'open' ||
              pr.draft ||
              !pr.head.repo ||
              pr.head.repo.full_name !== repoFullName
            ) {
              core.setFailed(
                'PR-Agent candidate is no longer an open non-draft same-repository PR.'
              );
              return;
            }
            if (pr.head.sha.toLowerCase() !== reviewedHead) {
              core.setFailed(
                'PR head moved (' + reviewedHead + ' -> ' + pr.head.sha +
                '); refusing to merge a stale result.'
              );
              return;
            }

            if (hasLabel(pr, AUTO_MERGE_BLOCK_LABEL)) {
              core.notice(
                'PR #' + prNumber + ': ' + AUTO_MERGE_BLOCK_LABEL +
                ' blocks automatic merge.'
              );
              return;
            }

            const initialGates = await currentHeadGates(pr);
            if (!initialGates.ok) {
              core.setFailed('PR #' + prNumber + ': ' + initialGates.reason + '.');
              return;
            }

            const mainSync = await mainSyncDecision(pr);
            if (mainSync.required) {
              core.notice(
                'PR #' + prNumber + ': main advanced in merge-critical files: ' +
                (mainSync.criticalFiles.join(', ') || mainSync.reason) + '.'
              );
              await syncFromMain(pr, mainSync.reason);
              return;
            }
            if (mainSync.reason === 'non-merge-critical-main-delta') {
              core.notice(
                'PR #' + prNumber +
                ': main advanced only in non-merge-critical files; preserving the reviewed HEAD.'
              );
            }

            pr = await getPull();
            if (
              pr.state !== 'open' ||
              pr.draft ||
              !pr.head.repo ||
              pr.head.repo.full_name !== repoFullName ||
              pr.head.sha.toLowerCase() !== reviewedHead ||
              hasLabel(pr, AUTO_MERGE_BLOCK_LABEL)
            ) {
              core.setFailed(
                'PR state changed during final PR-Agent revalidation; merge cancelled.'
              );
              return;
            }

            const finalSync = await mainSyncDecision(pr);
            if (finalSync.required) {
              core.notice(
                'PR #' + prNumber +
                ': merge-critical main delta appeared during final revalidation.'
              );
              await syncFromMain(pr, finalSync.reason);
              return;
            }

            const finalGates = await currentHeadGates(pr);
            if (!finalGates.ok) {
              core.setFailed(
                'PR #' + prNumber +
                ': gate changed during final revalidation: ' + finalGates.reason + '.'
              );
              return;
            }

            // Re-read after all asynchronous gate queries. Mergeability and
            // main delta from an older PR object are not authoritative here.
            pr = await getPull();
            if (
              pr.state !== 'open' ||
              pr.draft ||
              !pr.head.repo ||
              pr.head.repo.full_name !== repoFullName ||
              pr.head.sha.toLowerCase() !== reviewedHead ||
              hasLabel(pr, AUTO_MERGE_BLOCK_LABEL)
            ) {
              core.setFailed(
                'PR state changed immediately before merge; merge cancelled.'
              );
              return;
            }

            const preMergeSync = await mainSyncDecision(pr);
            if (preMergeSync.required) {
              core.notice(
                'PR #' + prNumber +
                ': merge-critical main delta appeared immediately before merge.'
              );
              await syncFromMain(pr, preMergeSync.reason);
              return;
            }
            const preMergeGates = await currentHeadGates(pr);
            if (!preMergeGates.ok) {
              core.setFailed(
                'PR #' + prNumber +
                ': gate changed immediately before merge: ' + preMergeGates.reason + '.'
              );
              return;
            }

            if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
              await dispatchConflictRepair(
                pr,
                'mergeable_state=' + pr.mergeable_state
              );
              return;
            }
            if (pr.mergeable === null) {
              core.notice(
                'PR #' + prNumber +
                ': GitHub mergeability is still being computed; waiting.'
              );
              return;
            }

            const conventionalTitle =
              /^(?:fix|feat|perf|refactor)(?:\([^)]*\))?!?:\s/i.test(pr.title)
                ? pr.title
                : 'fix: ' + pr.title;

            let mergeResponse;
            try {
              mergeResponse = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: conventionalTitle,
                sha: reviewedHead,
              });
            } catch (err) {
              const fresh = await getPull();
              if (fresh.head.sha.toLowerCase() !== reviewedHead) {
                core.setFailed(
                  'PR HEAD moved during atomic merge; stale reviewed HEAD was not merged.'
                );
                return;
              }
              const message = String(err.message || err);
              const isConflictMessage =
                /merge conflict|conflict|not mergeable|cannot be merged/i.test(message);
              if (err.status === 409 || isConflictMessage) {
                await dispatchConflictRepair(fresh, message);
                return;
              }
              if (err.status === 422) {
                core.setFailed(
                  'Atomic merge rejected with HTTP 422 without conflict evidence: ' +
                  message
                );
                return;
              }
              throw err;
            }
            const result = mergeResponse.data;

            if (!result.merged) {
              core.setFailed(
                'PR #' + prNumber +
                ': GitHub refused exact-head merge: ' +
                (result.message || 'unknown reason')
              );
              return;
            }

            core.notice(
              'PR #' + prNumber + ': merged exact reviewed HEAD ' +
              reviewedHead + '; merge commit ' + result.sha + '.'
            );

            for (const workflow of postMergeWakeups) {
              if (!/^[\w][\w.\-]*\.yml$/.test(workflow)) {
                core.warning('PR #' + prNumber + ': skipping invalid post-merge wakeup: ' + workflow);
                continue;
              }
              try {
                const dispatchParams = {
                  owner: executionOwner,
                  repo: executionRepo,
                  workflow_id: workflow,
                  ref: postMergeWakeupRef,
                };
                // Preserve the opaque delegated selection for the follow-up
                // run, mirroring the recovery dispatch. Local runs dispatch
                // bare to preserve the existing best-effort contract.
                if (targetChildId) {
                  dispatchParams.inputs = { target_child_id: targetChildId };
                }
                try {
                  await github.request(
                    'POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches',
                    dispatchParams
                  );
                } catch (dispatchErr) {
                  const dispatchMessage = String(dispatchErr.message || dispatchErr);
                  const dispatchStatus = Number(dispatchErr.status || 0);
                  // Narrow input-rejection detection: only a 422 whose
                  // message names the opaque input (or GitHub's
                  // unexpected/unknown-input wording) means the wakeup
                  // target does not accept target_child_id. Any other
                  // 422 (invalid ref, payload validation, or a message
                  // merely mentioning inputs) is rethrown verbatim so
                  // reviewers get the true remediation path.
                  const isInputRejection =
                    dispatchStatus === 422 &&
                    /(target_child_id|unexpected\s+inputs?|unknown\s+inputs?)/i.test(dispatchMessage);
                  if (dispatchParams.inputs && isInputRejection) {
                    // A delegated wakeup must never retry bare: a bare
                    // dispatch would wake the execution repository instead of
                    // the delegated child target. Fail closed so the missing
                    // post-merge chain is visible instead of a silent success.
                    throw new Error(
                      'PR #' + prNumber +
                      ': wakeup ' + workflow + ' does not accept target_child_id inputs; ' +
                      'refusing bare retry to preserve the delegated target: ' +
                      dispatchMessage
                    );
                  } else {
                    throw dispatchErr;
                  }
                }
                core.notice('Woke ' + workflow + ' at ' + postMergeWakeupRef + '.');
              } catch (err) {
                // Post-merge wakeup is best-effort: the merge already
                // succeeded, so a wakeup failure warns without failing the
                // merge run. A delegated wakeup is never retried bare: the
                // explicit refusal above surfaces here as a warning, never
                // as a parent-targeted dispatch.
                core.warning(
                  'PR #' + prNumber +
                  ': could not wake ' + workflow + ': ' + err.message
                );
              }
            }
