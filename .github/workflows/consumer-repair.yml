name: Continuum reusable repair controller

on:
  workflow_call:
    inputs:
      opencode_workflow:
        type: string
        required: false
        default: continuum-opencode.yml
      ci_workflow:
        type: string
        required: false
        default: CI

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  conflict:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Dispatch conflict repair when needed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || exit 0
          [[ "$HEAD_REF" == opencode/* ]] || exit 0

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > /tmp/pr.json
          MERGEABLE="$(jq -r '.mergeable_state // ""' /tmp/pr.json)"
          if [[ "$MERGEABLE" != "dirty" ]]; then
            echo "PR #$PR_NUMBER is not dirty; no conflict repair."
            exit 0
          fi

          LABEL="opencode-conflict-repair"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color B60205             --description "Continuum conflict repair in progress" 2>/dev/null || true

          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER"               --jq '.labels[].name' | grep -Fxq "$LABEL"; then
            echo "Conflict repair lock already exists."
          else
            gh issue edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"
          fi

          gh api --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches"             -f ref=main             -f "inputs[mode]=resolve-conflict"             -f "inputs[pr_number]=$PR_NUMBER"             -f "inputs[head_ref]=$HEAD_REF"

  ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow }}
      CI_WORKFLOW: ${{ inputs.ci_workflow }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Dispatch CI repair
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_NAME" == "$CI_WORKFLOW" ]] || exit 0

          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls"             -H "Accept: application/vnd.github+json"             --jq '[.[] | select(.state=="open" and (.head.ref|startswith("opencode/")))] | .[0].number // empty')"
          [[ -n "$pr" ]] || exit 0

          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')"
          LABEL="opencode-ci-repair"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color D93F0B             --description "Continuum CI repair in progress" 2>/dev/null || true

          if gh api "repos/$GITHUB_REPOSITORY/issues/$pr" --jq '.labels[].name' | grep -Fxq "$LABEL"; then
            echo "CI repair already dispatched for PR #$pr."
            exit 0
          fi
          gh issue edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"

          gh api --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches"             -f ref=main             -f "inputs[mode]=ci-fix"             -f "inputs[pr_number]=$pr"             -f "inputs[head_ref]=$head_ref"             -f "inputs[run_id]=$RUN_ID"
