name: Continuum reusable repair controller

on:
  workflow_call:
    inputs:
      opencode_workflow:
        type: string
        required: false
        default: continuum-opencode.yml
      ci_workflow:
        type: string
        required: false
        default: CI
      additional_blocking_workflows:
        description: "Comma-separated optional workflow names that are repairable when they run"
        type: string
        required: false
        default: ""
      scheduler_workflow:
        type: string
        required: false
        default: continuum-scheduler.yml
      max_attempts:
        type: number
        required: false
        default: 3
      repair_timeout_minutes:
        description: "Conflict-repair budget; repairs an existing change and stays independent of the task budget"
        type: number
        required: false
        default: 25
      repair_agent_timeout_seconds:
        description: "Hard cap on the single model call inside a conflict repair"
        type: number
        required: false
        default: 1200
    outputs:
      repair_budget_minutes:
        description: "The budget a conflict repair of an existing change is given"
        value: ${{ jobs.conflict-bounds.outputs.repair_budget_minutes }}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The repair budget is a policy constant, not a copy of one. Resolving it
  # through .github/scripts/conflict_repair.py keeps a single source of truth
  # so the bound that protects a finished change can never drift upward in one
  # workflow and not the other.
  conflict-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repair_budget_minutes: ${{ steps.bounds.outputs.task_timeout_minutes }}
      repair_agent_timeout_seconds: ${{ steps.bounds.outputs.repair_agent_timeout_seconds }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Load Continuum engine
        uses: kodmial/continuum/.github/actions/engine-path@39ca6dc798f2201390c8fdef0395157f588657ec
      - name: Resolve the repair budget
        id: bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/conflict_repair.py" plan --mode resolve-conflict

  issue-run-recovery:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SCHEDULER_WORKFLOW: ${{ inputs.scheduler_workflow }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
    steps:
      - name: Load Continuum engine
        uses: kodmial/continuum/.github/actions/engine-path@39ca6dc798f2201390c8fdef0395157f588657ec

      - name: Recover failed issue-mode OpenCode run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 0
          [[ "$MAX_ATTEMPTS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid max_attempts."; exit 1; }

          run_marker="<!-- continuum-opencode-run:$RUN_ID -->"
          infra_marker="<!-- continuum-infra-retry:"
          issue_number=""

          while read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$candidate/comments?per_page=100" \
              --jq '.[].body // ""' | grep -Fq "$run_marker"; then
              issue_number="$candidate"
              break
            fi
          done < <(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label "automation:in-progress" --limit 100 --json number --jq '.[].number'
          )

          # Repair-mode workflow_dispatch runs have no issue-run marker.
          [[ -n "$issue_number" ]] || exit 0

          open_pr="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | select(.head.ref | startswith("opencode/issue'"$issue_number"'-")) | .number' \
              | head -n 1
          )"
          if [[ -n "$open_pr" ]]; then
            echo "Usable open PR #$open_pr already owns issue #$issue_number; preserving its reservation."
            exit 0
          fi

          epoch="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue_number/events?per_page=100" \
              --jq '.[] | select(.event == "unlabeled" and .label.name == "automation:paused") | .created_at' \
              | sort | tail -n 1
          )"
          attempts="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
              --jq '.[] | select((.body // "") | contains("<!-- continuum-dispatch -->")) | .created_at' \
              | awk -v epoch="$epoch" 'epoch == "" || $0 >= epoch {count++} END {print count + 0}'
          )"
          infra_attempts="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
              --jq '.[] | select((.body // "") | contains("<!-- continuum-infra-retry:")) | .created_at' \
              | awk -v epoch="$epoch" 'epoch == "" || $0 >= epoch {count++} END {print count + 0}'
          )"

          failed_step="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[].steps[]? | select(.conclusion == "failure") | .name][0] // ""' \
              2>/dev/null || true
          )"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$RUNNER_TEMP/opencode-failed.log" 2>&1 || true
          python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/failure_retry.py" classify \
            --failed-step "$failed_step" \
            < "$RUNNER_TEMP/opencode-failed.log" \
            > "$RUNNER_TEMP/failure-class.env"
          # shellcheck disable=SC1090
          source "$RUNNER_TEMP/failure-class.env"

          if [[ "$failure_class" == "transient_infra" ]]; then
            if (( infra_attempts >= 8 )); then
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --body "Continuum OpenCode run $RUN_ID hit transient infrastructure again ($failure_code). The independent infrastructure retry budget of 8 is exhausted; the semantic attempt budget remains untouched."
              gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
                --add-label "automation:paused" \
                --remove-label "automation:in-progress" >/dev/null
              echo "Issue #$issue_number paused after 8 infrastructure retries; semantic attempts were not consumed."
              exit 0
            fi

            next_infra_attempt=$(( infra_attempts + 1 ))
            python3 "$CONTINUUM_ENGINE_ROOT/.github/scripts/failure_retry.py" schedule \
              --attempt "$next_infra_attempt" \
              --seed "consumer-issue-$issue_number-run-$RUN_ID-$failure_code" \
              > "$RUNNER_TEMP/infra-retry.env"
            # shellcheck disable=SC1090
            source "$RUNNER_TEMP/infra-retry.env"

            marker="<!-- continuum-infra-retry: attempt=$next_infra_attempt next_retry_at=$next_retry_at code=$failure_code run=$RUN_ID -->"
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf '%s\nContinuum OpenCode run %s failed in infrastructure (%s). Infrastructure retry %s/8 is eligible at %s; it does not consume the semantic attempt budget.' "$marker" "$RUN_ID" "$failure_code" "$next_infra_attempt" "$next_retry_at")"
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --remove-label "automation:in-progress" >/dev/null
            gh workflow run "$SCHEDULER_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
            echo "Released issue #$issue_number for infrastructure retry $next_infra_attempt/8 after $next_retry_at."
            exit 0
          fi

          semantic_attempts=$(( attempts - infra_attempts ))
          (( semantic_attempts < 0 )) && semantic_attempts=0
          gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --body "Continuum OpenCode run $RUN_ID ended with '$CONCLUSION' (class=$failure_class, code=$failure_code). Semantic attempts recorded: $semantic_attempts/$MAX_ATTEMPTS; infrastructure retries recorded: $infra_attempts/8."

          if (( semantic_attempts >= MAX_ATTEMPTS )); then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --add-label "automation:paused" \
              --remove-label "automation:in-progress" >/dev/null
            exit 0
          fi

          gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --remove-label "automation:in-progress" >/dev/null
          gh workflow run "$SCHEDULER_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main

  base-sync:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == inputs.ci_workflow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sync stale OpenCode branches to current base
        shell: bash
        env:
          # An env var, not an expression spliced into the script. The runner
          # substitutes `${{ }}` before the shell parses anything, so a value
          # carrying a quote is a syntax error at best and command injection at
          # worst -- in a step that already holds a write-capable token.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Unusable default branch."; exit 1; }
          base_branch="$DEFAULT_BRANCH"
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base_branch" --jq '.object.sha')"

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$base_branch&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | select(.head.ref | startswith("opencode/")) | "\(.number) \(.head.sha)"' |
          while read -r pr_number head_sha; do
            [[ -n "$pr_number" && -n "$head_sha" ]] || continue

            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_sha...$head_sha" --jq '.status')"
            if [[ "$status" == "ahead" || "$status" == "identical" ]]; then
              echo "PR #$pr_number already contains current $base_branch."
              continue
            fi

            echo "PR #$pr_number is $status against $base_branch; requesting native update-branch."
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/update-branch" \
              -f "expected_head_sha=$head_sha" >/dev/null; then
              echo "PR #$pr_number updated; synchronize will trigger fresh CI."
            else
              echo "::warning::PR #$pr_number could not be updated mechanically; conflict repair remains responsible."
            fi
          done

  conflict:
    needs: conflict-bounds
    if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow }}
      REPAIR_BUDGET_MINUTES: ${{ needs.conflict-bounds.outputs.repair_budget_minutes }}
      REPAIR_AGENT_TIMEOUT_SECONDS: ${{ needs.conflict-bounds.outputs.repair_agent_timeout_seconds }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Base branch only, read-only token: this is a pull_request_target job
          # and must never touch pull-request code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch conflict repair when needed
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || exit 0
          [[ "$HEAD_REF" == opencode/* ]] || exit 0

          # Rung 1 of the ladder, attempted here because it needs no checkout
          # and no agent credential. It is GitHub's own merge.
          if gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" \
            -f "expected_head_sha=$EXPECTED_HEAD_SHA" >/dev/null 2>&1; then
            echo "PR #$PR_NUMBER was updated mechanically; no repair dispatch is needed."
            exit 0
          fi

          # Rung 2 and 3 live in the agent workflow, which is told which rungs
          # are already exhausted. `rungs_ruled_out` is validated against a
          # closed allowlist of mechanical rungs, so a payload can never make
          # the repair re-execute the source issue.
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches" \
            -f ref=main \
            -f "inputs[mode]=resolve-conflict" \
            -f "inputs[pr_number]=$PR_NUMBER" \
            -f "inputs[head_ref]=$HEAD_REF" \
            -f "inputs[rungs_ruled_out]=update-branch" \
            -f "inputs[repair_timeout_minutes]=$REPAIR_BUDGET_MINUTES" \
            -f "inputs[repair_agent_timeout_seconds]=$REPAIR_AGENT_TIMEOUT_SECONDS"

  ci:
    # The lock released below is age-checked against the repair budget, so this
    # job needs the resolved budget. It is a policy constant, so it comes from
    # conflict-bounds rather than being spelled out again here -- a second copy
    # is a second number, and a second number drifts.
    needs: conflict-bounds
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success","failure","timed_out","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      OPENCODE_WORKFLOW: ${{ inputs.opencode_workflow }}
      REPAIR_BUDGET_MINUTES: ${{ needs.conflict-bounds.outputs.repair_budget_minutes }}
      CI_WORKFLOW: ${{ inputs.ci_workflow }}
      ADDITIONAL_BLOCKING_WORKFLOWS: ${{ inputs.additional_blocking_workflows }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Dispatch CI repair
        shell: bash
        run: |
          set -euo pipefail
          supported=false
          if [[ "$RUN_NAME" == "$CI_WORKFLOW" ]]; then
            supported=true
          else
            IFS=',' read -ra extra_workflows <<< "${ADDITIONAL_BLOCKING_WORKFLOWS:-}"
            for workflow in "${extra_workflows[@]}"; do
              workflow="$(xargs <<<"$workflow")"
              if [[ -n "$workflow" && "$RUN_NAME" == "$workflow" ]]; then
                supported=true
                break
              fi
            done
          fi
          [[ "$supported" == "true" ]] || exit 0

          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls"             -H "Accept: application/vnd.github+json"             --jq '[.[] | select(.state=="open" and (.head.ref|startswith("opencode/")))] | .[0].number // empty')"
          [[ -n "$pr" ]] || exit 0

          head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.ref')"
          gate_hash="$(printf '%s' "$RUN_NAME" | sha256sum | awk '{print substr($1,1,12)}')"
          LABEL="opencode-gate-repair-$gate_hash"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color D93F0B             --description "Continuum blocking-workflow repair in progress" 2>/dev/null || true

          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            gh issue edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
            echo "$RUN_NAME passed; repair lock cleared."
            exit 0
          fi

          # The label is a lock, and a lock with no release is a wedge. It was
          # cleared on success and on a successful repair push, but neither of
          # those happens when the dispatched repair is cancelled, times out, or
          # wedges itself: the label survives, every later failure re-enters
          # this step, sees the label, and exits. CI repair for that pull
          # request stops for good while the label sits there.
          #
          # So the lock carries an age. A repair that produced no new head
          # within the repair budget is not going to, and its absence of
          # progress is not evidence that it is still working. The attempt
          # budget bounds how often this can happen; the age is what stops one
          # abandoned attempt from suppressing every later one.
          LOCK_STALE=false
          if gh api "repos/$GITHUB_REPOSITORY/issues/$pr" --jq '.labels[].name' | grep -Fxq "$LABEL"; then
          # `gh api` has no `--arg`, so the label cannot be bound as a jq
          # variable. Splicing it into the filter instead would be the exact
          # expression-injection problem this file exists to avoid, so the
          # filter stays constant and the matching happens in the shell, where
          # the value is a literal operand rather than program text.
          # The loop reads from a redirect rather than a pipe so it runs in this
          # shell: a pipeline would put it in a subshell, and `LOCK_AT` set in
          # there would be gone by the time it is used.
          LOCK_AT=""
          while IFS=$'\t' read -r name at || [[ -n "$name$at" ]]; do
            # `read` returns non-zero on a final line with no terminator; the
            # `||` is what keeps that last record.
            [[ "$name" == "$LABEL" && -n "$at" ]] || continue
            LOCK_AT="$at"
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/timeline?per_page=100" \
              --jq '.[] | select(.event == "labeled") | [.label.name, (.created_at // "")] | @tsv'
          )
          AGE_MINUTES=""
          if [[ -n "$LOCK_AT" ]]; then
            AGE_MINUTES=$(( ( $(date -u +%s) - $(date -u -d "$LOCK_AT" +%s) ) / 60 ))
          fi
          AGE_MINUTES="${AGE_MINUTES:-0}"
          # An unreadable age reads as a held lock, not as a stale one: the
          # label is still there, and releasing a lock on no evidence would let
          # two repairs of one pull request run at once.
          echo "$RUN_NAME repair lock on PR #$pr is ${AGE_MINUTES}m old (budget ${REPAIR_BUDGET_MINUTES}m)."
            if [[ "$AGE_MINUTES" -ge "$REPAIR_BUDGET_MINUTES" ]]; then
              LOCK_STALE=true
              echo "::warning::Repair lock for $RUN_NAME on PR #$pr is stale; releasing it so a later failure can be repaired."
              gh issue edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" >/dev/null 2>&1 || true
            else
              echo "$RUN_NAME repair already dispatched for PR #$pr."
              exit 0
            fi
          fi
          # A stale repair lock is an expired lease, not a permanent failure
          # state. The bounded attempt budget controls retries; a durable
          # "repair failed" label would suppress future recovery of the same
          # head after an infrastructure failure.
          gh issue edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"

          gh api --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/$OPENCODE_WORKFLOW/dispatches"             -f ref=main             -f "inputs[mode]=ci-fix"             -f "inputs[pr_number]=$pr"             -f "inputs[head_ref]=$head_ref"             -f "inputs[run_id]=$RUN_ID"
