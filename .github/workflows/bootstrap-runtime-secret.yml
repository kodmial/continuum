name: Bootstrap runtime-lab secret public key

on:
  workflow_call:
    inputs:
      continuum_ref:
        description: Continuum revision supplying fallback scripts
        type: string
        default: main
        required: false

permissions:
  contents: read

jobs:
  fetch-public-key:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch runtime-lab Actions secrets public key
        env:
          GH_TOKEN: ${{ secrets.TAP_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/kodmial/runtime-lab/actions/secrets/public-key
