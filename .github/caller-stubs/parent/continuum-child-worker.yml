name: SubTask
run-name: "SubTask #${{ inputs.task_number }}"

on:
  workflow_dispatch:
    inputs:
      child_id:
        description: Configured child id
        required: true
        type: string
      task_number:
        description: Child task number
        required: true
        type: string
      image_digest:
        description: Per-profile prepared-image digest for this worker's runtime profile (falls back to vars.CONTINUUM_IMAGE_DIGEST when empty)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  worker:
    uses: kodmial/continuum/.github/workflows/continuum-consumer-child-worker.yml@main
    with:
      child_id: ${{ inputs.child_id }}
      task_number: ${{ inputs.task_number }}
      model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
      max_agent_passes: 4
      image_digest: ${{ inputs.image_digest || '' }}
      engine_ref: main
    secrets:
      CHILD_RUNTIME_TOKEN: ${{ secrets.TAP_PAT }}
