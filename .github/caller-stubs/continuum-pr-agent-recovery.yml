name: PR-Agent recovery

on:
  workflow_dispatch:
    inputs:
      target_child_id:
        description: Opaque verified child id for delegated PR-Agent recovery
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows:
      - CI
      - PR Agent (OpenCode backend)
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-pr-agent-recovery.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      # Bare passthrough: schedule, pull_request_target, and workflow_run
      # carry no dispatch inputs, so those runs pass empty here and the
      # reusable falls through to vars.CONTINUUM_PR_AGENT_TARGET_CHILD_ID
      # (then to the execution repository). Install this caller in each
      # child for local automatic recovery, or set that variable / dispatch
      # manually with an explicit id for centralized recovery.
      target_child_id: "${{ inputs.target_child_id }}"
