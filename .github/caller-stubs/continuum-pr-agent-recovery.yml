name: PR-Agent recovery

on:
  workflow_dispatch:
    inputs:
      max_executions:
        description: >-
          Total transient executions per exact PR/HEAD/operation (1..10,
          default 10). Empty falls back to vars.PR_AGENT_RECOVERY_MAX_EXECUTIONS.
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows:
      - CI
      - PR Agent (OpenCode backend)
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-pr-agent-recovery.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      max_executions: "${{ inputs.max_executions }}"
