name: Merge trusted release automation PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/release-automation-merge.yml@main
    secrets: inherit
    with:
      continuum_ref: main
