name: OpenCode agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      mode:
        description: "Invocation mode"
        required: true
        type: string
      pr_number:
        description: "Pull request number"
        required: false
        type: string
      head_ref:
        description: "Pull request head branch"
        required: false
        type: string
      review_id:
        description: "Source CodeRabbit review id"
        required: false
        type: string
      run_id:
        description: "Source failed workflow run id"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/opencode.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      mode: "${{ inputs.mode }}"
      pr_number: "${{ inputs.pr_number }}"
      head_ref: "${{ inputs.head_ref }}"
      review_id: "${{ inputs.review_id }}"
      run_id: "${{ inputs.run_id }}"
