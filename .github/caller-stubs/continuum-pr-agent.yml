name: PR Agent (OpenCode backend)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for a bounded PR-Agent retry
        required: false
        type: string
      expected_head_sha:
        description: Exact PR HEAD the retry is allowed to review
        required: false
        type: string
      retry_attempt:
        description: Bounded retry attempt number
        required: false
        default: '0'
        type: string
      retry_workflow:
        description: Caller workflow filename used for isolated PR-Agent retries
        required: false
        type: string
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: pr-agent-caller-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  call:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number) ||
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'ready_for_review') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.actor == github.repository_owner &&
       contains(github.event.comment.body, '/review'))
    uses: kodmial/continuum/.github/workflows/continuum-pr-agent.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      pr_number: "${{ inputs.pr_number }}"
      expected_head_sha: "${{ inputs.expected_head_sha }}"
      retry_attempt: "${{ inputs.retry_attempt }}"
      retry_workflow: "${{ inputs.retry_workflow }}"

