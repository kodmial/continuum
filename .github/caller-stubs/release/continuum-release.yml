name: Application release

# Opt-in caller for the Continuum release state machine.
#
# Installing this file is the opt-in. It is deliberately not part of the `core`
# set: a repository that installs core gets no release job. With no
# `release.targets` and no `release.hooks` in `.continuum.yml`, every run of this
# caller is a green no-op that reads no token and builds nothing.
#
# Pin the `uses:` line to the same audited Continuum commit as `continuum_ref`
# before adopting it. Keep this file thin: product build, sign, and verify
# commands belong to the consumer's hooks document, and publisher commands
# belong in `release.publishers`/`release.syncs` there.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit to release. Empty uses the dispatched ref's commit.
        required: false
        type: string
      version:
        description: Explicit version. Empty uses the configured version source.
        required: false
        type: string
      version_file:
        description: Repository-relative file carrying the version
        required: false
        type: string
      version_pattern:
        description: Pattern the version file must match. Empty uses the repository config.
        required: false
        type: string
      tag:
        description: Tag being released, when this dispatch is about a tag
        required: false
        type: string
      event:
        description: Release event to model (push, tag-push, workflow-dispatch, scheduled)
        required: false
        default: workflow-dispatch
        type: choice
        options:
          - workflow-dispatch
          - push
          - tag-push
          - release-pr-merged
          - scheduled
      hooks:
        description: Repository-relative release hooks document
        required: false
        type: string
      channel:
        description: Release channel
        required: false
        default: default
        type: string
      release_pr:
        description: Release pull request number, when this dispatch is about one
        required: false
        type: string
      required_checks:
        description: Comma- or space-separated checks that must be green on the exact commit
        required: false
        type: string
      require_review:
        description: Require an approval of the exact release commit
        required: false
        default: false
        type: boolean
      require_merged_pr:
        description: Require the named release pull request to be merged
        required: false
        default: false
        type: boolean
      notes_file:
        description: Repository-relative changelog used for release notes
        required: false
        default: CHANGELOG.md
        type: string
      tag_prefix:
        description: Prefix of the immutable release tag
        required: false
        default: v
        type: string
      no_github_release:
        description: Do not publish to GitHub Releases; a downstream hook must still exist
        required: false
        default: false
        type: boolean
      hook_secret_env:
        description: Secret environment names forwarded to hook commands
        required: false
        type: string
      default_branch:
        description: Branch a release may be cut from. Empty uses the repository default.
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-release.yml@main
    secrets: inherit
    with:
      source_sha: "${{ inputs.source_sha || github.sha }}"
      event: "${{ inputs.event || (github.ref_type == 'tag' && 'tag-push' || (github.event_name == 'push' && 'push' || 'workflow-dispatch')) }}"
      version: "${{ inputs.version }}"
      version_file: "${{ inputs.version_file }}"
      version_pattern: "${{ inputs.version_pattern }}"
      tag: "${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}"
      hooks: "${{ inputs.hooks }}"
      channel: "${{ inputs.channel || 'default' }}"
      release_pr: "${{ inputs.release_pr }}"
      required_checks: "${{ inputs.required_checks }}"
      require_review: ${{ inputs.require_review || false }}
      require_merged_pr: ${{ inputs.require_merged_pr || false }}
      notes_file: "${{ inputs.notes_file || 'CHANGELOG.md' }}"
      tag_prefix: "${{ inputs.tag_prefix || 'v' }}"
      no_github_release: ${{ inputs.no_github_release || false }}
      hook_secret_env: "${{ inputs.hook_secret_env }}"
      default_branch: "${{ inputs.default_branch }}"
      continuum_ref: "main"
