name: Auto-merge reviewed pull requests

on:
  # Successful PR CI explicitly dispatches this reconciler from
  # mark-ready-for-coderabbit. CodeRabbit status/review, finding-verdict
  # comments, and main pushes are additional event-driven wake-ups; no critical
  # transition depends on cron.
  pull_request_review:
    types: [submitted, dismissed]
  # A CodeRabbit finding verification (including semantic RESOLVED/UNRESOLVED)
  # is a lifecycle transition. Reconcile immediately instead of waiting for an
  # unrelated event or the safety-net cron.
  pull_request_review_comment:
    types: [created, edited]
  status:
  push:
    branches: [main]
  schedule:
    # Best-effort safety net only. All normal transitions have event hooks.
    # A scheduled run executes the exact same idempotent latest-state
    # reconciler, so overlap with an event-driven wake-up is harmless.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      post_merge_wakeups:
        description: >-
          Comma-separated workflow file names to wake after a successful merge.
          Leave empty (the default) to wake nothing.
        required: false
        type: string
      post_merge_wakeup_ref:
        description: Git ref the post-merge wake-ups are dispatched at
        required: false
        type: string
      # Optional knobs, declared here for the same reason the repair stub
      # declares its own: a stub may only forward an input it declares, and
      # each is empty by default so the engine falls through to the consumer's
      # `vars.` value rather than pinning one on every installed caller.
      coderabbit_retry_workflow:
        description: >-
          Workflow dispatched when a current head still needs its CodeRabbit
          review. Empty keeps the legacy default.
        required: false
        default: ''
        type: string
      coderabbit_unresolved_workflow:
        description: >-
          Workflow dispatched to reconcile a CodeRabbit unresolved-thread
          verdict. Empty keeps the legacy default.
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-auto-merge.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      post_merge_wakeups: "${{ inputs.post_merge_wakeups }}"
      post_merge_wakeup_ref: "${{ inputs.post_merge_wakeup_ref }}"
      coderabbit_retry_workflow: "${{ inputs.coderabbit_retry_workflow }}"
      coderabbit_unresolved_workflow: "${{ inputs.coderabbit_unresolved_workflow }}"
