name: CI

on:
  push:
    branches: [main]
    # A documentation-only merge does not need a macOS build on main.
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      continuum_ref: main
