name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: continuum-tech-swift-ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-ci.yml@main
    secrets: inherit
    with:
      continuum_ref: main
