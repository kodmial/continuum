name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/**'
      - 'Resources/**'
      - 'config.example.toml'
      - '.github/workflows/continuum-tech-swift-packaging-smoke.yml'
      - '.github/workflows/continuum-tech-swift-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 0.0.2 or v0.0.2). Leave empty to derive it
          from the consumer's CONTINUUM_VERSION_FILE.
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Only print what would be released — do not create a release or touch manifests.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

# Serialize release runs per ref: two releases racing on one tag or branch
# produce duplicate or conflicting tags and manifests. Cancellation is
# deliberately absent — a release that is already publishing must finish. The
# group name stays Continuum's own, so a shipped stub never carries a
# consumer's product name; the repository part keeps it unambiguous in the
# Actions UI.
concurrency:
  group: continuum-swift-release-${{ github.repository }}-${{ github.ref }}

jobs:
  call:
    uses: kodmial/continuum/.github/workflows/continuum-tech-swift-release.yml@main
    secrets: inherit
    with:
      continuum_ref: main
      native_prepare_command: "${{ vars.CONTINUUM_NATIVE_PREPARE_COMMAND || '' }}"
      static_archive_path: "${{ vars.CONTINUUM_STATIC_ARCHIVE_PATH || '' }}"
      version: "${{ inputs.version || '' }}"
      dry_run: "${{ inputs.dry_run || false }}"
