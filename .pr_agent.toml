# Provider-neutral PR-Agent defaults for Continuum (isolated PR-Agent stack).
#
# Pinned upstream: PR-Agent v0.46.0.
# Authoritative sources (v0.46.0):
# - usage-guide/automations_and_usage.md (review/improve tools, enable_output,
#   push triggers, publish_as_check_run)
# - tools/review.md, tools/improve.md
# - usage-guide/configuration_reference.md (native push outputs)
# - pr_reviewer_prompts.toml (PRReview schema: review.key_issues_to_review,
#   merge_recommendation, ticket compliance, security/risk fields)
# - configuration.toml (persistent_finding_state, persistent_inline_comments,
#   large-PR chunking, propagate_tool_errors)
# - installation/github.md (GitHub Action integration)
#
# The model below is a routing id, not a vendor pin: the `openai/` prefix
# sends the request through LiteLLM's OpenAI-compatible path to the backend
# configured in `[openai] api_base` (environment `OPENAI__API_BASE`), which
# the Continuum workflow points at the runner-local OpenCode bridge. The
# actual inference model is the configured OpenCode provider/model
# (vars.OPENCODE_MODEL), so no paid-provider key is ever required.
[config]
model = "openai/continuum-review"
fallback_models = ["openai/continuum-review"]
custom_model_max_tokens = 128000
reasoning_effort = "medium"
response_language = "en-US"
ai_timeout = 180
retry_same_model_on_timeout = false
propagate_tool_errors = true
persistent_inline_comments = true
repo_context_files = ["AGENTS.md"]

[openai]
api_base = "http://127.0.0.1:18000/v1"

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
require_risk_assessment = true
require_priority_files = true
require_merge_recommendation = true
require_ticket_analysis_review = true
publish_error_details = true
persistent_comment = true
final_update_message = false
persistent_finding_state = true
inline_key_issues = true
num_max_findings = 6
enable_review_coverage_footer = true
extra_instructions = """\
Focus on actionable correctness issues introduced by the PR: logic bugs, regressions,
race conditions, unsafe GitHub Actions behavior, security issues, error handling,
resource leaks, performance regressions, macOS compatibility, packaging/release
correctness, and test gaps. Verify findings against the actual diff and repository
context. Do not report cosmetic style preferences or speculative issues without a
concrete failure scenario. Large-PR reviews may be chunked: never infer that
implementation, tests, workflow wiring, or ticket requirements are missing merely
because a file or symbol is absent from the current review chunk. Report an actionable
finding or lower the merge recommendation only for a concrete defect evidenced by
code visible in the current chunk or repository context. If confirmation depends on
files outside the current chunk, place it under human verification instead.
"""
enable_large_pr_chunking = true
max_number_of_calls = 10

[pr_code_suggestions]
focus_only_on_problems = true
persistent_comment = true
publish_output_no_suggestions = false
suggestions_score_threshold = 7
num_code_suggestions_per_chunk = 4
max_suggestions_per_file = 0
max_number_of_calls = 3
enable_suggestions_coverage_footer = true
commitable_code_suggestions = false
extra_instructions = """\
Only suggest changes that fix a concrete bug, security issue, reliability problem,
performance regression, or meaningful maintainability risk. Avoid formatting-only
or subjective style suggestions.
"""

[push_outputs]
enable = true
channels = ["file"]
file_path = "pr-agent-outputs/continuum.jsonl"

[github]
publish_as_check_run = false

[github_action_config]
enable_output = true
fail_on_tool_errors = true
