name: Continuum PR-Agent review gate

# Reusable review provider adapter. This workflow is pure workflow_call: it
# refers only to its declared inputs and secrets, never to repository
# variables/secrets directly (credentials are never inherited, nothing is
# implicit). This is the ONLY review signal the Continuum merge controller
# consumes (commit status context named by .continuum.yml, description contract
# verdict=<STATE> provider=<p> head=<sha>).
#
# Callers wire their repository variables/secrets to these inputs, for example:
#
#   jobs:
#     review:
#       uses: kodmial/continuum/.github/workflows/pr-agent.yml@main
#       with:
#         pr_number: ${{ github.event.pull_request.number }}
#         api_base: ${{ vars.PR_AGENT_API_BASE }}
#         model: ${{ vars.PR_AGENT_MODEL }}
#         max_tokens: ${{ vars.PR_AGENT_MAX_TOKENS }}
#       secrets:
#         continuum_token: ${{ secrets.GITHUB_TOKEN }}
#         pr_agent_api_key: ${{ secrets.PR_AGENT_API_KEY }}
#
# Manual /review and /verify commands are handled by pr-agent-comment.yml in the
# Continuum repository (trusted-actor contract only).

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      head_sha:
        type: string
        required: false
      api_base:
        type: string
        required: true
      model:
        type: string
        required: true
      max_tokens:
        type: string
        required: false
      config:
        type: string
        required: false
        default: ".continuum.yml"
    secrets:
      continuum_token:
        required: true
      pr_agent_api_key:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: continuum-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.continuum_token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CONTINUUM_CONFIG: ${{ inputs.config }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_AGENT_API_KEY: ${{ secrets.pr_agent_api_key }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkout Continuum module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.action_repository }}
          ref: ${{ github.action_ref || github.sha }}
          path: _continuum

      - name: Corroborate provider configuration against the consumer config
        run: |
          set -euo pipefail
          PYTHONPATH=_continuum/src python3 -m continuum.cli config-check \
            --config "$CONTINUUM_CONFIG"

      - name: Resolve LiteLLM model routing
        id: model
        env:
          PR_AGENT_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_AGENT_MODEL:-}" ]]; then
            echo "::error::Missing model input (repository variable PR_AGENT_MODEL)"
            exit 1
          fi
          raw="$PR_AGENT_MODEL"
          case "$raw" in
            openai/*|text-completion-openai/*) routed="$raw" ;;
            *) routed="openai/$raw" ;;
          esac
          echo "model=$routed" >> "$GITHUB_OUTPUT"
          echo "Routing PR_AGENT_MODEL '$raw' as LiteLLM model '$routed'."

      - name: Synthesize pull_request event for pr-agent
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          event_file="${RUNNER_TEMP}/pr_event.json"
          cat > "$event_file" <<JSON
          {"action":"opened","number":${PR_NUMBER},"repository":{"owner":{"login":"${owner}"},"name":"${name}"},"pull_request":{}}
          JSON
          echo "GITHUB_EVENT_NAME=pull_request" >> "$GITHUB_ENV"
          echo "GITHUB_EVENT_PATH=${event_file}" >> "$GITHUB_ENV"

      - name: Run PR-Agent (full current-HEAD review)
        uses: docker://pragent/pr-agent:github_action@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # 0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.continuum_token }}
          # Generic OpenAI-compatible mapping. Switching providers/models only
          # requires changing the caller's api_base / model inputs and the
          # PR_AGENT_API_KEY secret. Both dotted and double-underscore forms are
          # set because PR-Agent/LiteLLM accept either spelling.
          OPENAI.KEY: ${{ secrets.pr_agent_api_key }}
          OPENAI.API_BASE: ${{ inputs.api_base }}
          OPENAI__KEY: ${{ secrets.pr_agent_api_key }}
          OPENAI__API_BASE: ${{ inputs.api_base }}
          OPENAI_API_KEY: ${{ secrets.pr_agent_api_key }}
          OPENAI_API_BASE: ${{ inputs.api_base }}
          CONFIG.MODEL: ${{ steps.model.outputs.model }}
          CONFIG.FALLBACK_MODELS: "[]"
          # Effective completion limit (PR-Agent reads config.max_output_tokens).
          # Fall back to 16000 when the optional input is unset so an empty
          # value never overrides the TOML default with 0 (no limit).
          CONFIG.MAX_OUTPUT_TOKENS: ${{ inputs.max_tokens || '16000' }}

      - name: Enforce review contract (tracker + verdict + status)
        id: gate
        run: |
          set -euo pipefail
          if [[ -n "${INPUTS_HEAD_SHA:-}" ]]; then
            PYTHONPATH=_continuum/src python3 -m continuum.cli gate \
              --pr "$PR_NUMBER" --head "$INPUTS_HEAD_SHA" --out gate-result.json
          else
            PYTHONPATH=_continuum/src python3 -m continuum.cli gate \
              --pr "$PR_NUMBER" --out gate-result.json
          fi
        env:
          INPUTS_HEAD_SHA: ${{ inputs.head_sha }}

    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      state: ${{ steps.gate.outputs.state }}
      gate_passed: ${{ steps.gate.outputs.gate_passed }}
      open_findings: ${{ steps.gate.outputs.open_findings }}
      head: ${{ steps.gate.outputs.head }}