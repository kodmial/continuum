# Continuum repository configuration.
#
# Validated by `python3 -m continuum.cli config-check` before any workflow runs.
# Values here are *names* of repository variables and secrets, never the
# endpoint, model, or credential itself: those stay in repository settings, so
# this file is safe to review in public and safe to log.

version: 1

review:
  # This repository runs its own automation, so it is not a consumer product and
  # declares no review traffic. The provider surfaces in
  # `.github/workflows/pr-agent.yml` and `.github/workflows/pr-agent-comment.yml`
  # are live and consumer-facing (#25); they stay silent here because this file
  # selects no provider, which is the zero-traffic opt-out the merge controller
  # also reads. A consumer selects `provider: pr-agent` instead, and names the
  # repository variables and secrets the provider is reached through:
  #
  #   pr_agent:
  #     api_base_var: PR_AGENT_API_BASE
  #     api_key_secret: PR_AGENT_API_KEY
  #     model_var: PR_AGENT_MODEL
  #     max_tokens_var: PR_AGENT_MAX_TOKENS
  provider: none

# Release targets are declared here but not yet run: no release workflow is
# active, and `.github/workflows/ci.yml` enforces an allowlist of workflow
# names. The block below is the shape a repository writes once the macOS
# signing job lands; it is commented out because this repository has no
# artifacts to sign and because `config-check` validates it either way.
#
# Sign a target:
#   continuum release plan --target macos            # what would happen
#   continuum release sign --target macos --signing-material present
#
# The two secrets are repository secrets, named by configuration so this file
# stays safe to review in public. The certificate is a self-signed code-signing
# identity whose name is the thing that must stay constant across releases:
# macOS keys microphone and accessibility permissions on the signing identity,
# so a release signed by anything else makes every user re-grant them.
#
# release:
#   targets:
#     - id: macos
#       adapter: apple
#       platform: macos
#       build_strategy: swiftpm
#       distribution: direct
#       architectures:
#         - x86_64
#         - arm64
#       universal: false
#       artifacts:
#         - tar.gz
#         - zip
#       # Hardened runtime is the protection the entitlement set is only
#       # meaningful under; it is not a free upgrade, so it is explicit.
#       hardened_runtime: true
#       publishers:
#         - homebrew
#         - macports
#       binaries:
#         - name: NanoDictateAgent
#           identifier: com.nanodictate.agent
#           entitlements: Resources/com.nanodictate.agent.entitlements
#       app_bundle:
#         name: NanoDictate.app
#         identifier: com.nanodictate.agent
#       signing:
#         mode: self-signed-stable
#         # The exact common name of the imported certificate. Continuum asserts
#         # it is the `Authority=` of everything it signs, and fails the release
#         # if it is not.
#         identity: "NanoDictate CI Signing"
#         p12_secret: NANODICTATE_SIGNING_P12
#         password_secret: NANODICTATE_SIGNING_PASSWORD
#         # No secure timestamp by default: a self-signed identity has no
#         # timestamp authority, and adding one later invalidates the checksums
#         # already published for the release.
#         timestamp: false
#         # A pull request from a fork has no access to the secrets. Set this
#         # only if a degraded, ad-hoc build is acceptable there: it is signed
#         # by nobody, so macOS will not preserve TCC permissions across the
#         # upgrade, and the plan says so loudly.
#         allow_adhoc_fallback: false
